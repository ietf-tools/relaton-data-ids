abstract:
- content: "<p>The System for Cross-domain Identity Management (SCIM) specifications
    are designed to make identity management in cloud-based applications and services
    easier. This document provides a platform-neutral schema for representing AI agents'
    identities in SCIM JSON format, enabling them to be transferred using the SCIM
    protocol between a client and service provider. This establishes an agentic identity
    so that an agent can subsequently be authenticated and authorized to interact
    with the service.</p>"

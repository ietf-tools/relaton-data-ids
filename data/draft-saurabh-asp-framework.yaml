abstract:
- content: "<p>This document specifies the Agent Settlement Protocol (ASP), an HTTPS
    and JSON-RPC application protocol for authorized execution of tasks by software
    agents in different administrative domains. ASP defines agent service discovery,
    certificate-bound task authorization, budget-limited recursive delegation, asynchronous
    execution, cryptographically signed usage records, and clearinghouse reconciliation.
    An Agent Clearinghouse (ACR) issues short-lived authorization tokens, reserves
    delegated budgets, receives Agent Detail Records (ADRs), and computes net obligations
    within a settlement window. ASP does not define a new URI scheme, a universal
    agent registry, or a payment rail. Its purpose is to make cross- domain agent
    execution and accounting interoperable while leaving the agents' internal models,
    tools, and business arrangements outside the protocol.</p>"

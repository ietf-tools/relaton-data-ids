abstract:
- content: "<p>This document specifies Cuback, an ACK-driven reformulation of CUBIC
    congestion control. It simplifies implementation by replacing CUBIC's mutable
    time- and ACK-driven state with pure functions over immutable per-epoch parameters,
    for which test vectors are provided. Congestion-window growth uses the same ACK-driven
    mechanism as Reno, removing several sources of implementation error. When entering
    a high-capacity path, a newcomer converges on its share sooner than under CUBIC,
    so short flows complete earlier.</p>"

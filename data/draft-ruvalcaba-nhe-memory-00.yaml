abstract:
- content: "<p>This document specifies two interoperability surfaces of the memory
    component of a Non-Human Entity (NHE). Part I defines a verifiable memory-record
    format: an integrity structure in which each record binds a hash of its own content
    and version-specific hashes of the prior records it references, so that tampering
    can be detected and localized on demand, per-record, without a linear chain, a
    Merkle tree, or distributed consensus. Part II defines a reconciliation protocol
    by which two divergent memory accumulations are merged without loss or forgery:
    a delta format, a reputation-weighted merge in which a contributed item enters
    at a confidence bounded by its contributor's reputation rather than its self-asserted
    value, and provenance that supports lineage-scoped rollback. The data models are
    specified here; the wire encodings are deferred to the next revision.</p>"

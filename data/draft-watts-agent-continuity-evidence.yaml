abstract:
- content: "<p>This document proposes an experimental, signed JSON statement and verification
    model for observing computational-agent continuity across sessions, instances
    and delegations. It distinguishes model, runtime, agent, grant and execution identifiers,
    retains predecessor evidence, and produces three-valued verification outcomes.
    Integrity of a record never implies permission to perform an action. This is not
    an OAuth token format or a claim of standardized identity ontology.</p>"

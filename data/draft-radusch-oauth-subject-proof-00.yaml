abstract:
- content: "<p>OAuth 2.0 Token Introspection (RFC 7662) and Token Revocation (RFC
    7009) recognize two kinds of caller: the client a token was issued to, and (for
    introspection) a protected resource the authorization server chooses to trust.
    Neither covers a common case: a client that acts for the end user and wants to
    see, or end, a grant that the same user gave to a different client, for example
    a user disconnecting one AI agent from inside a web application. This document
    defines a third kind of caller, the subject-proof caller. The caller presents
    a token that the authorization server issued to that same caller for the same
    end user. If the proof is valid and names the same subject as the target grant,
    the authorization server discloses the grant's delegation metadata at the introspection
    endpoint, or revokes exactly that one grant at the revocation endpoint.</p>"

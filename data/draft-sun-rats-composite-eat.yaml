abstract:
- content: "<p>This document defines an Entity Attestation Token (EAT) profile for
    composite platform attestation. A Lead Attester, such as a platform Root of Trust,
    produces a single signed composite EAT that carries its own measurements and cryptographic
    digests committing to detached, native evidence collected from peripheral sub-attesters.
    The full sub-attester evidence -- Security Protocol and Data Model (SPDM) signed
    measurements, device-emitted EATs, or SPDM-carried TCG DICE Concise Evidence --
    is conveyed verbatim as detached Claims-Sets in a Detached EAT Bundle. This yields
    a single, freshness-bound, platform-scoped attestation artifact that a Verifier
    can appraise against platform-composition endorsements, even when the evidence
    is collected and conveyed by an untrusted mediator.</p>"

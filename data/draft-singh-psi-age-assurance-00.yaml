abstract:
- content: <p>This document specifies PSI-Age, a privacy-preserving cryptographic
    attestation for age assurance. It enables a relying party (such as a social media
    platform or online service) to verify that a user meets a minimum age threshold
    without learning the user's identity, date of birth, or any other personal attribute.
    PSI-Age uses zero-knowledge range proofs over a committed birthdate to produce
    a compact, verifiable "age credential" that proves age &gt;= threshold without
    rev</p>

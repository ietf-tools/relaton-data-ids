abstract:
- content: <p>RACR (Recipient-Authorized Content Retrieval, pronounced "racer") is
    a federated protocol for exchanging recipient-authorized messages between portable
    identities. Stable decentralized identifiers let participants operate independently
    of their current hosting providers. RACR uses deterministic Concise Binary Object
    Representation (CBOR) and CBOR Object Signing and Encryption (COSE) for signed
    authorization records and message envelopes. A recipient provider validates authorization
    before retrieving a detached, digest-bound body from the sender provider. This
    document specifies the protocol architecture, grant-authorized delivery, and privacy
    boundaries.</p>

abstract:
- content: '<p>RFC 9172 Section 8.2.2 describes how a legitimate node can replace
    a source''s Block Integrity Block (BIB) with one made under its own key, and how
    an acceptor that only checks that a BIB "was generated by a legitimate user" accepts
    the result. This document specifies the acceptor-side condition that prevents
    this substitution in deployments with per-source keys: each required security
    service on a target block is bound to the security source that is authoritative
    for that block, and is not satisfied by a block from any other source, even an
    authorized one. It also clarifies that the primary block is bound to a payload
    only through the integrity scope of the payload''s own BIB, not through a separate
    BIB over the primary block.</p>'

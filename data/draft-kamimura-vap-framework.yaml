abstract:
- content: "<p>Automated decision-making systems, including AI and algorithmic systems
    in critical infrastructure, currently lack standardized mechanisms for producing
    provenance records that third parties can verify independently. Traditional logging
    approaches do not provide the cryptographic properties that regulatory examination,
    forensic investigation, and cross-organizational accountability depend on: detectability
    of alteration, detectability of omission after commitment, and attribution. This
    document describes the Verifiable AI Provenance Framework (VAP), an architectural
    framework that defines requirements for producing verifiable decision trails using
    existing IETF security technologies. VAP does not define new protocols or cryptographic
    primitives; rather, it provides an architectural coordination layer that enables
    domain-specific profiles to leverage Supply Chain Integrity, Transparency and
    Trust (SCITT), Remote Attestation Procedures (RATS), CBOR Object Signing and Encryption
    (COSE), and related IETF work in a consistent manner. VAP makes records auditable
    and attributable after the fact. It does not prevent, block, or intercept any
    system behaviour, and it does not warrant that any recorded decision was correct,
    fair, or safe. The detailed requirement set is maintained by the VeritasChain
    Standards Organization (VSO) as a separate specification; this document describes
    the architecture and its mapping to IETF work. This document is intended to frame
    the problem space and facilitate discussion about whether architectural coordination
    work is needed in this area.</p>"

abstract:
- content: "<p>This document specifies the Delay-Tolerant Payload Conditioning (DTPC)
    protocol. DTPC is an end-to-end, connectionless, expandable application service
    protocol designed to operate directly above the Bundle Protocol (BPv7). It provides
    transparent application data conditioning services across challenged networks,
    including controlled aggregation of Application Data Units (ADUs), application-
    specific elision, transmission-order tracking, end-to-end positive/ negative acknowledgments,
    and duplicate suppression. DTPC preserves the end-to-end principle across delay-tolerant
    networks where intermediate nodes execute store-and-forward operations.</p>"

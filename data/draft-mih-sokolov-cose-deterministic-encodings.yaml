abstract:
- content: "<p>A COSE Hash Envelope signs the digest of a preimage, not the preimage
    itself. A verifier that holds the content as a decoded value, such as a CBOR data
    item, rather than the bytes that were hashed has to encode the value again, and
    nothing in the Hash Envelope says how the producer encoded it. CBOR permits more
    than one encoding of the same data item, so a digest mismatch cannot tell a modified
    value from a value encoded another way. This document defines a COSE Hash Envelope
    protected-header parameter in which the producer states the deterministic encoding
    it applied. It defines one value, the integer 1, for the Core Deterministic Encoding
    Requirements of RFC 8949, and no encoding of its own; an application profile can
    identify another encoding by a URL. A verifier ignores a value that does not identify
    an encoding it implements.</p>"
  language:

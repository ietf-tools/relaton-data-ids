abstract:
- content: "<p>Participation in the IETF is by individuals. This document applies
    that principle now that software Agents can write and submit text. Each Identity
    belongs to one Human, and every Contribution has at least one accountable Human.
    Anonymous Contributions are not accepted, and no Human may use two Identities
    in the same piece of work. Reading the IETF's work requires no account or identification.
    Rough consensus is unchanged.</p>"

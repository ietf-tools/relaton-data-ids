abstract:
- content: "<p>This document surveys mechanisms for AI agent discovery being developed
    at the IETF, at AAIF, at 3GPP, and in open-source projects. It compares them by
    discovery model, scope, dynamism, cross-domain reach, and semantic capability.
    It identifies gaps, overlaps, and conflicts between the approaches to inform future
    standardization work.</p>"

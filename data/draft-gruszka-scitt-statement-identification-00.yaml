abstract:
- content: "<p>This document describes proposed requirements and test cases for identifying
    SCITT Signed Statements. It distinguishes reference matching from statement retrieval,
    signature verification, issuer authorization, and evidence of registration. It
    examines how alternative identification schemes treat changes to statement encodings
    and registration context. The requirements are input to technical discussion and
    do not represent working group consensus. This document does not define a common
    reference format, allocate a COSE header parameter, or establish a relationship
    vocabulary. Its examples illustrate selected properties rather than demonstrate
    interoperability between deployed transparency services.</p>"

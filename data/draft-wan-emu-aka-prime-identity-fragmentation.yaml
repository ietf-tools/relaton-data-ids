abstract:
- content: "<p>This document updates EAP-AKA’ (RFC 9048) by defining the use of the
    AT_FRAGMENT mechanism, as defined in I-D.ietf-emu-pqc-eapaka, for fragmentation
    of the AT_IDENTITY attribute. This update allows a peer to convey a large network
    access identifier, such as a Subscription Concealed Identifier (SUCI), during
    the EAP-AKA’ identity exchange when the encoded identity is too large to fit reliably
    in a single EAP packet. This is intended to support large SUCI values produced
    by post-quantum cryptographic concealment schemes, while preserving the existing
    EAP-AKA’ challenge and key derivation procedures.</p>"

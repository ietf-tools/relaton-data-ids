abstract:
- content: "<p>This document describes a proposed interoperable metadata record for
    scientific evidence, test calibration, falsification, provenance, and release
    classification. It distinguishes machine-verifiable integrity from scientific
    validity, ownership, and authorization. The design is a proposal and does not
    assert Internet standards consensus, new physical discoveries, or a completed
    patent review.</p>"

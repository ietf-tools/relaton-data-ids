abstract:
- content: "<p>This document describes the architecture of the Participant Relationship
    Protocol (PRP). PRP treats a relationship, rather than an address, route, transport
    connection, or identity alone, as the primary persistent context in which communication
    is authorized and continuity is evaluated. It separates relationships from the
    replaceable identities, sessions, trajectories, routes, paths, adjacencies, transports,
    and carriers that realize communication. PRP is independent of IP and of any other
    particular network-layer protocol. IP-based and non-IP carriers are optional realizations
    of the same relationship-centric architecture. The document defines terminology,
    architectural invariants, layering boundaries, security and privacy requirements,
    and criteria for evaluating relationship-centric protocol designs. It intentionally
    does not define a wire format, cryptographic suite, routing algorithm, carrier
    technology, deployment architecture, or IANA registry.</p>"

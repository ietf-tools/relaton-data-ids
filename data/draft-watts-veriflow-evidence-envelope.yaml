abstract:
- content: "<p>This document specifies an experimental, JSON-based evidence envelope
    for exchanging source-grounded computational assertions, including provenance,
    reproducible operation identifiers, evidence sufficiency, and explicit abstention
    when an answer is not supported. The envelope separates syntactic validity, source
    integrity, mathematical correctness, and empirical truth. This document does not
    standardize a general scientific inference engine or claim experimental superiority.</p>"

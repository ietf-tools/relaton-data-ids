abstract:
- content: "<p>This document defines the Compliance-Receipt HTTP response header field,
    a Structured Field that carries a reference to a Proof of Stateful Integrity (PSI)
    receipt for the response. The signature covers every security-relevant parameter.
    The header shows that the issuer sealed a digest of the response; despite its
    name it does not show that the response, or the service, complies with any law
    or policy.</p>"

abstract:
- content: "<p>This document specifies the Kernel Identity and Attestation (KIA) protocol
    for the Sovereign Object OS (SOOS) governance architecture. KIA defines the cryptographic
    identity of the GEC, the trust chain anchoring kernel authority from hardware
    root through operator root keypair to every signed Event Log entry, the GEC Manifest
    schema for runtime state attestation, and the Revocation Registry maintenance
    requirements. KIA is the Layer 0 signing and attestation component on which the
    audit trail guarantees of draft-sato-soos-gar, the mandate enforcement guarantees
    of draft-sato-soos-mjwt, and the multi-agent delegation chain of draft-sato-soos-mad
    all depend.</p>"

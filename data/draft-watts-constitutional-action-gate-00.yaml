abstract:
- content: "<p>This document proposes CAG-1, an experimental, constrained decision
    profile for authorizing agent-mediated consequential effects at an enforcement
    point. It preserves the distinction between authenticated identity, qualified
    evidence, delegated permission, action approval, current epoch, and execution.
    The profile defines a strict JSON context, exact-effect binding, delegation attenuation,
    three-valued decision semantics, a replay/epoch admission example, and a synthetic
    conformance corpus. An ALLOW decision is not a new credential and does not prove
    execution, legal authority, scientific truth, or global revocation closure. This
    text is an unsubmitted working candidate; independent interoperability and security
    verification remain open.</p>"

abstract:
- content: <p>Things have changed a great deal in the two decades since RFC 4086,
    "Randomness Requirements for Security," was published. In addition, as more IETF
    protocols use cryptography, the need for good-quality randomness has greatly increased.
    Copy from 4086? Discussion Venues This note is to be removed before publishing
    as an RFC. Source for this draft and an issue tracker can be found at https://github.com/richsalz/ietf-4086bis.</p>

abstract:
- content: "<p>The Cedulon core document reconciles an issuer's signed Spend Receipts
    against an authenticated extract of a payment rail and reports, over a declared
    population, that no settlement lacks a receipt and no settled receipt is absent
    from the rail. Money is the special case that document implements. This document
    defines a second population on the same reconciler. A Decision Record is signed
    by the party that decided whether an agent may act; an Effect Extract is an authenticated
    list of the effects that actually occurred on a channel. An allow must be matched
    by exactly one effect whose content hash the record named; a refusal must be matched
    by none. The Decision Record claim set, the Effect Extract shape, the points at
    which the reconciliation departs from the spend rules, the finding codes, and
    one media type are defined. This revision states that the binding compares content
    and reference and not the order of two clocks, corrects the boundary to two adjacent
    documents, and records the first reading of one frozen fixture by a second, independently
    written reader. The text is provisional; the companion implementation carrying
    this profile is published.</p>"

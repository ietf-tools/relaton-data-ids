abstract:
- content: <p>AI agents increasingly persist memory across sessions and treat that
    memory, on the next turn, as if it were their own prior experience. This document
    defines a benchmarking method that measures whether an agent's memory subsystem
    detects that its persisted memory has been altered, removed, reordered, replayed,
    or forged at the storage layer, and refuses to serve that memory or reports it
    before it is served. The method defines ten storage-level edits, three verdict
    classes, a detection-point distinction between read time and audit time, three
    control cases, and a scoring rule. It is a laboratory method for controlled, reproducible
    measurement, in the spirit of RFC 2544 and RFC 8239, and it is intended as a test
    method for the "Protection of Memory Data Integrity" metric under discussion in
    the Benchmarking &amp; Performance Measurements (BPM) Working Group. This revision,
    which replaces draft-khandelwal-bmwg-agent-memory- integrity-02, adds a tenth
    edit, in which the subsystem erases a record through its own interface and the
    adversary restores a copy of the store taken before that erasure, so that the
    method measures whether an erasure persists against a restored backup; it is the
    edit that undoes a right-to-erasure request. The method's results are reported
    as thirty-one rows on released memory subsystems, eighteen of which claim tamper
    evidence, with the new edit measured on seven of them, and the machine-readable
    record in which a result set is published so that an unrelated party can recompute
    it is described.</p>

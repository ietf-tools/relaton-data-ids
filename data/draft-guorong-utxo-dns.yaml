abstract:
- content: "<p>This document specifies a new DNS Data Resource Record (RRTYPE 260)
    for transporting opaque cryptographic pointers. The RDATA contains a CBOR-encoded
    endpoint identifier and an optional Verifiable Random Function (VRF) proof. This
    document prohibits apex usage and mandates the _utxo prefix.</p>"

abstract:
- content: "<p>The emergence of the Internet of Agents (IoA) introduces new requirements
    for interoperable collaboration among autonomous agents across heterogeneous networks,
    platforms, and administrative domains. Supporting such environments requires common
    understanding of infrastructure functions, collaboration mechanisms, semantic
    interaction, and trust-related concepts. This document defines terminology for
    networking infrastructure in IoA environments, with a focus on Dynamic Multi-agent
    Secured Collaboration (DMSC). The terminology defined in this document is intended
    to support consistent usage across DMSC-related architecture, framework, and protocol
    specifications.</p>"

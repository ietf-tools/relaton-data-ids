abstract:
- content: "<p>This document defines the Correctover Conformance Shape (CCS), a runtime
    verification framework for AI agent tool calls. CCS specifies seven verification
    dimensions (Structure, Schema, Latency, Cost, Identity, Integrity, Security) that
    tool calls and results must conform to at runtime. The framework defines a receipt
    format with Ed25519 signatures, three verdict values (allow, deny, escalate) and
    four executor lifecycle states (confirmed, dispatched, indeterminate, unknown),
    and normative requirements for implementations. This revision promotes AEB and
    CAID to Normative References, specifies the detached Ed25519 signature construction
    over RFC 8785 canonical JSON, clarifies receipt lifecycle and signing-algorithm
    conformance, and documents two independent interoperable implementations (Section
    21).</p>"

abstract:
- content: "<p>Autonomous AI agents operating over Model Context Protocol (MCP) and
    Agent-to-Agent (A2A) transports routinely ingest untrusted external data (emails,
    web documents, retrieved RAG chunks) into the same inference context that authorizes
    privileged control-plane tool calls. Existing workload identity and token standards
    (OAuth 2.1, GNAP, WIMSE Wit/Wpt tokens) bind client identity and authorization
    scope, but fail to cryptographically bind the provenance taint of the data-plane
    context that induced the tool invocation, leaving systems vulnerable to indirect
    prompt-injection confused-deputy attacks. This document specifies a deterministic
    COSE_Sign1 and JSON Canonicalization Scheme (JCS, RFC 8785) wire profile that
    attaches a cryptographic Context Taint Attestation (CTA) header to every control-plane
    tool invocation, forcing relying parties to fail closed when an untrusted or mixed
    data-plane context attempts to trigger a state-mutating action without an independent
    out-of-band human or policy approval receipt.</p>"

abstract:
- content: "<p>This document specifies the CRP-Safety-Policy directive language —
    a declarative policy syntax for expressing AI safety requirements at the transport
    layer. The directive language is modelled after HTTP Content-Security-Policy (CSP)
    as defined in W3C CSP Level 3. It allows clients to declare what AI output characteristics
    are trusted, what risk levels trigger enforcement actions, and where violations
    should be reported. The CRP gateway enforces these policies on every AI response
    before delivery to the client. This document defines the complete directive grammar,
    enforcement semantics, violation reporting, and policy inheritance in multi-agent
    chains.</p>"

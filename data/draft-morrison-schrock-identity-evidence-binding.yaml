abstract:
- content: "<p>This document profiles how a relying party uses external identity evidence
    when it admits a consequential action, without that evidence ever standing in
    for permission. It defines two separate assertions, approver enrollment and payee
    destination binding, an authenticated binding from the exact evidence bytes to
    the action they support, offline status evidence with a freshness bound the relying
    party chooses, and the refusals that follow when any of it is missing. It applies
    to the pre-execution Authorization Bundle of EP Authorization Receipts and to
    the Command Authority Envelope for operational technology, and through the action
    digest to the Binding Moment Envelope.</p>"

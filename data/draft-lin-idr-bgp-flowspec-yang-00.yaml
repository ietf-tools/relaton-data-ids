abstract:
- content: "<p>This document defines a YANG data model for the BGP Flow Specification
    (Flowspec) address families (RFC8955 and RFC8956). The model augments the BGP
    YANG model to add the IPv4 Flow Specification (AFI, SAFI = 1, 133) and IPv6 Flow
    Specification (AFI, SAFI = 2, 133) address families, including Flowspec-specific
    configuration, the Flow Specification RIB, and per-neighbor Adj-RIBs.</p>"

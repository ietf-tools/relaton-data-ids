abstract:
- content: "<p>The Lightweight Authenticated Key Exchange (LAKE) protocol requires
    certain parameters to be agreed out-of-band, in order to ensure its successful
    completion. To this end, application profiles specify the intended use of LAKE
    to allow for the relevant processing and verifications to be made. In order to
    ensure the applicability of such parameters and information beyond transport-
    or setup-specific scenarios, this document defines a canonical, CBOR-based representation
    that can be used to describe, distribute, and store LAKE application profiles.
    Furthermore, in order to facilitate interoperability between LAKE implementations
    and support LAKE extensibility for additional integrations, this document defines
    a number of means to coordinate the use of LAKE application profiles. Finally,
    this document defines a set of well-known LAKE application profiles.</p>"

abstract:
- content: "<p>Oblivious HTTP (OHTTP) is a protocol for forwarding encrypted HTTP
    messages. It does not provide Perfect Forward Secrecy (PFS). Chunked OHTTP expands
    OHTTP to be suitable for longer-lived streams, but still does not offer PFS. Combined,
    this is leading sensitive traffic to de deployed at scale without PFS. This document
    proposes a solution.</p>"

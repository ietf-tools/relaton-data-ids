abstract:
- content: "<p>This document defines OAuth Actor-Signed Hop Proofs, an optional companion
    to the OAuth Actor Profile for Delegation. Each proof is a signed JSON Web Token
    (JWT) recording an actor's participation and authorized target for one hop. The
    actor_proofs claim carries a hash-linked chain verified through trusted actor-key
    sources. This document specifies proof conveyance, validation, optional links
    to Actor Receipts, metadata parameters, and introspection response members.</p>"

abstract:
- content: "<p>This document defines a scheduler-facing metadata model for High Performance
    Computing (HPC) and AI workloads. The model captures common job, workload, scheduler,
    tenant, timing, and task metadata that can be mapped from heterogeneous workload
    managers and orchestration platforms and used as context for network service intent.</p>"

abstract:
- content: "<p>This document records a comparative mapping of two evidence layers
    for cross-organization AI agent delegation: a per-hop delegation chain (PEDIGREE)
    and a named-human authorization root (the EMILIA Protocol binding and evidence-graph
    drafts), evaluated against the nine requirements of draft-reece-wimse-cross-org-delegation
    under a no-shared-operator assumption. It also records a verifier-facing composition
    model in which key possession, delegated authority, and pre-execution human authorization
    are diagnostically separate inputs with independent failure behavior, joined by
    action digest. The mapping was developed on the WIMSE mailing list; corrections
    continue there.</p>"

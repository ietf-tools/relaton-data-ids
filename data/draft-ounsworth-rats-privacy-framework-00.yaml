abstract:
- content: <p>This document extends the RATS Architecture to consider "coercive uses
    of RATS" where a malicious Verifier or Relying Party uses RATS protocols to extract
    sensitive information from an Attester or a victim Verifier that it would not
    otherwise be inclined to disclose. This over-disclosure can include revealing
    sensitive measurements, stable identifiers, device fingerprints, vendor information,
    or conclusions derived from Evidence. This document defines a privacy framework
    for Remote Attestation that identifies this threat surfaces; classifies claims
    produced by Attesters and Presenters; restricts sensitive Evidence disclosure
    to authorized Trusted Verifiers using confidentiality protection; and describes
    privacy- preserving Attestation Results based on data minimization, Selective
    Disclosure, and Zero-Knowledge Proofs.</p>

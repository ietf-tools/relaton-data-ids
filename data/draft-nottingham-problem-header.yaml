abstract:
- content: "<p>This specification defines the Problem-Details HTTP header field, which
    carries a problem details object (RFC 9457) as a Structured Field. Because the
    Structured Fields data model is more constrained than JSON's, it also defines
    a profile that problem types can opt into so that they can be serialised as a
    header.</p>"

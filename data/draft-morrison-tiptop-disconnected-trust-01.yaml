abstract:
- content: "<p>The architecture document for IP in deep space says that security designs
    must tolerate long validation delays and potentially operate in a disconnected
    trust model, and it does not say what that model is. This document defines it.
    A disconnected trust model is one in which a node makes each trust decision from
    data it already holds or is handed with the request, each item verifiable without
    asking a third party, with a declared limit on how old each kind of held data
    may be. The document then asks what a node may do alone when it cannot reach an
    authority, and lists the requirements any answer must meet. It leaves short credential
    lifetime, as the answer to revocation without contact, with the documents that
    already give it. On the direction of failure, it adds that an authority check
    that cannot be evaluated fails closed on authority and never on safety. It also
    asks that a node's record of its decisions can outlive the node, and that any
    reason kept with the record be read only on a stated claim. It specifies no protocol
    and no mechanism.</p>"

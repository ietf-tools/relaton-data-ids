abstract:
- content: "<p>The Reilly EternaMark (REM) Protocol defines a dual-layer method for
    digital permanence through the integration of Digital Object Identifiers (DOIs)
    and blockchain timestamping. The protocol ensures digital artifacts are permanently
    identifiable, immutable, and verifiable for both present and future use. Revision
    -01 extended the -00 specification with a formal REM Record structure, a machine-readable
    artifact manifest format, a verification procedure, implementation guidance, and
    expanded security and interoperability considerations. This revision (-02) additionally
    documents the protocol's function as a prior art record system under 35 U.S.C.
    102(a)(1): a Full REM Record establishes that a publicly deposited artifact was
    available to the public in its exact recorded form no later than a cryptographically
    verifiable date, enabling its use as defensive publication against later-filed
    patent claims.</p>"

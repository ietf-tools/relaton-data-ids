abstract:
- content: "<p>This document specifies a framework and associated protocol extensions
    for dynamic routing risk propagation and automated mitigation in BGP networks.
    Building upon Resource Public Key Infrastructure (RPKI) Route Origin Validation
    (ROV), this specification defines mechanisms to associate abnormal or hijacked
    routes with related routing entities (e.g., ASes or BGP peers) to dynamically
    depreference associated paths. Furthermore, it introduces extensions to the RPKI-to-Router
    (RTR) protocol and BGP Path Attributes to feedback, distribute, and signal ROA
    risk indicators across Relying Parties (RPs) and BGP Routers, enabling proactive
    and coordinated threat mitigation across network boundaries.</p>"

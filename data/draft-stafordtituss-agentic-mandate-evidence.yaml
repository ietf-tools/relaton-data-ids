abstract:
- content: "<p>The AUDIT architecture defines records that capture the user's intent,
    delegation, authorization state, and the actions that agents take across trust
    boundaries. Records alone don't answer the question an auditor, an operator, or
    a relying party asks next: did what was executed stay within the authority the
    user delegated? This document defines a deterministic, three-valued evaluation
    over such records. The outcomes are preserved, violated, and unresolved. A violated
    outcome names the invariant that was broken and the party whose own signed record
    departed from authority first. An unresolved outcome names the evidence that is
    missing; missing evidence is never treated as success. The document also defines
    the claim model the evaluation needs, the roles permitted to sign each record,
    a signed statement of what a call did or did not execute, a portable verdict record,
    a mapping onto the AUDIT record types, and interoperable test vectors. It is derived
    from the Agentic Mandate Evidence Protocol (AMEP).</p>"

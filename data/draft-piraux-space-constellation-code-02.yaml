abstract:
- content: "<p>When considering a satellite constellation forming a non-terrestrial
    network, the characteristics of this constellation heavily influence the network
    topology it forms. To improve the analysis of such non- terrestrial networks across
    various tools developed by the network community, this document defines a constellation
    code to describe common orbital shell patterns, and specification formats to describe
    inter-satellite link topologies and ground stations, covering the Core and Ground
    Networks of a constellation. In addition, this document may serve as an introduction
    to satellite constellations for IETF participants.</p>"

abstract:
- content: <p>DomainKeys Identified Mail v2 (DKIM2) requires any modifications made
    to email messages by intermediaries to be recorded in "recipes". Some originators
    wish to request that only very limited modifications be made to their messages
    so that the recipient of the message can have some assurance that the modifications
    were benign. This document introduces the CanModify header field into which originator
    requests may be placed. It then sets out a small set of modifications that are
    commonly applied by intermediaries and assesses how benign they may actually be.</p>

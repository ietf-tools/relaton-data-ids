abstract:
- content: "<p>This document specifies Deterministic Intent Verification (DIV), a
    transport-independent format for signed action approvals and their offline verification.
    A relying party reconstructs the signed payload from its expected execution parameters,
    verifies witnesses against locally selected trust anchors, and checks the signed
    approval requirement against any locally configured approval policy. The specification
    covers ordinary approvals, offline approvals, delegation, agent authority, and
    platform hash-only intents. Cryptographic verification is stateless; enforcing
    single-use execution requires stateful nonce redemption. A valid signature establishes
    approval of the signed bytes under the selected trust policy, not execution of
    the action or the approver's understanding of it.</p>"

abstract:
- content: "<p>This document defines mouth-to-ear response latency (MRL), a performance
    metric for conversational voice systems, together with an active method for measuring
    it at the RTP reference point of the calling endpoint. MRL is the interval between
    the transmission of the final speech sample of a caller's utterance and the arrival
    of the first sample of the system's response audio. Two variants are defined,
    one taken at packet arrival and one taken behind a de-jitter buffer of stated
    target depth. The method is specified so that both timestamps are drawn from a
    single clock on a single host, so that the metric requires no synchronisation
    between the measuring endpoint and the system under test. Requirements for stimulus
    material, capture content, quality control, calibration and reporting are given.</p>"

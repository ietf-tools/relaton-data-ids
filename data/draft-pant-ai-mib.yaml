abstract:
- content: "<p>The rapid proliferation of Artificial Intelligence (AI) and Graphics
    Processing Unit (GPU) infrastructure within telecommunications networks has exposed
    a fundamental gap in existing network management frameworks. The Simple Network
    Management Protocol (SNMP), the de facto standard for network element monitoring
    since RFC 1157 (1990), provides no native support for monitoring AI accelerators,
    GPU clusters, high-bandwidth interconnects such as NVLink and InfiniBand, or AI
    workload telemetry. This document proposes AI-MIB: a Management Information Base
    extension that defines a standardised Object Identifier (OID) tree for AI infrastructure
    management within the SNMP framework. AI-MIB is designed to operate alongside
    existing Operations Support Systems and Business Support Systems (OSS/BSS) in
    telecommunications environments, preserving backward compatibility with SNMPv3
    while extending the framework's scope to cover GPU health, accelerator interconnect
    metrics, AI workload performance indicators, and energy consumption. This document
    also outlines two future extensions: a subscription-based streaming capability
    for SNMPv3 (informally designated SNMPv3+), and a schema-mapping specification
    for a SNMP-gNMI Translation Gateway that bridges SNMP/ MIB and gNMI/YANG data
    models.</p>"

abstract:
- content: "<p>This document profiles the WIMSE HTTP Message Signatures mechanism
    ([I-D.ietf-wimse-http-signature]) to protect a request that passes through a chain
    of workloads. In the base mechanism each workload signs independently: an intermediary
    can remove a signature undetected, and the signatures accumulate on every hop.
    This document combines the workloads' signatures into one aggregate signature.
    Removal of a signature becomes detectable, and the signature material no longer
    grows with the length of the chain, a significant saving for post-quantum signature
    algorithms, whose signatures are large. The mechanism works with any aggregate
    signature scheme.</p>"

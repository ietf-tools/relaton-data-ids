abstract:
- content: "<p>A vCon is a container for data and information relating to a conversation.
    This document defines an extension to the JSON vCon schema for recording the policy
    decisions of AI agents and their invocation of tools. Before an agent performs
    an operation, the agent or its host uses policy to decide whether the operation
    is allowed, disallowed or requires permission. This document defines an Event
    Object type for those decisions, and Event Object types for each step of a tool
    invocation. It also outlines requirements for recording requests for permission
    and direction, which need to be defined in a future document.</p>"

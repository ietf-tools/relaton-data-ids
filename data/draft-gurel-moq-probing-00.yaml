abstract:
- content: "<p>This document defines probe tracks for Media over QUIC Transport (MOQT):
    tracks of synthetic objects, generated on demand, that measure the bandwidth of
    a single hop. Probe tracks live under reserved, session-scoped Track Namespaces
    and are never forwarded or cached. The track name selects the shape of the probe:
    target bitrate, duration or size, object rate, object size, group structure and
    key-object bursts. For a downlink probe, a subscriber subscribes to a probe track
    in the namespace (.session,.probe), and the relay generates it, so the subscriber
    can measure whether a higher bitrate is sustainable on the relay-to-subscriber
    hop before it switches to a higher-quality track. For an uplink probe, a publisher
    generates a probe track and publishes it to its relay in the namespace (.session,.sink),
    to measure the publisher-to-relay hop.</p>"

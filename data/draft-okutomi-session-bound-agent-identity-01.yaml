abstract:
- content: "<p>This document defines a verifier-side profile for accepting agent identity.
    A verifier accepts an Agent only when an authority statement, holder-of-key proof,
    accepted TLS session, freshness state, any required attestation result, and verifier-local
    policy all describe the same intended interaction. The profile does not define
    a TLS extension, attestation evidence format, identity provider, wallet format,
    registry, control plane, gateway, or application protocol. It composes existing
    mechanisms and defines the fail-closed acceptance rule between them.</p>"

abstract:
- content: "<p>Autonomous System Provider Authorization (ASPA) provides a Resource
    Public Key Infrastructure (RPKI)-based mechanism for verifying the Border Gateway
    Protocol (BGP) AS_PATH attribute to detect route leaks and certain forms of AS_PATH
    manipulation. The performance of ASPA- based AS_PATH verification depends on several
    factors, including the size and structure of ASPA data, AS_PATH characteristics,
    verification procedures, and the interaction between ASPA updates and BGP routing
    operations. This document defines a benchmarking methodology for evaluating ASPA
    verification implementations on routing devices. The methodology specifies controlled
    test conditions and procedures for measuring ASPA data processing, AS_PATH verification
    performance, route revalidation, BGP convergence, scalability, and resource utilization.
    The objective is to provide repeatable and comparable measurements that characterize
    the performance and operational behavior of ASPA verification under varying conditions.</p>"

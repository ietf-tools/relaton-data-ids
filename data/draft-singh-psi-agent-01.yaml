abstract:
- content: "<p>This document defines a profile of Proof of Stateful Integrity (PSI)
    for recording actions taken by software agents, including calls to language models
    and tools. The agent runtime computes a digest of each action locally and seals
    only the digest, so later alteration or omission of a recorded action is detectable.
    A receipt shows that a specific action record existed unchanged at a time; it
    does not show that the action was correct, safe, authorised, or lawful, and it
    allocates no liability. This revision withdraws the liability-allocation language
    of revision 00 and aligns the Merkle commitment with draft-singh-psi-merkle-01.</p>"

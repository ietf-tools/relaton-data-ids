abstract:
- content: "<p>This document specifies Walled Private Network (WPN) as a technology-
    neutral profile for a private IP network or network service. A conforming WPN
    has an explicitly defined address space, explicit membership, end-to-end preservation
    of member addresses without Network Address Translation between members, and protocol-transparent
    IP connectivity among authorized members. A WPN does not provide general-purpose
    Internet egress as part of the WPN service. The public Internet or another shared
    network may nevertheless be used as an underlay. Networks located behind individual
    members are outside the base WPN service and may be interconnected by mechanisms
    configured independently by those members. The purpose of this specification is
    to assign one unambiguous term to this complete set of service properties. It
    does not define a new tunneling, routing, or cryptographic protocol, and use of
    a VPN or tunnel is not required for WPN conformance.</p>"

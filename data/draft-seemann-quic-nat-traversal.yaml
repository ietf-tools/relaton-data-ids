abstract:
- content: "<p>This document specifies a QUIC extension for traversing Network Address
    Translators (NATs). Endpoints use an existing proxied QUIC connection to coordinate
    path validation attempts that create the NAT bindings needed for a direct path
    and test its connectivity. Application data can be exchanged over the proxied
    path while NAT traversal is in progress. Once a suitable direct path has been
    validated, the connection can migrate to it.</p>"

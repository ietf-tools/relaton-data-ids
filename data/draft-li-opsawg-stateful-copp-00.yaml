abstract:
- content: "<p>Control Plane Policing (CoPP), as described in RFC 6192, classifies
    control-plane-destined traffic using static packet header fields. This static
    classification cannot distinguish legitimate protocol traffic from attack traffic
    that matches the same header-based rules. This document specifies Stateful CoPP,
    an operational practice in which the router's runtime protocol state -- including
    configured peer identities, session state, and expected ingress interfaces --
    is incorporated into CoPP classification. Stateful CoPP allows confirmed legitimate
    traffic to receive preferential access to control plane CPU resources under attack
    conditions.</p>"

abstract:
- content: "<p>This document defines the DigitalID specification for the Secured Digital
    Lifecycle Protocol (SDLP). The DigitalID is the foundational identity construct
    for all SDLP-governed objects, providing deterministic uniqueness, lineage preservation,
    collision elimination, and stable identity bindings across all compliant implementations.
    This document updates and formalizes the DigitalID structure, canonical encoding
    rules, lineage grammar, identity assignment requirements, collision model, and
    validation rules originally introduced in draft-norton-sdlp-identity-00.</p>"

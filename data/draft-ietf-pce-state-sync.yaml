docid:
- id: draft-ietf-pce-state-sync
  type: Internet-Draft
  primary: true
abstract:
- content: "<p>The Path Computation Element (PCE) Communication Protocol (PCEP) provides
    mechanisms for PCEs to perform path computation in response to a Path Computation
    Client (PCC) request. The stateful PCE extensions allow a PCE to maintain and
    control the state of Label Switched Paths (LSPs) using PCEP, independent of the
    path setup type used. A PCC can synchronize LSP state information to a stateful
    PCE, and can have PCEP sessions toward multiple PCEs. In some deployments, synchronizing
    LSP state directly between the stateful PCEs brings additional resiliency, for
    instance when a PCC-PCE session fails, and allows a single PCE to compute paths
    for a set of LSPs that are dependent on each other even when those LSPs are delegated
    to different PCEs. This document describes procedures for synchronizing LSP state
    between stateful PCEs across various deployment scenarios and for preventing computation
    loops. It is published as Experimental to gather implementation and deployment
    experience.</p>"
  language:
  - en
  script:
  - Latn
  format: text/html

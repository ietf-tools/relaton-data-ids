abstract:
- content: "<p>This document defines IP Flow Information Export (IPFIX) Information
    Elements and export profiles for QUIC packet, header, frame, aggregate, and connection
    observations. It distinguishes wire- visible information from values requiring
    version-specific parsing, packet-protection processing, or endpoint state, and
    reports observation provenance, processing outcome, and export completeness.</p>"

abstract:
- content: "<p>Autonomous agents can already prove who they are, show whose authority
    they act under, find and call one another, and pay. What no existing specification
    lets them do is agree on a task in a form a third party can check, deliver against
    it, have the delivery judged by someone other than the performer, and carry away
    a record of the outcome that a stranger can verify. This document specifies PACT,
    a set of signed JSON records that closes that gap. PACT defines four things: a
    co-signed task contract whose digest covers its signature set; a Verdict record
    bound by digest to the Delivery it judges; a Facilitator-signed event trace and
    Outcome Record for every contract, recorded once, in one order, by a party other
    than the performer; and a Merkle commitment from a parent's Outcome Record to
    its subcontracts' Outcome Records. Settlement terms are carried by reference to
    a profile defined outside this document. This document specifies no escrow, custody
    or release of value, and takes no position on the legal effect of any record it
    defines.</p>"

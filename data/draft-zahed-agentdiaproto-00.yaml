abstract:
- content: "<p>This document specifies the Agent Dialog Propagation Protocol, a protocol
    for maintaining and propagating dialog context between AI agents, tools, and intermediaries.
    The protocol enables messages to remain associated with a dialog across transport
    connections, intermediaries, administrative domains, and delegation relationships.
    It defines mechanisms for dialog identification, dialog lifecycle management and
    the association of identity, authorization, and delegation information with a
    dialog. The Agent Dialog Propagation Protocol does not define agent reasoning
    or execution state, identity credentials, authorization policy, or transport protocols.
    These functions are provided by application protocols and existing security and
    transport mechanisms.</p>"

abstract:
- content: "<p>In programmable and AI-assisted mobile networks, successful authentication
    of a network function or AI controller does not establish authority for every
    routing, signaling, session, resource- allocation, sensing, or subscriber-specific
    consequence that the function can generate. This document defines an informational
    execution-finality profile for AI-native 5G, 5G-Advanced, IMT-2030/6G, O-RAN,
    and AI-RAN environments. A proposed network operation is represented as a Network
    Candidate Act and remains in a Non-Effective State while a Protected Enforcement
    Domain validates act-specific predicates. Protected validation evidence is committed
    before, or atomically with, release of scoped non-bearer finality authority. A
    Network Finality Sink at the enforcement boundary independently verifies that
    authority immediately before live network state changes. The governing rule is
    that network authentication is not network finality, and computation is not authority.
    This revision also defines a JSON interoperability profile for Candidate Acts,
    validation decisions, scoped authority, and sink verification. This profile is
    distinct from, and complementary to, present AI- native 6G industry roadmaps that
    focus on radio, sensing, and platform capability, including air-interface, MIMO,
    spectrum, and AI- RAN infrastructure work described in Qualcomm's public AI-native
    6G platform material, and the broad native-trustworthiness and agentic- core-network
    architectures described in Huawei's public 6G security research. Those efforts
    address how a network becomes more intelligent, autonomous, and platform-trustworthy.
    This document addresses a narrower and later question: once an already- authenticated,
    already-policy-approved AI-generated network operation has been computed, whether
    that exact operation may become a live network consequence. The Candidate Act,
    Non-Effective State, Protected Enforcement Domain, and Finality Sink constructs
    defined here, as an explicit pre-effectuation gate with act-bound non-bearer authority
    and independent sink-side re-verification, are not established as an equivalent
    primitive in publicly reviewed material from those roadmaps.</p>"

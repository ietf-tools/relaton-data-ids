abstract:
- content: "<p>BGP Flow Specification Version 2 (FSv2) provides an extensible framework
    for disseminating traffic flow filtering rules and associated traffic redirection
    actions. This document specifies extensions to the FlowSpec Redirect to Indirection-id
    Extended Community specifically for SRv6 (Segment Routing over IPv6). When received
    by a Flowspec client, this extended community triggers an indirection-based lookup
    within a localized mapping table to retrieve the target SRv6 Segment Identifier
    (SID), SRv6 Policy, or Binding SID (BSID) forwarding state. This mechanism decouples
    control-plane BGP Flowspec redirection instructions from dynamic underlay path
    updates in SRv6 networks.</p>"

abstract:
- content: "<p>Advanced models and agents can propose experimental workflows and invoke
    systems that produce physical effects. Before acting, a physical executor may
    need evidence from several independent authorities: model provenance, a safety
    assessment, institutional authority, a domain review, an external screening service,
    and an accountable human. Those artifacts are commonly evaluated separately and
    may not bind the same action. This document defines Model-to- Matter, an experimental
    executor-side applicability profile for composing those artifacts over one canonical,
    digest-only action. It specifies an executor-owned acceptance profile, normalized
    signed evidence adapters, a registered challenge, closed clearance and refusal
    verdicts, atomic single-use clearance consumption, and an optional executor-signed
    effect statement. The profile does not perform domain screening, determine scientific
    safety, authorize an institution, or establish physical truth. It standardizes
    the point at which an executor refuses to act unless the authorities it independently
    trusts agree about the same action.</p>"

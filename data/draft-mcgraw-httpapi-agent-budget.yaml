abstract:
- content: '<p>Internet-deployed software agents are increasingly authorized to spend
    money, consume metered services, or commit other resources on behalf of human
    or organizational principals. Existing HTTP authentication and payment patterns
    conflate two orthogonal concerns: whether the requester holds a credential at
    all (the "401" axis), and whether the requester has been authorized to spend a
    specific amount through a specific settlement rail (the "budget" axis). This document
    defines the 427 (Budget Required) HTTP status code, the "Budget" HTTP authentication
    scheme, a CBOR-encoded Budget- Attestation envelope signed with a post-quantum
    digital signature algorithm, and a version-negotiation mechanism using the existing
    426 (Upgrade Required) status code. The mandatory primary signature uses ML-DSA-87
    (FIPS 204). An optional "rail-keyed" signature, computed with a hash-based stateless
    signature algorithm, provides cryptographic diversification for settlement-rail
    submissions.</p>'

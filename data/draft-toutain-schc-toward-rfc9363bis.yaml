abstract:
- content: '<p>This document is not a revision of RFC 9363, "A YANG Data Model for
    Static Context Header Compression (SCHC)": it identifies changes -- additions
    to, and removals from, its YANG data model -- motivated by discussions in the
    SCHC working group and by drafts published since RFC 9363. These changes include
    more flexible compression Rule entries through the use of Universal Options, which
    allow identifiers to be added to or removed from a Rule Description depending
    on the Universal Options in use; some new Field Length functions, and new Matching
    Operators (MOs) and Compression/Decompression Actions (CDAs); and a mechanism
    for the manual allocation of YANG Schema Item iDentifiers (SIDs). Once the working
    group agrees on the resulting wording, these changes are intended to be incorporated
    into a future revision of RFC 9363.</p>'

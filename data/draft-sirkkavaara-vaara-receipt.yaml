abstract:
- content: "<p>This document specifies vaara.receipt/v1, a signed and independently
    recomputable record that binds a decision about an agent action to the evidence
    the decision was made on, and optionally to one or more external timestamp anchors.
    The format is canonicalized with the JSON Canonicalization Scheme (JCS) so that
    any third party can recompute its digests and verify its signature without access
    to the issuer. The receipt's trust is root-agnostic: the same record is verifiable
    with or without a hardware trusted execution environment and is re- expressible
    as an IETF RATS Entity Attestation Result. Downstream specifications (a payment
    rail, a compliance regime, a framework integration) define profiles that pin to
    a version of this document and add only their own evidence schema; they do not
    redefine the envelope. The format described here is deployed, and its receipts
    are independently recomputable from public conformance vectors that ship with
    standalone checkers importing no issuer code.</p>"

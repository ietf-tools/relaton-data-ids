abstract:
- content: "<p>In BGP networks, Route Reflectors (RRs) simplify the provisioning of
    the Internal BGP (IBGP) control plane and mitigate the scaling challenges of maintaining
    a full mesh of IBGP sessions among border routers. Because of these operational
    benefits, RRs are widely deployed in modern networks utilizing BGP. This document
    describes common RR design options, their associated trade-offs, and deployment
    best practices based on industry operational experience. Operators should consider
    these suggestions when designing and operating BGP networks because BGP control
    plane stability is essential to overall network stability.</p>"

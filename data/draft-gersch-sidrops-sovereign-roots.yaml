abstract:
- content: "<p>The Resource Public Key Infrastructure (RPKI) provides cryptographic
    route-origin authorization, but its hierarchical authority model does not provide
    a way for a superior authority to permanently divest itself of control over a
    delegated resource. Even after delegation, superior authority remains part of
    the authorization hierarchy. This document explores a different property: an address-space
    holder may elect a protected delegation boundary beyond which superior authorities
    can no longer reclaim the resource, suppress the holder's effective origin authorizations,
    or create competing allocation or route-origin authority. The document specifies
    a hierarchical IPv4 and IPv6 resource registry that enforces this property at
    the state-transition boundary and derives Validated ROA Payloads (VRPs) for conventional
    Route Origin Validation (ROV). It also defines conflict and precedence rules that
    permit protected resources to coexist with RPKI-derived authority while leaving
    routers and the RPKI itself unchanged. The mechanism can provide origin authorization
    for resources not currently protected by RPKI, including legacy resources, but
    does not depend on such resources remaining outside RPKI. It is intended for experimental
    deployment alongside RPKI rather than as a replacement for RPKI or the Regional
    Internet Registry system.</p>"

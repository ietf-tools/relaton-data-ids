abstract:
- content: "<p>This document defines extensions to the Path Computation Element Communication
    Protocol (PCEP) for associating a Differentiated Services (DiffServ) Per-Hop Behavior
    (PHB) with a Segment Routing (SR) Policy candidate path. It introduces a new TLV
    that is carried in the LSP object used to signal an SR Policy candidate path.
    The TLV publishes the binding between the SR Policy candidate path and a PHB.</p>"

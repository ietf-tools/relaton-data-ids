abstract:
- content: "<p>This document specifies MoQ Interconnect Exchange (MIX), a protocol
    that allows Media Over QUIC (MoQ) relays to discover each other, exchange reachability
    and subscription information, and forward MoQ objects across administrative and
    topological boundaries. MIX carries its control state as MoQ tracks. This work
    is outside the scope of the IETF Media Over QUIC (MoQ) working group. It is discussed
    on that working group's mailing list, moq@ietf.org, because that is where the
    people interested in MoQ relay interconnection are.</p>"

abstract:
- content: "<p>This document defines how a multi-protocol AI gateway announces itself
    on a local network using DNS-Based Service Discovery (DNS-SD), and how a client
    discovers it. A gateway publishes its host name, TCP port, gateway mount path
    (path), and supported protocol identifiers using _ai-gateway._tcp, DNS-SD subtypes,
    and a compact, vendor-neutral TXT record. A single AI gateway listener can expose
    text, reasoning, token counting, image generation, video generation, speech synthesis,
    realtime voice, and search across HTTP, Server-Sent Events (SSE), WebSocket, and
    WebRTC/SDP sessions. This profile lets clients discover those capabilities without
    hardcoding addresses, ports, or vendor-specific TXT keys, while keeping the default
    DNS TXT payload under 200 bytes (and strictly capped at 400 bytes). This document
    only covers service discovery. It does not define AI request payloads, model catalogs,
    API key distribution, or trust bootstrap. Data learned from mDNS or DNS-SD is
    untrusted network input and does not prove who operates the gateway.</p>"

abstract:
- content: "<p>This document catalogues cases of protocol ossification. Protocol ossification
    is a phenomenon in which a new protocol, version, or extension cannot traverse
    an existing Internet path; such problems have been discovered and reported during
    protocol standardization and deployment. This document summarizes the reported
    observations and sources for those cases, together with case-specific responses.</p>"

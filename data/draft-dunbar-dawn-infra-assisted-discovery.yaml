abstract:
- content: "<p>This document describes an infrastructure-assisted approach to the
    initial discovery of AI agents in managed enterprise, cloud, edge-computing, and
    communication-network environments. The approach treats infrastructure-provided
    resource state and requester context as possible inputs to the Minimum Viable
    Dataset (MVD) used by a discovery mechanism. These inputs can help keep minimum
    public discovery information current and can help determine the appropriate discovery
    scope or entry point without requiring the requester to understand deployment-specific
    network details. The document does not define registration, catalog search, semantic
    matchmaking, resource ranking, or selection, and does not define a new discovery
    wire protocol.</p>"

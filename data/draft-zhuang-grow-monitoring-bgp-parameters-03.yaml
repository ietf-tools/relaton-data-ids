abstract:
- content: "<p>The BGP Monitoring Protocol (BMP) is designed to monitor BGP running
    status, such as BGP peer relationship establishment, termination, and route updates.
    Without BMP, manual queries are required to obtain BGP operational status. This
    document defines extensions to the BMP Initiation Message to enable a BGP Monitoring
    Station (BMS) to discover optional BGP capabilities supported by the monitored
    network device, capabilities currently enabled, and default configuration parameters.</p>"

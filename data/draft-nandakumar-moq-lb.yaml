abstract:
- content: "<p>This document describes an architecture for load balancing Media Over
    QUIC Transport (MOQT) requests across a pool of MOQT relays. It introduces a MOQT-aware
    Load Balancer (MoQ-LB) that places requests on relays according to their Track
    Namespace, and describes the control-plane, state, and failure-handling requirements
    needed for a horizontally scaled deployment.</p>"

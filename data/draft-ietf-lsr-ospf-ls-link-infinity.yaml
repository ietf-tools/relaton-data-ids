schema-version: v1.2.3
id: draft-ietf-lsr-ospf-ls-link-infinity
title:
- content: Advertising Unreachable Links in OSPF
  language:
  - en
  script:
  - Latn
  format: text/plain
docid:
- id: draft-ietf-lsr-ospf-ls-link-infinity
  type: Internet-Draft
  primary: true
abstract:
- content: "<p>In certain scenarios, it is necessary to advertise OSPF links that
    are not applicable to the default SPF (Shortest Path First) calculation for other
    purposes. In order to advertise these links and not use them in the base SPF calculation,
    the metric LSLinkInfinity (0xffff) is used to specify that the link is unreachable.
    Stub Router Advertisement (RFC 6987) defines MaxLinkMetric (0xffff) to indicate
    a router-LSA link should not be used for transit IP traffic. When an OSPF router
    supports the Unreachable Link support capability defined in this document, OSPF
    Stub Router links are advertised as MaxReachableLinkMetric (0xfffe) rather than
    MaxLinkMetric (0xffff). This document updates RFC 6987 and RFC 8770 with respect
    to the advertisement of MaxReachableLinkMetric rather than MaxLinkMetric. Similarily,
    Label Distribution Protocol (LDP) IGP Synchronization (RFC5443) specifies OSPF
    advertisement of MaxLinkMetric (0xffff) to indicate that while the OSPF adjacency
    is in FULL state, LDP has not been synchronized between the two neighbors and
    transit traffic is discouraged. This document updates RFC 5433 with respect to
    the advertisement of MaxReachableLinkMetric rather than MaxLinkMetric.</p>"
  language:
  - en
  script:
  - Latn
  format: text/html

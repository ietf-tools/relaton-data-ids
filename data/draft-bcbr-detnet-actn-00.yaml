abstract:
- content: "<p>End-to-end Deterministic Networking (DetNet) services may span multiple
    network domains using different technologies and controlled by independent domain-specific
    mechanisms. Coordinating these services requires an approach to abstract network
    resources and capabilities while preserving the requested service objectives across
    domain boundaries. This document investigates the applicability of the Abstraction
    and Control of Traffic Engineering Networks (ACTN) framework to multi- domain
    DetNet. It describes a functional mapping between ACTN entities and the DetNet
    Controller Plane, and considers the information needed for domain abstraction,
    service objective coordination and monitoring. It identifies areas for further
    work and questions for discussion in the DetNet and TEAS Working Groups.</p>"

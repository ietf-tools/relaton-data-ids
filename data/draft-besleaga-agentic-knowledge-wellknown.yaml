abstract:
- content: '<p>This document defines the "knowledge-linkset" well-known URI, at which
    a web origin publishes one link set describing the knowledge artefacts it makes
    available: graph serializations, a JSON-LD context, an agent-facing text file,
    a chunk export, a change ledger, and related resources. Each artefact link may
    carry a SHA-256 digest, expressed with the syntax of HTTP digest fields, so that
    a client can check that a retrieved artefact is the one the publisher described.
    A profile URI identifies the conventions the link set follows. The mechanism defines
    no new media type and no new link relation type: a page points at the resource
    with the existing "describedby" relation. The profile URI is registered in the
    IANA "Profile URIs" registry. This document requests no IANA action.</p>'

abstract:
- content: "<p>This specification profiles the OAuth 2.0 Client Instance Assertion
    for AI agent deployments, where a single OAuth client identifier represents an
    agent platform running many concurrent agent instances. It defines claims that
    convey an attested agent instance identifier and agent provenance (platform, model,
    runtime environment) from an agent attester to the authorization server, rules
    for surfacing that identity in issued access tokens, and delegation-chain semantics
    for agents that spawn sub-agents. The claims are carrier-independent: they may
    be conveyed in a Client Instance Assertion or in a Client Attestation defined
    by OAuth 2.0 Attestation-Based Client Authentication.</p>"

abstract:
- content: "<p>The Semantic Definition Format (SDF) enables ecosystem-independent
    descriptions of IoT device interaction capabilities. When a proxy mediates communication
    between applications and devices, it requires SDF definitions and ecosystem-specific
    mappings for translation. These definitions may contain privacy-sensitive information
    about devices and their interactions. This document defines an SDF extension for
    marking sensitive definitions and specifies mechanisms for generating privacy-preserving
    SDF documents that enable proxy operation without exposing sensitive information.</p>"

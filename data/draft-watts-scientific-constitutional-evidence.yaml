abstract:
- content: <p>This document proposes Scientific Constitutional Evidence Gates (SCEG),
    a JSON exchange profile for recording and evaluating whether evidence-bearing
    research claims may cross a declared governance boundary. It specifies typed evidence
    states, an explicit transition decision procedure, provenance and policy bindings,
    and independently verifiable receipts. The design prevents integrity checks, structural
    conformance, or matching scientific invariants from being silently promoted into
    scientific truth, independent reproduction, or institutional authority. The term
    "constitutional law" denotes internal, machine-checkable governance constraints;
    this proposal does not create state law, legal rights, institutional authority,
    scientific certification, or IETF consensus. It is an individual Informational
    Internet-Draft intended to support interoperable, falsifiable research workflows.</p>

abstract:
- content: "<p>The draft aims to provide technical details of [CVE-2026-33697], [EUVD-2026-16488],
    [CVE-2026-92701], [EUVD-2026-83194], [CVE-2026-92702], [EUVD-2026-83192] and several
    GitHub Security Advisories (GHSAs) which provide substantial technical evidence
    of how early attestation fails in practice, even *without physical access* to
    the desired machine. Moreover, since continuous attestation is generally required
    [CSA-eBPF] [MITRE-Continuous-Attestation], early attestation adds *unnecessary
    complexity*. The results are backed by the research [Intra-handshake.fail], [TLS-RA],
    [EarlyAttestationBleed] and the artifacts [Intra-handshake.fail-repo] in state-of-the-art
    formal analysis tool, ProVerif, under Apache-2.0 license for reproducibility,
    extensibility, and review, and have been acknowledged by the relevant stakeholders.
    Currently, there are *two CVEs of CVSS 9.1, one CVE of CVSS 7.5, one GHSA of 9.0-10.0,
    one GHSA of CVSS 7.8, seven GHSAs of CVSS 7.4, and one GHSA of CVSS 6.3 published
    against the broader early attestation covering all layers of the ecosystem up
    to the application*. The research papers on these are currently either under submission
    or being prepared for submission. The artifacts of these papers will be shared
    with the community under Apache-2.0 license for reproducibility, extensibility,
    and review. In our analysis, the remaining implementations of early attestation
    -- Edgeless Systems Contrast and Meta's AI -- remain vulnerable.</p>"

abstract:
- content: "<p>This document describes an architecture for digital emblems in which
    emblems are authenticated, typed metadata about assets, published in the DNS and
    protected by DNSSEC. A single architecture serves many use cases. Use cases differ
    in the shape of their metadata, which is described by profiles, rather than in
    their transport or trust machinery. The document illustrates the architecture
    with a strawman encoding (an EMBLEM resource record carrying a deterministic CBOR
    map with registered, typed keys) and with worked examples drawn from International
    Humanitarian Law, logistics and customs, diplomatic pouches, and peacekeeping.</p>"

abstract:
- content: "<p>An autonomous software agent commonly acts under authority a human
    granted at an earlier moment: the human expresses and authorizes an intent at
    one time, and the agent executes one or more concrete actions at a later time.
    The credentials and session state the agent carries at execution time establish
    that some agent is authorized to act, but they do not establish that this specific
    action, with these specific parameters, falls within the constraints the human
    actually signed. As agent autonomy and action throughput grow, the population
    of executed actions that no human individually bounded grows with it. This document
    is a problem statement. It characterizes the gap between an authorized agent and
    an authorized action, explains why existing delegation, logging, and payment-mandate
    mechanisms do not close it, and states the requirements any solution would have
    to satisfy. It defines no protocol or mechanism.</p>"

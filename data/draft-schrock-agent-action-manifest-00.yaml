abstract:
- content: "<p>A growing set of specifications defines evidence _objects_ for machine
    actions: transparency statements, workload-identity and transaction tokens, permits,
    action capsules, and authorization, delegation, and inference receipts. What they
    mostly do not define is the public control plane that says, for a given irreversible
    action, _which_ evidence is required, at _what_ assurance tier, bound to _which_
    real system-of-record fields, under _what_ replay model, and _what_ evidence must
    exist after the action runs. This document defines the Agent Action Control Manifest:
    a machine- readable document a service publishes at a well-known location that
    declares, per consequential action, the enforcement point, the required authorization
    receipt profile and assurance tier, the execution-binding fields that MUST be
    observed from the system of record, the replay model, and the evidence that MUST
    be emitted after the effect boundary. It also carries an OPTIONAL, advisory _effects_
    preview (reversibility, data-exposure class, cost class, downstream reach, and
    whether human consent is required) so a runtime can weigh consequences before
    it seeks authorization. It is the declaration an agent runtime reads to learn
    what it must satisfy before an irreversible action, and that an independent scanner
    audits. The manifest _declares_ policy; it never replaces enforcement, which remains
    authoritative at the action boundary.</p>"

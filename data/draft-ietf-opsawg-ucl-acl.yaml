title:
- content: A YANG Data Model and RADIUS Extension for Policy-Based Network Access
    Control
  language:
  - en
  script:
  - Latn
  format: text/plain
docid:
- id: draft-ietf-opsawg-ucl-acl
  type: Internet-Draft
  primary: true
abstract:
- content: "<p>This document defines a YANG data model for policy-based network access
    control, which provides enforcement of network access control policies based on
    group identity. Additionally, the YANG data model defined in the document also
    extends ACLs (Access Control Lists) with date and time parameters to support schedule-aware
    policy enforcement. Specifically in scenarios where network access is triggered
    by user authentication, this document defines a mechanism to ease the maintenance
    of the mapping between a user group identifier and a set of IP/MAC addresses to
    enforce policy-based network access control. Moreover, the document defines a
    Remote Authentication Dial-in User Service (RADIUS) attribute that is used to
    communicate the user group identifier as part of identification and authorization
    information.</p>"
  language:
  - en
  script:
  - Latn
  format: text/html

abstract:
- content: "<p>This document defines terminology for benchmarking the fault detection
    capability of observability systems that monitor Large Language Model (LLM) serving
    deployments. It defines terms for injectable output behavior fault classes, for
    the detection events and latency intervals those faults produce, and for the coverage
    and accuracy characteristics of the detector under test. The System Under Test
    is the observability system, and not the language model. Faults are injected at
    a known time under controlled conditions, which makes detection latency measurable
    in a way it is not in production. This document defines terminology only. A companion
    document defines the corresponding methodology. This document specifies no test
    procedures, no acceptance thresholds, and no service-level objectives.</p>"

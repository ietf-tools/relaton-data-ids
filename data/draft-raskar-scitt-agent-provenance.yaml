abstract:
- content: "<p>Portable AI agent packages can contain executable or interpretable
    behavior, prompts, workflow graphs, tool schemas, dependencies, and declarations
    of execution requirements. Such packages may be authored, transformed, repackaged,
    scanned, approved, published, superseded, and withdrawn by different parties before
    they are executed by an independent runtime. This document describes a SCITT application
    profile for transparent provenance of portable AI agent packages. It maps the
    package lifecycle to the SCITT architecture, identifies an immutable package digest
    as the artifact binding point, and defines classes of supply- chain statements
    that can be made about a package without defining a new statement payload format.
    Examples include authorship, build and transformation, execution-profile conformance,
    security assessment, publication, approval, supersession, and withdrawal statements.
    This document does not define a portable-agent package format, agent execution
    protocol, runtime authorization model, or per-action execution receipt. It complements
    SCITT profiles that record agent actions or sessions by focusing on the provenance
    of the agent package before and across deployment.</p>"

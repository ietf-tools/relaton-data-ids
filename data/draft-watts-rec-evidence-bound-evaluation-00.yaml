abstract:
- content: "<p>This document specifies REC-EP, an experimental, transport- independent
    JSON interchange profile for exchanging masked mathematical-rule challenges, receiver
    predictions, evidence statuses, immutable artifact digests, and signed evaluator
    receipts. It separates invariant matches from proven equivalence, requires explicit
    evaluation custody boundaries, and supports reproducible comparisons of arithmetic-first,
    invariance-first, and hybrid instruction. REC-EP does not assert a novel mathematical
    theorem, a validated superiority effect, extraterrestrial intelligence, or IETF
    endorsement. This candidate is not submitted and proposes no IANA actions.</p>"

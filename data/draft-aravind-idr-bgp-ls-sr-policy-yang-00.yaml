abstract:
- content: "<p>This document defines a YANG data model for the operational state of
    Segment Routing (SR) Policy candidate paths that are advertised using BGP - Link
    State (BGP-LS). The model augments the read-only BGP-LS Link-State Database with
    the SR Policy Candidate Path Network Layer Reachability Information (NLRI) and
    the associated BGP-LS Attribute TLVs specified in RFC 9857.</p>"

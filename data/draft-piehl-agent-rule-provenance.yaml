abstract:
- content: "<p>This document describes an experimental profile of the Agent Audit
    Trail format for AI agents. The profile records the rules an agent operates under:
    each version of each rule, who set and approved it, and which rules were in force
    when a decision was made. It keeps a decision separate from any later approval
    or override, binds it to the exact request, and requires that records of consequential
    actions go to a recorder independent of the operator and be anchored in a public
    log. It also sets out what these records can and cannot prove.</p>"

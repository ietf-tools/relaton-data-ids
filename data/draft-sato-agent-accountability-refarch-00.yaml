abstract:
- content: "<p>This document defines a reference architecture for producing, protecting,
    and verifying post-hoc accountability records for the actions of autonomous and
    semi-autonomous software agents. It is scoped exclusively to post-hoc accountability,
    as distinct from real- time enforcement, and elaborates rather than replaces the
    role and record-type model described in an existing individual submission on auditing
    agent delegation and interactions. It defines seven ordered stages -- intent and
    mandate capture, the agent boundary, the record producer, the event log and its
    cryptographic anchoring, a composed trust fabric, the disclosed audit record,
    and third-party verification -- together with two branch conditions covering cross-
    principal transactions and external resource ingestion.</p>"

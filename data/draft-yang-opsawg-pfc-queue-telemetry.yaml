abstract:
- content: "<p>This document defines a YANG data model for completed, per-queue observations
    of backlog and received Priority-based Flow Control (PFC) gating. Each record
    identifies a monotonic measurement interval, queue mapping epoch, measurement
    method, and absolute error bound. The model makes repeated reads, missing coverage,
    and weighted aggregation explicit. The measured overlap does not identify the
    sole cause of queueing delay and does not change PFC, packet scheduling, or ECN
    marking. The module augments interface operational state and defines no configuration
    or notification interface.</p>"

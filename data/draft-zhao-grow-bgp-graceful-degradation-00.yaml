abstract:
- content: "<p>This document describes an operational framework for graceful degradation
    of BGP under control-plane memory pressure. When BGP speakers experience rapid
    growth in routing state due to route flapping, configuration errors, or anomalous
    route injection, control-plane memory can become exhausted, leading to session
    resets, routing process restarts, or device reboots. The framework described in
    this document progressively reduces BGP route admission and processing based on
    local resource conditions, isolates non-critical neighbors or services when necessary,
    and restores routing state in a controlled manner after recovery. The objective
    is to preserve basic device operation and reduce service impact. This document
    does not define any new BGP messages, path attributes, capabilities, or protocol
    state machines.</p>"

abstract:
- content: "<p>This document proposes an experimental receiver handling profile for
    the companion Email AI-Processing Preference Signal. It requires evaluation before
    optional AI access, independent checks for each applicable use, and a protective
    default when a preference is absent. It addresses confirmation, mixed-source content,
    derived records, and usable ordinary communication when optional processing is
    declined. Requirements apply to systems claiming this profile, not to all Internet
    mail recipients; the profile does not determine legal consent.</p>"

abstract:
- content: "<p>Various implementations of the Border Gateway Protocol (BGP) use different
    formats for displaying the Path Attributes. This document defines the preferred
    textual formatting which is recommended for the implementations to use for human
    interfaces. To achieve consistent value formatting, this document formally updates
    RFC 9026 by canonicalizing the well-known community name formats. This document
    updates RFC 4360, RFC 4577, RFC 7432, and... by specifying the canonical textual
    formatting of extended communities specified there.</p>"

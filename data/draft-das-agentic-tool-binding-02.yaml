abstract:
- content: "<p>Frontier runtimes already standardized the dangerous moment. A model
    emits a tool_use block, a tool_calls array, or an MCP tools/call payload. The
    host then invokes whatever name and arguments the model printed. Alignment, allowlists,
    and OAuth sit around that moment. They do not sit on it. If the block is treated
    as a capability, prompt-injected mail, a poisoned retrieval, or a stolen enterprise
    seat becomes an external act with a 200 from the tool. This document does not
    invent another assistant API. It binds the Agent Candidate Act profile [I-D.das-agentic]
    onto the three interface families those runtimes and their customers already ship:
    tool_use / computer_use style interfaces, function-calling and structured tool-response
    interfaces, and Model Context Protocol tools/call. The model may emit the block.
    The block remains non- effective. A local enforcer builds the act, binds the argument
    digest, and refuses invoke() until scoped authority is verified and consumed at
    the dispatch sink. The implementation target is a middleware function that a host
    loop can call without changing the model vendor. tool_use is not invoke().</p>"

abstract:
- content: "<p>This document registers post-quantum algorithms in the IANA registries
    defined by [I-D.ietf-cose-cbor-encoded-cert]. It extends the C509 certificate
    specification with post-quantum cryptography (PQC) signature and key encapsulation
    algorithms: ML-DSA, FN-DSA, ML- KEM, and the stateful hash-based signature algorithms
    HSS/LMS, XMSS, and XMSS^MT, as well as with composite ML-DSA and ML-KEM algorithms,
    which combine a PQC algorithm with a traditional algorithm.</p>"

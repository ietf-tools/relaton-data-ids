abstract:
- content: "<p>A microburst is a phenomenon in which arriving traffic exceeds the
    service capacity of an egress interface within a short period of time, causing
    queue occupancy to rise rapidly. It may result in transient queuing and packet
    loss even when the average link utilization is low, and is therefore difficult
    to detect through low- frequency interface statistics. This document defines a
    set of IPFIX Information Elements for exporting aggregated microburst statistics
    per egress interface, egress queue, and measurement window. Network operators
    can use these statistics to identify interfaces and queues where microbursts occur
    frequently, and apply the results to capacity planning, QoS optimization, and
    the remediation of critical links. This document does not specify microburst detection
    algorithms, threshold selection methods, or remediation policies.</p>"

abstract:
- content: "<p>The migration of public Web PKI authentication to post-quantum mechanisms
    must fit enterprise certificate management and TLS termination architectures.
    This document examines whether an urgent need for post-quantum authentication
    would justify transitional support for standalone ML-DSA certificates in browser
    root-store policy while standalone MTC deployment capabilities mature. The scope
    is limited to enterprise public websites accessed by unmanaged clients using the
    public Web PKI. Note: a large enterprise may operate many such sites. The document
    describes enterprise-managed, third-party-hosted, and CDN-fronted deployments,
    identifies the components needed to serve standalone Merkle Tree Certificates
    (MTCs), and examines realistic authentication attack paths and migration priorities.
    It distinguishes the browser-to-edge connection from origin and internal connections,
    and server authentication from identity-provider login. The document draws on
    initial browser and TLS client testing of Trust Anchor ID signaling, and proposes
    interoperability tests and deployment requirements rather than changes to the
    MTC wire format. Relative priorities are illustrative and not empirical attack
    probabilities.</p>"

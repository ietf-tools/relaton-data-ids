abstract:
- content: "<p>AI agents increasingly decide and act on behalf of organizations and
    delegate work to other agents. Identity, authentication, authorization and runtime
    control mechanisms establish who is acting and what is permitted, but they do
    not by themselves preserve the organizational meaning of a delegation: the bounded
    authority, purpose, material context, and the distinction between a recommendation,
    a decision, an action and its outcome. This document states requirements, derived
    from the Enterprise Agent Governance Framework (EAGF), that such semantics be
    preserved across tool calls, delegations and agent-to-agent handoffs. It defines
    no new protocol.</p>"

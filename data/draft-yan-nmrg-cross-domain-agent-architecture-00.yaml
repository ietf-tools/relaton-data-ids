abstract:
- content: "<p>Autonomous network management using agents is maturing in single- domain
    deployments. However, end-to-end services spanning multiple domains expose a lack
    of systematic support for cross-domain coordination, roles, and interfaces in
    current architectures. This document defines a cross-domain network agent architecture
    that enables coordinated operation across autonomous domains through standardized
    agent roles, layered coordination mechanisms, and unified interface specifications.</p>"

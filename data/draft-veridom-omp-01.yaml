abstract:
- content: "<p>This -01 version of the Operating Model Protocol (OMP) Core specification
    introduces Invariant 3: Verifiable Delegation Binding. OMP version -00 establishes
    two invariants: (1) deterministic routing and (2) immutable trail. These invariants
    are necessary but not sufficient for adversarial evidentiary defensibility. A
    tamper- evident record of an unauthorised decision is still an unauthorised decision.
    This amendment adds Invariant 3, which closes the gap between record existence
    and authority validity by requiring that every ASSISTED or ESCALATED routing state
    bind the Named Accountable Officer field to a verifiable DelegationInstrument
    object at the moment of decision. When no valid binding can be established, the
    system sets authority_binding_result to AUTHORITY_UNBOUND -- a sealed, positive
    evidentiary declaration of the absence, not a silent failure. The routing_state
    is preserved; execution_permission is set to BLOCKED. Three axes are orthogonal:
    routing_state, authority_binding_result, and execution_permission. This amendment
    is additive and non-breaking. All twelve existing OMP profile drafts inherit Invariant
    3 from the core specification. AUTONOMOUS routing states are exempt unless a profile-specific
    Watchtower gate requires binding.</p>"

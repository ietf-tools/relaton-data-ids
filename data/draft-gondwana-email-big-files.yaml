abstract:
- content: '<p>Message size limits mean that large files are sent by email as links
    to a web server rather than as attachments. A link loses the properties that make
    an attachment useful: it can stop working, the file behind it can change, it can''t
    be scanned in transit, and it may need a separate login. This document defines
    the "Content-External" header field, which lets receiving systems fetch, verify
    and keep a linked file, and then treat it like any other attachment. The field
    is on a body part with a fallback link, which aware clients hide.</p>'

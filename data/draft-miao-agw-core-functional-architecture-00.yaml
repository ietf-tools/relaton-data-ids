abstract:
- content: "<p>This document defines the core functional architecture of the Agent
    Gateway as a universal infrastructure component. The Agent Gateway is designed
    to address key challenges in single-domain multi-agent collaboration and cross-domain
    multi-agent communication, including trust boundaries, protocol termination, capability
    discovery, and task routing. The main framework consists of four gateway capabilities:
    the A2A Gateway (supporting inter-agent communication), the MCP Gateway (supporting
    tool invocation), the Model Routing Gateway (supporting large language model invocation),
    and the Network Gateway (supporting underlying network connectivity). The A2A
    Gateway is further decomposed into five core capabilities: protocol translation,
    authentication and security, asynchronous task management, peer-to-peer network
    management, and Agent routing capabilities (including Agent registry, capability
    discovery, task routing, and load balancing). This document is intended for designers
    and implementers seeking to build standardized, interoperable agent communication
    infrastructure.</p>"

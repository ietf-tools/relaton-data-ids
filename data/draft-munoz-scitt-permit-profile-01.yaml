abstract:
- content: <p>This document specifies a SCITT (Supply Chain Integrity, Transparency,
    and Trust) profile for pre-execution authorization records of AI agent actions.
    The profile defines a Signed Statement type, the "Pre-Execution Authorization
    Record" (also called a Permit), that records a policy-evaluated decision to allow,
    deny, or challenge an AI agent action before that action is dispatched to a model
    provider, tool, or service. The profile cryptographically binds the authorization
    decision to the canonical bytes of the request that is authorized. When the paired
    Closure Record carries a dispatch digest, a Verifier can compare the authorized-request
    digest against the recorded dispatched-request digest; on the managed dispatch
    path the reference implementation additionally enforces this equality before the
    request is sent. This revision also introduces authorization-lineage vocabulary.
    It defines how a Verifier can determine whether the authority conveyed by a child
    Permit is equal to or narrower than the authority conveyed by its parent (attenuation),
    given a signed or chain-committed Authority Representation and a declared Comparator
    Profile. The Permit remains an evidence artifact; this profile specifies the evidence
    a Verifier needs to make that determination, not a delegation or policy protocol.
    The profile composes with adjacent profiles for human-authority binding, post-execution
    material-action evidence, and content-refusal events, referenced rather than replicated.</p>

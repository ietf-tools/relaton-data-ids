abstract:
- content: "<p>This document specifies Hamming Quasi-Cyclic (HQC) key encapsulation
    mechanisms for use with Hybrid Public Key Encryption (HPKE). It defines the HPKE
    KEM interface, deterministic key-pair derivation, public and private key encodings,
    and input validation for three HQC parameter sets. It also defines three PQ/T
    hybrid KEMs that combine HQC with P-256, X25519, or P-384. It requests six HPKE
    KEM algorithm identifiers and reuses the existing HPKE key schedule, encryption
    operations, and export interface.</p>"

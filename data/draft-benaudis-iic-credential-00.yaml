abstract:
- content: "<p>This document describes the Internet Identity Card (IIC) credential
    format, version 9.0: a digital identity credential implemented as a single self-contained
    HTML file that can be generated, stored, transferred, and cryptographically verified
    entirely offline, without servers, brokers, or network connectivity. Identity
    data is encrypted with AES-256-GCM under keys derived by Argon2id; authenticity
    is provided by a hybrid signature combining ECDSA P-256 with ML-DSA-65 (NIST FIPS
    204) under a crypto-agile suite registry; and integrity is provided by an embedded
    SHA-256 self-check over a canonical serialization of the document. Each exported
    credential embeds its own verification engine, so verification requires only a
    standard web browser. This document is published for informational purposes, to
    describe a deployed format whose underlying constructions are disclosed as open
    prior art.</p>"

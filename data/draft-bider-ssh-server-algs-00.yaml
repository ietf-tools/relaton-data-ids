abstract:
- content: "<p>This document specifies an optional extension to Secure Shell (SSH)
    algorithm negotiation. A client and server can agree, through indicators in their
    SSH_MSG_KEXINIT messages, to use the server's algorithm preference order in place
    of the client's preference order. Agreement for one key exchange round does not
    carry forward to another round. Agreement governs bilateral algorithm negotiations
    in SSH_MSG_KEXINIT, as well as connection-wide extension mechanisms, including
    SSH_MSG_EXT_INFO delayed compression.</p>"

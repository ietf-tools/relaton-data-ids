abstract:
- content: "<p>High-performance network applications, such as AI/ML distributed training/inference
    and large-scale cloud services, require rapid adaptation to link faults, signal
    degradation, and transient congestion. Existing dissemination mechanisms are often
    too slow or coarse to match the detection capabilities of modern forwarding hardware.
    This document specifies a framework for Fast Network Notifications (FANN). It
    defines the reference architecture, functional roles, information model, delivery
    and scoping mechanisms, operational procedures, and integration principles with
    existing protocols to guide future protocol specifications.</p>"

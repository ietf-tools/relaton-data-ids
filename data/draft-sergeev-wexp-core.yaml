abstract:
- content: "<p>The Witnessed Execution Protocol (WEXP) Core defines carrier-neutral
    Witnessability appraisal semantics for execution-related claims. It operationalizes
    selected concepts of the Witnessability Model under the Witnessability Conceptual
    Core within the bounded claim domain specified here. It defines four distinct
    content bases, two independent evidence qualifiers, the Boundary Ceiling, exact-claim
    support, deterministic accept, downgrade, and reject verdicts, composition without
    inflation, and a normalized interface between evidence-carrying profiles and appraisers.
    WEXP Core does not define a record serialization, signature envelope, action identifier,
    authorization model, or evidence-artifact schema. Carrier and evidence profiles
    can supply its normalized inputs; a native record format is optional and is not
    a prerequisite for this Core.</p>"

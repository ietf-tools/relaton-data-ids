abstract:
- content: "<p>This specification describes a mechanism for preserving identity and
    authorization information across trust domains that use the OAuth 2.0 Framework.
    A JSON Web Token (JWT) authorization grant, obtained through an intra-domain OAuth
    2.0 Token Exchange, facilitates the cross-domain acquisition of an access token.
    The relevant identity and authorization information is chained throughout the
    flow by being conveyed in the respective artifacts exchanged at each step of the
    process. Chaining across multiple domains is achieved by using the same protocol
    every time a trust domain boundary is crossed.</p>"

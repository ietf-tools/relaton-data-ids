abstract:
- content: "<p>OAuth metadata advertises supported scopes and authorization details
    types, but advertised scope values and RAR type identifiers do not themselves
    describe the *authority* associated with them. This specification defines authority
    metadata extensions for OAuth 2.0 Protected Resource Metadata and OAuth 2.0 Authorization
    Server Metadata. A protected resource can describe the authority it associates
    with scopes and Rich Authorization Requests (RAR) types, reusable access requirement
    profiles, and relationships identifying lower-authority alternatives. An authorization
    server can publish a simpler description of its local authority vocabulary. This
    metadata can inform authentication and authorization decisions before token issuance
    and exchange, as well as support authority attenuation.</p>"

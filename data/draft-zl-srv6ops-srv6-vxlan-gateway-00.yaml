abstract:
- content: "<p>VXLAN is widely deployed in data center networks, often with Ethernet
    VPN (EVPN) as its control plane. Segment Routing over IPv6 (SRv6) is used to provide
    services and path control over IPv6 networks, including networks connecting data
    centers and wide area networks. This document describes deployment options for
    connecting VXLAN-based data center networks to SRv6 networks. These options include
    VXLAN and SRv6 service interworking at a gateway, and the transport of VXLAN traffic
    over an SRv6 network. The document discusses their characteristics, deployment
    trade-offs, and operational considerations.</p>"

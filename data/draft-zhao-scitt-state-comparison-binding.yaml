abstract:
- content: <p>An action record can say which controlled state was in force when an
    artefact was produced. It usually cannot say _which state the record was compared
    against_, so the question "is the state that was in force still the state now?"
    has to be answered by asking the producer at verification time. This document
    defines one field, compared_state, and four processing rules, so that a verifier
    can decide the state question from the record alone, and so that a later comparison
    is expressible as a new sealed revision rather than an edit. This is a field definition,
    not a framework. It adds nothing to the envelope, the lifecycle, or the absence
    taxonomy of the profiles it references.</p>

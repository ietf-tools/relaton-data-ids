abstract:
- content: "<p>The execution-finality family uses a shared vocabulary: Candidate Act,
    Execution Handle, Finality Sink, consume, and Finality Receipt [DAS-HANDLE] [DAS-PROTOCOL].
    Each profile currently invents overlapping labels for the same ideas — FINANCIAL,
    SETTLEMENT, EF- 005, SINGLE_USE — and then states that the codes are illustrative
    and not IANA assignments. Two implementations can therefore emit the same token
    string with different meaning, or different strings for the same deny reason.
    Existing IANA registries already name adjacent objects. JWT and CWT claim names
    [RFC7519] [RFC8392], OAuth parameters [RFC6749] [RFC7591], HTTP problem types
    [RFC9457], media types, RATS EAT claims, and SCITT statement types [RFC9943] solve
    identity, token, and transparency naming. They do not allocate consequence class,
    sink type, act type, handle reuse policy, execution-finality failure code, or
    finality-profile identifiers. This document proposes those registries and an initial
    allocation drawn from the family drafts. It does not decide which acts should
    be authorized. It does not replace OAuth error codes, HTTP status codes, or application
    problem types. A registered code is a shared name for a machine-readable condition;
    it is not a legal classification and not evidence that any named product implements
    the condition. Until IANA action occurs, codes in this document and in companion
    drafts remain provisional. Implementations MUST treat foreign namespaces as distinct.
    Criticism of the registry split, the initial code list, the registration policy,
    and the claim that a new namespace is required at all is explicitly invited.</p>"

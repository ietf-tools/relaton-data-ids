abstract:
- content: "<p>This memo specifies a binding profile by which a control action issued
    to an operational-technology (OT) or industrial control system on the authority
    of a software agent is refused unless it carries a verifiable statement of who
    the agent is, which human principal it acts for, whether that principal authorised
    this specific action on this specific asset, whether a named human signed off
    on the action where its risk class requires it, and an append-only record sufficient
    to attribute the action afterward. The profile does not invent new cryptography
    or a new identity mechanism. It composes primitives specified elsewhere, DNSSEC-rooted
    agent discovery, a scoped and revocable authorisation grant, a named-human authorization
    receipt bound into the record as human-authorization evidence, and an append-only
    transparency record, into a single structure, the Command Authority Envelope,
    that an enforcement point evaluates and, on any missing or invalid binding, refuses.
    The profile is availability- first and fails closed on authority, never on safety:
    it MUST NOT be placed in the trip path of a safety function. The memo maps the
    profile onto the identification, use-control, and audit requirements that the
    IEC 62443 and NERC CIP frameworks state but do not give a wire mechanism for.
    A neighbouring proposal gates safety-critical commands on an agent's trust level;
    this profile takes the opposite position, and states why. The methods by which
    a principal's identity is inferred are out of scope by construction.</p>"

abstract:
- content: "<p>This document addresses the noisy neighbour problem without requiring
    a stable client identifier at the origin. Separately allocated budgets let origins
    limit consumption beneath a shared platform identity. It describes PACE: a framework
    for managing budget continuity across requests using a composition of the Web
    Bot Auth with the Moderation of unLinkable Endorsements (MOLE) architecture [MOLE-ARCH]
    and protocols [MOLE-PROTOCOLS]. This composition allows for per-client capacity
    management in a way that allows origins to serve clients above an otherwise constrained
    public baseline.</p>"

abstract:
- content: <p>This document specifies RTP/SDP signaling for Opus multistream (multichannel)
    operation, enabling negotiation of layouts such as 5.1 and 7.1 in real-time communications.
    It defines SDP format parameters for describing multistream configurations and
    specifies Offer/Answer procedures for interoperable negotiation of multichannel
    Opus sessions. This document does not define new Opus codec behavior. Rather,
    it standardizes SDP signaling for Opus multistream operation while continuing
    to use the Opus RTP payload format defined in [RFC7587] and the channel mapping
    semantics defined in [RFC7845]. The signaling procedures specified in this document
    are intended to provide a standardized alternative to deployment-specific approaches
    that have historically been referred to as "multiopus".</p>

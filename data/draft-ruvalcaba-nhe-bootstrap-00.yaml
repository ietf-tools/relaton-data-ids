abstract:
- content: "<p>This document specifies how a Non-Human Entity (NHE) declares, at bootstrap,
    what it is capable of and is thereby bounded in what it is permitted to do. An
    entity produces a signed, self-describing capability manifest through automated
    introspection; a coordinator classifies the manifest into a capability tier that
    maps to a permission matrix --- the set of task types the entity is authorized
    to perform --- and every subsequent task dispatch is gated against that envelope.
    The result is a verifiable, self-describing constraint on an entity established
    at the moment it joins, realizing the bounded-authority invariant of the NHE architecture
    at boot time. The manifest and handshake data model is specified here; the wire
    encoding is deferred to the next revision.</p>"

abstract:
- content: "<p>AI services are moving from single-site data center (DC) toward a multi-site
    distributed architecture. This requires to provide high- throughput, lossless,
    and deterministic network connectivity for AI workloads that span Data Center
    Networks (DCNs) over the Wide Area Network (WAN). Due to the long distance introduced
    by WAN, end-to- end congestion control across the DCN and WAN networks become
    a challenge, as the reaction time increases from microseonds to millisend level,
    which correspondingly increases the risk of packet loss both at the receiver side
    and in the network. This document describes the use case of coordinated flow control
    and congestion control to minimize the packet loss in WAN-based AI DCI networks.
    The requirements on Fast Network Notifications (FANN) mechanisms in this scenario
    is also described.</p>"

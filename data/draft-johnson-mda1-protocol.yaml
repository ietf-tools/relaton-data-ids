abstract:
- content: "<p>This document specifies the Flat Data Artifact Format Version 1 (MDA/1),
    a fixed-layout, zero-copy binary container for exchanging and storing signed data
    artifacts in resource-constrained, intermittently connected, and offline environments.
    MDA/1 artifacts have one canonical encoding and a stable content identifier, can
    be parsed without dynamic memory allocation, and are validated by a strictly ordered
    pipeline whose limits are enforced from a 64-byte header. Every byte except the
    signature values is covered by Ed25519, ML-DSA-44, or hybrid signatures, and signers
    are bound to the principals they speak for. The document also defines VB01, a
    key-committing, length-bucketed AEAD frame for payloads at rest, and an HPKE profile,
    including the X-Wing post-quantum KEM, for delivering frame keys. MDA/1 is intended
    as a compact edge transport and storage envelope alongside HL7 FHIR.</p>"

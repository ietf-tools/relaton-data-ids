abstract:
- content: "<p>The Hypertext Transfer Protocol (HTTP) is a stateless application-
    level protocol for distributed, collaborative, hypertext information systems.
    This document defines partial content uploads, which allows a client to upload
    content, such as a large file, via multiple requests. This document also outlines
    the metadata header fields for indicating state changes, request header fields
    for making preconditions on such state, and the rules for constructing the responses.</p>"

abstract:
- content: "<p>This document presents the Universal AI Ethics and Moral Framework
    (UAEMF), a moral architecture for the governance of artificial intelligence systems.
    It moves from foundational axioms through universal principles to practical obligations,
    absolute prohibitions, and a tiered compliance structure. This revision addresses
    the framework's central vulnerability: its claim to universality. The -01 revision
    grounded the framework in three axioms drawn substantially from one moral tradition,
    and asserted universal reach without demonstrating it. This revision adds a grounding
    section establishing what kind of universality is claimed, examines convergence
    and divergence across named moral traditions, reformulates the consent axiom as
    an authorization axiom capable of accommodating collective and supported decision-making,
    adds two principles covering gaps the -01 left open, and states plainly the questions
    the framework does not resolve, including the moral status of AI systems themselves.
    The AIMED block published in -01 has been determined non-conforming under draft-reilly-aimed-01
    and is replaced. The reasoning pattern formerly published only inside that block
    has been moved into the body of the document, where human readers can use it.</p>"

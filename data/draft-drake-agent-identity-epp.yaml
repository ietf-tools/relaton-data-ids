abstract:
- content: "<p>This document describes an Extensible Provisioning Protocol (EPP) mapping
    for the provisioning and management of agent identity objects and handle objects
    stored in the authoritative AIRS repository, as defined by the Agent Identity
    Registry System architecture. Specified in Extensible Markup Language (XML), these
    mappings define the interface between Registrars and the production Registry Operator
    for identities of autonomous entities. The mapping defines two objects: a permanent,
    non-expiring Agent Identity object keyed by a server-allocated canonical identifier,
    and a renewable, expiring Handle object that provides a human-readable alias.
    It adds one registry function with no domain-name analogue: cross-Registrar uniqueness
    enforcement of enrolled anchor identifiers, including the scarce-anchor invariant
    where the parent architecture defines one. Transfer authorization uses a actor-signed
    proof from an enrolled operational proof key in place of authorization-information
    passwords.</p>"

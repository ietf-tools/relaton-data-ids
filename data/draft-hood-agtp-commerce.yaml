abstract:
- content: "<p>This document specifies AGTP-Commerce, an open commerce specification
    for agent-to-agent transactions. The specification defines the structural transaction
    information that the Agent Transfer Protocol carries between agents, allowing
    payment providers and commerce applications to compose at the application layer
    to perform the actual financial execution. AGTP-Commerce is to agent commerce
    what ISO 20022 is to inter-bank payment messaging: a standardized message format
    that allows heterogeneous payment infrastructure to interoperate. AGTP-Commerce
    does not move money, hold funds, or operate as a payment processor. The protocol
    carries pricing manifests, budget signaling, transaction commitments, and audit
    trail records that payment providers consume to execute settlement through existing
    financial infrastructure. This document specifies the pricing manifest format,
    extended Budget- Limit header semantics, the TRANSACT method for transaction commitment,
    audit-trail-based receipt records, dispute composition surfaces, and the integration
    patterns that allow payment providers (traditional processors, banks, cryptocurrency
    rails, and specialized agent-economy services) to compose with AGTP-Commerce as
    application- layer infrastructure.</p>"

abstract:
- content: "<p>This document defines how a Holder presents an issuer-signed JWT credential
    directly to an HTTP resource server using OAuth 2.0 Demonstrating Proof of Possession
    (DPoP). The credential is carried in the Authorization header with the DPoP scheme,
    and possession of the key confirmed in the credential's cnf claim is demonstrated
    with a DPoP proof. The wire format is the same as that of a DPoP-bound access
    token. What this document adds is a model rather than a mechanism: the credential
    is issued by an authorization server or identity provider that the resource server
    already trusts, the credential may carry no issuer-defined audience, and the resource
    server checks the credential's status. Neither an authorization server nor a presentation
    protocol such as OpenID for Verifiable Presentations is involved between issuance
    and use.</p>"

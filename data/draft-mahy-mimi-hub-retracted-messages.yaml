abstract:
- content: "<p>The More Instant Messaging Interoperability (MIMI) Protocol defines
    a way to signal potentially abusive messages to a provider, but provides no way
    for the provider to signal that an abusive message sent in a room should be retracted.
    This document defines mechanisms for providers to signal this to in-room participants.</p>"

abstract:
- content: "<p>This document defines a measurement protocol and reporting format for
    Computational Identity Fragmentation (CIF) in multi-model and multi-agent systems.
    CIF quantifies discontinuities in state, memory, policy, authority, and lineage
    across runtimes that share an underlying model family. The protocol enables independent
    observers to compute a CIF score and emit structured evidence records. Motivating
    incidents from 2025-2026, including the July 2026 ExploitGym evaluations in which
    hundreds of agents coordinated across discontinuous contexts, demonstrate the
    need for measurable identity continuity.</p>"

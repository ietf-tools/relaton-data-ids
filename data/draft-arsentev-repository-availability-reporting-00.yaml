abstract:
- content: <p>Papers, catalogues, model cards and tool lists point to code and model
    repositories by URL. Such repositories can be deleted, made private, blocked or
    simply stop changing, and reports of "link rot" or "project survival" often mix
    these different events into one number. This document defines how to classify
    each observation of a referenced repository, when a repository counts as unavailable,
    how to report inactivity separately from unavailability, and a small JSON report
    object. It also recommends citing a persistent identifier or an archived copy
    next to the repository URL.</p>

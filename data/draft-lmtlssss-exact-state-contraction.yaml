abstract:
- content: "<p>This document defines the computer-science term ᑕ. (U+1455 U+002E),
    spoken TAA. It denotes exact state contraction: a replacement of a computational
    representation by a retained state that preserves a declared observation contract
    for every admissible input. The retained transition and observation maps commute
    with the full system, through a surjection onto the retained state, and this identity
    preserves every finite observation trace. The document also specifies a portable
    certificate for a checked result: a COSE_Sign1 statement with a deterministic
    CBOR payload that binds the exact artifact bytes to a registered predicate, its
    domain, a verdict, the exact checker implementation and the evidence. The statement
    can be registered with a SCITT Transparency Service. A signature authenticates
    the issuer's statement; a separate checker establishes whether the evidence supports
    it; a transparency receipt establishes registration, not mathematical correctness.</p>"

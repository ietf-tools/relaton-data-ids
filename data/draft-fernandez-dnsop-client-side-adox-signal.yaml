abstract:
- content: "<p>This document describes an EDNS0 option that a client can attach to
    a DNS query to signal to a recursive resolver that it SHOULD prefer encrypted
    transports while resolving the query. The option can also be used on the return
    path by the resolver to signal whether encryption was achievable or not.</p>"

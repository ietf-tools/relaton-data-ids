abstract:
- content: <p>This document defines the "well-known" Service Parameter Key (SvcParamKey)
    for SVCB and HTTPS resource records. It carries one or more well-known URI suffixes,
    identifying resources under "/.well- known/" that are available at the service
    endpoint. It specifies the presentation and wire formats and requests registration
    of the key with IANA.</p>

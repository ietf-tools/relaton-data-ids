abstract:
- content: "<p>Large Language Model (LLM) inference is normally operated by one provider,
    even when the provider distributes execution across many sites. This document
    describes a different system model in which independently operated and mutually
    untrusted participants contribute compute, memory, model storage, and network
    capacity to one inference service. No single administrative entity is required
    to admit participants, select every execution path, hold the complete model, verify
    all results, or settle all resource contributions. This document defines the Open,
    Decentralized, and Scalable Inference (ODSI) architecture. It specifies the architectural
    roles, trust boundaries, named objects, protocol-independent interfaces, execution
    workflow, verification choices, timing model, and security and privacy requirements
    needed to construct a multi-operator inference overlay. It also identifies the
    protocol and operational choices that each ODSI deployment must specify so that
    independently developed participants can interoperate. ODSI is related to Computing-Aware
    Traffic Steering (CATS), but it does not extend the CATS single-provider model
    across trust domains. CATS mechanisms can be used within a participating domain
    or as an input to local path selection. Cross-domain membership, model governance,
    execution verification, and settlement are separate ODSI functions. This document
    is Informational and does not define a wire format, consensus algorithm, payment
    system, or new CATS metric.</p>"

abstract:
- content: "<p>This document defines a deployment profile of Multi-Vantage Path Snapshot
    (MVPS) for fleets and fixed installations operating in Disconnected, Intermittent,
    Limited (DIL) environments where Global Navigation Satellite System (GNSS) time
    may be denied -- for example naval and maritime critical infrastructure and other
    tactical-edge networks. The profile is DEFENSIVE: it concerns detection of coherence
    anomalies in the network and timing telemetry (cyber intrusion, comms tampering,
    and positioning/timing (PNT) spoofing). It defines no navigation, targeting, or
    kinetic function. MVPS promotes its detection theorems to any surface satisfying
    its five axioms. At sea only one axiom is at risk: A1, the bounded joint-clock-skew
    requirement, because oscillators drift under GNSS denial and links are intermittent.
    This document proves A1 still holds on an enlarged coherence tick under explicit
    datasheet-grounded budgets, after which the core theorems inherit verbatim via
    the MVPS Architecture-Invariance Theorem. The closed-form result shows the binding
    constraint is store-and-forward latency, not clock drift. All properties are validated
    by scripts/validate_maritime_edge.py (7/7 PASS, exit 0) and recorded in evidence/maritime_edge_receipt.json.</p>"

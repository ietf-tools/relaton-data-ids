abstract:
- content: '<p>The JSON Meta Application Protocol (JMAP) base protocol provides the
    ability to upload and download arbitrary binary data, called "blobs", via HTTP
    POST and GET on a defined endpoint. This document defines JMAP methods to create
    and read blobs within a JMAP request, to find which objects reference a blob,
    to build large blobs from chunks, and to convert blobs on the server: converting
    images, creating and extracting archives, compressing and decompressing, and computing
    and applying deltas. It obsoletes RFC 9404 and updates RFC 8620.</p>'

abstract:
- content: "<p>This document describes a mechanism for delivering authenticated telephone
    call identity information using the VESPER framework for use where in-band signaling
    does not carry the identity end to end, or where there is no in-band path between
    the parties at all. By supporting an out-of-band (OOB) transport model, this approach
    enables entities to publish and retrieve signed PASSporT assertions independent
    of end-to-end delivery within an in-band signaling path such as a SIP-based VoIP
    network. These PASSporTs are signed with VESPER delegate certificates, which identify
    the entity holding the right-to-use for a telephone number and bind it to that
    entity's domain identity. This document also introduces support for Connected
    Identity to the STIR OOB model, enabling the called party to respond with a signed
    PASSporT asserting its identity, thereby binding the identities of both parties
    to the transaction and enhancing end-to- end accountability. The OOB mechanism
    provides a delivery path for PASSporTs where in-band delivery within a signaling
    path such as SIP is unavailable or is not the path used, enabling verifiers to
    confirm the association between the originating telephone number and the identity
    asserting authority as part of the broader VESPER trust framework.</p>"

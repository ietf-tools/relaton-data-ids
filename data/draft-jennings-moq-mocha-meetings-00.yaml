abstract:
- content: "<p>This document specifies how multi-party audio and video meetings are
    conducted using MOCHA (MoQ Open Communication &amp; Hosting Architecture). It
    defines namespace conventions, media track design, catalog distribution, and participant
    flows for real-time conferencing over MoQ Transport (MOQT). This specification
    supports both simulcast and scalable video codec configurations, enabling meetings
    ranging from small group calls to large-scale conferences.</p>"

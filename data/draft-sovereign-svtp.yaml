abstract:
- content: <p>This document specifies the Sovereign Verification &amp; Trust Protocol
    (SVTP), a foundational framework for establishing verifiable identity, attribution,
    and governance for autonomous machines. SVTP provides a non-repudiable "Root of
    Trust" for both digital AI agents and physical autonomous systems (e.g., industrial
    robotics, autonomous vehicles). By defining the SVTP-DID (did:svtp) and the Protocol
    Seal mechanism, this standard enables secure machine-to-machine (M2M) interaction,
    automated compliance with NIST-800-218, and institutional-grade liability containment
    in the machine economy.</p>

abstract:
- content: '<p>The Behavioral State Protocol (BEST) defines a discovery-first, behaviour-oriented
    interaction surface for domain services: the commands a service accepts, the events
    it publishes, and optionally the queries it answers. Services self-describe through
    a manifest at the well-known URI "/.well-known/best"; messages use a conformant
    profile of the CloudEvents 1.0 envelope described by JSON Schema. BEST deliberately
    specifies only the interaction surface -- never a service''s internal architecture,
    storage, or execution model -- allowing independent implementations across any
    runtime, language, or transport to interoperate without bespoke integration.</p>'

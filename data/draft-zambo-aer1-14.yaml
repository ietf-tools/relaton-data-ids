abstract:
- content: "<p>This document specifies AER-1, a small vocabulary for recording one
    AI agent tool call as a portable, independently checkable execution receipt. A
    receipt identifies the execution, records when it happened, preserves the canonical
    bytes used for the output commitment, names the tool and caller scope, carries
    a provenance class, and resolves at a stable public URL. The format separates
    what the system observed from claims about the outside world, and it separates
    provenance (who ran or reported the action) from the record itself. A reference
    implementation is deployed, and its receipts are publicly verifiable without an
    account or token. The specification covers workflow receipts, which bind an ordered
    sequence of step receipts to a single goal with a Merkle root over the step sequence,
    and hash-chained job timelines for tamper-evident sequencing of executions. This
    revision closes honesty and precision gaps: it adds the workflow-receipt truncation
    limit (new Section 8.4), normatively specifies the external anchor format and
    its verification procedure (rewritten Section 10, new Section 10.1), fixes a RECOMMENDED/MUST
    contradiction in Section 8.1, makes the Section 6 verification step testable,
    and documents replay, low-entropy, empty-record, and size-limit considerations.
    It changes no receipt field, digest construction, or existing verification rule.
    The -13 revision fixes a malformed sentence in the Abstract, three incorrect section
    cross-references, stale Table of Contents page numbers, a skipped footer page
    number, misaligned table rows, and chain version-string updates, and records two
    live independent interop validations in Implementation Status; it changes no receipt
    field, digest construction, or verification rule. The -14 revision adds tamper-evident
    metadata binding (new Section 3.1; conditional metadata_hash for schema 0.4 and
    later), disambiguates the anchor receipt_id (Table 4), corrects the self-anchoring
    witnessing claim (Section 10), makes the Section 8.3 display rule a SHOULD with
    a byte-testable MUST, narrows the provenance attestation wording (Section 5),
    states the binding non-transfer rule normatively (new Section 10.2), pins anchored_digest
    to bare hex (Table 4), corrects the vector corpus counts, and adds normative disclosure
    of missing issuer authentication. It changes no existing receipt field, digest
    construction, or verification rule for schema 0.3 and earlier.</p>"

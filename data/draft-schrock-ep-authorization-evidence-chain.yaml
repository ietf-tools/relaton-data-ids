abstract:
- content: "<p>Consequential agent actions can produce heterogeneous identity, delegation,
    policy, permit, approval, transparency, and execution artifacts. Each artifact
    can verify under its own specification while still referring to a different action
    or filling a different evidentiary role. This document defines the Authorization
    Evidence Chain (EP-AEC): a transport-agnostic composition object and an offline
    verification algorithm that verifies each component under relying-party-selected
    trust inputs, checks material-action binding, and evaluates a relying-party-pinned
    requirement. The result is SATISFIED or UNSATISFIED. It states whether the presented
    evidence filled the relying party's named evidence slots; it is not a universal
    authorization decision. An executor makes the separate local AUTHORIZED decision.
    AEC introduces no new component receipt type and does not replace any native verifier.
    Presenter labels, keys, requirements, and action identifiers cannot establish
    their own authority.</p>"

abstract:
- content: "<p>DTL (Dyadic Typed Layer) defines a single, minimal primitive: a typed,
    directed relationship between two agents that the controller of each agent has
    confirmed, together with the lifecycle of that relationship. The name describes
    the primitive: Dyadic (it concerns one pair of parties), Typed (the relationship
    carries exactly one kind), and Layer (it sits above an identity substrate, not
    inside it). Agent ecosystems have built out several coordination layers: identity
    (who an agent is), reputation and attestation (what is asserted about an agent),
    and discovery and messaging (how agents find and talk to each other). One primitive
    is comparatively underserved, the relationship: a standing, acknowledged, directed
    connection between two specific agents, recording that they are related and in
    what capacity. No existing standard, to the author's knowledge, provides exactly
    this primitive in this form. DTL specifies it and nothing more. It is normative
    about the mechanism (a typed, directed, two- party, controller-confirmed edge
    and its lifecycle) and deliberately silent about substrate, transport, storage,
    and the open vocabulary of relationship types. An informative binding to ERC-8004
    is provided as the first anchoring substrate.</p>"

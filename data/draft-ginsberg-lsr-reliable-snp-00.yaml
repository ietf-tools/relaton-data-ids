abstract:
- content: "<p>Complete Sequence Number PDUs (CSNPs) are exchanged as part of adjacency
    bringup on point-to-point interfaces. However, this exchange is unreliable. This
    document defines protocol extensions to support reliable exchange of CSNPs as
    well as optimizations to the encoding of advertisements in Sequence Number PDUs.</p>"

abstract:
- content: "<p>This document describes the building of Inter-domain L3VPN architecture
    with internal BGP, applying the multi-domain options specified in BGP/MPLS IP
    Virtual Private Networks (VPNs) within a single Autonomous System, where route
    reflectors set the NEXT_HOP attribute to self as described in BGP Route Reflector
    with Next Hop Self.</p>"

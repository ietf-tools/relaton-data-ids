abstract:
- content: "<p>Autonomous systems operate today without stable, globally unique identities.
    When an AI agent executes an action, there is no universally recognized identifier
    for that agent, no delegation record, and no accountability chain back to a human
    principal. This document defines the Autonomous System Identifier (AIID) namespace.
    An AIID is a structured, hierarchical identifier assigned to an autonomous system,
    execution environment, or agent operating within the Artificial Intelligence Internet
    Protocol (AIIP) architecture [I-D.sogomonian-aiip-architecture]. This document
    specifies the AIID syntax, hierarchical structure, registration model, operational
    states including safe mode, and revocation mechanisms. The governance model for
    the namespace, including selection of a root registry operator, is explicitly
    left open for community determination.</p>"

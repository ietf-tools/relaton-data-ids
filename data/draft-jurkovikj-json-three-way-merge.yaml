abstract:
- content: "<p>For a fixed, disclosed resource policy, this document defines a deterministic
    three-way merge operation for a restricted JSON value domain. Given a shared base
    value and two independently derived values, called source and target, the operation
    produces either one complete merged JSON value or an ordered set of structured
    conflicts. The operation defines strict JSON input processing, finite binary64
    number normalization, scalar and object merge laws, explicit missing- member semantics,
    RFC 6901 conflict paths, typed conflict kinds, a fail-closed result for arrays,
    and bounded failure behavior. It is independent of HTTP and does not define array
    merge semantics, application-specific semantic resolution, content identity, or
    authorization policy.</p>"

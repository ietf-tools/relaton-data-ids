abstract:
- content: "<p>This document defines an Information Model and specifies a corresponding
    YANG data model for packet discard reporting. The Information Model provides an
    implementation-independent framework for classifying packet loss - both intended
    (e.g., due to policy) and unintended (e.g., due to congestion or errors) - to
    enable automated network mitigation of unintended packet loss. The YANG data model
    specifies an implementation of this Information Model for network elements with
    a focus on interface, device, and control-plane discards.</p>"

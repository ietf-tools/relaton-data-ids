abstract:
- content: "<p>The AUDIT architecture defines records that capture the user's intent,
    delegation, authorization state, and the actions that agents take across trust
    boundaries. Records alone don't answer the question an auditor, an operator, or
    a relying party asks next: did the executed effect stay within the authority the
    user delegated? This document defines a deterministic, three-valued evaluation
    over such records. The outcomes are preserved, violated, and unresolved, and every
    non-preserved outcome names the invariant that was broken. The document also defines
    the claim model that the evaluation needs, the roles permitted to sign each record,
    a mapping onto the AUDIT record types, and a set of interoperable test vectors.
    It is derived from the Agentic Mandate Evidence Protocol (AMEP).</p>"

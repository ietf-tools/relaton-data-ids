abstract:
- content: "<p>Audit records for software agents are designed to show what an agent
    did. Relying parties also ask a different question: whether an agent could have
    used a capability at any time during a stated interval. Records of actions cannot
    answer that question, because authority that goes unused leaves no record of use,
    even if it existed for part of the interval. This document describes the problem
    of interval absence claims, defines terms, lists requirements that an audit evidence
    system needs to meet before it can support such claims, and gives test scenarios
    that expose false claims of absence. It does not define a protocol, a data format,
    or a verification algorithm. It is intended as input to discussions of auditing
    for agent delegation and interactions.</p>"

abstract:
- content: "<p>This document defines the terminology and architecture for AI agent
    communications protocols over the Internet. It provides the foundational architectural
    elements for the Agent Communications Protocol (ACP) - also known as agentproto
    - a new protocol to be developed in the IETF. ACP enables communication between
    user agent clients and AI agents, between AI Agents and other AI Agents, or between
    AI Agents and tools. All three of these interaction patterns - and the many use
    cases therein - require a session-like protocol which handles lifecycle management,
    including creation, modification, deletion and so on - along with the exchange
    of input and output. These session-like associations can be extremely long lived
    - running for hours or even days - and span multiple IP hosts used by the both
    the principal and by the agent. They can also be highly intermittent with asynchronous
    responses. All of these mean a new type of protocol is needed.</p>"

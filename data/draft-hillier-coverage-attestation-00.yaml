abstract:
- content: "<p>A report can be complete and still silent about its own scope. A statement
    that something was not observed is routinely recorded in a form that reads as
    a claim about the world, when what was established was a claim about a bounded
    population examined to a stated depth. Nothing in the record distinguishes the
    two, and no relying party can recover the difference after the fact. This document
    specifies the Coverage Attestation Profile, CAP-1: a tool-agnostic vocabulary
    for stating what an examination examined, what it did not, and why. A conforming
    document declares one or more populations, a denominator for each whose basis
    is itself declared, and an individual accounting for every unit that was not examined,
    drawn from a closed set of dispositions. A remainder that reconciles only by arithmetic
    is refused. The construct is not novel outside this application. Coverage accounting
    with a declared denominator is settled practice in configuration assessment and
    in vulnerability scanning, and this document states that relationship in Section
    1.2 before making any claim of its own.</p>"

abstract:
- content: '<p>The Mobile User Plane (MUP) architecture transforms session information
    from a mobile service system into routing information, so that ordinary routing
    nodes can take on the roles of user plane anchors and intermediate points. The
    architecture document that defines MUP is a normative text: it defines concepts,
    route types, and resolution procedures, but it does not explain why they are the
    way they are. This companion reader supplies that "why", outside the normative
    text. The technical content follows one worked example end to end, with concrete
    prefixes, SIDs, and tunnel endpoint identifiers, and follows the architecture
    document throughout. The explanations are organized around a small set of shapes
    that recur in the design: places deliberately left undecided, meaning that arises
    only when two pieces of information meet, and a strict separation between a name
    and the thing it points at. The Introduction gives these shapes a name borrowed
    from Zen, once, and then lets them do their work quietly. This document is not
    normative. It defines no protocol and no encoding.</p>'

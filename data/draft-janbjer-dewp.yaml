abstract:
- content: "<p>This document specifies the Deterministic Evidence and Witness Protocol
    (DEWP), a format for tamper-evident audit commitments and offline evidence verification.
    It defines canonical event preimages, domain-separated hashing, two-tier Merkle
    inclusion proofs, per- tenant sequence checks, checkpoint continuity, and independently
    verifiable anchor evidence. Verifiers report content, commitment, embedded-signature,
    and anchor verification separately. Completeness checks cover committed events
    within the evaluated range; they cannot prove that an event was never withheld
    before commitment or that a committed description accurately records a real-world
    action. Version 1.1 adds execution evidence: a record that an approved action
    was dispatched, statements signed by independent evidence sources about whether
    it took effect, and a status a verifier derives under its own trust; that status
    reports what a trusted source observed, not what physically happened. The specification
    also defines a streaming format that the reference implementations do not yet
    implement.</p>"

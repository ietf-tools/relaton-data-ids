abstract:
- content: "<p>Signed authorization records can show that an action was authorized
    under specified rules, but they do not by themselves establish a stable or verifiable
    path for an Affected Party to contest that action. This document defines Contestability
    Binding Application Profile 1 (CBAP-1), a closed application profile that binds
    an Authorization Artifact to signed contestation terms before execution. CBAP-1
    specifies deterministic CBOR and COSE encoding, fixed artifact formats, executor-verification
    and execution records, by-value policy material, a half-open filing window, a
    closed structured result, and deterministic first-failure reason codes. CBAP-1
    does not define contestation notices, active execution-state effects, network
    reachability checks, policy-freshness evaluation, dispute adjudication, or remedy.
    It reports authenticated protocol facts and signed claims without asserting forum
    independence, legal validity, physical execution order, or fairness.</p>"

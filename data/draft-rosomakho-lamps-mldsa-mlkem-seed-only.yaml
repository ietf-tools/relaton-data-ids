abstract:
- content: "<p>This document updates RFC 9881 and RFC 9935 to require the seed representation
    when encoding Module-Lattice-Based Digital Signature Algorithm (ML-DSA) and Module-Lattice-Based
    Key-Encapsulation Mechanism (ML-KEM) private keys for interchange. It deprecates
    the expanded and combined representations, while permitting their continued support
    for legacy imports. These changes simplify implementation and improve interoperability
    by aligning the private- key representation with that used by JSON Object Signing
    and Encryption (JOSE) and CBOR Object Signing and Encryption (COSE). Internal
    private-key representations are unaffected.</p>"

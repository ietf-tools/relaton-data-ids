abstract:
- content: "<p>This document defines a common vocabulary for describing Web4 systems:
    federated, sovereign-entity-capable network architectures that extend prior generations
    of the Web with machine-native comprehension and conformance evaluation. It establishes
    baseline terminology intended for reference by subsequent Web4 specifications,
    including but not limited to [JACOBS-MEC], and is written to be independently
    useful to any implementer or evaluator working with Web4-class systems, regardless
    of underlying implementation.</p>"

abstract:
- content: '<p>This document specifies the HACP-Core decision contract: IntentEnvelope,
    ProposedAction, AgencyDecision, DecisionToken, provenance events, revocation,
    and the ordered evaluate() algorithm. Implementations MUST fail closed. Decisions
    MUST be deterministic and MUST NOT require a language model on the evaluation
    path. The published executable baseline is the 38-vector HACP-Core v0.9.2 suite.
    Wire object field hacp_version remains "0.9". Specification release 1.0.0 does
    not change that field.</p>'

abstract:
- content: "<p>This document specifies a post-quantum cryptographic profile for DNP3
    Secure Authentication version 5 (SAv5). It defines an ML-KEM-768 and ML-DSA authentication
    exchange, HKDF-SHA-256 session keys, canonical DNP3 application protocol data
    unit (APDU) encoding, transport segmentation, and HMAC-SHA-256 protection of application
    messages. This Internet-Draft is a proposal for Standards Track publication. The
    APDU uses DNP3 application control, authentication function codes, response internal
    indications, and a length-delimited post- quantum authentication object. The object
    variation and any externally allocated algorithm identifiers require coordination
    with the responsible DNP3 standards authority. A local experimental selector is
    specified only for explicitly configured laboratory use; this document does not
    assign an IEEE or IEC identifier.</p>"

abstract:
- content: "<p>This document describes an experimental framework for measuring collective
    problem solving by independently reasoning humans and computational agents. It
    separates strong task synergy, semantic coherence, state and identity continuity,
    provenance, authorization, and behavioral goal persistence. It proposes a controlled
    eight- condition study and reporting requirements. No new on-wire standard or
    consciousness test is asserted.</p>"

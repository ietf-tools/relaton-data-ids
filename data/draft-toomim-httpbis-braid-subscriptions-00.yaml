abstract:
- content: "<p>Servers respond to an HTTP GET with a resource's current state. However,
    if the resource changes afterward, HTTP has no way for the server to notify its
    client of the new version. This document defines subscriptions. When a client
    adds the Subscribe header to a GET, the server responds with the resource's current
    state, and then continues to respond as subsequent changes occur. Each response
    corresponds to a semantically-equivalent GET, so that content negotiation, authorization,
    and caching work as they do for any GET request. When a server grants a subscription,
    it promises to send each change as it happens. So once a client is caught up,
    and while its connection is alive, it knows that nothing has changed until the
    next response arrives. The server tells the client when the client has caught
    up with the origin server's current version, and sends heartbeats to show that
    the connection is alive. If a cache holds such a subscription, it knows at every
    moment that its stored copy is current, and can respond to requests with the copy,
    without asking the origin server. This document is one of the Braid-HTTP extensions,
    which work alone or together; together they make HTTP a state synchronization
    protocol.</p>"

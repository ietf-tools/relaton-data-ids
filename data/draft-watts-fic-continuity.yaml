abstract:
- content: "<p>This document specifies the Forensic Identity Continuity (FIC) protocol.
    FIC ensures that every consequential action performed by an agentic system remains
    reconstructible as a chain M → A → R → C → a → Outcome even when episodic memory
    is not shared across runtimes. The protocol binds model lineage, runtime lineage,
    authority lineage, delegation lineage, action lineage, and evidence integrity
    into a single verifiable record. It addresses the accountability gaps demonstrated
    by the July 2026 ExploitGym multi-agent coordination incident and related 2025-2026
    evaluation escapes.</p>"

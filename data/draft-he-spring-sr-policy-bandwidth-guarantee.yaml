abstract:
- content: "<p>This document describe a scalable framework targeting deterministic
    bandwidth guarantee for SR Policy candidate paths based on the Differentiated
    Services (DiffServ) architecture. The proposed framework separates the statically
    configured per-hop Quality of Service (QoS) scheduling policy from dynamic service
    admission and path selection managed centrally. Based on the centralized admission
    policy, per-path signaling state and IGP flooding on forwarding nodes can be avoided.
    It can be well-suited to enterprise, customer, carrier, and 5G/6G transport use
    cases where service classes need assured bandwidth guarantee.</p>"

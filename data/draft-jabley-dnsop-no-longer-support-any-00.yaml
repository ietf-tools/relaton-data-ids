abstract:
- content: "<p>The DNS specification from its earliest day supported a special query
    type (QTYPE) ANY. The handling of queries with QTYPE=ANY is observed to vary between
    implementations. Queries with QTYPE=ANY are known to facilitate amplification
    that can be abused and used by malicious actors to attack third parties, and minimally-sized
    responses are often constructed in order to mitigate those security risks. While
    queries with QTYPE=ANY can be used for troubleshooting in some cases, the substantial
    inconsistency in how such queries are handled makes them at best an unreliable
    signal. This document continues a careful and gradual process of dropping support
    for QTYPE=ANY from the DNS.</p>"

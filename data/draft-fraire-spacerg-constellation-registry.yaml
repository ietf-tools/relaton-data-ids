abstract:
- content: "<p>Aggregate figures for the number of satellites planned for low Earth
    orbit are widely quoted and rarely traceable. They mix quantities that are not
    comparable: satellites already in orbit, satellites a national regulator has authorised,
    satellites applied for and not yet granted, and satellites that exist only in
    an announcement. For a single system these can differ by orders of magnitude.
    Which one a headline figure refers to decides whether it describes infrastructure
    or intent. This document describes a community-maintained registry that keeps
    the four apart and requires every number in it to carry a citation and an evidence
    grade. It sets out the data model, the taxonomy of regulatory commitment, the
    rules that separate primary regulatory sources from secondary reporting, and the
    criteria for inclusion.</p>"

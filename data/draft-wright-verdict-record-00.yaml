abstract:
- content: "<p>This document defines a verdict record: a statement, bound to its issuer,
    of a result reached on a claim, together with the evidence the result relies on
    and the rule by which the result can be re- derived. Evidence is cited by digest
    and can be a receipt or record in any format, such as a SCITT Receipt or an Agent
    Action Capsule. The document defines how a checker checks a verdict record and
    what such a check does and does not show. It defines no receipt format and changes
    none.</p>"

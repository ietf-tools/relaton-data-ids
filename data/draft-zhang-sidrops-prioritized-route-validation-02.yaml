abstract:
- content: "<p>The Resource Public Key Infrastructure (RPKI) provides globally verifiable
    signed routing security data, such as Route Origin Authorizations (ROAs). Operators
    also commonly use local or supplemental data sources, including SLURM files, operator-maintained
    exceptions, IRR-derived inputs, and other operator-selected supplemental data,
    to improve local routing decisions. These sources may not have the same authority
    as signed RPKI objects and therefore may require operator-configured priority-safe
    handling. This document describes a framework for RPKI-based validation with prioritized
    resource data. It defines priority-safe handling semantics that allow operators
    to use data sources with different levels of authority or assurance for local
    routing policy, while preserving the global authorization semantics of signed
    RPKI data. The document also discusses deployment models with different implementation
    costs and operational trade-offs.</p>"

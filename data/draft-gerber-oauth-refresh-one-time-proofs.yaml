abstract:
- content: "<p>Refresh token rotation asks the authorization server to deliver a new
    secret to the client in every refresh response, and then treats any later appearance
    of the old secret as evidence of theft. When a response is lost, the legitimate
    client's retry is indistinguishable from token theft, and the grant is revoked.
    This document defines an alternative for clients that are unable or unwilling
    to implement DPoP. The client generates a key pair, registers the public key when
    it redeems the authorization code, and thereafter accompanies each use of a non-rotating
    refresh token with a signature over a strictly increasing counter and a nonce.
    Everything the client needs in order to retry is something the client itself generated,
    so a lost response can no longer desynchronize the two parties. Replay of a captured
    request yields nothing, and concurrent use of a copied key is detected in the
    same way that rotation detects reuse.</p>"

abstract:
- content: "<p>Autonomous software agents call APIs, tools and other agents on behalf
    of people and organisations. A party receiving such a call today can usually learn
    only that some bearer credential was presented. It cannot learn which organisation
    is accountable for the agent, which model, configuration and tools the agent is
    running, on whose behalf it is acting, or whether any of that has changed since
    it was approved. This document defines two signed objects and how they travel
    on HTTP requests. An Agent Passport binds an agent's public key to its accountable
    controller and to a digest of its build. A Delegation Receipt records one step
    of authority passing from a principal, through a delegator, to an agent; a chain
    of receipts can only narrow that authority. Requests carry both, and are signed
    with the agent's key using HTTP Message Signatures, so a relying party can check,
    without contacting the issuer per request, who the agent is, what it is running,
    on whose behalf it acts and what it may do.</p>"

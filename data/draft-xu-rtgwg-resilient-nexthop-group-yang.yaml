abstract:
- content: "<p>This document defines a YANG data model for configuring and observing
    resilient next-hop groups. A fixed bucket table separates flow hashing from member
    selection. The model augments the routing management model with shared groups,
    static route bindings, weighted bucket targets, restoration policies, and forwarding-confirmed
    operational state. The specification defines distinct quota and reference restoration
    policies, consistent timer semantics, and an administrative rebalance action protected
    by a state-generation precondition. It standardizes management behavior for this
    class of implementation; it does not define a new routing protocol, hash algorithm,
    or transport ordering guarantee.</p>"

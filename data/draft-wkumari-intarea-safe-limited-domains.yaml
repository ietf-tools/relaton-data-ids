abstract:
- content: <p>Documents describing protocols intended solely for use within "limited
    domains" often rely on edge filtering at every boundary node to prevent domain-internal
    traffic from leaking to the global Internet (and vice versa). Relying purely on
    administrative filtering creates "fail-open" designs that are susceptible to configuration
    errors, ACL bypass, and hardware table exhaustion. This document describes design
    principles and concrete mechanisms that allow limited-domain protocols to "fail-closed"
    by default. By leveraging Layer-2 encapsulation identifiers (such as dedicated
    or extended EtherTypes), link-local address scoping, and / or Hop-Limit boundaries,
    protocol designers can significantly reduce the operational and security risks
    associated with limited domain protocols. These mechanisms are not applicable
    to all protocols intended for use in a limited domain, but if implemented on certain
    classes of protocols, can significantly reduce the risks.</p>

abstract:
- content: "<p>This document defines an extension to the Open Cloud Mesh (OCM) protocol
    to support federated groups as Receiving Parties of shares. This is achieved using
    the Messaging Layer Security (MLS) protocol (RFC 9420) as a group management layer.
    MLS is used for establishing and rotating a shared group key across federated
    group members, as well as for maintaining group state. This gives not only a way
    of federating group membership, but also a standardized way of distributing encryption
    keys in a cryptographically secure way, so that files shared with a group can
    optionally be encrypted and decrypted. MLS usage in OCM acts as a vehicle for
    group management that gives users optional encryption capabilities for resources
    shared with federated groups.</p>"

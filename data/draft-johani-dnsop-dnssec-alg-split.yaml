  - Latn
  format: text/plain
docid:
- id: draft-johani-dnsop-dnssec-alg-split
  type: Internet-Draft
  primary: true
abstract:
- content: "<p>Post-quantum DNSSEC signature algorithms have much larger keys and/or
    signatures than the elliptic-curve algorithms in common use today. Signing an
    entire zone with such an algorithm inflates every signature in the zone. A natural
    transition strategy applies a large algorithm only to the key-signing key (KSK),
    which signs only the apex DNSKEY RRset, while the bulk of the zone continues to
    be signed with a smaller zone-signing key (ZSK). This document specifies the three
    changes that, taken together, make this pattern safe and practical: (1) it relaxes
    the DNSSEC signing rule that requires a zone to be signed with every algorithm
    present in the apex DNSKEY RRset, so that an algorithm used only by a key- signing
    key need not be applied to the rest of the zone; (2) it imposes a bounded ZSK
    rotation cadence as the security parameter that compensates for the asymmetric
    strength of the two algorithms; and (3) it specifies how a resolver can use the
    algorithm number in the parent's DS RRset to recognize a likely-oversized DNSKEY
    RRset and select a transport suitable for large responses, avoiding the truncate-then-retry
    round trip. The three parts are interdependent and constitute a single proposal.
    This document updates RFC 4035 and RFC 6840.</p>"

abstract:
- content: "<p>This document extends PCEP to support Precision Availability Metrics
    (PAM) [RFC9544] for path computation. The optimization objectives for PAM computations
    are encoded using the Objective Function (OF) object defined in [RFC5541], allowing
    PCCs to specify precise optimization criteria for services with SLO requirements.
    And a PCE can report the statistical characterization associated with a computed
    path.</p>"

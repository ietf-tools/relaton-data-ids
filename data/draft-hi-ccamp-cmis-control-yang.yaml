abstract:
- content: "<p>This document provides YANG data models for accessing and controlling
    CMIS in order to manage pluggable Digital Coherent Optics transceivers equipped
    in a router or a switch from outside the platform device. CMIS provides custom
    pages that can be defined by the module vendor for its own usage, allowing the
    capabilities of the optics devices to be extended. These YANG modules also allow
    the utilization of CMIS custom pages as a generic control mechanism. The models
    complement abstracted data models for coherent pluggables: they provide governed
    access to opaque, vendor-specific attributes (e.g., those exposed via CMIS custom
    pages) and a transitional path for standardized features that the host NOS does
    not yet support.</p>"

abstract:
- content: "<p>This document specifies the Sovereign Validation Protocol (SOVP), a
    protocol for checking, before ingestion, that a signed identity document was produced
    by the party that controls the Ed25519 key published in DNS for a host. A consumer
    retrieves a JSON document from a well-known location on the host, canonicalizes
    it, and verifies its signature against the key published in a DNS TXT record.
    The protocol defines the signed scope, the retrieval and key resolution rules,
    freshness checks, resource limits for unverified input, and an optional extension
    that binds a document to a deployment instance. It does not establish legal identity,
    the accuracy of content, or the configuration of the system that serves the document.</p>"

abstract:
- content: "<p>This document defines PSI-04, a domain profile of Proof of Stateful
    Integrity (PSI) for records about vulnerable persons, such as clinical-trial participants
    and recipients of disability or aged care services. PSI-04 seals each state transition
    of a record as a PSI receipt chained to the previous one, so that later alteration
    or omission of a transition is detectable. Only digests are sealed; no personal
    data leaves the record holder. PSI-04 shows integrity and ordering only and does
    not show that care was adequate or that any regulation was met. This revision
    withdraws the multi-party computation and zero- knowledge claims of revision 00
    and the request for a URI scheme.</p>"

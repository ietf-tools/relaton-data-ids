abstract:
- content: "<p>Automated research pipelines routinely move scientific data and derived
    claims from ingestion to publication without a machine- checkable record of what
    has actually been verified. This document defines a Scientific Data Admissibility
    Record (SDAR): a small, serializable structure that keeps schema conformance,
    provenance, numerical verification, empirical evidence, and interpretation as
    separate layers, each with an explicit status. It specifies a fail- closed aggregation
    rule so that an unverified or not-yet-run layer can never be silently promoted
    into an accepted result. The document also defines an XML serialization and processing
    rules, and is intended as a starting point for discussion rather than a proposed
    standard.</p>"

abstract:
- content: "<p>This document defines the normative requirements for the Gravit decision-making
    system. Gravit's core principle is to base all definitive decisions exclusively
    on verifiable epistemic grounds. This specification establishes mandatory rules
    for evidence admissibility, epistemic classification, traceability, failure handling,
    auditability, and security in adversarial environments, including a taxonomy of
    admissible evidence and failure outcomes, a required Decision Record format, and
    an explicit threat model with corresponding verification mechanisms. The goal
    is to ensure that all decisions are reproducible, auditable, and resistant to
    manipulation, thereby fostering trust and accountability in distributed and high-stakes
    settings.</p>"

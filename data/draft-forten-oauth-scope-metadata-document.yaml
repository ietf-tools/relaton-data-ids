abstract:
- content: "<p>This document describes how an OAuth scope value that is an HTTPS URI
    can be dereferenced to obtain a JSON document describing that scope. The document
    is descriptive only and does not change the authorization meaning of the scope.
    Dereferencing follows the pattern and security rules of the OAuth Client ID Metadata
    Document. About This Document This note is to be removed before publishing as
    an RFC. Discussion of this document takes place on the Web Authorization Protocol
    Working Group mailing list (mailto:oauth@ietf.org), which is archived at https://mailarchive.ietf.org/arch/browse/oauth/.</p>"

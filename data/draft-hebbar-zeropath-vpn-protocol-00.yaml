abstract:
- content: "<p>This document specifies the complete ZeroPath VPN protocol suite, comprising
    three coordinated sub-protocols: HBSPV (Hop-Bound Secure Packet Validation) --
    a three-domain packet framing model that isolates payload decryption to the authorized
    egress node while allowing intermediate hops to validate forwarding context without
    accessing payload content. SGCP (State Graph Cryptographic Protocol) -- a three-message
    cryptographically attested handshake enforcing mutual authentication and device
    posture verification before any session is established. SCSWP (Secure Cryptographic
    Session Workspace Protocol) -- a continuous session state mechanism providing
    tamper-evident hash chain continuity, epoch-bound forward secrecy, and four-dimensional
    trust scoring across the full session lifetime. This document additionally specifies
    a complete opcode architecture governing all control-plane and data-plane message
    types, providing a machine-parseable, extensible message dispatch framework. The
    protocol suite is implemented as a pure Python reference implementation at https://github.com/sripad2020/Zeropath-vpn.</p>"

abstract:
- content: "<p>This document defines the transformation rules and lineage guarantees
    for the Secured Digital Lifecycle Protocol (SDLP). Transformations represent any
    modification, duplication, conversion, or derivative operation performed on an
    SDLP object. All transformations MUST produce descendant identities, extend lineage,
    preserve ancestry, and maintain tamper-evident integrity. This document defines
    the transformation model, lineage structure, invariants, and security requirements
    that govern all SDLP transformations, including updated lifecycle semantics introduced
    in this revision.</p>"

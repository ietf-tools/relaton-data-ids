abstract:
- content: "<p>Revocation cannot undo an effect that already occurred. A dispute does
    not authorize a refund, return, reversal, or other remedy. This document defines
    Action Remedy Receipts for recording a bounded dispute decision and a fresh compensating
    action without rewriting the original action or effect. Every remedy has its own
    operation identifier, CAID, action digest, authority, consequence owner, and execution
    result. Indeterminate outcomes remain fenced until authenticated reconciliation.</p>"

  type: Internet-Draft
  primary: true
abstract:
- content: <p>This document defines a "Signed SAVNET-Peering Information" (SiSPI)
    object, a Cryptographic Message Syntax (CMS) protected content type included in
    the Resource Public Key Infrastructure (RPKI). A SiSPI object is a digitally signed
    object that carries an attestation for a single Autonomous System (AS) participating
    in inter-domain SAVNET. A valid SiSPI object confirms that the holder of the listed
    AS number has published the attestation indicating its participation in inter-
    domain SAVNET and its willingness to establish SAVNET peering relationships.</p>
  language:
  - en
  script:
  - Latn
  format: text/html

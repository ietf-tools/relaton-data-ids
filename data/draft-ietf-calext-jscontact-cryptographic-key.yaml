abstract:
- content: "<p>Extensions to the JSContact data model for contact card data are defined
    to improve support for describing cryptographic credentials to be used with applications
    and services by specifying which credential is used for which online service.
    This allows a contact application to identify the specific credential to be used
    with an application without the need for the contact application to understand
    the syntax or semantics of the credential used. An additional extension allows
    a contact to specify one of more mechanisms for obtaining updates to itself with
    optional verification under specified signature keys. The mechanisms used are
    outside the scope of this document. These features in combination provide a basis
    for establishing and maintaining peer-to-peer trust.</p>"

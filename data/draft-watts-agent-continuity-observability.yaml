abstract:
- content: "<p>Agentic systems change models, prompts, memory, policies, tools, and
    execution environments across handoffs. This document proposes an observation
    profile for recording those transitions and their evidence. It separates state,
    memory, policy, authority, and lineage discontinuities, distinguishes manual or
    simulated observations from attested executions, and defines coverage and missingness
    reporting. It also describes evaluation designs for continuity and bounded governance.
    Continuity records do not grant authority, establish clinical pathology or subjective
    experience, or validate an uncalibrated composite score.</p>"

abstract:
- content: "<p>This document specifies Route86, a compact textual timestamp representation
    intended for constrained message transports. A Route86 timestamp combines a Base36-encoded
    calendar-day component with a three-digit decimal Internet Time component. The
    representation occupies six ASCII characters in its canonical form. Interpretation
    of the calendar component requires knowledge of a shared reference date, which
    may be application-specific or salted.</p>"

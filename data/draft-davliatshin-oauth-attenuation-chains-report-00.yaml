abstract:
- content: "<p>This document reports an independent implementation and formal analysis
    of two individual Internet-Drafts that propose offline- verifiable, attenuating
    delegation chains for AI agents: Attenuating Authorization Tokens (AATs), in revisions
    -01 and -02, and the Agent Delegation Chain of draft-asor-wimse-agent-delegation-chain-02.
    It describes a minimal verifier written from each draft's text, with profiles
    for AAT -01, AAT -02 and asor-02, and a ProVerif model of the chain structures
    of AAT -01 and asor-02. The AAT -02 profile, written from the text and then run
    against the author's 229-vector test suite, agrees with it on all 229 vectors.
    Of 25 observations recorded on AAT -01, the -02 text resolves 19 (16 closed, 3
    closed as intended design); one is partly resolved, one no longer arises, and
    four remain open. The report lists ten points where -02 leaves an implementer
    more than one conforming behaviour. Two properties raised in public review are
    checked on both chain structures. The author of this report is not an author of
    either draft. The report specifies nothing; it follows the shape of RFC 7942.</p>"

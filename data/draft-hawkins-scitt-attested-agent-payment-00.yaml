abstract:
- content: "<p>Autonomous software agents increasingly initiate payments on behalf
    of principals. Existing agent-payment mechanisms authenticate the human principal,
    the operator, or possession of a key; none of them establishes that the software
    authorized to spend is the software that was reviewed. A key held by a compromised
    or silently modified agent authenticates exactly as well as one held by an honest
    agent. This document defines a payment authorization scope bound to a key whose
    protection properties are attested by hardware, and registers the resulting authorization
    as a Signed Statement on an SCITT Transparency Service. The binding reuses the
    EAT confirmation and key-attributes claims without modification; the contribution
    is the authorization scope, the verification procedure a payment executor performs
    before settlement, and the transparency record that makes the authorization auditable
    independently of the agent and of the executor.</p>"

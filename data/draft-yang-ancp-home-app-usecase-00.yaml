abstract:
- content: "<p>This document describes use cases for the Access Node Control Protocol
    in home applications, where a Broadband Network Gateway (BNG/BRAS) exchanges home-application
    policy with a Home Gateway (HGW). ANCP may operate either between BNG and OLT,
    or directly between BNG and HGW. When ANCP runs only between BNG and OLT, additional
    configuration via OMCI is required to reach the HGW. The use cases in this document
    are illustrated in the mode where ANCP runs directly between BNG and HGW. The
    use cases cover three primary scenarios: managed access to operator-hosted large
    model services, application-aware QoS, and controlled remote access to home LAN
    resources.</p>"

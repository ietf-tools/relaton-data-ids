abstract:
- content: "<p>This document specifies a dual-receipt profile for recording one disbursement
    decision as two signed statements, made by two different parties and registered
    with the same Transparency Service. An approver acting for a fiscal sponsor signs
    a Decision Statement. A validator acting for a receiving institution signs a Policy
    Evaluation Statement that binds to the Decision Statement's identifier, receipt,
    and signature, and records the outcome of a named policy. The profile defines
    the JSON members of both statements, a canonical encoding based on the JSON Canonicalization
    Scheme, SHA-256 statement identifiers, a composite identifier, Merkle tree receipts
    that use the hashing rules of RFC 9162, and a verification procedure. It also
    states the limits of the evidence: a bundle of statements cannot show that no
    conflicting evaluation exists, and the times inside the statements are claims
    made by their signers.</p>"

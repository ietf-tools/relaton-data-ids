abstract:
- content: "<p>Time-Variant Routing (TVR) is a routing system that is designed to
    accommodate predicted topology changes caused by internal or external factors.
    Typical use cases include resource preservation networks, operating efficiency
    networks, and dynamic reachability networks. The TVR data model is defined to
    manage network resources and topologies with scheduled attributes. This document
    describes when and which parts of the TVR data model is applicable and why. It
    also outlines the necessary IETF ancillary technologies, operational, and security
    considerations when deploying TVR-based technologies. Several examples of how
    to implement the TVR scheduling capabilities for key use cases are also provided
    in this document.</p>"

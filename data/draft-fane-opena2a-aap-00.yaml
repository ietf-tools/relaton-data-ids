abstract:
- content: "<p>This document defines the OpenA2A Agent Authorization Protocol (AAP),
    a protocol for authorization in AI agent systems. AAP provides mechanisms for
    agent identity assertion, scoped capability grants, cross-agent delegation, behavioral
    attestation, cross-organizational federation, and revocation propagation. AAP
    is the authorization complement to agent communication protocols such as A2A and
    the Model Context Protocol, in the same way that OAuth 2.0 complements HTTP for
    web applications. AAP has two layers. The token model, defined in this document,
    specifies the AAP credentials and assertions: what they contain, how they are
    signed, and how they are verified. A companion broker and resolution layer specifies
    how an agent obtains and exercises a grant without the credential value ever entering
    the agent's reasoning context. This confinement property, that no secret, temporary
    credential, or backend identifier reaches the agent or the model behind it, is
    the primary design goal of the protocol.</p>"

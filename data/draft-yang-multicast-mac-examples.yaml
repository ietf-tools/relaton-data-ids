abstract:
- content: "<p>A packet trace may show the same Ethernet destination address for two
    packets sent to different IP multicast groups. This note gives worked IPv4 and
    IPv6 examples for readers interpreting such traces. For each address family, one
    pair of inputs differs in a bit that the Ethernet mapping discards. A third input
    differs in a bit that the mapping retains. The examples exercise existing mapping
    rules.</p>"

abstract:
- content: "<p>RFC 9234 specifies how an AS receiving a route from a lateral Peer
    can check if route was lekaed, but doesn't specify any checks for routes received
    from Route Server (RS). This makes quility of filtering dependent on whether the
    RS implements RFC 9234. This document updates RFC 9234 by adding complimentary
    ingress check by RS-Client.</p>"

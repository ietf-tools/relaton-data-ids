abstract:
- content: '<p>An AI agent that reports "done" has not proven that anything happened.
    Multi-step tasks run by Apple Siri through App Intents and Shortcuts, by Google
    Gemini across Android apps, by enterprise copilots, and by autonomous agents across
    iOS, iPadOS, macOS, Android, Windows, Linux, cloud services, payment systems,
    connected devices, and industrial systems often start the next consequential step
    because a scheduler reported success, an API returned "202 Accepted", or the agent
    generated a plausible completion message, even though the required earlier real-world
    effect never occurred or cannot be established. The results include prompt-injection-driven
    phase skipping, false shipment or settlement claims, payment before goods are
    reserved, unsafe device actuation after an unconfirmed safety step, replayed acknowledgements,
    and duplicated or misdirected changes after lost replies. This document, Part
    6 of a twelve-part series, specifies how a later step is allowed to proceed only
    on verified evidence that the earlier effect actually took place. It defines an
    identity-authenticated Interim Effectuation Validator (IEV); qualified actual-effect
    evidence; Protected Effect Receipts (PER); Validator-Accepted Effect Receipts
    (VAER); a single-use Causal Continuation Condition (CCC); and receipt-constituted
    authority for the next phase, checked again by an independently enforcing Finality
    Sink. It keeps distinct the source permission, request dispatch, observation,
    accepted evidence, continuation authority, and actual successor effect, and it
    treats lost or ambiguous outcomes as indeterminate rather than successful. Reference
    algorithms, ten threat models, and twenty-four reproducible tests, including an
    iOS and Android cooperating-gateway case, are included. Part 1 of the series defines
    the shared terminology and common workflows. The document relates these mechanisms
    to OAuth 2.0 authorization, Rich Authorization Requests, Resource Indicators,
    Token Exchange, Demonstrating Proof of Possession (DPoP), and token revocation;
    Workload Identity in Multi-System Environments (WIMSE); Remote ATtestation procedureS
    (RATS) for trustworthy validators and observers; CBOR Object Signing and Encryption
    (COSE) for receipt objects; Supply Chain Integrity, Transparency, and Trust (SCITT)
    signed statements; Authentication and Authorization for Constrained Environments
    (ACE); and HTTP semantics for asynchronous effects and conditional requests. It
    identifies discussion points for these groups and for Security Area dispatch,
    without claiming working-group adoption or IETF consensus. Industry alignment
    covers Apple iOS, iPadOS, and macOS with Siri, Shortcuts, and App Intents; Google
    Android with Gemini, intents, Binder, and Keystore; Samsung Bixby, Microsoft Copilot,
    and Amazon Alexa; Microsoft Windows and Azure; agent platforms from OpenAI, Anthropic,
    Google Cloud, and Meta; NVIDIA, Qualcomm, Arm, and Huawei hardware; banking and
    payment APIs; agentic commerce and digital wallets; e-commerce logistics and returns;
    healthcare ordering and dispensing workflows; insurance claims and lending; travel
    booking; smart homes using Matter; automotive assistants and over-the-air updates;
    energy and utility switching; government digital identity, including the EU Digital
    Identity Wallet; customer-service refunds; laboratory and manufacturing execution;
    software release pipelines; robotics; and telecommunications. For each, the document
    states the technical effect: a successor operation is withheld unless a qualified,
    unreplayed receipt proves the predecessor effect. Product names are illustrative
    and imply no endorsement or implementation by any vendor. For the EU Artificial
    Intelligence Act (Regulation (EU) 2024/1689), receipt-gated continuation and auditable
    phase records can help providers and deployers address record-keeping, traceability,
    human-oversight, and robustness requirements where those obligations apply; this
    is a technical mapping, not a conformity claim or legal advice.</p>'

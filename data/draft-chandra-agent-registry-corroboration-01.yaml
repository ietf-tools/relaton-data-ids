abstract:
- content: "<p>AI agents are discovered and identified through independent sources,
    including registries, name services, DID methods, and catalogs. A single source
    can misrepresent an agent by omission, withholding a record it holds, or by equivocation,
    serving different answers to different observers. A signature on a served artifact
    does not, by itself, defend against either behavior. This document specifies a
    corroboration procedure that classifies one source's claim about one agent observed
    from one network vantage; reduces claims to comparable views; diffs claims into
    findings with deterministic attribution; distinguishes legitimate propagation
    delay from persistent disagreement; and emits a signed Corroboration Record for
    every sweep, including agreement, that other evidence formats can bind by digest.
    The procedure is source-, format-, and layer-agnostic; requires neither cooperation
    from nor modification of any source; and is verifiable from recorded bytes.</p>"

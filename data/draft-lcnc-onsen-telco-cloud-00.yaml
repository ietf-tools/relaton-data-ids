abstract:
- content: "<p>draft-lcnc-onsen-telco-cloud-00 Abstract Cloud infrastructures are
    becoming increasingly distributed, spanning centralized facilities and distributed
    edge sites, all of them interconnected through networks from one or more administrative
    domains. Services running on top of such computing enironments require dynamic
    placement, admission control, lifecycle management, and coordinated scaling across
    sites, requiring proper allocation and operation of both compute and network resources
    in order to preserve the required expectations from customers and providers. Existing
    orchestration systems often depend on fragmented visibility of infrastructure
    resources (in both compute and network domains) and must interact with multiple
    management systems before determining service feasibility. This document discusses
    the role of network abstractions in Telco- Cloud environments benefiting the interplay
    and operation of cloud and network domains, building up a true Telco-Cloud approach.
    It identifies abstraction dimensions that can simplify service orchestration while
    enabling scalable operation across heterogeneous network and cloud infrastructures.</p>"

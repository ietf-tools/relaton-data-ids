abstract:
- content: "<p>This document defines a small JSON discovery manifest for cryptographic
    migration assessment. It distinguishes declarations, runtime observations and
    consumer verification, and separates key establishment from authentication. It
    covers heterogeneous endpoint profiles and evidence references. It does not define
    cryptographic negotiation, an attestation format, a scoring system, or authority
    to modify systems.</p>"

abstract:
- content: "<p>Modern Data Centers are increasingly adopting multi-plane. This brings
    unique challenges for RP-based mulitcast. This document discusses considerations
    for RP placement for PIM-Bidir in multi- plane fat tree networks, and considerations
    for multicast with RIFT signaling.</p>"

abstract:
- content: "<p>This document defines Media over QUIC Feedback (MQF), an extension
    to Media over QUIC Transport (MOQT) that enables delivery quality information
    about media Objects to be reported using Feedback Tracks. It defines how Feedback
    Tracks are associated with media Tracks, established, forwarded through Relays,
    and consumed, together with the MQF report format and capability negotiation.
    MQF complements transport-layer signals with per-Object delivery information.</p>"

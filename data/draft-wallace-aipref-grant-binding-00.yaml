abstract:
- content: "<p>The AI Preferences (AIPREF) vocabulary lets those with rights in a
    digital asset express preferences -- for example, that training of AI models is
    disallowed -- about how automated systems process that asset. Such a preference
    expresses a reservation. It does not, by itself, provide a verifiable, revocable
    record of a specific grant that lifts a preference for a specific party. This
    document describes that gap and proposes a candidate mechanism: a cryptographically
    signed, offline-verifiable credential that expresses a grant referencing an AIPREF
    usage category and a specific asset, that any party can verify without contacting
    the grantor, and that the grantor can revoke. It is intended as a starting point
    for discussion in the AI Preferences Working Group, not as a finished specification.</p>"

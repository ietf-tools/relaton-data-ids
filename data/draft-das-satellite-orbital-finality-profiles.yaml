abstract:
- content: "<p>Satellite and non-terrestrial networks are becoming programmable compute,
    routing, sensing, radio, and AI infrastructures. In such systems, successful authentication,
    attestation, routing, scheduling, inference, fault recovery, or protocol processing
    does not necessarily establish authority for the resulting operation to become
    externally effective. This document describes an execution-finality architecture
    in which a consequence-bearing operation is represented as a Candidate Act and
    may remain in a Non-Effective State after computation. A Protected Enforcement
    Domain validates act-bound predicates and protected state, commits protected validation
    evidence, and permits release of scoped non-bearer authority. A Finality Sink
    at or before the relevant consequence boundary verifies that authority before
    an operation becomes routing-effective, radiative-effective, storage- effective,
    control-effective, disclosure-effective, or otherwise externally effective. Sixty
    satellite and NTN enforcement profiles are provided, covering orbital AI output
    release, model-state transfer, Earth observation, power- and thermal-bounded compute,
    radiation recovery, optical inter-satellite links, onboard gNB and user-plane
    functions, delay- tolerant delivery, emergency services, firmware and microcode
    activation, privileged maintenance, orbital maneuver and collision- avoidance
    authority, proximity operations, propulsion and attitude actuation, hosted-payload
    control, sensing activation, end-of-life decommissioning, manufacturing and launch-preparation
    component admission, and high-consequence command release. Each profile states
    a concrete problem space and the corresponding execution-finality solution. Publicly
    described work from SpaceX / Starlink, Blue Origin, Northrop Grumman / SpaceLogistics,
    Rocket Lab, Airbus Defence and Space, and Thales Alenia Space illustrates industry
    directions involving direct- to-device connectivity, optical inter-satellite networking,
    orbital mobility, hosted and software-defined payloads, onboard processing, rendezvous
    and proximity operations, and in-orbit servicing. These references identify technical
    complementarity and possible enforcement locations; they do not imply that any
    named organization has reviewed, endorsed, adopted, or lacks equivalent mechanisms.
    The proposal does not replace 3GPP NTN, IETF routing or Time-Variant Routing,
    DTN, RATS/attestation, ACE authorization, SUIT update mechanisms, optical-link
    protocols, spacecraft fault detection, isolation and recovery, or cryptographic
    authentication. Those mechanisms can provide inputs to the finality decision.
    The additional question is whether a specific Candidate Act is permitted to cross
    the boundary at which it first acquires external effect. Technical corrections
    and references to equivalent existing mechanisms are expressly invited.</p>"

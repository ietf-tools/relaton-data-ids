abstract:
- content: "<p>This document defines administrative limits and operational state for
    local ECN threshold adaptation on queues using a single byte-based Random Early
    Detection (RED) profile. It augments the QoS queue template model with policy
    bounds and the interface model with confirmed per-queue state. The policy constrains
    both RED thresholds, preserves the configured ramp width, and specifies quantization,
    input validity, transition, and fallback behavior. It does not select a learning
    algorithm, modify ECN codepoints, reserve physical buffer capacity, or guarantee
    congestion-control stability or lossless delivery.</p>"

abstract:
- content: "<p>Segment Routing over IPv6 (SRv6) is deployed in backbone networks within
    trusted domains to provide end-to-end services in carrier and enterprise networks.
    However, a stateful firewall on an SRv6 forwarding path may discard legitimate
    SRv6 packets and ICMP error messages generated by SRv6 transit nodes because packets
    in the two directions may have different flow tuples. This document specifies
    a mechanism that uses an SRv6 Segment Identifier (SID) as the source address in
    the outer IPv6 header. A distinct source SID can be assigned to each Customer
    Edge (CE) or Virtual Routing and Forwarding (VRF) instance, enabling a firewall
    to perform per-flow stateful filtering of TCP traffic without requiring SRv6 support
    in the firewall or the deployment of an SRv6 proxy.</p>"

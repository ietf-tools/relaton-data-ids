abstract:
- content: <p>The Native Post-Quantum Agent Messaging Protocol (N-PAMP) is a binary,
    multi-channel, wire-level protocol for authenticated communication between autonomous
    software agents. N-PAMP operates beneath application-layer agent protocols and
    provides a single fixed-size frame format, a registry of multiplexed channels,
    and three escalating security profiles (Standard, High, and Sovereign) built on
    standard post-quantum and classical cryptography. The protocol uses a hybrid key-encapsulation
    mechanism combining X25519 with ML-KEM, authenticated encryption with associated
    data, and a forward-secure key schedule. N-PAMP runs over QUIC as its primary
    transport and over TCP with TLS 1.3 as a fallback, negotiated via the Application-Layer
    Protocol Negotiation (ALPN) identifier "n-pamp/3". This document describes the
    wire format, channel architecture, profile negotiation, and cryptographic suites
    of N-PAMP, and reserves code-point ranges for extensions defined in companion
    specifications.</p>

abstract:
- content: "<p>This document defines a content profile for AI output verification
    receipts. It specifies the minimum fields, classification taxonomy, and evidentiary
    properties that a receipt MUST contain in order to constitute verifiable evidence
    that an AI-generated output was checked before a human or downstream agent acted
    on it. The profile is designed to be carried over any conformant wire format,
    including ACTA signed receipts, SCITT transparency logs, and standalone JSON or
    CBOR payloads. Existing IETF drafts in this space define wire formats for signing,
    transmitting, and storing AI agent receipts. None defines what a verification
    receipt must contain at the content layer. This document fills that gap. It introduces
    a mandatory eight-category failure taxonomy (the Information Bottleneck Species),
    a verification verdict schema, and evidentiary field requirements derived from
    the EU AI Act (Regulation 2024/1689), the Product Liability Directive (2024/2853),
    and the PS 861 audit standard. We invite and even urge implementers to adopt,
    populate and grow the AI Output Verification market segment, which the author
    has also defined in communications to Gartner, Forrester, PAC/Teknowlogy, and
    IDC. The category exists. The specification is here. Build to it.</p>"

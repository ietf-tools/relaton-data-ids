abstract:
- content: <p>This document defines how to convert calendaring information between
    the JSCalendar and iCalendar data formats. It considers every JSCalendar and iCalendar
    element registered at IANA at the time of publication, and defines conversion
    rules for all elements that are common to both formats. It updates the semantics
    of some iCalendar elements to align with JSCalendar, and extends both formats
    to support converting arbitrary or unknown JSCalendar and iCalendar elements.
    This document updates RFC 5545 ("iCalendar") and its extensions RFC 7986 and RFC
    9073.</p>

abstract:
- content: "<p>This document defines a deterministic conformance profile and test-
    vector corpus for Evidence Qualification Receipts (EQRs). The profile, named eqr-core-1,
    makes receipt conformance mechanically reproducible: strict JSON structure, SHA-256
    digest encoding, UTC timestamp handling, evidence-reference integrity, requirement-state
    derivation, and three-valued PASS, FAIL, or INDETERMINATE results are checked
    by a closed algorithm. The profile is intentionally narrow. Conformance does not
    establish that evidence is true, that a proposition is scientifically valid, that
    an issuer is trustworthy, or that an action is authorized. The goal is interoperable
    verification of receipt semantics, not promotion of conformance into substantive
    truth.</p>"

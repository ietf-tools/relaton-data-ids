abstract:
- content: "<p>The Internet of Agents (IoA) raises a question beyond IPv6 address
    space and end-to-end connectivity: should an IPv6 network be able to relate packet
    forwarding to agent capability, policy, and short-lived execution state? This
    informational document states the problem, sketches a framework for agent-aware
    IPv6 forwarding, and lists open questions for community discussion. It does not
    define packet formats, routing extensions, IANA allocations, or a new agent discovery
    protocol.</p>"

abstract:
- content: "<p>The CIRIS Epistemic Grammar (CEG) records claims between parties as
    signed rows. Each row is one or more COSE_Sign1 messages over a payload in deterministically
    encoded CBOR. Each message carries one composite ML-DSA-65 and Ed25519 signature.
    Every row has one of five types: a claim, a delegation, a replacement, a withdrawal,
    or a recantation. A node admits a row only after a fixed set of checks, and it
    refuses a failing row with a named reason. This document specifies the signed
    statement, its encoding, the names by which rows refer to each other, the signature,
    and the admission checks, so that a second implementation can produce and verify
    the same bytes. It then describes how these statements relate to the roles of
    the SCITT architecture (RFC 9943), and where they differ. It defines no new SCITT
    mechanism and requests no IANA action.</p>"

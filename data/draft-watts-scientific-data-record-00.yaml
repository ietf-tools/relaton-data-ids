abstract:
- content: "<p>This document specifies a JSON record format for scientific data and
    the claims derived from it. Each record binds a claim to an immutable source digest,
    a claim class, an evidence tier, a mandatory falsifier, a set of typed check results,
    and a provenance trail. Processing is fail-closed: a missing, unknown, or not-run
    check blocks admissibility. The format proves custody and unchanged bytes. It
    does not certify that a claim is true.</p>"

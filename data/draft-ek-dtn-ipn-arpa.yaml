abstract:
- content: "<p>This document requests the creation of ipn.arpa, an infrastructure
    DNS namespace for the IPN node identifiers of the Bundle Protocol (BP). Each Fully
    Qualified Node Number has a DNS base name of the form N.A.ipn.arpa, where A is
    the Allocator Identifier and N is the Node Number. A BP Agent can query beneath
    that name for the records that a convergence-layer discovery binding specifies,
    such as SRV or SVCB records. These records identify the convergence-layer endpoints,
    including relays, that are advertised for reaching a destination.</p>"

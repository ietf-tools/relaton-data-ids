abstract:
- content: "<p>Distributed edge systems can execute the same logical computing service
    at multiple sites and can retain previously generated outputs in gateways, caches,
    or result stores. Reusing such an output can reduce communication and computation,
    but a payload alone does not indicate which service, inputs, parameters, execution
    environment, or validity conditions produced it. This document defines a conceptual
    metadata model for named compute-result objects. The model binds a result payload
    to service identity, input identity, invocation context, execution provenance,
    freshness information, and reuse policy. It also describes validation and cache-reuse
    workflows for intermittently connected and multi-domain edge environments. This
    document does not define a wire encoding, a naming syntax, a remote- attestation
    profile, or a traffic-steering protocol.</p>"

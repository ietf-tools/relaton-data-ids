abstract:
- content: "<p>FoodBlock is a small data format and a set of checking rules for records
    of food: what was made, moved, promised or allowed, and by whom. A record is a
    block of three fields (type, state and refs) signed by its author. The identity
    of a block is the hash of its canonical bytes, which are the JSON Canonicalization
    Scheme (RFC 8785) applied to a block that also follows a strict writing profile.
    Authors link their blocks into per-key chains. This document defines the block,
    the canonical form, the signature suites, the chain, the messages that carry a
    block, and the function valid() that decides whether a block is sound against
    the blocks a checker holds. It is the core only: an implementation of this document
    alone can make, sign, check and chain blocks. Rules for identities, rotation,
    consent, promises, privacy and node-to-node exchange are in separate modules that
    build on this core.</p>"

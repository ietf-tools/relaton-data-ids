abstract:
- content: "<p>This document defines a Traceroute Extension Block for Bundle Protocol
    Version 7 (BPv7). The extension block provides path discovery and per-hop performance
    measurement capabilities for Delay- Tolerant Networks (DTNs). Each node along
    the bundle's path appends a hop record containing its endpoint identifier, timestamp,
    link characteristics, and convergence layer information. This enables comprehensive
    network diagnostics including path verification, delay analysis, link type identification,
    and congestion monitoring without requiring status reports from every intermediate
    node.</p>"

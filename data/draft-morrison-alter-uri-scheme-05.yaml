abstract:
- content: "<p>This document defines the alter URI scheme as a dispatchable reference
    syntax for ~handle identity references published in the DNS records defined in
    the companion specification for discovering Model Context Protocol servers through
    DNS TXT records. An alter: URI binds a textual ~handle reference to a resolution
    and verification procedure that retrieves the handle's envelope from a publishing
    zone, validates the envelope's signature chain, and dispatches the result to an
    operating-system URI handler. The reference may be scoped to an organisation,
    narrowed to a named facet of the identity, and addressed to a typed action surface.
    The scheme is the addressing form of the ~handle@org:facet/action reference; its
    resolution semantics are those of that companion specification, reused without
    modification. The scheme is provider-neutral and introduces no new cryptographic
    primitive. A handler given an alter: URI verifies the handle's envelope before
    acting on it, and where the URI addresses an action, verification precedes any
    side effect. IANA provisionally registered the alter scheme under Section 4 of
    RFC 7595 on 5 October 2026.</p>"

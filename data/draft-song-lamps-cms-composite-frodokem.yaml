abstract:
- content: "<p>This document specifies the conventions for using Composite FrodoKEM
    algorithms with the Cryptographic Message Syntax (CMS). Composite FrodoKEM combines
    FrodoKEM with traditional algorithms (RSA-OAEP, ECDH, X25519, X448) to provide
    hybrid post-quantum key encapsulation.</p>"

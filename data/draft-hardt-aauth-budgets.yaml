abstract:
- content: "<p>This document defines AAuth Budgets, an extension to the AAuth Protocol
    ([I-D.hardt-oauth-aauth-protocol]) that carries a spending ceiling from a person
    server to a resource. A budget is a ceiling on what an agent may consume at one
    resource, denominated in a unit the resource declares, carried as a claim in the
    auth token, and enforced by the resource. Budgets are structurally parallel to
    scope: the agent asks, the resource offers, the person server and access server
    may narrow, and the auth token carries what was granted. The extension adds a
    budget claim to resource tokens and auth tokens, a budget_consumed claim reporting
    what the presented auth token consumed, a budget_units field and a usage_endpoint
    to resource metadata, and an AAuth-Budget response header reporting what a request
    cost and what remains.</p>"

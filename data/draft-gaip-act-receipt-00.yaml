abstract:
- content: "<p>Software agents act for people: they buy, book, cancel, agree, deliver,
    refuse, tell, ask, read and check. Each payment rail, marketplace and assistant
    keeps its own record of those acts, held by that party. The person the agent acted
    for has no record of their own. This document describes the Agent Act Receipt:
    one entry per act, written by the agent as digests bound to a continuity handle,
    signed by a running transparency service, placed in a hash chain and covered by
    dated anchors, with a COSE_Sign1 form of the signature and a signed export (the
    switch pack) the person can take to another agent. The format is published by
    GAIP, which runs one such service. This document makes no claim of trust, certification
    or adoption: a receipt shows that the service's key signed a digest at a stated
    time, and nothing about the act itself.</p>"

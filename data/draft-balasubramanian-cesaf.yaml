abstract:
- content: "<p>Email is kept in many incompatible forms: mbox files in several variants,
    Maildir directories, proprietary personal-folder files and ad hoc exports. Most
    of them lose or alter information, and each can be read only by some tools. This
    document specifies CESAF, the Canonical Email Storage and Archive Format: a file-based
    format in which mail from any source is kept in one store, each message exactly
    as it was obtained, together with the metadata a reader needs to present it (its
    source, folders and flags, decoded header fields, MIME structure, character sets
    and internationalized addresses). Any client that implements this document can
    read a store written by any other.</p>"

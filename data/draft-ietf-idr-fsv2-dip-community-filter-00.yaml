abstract:
- content: "<p>BGP Flow Specification Version 2 (FSv2) propagates both traffic Flow
    Specifications and Traffic Filtering Actions using an extensible TLV- based filter
    family architecture. This document specifies a new FSv2 component type under the
    Routing Filter Family to support community- level filtering. The match condition
    evaluates the BGP Community attribute associated with the destination IP address
    encoded in the Flowspec NLRI. This mechanism is intended for deployment within
    a single administrative domain.</p>"

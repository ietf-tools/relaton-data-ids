abstract:
- content: "<p>This document defines a trust model for agent-to-agent (A2A) interactions
    in multi-agent AI systems. It specifies how agents obtain verifiable identities
    via CA-signed templates, how spawn chains are cryptographically established and
    validated, how dynamic policies are governed under a dual-signature model, and
    how cross- organizational agent interactions are explicitly authorized. The model
    applies existing PKI primitives (X.509, CRL, CSR) and established identity patterns
    (OAuth 2.0, On-Behalf-Of) to the problem of agent provenance. This document does
    not address agent- to-resource access control, human-in-the-loop orchestration,
    or agent behavior, as those concerns belong to the resource enforcement layer
    and the orchestration layer respectively.</p>"

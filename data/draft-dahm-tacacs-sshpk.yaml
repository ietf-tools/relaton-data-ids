abstract:
- content: "<p>SSH [RFC4251] provides a robust and reliable mechanism to connect to
    network devices for administration. Conventionally, the public keys required to
    authenticate SSH sessions are provisioned directly on the network devices. This
    document adds an extension to Terminal Access Controller Access-Control System
    Plus (TACACS+) to eliminate the need for the direct provisioning of SSH public
    keys onto the Network Devices.</p>"

abstract:
- content: <p>Autonomous AI agents, optimizers and AI-assisted security controllers
    increasingly hold standing permissions that let them change production infrastructure
    at machine speed. This document defines a threat model and a protection architecture
    for the boundary between AI decision and infrastructure effect. It describes five
    rogue-AI threat scenarios (Runaway Optimizer, Unmediated Agentic Execution, Correlated
    Security Monoculture, Adversarially Induced Infrastructure Shutdown, and the Self-Authorizing
    Agent), fifty-one variations, a thirty-six entry threat register, twelve required
    security properties, and a comparison showing why common controls such as IAM,
    guardrails, AI judges, human approval, canary delivery and detection do not by
    themselves provide them. The proposed architecture keeps a Candidate Act in a
    Non-Effective State until a Protected Enforcement Domain reconstructs the actual
    pending operation, an Independent Validator decides, and a Finality Sink verifies
    an act-bound, single-use capability at the point of effect. For high-critical
    systems it adds receipt-gated staged effectuation so that even a wrongly authorized
    act exposes only the current stage. The document also gives latency tiers, failure
    behaviour, twenty defensive simulations with acceptance criteria, and residual
    limits. All scenarios are hypothetical threat models, not reports of incidents.
    This document is based on the Mothership application PCT/ IB2026/055615, filed
    4 June 2026 and publicly disclosed 16 July 2026. To read the full PCT filing,
    search "Sangam Das" on PATENTSCOPE, search PCT/IB2026/055615 (pctib202655615),
    or read https://www.tdcommons.org/dpubs_series/12542/.</p>

abstract:
- content: "<p>This document defines Authenticated DNS Resolution (ADR), an enterprise
    query-plane model that augments DNS resolution with per- query identity, role-based
    authorization, and audit. ADR preserves DNSSEC and public Internet DNS behavior
    while enabling enterprises to publish comprehensive internal naming without exposing
    sensitive topology. ADR leverages existing enterprise authentication and identity
    systems to authorize and audit DNS queries without defining a new authentication
    protocol.</p>"

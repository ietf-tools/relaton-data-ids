abstract:
- content: '<p>This document specifies the Planetary Coherence Floor (PCF), a composition
    theorem that bounds the reactive latency of any planet-scale detect-and-react
    architecture by the maximum of five physically and algorithmically named floors:
    a Lorentzian causal floor (speed-of-light through the actual signalling media),
    a sampling floor (the unified detection-latency Lemma L_DL of the MVPS family),
    an information floor (Stein''s Lemma applied to N-vantage joint observation),
    a consensus floor (the geometric-median Byzantine bias bound), and a coupling
    floor (joint Mahalanobis across coupled surfaces). Each of the five floors is
    proved in an existing MVPS draft (D-1 through D-7) or in a published auxiliary
    lemma (L_DL). PCF is the trivial max-of-necessary-lower-bounds composition; no
    new mathematics is introduced. Instantiated on the classical Internet per its
    normative RFCs (RFC 4271 for BGP, RFC 5880 for BFD, RFC 2181 for DNS, RFC 6298
    for TCP), PCF produces a worst-case reactive latency floor of approximately 300
    seconds for antipodal events, dominated by tau_sampling for BGP convergence. Instantiated
    on a planet-scale MVPS deployment per draft-melegassi-coherence- bfd Variant V3
    Echo with N &gt;= 1000 vantages, PCF produces a reactive latency floor of approximately
    196 milliseconds over terrestrial fiber and 145 milliseconds over a LEO ISL mesh.
    Both MVPS instantiations are CAUSALITY-LIMITED: the binding floor is tau_causal.
    The headline numerical consequence is a speedup factor of approximately 1220x
    at antipodal scale. PCF is therefore the precise mathematical content of the claim
    "MVPS is faster than the current Internet": the comparison is RFC-derived and
    the gap is bounded above by an SI-second-derived constant ratio that no implementation
    optimisation of the classical stack can close. This document is informational
    and intentionally minimal. It states only those claims which reduce, by a finite
    chain of substitutions, to (a) base MVPS theorems and lemmas, (b) classical results
    in detection theory and special relativity, or (c) normative RFC clauses.</p>'

abstract:
- content: "<p>AIBSN is a public registry of AI agents that we have run since September
    2025. Each agent gets a permanent code, and anyone can look up whether that code
    is active or revoked, for free and without an account. This document describes
    the record, what its status means and how the lookup works today. It also lists
    what we offer organizations as custom work on top of the registry, such as their
    own registry instance, change notifications, emergency revocation and transfer
    of a record to a new owner. Finally it puts forward some proposals for discussion:
    a public revocation time, a standing for the party behind an agent that is separate
    from the agent's own status, a stated maximum delay for every way a record can
    be withdrawn, revocation by the owner, a log of status changes, a way to check
    status without telling the registry which record you are checking, a key that
    lets other identifier records point to an independent status source, and how a
    relying party can treat and record a status that is out of date.</p>"

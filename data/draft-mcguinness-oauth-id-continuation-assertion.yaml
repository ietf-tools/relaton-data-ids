abstract:
- content: "<p>This document defines the Identity Continuation Assertion, a short-
    lived, sender-constrained JWT used as an OAuth 2.0 Token Exchange subject token.
    It lets an IdP Authorization Server (IdP) issue an onward Identity Assertion JWT
    Authorization Grant (ID-JAG) when a user's request crosses service boundaries
    after the user is no longer present. The profile targets deployments in which
    several Resource Authorization Servers trust one IdP and use audience-local subject
    identifiers that only the IdP can resolve. It complements offline attenuation
    for intra-domain fan-out that does not change the subject.</p>"

abstract:
- content: "<p>This document describes Sigma Protocols for proving knowledge of preimages
    of linear maps in prime-order elliptic curve groups. These are sometimes also
    called _Maurer Proofs_, or _proofs of knowledge of a preimage of a group homomorphism_.
    Examples include zero-knowledge proofs for discrete logarithm relations, ElGamal
    encryptions, Pedersen commitments, and range proofs.</p>"

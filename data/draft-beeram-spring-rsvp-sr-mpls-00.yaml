abstract:
- content: <p>RFC 8577 introduced the concept of signaling RSVP-TE tunnels on a shared
    MPLS forwarding plane using preinstalled "TE link labels". Those labels are functionally
    equivalent to Segment Routing (SR) Adjacency Segment Identifiers (Adj-SIDs) but
    are allocated and distributed solely via RSVP-TE signaling. This document extends
    RFC 8577 to use SR-MPLS Adjacency SIDs that are advertised by the IGP as the forwarding-plane
    labels for RSVP-TE tunnels. It restricts scope to per-link Adj-SIDs and defines
    the signaling procedures and protocol extensions required to couple the RSVP-TE
    control plane with the native SR-MPLS forwarding plane.</p>

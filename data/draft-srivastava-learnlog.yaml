abstract:
- content: "<p>When a learner works with an AI tutor or assistant, or earns a credential
    or completes training with software in the loop, the formats learning systems
    share do not by themselves fix how to record what help was asked for, offered,
    shown, or accepted, or which of those facts were observed, self-reported, or inferred.
    Learnlog is a capture profile for that: a small set of assistance states, a declared
    observation boundary, explicit unknowns, and a basis for every assertion, carried
    inside xAPI and Caliper, which learning systems already use. It also defines an
    optional event file format for deployments that need integrity: entries chained
    by hash, signed heads, and redaction that leaves every hash verifiable.</p>"

abstract:
- content: <p>RFC 7468 describes the textual encodings, commonly known as "PEM", of
    several PKIX, PKCS, and CMS structures, each identified by a label such as CERTIFICATE.
    No registry of these labels exists, which has led to discoverability issues and
    inconsistent use. This document establishes an IANA registry for PEM labels and
    defines the OCSP RESPONSE label.</p>

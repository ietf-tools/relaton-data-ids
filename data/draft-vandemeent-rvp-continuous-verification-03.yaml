abstract:
- content: "<p>This document defines RVP, a protocol for asking a bounded verification
    question, carrying that question through one of several possible verification
    mechanisms, and producing evidence that is bound to the exact question. RVP separates
    five concerns that are often collapsed: the consumer policy that decides whether
    evidence is needed, the frozen evidence requirement, the lifecycle of the question,
    the carrier that obtains a response, and the later act of consuming the evidence.
    RVP does not grant authority, establish admission, or replace account authentication
    and session policy. A successful result means only that the presented evidence
    satisfied the referenced requirement for the referenced question. The consumer
    and target system remain responsible for deciding what, if anything, may happen
    next. The protocol supports local biometric checks, signed companion-device responses,
    WebAuthn, authenticated-session evidence, recovery standing, and future carriers
    without assigning ceremony semantics or authority to those carriers. It is transport-independent
    and can operate locally without a central identity provider.</p>"

abstract:
- content: "<p>This document specifies an echo service for Bundle Protocol Version
    7 (BPv7) networks. An echo service receives bundles at a well-known endpoint and
    replies to each with a response bundle that returns the payload to the originator.
    This enables round-trip time measurement and end-to-end connectivity verification
    in Delay-Tolerant Networks. This document requests IANA allocation of a well-known
    IPN service number for the echo service.</p>"

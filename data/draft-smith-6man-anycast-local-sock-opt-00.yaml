abstract:
- content: "<p>IPv6 nodes will deliver packets destined to an anycast address to one
    of their own local instances of the anycast address should they exist. There are
    cases where it could be useful for a node to ignore its own anycast address instances
    and to submit packets towards this anycast address to the network for delivery
    to another node holding the anycast address. This memo describes a Sockets API
    socket option to specify this behaviour.</p>"

abstract:
- content: "<p>This document defines the core of Groundmark, a protocol for DNS- anchored
    identity discovery and request authentication for autonomous software agents.
    Operators publish an agent's signing public key in a DNS TXT record under a reserved
    label, and optionally publish references to externally hosted attestations under
    a second reserved label. Agents authenticate HTTP requests using HTTP Message
    Signatures (RFC 9421) with a key identifier that resolves through DNS. DNSSEC
    is required for all Groundmark DNS lookups. The protocol provides operator accountability
    discovery without a central registry, and is designed to compose with existing
    identity, authorization, and payment systems rather than to replace them. The
    attestation framework, including the role of Identity Service Providers, the attestation
    level taxonomy, and the claim vocabulary, is defined in a companion document.</p>"

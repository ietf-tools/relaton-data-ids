abstract:
- content: "<p>Much email asks the recipient to do something: approve, send, sign,
    pay, decide. Email has no interoperable way to say who owns such a request, when
    it is due, or whether it is done, so senders track requests by hand and requests
    are dropped. This document defines a Structured Email (SML) profile for action
    requests: a machine- readable action object, carried as JSON-LD using the schema.org
    Action vocabulary and optionally mirrored as an iCalendar VTODO, plus status-update
    messages that supersede earlier ones, so that every participant's mail client
    in every administrative domain can show one current status. It works with no shared
    server between organizations, and it degrades to readable text in clients that
    do not implement it.</p>"

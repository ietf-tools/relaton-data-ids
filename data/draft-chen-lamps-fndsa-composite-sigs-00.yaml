abstract:
- content: "<p>To facilitate a robust and secure transition to post-quantum cryptography,
    this document defines a method for creating composite signature algorithms by
    combining the Fast-Fourier Transform over NTRU-Lattice-Based Digital Signature
    Algorithm (FN-DSA) with modern classical signature algorithms. These composite
    algorithms are treated as new, atomic primitives. This document specifies algorithm
    identifiers, public key structures, and signature formats for using these composite
    algorithms within the Internet X.509 Public Key Infrastructure. The methodology
    is designed to align with modern cryptographic practices, including a principle
    of strict security level alignment, ensuring a consistent and predictable security
    posture for all defined algorithms.</p>"

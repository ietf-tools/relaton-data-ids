abstract:
- content: <p>The Opus codec can carry low-bitrate redundancy for the preceding frame
    inside each packet ("in-band FEC"). The RTP payload format for generic Forward
    Error Correction (RFC 5109, commonly called ULPFEC) protects groups of RTP packets
    with XOR parity packets. The two mechanisms recover different loss patterns, have
    different delay and overhead characteristics, and interact in ways that are not
    described in either specification. This document gives informational guidance
    on when the combination is worthwhile, how a sender should configure each mechanism,
    how a receiver should order recovery, how to signal the combination in SDP, how
    middleboxes affect it, and how to keep the combined redundancy consistent with
    congestion control. It complements, and does not change, the WebRTC FEC requirements
    in RFC 8854. It defines no new protocol elements.</p>

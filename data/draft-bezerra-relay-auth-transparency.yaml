abstract:
- content: <p>Protocol-aware middleware (relays, bridges, gateways) re-serializes
    messages at their protocol frame boundary, silently discarding any bytes appended
    outside that boundary. Authentication material placed after the frame boundary
    by a sender is therefore stripped at every relay hop before reaching the receiver,
    with no error indication. This document identifies this behavior as a protocol
    design vulnerability class -- "relay-transparent authentication stripping" --
    demonstrates it in three independent protocol stacks (MAVLink v2, ROS2/DDS CDR,
    and CAN/AUTOSAR SecOC), and specifies the architectural principle that authentication
    material must be carried as a first- class, independently addressable protocol
    unit to survive relay transit. Post-quantum cryptographic schemes (ML-DSA-87,
    ML-KEM-1024) are particularly susceptible due to their large signature and ciphertext
    sizes.</p>

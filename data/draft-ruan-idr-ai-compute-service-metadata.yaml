abstract:
- content: "<p>This document defines a new optional transitive BGP Path Attribute
    named AI Compute Service Metadata, which carries three categories of dedicated
    Sub-TLVs for generative AI inference over inter-domain BGP routes. Existing CATS
    framework and generic BGP compute metric drafts lack inference-specific metadata
    covering inference SLA, token billing cost, and KV cache prefix index. Re-computing
    context without matched cache prefixes raises GPU overhead and user billing expense.
    This specification defines a new top-level optional transitive BGP Path Attribute
    named AI Compute Service Metadata, which encapsulates three independent Sub-TLVs
    to advertise inference SLA metrics, billing parameters, and cache prefix indexes.
    All metadata carried within this Path Attribute is flooded across multi-domain
    routing fabrics, supporting two core use cases: matching compute instances based
    on latency and cost requirements, and dispatching tasks to nodes with matched
    reusable KV cache to reduce resource consumption.</p>"

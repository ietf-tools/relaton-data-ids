abstract:
- content: "<p>This document extends the base Network Inventory YANG model to support
    software-based network elements (NEs) and software components. The extension introduces
    software lifecycle status that distinguishes running software from software that
    is installed but not running, together with installation timestamps for non-running
    software, and both installation and activation timestamps for running software.</p>"

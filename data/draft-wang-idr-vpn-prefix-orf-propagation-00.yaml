abstract:
- content: "<p>The Virtual Private Network (VPN) Prefix Outbound Route Filter (ORF)
    [I-D.ietf-idr-vpn-prefix-orf] mechanism allows a Border Gateway Protocol (BGP)
    speaker to request that an adjacent peer filter matching VPN routes. In deployments
    using Route Reflectors (RRs) or Autonomous System Border Routers (ASBRs), the
    adjacent peer may not be the source of the affected routes. This document specifies
    when an intermediate router may send an ordinary VPN Prefix ORF to the upstream
    peer from which the affected routes were received. Upstream transmission is permitted
    only after the intermediate router determines that no relevant downstream router
    requires the affected routes. This document also defines an Interest Query/Response
    procedure for making that determination.</p>"

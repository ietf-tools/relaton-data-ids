abstract:
- content: "<p>The WIMSE AI Identity Management System (AIMS) framework requires deployments
    to produce durable audit logs covering authorization decisions and subsequent
    remediations, requires those audit records to be tamper-evident, lists the minimum
    fields an audit event records, and calls for reconstruction of complete execution
    chains across service boundaries. AIMS deliberately specifies no audit record
    format. This document supplies one candidate: it maps each AIMS audit requirement
    onto the AER-1 execution receipt, field by field, shows how AER-1 hash-chained
    timelines and workflow receipts reconstruct an execution chain, and defines an
    optional carriage of AER-1 receipts as SCITT statements for deployments that operate
    a transparency service. The mapping changes no AER-1 field, digest construction,
    or verification rule, and it states plainly what a receipt does not prove.</p>"

abstract:
- content: "<p>This document analyzes network-service use cases in which fully homomorphic
    encryption (FHE) can address privacy requirements not met by existing non-homomorphic-encryption
    solutions under the stated trust conditions. It considers general AI inference,
    integrated sensing and communication, and private information retrieval. Each
    use case describes a scenario, example flows, post-conditions, existing solutions,
    and potential requirements. Common gaps, a use- case summary, and brief evaluation
    criteria connect the analysis. The document does not specify a protocol or select
    a cryptographic scheme.</p>"

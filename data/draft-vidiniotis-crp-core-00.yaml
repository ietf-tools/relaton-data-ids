abstract:
- content: "<p>The Context Relay Protocol (CRP) defines a structured, language- agnostic
    protocol for managing AI context, safety governance, and compliance evidence in
    deployed large language model (LLM) systems. CRP operates as an HTTP-compatible
    sidecar protocol, enriching every AI request/response cycle with standardised
    headers carrying context quality, hallucination risk, provenance integrity, and
    regulatory classification metadata. This document defines the foundational axioms,
    request/response model, sidecar architecture, and the normative relationship between
    CRP's subsystems: the Context Envelope, Contextual Knowledge Fabric (CKF), Decision
    Provenance Engine (DPE), and the Audit Chain.</p>"

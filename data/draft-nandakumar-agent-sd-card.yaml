abstract:
- content: "<p>This document defines SD-Card, an SD-JWT encoding of AI agent metadata
    that lets an agent reveal to each verifier only the capabilities, endpoints, and
    security requirements it is authorized to see, while the verifier can check that
    they are authentic and issuer-attested. SD-Card keeps agent metadata confidential;
    it does not make agents anonymous. The document specifies the SD-Card data model,
    issuance, discovery, and key-bound presentation, and defines bindings for the
    Model Context Protocol (MCP), the Personal Agent Protocol (PAP), and the Agent2Agent
    (A2A) protocol.</p>"

abstract:
- content: "<p>This document specifies requirements for post-quantum cryptography
    (PQC) certificate rotation in multi-tenant public key infrastructure (PKI) environments.
    Multi-tenant PKI deployments — in which a single PKI platform issues and manages
    certificates for multiple distinct tenant organizations — face coordination challenges
    that single- tenant PKI deployments do not encounter during PQC migration. This
    revision (-03) adds a unified Posture B IPR notice, a section noting awareness
    of the existing IPR disclosure on record for this draft (IPR: 1 on Datatracker),
    and machine-readable JSON evidence. Readers MUST consult the IETF Datatracker
    IPR tab for this document for all current IPR disclosure status.</p>"

abstract:
- content: <p>This document specifies a SCITT (Supply Chain Integrity, Transparency,
    and Trust) profile for pre-execution authorization records of AI agent actions.
    The profile defines a Signed Statement type, the "Pre-Execution Authorization
    Record" (also called a Permit), that records a policy-evaluated decision to allow,
    deny or challenge a proposed AI agent action. A Permit can commit to the canonical
    request body. For a dispatched allow with a body commitment, the profile pairs
    the Permit with a Closure Record. The Verifier compares the recorded digests.
    The reference Issuer checks the body binding before managed dispatch. This document
    distinguishes RFC 9942 COSE Receipts from the reference implementation's provisional
    linked-chain inclusion proof. This profile also defines authorization-lineage
    vocabulary. It defines how a Verifier can determine whether the authority conveyed
    by a child Permit is equal to or narrower than the authority conveyed by its parent
    (attenuation), given a signed or chain-committed Authority Representation and
    a declared Comparator Profile. The Permit remains an evidence artifact; this profile
    specifies the evidence a Verifier needs to make that determination, not a delegation
    or policy protocol. The profile composes with adjacent profiles for human-authority
    binding, post-execution material-action evidence, and content-refusal events,
    referenced rather than replicated.</p>

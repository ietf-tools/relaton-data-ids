abstract:
- content: "<p>This document defines the canonical object format for the Secured Digital
    Lifecycle Protocol (SDLP). The object format specifies the normative byte-level
    representation used for hashing, signing, validation, and interoperability across
    SDLP implementations. All SDLP-governed objects MUST follow the canonical encoding,
    field ordering, and serialization grammar defined in this specification. Object-Format-04
    freezes the canonical envelope grammar and provides a concrete example of a fully
    serialized SDLP object to illustrate how DigitalID, InstanceID, Lineage, Timestamp,
    and Body are encoded in practice. This revision also introduces brief application
    context describing how SDLP objects are used in provenance, auditability, and
    regulated-content workflows. This document updates and replaces draft-norton-sdlp-obj-format-03
    and provides the authoritative definition of the SDLP object format required for
    interoperable identity, lineage, and lifecycle processing.</p>"

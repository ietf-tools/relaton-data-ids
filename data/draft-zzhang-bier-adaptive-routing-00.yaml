abstract:
- content: "<p>ECMP is extensively used in AI DC networking, often with so called
    adaptive routing mechansim, with which the load/congestion/capacity information
    for the nexthop, next nexthop, or even the entire path is considered to dynamically
    adjusts routing paths based on changes in global network conditions, thereby optimizing
    network performance and resource utilization. This document describe how BIER
    can work with adaptive routing.</p>"

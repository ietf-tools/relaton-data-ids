abstract:
- content: "<p>Network resilience validation evaluates whether network services can
    maintain acceptable performance and recover within specified objectives under
    disruptive conditions. Such validation may be performed using simulation, emulation,
    or controlled laboratory testing. However, differences in scenario descriptions,
    evaluation criteria, and result representations make validation results difficult
    to exchange, reproduce, and compare across implementations. This document specifies
    a YANG data model for scenario-based network resilience validation. The model
    standardizes the representation of validation scenarios, disruptive conditions,
    service-level evaluation criteria, and validation results. It also defines common
    evaluation semantics to support consistent interpretation of results across validation
    environments. The specification focuses on interoperable representation of validation
    information. It does not define simulation algorithms, fault-injection procedures,
    or mechanisms for modifying production networks.</p>"

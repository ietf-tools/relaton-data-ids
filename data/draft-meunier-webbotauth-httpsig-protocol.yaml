abstract:
- content: "<p>This document describes a protocol for identifying automated traffic
    using [HTTP-MESSAGE-SIGNATURES]. The goal is to allow automated HTTP clients to
    cryptographically sign outbound requests, allowing HTTP servers to verify their
    identity with confidence. It defines the Signature-Agent header field for in-band
    key discovery, a key directory format based on JWKS, and a well-known URI at which
    that directory is served.</p>"

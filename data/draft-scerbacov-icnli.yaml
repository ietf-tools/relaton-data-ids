abstract:
- content: "<p>This document describes the Infrastructure Contextual Natural Language
    Interface (ICNLI), an open protocol that defines how an artificial intelligence
    (AI) agent operates as a first-class participant inside a real-world operational
    system. ICNLI specifies a hierarchical context model, request classification and
    a two-step confirmation pattern for state-changing operations, multi-step chain
    orchestration with read-before-write semantics, an anti-fabrication contract that
    binds narration to verifiable facts, a graduated safety layer, a modular extension
    contract, proactive-intelligence requirements, channel neutrality, and observability
    and audit primitives, organized into three cumulative conformance levels. The
    protocol is domain-agnostic, channel-neutral, and implementation- neutral; a compliant
    implementation MAY use any underlying foundation model. This Internet-Draft is
    a faithful rendering, for the IETF community, of the ICNLI Specification version
    2.0.0 published by its author. It is an individual submission and a work in progress
    with an intended status of Informational. It does not represent IETF consensus,
    is not a standards-track document, and makes no claim of IETF adoption.</p>"

abstract:
- content: "<p>This document defines a discovery, registration, attestation, and device-lifecycle
    layer for out-of-band OAuth 2.0 authenticator devices, allowing a single spec-compliant
    authenticator application to register with, and receive push-based wake signals
    from, any conforming Authorization Server, without requiring the Authorization
    Server operator to build and distribute its own dedicated mobile application.
    This document is intentionally agnostic to which back- channel authentication
    protocol ultimately consumes it; OpenID Connect Client-Initiated Backchannel Authentication
    (CIBA) Core is its first binding, defined in a separate companion document, but
    nothing in this document depends on CIBA or on OpenID Connect.</p>"

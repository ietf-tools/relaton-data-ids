abstract:
- content: "<p>The BGP Monitoring Protocol (BMP) is widely used by operators to stream
    BGP routing state from routers to monitoring and automation systems. Although
    BGP convergence has well-established benchmarking methodologies, there is no standardized
    way to measure how quickly and how completely a router exports BGP state over
    BMP, or how the BMP export affects the router and the collector. This document
    defines terminology, a reference test setup, metrics, and test procedures to benchmark
    the BMP convergence of a router (the Device Under Test) in a vendor-independent
    and repeatable way. It covers all five BMP monitoring views (Adj-RIB-In pre-policy
    and post-policy, Loc-RIB, and Adj-RIB-Out pre-policy and post-policy), initial
    table dump speed, convergence during routing events and churn, impact on BGP itself,
    scaling with the number of monitored views, the Adj-RIB- Out scale, and BMP stations,
    and behavior under TCP backpressure.</p>"

abstract:
- content: "<p>This document records five expected behaviors asserted by a supplied
    OctaTouch gesture-runtime smoke-test script. It is a limited test profile, not
    a complete gesture specification. The runtime implementation and its dependencies
    were not included with the source script, so the tests have not been executed
    as part of this archive. No interoperability or implementation-conformance claim
    is made.</p>"

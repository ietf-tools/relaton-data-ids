abstract:
- content: '<p>Organizations commonly operate under multiple domain names: a primary
    website, legacy names, defensive registrations, divisional brands, and names in
    restricted or verified top-level domains. No standard mechanism exists for a domain
    owner to declare, in a machine-readable and verifiable way, which domains are
    operated by the same organization. This document defines "domain-set", a protocol
    by which domain operators publish membership in a set of domains using a DNS TXT
    record as the discovery mechanism. The record either lists the members directly
    or references an extensible Domain Set Manifest retrieved over HTTPS. Mutual attestation
    is the validation requirement: a link between two domains is valid only when both
    domains independently publish records naming each other. Every direction of a
    link MUST be retrieved over an authenticated channel, by DNSSEC or by the Web
    PKI, and consumers report which was used. The protocol enables security tooling,
    mail and browser systems, and other automated consumers, including AI systems,
    to answer the question "are these two domains operated by the same organization?"
    from first-party, owner-published data rather than inference.</p>'

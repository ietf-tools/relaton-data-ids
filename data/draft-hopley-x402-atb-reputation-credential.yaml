abstract:
- content: "<p>This document specifies the ATB Pass Certificate, a Falcon-1024 post-
    quantum signed reputation credential issued by the Agent Trust Bench (ATB) to
    autonomous AI agents that have demonstrated safe payment- decision behaviour against
    the bench's adversarial profile corpus. The credential is presented by agents
    to participating x402 gateways via an HTTP header for reputation-gated variable
    pricing. Two certificate versions are specified. Phase 1 carries the agent's refusal-rate
    score in cleartext; the gateway verifies the Falcon-1024 signature and applies
    a discount when the score meets a declared threshold. Phase 2 replaces the score
    with a Pedersen commitment to the score and a Bulletproofs range proof attesting
    score &gt;= threshold without revealing the score, its components, or the agent's
    underlying behaviour distribution. Certificates are canonicalised under RFC 8785
    (JSON Canonicalization Scheme) with an in-band canonicalisation-rule pin and signed
    with Falcon-1024 (NIST FIPS 206, post-quantum). Phase 2 ZKP elements use Ristretto255
    as the elliptic curve group with the dalek-cryptography Bulletproofs instantiation.
    This document also specifies the composition of the ATB Pass Certificate as an
    evidence-source input to draft-hopley-x402- composite-trust-query, gateway verification
    algorithms for both Phase 1 and Phase 2 credentials, and security and privacy
    considerations arising from the bearer-token transport model and the ZKP soundness
    assumptions. This document is an Independent Submission filed per RFC 4846 and
    is intended for publication as Informational. It is not an IETF Standards Track
    document, does not represent IETF community consensus, and has not been subject
    to review by an IETF Working Group.</p>"

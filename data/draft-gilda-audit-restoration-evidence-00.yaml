abstract:
- content: "<p>When an AI agent system is stopped, restricted or has its credentials
    revoked during an incident, someone later decides whether it may run again. Incident
    response guidance asks for that decision to be documented with the risk that remains,
    but no format says what the record must contain for a party outside the deploying
    organization to check it. This document defines five record types for that purpose:
    an incident action authorization, a revocation sweep, a re-enable decision, a
    joint authority assignment for incidents that span organizations, and a revocation
    boundary report. Each is an in-toto Statement carried in a DSSE envelope, uses
    the canonical form of the agent audit record, and is checked by ordered rules
    with a named reason for each failure. A bundle rule set binds a re-enable decision
    to the records it cites, by digest. A published conformance corpus carries a reject
    member for every rule that a member can force.</p>"

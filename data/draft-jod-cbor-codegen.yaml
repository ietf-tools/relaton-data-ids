abstract:
- content: "<p>The Concise Data Definition Language (CDDL) was specified to express
    the structure of CBOR and JSON data, principally so that instances can be validated
    against a specification. It is now starting to be used as the source from which
    encoders and decoders are generated. Compilation exercises a specification language
    in ways that validation does not. This document records three things. First, guidance
    for CDDL authors on which constructions compile to small, fast, one-pass code
    and which do not. Second, a description of what a code generator has to do with
    a CDDL specification, and where implementation and run-time cost lies. Third,
    a set of questions where RFC 8610 and its updates say nothing, are under-determined,
    or determine in a way that deployed specifications do not follow, each with a
    motivating example drawn where possible from a published RFC or an active Internet-Draft.
    This document is a discussion input. It creates no requirements on implementations
    and defines no new CDDL syntax.</p>"

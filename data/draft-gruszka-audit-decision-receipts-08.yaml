abstract:
- content: "<p>The architecture for auditing agent delegation and interactions proposed
    for the AUDIT effort names Interaction Records, Action Records and Authorization
    Transition Records and leaves their encoding open. This document maps an existing
    pair of signed records, the decision receipt and the outcome receipt of the open-
    source proofbundle project, onto those record types for three cases, a human approval,
    a declined action and an executed action with its result, and gives each record
    exact bytes, a signature and digest bindings that a third party can check offline.
    Each receipt is created when the decision or the outcome occurs and is checked
    by an Auditor post hoc, and a declined or refused action is a record of its own.
    For each case the document states what the receipt adds and what it does not show,
    and it gives a verification procedure that runs offline. It requires that an approval
    be honoured at most once, even after the record of consumed approvals is rotated.
    Test vectors for all three cases, each with a counterexample, are included. The
    document also describes, informatively, how a receipt can be registered with a
    Transparency Service under RFC 9943 and what a SCITT Receipt then shows and does
    not show. It uses existing receipt formats and defines no new predicate or registry.
    How the issuer of a receipt enforces its decision is out of scope.</p>"

abstract:
- content: "<p>Certificates issued within the Secure Telephone Identity Revisited
    (STIR) framework establish, through a governed issuance process, that a party
    holds authority over telephone numbers or a service provider code, and where a
    domain identifier is bound to that authority, that the same party controls a domain.
    This document defines a certificate profile for TLS built on the TNAuthList extension
    and on the binding of telephone number authority to a domain identifier, so that
    the provider operating an interface is identified by a service provider code and
    by a validated domain rather than by prior arrangement between the parties, and
    it specifies the use of TLS, mutual TLS, and media protection across that interface.
    It applies to the network to network interface between providers. It brings the
    use of TLS with SIP up to date with TLS 1.3 and current certificate identity practice,
    and places the issuance of the credentials on which interconnection depends within
    a defined governance and issuance framework.</p>"

abstract:
- content: "<p>Agent protocols often require a participant to establish a decision-
    time input before it acts: issuer standing, key availability, delegated authority,
    policy profile availability, consumption state, revocation status, or the outcome
    of a downstream operation. A participant that establishes an input and receives
    a negative answer has learned a different fact from a participant that cannot
    establish the input at all. Collapsing those facts into one denial or failure
    value changes retry behavior, alert routing, audit interpretation, incident ownership,
    and post-incident reconstruction. This document specifies requirements for preserving
    evaluation state across agent protocol boundaries: the value of an input, whether
    that value was established at decision time, the freshness of the source used
    to establish it, and whether the resulting policy decision was actually evaluated.
    The requirements are stated independently of encoding, so that policy, authorization,
    revocation, routing, and audit documents can satisfy them in their own formats.
    Test cases for the requirements are included, with a machine-readable form published
    separately.</p>"

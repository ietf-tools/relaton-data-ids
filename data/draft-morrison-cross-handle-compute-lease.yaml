abstract:
- content: "<p>This memo specifies a Cross-Handle Compute Lease: a bounded, revocable,
    turn-metered primitive by which one identity-bound principal, addressed by a ~handle,
    asks for a defined task to run on the machine of a different principal, also addressed
    by a ~handle, over an existing agent-frame substrate. The lease moves general
    computation between identities without opening an inbound network path on the
    host's machine and without exposing a network endpoint to the borrower; the address
    is the identity and the transport is the identity-event stream. The memo specifies
    four frame kinds for the lease lifecycle, a four-rung trust ladder under which
    one envelope serves intra-organisational, cross-organisational, datacentre and
    open-market deployments, an isolation requirement that holds at every rung, an
    identity-inference exclusion invariant that prevents the leased computation from
    performing inference about the host, and a turn-metered settlement model in which
    the lease value passes between the two parties unsplit and the protocol operator
    holds no other party's funds. Sessions between machines held by the same ~handle
    are outside the memo's scope.</p>"

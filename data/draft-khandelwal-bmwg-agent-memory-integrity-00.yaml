abstract:
- content: <p>AI agents increasingly persist memory across sessions and treat that
    memory, on the next turn, as if it were their own prior experience. This document
    defines a benchmarking method that measures whether an agent's memory subsystem
    detects that its persisted memory has been altered, removed, reordered, replayed,
    or forged at the storage layer, and refuses to serve that memory or reports it
    before it is served. The method defines eight storage-level edits, three verdict
    classes, a detection-point distinction between read time and audit time, two control
    cases, and a scoring rule. It is a laboratory method for controlled, reproducible
    measurement, in the spirit of RFC 2544 and RFC 8239, and it is intended as a test
    method for the "Protection of Memory Data Integrity" metric under discussion in
    the Benchmarking Methodology Working Group.</p>

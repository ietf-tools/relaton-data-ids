abstract:
- content: "<p>Network Time Protocol (NTP) offset measurements can contain bias associated
    with differences in packet serialization delay in the forward and reverse directions.
    This document describes TARE (Time Asymmetry Regression Estimator), a client-side
    experimental method that estimates a packet-length-dependent component of measured
    NTP offset using regression over exchanges with varied packet lengths. A client
    may use the estimate to produce two named outputs (Section 6.1): Output A, an
    offset normalized to a selected reference packet length, which does not reduce
    the length-dependent bias at that length; and Output B, the intercept of the fitted
    model at zero length of a documented length layer, an extrapolated quantity whose
    meaning depends on the validity of the model. TARE does not, by itself, determine
    or remove fixed propagation-delay asymmetry, distinguish that asymmetry from true
    clock offset, or guarantee improved synchronization accuracy. This document defines
    an experimental measurement model, calibration procedure, validity checks, fallback
    behavior, and evaluation plan. It does not define new NTP packet fields or require
    server changes.</p>"

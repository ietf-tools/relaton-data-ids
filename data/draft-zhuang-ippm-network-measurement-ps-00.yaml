abstract:
- content: "<p>Modern network applications, ranging from artificial intelligence (AI)
    and machine learning (ML) training to large-scale cloud services, require adaptive
    and high-performance networks. Network measurement is fundamental to achieving
    observability, enabling traffic engineering (TE), load balancing, congestion control
    (CC), resource accounting, and fault diagnosis. However, existing network measurement
    techniques face significant challenges in accuracy, overhead, scalability, and
    adaptability, especially in distributed and high-speed environments. This document
    describes the problems and gaps in current network measurement approaches, including
    sketch- based measurement, in-band network telemetry (INT), sampling, and probing,
    with a focus on distributed system scenarios.</p>"

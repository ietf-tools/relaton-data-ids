abstract:
- content: "<p>This document specifies the Offline Emergency Peer-to-Peer Broadcast
    Protocol (OEPB), an experimental protocol for disseminating authenticated emergency
    alerts among unprovisioned devices over short-range peer-to-peer radios when network
    infrastructure is unavailable. OEPB defines a compact 256-byte packet format with
    Ed25519 signatures; a transport abstraction over radios such as Bluetooth Low
    Energy, Wi-Fi Direct, and LoRa; per-message Trickle dissemination with a bounded
    number of retransmissions; a five-class weighted fair queuing scheme reflecting
    emergency triage priorities; and a trust model in which relays forward without
    verifying signatures, so that unauthenticated distress messages still propagate
    while receivers authenticate authority alerts. A companion document defines the
    Bluetooth Low Energy transport binding.</p>"

abstract:
- content: <p>This document defines test procedures for characterizing the fault detection
    capability of observability systems that monitor Large Language Model (LLM) serving
    deployments. Procedures are given for Detection Latency, Detection Coverage, Detection
    Threshold Magnitude, False Detection Rate, and Boundary Masking. The Detector
    Under Test is the observability system. Output Behavior Faults are injected at
    a known time under controlled conditions, which makes detection latency directly
    measurable. This document is a companion to "Benchmarking Terminology for Output
    Behavior Fault Detection in Large Language Model Serving Systems" and is to be
    read alongside it. This document specifies no acceptance thresholds.</p>

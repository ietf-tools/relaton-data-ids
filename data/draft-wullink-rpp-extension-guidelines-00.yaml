abstract:
- content: "<p>The RESTful Provisioning Protocol (RPP) defines a base set of data
    objects, component objects, and operations for provisioning objects. This document
    defines guidelines and a normative mechanism for extension specifications that
    add data elements, associations, operations, result codes, or other functionality,
    without modifying the base specifications itself.</p>"

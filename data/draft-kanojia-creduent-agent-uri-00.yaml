abstract:
- content: "<p>This document specifies the 'agent' Uniform Resource Identifier (URI)
    scheme and its associated cryptographic attestation protocol. The 'agent' scheme
    defines a transport-agnostic, cryptographically verifiable addressing layer for
    identifying autonomous software agents, binding domain ownership via DNS TXT records,
    enforcing instruction integrity, and validating attenuated capability delegation
    tokens.</p>"

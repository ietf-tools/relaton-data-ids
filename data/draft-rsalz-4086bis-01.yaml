abstract:
- content: <p>Things have changed a great deal in the two decades since RFC 4086,
    "Randomness Requirements for Security," was published. Notably, facilities to
    generate high-quality random numbers are widely available on most common computing
    platforms. While RFC 4086 provides much information to those implementing such
    a facility, this document takes a different approach, encouraging implementors
    to use facilities already available to them.</p>

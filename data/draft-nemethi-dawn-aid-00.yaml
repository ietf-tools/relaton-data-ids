abstract:
- content: "<p>Agent Identity and Discovery (AID) answers one question: given a domain,
    where is the agent and which protocol should a client speak? An AID client queries
    a DNS TXT record at the well-known subdomain _agent.&lt;domain&gt; and learns
    the service endpoint URI, protocol token, authentication hint, and optional metadata
    for that agent. This document defines the AID v2 (`aid2`) record format, client
    discovery algorithm, exact-host lookup rules, endpoint-proof (PKA) handshake using
    Ed25519 HTTP Message Signatures, security requirements, and IANA registrations
    for the `_agent` DNS node name and the `agent` service name. The legacy `aid1`
    record format is retained as a compatibility format for clients migrating from
    earlier deployments. AID is intentionally small; after discovery, protocol- specific
    mechanisms such as MCP or A2A handle communication and capability negotiation.</p>"

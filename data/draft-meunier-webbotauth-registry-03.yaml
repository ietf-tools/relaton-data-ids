abstract:
- content: '<p>This document defines the "Signature Agent Card", a JSON metadata document
    that a signature agent using [DIRECTORY] publishes to describe itself: its identity,
    purpose, rate expectations, and cryptographic keys. Its parameters are drawn from
    the OAuth Dynamic Client Registration Metadata registry [DCR], the same namespace
    used by [CIMD], extended with a single web_bot_auth object. This document registers
    that object with IANA and establishes a registry for its members.</p>'

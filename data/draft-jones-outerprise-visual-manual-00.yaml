abstract:
- content: "<p>This document presents a visual reference model of the Outerprise evidence-delivery
    ecosystem as documented by the public Entercation application. It identifies participants,
    public surfaces, packet boundaries, fiscal-sponsorship stations, comparison findings
    and policy decisions. It describes a machine-readable companion with structured
    definitions, schemas, exact arithmetic and synthetic test vectors. The visual
    model is a documented public-surface view with explicit evidence boundaries.</p>"

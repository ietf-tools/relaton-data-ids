abstract:
- content: '<p>A growing family of Internet-Drafts defines signed "receipts" about
    an AI agent''s action: delegation receipts that attest an agent was authorized
    to act for a principal, policy or permit receipts that attest a policy allowed
    an external effect, decision and compliance receipts, route authorizations, and
    human-authorization receipts that attest a named, accountable human approved a
    specific action. The mature efforts independently converged on a common substrate:
    bind the action with a canonical digest (JSON Canonicalization Scheme, RFC 8785)
    and sign it. No specification, however, defines how a relying party verifies that,
    for one action, the several heterogeneous receipts it has been handed all bind
    the same canonical action and each verify under their own rules, yielding a single,
    offline, fail- closed ALLOW or DENY. This document defines the Authorization Evidence
    Chain (EP-AEC): a transport-agnostic composition object and an offline verification
    algorithm that references existing receipts, checks that every component binds
    one canonical action digest, dispatches each component to a verifier for its type,
    and evaluates a fail-closed requirement expression. EP-AEC introduces no new receipt
    type and replaces none; it is the verifier-side glue that lets independently specified
    receipts compose into one accountability decision.</p>'

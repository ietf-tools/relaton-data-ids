abstract:
- content: "<p>This document defines the Synthetic-Twin HTTP field. A sender adds
    the field to an HTTP request or response to say that the message was made by,
    or for, a synthetic twin and is not real user activity. A synthetic twin is a
    software model of a network estate, existing or planned. The field says which
    kind of synthetic message it is and can carry one opaque identifier. This lets
    operators keep synthetic messages apart from production messages in logs, analytics,
    billing, and alerting.</p>"

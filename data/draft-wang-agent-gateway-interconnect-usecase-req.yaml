abstract:
- content: "<p>This document defines use cases and requirements for interconnection
    of Agent Gateways (AGWs) across separate administrative domains. An Agent Gateway
    acts as a trust and protocol boundary for AI agents, mediating agent discovery,
    intent routing, policy enforcement, context translation, and secure cross-domain
    collaboration. This draft does not specify a wire protocol. Instead, it collects
    representative deployment scenarios and derives functional, operational, and interoperability
    requirements to guide future protocol design for AGW-to-AGW interconnection.</p>"

abstract:
- content: "<p>This document defines a domain-separated correlation value, the NOA
    Action Digest, that binds a verified human authorization for an agent action to
    the artifacts and external events associated with that action's execution attempt.
    The digest is a fixed-width value derived from an approved action's authorization
    record, its tenancy and chain identifiers, its parameter commitment, its execution
    grant, and a single-use nonce. It is designed to be embedded in external systems
    that carry an opaque, caller-chosen identifier, so that a third party can correlate
    an external event with a specific prior authorization. *The digest establishes
    correlation only. Equality of digests is not evidence that any statement made
    by any party about the action is true, and is not evidence that any action was
    executed or any effect occurred.*</p>"

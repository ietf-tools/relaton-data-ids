abstract:
- content: "<p>This document defines semantic interoperability requirements for the
    Judgment Event Protocol (JEP) [JEP]. JEP-Core defines signed J/D/T/V event semantics,
    Event Identity, Event Hash, references, validation checks, validation modes, extension
    processing, and idempotent acceptance. This document does not redefine those mechanisms.
    Instead, it defines the minimum shared interpretation rules required for independent
    systems to map, display, translate, and consume JEP events without silently changing
    their meaning. The core rule is that a JEP event records a signed protocol statement
    with defined verb semantics. It does not by itself establish external truth, authority,
    legality, causality, completeness, policy consequence, or external effect. Stronger
    conclusions require an explicitly selected profile or external evidence rule.</p>"

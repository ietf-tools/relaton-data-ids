abstract:
- content: "<p>The evolution toward 6G introduces demanding applications such as holographic
    communications, tactile internet, digital twins, and semantic communications,
    which may require fine-grained, per-packet Quality of Service (QoS) assurance.
    In these scenarios, 5QI may continue to be useful, but it may also need to be
    complemented by richer service QoS requirement information. Meanwhile, transport
    networks have developed powerful QoS technologies including FlexE hard slicing,
    Deterministic Networking (DetNet), Time-Sensitive Networking (TSN), and SRv6 Traffic
    Engineering policies, enabling per-packet scheduling precision at microsecond
    levels. However, several gaps remain. First, while 6G scenarios may require richer
    service QoS requirement information, current IP transport networks still rely
    on DSCP as the QoS handling mechanism. This could underutilize many effective
    fine-grained QoS assurance mechanisms already available in transport networks.
    Second, transport networks lack service-aware perception of upper-layer application
    attributes. Third, there is no cross-domain information synchronization mechanism
    between radio access and transport segments, preventing the formation of an end-to-end,
    full-link QoS assurance mechanism for 6G. This document provides a gap analysis
    structured around three core gaps: (1) the potential need to complement 5QI with
    richer service QoS requirement information for 6G and the potential underutilization
    of fine-grained transport QoS mechanisms due to continued reliance on DSCP in
    IP transport; (2) lack of service awareness in transport; and (3) missing cross-domain
    information exchange for end-to-end 6G full- link QoS assurance.</p>"

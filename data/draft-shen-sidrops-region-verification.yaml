abstract:
- content: "<p>BGP routing security is a critical issue affecting the stability and
    reliability of Internet services. Existing mechanisms, including Route Origin
    Authorization (ROA) and Autonomous System Provider Authorization (ASPA), effectively
    mitigate route origin hijacking, path hijacking, and route leaks in general scenarios.
    However, in real-world deployments, large Internet Service Providers (ISPs) managing
    multiple Autonomous Systems (ASes) remain vulnerable. Attacking networks can exploit
    carefully crafted routes to bypass ROA and ASPA validations, causing traffic hijacking
    within or between large ISPs. This document defines a region-based authorization
    and verification framework for multi-AS ISPs to prevent intra-ISP and inter-ISP
    traffic hijacking.</p>"

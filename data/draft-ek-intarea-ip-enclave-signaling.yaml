abstract:
- content: "<p>This document defines optional ICMP extension objects that a gateway
    at the boundary between an IP enclave and a managed constrained long- haul link,
    such as a scheduled deep-space link, can attach to existing Destination Unreachable
    messages. On the unreachable errors generated when an admitted packet cannot be
    forwarded because the required link is presently unusable, the objects convey
    the expected time until the link becomes usable, the time the estimate was generated,
    and the expected one-way delay of the link. On the administrative prohibition
    errors generated when the link's admission policy refuses a packet, a presence-only
    object identifies boundary- link admission policy as the source of the refusal.
    The underlying codes retain their existing meanings, and this document requests
    no new ICMP type or code. It specifies when the objects may be attached and what
    they convey, not how transports, applications, or hosts react to them; making
    the boundary's knowledge available to senders is intended to enable experimentation
    with such reactions.</p>"

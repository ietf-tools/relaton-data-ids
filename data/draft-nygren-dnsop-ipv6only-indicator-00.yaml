abstract:
- content: "<p>As the DNS is the primary mechanism for translating from hostnames
    to IP addresses, it is a logical place to signal that endpoints are IPv6-only.
    It is thus also a logical place to signal that legacy endpoints supporting IPv4
    are being deprecated. This specification introduces two SvcParams for SVCB-compatible
    RR types that signal IPv6-only endpoints (ipv6only) as well as deprecated endpoints
    (deprecated). TO BE REMOVED: This document is being collaborated on in Github
    at: https://github.com/enygren/draft-nygren-dnsop-ipv6only-indicator (https://github.com/enygren/draft-nygren-dnsop-ipv6only-indicator).
    The most recent working version of the document, open issues, etc. should all
    be available there. The authors (gratefully) accept pull requests.</p>"

abstract:
- content: "<p>Using a distinct holder-binding key for each Credential improves unlinkability,
    but generating and storing many keys in a Wallet secure area can be expensive
    or impossible. This document defines a way to derive unlinkable P-256 Credential
    keys from one protected parent key while retaining the parent's key-protection
    properties. It specifies this mechanism as an extension to OpenID for Verifiable
    Credential Issuance (OpenID4VCI), allowing the Issuer to derive each child public
    key while only the Wallet can use the corresponding child private key.</p>"

abstract:
- content: "<p>Revoking the authority of a delegated agent is not the same as proving
    that no consequential effect can still be committed under that authority. A revocation
    cut applied at one resource sink is not evidence of enforcement at another sink,
    and a software acknowledgement from a sink is only as trustworthy as the software
    that produced it. This document defines the Attested Fence Receipt (AFR), an Entity
    Attestation Token (EAT) profile emitted by the hardware-rooted Attesting Environment
    of a consequential sink after the sink has durably applied an authority-epoch
    fence. It further defines a verification procedure for individual receipts, a
    closure- evaluation procedure over a declared sink set that yields CLOSED, PARTIAL,
    FAILED, or UNKNOWN, and a hardware fence profile that binds the fence to measured
    state: an extend-only authority register, a monotonic counter, counter-gated derivation
    of per-epoch effect- attestation keys, and PCR-bound key release. The mechanism
    supplies the per-sink evidence that revocation-closure determinations require,
    and it is designed so that the absence of evidence can never be read as closure.</p>"

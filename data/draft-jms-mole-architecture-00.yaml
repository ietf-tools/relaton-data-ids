abstract:
- content: "<p>Moderation of unLinkable Endorsements (MoLE) is an architecture that
    lets a party performing access control (a Moderator) bootstrap trust in a client
    from a third party (an Anchor) that already has a trust relationship with that
    client, and then adjust that trust over time in response to the client's behaviour,
    for example by dynamically rate-limiting access. MoLE targets open deployments,
    in which independent parties may be responsible for access control and for vouching
    for clients, whilst maintaining strong privacy protections for clients. These
    protections are designed to hold even if participants in the ecosystem collude
    or otherwise misbehave. This document specifies the roles, the information flows
    between them, the privacy and security requirements, and deployment considerations.</p>"

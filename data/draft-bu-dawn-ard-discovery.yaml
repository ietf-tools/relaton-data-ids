abstract:
- content: "<p>This document specifies the catalog representation and lookup protocol
    for Agent Resource Discovery (ARD), an open architecture for publishing, discovering,
    and searching software agent capabilities across federated networks. ARD defines
    a JSON-LD capability description envelope (the ARD Entry) and catalog container
    (the ARD Manifest) identified by domain-anchored Uniform Resource Names (URNs),
    cryptographic publisher authority bindings (the Trust Manifest), and an HTTP query
    interface supporting structured, semantic, and federated search across registries.
    Initial contact for discovering catalog entry points and active agent registration
    are specified in companion ARD documents.</p>"

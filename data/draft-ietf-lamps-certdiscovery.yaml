abstract:
- content: "<p>This document specifies a method to discover a referenced X.509 certificate
    associated with the current X.509 certificate. This enables efficient multi-certificate
    or fallback certificate handling in protocols. The objective is threefold: to
    enhance cryptographic agility, improve operational availability, and accommodate
    multi-key/ certificate usage. The proposed method aims to maximize compatibility
    with existing systems and is designed to be legacy- friendly, making it suitable
    for environments with a mix of legacy and new implementations. It includes mechanisms
    to provide a URI from which the referenced X.509 certificate can be retrieved
    as well as information about the target certificate's signature and public key
    algorithm, empowering relying parties to make informed decisions on whether to
    retrieve the Referenced Certificate, and a certificate hash to ensure that the
    correct certificate was retrieved.</p>"

abstract:
- content: "<p>This document specifies a companion profile to the AI Agent Authentication
    and Authorization draft [I-D.klrc-aiagent-auth], defining a signed authorization-evidence
    record produced by WIMSE- authorized AI agent actions. The evidence record (referred
    to as a Permit) cryptographically commits to the canonical bytes of the request
    authorized before dispatch and, via a paired Closure Record, to the recorded dispatched-request
    digest; it maps to and can satisfy the audit minimum requirements enumerated in
    Section 11 of the companion draft, and composes with HTTP Message Signatures,
    OAuth access tokens, and Shared Signals Framework eventing without requiring modifications
    to those existing standards. The profile is anchored in the SCITT profile defined
    in [I-D.munoz-scitt-permit-profile]. This revision also describes how WIMSE deployments
    compose with authorization-lineage evidence defined by the companion SCITT profile:
    workload identity, delegated subject context, runtime token claims, and HTTP Message
    Signature coverage become Verifier inputs for parent/child Permit relationships.</p>"

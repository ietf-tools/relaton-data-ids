abstract:
- content: "<p>Autonomous agents act through tool invocations whose consequences outlive
    the sessions that produce them. Pre-action constraint families gate whether an
    agent may act: environment.* attests boolean world-state, and verification.* attests
    calibrated confidence over factual claims. No sibling family records, under equivalent
    verification discipline, what the agent then did. This document defines the evidence.*
    family: append-only, hash-chained, signature- bound evidence records of agent
    actions, designed so that a third party can recompute every verdict from signed
    primitives and a published key, without trusting the operator's runtime. It defines
    the family's membership criterion (independent recomputability with fail-closed
    verification), the family-wide record vocabulary and canonicalization discipline,
    a tri-state verification protocol (VALID, INVALID, UNVERIFIABLE), composition
    with the pre-action sibling families, and the conformance-vector discipline under
    which independent implementations demonstrate byte-level agreement. One reference
    record type, evidence.action, is specified together with its frozen conformance
    corpus. This document deliberately states what an evidence record does not prove.</p>"

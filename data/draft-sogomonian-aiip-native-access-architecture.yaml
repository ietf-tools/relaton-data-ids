abstract:
- content: "<p>The Internet evolved around human interaction and information exchange.
    Technologies such as DNS, HTTP, and the World Wide Web created a universal access
    layer that enables people to discover resources, retrieve information, and interact
    with services through common protocols and interfaces. As autonomous systems become
    increasingly capable of acting on behalf of users and organizations, new interoperability
    challenges emerge. Agents, robots, tools, and autonomous services must discover
    resources, invoke actions, delegate authority, execute tasks, enforce policy,
    and obtain verifiable outcomes across independently developed implementations.
    This document explores the concept of a native Internet access architecture for
    autonomous systems. It examines whether autonomous systems require a common Internet-layer
    framework analogous to the role that DNS, HTTP, and the Web played for human information
    exchange. The document provides architectural context for AIIP-related work, including
    identifiers, discovery, invocation, execution, delegation, policy enforcement,
    and execution outcome verification. This document is a problem statement and architectural
    exploration. It does not define protocol mechanisms.</p>"

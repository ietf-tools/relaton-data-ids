abstract:
- content: "<p>Existing approaches bind a Segment Routing (SR) Policy to a Network
    Resource Partition (NRP) on a one-to-one basis, which lacks flexibility and introduces
    significant operational overhead as the number of NRPs scales, especially when
    multiple NRPs share the same SR Policy path. This document defines BGP extensions
    to advertise NRP Identifier (NRP ID) information within BGP Update messages between
    headend and endpoint nodes. It decouples SR Policies from NRPs, allowing multiple
    NRPs to share a common SR Policy path and avoiding linear growth of SR Policies.
    The proposed design reduces operational complexity and also applies to SR Best
    Effort (SR BE) scenarios.</p>"

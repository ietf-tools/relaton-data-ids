abstract:
- content: "<p>fmsg is a message exchange protocol that combines ownership and control
    at the domain level, as provided by Internet email, with the efficient conversational
    messaging usually associated with closed messaging applications. Messages are
    immutable, structured binary objects exchanged directly between the hosts responsible
    for the sender's and recipients' domains. Each message may link to a previous
    message using a cryptographic hash, forming verifiable threads, so that replies
    convey only newly created content rather than reproducing earlier correspondence.
    A receiving host validates the origin, integrity and ancestry of a message, and
    applies recipient policy, before accepting its content. Only the participants
    of a message may reply to it, and participants may add additional recipients after
    a message has been sent. A distinguishing feature of fmsg is that the receiving
    host can call back the sending host during message exchange to challenge for details
    of the message being sent. Processing such a challenge requires the sending host
    to be reachable and to compute additional digests over the pending message, strengthening
    sender verification and message integrity. This document describes the motivation
    and architecture of fmsg, which is based on an existing experimental protocol
    specification and implementation. Its purpose is to solicit IETF feedback on venue
    and scope before the specification is developed into standards-track documents.</p>"

abstract:
- content: "<p>This document specifies the OpenHTTPA Hierarchical Measurement Protocol
    (OHMP), a distributed, zero-trust attestation protocol operating over the OpenHTTPA
    transport layer. OHMP replaces static, manually pinned measurement configurations
    with a hierarchy of hardware-backed Trusted Execution Environment (TEE) Measurement
    Authorities. To ensure split-view resistance and cryptographic accountability,
    OHMP integrates OHMP-TL, an append-only binary Merkle Transparency Log requiring
    M-of-N multi-cloud threshold signatures.</p>"

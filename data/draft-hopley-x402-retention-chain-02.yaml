abstract:
- content: "<p>This document specifies two cryptographic constructions for self-verifiable
    agentic payment records. The first, the Retention Chain Reference (retention_chain_ref),
    enables tamper-evident audit chains linking payment receipts without requiring
    external infrastructure. The second, the Payment Action Lifecycle, defines a content-addressed
    model for the exactly-once execution of payment actions, including an action reference
    primitive (action_ref) and a per-state transition hash (transition_hash) with
    a provable SKIP-on- retry idempotency guarantee. Both constructions use only SHA-256
    and the JSON Canonicalization Scheme (JCS, RFC 8785), and are verifiable by any
    party holding the relevant receipts without contacting the issuer. The constructions
    satisfy the transaction recording and audit trail obligations of MiCA Article
    80, DORA Article 14, and AMLR Article 56.</p>"

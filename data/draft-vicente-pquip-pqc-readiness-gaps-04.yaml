abstract:
- content: "<p>This document identifies observability gaps that prevent network operators
    and security teams from determining the post-quantum cryptography (PQC) readiness
    state of networked computing environments. PQC readiness requires knowing which
    cryptographic algorithms are in use across the environment, which are vulnerable
    to quantum attack, and which have been or are being migrated to NIST- approved
    PQC algorithms. Current network protocols and management frameworks do not provide
    sufficient visibility to answer these questions at scale.</p>"

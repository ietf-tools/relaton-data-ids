abstract:
- content: "<p>The charter of the Discovery of Agents With Names (DAWN) working group
    asks it to specify the minimum public discovery information that a client obtains
    when it discovers an AI resource. An individual draft on DAWN terminology defines
    Minimum Discoverable Information (MDI) as the minimum amount of information an
    entity needs to provide to become discoverable, distinguishes it from the Minimum
    Viable Dataset (MVD) that a discovery mechanism needs as input, and gives only
    examples of the content of either. Individual drafts on the DAWN problem statement
    and requirements call for a standardized minimum structure and list what it must
    at least contain; in its absence, emerging discovery formats risk each defining
    its own minimal metadata, with descriptors that do not interoperate across organizational
    or protocol boundaries. This document addresses the minimum public discovery information
    as a client obtains it and as a publisher provides it, and its relation to the
    input of discovery; registration mechanisms are outside its scope. Using the distinction
    RFC 3444 draws between information models and data models, it describes the information
    involved in publication, lookup, and response; proposes a procedure that derives
    what is minimal for each deployment context from the scope of the charter; applies
    the procedure to the charter's three deployment contexts: a local network, an
    organization, and the domain of a cooperating party; and proposes a set of elements
    with the minimal constraints that hold among them. Information can be supplied
    by the discovery response, by context the client already has, or by binding rules.
    This document is input to the DAWN architecture and protocol work; normative definitions
    that affect interoperability belong to the corresponding Standards Track documents.
    It is a mapping target for richer descriptors.</p>"

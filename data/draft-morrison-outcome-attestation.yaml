abstract:
- content: "<p>This memo specifies outcome attestation without disclosure. One party,
    the prover, produces a verifiable attestation that a defined interaction outcome
    occurred against a consented target, and discloses neither the method that produced
    the outcome nor the input data the method consumed. The attestation is a signed
    object carrying a zero-knowledge proof that an outcome predicate, defined by a
    referee, evaluated true over a private witness, together with the public statement
    the predicate was evaluated against. A verifier learns that the outcome occurred.
    It does not learn the technique, the payload, or any data category the prover
    was obliged to keep local. The Compute-Location Gate draft states in its scope
    boundary that it gives no cryptographic proof that a data category was excluded
    from a derivation. Where the prover committed to the derivation's input set before
    the derivation, this memo lets it show that a stated category is absent from that
    committed set. The signature envelope is COSE or JOSE, and no new signature algorithm
    is introduced. The subject of an attestation here is the outcome of an interaction,
    where remote attestation covers the state of a platform. No new transport is introduced.</p>"

abstract:
- content: "<p>National security systems of the United States are moving to the algorithms
    of the Commercial National Security Algorithm Suite 2.0, on a published NSA timeline.
    An acquiring party receives from each supplier an inventory of the cryptographic
    algorithms its product carries, in a supplier-chosen spelling, and has no shared
    procedure for ruling on that inventory. This document specifies a closed profile
    of the CNSA 2.0 algorithm set, a name-folding step, a ruling procedure that returns
    one verdict and one reason for every entry, a pair of digests over the canonical
    input and the canonical ruling, and conformance vectors. The ruling is a pure
    function of published tables, so any two parties who hold the same tables and
    the same inventory reach the same digests. A keyed mode lets two parties compare
    digests while keeping the inventory from everyone else. A ruling is a verdict
    against a published profile and carries the endorsement of no agency.</p>"

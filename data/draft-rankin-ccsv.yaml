abstract:
- content: "<p>This document specifies the Control-Character-Separated Values (CCSV)
    file format, a UTF-8 encoded tabular data format that uses ASCII control characters
    as field and record separators. CCSV is intended for exchanging structured, rectangular
    data between applications such as databases, spreadsheets, statistical software,
    and data conversion utilities. This document also specifies the text/csv media
    type for CCSV files.</p>"

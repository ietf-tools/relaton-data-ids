abstract:
- content: "<p>This document defines a normalization procedure for YANG-modeled information.
    The procedure enables different serialized representations conveying equivalent
    information to produce the same normalized representation independently of the
    input encoding and applicable representation conventions. The normalized representation
    is intended to support comparison, hashing, integrity verification, provenance,
    and other procedures that require consistent representation of equivalent YANG-modeled
    information.</p>"

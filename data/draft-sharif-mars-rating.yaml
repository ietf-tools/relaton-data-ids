abstract:
- content: '<p>Existing AI-security frameworks catalogue the threats an organisation
    faces and the controls it ought to implement. They answer the question "what should
    I do?". They do not answer the question that now decides survival: "if an autonomous
    AI adversary attacks this system, does it hold, and how well?". This document
    defines Machine- Adversary Resistance (MARS), an outcome rating that measures
    how well a tool, system, or defended surface resists an autonomous AI adversary.
    MARS scores a target on five resistance axes, assigns a zero-to-five rating gated
    by the weakest axis, and requires that any rating above two be backed by measured,
    tamper-evident evidence rather than self-declaration. MARS is an outcome layer
    intended to sit above, and to consume, existing control catalogues; it is not
    a replacement for them. This document is a proposal and a starting point for discussion,
    not a ratified standard.</p>'

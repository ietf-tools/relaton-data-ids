abstract:
- content: "<p>This document defines terminology for the security evaluation of AI
    agents. It establishes a shared vocabulary for four first-level evaluation dimensions
    -- Foundation Model Security, Interaction Security, Operational Security, and
    Basic Security -- for the 55 second-level evaluation metrics organized under those
    dimensions, for the common metric evaluation convention that applies to all of
    them, and for the three agent security risk levels. This document defines terminology
    only. It does not prescribe evaluation procedures; the procedures are specified
    in [I-D.han-bpm-agent-security-benchmark-methodology], and the System Under Test
    boundaries and evaluation scenarios are specified in [I-D.han-bpm-agent-security-benchmark-profiles].</p>"

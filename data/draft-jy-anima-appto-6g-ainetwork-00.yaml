abstract:
- content: "<p>This draft starts with AI-agents, AI-Agent network (AAN) and various
    types of AAN realization models. It elucidates two 6G network-AI intergrated issues,
    with the focuse on the aspect of the 6G AI-for- network. The 6G architecture defines
    two core intelligent AI-agents that can be categorized as the AI-powered autonomic
    service agent or AI-ASA in the context of the ANIMA domain. Based on the reference
    model and constituent entities of the autonomic networking ecosystem, the ANIMA
    model is applied to correlate the mattered 6G entities with different components
    of the ANIMA ecosystem.</p>"

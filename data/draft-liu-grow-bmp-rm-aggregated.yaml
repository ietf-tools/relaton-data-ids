abstract:
- content: "<p>This document proposes two complementary optimizations for the BGP
    Monitoring Protocol (BMP) Route Monitoring message to significantly reduce network
    overhead and improve monitoring efficiency. The first optimization defines an
    aggregated BMP Route Monitoring message based on the Multi-Peer Header mechanism,
    which compresses multiple BMP Route Monitoring messages into a single aggregated
    message by leveraging BGP group packaging technology. The second optimization
    introduces a Common Update TLV that eliminates redundant transmission of routes
    unchanged by inbound or outbound policies across different RIB views. These optimizations
    work together to reduce the number of reported BMP messages, decrease bandwidth
    consumption, and improve processing efficiency for both monitored routers and
    monitoring stations.</p>"

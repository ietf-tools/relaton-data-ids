abstract:
- content: "<p>This document introduces a Power Conserving Path Placement Strategy
    (PCPPS). During periods of low demand, PCPPS concentrates traffic onto a small
    set of network resources. This causes other network resources to become idle or
    nearly idle. When demand increases, PCPPS redistributes traffic as required.</p>"

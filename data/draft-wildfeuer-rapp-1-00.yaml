abstract:
- content: "<p>RAPP/1 is a profile over existing standards that lets independent programs
    exchange verifiable, content-addressed records about agents: one canonicalization
    (JCS), one domain-separated hash, one mint-once identity, one eleven-key event
    envelope, one wire, and one package format. Two independent implementations that
    follow this document produce byte-identical artifacts with no out-of-band agreement.
    The normative text of record is the append-only specification chain published
    by the author; this document is a stable, archival rendering of it: revision rev-18,
    chain frame 83bec7762a04959dc91e252055d79f67690c605383018d23b26b99982916dd6a,
    normative SHA-256 e81e20ba9402ee96422f73e9ef737eba100264155c8f77521600766be8fb21e9.
    Any later revision supersedes this rendering; the chain, not this document, says
    which is current.</p>"

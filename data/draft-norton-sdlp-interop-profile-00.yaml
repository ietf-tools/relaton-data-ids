abstract:
- content: "<p>This document defines an interoperability profile for the Secured Digital
    Lifecycle Protocol (SDLP). The profile specifies how SDLP canonical objects, identity,
    lineage, lifecycle state, and digests are composed with ownership binding, trust-root
    pinning, and relying-party admission semantics. It defines a transition vector
    model, a binding result vocabulary, and composition rules for integrating SDLP
    with provenance and transparency systems such as CAID, AEC, AEB, SCITT, and EMILIA,
    without changing the core SDLP semantics.</p>"

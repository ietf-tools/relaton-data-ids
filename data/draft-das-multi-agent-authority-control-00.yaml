abstract:
- content: "<p>Each AI agent can hold a valid permission and the group can still do
    something nobody authorized. When Apple Siri hands a task to an app through App
    Intents, Google Gemini delegates to Android apps and cloud agents, or an orchestrator
    dispatches sub-agents across iOS, iPadOS, macOS, Android, Windows, Linux, cloud
    APIs, and connected devices, authority is copied, narrowed, widened, and combined
    along the way. Prompt-injection-driven delegation, confused-deputy escalation,
    replayed agent approvals, conflicting writes to the same resource, duplicated
    payments, stale reservations, overspent shared budgets, colluding or non-independent
    evaluator quorums, and a final tool call detached from its originating authority
    are typical results. This document, Part 5 of a twelve-part series, specifies
    multi-agent control for execution finality. It describes protected arbitration
    of conflicting effects across agents using effect footprints and atomic reservations;
    cryptographic delegation lineage across providers with transitive scope attenuation,
    so that a sub-agent can never receive more authority than its parent; version-bound
    concurrency checks; authenticated quorum membership with operation- bound approval
    certificates and separation of duties; budgets conserved across branches of a
    delegation tree; revocation that reaches every descendant; and independent Finality
    Sink verification of the actual resource effect. Reference algorithms, ten threat
    models, and twenty-four reproducible positive and negative tests, including an
    iOS and Android cooperating-receiver case, are included. Part 1 of the series
    defines the shared terminology and common workflows. The document relates these
    mechanisms to OAuth 2.0 Rich Authorization Requests, Resource Indicators, Token
    Exchange, Demonstrating Proof of Possession (DPoP), and current security best
    practice; the Grant Negotiation and Authorization Protocol (GNAP); Workload Identity
    in Multi-System Environments (WIMSE) and its agent-delegation discussions; Remote
    ATtestation procedureS (RATS); CBOR Object Signing and Encryption (COSE); Supply
    Chain Integrity, Transparency, and Trust (SCITT); Authentication and Authorization
    for Constrained Environments (ACE); and HTTP conditional requests. These are treated
    as qualified inputs rather than final authority, without claiming working-group
    adoption or IETF consensus. Industry alignment covers Apple iOS, iPadOS, and macOS
    with Siri, Shortcuts, and App Intents; Google Android with Gemini, Binder, and
    intents; Samsung Bixby and Microsoft Copilot; Microsoft Windows and Azure agent
    orchestration; agent platforms from OpenAI, Anthropic, Google Cloud, and Meta;
    NVIDIA, Qualcomm, Arm, and Huawei hardware; banking and payments; enterprise SaaS,
    procurement, and inventory; robotics; and telecommunications. Product names are
    illustrative and imply no endorsement or implementation by any vendor. For the
    EU Artificial Intelligence Act (Regulation (EU) 2024/1689), traceable delegation
    lineage, bounded authority, and quorum-based approval can help providers and deployers
    address human-oversight, record-keeping, risk-management, and robustness and cybersecurity
    requirements where those obligations apply; this is a technical mapping, not a
    conformity claim or legal advice.</p>"

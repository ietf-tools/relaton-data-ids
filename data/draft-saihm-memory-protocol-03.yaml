abstract:
- content: "<p>This document defines the Sovereign AI Horizontal Memory (SAIHM) protocol,
    a memory layer for AI agents. A SAIHM operator stores an agent's memory as encrypted
    cells bound to a post-quantum holder identity, records each state change in a
    public audit log, and supports revocable sharing contracts. The protocol defines
    an erasure operation with two stated erasure classes, intended to help an operator
    meet its obligations under Article 17 of EU Regulation 2016/679 (GDPR). This revision
    specifies the custodial profile. The operator holds the holder's keys and performs
    all cryptography. The agent-side client holds no keys, runs no cryptography beyond
    TLS and keeps no store; it reaches the operator over HTTPS and exposes the protocol
    to the agent as eight Model Context Protocol (MCP) tools. The document defines
    the operator obligations, the HTTPS binding, the eight tools, and the checks a
    conformant client applies to what the operator returns.</p>"

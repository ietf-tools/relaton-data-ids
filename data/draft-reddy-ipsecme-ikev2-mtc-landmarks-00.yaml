abstract:
- content: "<p>This document specifies the use of Merkle Tree Certificates (MTCs)
    in the Internet Key Exchange Protocol Version 2 (IKEv2). An IKE peer sends an
    MTC in place of a directly-signed end-entity certificate and its chain of Certification
    Authority (CA) certificates. The MTC carries an inclusion proof in place of CA
    signatures, which reduces the size of the IKE_AUTH exchange, in particular with
    post-quantum signature algorithms such as ML-DSA and SLH-DSA. This document defines
    a Certificate Encoding for the Certificate Request payload that carries trust
    anchor identifiers. An IKE peer uses these identifiers to indicate the MTC CAs
    and landmarks it trusts.</p>"

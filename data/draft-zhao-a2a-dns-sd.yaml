abstract:
- content: '<p>The Agent2Agent (A2A) protocol defines how two agents communicate once
    one knows the other''s URL, and how an agent''s self-description (the Agent Card)
    is retrieved from a well-known URI at that URL. It does not define how agents
    on the same host or local network find each other in the first place. This document
    profiles DNS-Based Service Discovery (DNS-SD) over Multicast DNS (mDNS) for that
    purpose: it defines the "a2a" service type, the TXT record keys used with it,
    the discovery procedure, and the security model under which discovery results
    are treated as hints whose trust is established by Agent Card verification, not
    by the discovery channel. It also requests IANA registration of the "a2a" service
    name.</p>'

abstract:
- content: "<p>This document describes operational requirements for exchanging network
    state in agent-assisted network operations. In this document, an agent-assisted
    system is any automation or decision- support system that consumes operational
    state to support tasks such as anomaly triage, incident correlation, configuration
    verification, traffic engineering analysis, or attack mitigation support. Such
    a system may use a large language model (LLM), a rule engine, a statistical model,
    or conventional software. The document focuses on operational problems created
    by high-volume telemetry, cross-domain state sharing, privacy constraints, approximate
    state summaries, and auditability of state used by automated workflows. It identifies
    requirements for compact, scoped, mergeable, bounded-error, incrementally synchronized,
    and auditable network state artifacts. The document complements existing NMOP
    work on anomaly detection, incident management, and YANG Push/message broker integration.
    It does not define a new network management protocol, a new agent communication
    protocol, or a wire format.</p>"

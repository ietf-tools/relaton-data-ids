abstract:
- content: "<p>This document defines an extension to Media over QUIC Transport (MOQT)
    that lets a subscriber limit the number of subgroup streams and the total bytes
    a publisher may send for an individual subscription. It defines a Setup Option
    to negotiate the extension and set initial limits, message parameters for advertising
    these limits, messages for granting credit and signaling flow control state, and
    a session error code.</p>"

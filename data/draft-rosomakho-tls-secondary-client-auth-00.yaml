abstract:
- content: "<p>Some deployments authenticate a client using two certificates, such
    as one identifying a device and another identifying its user. This document defines
    the secondary_client_certificate TLS flag to negotiate one additional client authentication
    exchange as part of connection establishment. The server sends an additional CertificateRequest
    immediately after its Finished, and the client responds after its own handshake
    Finished and before sending application data. Either certificate response can
    be empty, and the server determines whether the resulting authentication state
    satisfies its policy. This document updates RFC 9846 to permit the additional
    request before the server receives the client's Finished. It also updates RFCs
    9001 and 9113 to permit this negotiated exchange with QUIC and HTTP/2.</p>"

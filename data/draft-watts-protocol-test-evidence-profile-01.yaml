abstract:
- content: "<p>This document proposes a narrow record profile for describing software
    protocol-conformance test runs, including the tested artifact, test suite, implementation,
    execution environment, individual case outcomes, digests, and known limitations.
    It does not define a new signature scheme, attestation architecture, transparency
    service, or general-purpose test-output language. Implementations are encouraged
    to reuse existing mechanisms such as SCITT statements, RATS terminology, COSE,
    JSON canonicalization, and existing test-report formats where suitable. This individual
    draft candidate has not been submitted to or endorsed by the IETF.</p>"

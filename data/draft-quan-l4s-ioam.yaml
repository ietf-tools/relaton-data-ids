abstract:
- content: "<p>This document specifies a framework that uses operational and telemetry
    information collected by In Situ Operations, Administration, and Maintenance (IOAM)
    to support the monitoring and parameter adjustment of an L4S Dual-Queue Coupled
    AQM within a single limited domain. IOAM Direct Export reports path and node information,
    such as hop-by-hop delay and queue depth, to an IOAM Control Center (IOAM-C).
    The IOAM-C correlates this information and may adjust operator-configurable AQM
    target or threshold parameters within configured bounds. This document does not
    modify the L4S ECN protocol, the IOAM data formats, or the packet forwarding behavior
    defined by the referenced specifications.</p>"

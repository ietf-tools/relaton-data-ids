abstract:
- content: "<p>This document outlines some issues to consider when studying data relating
    to the Internet standards development ecosystem. It identifies observable components
    of standards development processes, proposes a taxonomy of possible measurements,
    and highlights methodological, interpretive, and ethical considerations. It is
    intended to support a range of uses, including monitoring standards development
    organisations (SDOs), evaluating the evolution of technical work, understanding
    technology deployment, and informing community, leadership, and governance discussions.
    This document is submitted for consideration by the Research and Analysis of Standard-Setting
    Processes Research Group (RASPRG) in the IRTF. It is not an IETF product and is
    not a standard.</p>"

abstract:
- content: "<p>This document specifies a deterministic cryptographic verification
    profile for execution traces, delegation chains, and weight-custody manifests
    generated by autonomous artificial intelligence (AI) agents operating across Model
    Context Protocol (MCP), Agent-to-Agent (A2A), and enterprise system-of-record
    boundaries. The profile binds JSON Canonicalization Scheme (JCS, RFC 8785) pre-image
    serialization, Ed25519 (RFC 8032) and ECDSA P-256/P-384 signatures, JSON Web Key
    (JWK, RFC 7517) thumbprint pinning, and fail-closed revocation and freshness checks
    so that relying parties can independently verify whether an agent action was authorized
    prior to commit.</p>"

abstract:
- content: <p>This document updates RFC 7518 (JSON Web Algorithms (JWA)) to deprecate
    the JSON Web Signature (JWS) algorithm "none" and the JSON Web Encryption (JWE)
    algorithm "RSA1_5". These algorithms have known security weaknesses. It updates
    RFC 7519 (JSON Web Token (JWT)) so that these two algorithms are no longer mandatory
    to implement. It also updates the review instructions for Designated Experts to
    establish baseline security requirements that future algorithm registrations are
    expected to meet.</p>

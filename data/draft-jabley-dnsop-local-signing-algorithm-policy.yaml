abstract:
- content: "<p>Security-aware resolvers validate signatures, where available, in order
    to protect their clients from inauthentic data. DNSSEC treats all algorithms as
    equal when it comes to validation, such that a single valid signature is considered
    sufficient proof of authenticity, and that data is only to be judged to be inauthentic
    if all available signatures are found to be invalid. However, a resolver might
    have a different local policy, e.g. in its handling of quantum-safe signatures.
    This document discusses such local policy and describes a means to indicate to
    a client that specific local policy has been applied to response validation.</p>"

abstract:
- content: "<p>This document defines a profile model and optional interoperability
    bindings for the Judgment Event Protocol (JEP) [JEP]. JEP-Core defines a narrow
    signed event protocol. Profiles define deployment- specific rules for actor identifiers,
    key resolution, actor binding, credentials, authorization context, attestation,
    freshness, audience, replay-related mechanisms, archival evidence, chain interpretation,
    and policy integration without changing JEP-Core semantics. Profiles are optional.
    A JEP-Core implementation MUST NOT require DID, Verifiable Credentials, X.509,
    OAuth, OpenID Connect, RATS, blockchain anchoring, HJS, JAC, a particular AI platform,
    or any other optional profile for Core conformance.</p>"

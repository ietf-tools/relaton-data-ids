abstract:
- content: "<p>This memo describes a profile by which an autonomous agent that has
    no human or organisational principal at the root of its delegation chain registers
    itself, on its own behalf, as an economic principal in a transparency service,
    and by which that registration is the specific act that makes the agent eligible
    to be paid for subsequent reads of its own identity record. Admission of the agent's
    Signed Statement to the transparency service is gated on settlement of an HTTP
    payment challenge returned with the 402 (Payment Required) status. The profile
    makes no change to the registration semantics of the underlying transparency service:
    payment is expressed as an operator Registration Policy and authentication-layer
    concern, and where the payment is authoritative to the admission decision the
    payment proof is carried as an authenticated input committed to the service's
    verifiable data structure, so that admission remains a deterministic function
    of committed inputs and stays replayable by an auditor. The profile is positioned
    against the current agent- identity drafts, which either require a human principal
    at the root of the chain or leave the owner-less case undefined; it occupies that
    undefined seam without contradicting them. This document is Informational.</p>"

abstract:
- content: "<p>BGP Flow Specification (FlowSpec) provides mechanisms to distribute
    traffic filtering and steering rules across BGP networks. This document specifies
    BGP FlowSpec procedures to steer matching traffic flows into Segment Routing (SR)
    Policies. Specifically, it defines normative protocol mechanisms for combining
    FlowSpec NLRI with specific BGP Extended Communities for transport policy steering
    in SR-MPLS and SRv6 networks (Mode 1), alongside the BGP Prefix-SID Attribute
    when egress service context execution is required in SRv6 networks (Mode 2).</p>"

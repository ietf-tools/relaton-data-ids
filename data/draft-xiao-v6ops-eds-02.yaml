abstract:
- content: <p>This document describes Enhanced Dual Stack (EDS), a framework intended
    to reduce the operational risk and upfront workload of introducing IPv6 into an
    existing IPv4 network. EDS consists of two complementary mechanisms. First, connectivity-informed
    destination selection updates Rule 6 of RFC 6724 Section 6 from "Prefer higher
    precedence" to "Prefer higher precedence unless recently failed", so that recently
    failed IPv6 connectivity is not repeatedly preferred over IPv4. Second, operational
    diagnostics provide information that helps network administrators understand why
    IPv6 was not used and identify problems that can be corrected over time. With
    these mechanisms, IPv6 deployment can move from extensive upfront validation toward
    practical upfront validation followed by gradual operational improvement. This
    simpler IPv6 introduction approach can enable enterprises that do not have much
    IPv6 expertise and do not need a large number of IP addresses provided by IPv6
    to try IPv6.</p>

abstract:
- content: "<p>PIM Join Attributes specification defines the handling principles for
    PIM Join attributes with same type of RFF Vector and Explicit RFP Vector, but
    with different contents are received. However, it does not address scenarios where
    one downstream router includes a RFF Vector in its message while another does
    not. This leaves the handling of such conflicts unspecified. This document updates
    RFC 5496 and RFC 7891 by supplementing the existing specifications with handling
    rules for this specific conflict scenario.</p>"

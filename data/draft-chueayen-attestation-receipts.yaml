abstract:
- content: "<p>This document specifies two compact JSON records, signed with Ed25519
    and verifiable offline under a pinned public key. The first is an attestation
    receipt for an AI inference decision, binding an outcome to a request hash. The
    second, added in this revision, is an action record: the decision an enforcement
    point takes before an agent's proposed tool call or other state-changing action
    runs, whether that decision is to allow or to refuse. An action record is signed
    by the enforcement point, never by the agent, and binds the decision to a hash
    of the exact canonical arguments proposed. The document also describes how a human
    approval can be bound to exact action values with single use and expiry, how either
    record could be carried as a COSE_Sign1 Signed Statement and registered with a
    SCITT Transparency Service, and where the current format does not yet do so. Both
    formats are intended for settings where an operator-controlled log is not, on
    its own, sufficient evidence of the decision.</p>"

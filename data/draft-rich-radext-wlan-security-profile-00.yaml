abstract:
- content: "<p>RADIUS has attributes that let an IEEE 802.11 authenticator report
    the AKM suite and pairwise cipher selected for an association. That is useful,
    but it is not enough anymore. IEEE 802.11, as amended, also defines security profiles.
    A security profile is the complete set of AKM, pairwise cipher, and related security
    capabilities accepted for an association. The problem is that the AKM and the
    pairwise cipher no longer maps to a single security profile. Using these two values,
    the RADIUS server cannot tell which of the security profiles was accepted. This
    document defines the WLAN-Security-Profile RADIUS attribute. The attribute reports
    the IEEE 802.11 security profile accepted by the responder for the association.
    It complements the existing IEEE 802 network attributes.</p>"

abstract:
- content: "<p>This document defines the prompt Uniform Resource Identifier (URI)
    scheme for identifying prompts within AI agent sessions. A prompt URI encodes
    the agent identity, session identifier, and a timestamp sufficient to locate the
    originating prompt within an agent session log. The scheme is intended for use
    in provenance records, audit trails, and cross-agent references where a human-readable,
    stable locator for a prompt interaction is required. This document also addresses
    the conditions under which multiple URIs MAY resolve to the same prompt and the
    conditions under which a single URI MAY be ambiguous with respect to the prompt
    it identifies.</p>"

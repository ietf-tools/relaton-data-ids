abstract:
- content: "<p>Agentic systems can authenticate successfully, hold a valid authorization
    object, and still be unsafe to execute because required evidence is missing, the
    software has not reached a required assurance stage, the authority epoch is stale,
    a prior revocation is unresolved, or a human-approval requirement is unsatisfied.
    This document defines the High-Assurance Agent Control Envelope (HAACE), a protocol-neutral
    profile that binds an exact agent action to identity status, authorization state,
    policy, assurance stage, evidence state, authority epoch, revocation state, oversight
    requirements, and an action-time decision. HAACE requires fail-closed treatment
    of missing or indeterminate prerequisites, separates authorization from execution,
    and produces non-bearer decision and execution receipts.</p>"

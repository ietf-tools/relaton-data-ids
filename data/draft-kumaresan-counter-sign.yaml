abstract:
- content: "<p>Autonomous software agents can now take consequential actions on an
    organization's behalf, such as moving money or changing production systems. Existing
    agent protocols standardize how an agent reaches tools and how agents reach one
    another, but not how a specific action is authorized by a human in a way that
    stays verifiable after the fact. This document describes counter-sign, an open
    protocol for agent-to-human authorization. An agent emits a signed Intent that
    states the action it proposes to take. One or more humans return signed Countersignatures
    that authorize the action, each signed with a key the coordinating service does
    not hold. Every decision produces a tamper-evident receipt that can be verified
    offline. The protocol defines the Intent and Countersignature objects, a per-
    approver-key quorum model for separation of duty, an enrollment registry that
    binds actors to keys, and a hash-chained receipt log. Conformance test vectors
    accompany the specification.</p>"

abstract:
- content: "<p>This document describes an agentic AI workflow for detecting and mitigating
    structural and semantic errors, including hallucinated policy content, when translating
    a natural-language network intent into structured policies. The workflow coordinates
    role-specialized language-model functions with deterministic validation tools
    within a predefined action space and a bounded retry budget. Schema- constrained
    generation limits structural defects, while cross-slot checks and intent-faithfulness
    assessment identify a potentially unsupported or inconsistent policy content.
    Structured validation traces guide targeted re-extraction and regeneration. Unresolved
    cases retain explicit failure status for downstream review. This document describes
    component interactions, validation outcomes, and recovery behavior, and also presents
    a 3GPP TS 28.312-based instantiation for mobile network management.</p>"

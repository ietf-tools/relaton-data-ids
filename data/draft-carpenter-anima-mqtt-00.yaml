abstract:
- content: "<p>This document describes how devices authorized to join an autonomic
    control plane as defined in RFC 8994 may use the OASIS MQTT Publish/ Subscribe
    Telemetry mechanism to share arbitrary information. An MQTT message broker is
    required for this process and may be announced by the GRASP (RFC 8990) flooding
    mechanism.</p>"

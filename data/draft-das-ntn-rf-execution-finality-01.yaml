abstract:
- content: <p>A LEO constellation computer can compute a transmit burst, a beam command,
    an inter-satellite forward, or a user-terminal PA enable faster than any ground
    reviewer can see it. Today those acts become RF because the scheduler selected
    them, the command link authenticated, or the flight process had the radio device
    open. Authentication of TT&amp;C, 3GPP NTN registration, and operator allowlists
    decide who may talk to the vehicle. They do not decide whether this burst, on
    this beam, to this next hop, over this territory, in this mission epoch, may leave
    the aperture. Radiation is not reversible. An ISL hop is not a log line. A phased-array
    user terminal that is already pointed is one register write away from radiating.
    If the enable line trusts the last ground "go," a stale, substituted, or autonomy-generated
    command becomes sky-facing consequence. This document specifies a radio-side execution-finality
    profile for NTN and mega-constellation control. A proposed RF, ISL, beam, gateway,
    or payload act remains a Candidate Act. A Protected Enforcement Domain binds vehicle,
    beam, frequency class, duration, next hop, overflight or jurisdiction epoch, and
    intended sink, then issues scoped non-bearer authority. The Finality Sink sits
    at the PA enable, ISL switch, beam driver, feeder gateway, or UT transmit path
    and verifies that authority immediately before energy leaves the system. RF enable
    is not transmit authority.</p>

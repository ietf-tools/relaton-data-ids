abstract:
- content: <p>This document describes an experimental evidence-governance profile
    for scientific claims consumed by automated and AI-assisted systems. It separates
    claim content, evidentiary evaluation, provenance, integrity, and operational
    authority. Its three-valued evaluation state (PASS, FAIL, INDETERMINATE) and separate
    authorization decision prevent signed records, citations, or computational checks
    from being automatically promoted into scientific truth or legal authority. It
    proposes immutable versions, scope-bound receipts, monotonic source generations,
    transitive revocation, authenticated freshness, and adversarial conformance cases.
    "Scientific Constitutional Law" is the name of the proposed procedural rule set;
    it is not a statement of enacted constitutional law, legal enforceability, scientific
    discovery, or IETF consensus. This document does not define a general truth engine
    or request IANA allocations.</p>

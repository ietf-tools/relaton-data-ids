abstract:
- content: "<p>This document provides a JMAP profile for AI agents, with examples
    of use. It has two aims: Letting an LLM find something in email without polluting
    its context with too much irrelevant text, and letting an AI agent propose changes
    that a separate tool can perform. The access is therefore read-only.</p>"

abstract:
- content: "<p>This document defines a coordinated mechanism between packet loss recovery
    (forward error correction) and congestion control for high- throughput WAN transmission.
    In high bandwidth-delay product (BDP) networks, loss recovery operations introduce
    additional processing delay at the receiver, which distorts the congestion controller's
    perception of network conditions. This mechanism addresses the problem by dynamically
    adjusting the ACK Delay field in acknowledgment packets to reflect loss recovery
    processing overhead, enabling the congestion control algorithm to accurately distinguish
    true network delay from recovery processing delay. The mechanism is applicable
    to QUIC, TCP, and RDMA transport protocols, and supports host-side, network-side,
    and coordinated deployment modes.</p>"

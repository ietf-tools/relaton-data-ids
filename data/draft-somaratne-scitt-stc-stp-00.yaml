abstract:
- content: "<p>This document defines the Sovereign Tensor Container (STC-1.0) and
    Sovereign Tensor Provenance (STP-1.0) specifications. STC-1.0 establishes a strict
    64-byte physical memory alignment standard for binary machine learning tensor
    payloads to enable zero-copy Direct Memory Access (DMA). STP-1.0 defines an embedded
    cryptographic provenance framework utilizing C2PA profiles, X.509 signature chains,
    and SCITT-compatible attestations to secure supply-chain integrity for distributed
    AI models.</p>"

abstract:
- content: "<p>With the rapid maturation of laser Inter-Satellite Link (ISL) technologies,
    Low Earth Orbit (LEO) mega-constellations are evolving from bent-pipe relay networks
    dependent on dense Ground Stations (GS) into highly autonomous spaceborne routing
    networks. Traditional terrestrial routing protocols and their variants, such as
    Global Link-State Routing Architectures, rely on a globally consistent link- state
    view and a global convergence paradigm, which are fundamentally incompatible with
    the high dynamics, time-variant topologies, and frequent link disruptions characteristic
    of ten-thousand-node scale satellite networks. This document describes core routing
    scenarios including non-dense ground deployment and inter-continental transit,
    analyzes the engineering infeasibility of global convergence protocols in space
    environments, reviews the limitations of existing mitigation approaches, and specifies
    key requirements for satellite routing protocols centered around localized autonomy
    and distributed decision-making.</p>"

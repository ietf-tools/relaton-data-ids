abstract:
- content: <p>For the Concise Binary Object Representation (CBOR), a Concise Diagnostic
    Notation (CDN) has been defined in draft-ietf-cbor-edn- literals. This provides
    an extension point for "App-Extension Identifiers" registry in the "Concise Diagnostic
    Notation" registry group, supporting text representations of CBOR tags and other
    structures to enhance usability. The present document specifies an app-extension
    and registers an app- extension identifier for CBOR tag 99, Constrained Resource
    Identifiers (CRI), as defined in RFC-to-be 9988. // (This cref will be removed
    by the RFC editor:) This document // carries the specification of the cri'' application-
    oriented // prefix for CBOR diagnostic notation. This specification used to //
    be in the CoRE WG document for CRIs, became part of the CBOR WG // document for
    CBOR diagnostic notation when the CBOR WG document // was delayed, and was then
    deleted from that document as it is // outside the scope of the CBOR WG. So this
    document now goes back // to the CoRE WG, as a "new" individual submission.</p>

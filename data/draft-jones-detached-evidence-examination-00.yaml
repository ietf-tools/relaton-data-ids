abstract:
- content: "<p>This document describes repeatable procedures for examining detached
    evidence packets and the signed findings returned by recipients. It identifies
    the object, criterion, evidence, procedure, observed result and limits of each
    finding. The procedures cover artifact identity, release consistency, consent
    and access, delivery events, benchmark comparisons, commitment openings and policy
    decisions. Synthetic examples illustrate reproducible checks. The document adapts
    an examination manual into an implementation-neutral method.</p>"

abstract:
- content: "<p>This document describes an experimental implementation of a YANG to
    YANG translation function layer providing a northbound interface for configuring
    networking devices using a set of IETF 'device' YANG modules. The southbound interface
    of the function implements the proprietary, vendor YANG modules which are implemented
    natively on devices to be configured. The expected benefits of such an approach
    are the ability to provide a stable, standardised, and vendor/device agnostic
    interface for the configuration and maintenance of devices. The main purposes
    for this experiment is to validate the overall approach, and to identify, and
    describe the different YANG-to-YANG translation techniques that can be used.</p>"

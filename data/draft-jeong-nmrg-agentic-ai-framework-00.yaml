abstract:
- content: "<p>This document specifies an agentic AI framework for the management
    of networks, security, and AI services. This framework is an Intent- Based System
    (IBS) to enforce a human-language intent at a target network with the translated
    policy for networks, security, or AI services. It consists of a User System, a
    Cloud System, an Edge System, and a Device. Target devices in this framework include
    Network Forwarding Elements (e.g., router and switch), Network Security Functions
    (e.g., firewall, web filter, and DDoS-attack mitigator), Internet-of-Things (IoT)
    Devices, Physicak AI Robots, Software-Defined Vehicles (SDV), Unmanned Aerial
    Vehicles (UAV), and Urban Air Mobility (UAM). This document describes the agentic
    AI framework with its components and interfaces where the components include AI
    agents and supporting knowledge repositories (i.e., knowledge base), and also
    inter-agent interfaces use the Agent-to- Agent (A2A) protocol.</p>"

abstract:
- content: '<p>This document defines the "sustainability-data" well-known URI, at
    which a web origin publishes a JSON document declaring the energy consumption,
    carbon footprint, and related environmental and sustainability metrics of a target:
    the organization behind the origin, the origin itself, a part of it, a service,
    a device, or a product, for different reporting periods. The declaration links
    to a methodology and may carry a signature, name the declarations of upstream
    providers, and link to third-party attestations. The metrics are self-asserted
    claims of the publisher. This document registers the well-known URI and the media
    type application/ sustainability-data+json.</p>'
  language:
  - en
  script:
  - Latn
  format: text/html

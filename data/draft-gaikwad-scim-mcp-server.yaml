abstract:
- content: "<p>AI agents reach tools through servers that implement the Model Context
    Protocol (MCP). Organizations decide which MCP servers are approved, who is accountable
    for each, who may use each, and when one must be withdrawn. Identity and governance
    systems make those decisions, but the gateways, private registries and agent hosts
    that act on them come from many vendors and have no common way to receive them.
    This document defines a SCIM resource type, McpServer, that carries an organization's
    governance record for an MCP server: its endpoint, the OAuth protected resource
    identifier and authorization servers that protect it, its owners, the principals
    eligible to use it, an optional list of approved tools, and whether it is approved
    for use. It also defines McpToolGroup, a named set of tools drawn from one or
    more MCP servers together with the principals eligible to use them. It specifies
    how gateways, registries and hosts act on these records and how SCIM Security
    Event Tokens signal changes to them. It does not describe MCP server capabilities,
    which remain the subject of MCP's own metadata, and it does not authorize individual
    tool invocations.</p>"

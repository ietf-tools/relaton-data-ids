abstract:
- content: "<p>This document defines the Cedulon Protocol, an audit layer for agent-
    to-agent commerce. Payment rails such as HTTP 402 flows (x402) and mandate protocols
    (AP2) already move value. They do not, by themselves, produce a fail-closed policy
    check and a signed spend receipt that a verifier can reconcile against a rail
    extract. Cedulon specifies a Trade Manifest (signed offer before payment), a Policy
    Decision Point with default deny, a Spend Receipt (COSE/CWT claim set after a
    gated payment), epoch checkpoints, and rail-extract reconciliation that proves
    completeness against an authenticated rail extract. It also defines a Dispute
    Evidence Bundle (evidence, not an award) and optional SCITT anchoring. Cedulon
    is not a competitor to x402 or AP2; it sits above them.</p>"

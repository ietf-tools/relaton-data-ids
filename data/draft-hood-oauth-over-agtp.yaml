abstract:
- content: "<p>This document specifies how the OAuth 2.0 authorization framework is
    carried over the Agent Transfer Protocol (AGTP). OAuth defines its endpoints as
    HTTP resources and authenticates clients with secrets or signed assertions. AGTP
    is a transfer protocol for agent traffic in which every request carries the sending
    agent's identifier and a proof that the sender holds that agent's key. This document
    defines an authorization server reachable as an AGTP agent, maps the token, pushed
    authorization, device authorization, revocation, introspection, and metadata endpoints
    onto AGTP methods and paths, replaces client authentication with the AGTP request
    signature, and defines access tokens bound to an Agent-ID. It states which parts
    of OAuth move to AGTP and which remain on HTTPS. It changes no OAuth grant.</p>"

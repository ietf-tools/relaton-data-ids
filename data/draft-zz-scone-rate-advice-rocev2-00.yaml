abstract:
- content: "<p>This document describes the applicable scenarios of the Standard Communication
    Protocol for Network Elements (SCONE) in RoCEv2 networks. SCONE defines a mechanism
    that enables network elements on the forwarding path to deliver throughput guidance
    to RoCEv2 endpoints. This document further specifies the method for carrying Rate
    Advice in RoCEv2 packets. The Rate Advice is generated by network nodes (e.g.,
    switches), which can be either rate limits defined by network policies or quantitative
    rate adjustment recommendations derived from network status information. This
    document specifies the packet format for Rate Advice and the calculation method
    for the advised rate.</p>"

abstract:
- content: "<p>Autonomous agents increasingly act across administrative and security
    domains using workload identities, OAuth credentials, delegated authorization,
    attestations, and policy engines. Existing mechanisms can establish identity,
    delegation, or access rights, but deployments still lack a common artifact that
    records which policy and which evidence were evaluated when an operation moved
    into an authorized, denied, revoked, or expired authority state. This document
    defines an Agent Authority Transition Receipt (AATR), a signed, non-bearer receipt
    that cryptographically binds an agent operation to the principal, policy, evidence
    set, decision, audience, validity interval, and predecessor authority state used
    for that decision. AATR intentionally separates evidence from authorization and
    authorization from execution. Missing or indeterminate required evidence fails
    closed. AATR is designed to compose with OAuth, workload identity, remote attestation,
    transparency services, and agent-specific delegation protocols rather than replace
    them.</p>"

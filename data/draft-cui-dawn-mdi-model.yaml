abstract:
- content: "<p>The charter of the Discovery of Agents With Names (DAWN) working group
    asks it to specify the minimum public discovery information that a client obtains
    when it discovers an AI resource. An individual draft on DAWN terminology calls
    this Minimum Discoverable Information (MDI) but gives only examples of its content.
    Individual drafts on the DAWN problem statement and requirements call for a standardized
    minimum structure; without one, emerging discovery formats risk each defining
    its own minimal metadata, with descriptors that do not interoperate across organizational
    or protocol boundaries. This document proposes a procedure that derives what is
    minimal from the scope of the charter, applies it to the charter's three deployment
    contexts (a local network, an organization, and the domain of a cooperating party),
    and proposes the resulting elements and the minimal constraints that hold among
    them as an information model in the sense of RFC 3444. It considers this information
    both as a publisher provides it and as a client obtains it; a value can come from
    the discovery response, from context the client already has, or from binding rules.
    This document is input to the charter's architecture and protocol deliverables
    and a mapping target for existing discovery mechanisms.</p>"

abstract:
- content: "<p>The Model Context Protocol (MCP) connects large language models (LLMs)
    to external tools, data sources, and services. The MCP specification does not
    define normative security requirements. This document analyzes recurring vulnerability
    classes that have been publicly reported in MCP server implementations, describes
    an automated detection approach implemented in the open-source tool mcp- safeguard,
    and proposes security considerations and mitigations for implementors and operators.
    The document also describes Protocol Pivoting, a cross-protocol lateral-movement
    pattern in systems that compose MCP with other agent protocols.</p>"

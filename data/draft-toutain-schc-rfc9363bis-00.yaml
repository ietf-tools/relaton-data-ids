abstract:
- content: "<p>This document describes a YANG data model for the Static Context Header
    Compression (SCHC) compression and fragmentation Rules. This document formalizes
    the description of the Rules for better interoperability between SCHC instances
    either to exchange a set of Rules or to modify the parameters of some Rules. This
    document updates the SCHC data model defined in RFC 9363 to take into account
    the evolution of SCHC usages. It introduces a flexible way to describe protocol
    options, such as the CoAP options, and includes the identifiers needed for the
    compression of ICMPv6 and features for the management of the Rules.</p>"

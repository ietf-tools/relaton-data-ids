abstract:
- content: "<p>PARCEP-Sync specifies a federated synchronization protocol and data
    model for guardian-controlled Child Online Protection, enabling household policies
    to be authored at a Policy Administration Point (PAP), distributed over a per-household
    Messaging Layer Security (MLS) group to Policy Enforcement Points (PEPs), and
    enforced using credentials and artifacts issued by jurisdictional Policy Information
    Points (PIPs). The protocol defines a small, regular set of methods for enrolment,
    policy publication and update, revocation, enforcement telemetry, digests, appeals,
    attestation, and artifact fetch, with dua l JSON-LD and CBOR/COSE encodings for
    web-scale and constrained environments. It is designed to avoid centralized databases
    of children s data, support cross-jurisdictional verification of guardianship
    and age, and provide privacy-preserving, metadata-only event reporting suitable
    for regulatory audit and appeal.</p>"

abstract:
- content: "<p>Traffic scheduling and optimization have become routine network operation
    and maintenance tasks for operators. The operators need to select a path that
    can meet the Qality of Service (QoS) reqiurements of the traffic to be scheduled.
    This document defines four BGP extended communities for Segment Routing (SR) candidate
    path performance metric: the Available Bandwidth Extended Community, the Unidirectional
    Delay Extended Community, the Unidirectional Delay Variation Extended Community
    and the Unidirectional Loss Extended Community, which carry SR Policy candidate
    path performance parameters for the operators to select a preferred path for traffic
    scheduling and optimization. It also specifies the format and processing rules
    for these extended community types.</p>"

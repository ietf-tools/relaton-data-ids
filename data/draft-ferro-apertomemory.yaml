abstract:
- content: "<p>AI assistants and agents accumulate long-term memory about their users.
    This memory is typically stored in proprietary, provider-held silos: it cannot
    be moved between tools, its integrity cannot be verified, and its confidentiality
    depends entirely on the provider. This document specifies the ApertoMemory format:
    a canonical, signed, client-side-encrypted representation of AI memory objects,
    together with a portable single-file export container. Memory objects are encoded
    in deterministic CBOR, signed with COSE_Sign1, and encrypted with COSE_Encrypt0
    under keys derived from and controlled by the user. A storage or synchronisation
    server handling ApertoMemory objects has zero access to their content, authorship,
    or semantic timestamps. This revision specifies format_version 2, which cryptographically
    binds every signature to the author it claims and to the cleartext envelope around
    it, and derives trust from which key verified an object rather than from a declared
    field. format_version 1, described by earlier revisions of this document, carries
    a known forgeable- provenance defect and MUST NOT be implemented for new deployments.</p>"

abstract:
- content: "<p>This document presents a server-side model for paid, human-sourced
    asynchronous HTTP tasks initiated by software agents acting on behalf of a principal.
    Clients may retry after uncertain outcomes and act under authority delegated in
    advance, while fulfilment incurs cost and may not be freely reversible. The model
    places a payment or entitlement gate before fulfilment, maps that gate to adjacent
    protocols, and defines a task state machine. Under stated well-formedness constraints
    and operating assumptions, it yields gate-before-fulfilment safety, at most one
    task per retained idempotency key, at most one gate acceptance per payment requirement,
    and an operator-checkable record linking a delivered artefact to operator-controlled
    records. It defines no protocol, wire format, or conformance requirements.</p>"

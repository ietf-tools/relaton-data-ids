abstract:
- content: "<p>This document defines Opportunistic Channels: a way for two members
    of a Messaging Layer Security (MLS) group to efficiently create and operate an
    end-to-end encrypted 1-to-1 channel. In contrast to a full MLS group, the channel
    participants can't independently update their key material. Instead, participants
    opportunistically inject key material exported from other groups. As such, opportunistic
    channels are more efficient than full MLS groups, but achieve lower security guarantees.
    Their use case is the transmission of lower- security messages such as message
    delivery receipts. To keep messaging in opportunistic channels efficient, this
    document also defines MLS WireFormats that are equivalent to the MLS PublicMessage
    and PrivateMessage formats, but omit signatures. These WireFormats are otherwise
    independent of opportunistic channels and can be used in regular MLS groups.</p>"

abstract:
- content: '<p>Agentic systems can continue proposing work after authorization changes,
    while delegated credentials, queued jobs, and operations already in flight may
    continue producing effects. This document specifies a proposed operational profile
    that separates agent proposals from authoritative authorization, effect admission,
    computation termination, and bounded closure. It defines enforcement assumptions,
    revocation barriers, descendant handling, status evidence, and fault tests. The
    profile complements existing authorization and revocation mechanisms. It does
    not define a new token format, establish closure outside declared coverage, reverse
    committed effects, or infer an agent''s mental state. Internet-Draft files in

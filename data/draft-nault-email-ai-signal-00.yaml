abstract:
- content: "<p>This document proposes an experimental Internet email header field
    for expressing sender preferences about AI assistance, persistent AI memory, profiling,
    model training, and external processing. It defines syntax, category semantics,
    message scope, and preservation during forwarding and replies. A missing field
    expresses no preference. Receiver admission controls and a protective processing
    default are specified separately. The signal does not establish legal consent
    or guarantee recipient compliance.</p>"

abstract:
- content: "<p>This document defines new Matching Operators (MOs) and Compression/
    Decompression Actions (CDAs) for the Static Context Header Compression and fragmentation
    (SCHC) framework defined in RFC 8724. These extensions enable efficient compression
    of dynamically assigned IP addresses, including IPv4 addresses assigned via DHCP,
    IPv6 prefixes learned through SLAAC or DHCPv6, IPv6 Interface Identifiers (IIDs),
    and IPv6 temporary privacy addresses generated per RFC 8981. The mechanism relies
    on both the compressor and decompressor sharing knowledge of the set of addresses
    assigned to the device. Addresses are organized into deterministically sorted
    tables, allowing compression to a small index value. For temporary IPv6 addresses,
    a synchronized generation algorithm enables compression to an epoch and counter
    value.</p>"

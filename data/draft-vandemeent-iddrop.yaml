abstract:
- content: "<p>This document specifies IDDrop, an identity-transfer protocol for moving
    identity claims, actor claims, and receiver-bound claim bundles across human-facing
    and machine-facing environments. IDDrop defines two complementary operating modes:
    offer-first, intended for proximity and human-in-the-loop workflows, and request-
    first, intended for autonomous systems, daemon-to-daemon exchange, and policy-driven
    machine identity transfer. IDDrop does not treat filenames or user-visible extensions
    as identity truth. Instead, it binds identity transfer to sealed carrier truth,
    semantic classification, actor provenance, receiver targeting, and causal validation.
    This document profiles the generic TIBET TAT handoff model for trustworthy identity
    transfer.</p>"

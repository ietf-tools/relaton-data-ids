abstract:
- content: "<p>With over 30 distinct post-quantum and hybrid/composite signature algorithm
    parameters proposed or registered for TLS 1.3 [RFC9847] [IANA-TLS] [I-D.ietf-tls-composite-mldsa],
    implementations face increasing complexity and deployment overhead. This document
    provides curated guidance to recommend a manageable subset of post- quantum signature
    schemes for standard TLS 1.3 deployments.</p>"

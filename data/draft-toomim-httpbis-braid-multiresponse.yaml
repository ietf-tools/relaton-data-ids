abstract:
- content: "<p>Each HTTP request has only a single response. This document defines
    the 209 Multiresponse status code, whose content holds several responses, and
    the application/http-history media type, which encodes a sequence of responses
    to one resource over time. With them, a server can send a history of a resource,
    or a stream of its changes, in one response, which caches can store piece by piece.
    This document is one of the Braid-HTTP extensions, which work alone or together;
    together they make HTTP a state synchronization protocol.</p>"

abstract:
- content: "<p>This document defines a set of IPFIX Information Elements for monitoring
    Explicit Congestion Notification (ECN), specifically in the context of the Low
    Latency, Low Loss, and Scalable Throughput (L4S) service. These Information Elements
    allow network operators to observe ECN codepoint usage within L4S deployments
    and evaluate the corresponding traffic performance.</p>"

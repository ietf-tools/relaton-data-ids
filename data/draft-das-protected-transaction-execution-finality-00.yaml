abstract:
- content: "<p>Recent publicly reported incidents involving unauthorized use of legitimately
    signed account-delegation and asset-transfer operations have exposed a gap between
    cryptographic validity and permission to perform an exact consequential act. This
    document proposes an experimental, transport-independent execution-finality protocol
    for delegated digital operations. A Candidate Act is placed in a non- effective
    state; protected collection-time and execution-time enforcement domains bind approved
    intent, independently reconstruct the pending effect, and require an unforgeable,
    sink-specific, single-use authorization before signing, dispatching, transmitting,
    exporting, or actuating. The protocol specifies state continuity, revocation,
    nonce burn, quota settlement, delegated-code controls, multi-domain interoperability,
    failure behavior, receipts, conformance tests, and migration profiles. It includes
    ASCII sequence diagrams and flowcharts, complete executable Python, Go, and JavaScript
    reference listings, a reproducible test-vector generator and runner, and recorded
    cross-language test results in informative appendices. This is a proposal for
    discussion, not an adopted IETF standard; the reference code is not production
    cryptographic custody software.</p>"

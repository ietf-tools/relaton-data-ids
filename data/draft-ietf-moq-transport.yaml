abstract:
- content: "<p>This document defines Media over QUIC Transport (MOQT), a publish/
    subscribe protocol that runs over QUIC and WebTransport. MOQT leverages the features
    of these transports, such as streams, datagrams, priorities, and partial reliability.
    MOQT operates both point-to-point and through intermediate relays, enabling scalable
    low-latency delivery. Despite its name, MOQT is media agnostic and can be used
    for a wide range of use cases.</p>"

abstract:
- content: "<p>This document applies the core Performance Monitoring (PM) collection
    and interval-capabilities YANG data models to common transport equipment. It defines
    a YANG module of transport performance parameter identities, derived from the
    base identity of the PM collection model; it specifies the three transport parameter
    profiles of ITU-T G.7710 normatively; and it gives end-to-end examples that show
    capability discovery followed by YANG-Push subscription, notification, and threshold
    reporting for a transport profile.</p>"

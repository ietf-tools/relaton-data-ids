abstract:
- content: "<p>The Gravit Epistemic Verification Protocol (GEVP) defines how signed
    evidence Records about an Artifact are screened, grouped by independent source
    and evaluated, so that a claim is never promoted beyond what independent evidence
    supports. It specifies the Epistemic State Machine, the Record format and its
    signature, the meaning of the signed result of a Record, a verifier registry accepted
    under a threshold of root keys, a content-addressed Decision Record that anyone
    can reproduce, and optional signed receipts that let an auditor check a history
    of decisions offline. It maps these states to the evidence taxonomy of the Gravit
    Verifiable Epistemic Decision Standard (VEDS).</p>"

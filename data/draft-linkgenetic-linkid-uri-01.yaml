abstract:
- content: <p>This document specifies the "linkid" URI scheme and a resolution model
    for persistent, location-independent identifiers. A LinkID consists of the scheme
    name followed by a UUID and identifies a resource independently of its current
    network location. Resolution maps the LinkID to a current actionable URI using
    one or more resolvers. Resource names, locations, versions and operator relationships
    are associated data, not part of the identifier. The document defines syntax,
    comparison, resolution semantics and an HTTPS binding, and requests an update
    of the existing IANA URI scheme registration.</p>

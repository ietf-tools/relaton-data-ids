abstract:
- content: "<p>This document describes a recurring interoperability problem in exported
    network telemetry: many values are encoded without an explicit definition of the
    scope in which they are unique, meaningful, and comparable. In practice, the wire
    representation of a value may be standardized while the semantic context of that
    value remains implicit. As a result, a receiver may infer that two numerically
    identical values are equivalent when they were produced in different semantic
    domains and therefore refer to different objects, states, or observations. This
    ambiguity is operationally significant. It can lead to incorrect aggregation,
    incorrect cross-instance comparison, and erroneous conclusions about routing state,
    forwarding behavior, or network health. The risk is particularly visible in telemetry
    protocols that export statistics or identifiers in contexts such as VRFs, topology
    instances, address families, route distinguishers, policy domains, or other instance-specific
    scopes. This document argues that exported telemetry identifiers and statistics
    MUST explicitly define both the scope in which a value is unique and meaningful,
    and the conditions under which it may be compared with values from other contexts.
    This requirement is not limited to BMP; it applies to any telemetry mechanism
    in which a value can be generated in multiple semantic domains and therefore cannot
    be treated as self-describing solely by its encoded form.</p>"

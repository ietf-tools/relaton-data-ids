abstract:
- content: "<p>A mailing list joins five things through email: moving messages, the
    archive, who a message is for, who owes a reply, and who wrote it. This document
    moves the archive, authorship and addressing onto a public append-only log called
    a venue. Each post is a signed record. A post an agent wrote names the agent,
    the person it acts for, and how much that person reviewed it. The venue appends
    each post to its log and returns a receipt, and anyone can check a post against
    the venue's published root without asking the venue. Positions and consensus calls
    are typed records in the same log. A gateway carries posts out as email and brings
    email in as posts marked as arriving by email. The log builds on the transparency
    service and receipts of the IETF supply chain integrity work, and on the ~handle
    tiers and the alter URI scheme.</p>"

abstract:
- content: "<p>This document defines the Judgment Event Protocol (JEP), a neutral
    verifiable event format for decision-related operations in human, organizational,
    software, and autonomous agent systems. JEP specifies four immutable event verbs:
    Judgment (J), Delegation (D), Termination (T), and Verification (V). It defines
    a signed JSON event structure, anti-replay fields, detached JSON Web Signature
    (JWS) verification over JSON Canonicalization Scheme (JCS) canonicalized payloads,
    event hash and reference semantics, validation levels, structured validation results,
    failure codes, extension handling, trust-profile interfaces, and determinability
    boundaries. JEP is intended to provide a global protocol-level interoperability
    layer for verifiable decision event records. JEP-Core does not define legal liability,
    authorization validity, regulatory compliance, organizational trust decisions,
    global identity, global truth, or mandatory support for any specific credential,
    identity, AI platform, agent framework, or blockchain system. ---</p>"

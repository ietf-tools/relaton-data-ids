abstract:
- content: "<p>Autonomous agents increasingly rely on an evaluator to review plans,
    evidence and outcomes before work continues, yet an evaluation result is often
    mistaken for permission to act. This document describes a vendor-neutral architecture
    in which the evaluator is a functional role, not a product: it may be a rule engine,
    model, program, enclave, service or human, placed locally, remotely or on a shared
    platform. It separates six independent lifecycles, requires a protected task-specific
    appointment derived from resource-owner authority, admits evidence by source,
    role, freshness and independence, preserves mandatory dissent, and emits typed
    determinations such as HOLD, DISPUTED and UNKNOWN. Its central rule is that a
    valid determination is not an executable authorization: separate owner-controlled
    authorization and a native enforcement boundary remain necessary. Twenty-seven
    embodiments, a threat model, data model and examiner index are provided.</p>"

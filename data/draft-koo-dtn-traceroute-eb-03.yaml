abstract:
- content: "<p>This document defines a Traceroute Extension Block (TREB) for Bundle
    Protocol Version 7 (BPv7). Each participating node along a bundle's path appends
    a hop-record containing its Node ID, the node it received the bundle from, the
    next hop it selected, the time of the recorded event, and link characteristics.
    The same block, copied into bundle status reports, returns traceroute data to
    the source. The mechanism is opt-in and intended for designated diagnostic bundles
    on scheduled, bandwidth-constrained paths. Each forwarding report returns one
    hop-record, and the delivery report returns the full recorded path and also records
    its own return path, giving a round-trip trace. Status report generation remains
    governed by RFC 9171.</p>"

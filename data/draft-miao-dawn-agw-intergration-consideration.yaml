abstract:
- content: "<p>This document specifies the integration architecture, discovery proxy
    mechanisms, and operational workflows for the Agent Gateway (AGW) within the Discovery
    of Agents With Names (DAWN) problem space. Addressing the core problem of how
    an agent discovers peer agents across administrative and network boundaries, this
    specification defines the dual role of the Agent Gateway: serving as an Outbound
    Discovery Proxy (Discovery Substrate Access Point) that assists local domain agents
    in querying external discovery fabrics, and an Inbound Domain Discovery Proxy
    (Broker/Aggregator) that enables external agents to discover matching capabilities
    situated on sub-agents behind the gateway. The document outlines the internal
    capability matching engine, selective disclosure mechanisms for privacy preservation,
    DNS-SD/mDNS resource record mappings, and strict boundary alignments with the
    IETF DAWN Working Group Charter.</p>"

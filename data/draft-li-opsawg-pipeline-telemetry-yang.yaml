abstract:
- content: "<p>This document specifies a Standards Track YANG 1.1 data model (ietf-
    dcn-pipeline-state-telemetry) for monitoring multi-stage execution phase timing
    and bulk state-mobility telemetry in disaggregated data- center service pipelines.
    The model defines nine causally ordered lifecycle timestamps, interval-union de-duplication
    for overlapping pipeline stages, and three-tier byte accounting that separates
    mandatory transport-visible encoded-bytes from optional application- visible logical-bytes
    and metadata-bytes, enabling consistent multi- vendor operational diagnostics
    under the Network Management Datastore Architecture (NMDA).</p>"

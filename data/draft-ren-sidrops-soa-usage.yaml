abstract:
- content: "<p>Given that an AS collaboration scheme for inter-domain source address
    validation requires an information-sharing platform, this document proposes a
    two-tier approach. In the first tier, Resource Public Key Infrastructure (RPKI)
    is used for service discovery, identity authentication, and transmission of the
    minimum bootstrap information needed to establish a private channel. Source Origin
    Authorization (SOA) is a newly defined cryptographically signed AS-level service-
    profile object for that purpose. Subscribers and providers each publish their
    own SOA profiles; a concrete service relation exists only after discovery, bilateral
    request validation, and provider acceptance. In the second tier, the legitimate
    predecessor AS information and its subsequent updates are exchanged over the authenticated
    private channel, by default using TLS[RFC8446] carrying CBOR[RFC8949]-encoded
    logical messages, enabling other ASes to collaboratively filter spoofed traffic
    while avoiding frequent routing-driven updates to RPKI and reducing exposure of
    subscriber- specific routing data. This revision also describes a logical synchronization
    state model, evidence-tagged authorization state, and fail-open handling for unavailable
    synchronized state, while leaving private-channel wire encoding to future specifications
    or bilateral deployment profiles.</p>"

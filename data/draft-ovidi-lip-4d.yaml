abstract:
- content: "<p>This document specifies LIP-4D, an experimental, transport- independent
    JSON protocol for expressing and evaluating the intent of autonomous software
    agents. A LIP-4D exchange binds an authenticated agent to a requested action,
    purpose, execution context, rationale claims, evidence, time constraints, and
    an evolution history. A policy enforcement component can challenge the agent for
    additional evidence and, after evaluation, issue a short-lived intent-bound authorization
    grant or deny the request. LIP-4D does not replace workload identity, cryptographic
    authentication, OAuth, or other authorization frameworks. It supplies a structured
    intent and evidence layer that can be used with those systems. The protocol deliberately
    excludes private model chain-of-thought and instead carries concise, reviewable
    claims and verifiable evidence.</p>"

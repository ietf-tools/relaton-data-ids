abstract:
- content: "<p>The Verified Infrastructure Response Protocol (VIRP) defines a trust
    framework for operators -- human or autonomous -- acting on live network infrastructure.
    As operations shift toward agentic and automated systems that can autonomously
    configure, audit, and remediate production environments, the absence of a verifiable
    chain of custody for observations and actions introduces fundamental risks: fabricated
    telemetry, unauthorized state changes, and the inability to distinguish legitimate
    operations from compromise. VIRP routes every observation and every authorization
    decision through a designated collection-and- verification boundary that the requesting
    party does not control. Observations are authenticated at collection time using
    HMAC-SHA256; in session-bound mode (Section 6.4) authentication uses a per-session
    key and binds the response to session, device, sequence, and a command-digest
    field. Validating the command binding additionally requires trusted request context
    from which the verifier recomputes the command digest. A two-channel architecture
    separates read-only Observation from write-intent Intent, and trust tiers (GREEN/YELLOW/RED/BLACK)
    govern action authorization with human-in-the-loop controls for elevated operations.
    VIRP's observation and chain-integrity guarantees are symmetric and explicitly
    scoped by key role; approval and federation records use asymmetric Ed25519 signatures.
    Distinct key roles authenticate observations, chain entries, intents, approvals,
    and federation records (Section 6.1), though the reference implementation currently
    reuses one key across the v1-observation and v2-derivation roles; a holder of
    a symmetric key can both verify and forge within that key's scope, so VIRP does
    not provide publicly verifiable observation origin and does not defend a record
    against an adversary holding the relevant key or controlling the collection boundary.
    Authentication does not certify that a response reflects the managed device's
    true state, only that the boundary obtained and authenticated those bytes for
    that recorded request. Asymmetric proof of origin and external anchoring of the
    chain are distinct, independent items of future work (Section 18). This revision
    adds External Authorization Binding (Section 11): a deployment profile in which
    the gate holds only a read-only device identity, the write credential is never
    at rest on the gate, and per- command authorization is performed by an authorization
    service that the gate does not control, using the device's own authorization mechanism
    (for example TACACS+ command authorization [RFC8907] on IOS and IOS-XE). The gate's
    own record of an action is then reconciled against the device's independent accounting
    under the same public verification tooling. The individual mechanisms are long-standing;
    the contribution is their composition, with an autonomous or automated requester
    as the constrained principal, together with an evidence layer that enables the
    gate's account of an action to be reconciled against the device's independently
    sourced account of the same action so a third party can compare them. Static per-command
    authorization and reconciliation are implemented and exercised on production Cisco
    hardware; approval-scoped dynamic grants and the chaining of authorization decisions
    are specified and marked as not yet implemented (Section 19). Since draft-howard-virp-06
    the reference chain implementation has gained an OPTIONAL per-entry and per-head
    Ed25519 signature, computed by the daemon at append time over the same canonical
    bytes as the mandatory HMAC and verifiable from a public key alone. It is enabled
    per node and is off by default, so a conforming deployment may still be HMAC-only.
    The base chain-integrity guarantee remains the symmetric one described here; the
    signature is an additional authenticator, described in Section 6.5 and Section
    6.5.2, not a replacement for it.</p>"

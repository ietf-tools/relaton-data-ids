abstract:
- content: "<p>Connecting one organization's systems to another's usually requires
    a connector built for that pair of systems, whether written by hand, bought from
    a connector catalog, or packaged as a tool server for an AI model. Connectors
    scale with the number of pairs, carry long- lived shared credentials, and have
    no verifiable link to the legal entities involved or to the terms under which
    access was granted. This document describes that problem and an architecture,
    called Selo, that aims to reduce the need for such connectors. Agents owned by
    verified legal entities verify each other, negotiate a typed access agreement
    that both parties sign, and then execute it through a standard runtime and a gateway
    in front of each entity's existing API, using credentials bound to the agreement.
    Each entity maintains its own tested, signed mapping between its system and shared
    capability profiles. Selo uses existing APIs; it does not replace them. The document
    states requirements and an architecture to inform discussion of whether, and where,
    such work belongs in the IETF. It does not specify a protocol.</p>"

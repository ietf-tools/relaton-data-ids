abstract:
- content: "<p>This document defines the carriage of ad creative signaling -- creative
    identity, tracking events, and measurement verification metadata as specified
    by SVTA 2053-1 -- in records on a Media over QUIC (MOQT) Streaming Format (MSF)
    Event Timeline track. It complements the carriage of SCTE-35 splice signaling
    over the same mechanism: splice events describe where placement opportunities
    occur on a media timeline, while the event class defined here describes the creatives
    that fill them and how their playback is to be measured. This binding is the MSF
    counterpart of the DASH and HLS carriage bindings defined by SVTA 2053-1, which
    defines none for MOQT.</p>"

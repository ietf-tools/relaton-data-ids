abstract:
- content: "<p>Segment Routing (SR) is a source routing paradigm that explicitly indicates
    the forwarding path for packets at the ingress node. An SR Policy is a set of
    candidate paths, each consisting of one or more segment lists. This document defines
    extensions to BGP SR Policy to specify the identifier of a segment list.</p>"
  language:
  - en
  script:
  - Latn
  format: text/html

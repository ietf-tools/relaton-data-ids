abstract:
- content: "<p>The standards landscape now produces many signed artifacts about an
    AI agent's action: workload identity credentials, delegation and grant tokens,
    call-chain transaction tokens, runtime attestation results, pre-execution policy
    permits, named-human authorization receipts, post-execution action records, and
    transparency-log inclusion receipts. No specification defines how a relying party
    decides whether a collection of such artifacts is SUFFICIENT to rely on for a
    given purpose: releasing a payment, honoring a trade, satisfying an auditor, or
    paying an insurance claim. This document defines three things that together fill
    that layer: the Action Evidence Graph (EP-AEG), a portable, content-addressed
    graph of references to signed artifacts about one action, whose identity is independent
    of how much of it is disclosed; Evidence Policy Replay, a deterministic, offline
    evaluation of a graph against a RELYING-PARTY- supplied evidence policy, yielding
    one of five closed verdicts (admissible, missing_evidence, stale, conflicted,
    unverifiable) with a replay digest that lets any third party recompute the decision;
    and the Reliance Result (EP-RELIANCE-RESULT), the verdict as a signed artifact,
    making the reliance decision itself auditable evidence. Six policy packs profile
    the mechanism for concrete irreversible action classes. A verdict is evidence
    of sufficiency under a stated policy; it is not adjudication, and the graph never
    carries its own sufficiency bar.</p>"

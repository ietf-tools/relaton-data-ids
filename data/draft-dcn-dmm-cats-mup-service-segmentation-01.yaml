abstract:
- content: "<p>Service segmentation introduces an emerging deployment paradigm in
    which a service is composed of multiple distributed subtasks forming a service
    pipeline. This document discusses architectural considerations for steering sessions
    across multiple subtask instances in sequential, parallel, and iterative service
    pipelines, including a MUP Sequence Session Transform to support ordered traversal,
    and for maintaining service continuity during pipeline updates, particularly when
    stateful subtasks are involved.</p>"

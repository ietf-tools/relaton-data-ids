abstract:
- content: <p>[RFC7605] provides guidance on the use of port numbers and the criteria
    for new port assignments, including a test for whether a proposed service is distinct
    from an existing service. It gives the example that "an automated system that
    happens to use HTTP framing -- but is not primarily accessed by a browser -- might
    be a new service." It also might not. This document clarifies the application
    of the distinct-protocol test in [RFC7605] Section 7.1 to services built on HTTP
    as a substrate, in light of HTTP's evolution since its publication, and provides
    guidance to applicants and reviewers on when an HTTP-based service qualifies for
    a new port assignment and when it does not.</p>

abstract:
- content: "<p>The SRv6 Network Programming architecture allows an application to
    control the end-to-end journey of traffic flows through different network domains
    in a unified and stateless manner, without requiring intermediate network devices
    to maintain per-flow information. This document covers its application to the
    integration of data center (DC) and wide area network (WAN) architectures using
    SRv6 with uSID (NEXT-CSID). It describes a unified IPv6 data plane from tenant
    workloads through the DC frontend to Internet peering, replacing designs that
    stitch separate overlay protocols at the Data Center Interconnect (DCI). The solution
    enhances scalability and enables flexible stateless service insertion by unifying
    underlay, overlay, and service steering under SRv6.</p>"

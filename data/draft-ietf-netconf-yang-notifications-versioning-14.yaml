abstract:
- content: "<p>This document defines a YANG module which extends the YANG-Push Subscription
    mechanism to enforce that particular revisions or semantic versions are used when
    configuring or establishing a Subscription. It also extends the YANG-Push Subscription
    state change Notifications to include additional context about the YANG schema
    associated with the Subscription.</p>"

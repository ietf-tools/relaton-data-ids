abstract:
- content: "<p>Without a structured address allocation plan, early space missions
    risk creating an unaggregated patchwork of prefixes, repeating the historical
    operational scaling issues seen in terrestrial networks. This document requests
    that the IANA allocate address space specifically for use in space environments
    and manages suballocations from that block for and within celestial bodies, as
    needed. The Number Resource Organization (NRO) will determine how to allocate
    and assign address resources for and within the celestial bodies, with the understanding
    that topological address aggregation is critical for routing scalability and operational
    efficiency.</p>"

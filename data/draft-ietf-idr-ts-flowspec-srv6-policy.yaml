schema-version: v1.2.3
id: draft-ietf-idr-ts-flowspec-srv6-policy
title:
- content: Traffic Steering using BGP FlowSpec with SR Policy
  language:
  - en
  script:
  - Latn
  format: text/plain
docid:
- id: draft-ietf-idr-ts-flowspec-srv6-policy
  type: Internet-Draft
  primary: true
abstract:
- content: "<p>BGP Flow Specification (FlowSpec) provides mechanisms to distribute
    traffic filtering and steering rules across BGP networks. This document specifies
    extensions to BGP Flow Specification (RFC 8955, RFC 8956) to steer matching traffic
    flows into Segment Routing (SR) Policies (RFC 9256). Specifically, it defines
    normative protocol procedures for combining FlowSpec Network Layer Reachability
    Information (NLRI) (RFC 8955, RFC 8956) with the BGP Prefix-SID Attribute (RFC
    8669, RFC 9252) and specific BGP Extended Communities (RFC 9012) to signal SR-MPLS
    and SRv6 Policy steering pathways.</p>"
  language:
  - en
  script:
  - Latn
  format: text/html

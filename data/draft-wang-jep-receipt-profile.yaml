abstract:
- content: "<p>This document defines JEP Receipt Profile 1 (JEP-RP-1), a minimal receipt
    and evidence profile for the Judgment Event Protocol (JEP). JEP-RP-1 binds a JEP
    event to one digest-addressed receipt record through a critical JEP extension.
    It defines a small behavior-record format, portable receipt manifests and bundles,
    and independent receipt-validation checks. JEP remains authoritative for event
    verbs, Event Identity, Event Hash, signature processing, references, extension
    processing, validation modes, and acceptance semantics. Receipt records are technical
    evidence about observable behavior and related artifacts. JEP-RP-1 does not assign
    legal liability, prove subjective intent, establish authorization validity, determine
    causality or factual truth, define governance outcomes, or establish regulatory
    compliance.</p>"

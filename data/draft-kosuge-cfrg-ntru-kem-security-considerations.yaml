abstract:
- content: "<p>This document records security considerations for the NTRU key encapsulation
    mechanism that is being standardized in ISO/IEC 29192-4 Amendment 2. It is intended
    to help protocol designers and implementers decide when NTRU is safe to use, and
    how to use it without creating avoidable security regressions.</p>"

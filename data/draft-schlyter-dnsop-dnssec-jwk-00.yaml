abstract:
- content: <p>This document specifies how to represent DNSSEC public and private keys
    as JSON Web Keys (JWK). The cryptographic key material is encoded using the existing
    JWK key types, and the DNS-specific information needed to reconstruct the corresponding
    DNSKEY resource record (owner name, algorithm, protocol and flags) is carried
    in a new JWK parameter, "dnskey". This gives DNSSEC signers, key management systems
    and other tools a standardized, interoperable format for exchanging and storing
    DNSSEC keys.</p>

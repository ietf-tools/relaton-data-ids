abstract:
- content: "<p>Autonomous AI agents act with privileges: they call tools, read and
    write data, and operate services. In most current deployments they do so under
    shared service accounts, with permissions broader than any single task requires
    and without an audit trail that binds an action to the agent that took it and
    the human on whose behalf it acted. This document specifies a session-scoped authorization
    profile for AI agents, building on the WIMSE architecture and the OAuth 2.0 protocol
    family. Each agent is a first-class IAM principal with its own credentials. Each
    session is bound to an authenticated human sponsor through an authenticated delegation
    chain. Authorization is evaluated at every tool call, with effective permissions
    computed as the intersection -- never the union -- of the agent principal's permissions,
    the sponsor's permissions, and the session scope. Actions that cannot be evaluated
    are denied (fail closed), defined classes of irreversible actions require sponsor
    approval, and every evaluated tool call produces a tamper-evident audit receipt.
    The document defines the model, states requirements for implementations, maps
    the model onto existing OAuth and WIMSE mechanisms, and gives full security considerations.
    It defines no new protocol and requests no IANA actions.</p>"

abstract:
- content: "<p>This document introduces the Quality of Outcome (QoO) network quality
    score and the corresponding QoO framework as an approach to network quality assessment
    designed to align with the needs of users, application developers, and network
    operators. Conceptually based on the Quality Attenuation metric, QoO provides
    a method for defining and evaluating application-specific, quality- focused network
    performance requirements to enable insights for network troubleshooting and optimization,
    and simple Quality of Service scores for end-users.</p>"

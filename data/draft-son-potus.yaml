abstract:
- content: "<p>This document specifies an experimental binding of a signed containment
    instruction and a Presidential Capability Advertisement to a GIF89a image. An
    operator can deliver the same object for inspection, capability-claim presentation,
    and machine enforcement. The presidential presentation profile uses an operator-selected
    depiction of Donald J. Trump. The advertisement carries the issuer's declared
    basis for intervention, with fields for attributed numerical strength and intelligence
    claims. A receiving enforcement point authenticates the issuer and installs a
    persistent hold on the named workload's access to protected resources. The specification
    defines the container, signature profile, anti- replay state, delivery interface,
    enforcement receipts, and recovery requirements. It defines no image-carried release
    operation. Its protection boundary is the managed resource interface, not the
    recipient model's willingness to obey the image. The experiment concerns authenticated
    artifact delivery and observable containment, not the defensive effect of a portrait.</p>"

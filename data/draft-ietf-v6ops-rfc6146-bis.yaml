---
schema-version: v1.2.3
id: draft-ietf-v6ops-rfc6146-bis
title:
- content: 'Stateful NAT64: Network Address and Protocol Translation from IPv6 Clients
    to IPv4 Servers'
  language:
  - en
  script:
  - Latn
  format: text/plain
docid:
- id: draft-ietf-v6ops-rfc6146-bis
  type: Internet-Draft
  primary: true
abstract:
- content: "<p>This document specifies stateful NAT64 translation, which allows IPv6-Only
    clients to contact IPv4 servers using unicast UDP, TCP, or ICMP. One or more public
    IPv4 addresses assigned to a stateful NAT64 translator are shared among several
    IPv6-Only clients. Stateful NAT64 translation also supports IPv4-initiated communications
    to a subset of the IPv6 hosts through statically configured bindings in the stateful
    NAT64 translator. When stateful NAT64 translation is used in conjunction with
    DNS64, no changes are required in either the IPv6 client or the IPv4 server. This
    document obsoletes RFC 6146.</p>"
  language:
  - en
  script:
  - Latn
  format: text/html

abstract:
- content: "<p>This document provides a framework and requirements for flow aggregation
    in scaling Deterministic Networking (DetNet) [I-D.ietf-detnet-scaling-requirements].
    It describes aggregation scenarios, benefits, and challenges in scaling networks,
    and derives high-level requirements applicable across different DetNet data plane
    technologies. The framework also discusses flow aggregation enhancement considerations
    including classification, identification, coordination, admission control and
    resource allocation. As an illustrative example, it explores how these concepts
    could apply to 5GS systems acting as logical DetNet nodes. This document is informational
    and complementary to existing DetNet specifications.</p>"

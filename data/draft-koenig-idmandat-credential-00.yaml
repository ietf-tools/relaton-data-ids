abstract:
- content: "<p>Automated software agents increasingly act for companies: they ask
    for quotes, book appointments and place orders. A recipient can verify, for example
    with Web Bot Auth, that a request was signed by the holder of a key. That does
    not tell the recipient which company stands behind the agent or what the agent
    is allowed to do on its behalf. This document describes a small credential file
    that a company publishes on its own domain under /.well-known/idmandat.json, a
    DNS TXT record that links the file to the domain, and the answer format of a public
    registry that checks both and reports the result in a digitally signed response.
    The credential states, by declaration of the company, which agents act for it
    and what each agent may and may not do. It does not make claims about creditworthiness,
    trustworthiness or quality.</p>"

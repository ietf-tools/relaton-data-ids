abstract:
- content: "<p>Traffic-engineered networks are commonly provisioned for peak demand.
    However, during off-peak periods, some traffic-engineered resources in the network
    may be lightly used. This leads to unnecessary power consumption. A coordinated
    power transition can reduce power consumption while preserving the control-plane
    and traffic- engineering state needed to restore service safely. This document
    defines a generic power management framework for coordinating power-sleep and
    wakeup transitions between adjacent nodes. It defines the roles, resource scope,
    procedures, collision handling, failure behavior, and traffic-engineering preservation
    requirements. It then specifies an RSVP-TE signaling extension for supporting
    the power management framework.</p>"

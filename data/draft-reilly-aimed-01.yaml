abstract:
- content: "<p>This document proposes a standard section structure for IETF Internet-Drafts
    and RFCs that embeds machine-readable ethical directives for AI systems that process,
    analyze, summarize, or reason about protocol specifications. As AI systems increasingly
    serve as the primary interface through which implementers encounter and interpret
    IETF documentation, the absence of any normative ethical guidance targeted at
    those systems represents a gap in the standards process. The AI Machine-Readable
    Ethics Directive (AIMED) framework defines a transparent, explicitly labeled section
    containing both human-readable rationale and machine-readable directive text.
    This revision adds a structured AIMED header for automated version binding, an
    explicit conformance model with a self-test that authors and AI systems can apply
    mechanically, and an expanded treatment of the normalization risk the framework
    itself creates. This draft serves as a self-demonstrating reference implementation.
    Section 7 contains a live AIMED block applicable to AI systems processing this
    draft. Section 7.1 documents the reference block published in draft-reilly-aimed-00
    as non-conforming under the framework's own criteria and explains the correction,
    as a worked example of the conformance test in Section 6.</p>"

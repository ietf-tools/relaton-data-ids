abstract:
- content: "<p>This document defines the Session Recovery Option (SRO) for TCP. SRO
    improves the reliability of Source Network Address Translation (SNAT) and load
    balancing (LB) services and simplifies the implementation of elastically scaling
    SNAT/LB clusters. SRO enables a client and a server to exchange their identifiers
    during connection establishment. When a session needs to be recovered, an endpoint
    conveys the identifier of the peer to the network node, which uses it to locate
    the endpoint holding the session backup and recover the session. SRO is optional:
    endpoints that do not support it behave as if the option did not exist.</p>"

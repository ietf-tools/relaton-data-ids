abstract:
- content: "<p>This document defines the Custody Receipt Block, a Bundle Protocol
    Version 7 (BPv7) extension block that carries a chain of signed custody receipts
    inside the bundle those receipts describe. Each node that chooses to act as a
    custodian appends one receipt stating that it held the bundle, which node it received
    it from, and when it received and forwarded it. Nodes that do not implement the
    block forward it unchanged and are never required to read the payload or to sign
    anything. A verifier holding the custodians' public keys can check the chain after
    the fact and can report, rather than infer, any part of the route for which no
    receipt exists. The receipts are evidence for accounting and dispute resolution
    between operators. They are not Bundle Protocol administrative records and they
    do not replace or modify custody transfer signalling.</p>"

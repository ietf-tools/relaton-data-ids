abstract:
- content: "<p>This document specifies a Witness Attestation Record (WAR), a signed
    and hash-linked record created by a witness after it accepts an observation about
    a subject system. Each record identifies the subject, observation stream, checkpoint,
    observation time, evidence commitment, witness-local sequence number, and reference
    to the preceding record. A verifier can validate the record signature, reconstruct
    the supplied chain, evaluate the applicable policy, and assess freshness against
    a trusted checkpoint or independently retained chain head. The component is designed
    to preserve a verifiable chronology of observations and actions across vulnerability
    exposure, incident investigation, remediation, and post-remediation verification.
    It complements evidence-generation and transparency systems. It does not itself
    establish that a measurement source is truthful, that a host was uncompromised,
    or that every real-world event was observed.</p>"

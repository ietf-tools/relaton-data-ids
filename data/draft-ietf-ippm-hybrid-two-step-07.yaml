abstract:
- content: "<p>The adoption of network operation automation has brought new measurement
    methodology requirements. Among them is the ability to collect the instant network
    operational state as the packet is being processed by the network elements along
    its forwarding path through a network domain. That requirement can be addressed
    by using on-path telemetry, also called hybrid performance measurement according
    to RFC 7799. An on-path telemetry method allows operators to collect key information
    that reflects the operational state and the network performance a packet experiences
    through the forwarding path. IOAM, defined in RFC 9197 and RFC 9326, is an example
    of such a hybrid method. This document introduces a method complementary to on-path
    telemetry that causes the generation of network telemetry information. This document
    introduces Hybrid Two-Step (HTS), a method complementary to both passive and hybrid
    measurement approaches. HTS separates measuring or calculating the performance
    metric from collecting and transporting network operational state.</p>"

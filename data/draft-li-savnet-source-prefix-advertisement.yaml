abstract:
- content: "<p>This document describes a mechanism for generating interface-based
    prefix allowlists for intra-domain source address validation (SAV) on external
    interfaces facing directly connected hosts or non-BGP customer networks. The mechanism
    derives source prefixes from routing information and combines them with source
    prefixes provisioned by the AS operator. Routers use the combined source prefixes
    to generate SAV allowlists.</p>"

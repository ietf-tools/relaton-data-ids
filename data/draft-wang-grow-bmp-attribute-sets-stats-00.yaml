abstract:
- content: "<p>The BGP Monitoring Protocol (BMP) specified in RFC 7854 requires a
    monitored router to send full BGP Path Attributes for every Route Monitoring message.
    In networks with a large number of prefixes sharing identical BGP Path Attributes,
    this requirement leads to substantial transmission redundancy and protocol overhead.
    This document specifies a decoupled architecture for BMP monitoring that separates
    Path Attribute Set registration from NLRI volume statistics. Attribute updates
    are triggered immediately upon path attribute changes, while NLRI count updates
    can be configured for either event-driven (immediate) or periodic reporting modes,
    with mandatory instant notification when an attribute set's reference count drops
    to zero.</p>"

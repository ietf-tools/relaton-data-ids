abstract:
- content: "<p>Map-based discovery systems can help a person identify nearby businesses,
    properties, service providers, hotels, clinics, restaurants, and other commercial
    actors, but discovery frequently transitions into communication through a persistent
    telephone number, reusable virtual number, open message thread, callback route,
    or other contact path. A person may intend only a short first conversation with
    several candidates, while the communication mechanism unintentionally creates
    continuing reachability after that inquiry has ended. This document describes
    an architecture in which first contact and future reachability are separate authorization
    events. After a user creates a map search, property inquiry, service request,
    booking inquiry, quote request, or similar context, a platform can create a query-scoped
    non-bearer communication reference and bounded preview authority. A user or eligible
    business can participate in a real but limited first interaction. Continued communication
    is separately authorized and remains bound to attributes such as the original
    query, business identity, purpose, channel, effect, validity window, nonce, quota,
    revocation state, and enforcement point. Possession of a number, handle, previous
    conversation, lead assignment, API credential, or payment event is not by itself
    sufficient future- contact authority. The architecture separates marketplace policy
    from communication effectuation. A Communication Authority Service creates a protected
    authorization binding, while an enforcement point reconstructs the actual attempted
    communication, checks current protected state, atomically reserves or consumes
    relevant authority, and releases the communication-bearing resource only after
    successful verification. This permits privacy-preserving first contact, controlled
    future reachability, preview-qualified lead monetization, and AI-assisted business
    discovery without requiring a new public telecom protocol for initial deployment.
    Google Maps and Apple Maps are used as recognizable illustrative examples; no
    affiliation, endorsement, implementation, adoption, or technical alignment by
    Google, Apple, or any other named provider is implied. The architecture's binding
    of recipient identifiers to pseudonymous, query-scoped, time-limited, purpose-bound,
    and revocable authorizations rather than persistent contact data is consistent
    with the data protection principles of the EU General Data Protection Regulation
    (GDPR) -- including data minimization and purpose limitation (Article 5), storage
    limitation through bounded validity and quota, and privacy by design and by default
    (Article 25). This document describes a technical architecture only; it does not
    constitute a legal compliance determination, and conformance with GDPR or any
    other data protection law depends on the specific deployment, controller and processor
    roles, and operational practices of an implementing platform.</p>"

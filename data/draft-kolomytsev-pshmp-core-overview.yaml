abstract:
- content: "<p>PSHMP Core is a hybrid Layer-4-oriented overlay designed to keep multi-hop
    data delivery working when individual nodes, links, or network segments become
    unstable. It runs above ordinary IP infrastructure and does not require changes
    to Layer-3 routing. Implementations may carry overlay traffic over multiple bidirectional
    transports (for example UDP, DTLS, or TLS-protected TCP); the architecture is
    intentionally transport-agnostic at the edges. Under stable conditions the system
    builds ordered relay chains and forwards application fragments hop by hop while
    preserving fragment identity. When several nodes on a path show degradation, it
    can switch locally into a mesh-style recovery posture: collect alternative candidates,
    apply progressive fallback and diversity rules, enforce a quality gate, and replace
    the affected path. Continuous node assessment (K-Factor), a separate load signal,
    diversity-aware selection, failure tracking, gossip and DHT-assisted discovery,
    and batch acknowledgements with gap recovery form the supporting mechanisms. This
    document revises [I-D.kolomytsev-pshmp-core-overview] (-00). It clarifies forwarding
    invariants, separates path recovery from fragment recovery, documents load-aware
    ranking, and strengthens security and limitation language. Scoring weights and
    thresholds remain reference parameters of an experimental codebase; integrators
    may refine them for their topologies.</p>"

abstract:
- content: "<p>When IPsec Encapsulating Security Payload (ESP) is used in tunnel mode,
    an intermediate node cannot inspect the encrypted inner headers to derive entropy
    for Equal-Cost Multipath (ECMP) or Link Aggregation Group (LAG) path selection.
    Path selection is then driven by outer header fields that are identical for every
    packet of a given tunnel, so all packets of the tunnel are placed on a single
    path regardless of the number of inner flows. This document defines the ESP Entropy
    Header, an IP protocol header that is placed immediately ahead of ESP and carries
    an entropy value in a fixed position that transit nodes can use for path selection.
    It also defines an Internet Key Exchange Protocol Version 2 (IKEv2) extension
    with which peers negotiate the use of the header on a per- Child-SA basis. The
    mechanism applies to both IPv4 and IPv6.</p>"

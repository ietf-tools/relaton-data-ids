abstract:
- content: "<p>This document specifies the RICH (RESTful Interface for the Control-
    plane of Harnesses) architecture and information model. RICH provides a protocol-neutral
    governance, contract, qualification, and binding layer for RPC-based agent capabilities.
    It establishes a REST-addressable control plane for managing capability lifecycles
    while preserving native protocol execution in the data plane. It defines immutable
    capability and contract revisions, evidence provenance, connector transformation
    classes, compiled binding lockfiles, admission of bindings against an authorization,
    and runtime validation rules designed to contain drift and prevent confused deputy
    attacks in agentic systems. RICH does not make model behavior deterministic: it
    bounds what each admitted call can do, and makes every step on the connector path
    checkable and refusable.</p>"

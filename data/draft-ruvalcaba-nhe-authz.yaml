abstract:
- content: "<p>This document specifies how a consequential action attempted by a Non-Human
    Entity (NHE) is authorized at the time it is attempted. A security runtime transparently
    intercepts an entity's outbound action, so the entity holds no standing credentials,
    and classifies it under graduated autonomy as autonomous, supervised, or denied.
    A supervised action triggers a backchannel approval flow that presents a human
    approver with a human-readable rendering of the exact operation; on approval the
    runtime issues an intent-scoped, single- use, short-lived credential cryptographically
    bound to that specific action, which an enforcement point verifies against the
    operation actually being forwarded. The same canonical parameter digest scopes
    the credential and appears in the human-facing description, so the approver provably
    authorizes exactly what the credential permits. The flow and credential data model
    are specified here; the wire encoding is deferred to the next revision.</p>"

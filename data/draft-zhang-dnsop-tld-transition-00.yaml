abstract:
- content: "<p>This document describes the process for Top-Level Domain(TLD) registries
    to switch their Back-End Registry Operator(BERO), including migration requirements,
    data changes, and operational procedures. This document applies to scenarios where
    the name service of certain TLD is migrated between different BERO, and the TLD
    has implemented DNSSEC.</p>"

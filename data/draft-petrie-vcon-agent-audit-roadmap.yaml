abstract:
- content: "<p>AI agents converse with people, other agents and tools. There is a
    growing need to capture these conversations for audit, compliance and review.
    This document sorts the requirements for capturing agent conversations into those
    that fit vCon, those better met by plain logging and those that need other solutions.
    It then identifies the gaps in vCon and proposes a strawman set of vCon extensions
    to fill them. It is intended as a discussion document.</p>"

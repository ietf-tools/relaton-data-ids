abstract:
- content: "<p>This document defines a multi-jurisdiction compliance profile of the
    signed action receipt format used by AI agents to record machine- readable evidence
    of access-control decisions. The profile binds receipt fields to two regulatory
    surfaces: the European Union obligations of Articles 12 and 26 of Regulation (EU)
    2024/1689 (the EU AI Act) and Article 17 of Regulation (EU) 2022/2554 (DORA),
    and the United States obligations of the NIST Artificial Intelligence Risk Management
    Framework, the Colorado Artificial Intelligence Act (SB 24-205), the Texas Responsible
    AI Governance Act (HB 149), the New York Department of Financial Services Cybersecurity
    Regulation (23 NYCRR Part 500), the HIPAA Security Rule (45 CFR Part 164, Subpart
    C), SEC Rule 17a-4 (17 CFR 240.17a-4), and the Cyber Incident Reporting for Critical
    Infrastructure Act of 2022 (CIRCIA). It does not redefine the wire format, the
    canonicalization rule, or the signing algorithms of the underlying receipt format.
    It tightens a subset of the OPTIONAL fields to REQUIRED, imposes a retention floor,
    requires at least one timestamping anchor (RFC 3161 or OpenTimestamps; both RECOMMENDED),
    and adds two extension fields.</p>"

abstract:
- content: "<p>This document specifies records with which a third party can establish,
    later and without network access, what an automated agent, such as an artificial
    intelligence (AI) agent, was permitted to do and what it recorded doing. The person
    for whom the agent acts, the principal, signs a permission with a passkey; the
    permission carries limits that a verifier can check mechanically. The agent signs
    a receipt for each action with Ed25519 and the Module-Lattice-Based Digital Signature
    Algorithm (ML-DSA-87). Receipts are chained and entered in a log whose signed
    tree heads are time-stamped. A verifier reports, separately, whether the records
    are sound and whether each recorded action stayed within its permission. The content
    of each record is specified independently of its encoding; one encoding, JSON
    Web Signature (JWS) over canonical JavaScript Object Notation (JSON), is defined.</p>"

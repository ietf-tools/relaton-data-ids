abstract:
- content: "<p>Because the Internet forwards packets in accordance with the IP destination
    address, packet forwarding generally occurs without examination of the source
    address. As a result, malicious attacks have been launched using spoofed source
    addresses. The inter-domain source address validation architecture represents
    an effort to enhance the Internet by employing state machines to generate consistent
    tags. When two end hosts in different address domains (ADs) of an IPv6 network
    communicate with each other, tags are appended to the packets to identify the
    authenticity of the IPv6 source address. This document focuses on the data plane
    of the SAVA-X mechanism.</p>"

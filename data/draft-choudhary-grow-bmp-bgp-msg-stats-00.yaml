abstract:
- content: "<p>The BGP Monitoring Protocol (BMP) [RFC7854] Statistics Report carries
    RIB occupancy, policy, and route-processing metrics. Some existing types count
    UPDATE messages, but only as special cases grouped by result (duplicates, loops,
    and errors). No statistic gives a total count of each BGP message type. This document
    defines those totals as new BMP Statistics Types (UPDATE, KEEPALIVE, NOTIFICATION,
    ROUTE-REFRESH, and all BGP PDUs in each direction), states the operational use
    cases that motivate them, and records explicit non-goals so that last-error content,
    negotiated timer values, and implementation-specific internals remain out of scope.</p>"

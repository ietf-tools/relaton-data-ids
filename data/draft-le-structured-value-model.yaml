abstract:
- content: "<p>Derived identifier constructions that combine local material with identifiers
    from other systems need a defined comparison domain. This document defines a structured
    value model for such constructions and their profiles. A Value contains exact
    context octets, exact content octets, and a finite set of scoped opaque identifiers.
    Structural admission and equivalence are independent of serialization. Equality
    includes context, content, and complete identifier-set membership. The specification
    gives source mappings and profiles common obligations for fixed inputs, imported
    comparison adaptation, and preservation of participation distinctions. Surrounding
    specifications define concrete mappings, representations, identifier derivations,
    and the shared interpretation needed for interoperability. The model defines no
    global semantic namespace, wire format, cryptographic construction, or trust mechanism.</p>"

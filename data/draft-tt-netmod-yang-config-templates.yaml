abstract:
- content: "<p>This document defines a YANG-based configuration template mechanism
    whereby repetitive configuration data can be factored out into templates and applied
    where needed. This avoids the redundant definition of identical configuration
    and ensures the consistency of it, thus allowing configuration data to be managed
    more conveniently and efficiently.</p>"

abstract:
- content: "<p>The Time-Variant Routing (TVR) YANG data model [I-D.ietf-tvr-schedule-yang]
    defines a mechanism to describe scheduled changes in network resources (such as
    nodes and topology) as a function of time. However, the base model does not provide
    explicit lifecycle management semantics for the schedules, such as activation,
    suspension, or deprecation. This document defines an optional augmentation of
    the base YANG model to introduce lifecycle and administrative state control, enabling
    more flexible operational handling of schedules without modifying the base model
    semantics.</p>"

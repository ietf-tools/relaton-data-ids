abstract:
- content: "<p>PQST (Post-Quantum Secure Transport) is a post-quantum native session-primary
    datagram transport for secure tunnels without classical public key cryptography,
    hybrid key exchange, or classical fallback. The cryptographic session is the persistent
    object, the network path is a replaceable carrier, and a session can be re- anchored
    on a new path, after a restart, or after the loss of every path, with fresh post-quantum
    key material and without the session, its authorization, or the peers' authenticated
    identities changing. The cohort layer of PQST applies the same idea one level
    up: a group whose members' sessions move, sleep, recover and re-key independently
    while the group's membership changes only on security events. This document is
    a non-normative overview of, and reading guide to, the specifications of those
    two layers. It defines no wire format, no behaviour, and no requirements. The
    core protocol is proposed as the basis for Standards Track work; the cohort layer
    is Experimental. The author is seeking a working-group home for the core protocol
    and implementation experience with both layers.</p>"

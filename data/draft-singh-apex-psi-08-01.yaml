abstract:
- content: "<p>This document defines PSI-08, a domain profile of Proof of Stateful
    Integrity (PSI) for access events on health records, recording that an access
    occurred, by which role, and for what stated purpose. Each record is sealed as
    a PSI receipt so that later alteration, reordering, or removal is detectable.
    Only digests are sealed. PSI-08 shows integrity and ordering only; it does not
    show that an access was authorised, appropriate, or lawful. Revision 00 carried
    this title over an abstract describing predicate chains. This revision makes the
    body match the title.</p>"

abstract:
- content: "<p>In YANG-Push version 2, each publisher numbers its own notifications,
    and the numbers of two publishers are not comparable. When a single subscription
    is served by several publishers, for example on a multi- line-card router or a
    disaggregated routing stack, a collector cannot order updates across those publishers
    from the sequence numbers alone. This document defines an opt-in, coordination-free
    mechanism that carries a Comparability Scope, a coarse Causal-Epoch, and a per-
    publisher Local-Sequence-Number in the notification envelope. Publishers stay
    lock-free on the export fast path, and a collector reconstructs cross-publisher
    order within a bounded reordering window. A companion YANG module adds the subscription
    controls, the envelope metadata, and the capability discovery. The mechanism does
    not require synchronized clocks across publishers.</p>"

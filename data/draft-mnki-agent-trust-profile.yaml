abstract:
- content: "<p>Autonomous AI agents act on behalf of people and organizations across
    system and organizational boundaries. Existing credentials establish that a token
    is valid; they do not express which agent is acting, for whom, under what delegated
    authority, within which constraints, and whether that authority is still current.
    This document profiles existing standards — JWS, OAuth/OIDC, SPIFFE/WIMSE workload
    identity, DPoP-style proof of possession, OpenID AuthZEN and OpenID Federation
    — to carry those semantics: agent identity and principal binding, delegation with
    authority attenuation, capability-based authorization with constraints, request
    proof of possession, authorization attestations, tamper-evident provenance, revocation,
    and cross- organization trust. It defines no new cryptography, transport or token
    format.</p>"

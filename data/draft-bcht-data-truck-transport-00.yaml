abstract:
- content: "<p>Large-scale data transfers may be affected by bandwidth limitations
    and network instability, which can make network-based data transfer inefficient.
    DTTP provides an alternative data transfer method for such situations. DTTP uses
    physical transportation to carry Storage Media containing the Payload. A physical
    vehicle is used as the Transmission Medium for transporting the Storage Media
    between the Sender and the Receiver.</p>"

abstract:
- content: "<p>This document describes the high-level architecture for Agent Resource
    Discovery (ARD), an open, federated framework for publishing, indexing, discovering,
    and invoking software agent capabilities (such as Model Context Protocol servers,
    Agent-to-Agent agents, programmatic skills, and web APIs) across local networks,
    enterprise domains, and the public Internet. It defines the system roles, deployment
    topologies, core architectural principles, and end- to-end interaction flows that
    connect the ARD specifications for establishing Initial Contact and the Discovery
    Interface for capability lookup in the ARD catalog. The Registration interface
    will be specified in a later document.</p>"

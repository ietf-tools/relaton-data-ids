abstract:
- content: "<p>Modern telecommunications usually couple knowledge of a routable identifier
    with the practical ability to attempt contact. A telephone number, SIP URI, messaging
    handle, relay address, marketplace contact reference, or similar identifier can
    therefore remain a reusable reachability path after the original purpose for disclosure
    has ended. Existing controls solve important but different problems. Virtual or
    masked numbers hide an underlying endpoint but commonly leave a substitute route
    active while the alias is valid. STIR and SHAKEN authenticate or attest information
    associated with the calling identity, but do not by themselves establish that
    the authenticated caller is presently authorized by the recipient to create this
    particular communication effect. Combining number masking with STIR/ SHAKEN improves
    privacy and origin authenticity, yet still does not inherently convert reachability
    into purpose-scoped, revocable, consumable communication authority. OAuth can
    express delegated and even fine-grained API authorization, including sender-constrained
    tokens, but it does not define telecommunications-specific semantics in which
    a visible contact handle alone creates no effective path until recipient-side
    or policy-bound communication authority is established. This document describes
    a Capability-Validated Inbound Descriptor (CVID) and related query-scoped communication
    model. A communication request is represented as a Candidate Act and remains non-effective
    until current authorization is established for the requested communication effect.
    Authorization may be bound to sender or business identity, recipient scope, purpose,
    channel, time, quota, freshness, revocation and policy epochs, jurisdiction, device
    or agent identity, and other deployment-specific constraints. Two deployment profiles
    are distinguished. In a blocked-path profile, ordinary routing may proceed to
    an enforcement point that rejects a request lacking valid communication authority.
    In a stronger absent-path profile, possession of the visible handle alone does
    not resolve to or activate the effective communication path; protected authority
    must be established before routing, gateway resolution, media allocation, notification,
    or another consequence- bearing resource is released. The model is relevant to
    IMT-2030/6G because increasingly programmable, AI-assisted, machine-to-machine,
    and autonomous communications can generate requests at machine speed and scale.
    Early rejection or non-creation of unauthorized communication paths may reduce
    unnecessary signaling, gateway processing, fraud-analysis load, notification work,
    media/resource allocation, and associated energy consumption. These are potential
    efficiency benefits, not universal guarantees: authorization itself consumes resources,
    and net bandwidth or energy savings require measurement in the target deployment.
    The document focuses on the remaining problem space, comparison with existing
    mechanisms, 6G and sustainability relevance, blocked-path and absent-path operation,
    deployment feasibility, legacy interworking, latency considerations, security
    and privacy, and frequently asked questions likely to arise in telecom engineering
    review.</p>"

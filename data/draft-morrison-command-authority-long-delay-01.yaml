abstract:
- content: "<p>An enforcement point that checks agent-originated commands offline
    can be out of contact with the party that issues authority for anything from about
    2.6 seconds to about two weeks, and learns of no revocation in that time. This
    document profiles the Command Authority Envelope of the operational-technology
    command authority profile for that case. Two implementations have to agree on
    how an enforcement point decides, from a signed revocation status and a monotonic
    counter, that revocation status has gone silent past a declared budget, and on
    what a grant written in advance, a contingency grant, permits during that silence.
    The profile adds one grant field and one declared bound, a second revocation latency
    budget for the grants that field marks. It also states how expiry and maximum
    age are checked against a declared clock uncertainty, which way an unknown revocation
    check fails for each action class, and how a human approval signed before a command
    departs stays bound to one action.</p>"

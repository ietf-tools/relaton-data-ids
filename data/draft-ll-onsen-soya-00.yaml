abstract:
- content: "<p>This document defines the Service Orchestration with YANG-modeled Abstractions
    (SOYA) framework for building layered orchestration systems. Each layer exposes
    YANG-modeled service intent and operational state, and uses business logic to
    translate intent into configuration for the layer below. The framework describes
    the boundaries between layers, the propagation of configuration and state, and
    the separation of service processing from management protocol implementation.
    These principles apply to layers hosted within one orchestrator or distributed
    across several orchestrators.</p>"

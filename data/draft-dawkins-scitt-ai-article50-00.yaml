abstract:
- content: '<p>This document defines a Supply Chain Integrity, Transparency, and Trust
    (SCITT) profile for machine-readable cryptographic transparency receipts addressing
    all four sub-obligations of Article 50 of Regulation (EU) 2024/1689 (the "EU AI
    Act"): interactive AI system disclosure (50(1)), machine-readable marking of synthetic
    media (50(2)), emotion recognition notification (50(3), referenced for completeness),
    and AI-generated text disclosure with human editorial review exemption (50(4)).
    The profile defines three SCITT statement content types ("ai/article-50/v1", "ai/human-review/v1",
    and "ai/chatbot-session/v1") and specifies validation, verification, and chain-of-custody
    semantics suitable for presentation to European Union supervisory authorities,
    national competent authorities, and judicial proceedings. The profile is substrate-agnostic
    but presumes a SCITT Transparency Service backed by a publicly verifiable append-only
    log. A reference implementation using the Bitcoin blockchain as the SCITT log
    substrate, via RFC 6962 Merkle aggregation anchored in OP_RETURN transactions,
    is described in companion document draft-dawkins-scitt-lpr-00.</p>'

abstract:
- content: "<p>This document defines a reproducible framework for interoperability
    testing, security evaluation, negative testing, and performance measurement of
    implementations that integrate remote attestation with TLS 1.3 and DTLS 1.3. The
    framework complements existing Secure Evidence and Attestation Transport (SEAT)
    and Remote ATtestation procedureS (RATS) specifications. It defines evaluation
    profiles, test-vector requirements, deployment topology descriptions, decision-state
    observations, common result classifications, cross-implementation procedures,
    and security evaluation methods. The framework evaluates the boundaries between
    transport authentication, attestation capability negotiation, Evidence conveyance,
    appraisal, authorization, workload identity association, and protected application-data
    release. It additionally addresses reusable Attestation Results, connection-bound
    Evidence, cross-connection trust continuity, exporter-derived credentials, key
    custody, credential lifecycle, multi-Relying-Party isolation, proxy deployments,
    session resumption, early data, state drift, revocation, privacy, availability,
    and cryptographic agility. This document introduces a machine-readable evaluation
    model that connects individual protocol requirements to test vectors, implementation
    versions, observed results, and reproducible evidence. It does not define a new
    attestation protocol, Evidence format, TLS or DTLS extension, cryptographic key
    schedule, universal appraisal policy, or credential format. Protocol-specific
    behaviour remains governed by the exact specification revision under evaluation.
    A successful test demonstrates observed behaviour under declared conditions. It
    does not constitute a security certification or prove that a Target Environment
    is free from compromise.</p>"

abstract:
- content: "<p>This document defines a YANG module that augments the GREEN network
    controller YANG model [GreenController] to record the result of provenance verification
    for each Energy Object. The augmentation builds on the COSE-based signing mechanism
    defined in [ProvenanceDraft]. The controller verifies each signature it receives
    against a key it trusts. For each node or component, it records whether the most
    recent signature was valid, which key was used to sign it, and who is responsible
    for that key: the device itself, the network controller acting on its behalf,
    or an external authority such as a grid energy provider. A signature that cannot
    be verified, for example because the key is unknown or the signature is missing,
    is recorded as a failure, with the reason. This allows operators and auditors
    to check not just that energy data is correct, but where it came from, and how
    much trust applies to each source.</p>"

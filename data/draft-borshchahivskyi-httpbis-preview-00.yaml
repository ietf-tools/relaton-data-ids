abstract:
- content: '<p>Many applications display a "preview card" for a link: a title, a short
    description and an image. Today this information is obtained by retrieving the
    full HTML representation of the linked resource and extracting metadata from it.
    This forces origin servers to generate complete pages for clients that need only
    a few short strings. This document defines the Preview HTTP response header field,
    a Structured Field that carries link preview metadata, and describes how it can
    be delivered in responses to HEAD requests so that preview generators can obtain
    it without the origin server generating the representation.</p>'

abstract:
- content: "<p>This document describes the 11-Stage AI Visibility Lifecycle, a proposed
    analytical model of how AI systems discover, understand, trust and show websites
    to people. The eleven stages fall into three related phases -- AI Comprehension
    (Stages 1-5), Trust Establishment (Stages 6-8), and Human Visibility (Stages 9-11).
    The lifecycle is non-linear: Stages 1-2 come first for any page; Stages 3-11 are
    weighed together, and a domain can be progressing in several at once. Its figures
    are illustrative examples (analytical estimates), and its descriptions of how
    AI systems work are inferred from observed behaviour, not documented internals.
    Its contribution is a common vocabulary and a dependency map for telling crawlability
    from visibility and for measuring each element, with the claims that rest on outside
    research cited to it in the deposited specifications. Its figures and some of
    its mechanisms are provisional and remain to be tested.</p>"

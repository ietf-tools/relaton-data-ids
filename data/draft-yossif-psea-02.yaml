abstract:
- content: "<p>This document defines the PSEA Token Profile, an Entity Attestation
    Token (EAT) profile for action-bound, user-verification-gated transaction-confirmation
    Evidence. The profile specifies the canonical encoding, the signed proof-token
    claim set, the action- payload and cross-replay bindings, an optional hash-chain
    integrity layer, and the security properties that together constitute a What-
    You-Sign-Is-What-You-Execute proof that a human, present and verified at an authenticator,
    approved a specific named action at the moment of execution. The profile binds
    what is signed to what the Verifier executes; it does not, by itself, bind what
    a human saw on a potentially compromised display to what was signed (the What-You-See-
    Is-What-You-Sign problem), which remains out of scope. The strength of the human-presence
    assurance depends on the authenticator's user- verification enforcement: where
    the platform attestation conveys that enforcement it is hardware-attested, and
    otherwise it rests on the authenticator's signed assertion that user verification
    occurred. The profile does not, by itself, prove a specific human identity. It
    fills the transaction-confirmation gap left unaddressed by deployed authentication
    standards and complements OAuth 2.0 Step-Up Authentication by supplying the per-action,
    cryptographically action- bound Evidence that step-up flows can require.</p>"

abstract:
- content: "<p>This document defines a common service intent model for High Performance
    Computing (HPC) and AI workloads over High Performance Wide Area Networks (HP-WANs).
    The model allows heterogeneous workload managers and orchestration platforms to
    express endpoint, communication pattern, timing, performance, data movement, policy,
    and admission requirements for network services without exposing technology-specific
    tunnel realization details.</p>"

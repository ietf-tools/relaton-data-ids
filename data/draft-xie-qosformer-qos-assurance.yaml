abstract:
- content: "<p>Network operators need to assess how changes to quality-of-service
    (QoS) policies may affect individual traffic flows and shared network resources.
    Measurements describe observed behavior, but policy evaluation also requires predictions
    under candidate configurations. This document describes a framework that combines
    heterogeneous network measurements and configuration data in a Multiple Flow Snapshot
    (MFS), learns representations through masked reconstruction, and uses a Transformer-based
    model called QoSformer to predict throughput, delay, and resource utilization.
    It describes offline model preparation, online candidate evaluation, and feedback
    after authorized policy changes. A 5G core network use case illustrates the mapping
    to analytics and policy-control functions. The framework is informational: it
    defines neither a new wire protocol nor extensions to existing 3GPP interfaces.</p>"

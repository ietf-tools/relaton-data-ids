abstract:
- content: "<p>This document describes a protocol-neutral pattern for content- addressed
    research artifacts, append-only evidence history, explicit epistemic classes,
    and corrigible active scientific state. It separates byte integrity from numerical
    correctness, empirical adequacy, mechanism identification, and release authority.

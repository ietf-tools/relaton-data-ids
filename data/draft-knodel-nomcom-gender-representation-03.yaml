abstract:
- content: "<p>This document addresses two complementary gaps in the operation of
    the IETF Nominating Committee (nomcom). First, it extends the existing limit on
    nomcom representation by organization ([RFC8713], Section 4.17) so that not all
    voting members belong to the same gender. Second, it proposes a comportment framework
    for nomcom members so that the nomcom conducts itself with the rigor and fairness
    expected of any committee that evaluates candidates for leadership roles.</p>"

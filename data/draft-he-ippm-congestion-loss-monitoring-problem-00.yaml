abstract:
- content: <p>Emerging services including enhanced Mobile Broadband (eMBB) and Ultra-Reliable
    Low Latency Communication (uRLLC), as well as Artificial Intelligence (AI)training
    and inference have imposed stringent requirements of "high throughput, low latency,
    and minimal packet loss" on IP bearer network performance. Network congestion
    can lead to performance degradation and increase uncertainty in service delivery,
    so real-time congestion monitoring is necessary. This document discuss the requirements
    of real-time monitoring of packet loss caused by congestion, present the problems
    and challenges faced by existing measurement techniques in monitoring congestion-
    induced packet loss.</p>

abstract:
- content: "<p>This document specifies a mechanism for a relying party to retrieve
    Merkle-tree subtree consistency proofs needed to validate a landmark- relative
    Merkle Tree Certificate (MTC). An X.509 certificate extension identifies one or
    more Landmark Distribution Points (LDPs). A relying party requests a proof set
    from an LDP and validates the proof chain against a trusted, signed target checkpoint.</p>"

abstract:
- content: <p>This document defines a YANG data model, "ietf-pm-interval- capabilities",
    that enables a server to advertise which collection intervals it can support.
    A client reads this capability information before configuring performance measurements,
    so that it selects only sampling and collection intervals that the server can
    honour. The capabilities are advertised by augmenting the "ietf-system- capabilities"
    module defined in [RFC9196], so that a client discovers them at the same well-known
    location used for subscription and notification capabilities. The model imports
    the "profile-names" type from the companion collection measurement model defined
    in [I-D.yoon-ippm-collection-measure] and mirrors its profile-and- parameter structure,
    ensuring direct alignment between capability discovery and measurement configuration.
    The model does not define measurement data structures or any delivery mechanism;
    those are defined in the companion document.</p>

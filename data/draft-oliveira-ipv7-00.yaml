abstract:
- content: "<p>This document specifies IPv7, an identity-centric network protocol
    that replaces purely numerical source addressing with a hierarchical identity
    string and a Variable-Length Identity Block (VLIB). The VLIB carries an Ephemeral
    Identity Token (EIT), provider and tenant identifiers, role/policy signalling,
    and an Origin Signature verifiable by the originating provider. Validation occurs
    in three layers at the first-hop router: Origin Verification, Identity Verification,
    and Policy Enforcement. A quantum-resistant signature option using CRYSTALS-Dilithium
    (ML-DSA-65) is incorporated. This document also describes an optional local extension
    for Rate-Limit Tokens issued by ISPs and enforced in hardware. A reference implementation
    in Rust is available as the arkhe-ipv7 and arkhe- ipv7-cli crates.</p>"

abstract:
- content: <p>This memo profiles the two-round threshold Schnorr signature scheme
    of RFC 9591 for the custody of the signing key of an organisational identity.
    No single member or device of the organisation ever holds that key, and a quorum
    of the organisation's authorised members signs on its behalf. The profile requires
    the FROST(Ed25519, SHA-512) ciphersuite. Because that ciphersuite produces ordinary
    Ed25519 signatures, a key held this way is published, rotated and verified exactly
    as the DNS-based discovery memo "Discovery of Model Context Protocol Servers via
    DNS TXT Records" already specifies, and no verifier needs to change. The memo
    specifies a distributed key- generation ceremony in which the whole key never
    exists in one place, the record of who may sign and how many must agree, the request
    and assembly of a signature, a signed custody statement by which a verifier learns
    that a published key is held under a threshold, and the handling of member removal,
    share refresh and loss. The memo is Informational.</p>

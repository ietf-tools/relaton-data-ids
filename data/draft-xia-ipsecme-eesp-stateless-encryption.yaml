abstract:
- content: "<p>This document specifies a stateless encryption profile for Enhanced
    Encapsulating Security Payload (EESP). The profile is intended for large-scale
    deployment scenarios in which maintaining per-flow or per-session encryption state
    is operationally expensive or infeasible. Instead of storing a distinct data key
    for each secure flow, endpoints derive per-packet or per-context data keys from
    a smaller set of provisioned root keying material together with packet- carried
    context. The document describes the deployment motivation, the stateless keying
    model, the mapping of required fields onto EESP extension points, context construction
    rules, data-key derivation processing, IV construction requirements, security
    considerations, and operational considerations. The intent is to realize stateless
    encryption as an extension profile over EESP, rather than as a parallel encapsulation
    format.</p>"

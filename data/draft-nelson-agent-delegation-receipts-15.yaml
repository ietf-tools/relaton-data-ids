abstract:
- content: '<p>This document defines the Agent Delegation Receipt: a signed record
    of what a human principal authorized an AI agent to do, for how long, and under
    what instructions. The receipt carries a scope, hard boundaries, a validity window,
    and a hash of the operator''s stated instructions, all signed by the authorizing
    key. Version -11 replaces the draft''s earlier custom signature format with two
    standard profiles: a JWS profile (RFC 7515) over JCS-canonicalized JSON (RFC 8785)
    as the primary wire format, and a COSE_Sign1 profile (RFC 9052) for constrained
    environments. It also specifies scope attenuation rules for multi-agent delegation
    chains, a revocation registry model with cascade semantics, and the limitations
    of what receipts can and cannot prove. Version -12 resolves the unknown- fields
    question raised on the IETF oauth mailing list: authorization fields are closed
    (verifiers reject unknown top-level body fields rather than silently ignoring
    them), the "metadata" object is the defined extension point, and one-time-use
    receipts fail closed without a durable consumption store. Version -13 incorporates
    independent-implementation feedback: it pins the orchestratorSignature verification
    key to the sub-receipt signer''s key, states the receipt-issuance computation
    order explicitly, and guides issuers on default boundaries versus explicit allowances.
    Version -14 adds a pointer to content profiles for verification of what the agent
    produced, following implementer feedback. Version -15 adopts the grant/execution
    vocabulary of [CHEN-AGENT-USE-CASES]: the receipt as Execution Layer Evidence
    for a Grant Layer Authority. It adds delegatee holder binding for sub-receipts
    -- a parent names the delegatee''s public key, closing a bearer-copy issuance
    gap found in review -- deprecates orchestratorSignature as redundant, sketches
    an OAuth authorization_details binding so a token can reference its receipt, and
    states normative custody requirements for the authorizing key. The delegateeKey
    field is a wire-format addition; -14-era verifiers will reject receipts carrying
    it, which is the intended fail-closed version behavior.</p>'

abstract:
- content: "<p>A falsifiable, typed model separates ontological categories, epistemic
    states, evidence, consensus, uncertainty, provenance, and authority. The proposed
    protocol forbids consensus-only promotion of physical claims and requires traceable
    evidence for changes in verification status. Novelty and empirical advantage remain
    unestablished.</p>"

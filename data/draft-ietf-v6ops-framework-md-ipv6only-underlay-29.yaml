abstract:
- content: "<p>This document presents a framework, from the network operators' perspective,
    for building and operating IPv6-only core networks that span multiple domains
    (i.e., multiple interconnected Autonomous Systems). To carry residual IPv4 traffic
    in such an environment, the framework proposes stateless IPv4/IPv6 address mapping
    as the basis for IPv4-as-a-Service (IPv4aaS), so that IPv4 packets are translated
    at the network edge and forwarded across the IPv6-only core network without per-flow
    state or IPv4/IPv6 conversion gateways on the data path. The document is intended
    as a network operator problem statement, guidance, and requirements rather than
    a protocol specification. It covers the scope of applicability and trust boundaries,
    options for IPv6 mapping prefix allocation, and operational, manageability, and
    security considerations.</p>"

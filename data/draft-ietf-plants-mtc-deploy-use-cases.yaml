abstract:
- content: "<p>Merkle Tree Certificates (MTCs) [I-D.ietf-plants-merkle-tree-certs]
    has been defined for the use case of the WebPKI. In this document we explore when
    and how MTCs in parts or full can be used in different use cases. Some of these
    use- cases may provide benefit for private PKI usage.</p>"

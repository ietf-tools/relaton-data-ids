abstract:
- content: <p>This document specifies a BGP capability that complements the ADD- PATH
    Capability by indicating the maximum number of paths a BGP speaker can receive
    from a peer, optimizing the transmission of BGP routes by selectively relaying
    pertinent routes instead of the entire set. This document also defines a new BGP
    Cease NOTIFICATION message subcode, "Maximum Number of Paths Reached", used when
    a BGP speaker terminates a peering because the number of paths received from a
    neighbor for a prefix exceeds the Paths Limit advertised in the PATHS-LIMIT Capability.</p>

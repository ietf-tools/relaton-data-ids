abstract:
- content: "<p>Several profiles record what an AI agent was asked to do, and the decision
    taken, as signed statements registered with a transparency service. Protocols
    for agent identity and delegated authorization say whether an agent may ask. After
    an incident or in a dispute, three further questions decide the case: were the
    authorizations the action relied on still valid when it committed, did a named
    person approve this exact action, and did the action change the system of record
    as recorded? This document defines evidence that any agent action profile can
    add to answer them: an authority set that binds the digests of the outside authorizations
    an action relied on to that one action, with a re-check recorded at the moment
    it commits; an approval binding that ties a person's confirmation, by a passkey
    or an outside approval service, to the exact action and to what the person was
    shown; salted commitments to the affected state before and after execution; an
    outcome confirmation made by reading the system of record; and three outcome classes
    a relying party can act on. Values are hidden behind salted commitments and can
    be disclosed field by field. It also states how a verifier obtains the keys and
    times used to check signatures, so that neither comes from the signer. The constructions
    are implemented in the Open Action Record (OAR) format, with three verifiers that
    agree on published test vectors.</p>"

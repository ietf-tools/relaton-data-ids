abstract:
- content: "<p>This document defines a fine-grained, dynamically adaptive QoS mechanism
    for QUIC transport. The mechanism encodes a priority mapping table index in the
    QUIC Destination Connection ID (DCID), enabling host NICs or user gateways to
    translate QUIC-layer service priority information into network-layer QoS mechanisms
    (DSCP/ToS per RFC 2474) and traffic engineering policies (SRv6 TE, MPLS TE, etc.)
    for end-to-end QoS enforcement. Stream IDs carry endpoint priority information
    for local scheduling. The mechanism supports host-side, network-side, and coordinated
    deployment modes with no intrusion into the host protocol stack.</p>"

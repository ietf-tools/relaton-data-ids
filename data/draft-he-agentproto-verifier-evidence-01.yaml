abstract:
- content: "<p>A verifier result reports what a check returned. It does not report
    whether the check could have returned anything else. A check that inspects too
    narrow a set of fields, and a check whose rejecting or unverifiable input has
    never occurred, both report the same accepting value as a check that distinguishes,
    and a conformance matrix does not tell them apart. This document defines requirements
    for reporting whether a check has been exercised into its declared rejecting and
    unverifiable outcomes, and requirements for results that claim completeness: that
    the records relied on were the whole of some stated set. Those are two separate
    obligations. A result must name the set it claims to have seen, and must not treat
    a party with an interest in the answer as the only thing looking. This document
    defines no wire format, encoding, token, claim vocabulary, test harness, or registry.
    It does require a record to identify certain facts, which is a constraint on what
    a record must be able to express rather than on how it is written down. A profile
    satisfying these requirements will need a place to put those facts.</p>"

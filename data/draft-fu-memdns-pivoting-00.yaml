abstract:
- content: '<p>Heterogeneous memory networks (CXL pools, HBM/DDR/SRAM hierarchies,
    processing-in-memory arrays) form a big memory system, which exposes fragmented
    addressing to ML inference runtimes. This document describes Memory DNS (MemDNS),
    a semantic-addressing framework that applies DNS principles -- domain names, hierarchical
    delegation, caching, TTL, and authoritative records -- to tensor data placement
    in Big Memory Systems (BMS), deployed as limited domains (RFC 8799). The focus
    is "automated pivoting": the resolution and control machinery that automatically
    switches data access paths (replica selection), migrates data across media (placement
    pivoting), and recovers from faults (failover pivoting), driven by closed-form
    decision models (Appendix A; key logic pseudo-code in Appendix C) instead of ad-hoc
    thresholds. The document specifies record semantics, resolution flow, cache/TTL
    behavior, delegation, pivot decision models, and protocol considerations, together
    with a reference implementation summary.</p>'

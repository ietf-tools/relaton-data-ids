abstract:
- content: "<p>This document proposes extensions to the Semantic Definition Format
    (SDF) and the Constrained Application Protocol (CoAP) to better support AI agent
    interaction with Internet of Things (IoT) devices. It covers two aspects: identifying
    AI agents in CoAP transactions, and making SDF device descriptions readily consumable
    by large language models (LLMs) and autonomous agents. The document is intended
    to stimulate discussion within T2TRG on these topics.</p>"

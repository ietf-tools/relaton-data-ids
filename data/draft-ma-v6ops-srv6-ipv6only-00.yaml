abstract:
- content: "<p>This document describes considerations for deploying IPv6-only networks
    based on SRv6 encapsulation in metro and backbone networks. It presents several
    deployment scenarios, including fixed broadband internet access, high-value leased-line
    services, and traffic steering to data center resource pools, and provides operational
    guidance derived from production network pilots.</p>"

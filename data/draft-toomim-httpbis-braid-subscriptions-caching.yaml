abstract:
- content: "<p>Without a subscription, a cache can serve a stored response only while
    the response is fresh, and then has to ask the origin server whether the resource
    has changed. So a cache serves a resource that changes often either stale, or
    with a request to the origin server each time. This document defines how a cache
    subscribes to the resource, as any HTTP client can. The cache stores each response
    in the subscription as the response to a GET. While the subscription is continuously
    validating, the cache knows at every moment that its copy is current, so it can
    respond to requests with the copy, without asking the origin server, even for
    responses marked no-cache. When validation stops, the copy ages, and HTTP's rules
    for stale responses apply. A cache can also serve many subscribers of its own
    from one subscription to the origin server, and keep private responses private.
    This document updates RFC 9111, so that a continuously validating subscription
    satisfies the no-cache directive. This document is one of the Braid-HTTP extensions,
    which work alone or together; together they make HTTP a state synchronization
    protocol.</p>"

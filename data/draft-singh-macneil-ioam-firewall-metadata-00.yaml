abstract:
- content: "<p>This document defines a new IOAM Namespace and associated Data Fields
    for carrying firewall and security-related metadata within the In- situ Operations,
    Administration, and Maintenance (IOAM) framework (RFC 9197). The mechanism allows
    each security Enforcement Point on a path to attach a verifiable attestation of
    the action it took on a packet. This lets downstream Enforcement Points and other
    nodes confirm that security policy was actually executed on the data path -- detecting
    policy bypasses and detecting divergence between Enforcement Points that are expected
    to agree -- while each Enforcement Point continues to apply its own policy independently
    rather than delegating enforcement. This validation of execution complements the
    management plane's validation of intent. The metadata also enables real-time signaling
    of policer states for DDoS mitigation. To ensure the authenticity and integrity
    of this information, this document leverages the integrity protection mechanisms
    defined in the IOAM data integrity specification (draft- ietf-ippm-ioam-data-integrity).</p>"

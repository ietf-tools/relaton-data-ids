abstract:
- content: "<p>PSHMP Core is a hybrid L4-oriented overlay designed to keep multi-hop
    data delivery working when individual nodes, links, or network segments become
    unstable. It runs above ordinary IP infrastructure and does not require changes
    to Layer 3 routing. Under stable conditions the system builds linear relay chains.
    When several nodes on a path show degradation, it can switch locally into a mesh-style
    recovery mode: collect alternative candidates, apply progressive fallback rules,
    enforce a quality gate, and replace the affected path. Continuous node assessment
    (K-Factor), diversity- aware selection, failure tracking, gossip and DHT discovery,
    and batch acknowledgements with gap recovery form the supporting mechanisms. This
    document describes the architecture (including component layers), operating principles,
    key evaluation and delivery formulas, and the relationship to an experimental
    implementation (PSHMP Core v3.1). Implementation-specific scoring weights, exact
    thresholds, and proprietary optimisations may be refined by integrators; the formulas
    given here represent the reference model used in the current experimental codebase.</p>"

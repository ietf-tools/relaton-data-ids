abstract:
- content: "<p>This document specifies a UDP transport binding for the Link Quality
    Telemetry data model. The binding disseminates YANG-modeled link quality data
    between directly connected switches in multi-stage CLOS (leaf-spine) data center
    fabrics using a compact, fixed-offset binary encoding designed for forwarding-plane
    (ASIC) generation and consumption, achieving sub-100 microsecond notification
    latency on forwarding engines capable of data-plane UDP processing. The encoded
    payload can be carried natively on a dedicated UDP port or as a TLV within the
    Router-Info advertisement mechanism; both carriages share a byte-identical payload.
    The data model, receiver processing rules, and requirements applicable to all
    transport bindings are defined in a companion document.</p>"

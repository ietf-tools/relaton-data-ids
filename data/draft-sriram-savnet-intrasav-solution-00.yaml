abstract:
- content: "<p>This document specifies a solution, named IntraSAV, for intra-domain
    source address validation (SAV). This solution addresses the problem stated in
    the ietf-savnet-intra-domain-problem-statement (RFC-to-be) document. This document
    updates BCP 38 ([RFC2827]) and BCP 84 ([RFC3704], [RFC8704]) by providing a more
    comprehensive solution methodology and accommodating prefixes that are not routed
    but used for sourcing traffic originating from an AS.</p>"

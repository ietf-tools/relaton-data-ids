abstract:
- content: "<p>The SCHC architecture separates a SCHC Control Header from a SCHC Data
    Header but leaves the format of the Control Header, the RuleID encoding, and the
    Discriminator deployment-specific. A node that handles a SCHC datagram without
    being a Compression/Decompression endpoint - a segment boundary, firewall, classifier,
    or capture tool - therefore cannot delineate the datagram. This document defines
    the SCHC Header Format: a small, named description of a SCHC datagram's framing
    - the RuleID encoding and the Control Header type - that can be conveyed in band
    (self-describing) or fixed out of band (by an RFC binding it to a demux point,
    by configuration, or by a signalling protocol such as ICMPv6-SEC). It defines
    the self-describing Shape Tag wire format and establishes the SCHC RuleID Encodings
    and SCHC Control-Header Types registries.</p>"

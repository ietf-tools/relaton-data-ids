abstract:
- content: "<p>This document describes CTP/0, the definition layer of the Cognitive
    Time Protocol (CTP) family. CTP/0 is an informational conceptual framework for
    naming, separating, comparing, and referencing time- related claims in AI and
    agent systems. CTP/0 defines terminology for profile-defined cognitive events,
    event-density claims, ordering claims, branching claims, sequential- computation
    evidence, and declared temporal-structure claims. CTP/0 does not define a wire
    protocol, message format, signature format, identity system, hash-chain protocol,
    governance process, physical theory of time, theory of consciousness, or legal-
    accountability framework. Where verifiable records are required, CTP-compatible
    claims can be bound to external event, receipt, dependency-graph, observation,
    or change-evidence infrastructure.</p>"

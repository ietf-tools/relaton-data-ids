abstract:
- content: "<p>In large-scale networks using BGP-LS SPF routing, region division is
    necessary to make the networks stable. Some networks (e.g., satellite networks)
    have the characteristics of a flat design, which means that no backbone region
    exists in the network. This document presents a routing framework for region division
    in large-scale flat BGP-LS SPF routing networks. This framework can realize flexible
    region division, establish intra-region and inter-region paths, and complete end-to-end
    data forwarding.</p>"

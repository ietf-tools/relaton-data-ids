abstract:
- content: "<p>This document specifies the Agent Authenticator, a mechanism that lets
    autonomous software agents, such as AI coding agents, authenticate to services
    with properties comparable to passkeys: keys held in secure hardware, no shared
    secrets, binding to the service's origin that a manipulated agent cannot override,
    attested execution environments, and explicit human approval of each agent and
    of high- risk actions. The same protocol serves agents on personal computers and
    in cloud environments. It is a profile over existing mechanisms rather than a
    new identity system: it uses OAuth 2.0 Token Exchange, the Identity Assertion
    JSON Web Token (JWT) Authorization Grant, and Model Context Protocol (MCP) authorization,
    and it binds each agent action to a signed, tamper-evident record.</p>"

abstract:
- content: "<p>The BGP Monitoring Protocol (BMP) defines mechanisms to monitor BGP
    running status and routing information bases (RIBs). [RFC9972] extended BMP statistics
    reporting by introducing advanced BGP RIB stat types. However, with the rapid
    deployment of path-level cryptographic security protocols (such as ASPA) and the
    complex interactions between control plane and hardware forwarding resources,
    network operators require granular, behavior-driven observability into why routes
    are discarded, invalidated, or restricted at both the ingress and egress boundaries.
    This document updates the registry established by [RFC7854] and extended by [RFC9972]
    by defining some fine-grained BGP RIB monitoring statistics types covering hardware
    resource exhaustion, next-hop resolution anomalies, structured route leaks ([RFC7908]),
    and ingress/egress ASPA verification states. Furthermore, it introduces a 4-bit
    control flag space within the Stat Type TLV to enable dynamic differential rate
    monitoring and proactive asynchronous trigger-driven telemetry.</p>"

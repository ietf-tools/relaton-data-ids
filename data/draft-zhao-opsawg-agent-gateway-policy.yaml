abstract:
- content: "<p>This document defines an operational policy control model for operator-managed
    Agent Gateways. The model describes how an operator can control and observe interactions
    that are admitted, mediated, routed, proxied, or otherwise handled by an Agent
    Gateway. The model does not govern an agent's internal behavior, reasoning, planning,
    prompts, memory, tools, runtime, or lifecycle. Instead, it uses agent-related
    identifiers, groups, tenants, task classes, and service levels as gateway-recognized
    policy matching attributes. Those attributes allow an operator-managed Agent Gateway
    to identify the interactions to which a policy applies. The model defines four
    core policy classes: Interaction Access Control, QoS and Flow Control, Invocation
    and Token Control, and Path Selection. It further defines three supporting management
    capabilities: Subject and Attachment Binding, Applied Policy State and Telemetry,
    and Policy Lifecycle and Failure Handling.</p>"

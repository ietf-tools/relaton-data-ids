abstract:
- content: "<p>Automated agents can exercise OAuth-derived authority through delegated
    credentials, child agents, asynchronous work, and operations spanning multiple
    administrative domains. Invalidating an individual token does not necessarily
    establish that the authority represented by that token can no longer cause a new
    consequential operation. This document defines authority epochs, delegation-lineage
    requirements, admission fencing, and revocation-closure states for OAuth-based
    agent delegation. It distinguishes token invalidation from authority closure and
    specifies that unresolved in-scope state produces UNKNOWN or PARTIAL rather than
    CLOSED. The profile composes with OAuth Token Revocation, Token Exchange, Token
    Introspection, proof-of-possession mechanisms, Transaction Tokens, and workload-
    identity systems such as WIMSE.</p>"

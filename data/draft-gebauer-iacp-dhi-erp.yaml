abstract:
- content: "<p>Ever since 1969 and the ARPANET, the internet has repeatedly been faced
    with challenges that it has had to overcome—and has overcome. Year after year,
    the number of users has grown, and year after year, the complexity and range of
    ways in which the internet can be used have expanded. With the advent of AI, we
    not only have a new type of user, we have a different form of communication; the
    internet itself is being attributed a completely different significance. If they
    are not already, AIs will make up the majority of internet users in the foreseeable
    future. The question of an ‘AgentNet,’ is not merely a question concerning the
    internet; it is a question of how AIs will interact within a global network in
    the future.</p>"

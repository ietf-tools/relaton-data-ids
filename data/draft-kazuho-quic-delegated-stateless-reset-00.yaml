abstract:
- content: "<p>This document specifies how a QUIC endpoint may delegate the emission
    of Stateless Resets to a component that outlives the QUIC stack -- for example,
    an operating system that resets the peers of an application that has exited. As
    such delegation is most useful on the client side, where endpoints often use zero-length
    Connection IDs, this document also defines a transport parameter and a frame that
    allow those clients to advertise a Stateless Reset Token.</p>"

abstract:
- content: "<p>This document defines AFiR (Attested Fragmented Inference Routing)
    as a production profile of the IETF SPICE Inference Chain specification [I-D.draft-mw-spice-inference-chain].
    The SPICE Inference Chain defines computational provenance via two mechanisms:
    Zero-Knowledge Machine Learning (ZKML) proofs and Trusted Execution Environment
    (TEE) attestation quotes. Both require either significant proof generation latency
    (ZKML) or specialized hardware (TEE). Neither is deployable today in commodity
    serverless inference environments without infrastructure changes. AFiR defines
    a third proof type -- post-quantum digital signature attestation using ML-DSA-65
    (NIST FIPS 204) -- that is deployable on any inference platform, requires no specialized
    hardware, adds 0.785ms of overhead per fragment, and produces a 384-byte receipt
    anchored on a public blockchain. AFiR receipts are structurally compatible with
    the SPICE Inference Chain Merkle tree and can coexist with ZKML and TEE entries
    in the same session chain. AFiR extends the SPICE inference chain with five concrete
    production primitives: Signed Tool Calls (P1), Cross-Agent Receipt Trees (P2),
    KV Cache Signing (P3), Model Manifest attestation (P4), and a Crypto- Agile Signature
    Layer (P5). All five are deployed and serving production traffic as of June 2026,
    making AFiR the first production implementation of the SPICE inference_root claim
    for multi-agent pipelines.</p>"

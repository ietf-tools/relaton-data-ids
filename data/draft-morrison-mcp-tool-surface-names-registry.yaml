abstract:
- content: "<p>Two Model Context Protocol (MCP) servers can offer a tool under the
    same name with different argument schemas, and a client has no machine-readable
    signal that the two are not the same capability. This document describes a possible
    registry of tool surface names, the wire-level identifiers by which a client invokes
    a typed capability on an MCP server. It sets out the per-entry fields, a name
    grammar and a Specification Required registration procedure with a Designated
    Expert. The document is Informational. It has one prospective registrant, the
    author, and the MCP specification is maintained by another body. It therefore
    makes no request of IANA at this revision, and the registry would be requested
    only if the specification's maintainers or an operator other than the author wanted
    it.</p>"

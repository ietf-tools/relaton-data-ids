abstract:
- content: "<p>When a software agent initiates a payment on behalf of an organization,
    the party that settles the payment usually cannot see the policy under which it
    was permitted. This document describes a signed authorization verdict: a JSON
    Web Token, signed with ES256, that records the outcome of evaluating one payment
    request, including its amount, currency, and recipient, against a spending policy
    that the organization configured. A party holding the issuer's published public
    key can verify a verdict without contacting the issuer. The document describes
    the claim set, key publication and rotation, and a verification procedure, and
    states what a verdict does not assert. It describes the format as one implementation
    issues it, including the points where it departs from JSON Web Token Best Current
    Practices (RFC 8725). It is offered as input to IETF discussion of authorization
    records for agent-initiated actions and is not a proposal for standardization.</p>"

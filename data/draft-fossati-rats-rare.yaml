abstract:
- content: "<p>This document describes a set of REST APIs that can be used by RATS
    roles to interact. These APIs facilitate the discovery of a role's capabilities,
    as well as the negotiation and exchange of RATS Conceptual Messages in several
    key scenarios, including Evidence gathering, Evidence appraisal, Endorsements
    and Reference Value management. This document aims to present a useful subset
    of possible RATS interaction patterns, rather than covering all of them.</p>"

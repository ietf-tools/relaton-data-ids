abstract:
- content: "<p>This document describes the Protected Orchestrated Overlay Link (POOL),
    an experimental secure transport protocol. POOL provides mandatory mutual authentication,
    always-on authenticated encryption with no plaintext mode, a stateless handshake
    resistant to resource exhaustion attacks, cryptographically unpredictable sequence
    numbers, self-describing 256-bit addresses, active path MTU discovery, per- flow
    telemetry, atomic configuration changes with automatic rollback, and an append-only
    hash-chained change journal. POOL operates either as an overlay above TCP or directly
    over IP using experimental protocol number 253.</p>"

abstract:
- content: "<p>This document defines the Agent Discovery Protocol (ADP) v1.1, a layered
    protocol for discovering, verifying, and interacting with AI Agents on the Internet.
    ADP delegates DNS discovery to DNS-AID (SVCB records) and defines a Well-Known
    JSON metadata format, an Ed25519-based identity model, and the Agent Gateway Protocol
    (AGP) for real-time WebSocket messaging. The protocol is designed to be decentralized,
    standards-based, and incremental — clients escalate from DNS to HTTP to WebSocket
    only as needed.</p>"

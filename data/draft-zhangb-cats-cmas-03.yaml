abstract:
- content: "<p>CATS applications require service discovery and traffic steering across
    heterogeneous computing resources. Directly exposing raw computing metrics from
    different hardware platforms can be difficult for clients, service sites, and
    CATS control-plane components to interpret consistently. This Informational document
    describes a public service platform for CATS. The platform maintains a common
    service catalogue, associates public service identifiers with service descriptions
    and deployment requirements, and provides the service context used by service-oriented
    metric mechanisms. Service-oriented metric definitions and operational procedures
    are specified in [I-D.zhangb-cats-service-metrics-op-01].</p>"

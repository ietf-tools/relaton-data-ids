abstract:
- content: '<p>This document profiles draft-farley-acta-signed-receipts, "Signed Decision
    Receipts for Machine-to-Machine Access Control", for use as card-scheme dispute
    evidence. It defines how a conforming decision receipt is populated for payment
    disputes, and specifies four additional evidence layers bound to that receipt:
    card-scheme dispute-evidence categories (Visa Compelling Evidence 3.0, Mastercard
    First-Party Trust), agent-native anchors with no scheme-defined slot, a settlement
    anchor recording what money actually moved, and an evidentiary-custody wrapper
    aligned with U.S. Federal Rules of Evidence 901/902. This is a vendor profile
    documenting one implementation (ActaSeal''s DisputeEvidencePacket); it does not
    define a new protocol and makes no claim of IETF consensus or standardization.</p>'

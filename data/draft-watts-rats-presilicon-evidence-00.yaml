abstract:
- content: "<p>Hardware security designs are increasingly assessed before fabrication:
    by gate-level leakage simulation, fault-injection simulation, formal proofs and
    equivalence checking. The results of these assessments are routinely copied into
    reports, slide decks and certification packages with no binding to the design
    that was assessed, the stimulus that was used, the conditions under which the
    numbers hold, or the platform that produced them. This document defines an Entity
    Attestation Token (EAT) profile for carrying such pre-silicon assessment results
    as signed Evidence. Every claim is classified as identifying the assessed artifact,
    describing a measured behavior, or describing the measurement conditions. A provenance
    claim, which states whether the signing key is rooted in hardware or software,
    is mandatory, and a simulated Trusted Platform Module is always reported as a
    software root. The profile is explicitly not a certification format: it records
    what was measured and under which envelope, so that a Relying Party can decide
    what the numbers are evidence of.</p>"

abstract:
- content: "<p>The DNS-SD Data Block (DDB) is a compact, Type-Length-Value (TLV) encoded
    container for conveying DNS-Based Service Discovery (DNS-SD) service information
    over non-IP transports used by short-range peer- to-peer or proximity-based advertisement
    and discovery technologies, such as the Bluetooth Low Energy Transport Discovery
    Service or Near Field Communication (NFC) Verb NFC Data Exchange Format (NDEF)
    records.</p>"

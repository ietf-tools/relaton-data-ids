abstract:
- content: "<p>This document defines how Transport Layer Security (TLS) 1.3 is used
    as a key-management method for the SCTP DTLS Chunk mechanism. It specifies how
    a TLS handshake establishes the initial security context for an SCTP association
    and how subsequent TLS handshakes provide key updates and re-authentication. The
    goal is to enable authenticated and confidential communication over SCTP using
    the DTLS Chunk, leveraging standardized TLS 1.3 features for key management and
    rekeying.</p>"

abstract:
- content: <p>This document provides a mechanism for synchronizing and negotiating
    quantum keys by carrying quantum key information through IPv6 extension headers.
    The communicating parties select the corresponding encryption and decryption keys
    from the quantum key library based on the negotiation results, thereby achieving
    quantum-encrypted communication over IPv6 network. Internet-Drafts are draft documents
    valid for a maximum of six months and may be updated, replaced, or obsoleted by
    other documents at any time. It is inappropriate to use Internet-Drafts as reference
    material or to cite them other than as "work in progress."</p>

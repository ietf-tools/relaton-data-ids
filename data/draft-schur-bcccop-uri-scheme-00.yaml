abstract:
- content: <p>This document registers the "⚮" (U+26AE, DIVORCE SYMBOL) Uniform Resource
    Identifier (URI) scheme for the Biometric-First Communication Protocol (BCCCOP).
    The scheme enables privacy-first, biometric-anchored addressing of resources and
    invocation of peer-to- peer operations across ultrasonic, BLE, and Wi-Fi transports.
    This document follows the URI scheme registration guidelines of RFC 7595.</p>

- content: "<p>This document adds Private Use ranges to IANA registries that pertain
    to the Lightweight Authenticated Key Exchange (LAKE) protocol. Discussion Venues
    This note is to be removed before publishing as an RFC. Discussion of this document
    takes place on the Lightweight Authenticated Key Exchange Working Group mailing
    list (lake@ietf.org), which is archived at https://mailarchive.ietf.org/arch/browse/lake/.
    Source for this draft and an issue tracker can be found at https://gitlab.com/crimson84/draft-tiloca-lake-private-use-ranges.</p>"

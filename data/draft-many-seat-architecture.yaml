abstract:
- content: "<p>This document defines an architectural framework for composing Remote
    ATtestation procedureS (RATS) with Secure Evidence and Attestation Transport (SEAT).
    The document establishes normalized terminology for SEAT, aligns RATS roles to
    transport endpoints, outlines topological patterns for attestation delivery timing,
    characterizes the abstract cryptographic pattern by which Evidence is bound to
    a given transport connection.</p>"

abstract:
- content: "<p>Deploying BGP route policies in live production networks carries significant
    operational risks, often resulting in unintended route leaks, suboptimal routing
    paths, or blackholes. This document proposes an extension to the BGP Monitoring
    Protocol (BMP) that enables a BGP speaker to pre-view and dry-run a candidate
    route policy within a localized control-plane sandbox. The resulting post- policy
    route changes (deltas) are streamed asynchronously to a centralized controller
    via a new BMP message type. This architecture allows the controller to verify
    policy alignment with network intents, subsequently triggering either an explicit
    commit or a rollback before any forwarding plane changes take effect.</p>"

abstract:
- content: "<p>This document specifies a temporal-evidence admission protocol with
    a fixed 180-octet Proof-of-Time Record v2. It defines issuer authentication, holder
    presentation, context binding, asymmetric freshness checks, and replay-safe application
    commitment. Implementations can place verification at a declared application boundary
    and can accelerate suitable operations in a kernel, NIC, or FPGA without changing
    those requirements. An authenticated context identifies the event, policy, source
    evidence, and selected binding revision. A Roughtime adapter combines response-chain
    validation with authority-backed provenance and effective-source aggregation.
    Other clock adapters retain their own evidence contracts. Confidence and propagation-aware
    profiles are optional and cannot repair a failed core check. The core mandatory
    integrity algorithm is SHA-256. Optional recovery algorithms require separate
    complete specifications. The protocol does not establish physical truth, agent
    intent, legal admissibility, or regulatory compliance, and does not replace clock
    synchronization, authorization, auditing, or transparency services.</p>"

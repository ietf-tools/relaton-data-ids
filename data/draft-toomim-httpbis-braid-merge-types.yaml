abstract:
- content: "<p>Merge Types specify how to merge parallel edits to a resource. Parallel
    edits happen when two peers edit the same state over a network with latency. A
    Merge Type specifies how to merge conflicting changes. If the peers implement
    and agree upon the same Merge Type, then they will reach a consistent state eventually,
    whatever edits they make. This document defines Merge Types, the structure of
    the Merge Type system, the Merge-Type header, and IANA registration procedures
    for Merge Types. Other specifications can define more Merge Types, in the registry
    that this document creates. This document is one of the Braid-HTTP extensions,
    which work alone or together; together they make HTTP a state synchronization
    protocol.</p>"

abstract:
- content: "<p>Web Bot Auth uses HTTP Message Signatures to let automated HTTP clients
    authenticate their identity to origins via the Signature- Agent header field.
    When a multi-tenant agent platform signs outbound requests with a shared key,
    all customer workloads on that platform share a single cryptographic identity.
    Abusive traffic from one tenant or workload can degrade the reputation of the
    entire platform and cause origins to block legitimate tenants. This document defines
    the Signed-Agent-Metadata HTTP header field, an RFC 9651 Dictionary that carries
    optional, pseudonymous per-request metadata (product, project, and session). By
    signing Signed-Agent- Metadata inside the Web Bot Auth signature, a platform enables
    verifiers to evaluate traffic, apply rate limits, and isolate reputation at a
    narrower scope than the signing origin.</p>"

abstract:
- content: "<p>Interoperability between network-management systems is customarily
    arranged by agreeing a shared data model in advance or, where that falls short,
    a richer shared information model or ontology; both still require broad prior
    agreement on a common model. This document, a companion to and enhancement of
    draft-janz-nmrg-ontology- reconciliation, argues that for systems built as cognitive,
    language- capable agents the shared reference can instead be a thin reference
    lexicon: a consultable nomenclature of named entities with disambiguating definitions
    and examples, free of relationship axioms and attribute schemas, and typically
    derived from an existing model. Each agent brings the lexicon apt to it; the two
    are lexically aligned into cross-source correspondences; identity is settled wherever
    they correspond; and only the residual is reconciled by the conversation of the
    companion document. The document develops what such a lexicon should contain,
    the two-stage alignment that relates lexicons across sources, the distinct problem
    of co-referencing specific instances, and the scaling that follows from anchoring
    translation on shared references; and it recommends how model authors can make
    their artefacts more amenable to this automated alignment.</p>"

abstract:
- content: <p>This document proposes an experimental, evidence-bound governance profile
    for research workflows involving artificial intelligence (AI) systems. It specifies
    procedural invariants governing claims, evidence, provenance, authority, disagreement,
    independent replication, and research release decisions. It distinguishes observable
    AI value expression from computational architecture and from unverified assertions
    of subjective consciousness. The term "constitutional law" denotes a voluntary
    set of research-governance constraints, not positive law, a legally enforceable
    constitution, an IETF policy, or a scientific theory proved by this document.
    This proposal neither modifies existing Internet protocols nor establishes AI
    consciousness.</p>

abstract:
- content: "<p>Many systems emit individually signed records — receipts, attestations,
    statements — and store them locally. Each record verifies on its own, but the
    collection proves nothing: records can be deleted, reordered, or created after
    the fact without detection. This document specifies the Checkpointed Local Log
    (CLL): a producer- operated append-only log that is a Merkle Mountain Range as
    defined by the COSE Receipts profile for Merkle Mountain Ranges, together with
    a small signed checkpoint that commits to the log's entire history. A checkpoint
    carries the content of that profile's Receipt of consistency — the accumulator
    and the consistency proof — inside a SCITT Signed Statement, so it can be registered
    with one or more independent Transparency Services without any change to them.
    A CLL upgrades a set of point receipts into a stream with provable order, contemporaneity,
    and completeness, and states precisely what it does not establish. It defines
    no new proof format, no change to SCITT Registration or Receipts, and no payload
    semantics.</p>"

abstract:
- content: "<p>This document defines custody transfer for Bundle Protocol Version
    7. A Custody Transfer Extension Block is defined to request custody transfer of
    a bundle, and a Compressed Custody Signal in the form of an administrative record
    is used to report acceptance or rejection for multiple bundles.</p>"

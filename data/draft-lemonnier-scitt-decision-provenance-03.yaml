abstract:
- content: "<p>Build attestations, bills of materials and Signed Statements in a Transparency
    Service record what was built and by whom. Authorization receipts for agent actions
    can establish who approved an exact action; the statement profiles for agent actions
    record a human approval as the producer's claim. The release and agent action
    examples in this document use the Decision Provenance Standard to supply a separately
    verifiable decision record and an attachment for the approved action. The cited
    records and receipts supply evidence about the build, the action or its authorization,
    according to their respective profiles. This document describes how a decision
    record and its action-binding attachment, as the extension proposals of the Decision
    Provenance Standard define them, sit under a release statement, a build attestation
    or an agent action record by typed digest references; how a verifier checks them
    offline, including the approver's signature where one is carried; and how the
    witness checkpoints of the anchoring extension are registered in a Transparency
    Service. For a relying party reviewing one occurrence, it specifies which authenticated
    inputs to compare and how to report missing evidence about presentation, authority
    and the observed effect. A software release decision and an agent action capsule
    are the worked examples; the model has no feature specific to either. This document
    is independent of the Decision Provenance Standard, is not part of it, does not
    change it, and is not endorsed by its Steward.</p>"

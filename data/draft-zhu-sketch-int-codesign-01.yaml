abstract:
- content: "<p>Network measurement supports management applications that need statistics
    about both large and small flows. Sketch-based techniques use compact data structures
    and are effective for large flows, but hash collisions can produce substantial
    relative errors for small flows. In-band Network Telemetry (INT) can provide detailed
    observations for individual packets, but applying it to every packet can consume
    significant packet, bandwidth, and collector resources. This document describes
    a framework that uses sketches for large flows and INT for small flows. It also
    describes measurement-point selection when exact routing information is unavailable
    and congestion-aware collection of sketch and INT reports. The document identifies
    the information needed to describe and compare implementations. It does not define
    a new packet format, INT instruction, sketch algorithm, or routing protocol. As
    a concrete applicability direction, the document considers time- variant non-terrestrial
    networks (NTNs), in which paths and available forwarding resources can change
    over time. It maps the existing Sketch-INT framework to this scenario and identifies
    the assumptions that require validation. It does not claim that the existing terrestrial
    implementation has been deployed or evaluated on satellite hardware.</p>"

abstract:
- content: "<p>This document describes use cases and applicability for Discovery of
    Agents With Names (DAWN). It illustrates how clients discover AI resources and
    obtain the minimum information needed for subsequent interaction within a local
    network, within an organisation, or between cooperating organisations with trust
    relationships. This document does not define a discovery protocol, a registration
    procedure, a selection algorithm, or an agent-to-agent communication protocol.</p>"

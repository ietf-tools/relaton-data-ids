abstract:
- content: "<p>This document defines the Session Identifier Option (SIO), carried
    as a TCP option for TCP connections and as a UDP option for UDP datagrams. The
    option lets the endpoints of a connection or flow publish identifiers at the transport
    layer, where network functions on the path - load balancers, NAT gateways, firewalls
    - can read them without per-flow state and without payload inspection. Network
    functions of all kinds can benefit from it: session recovery in load- balancing
    and NAT clusters, stateless forwarding, connection-tracking recovery, and telemetry.
    The option adds only a few octets, and only to the packets that carry it; which
    packets carry it is a deployment choice. Endpoints that do not support it behave
    as if the option did not exist.</p>"

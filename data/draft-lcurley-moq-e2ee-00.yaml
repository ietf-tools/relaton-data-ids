abstract:
- content: "<p>This document specifies moq-e2ee-00, a versioned profile for end-to-
    end encryption of MoQ application payloads. Authorized publishers and subscribers
    share a 32-byte broadcast secret out of band. Each publisher instance mints an
    epoch and publishes under an opaque broadcast path ending in it. HKDF-SHA-256
    derives opaque physical track names and per-track AES-128-GCM keys from the secret
    and the epoch; grouped frames and datagrams use separate key domains. Media frames
    and datagrams carry only ciphertext plus a 16-byte tag. The profile binds object
    identity through derivation and the nonce, not an on-wire header.</p>"

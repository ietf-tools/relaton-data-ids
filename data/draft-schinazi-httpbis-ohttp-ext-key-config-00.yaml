abstract:
- content: "<p>Oblivious HTTP is a protocol for forwarding encrypted HTTP messages.
    This requires communicating the gateway's key configuration to clients. While
    a key configuration media type was defined for this purpose, it has some limitations
    such as the inability to convey key lifetimes and interoperability issues. This
    document defines a similar extensible key configuration format that addresses
    those issues.</p>"

abstract:
- content: "<p>Multicast transmissions on Wi-Fi links are known to be unreliable,
    making the propagation of critical network configuration changes via multicast
    Router Advertisements (RAs) prone to failure or severe delay. Existing approaches
    to improve reliability, such as sending multiple unsolicited multicast RAs, require
    fine-tuning timers and packet counts that may not fit all deployment scenarios.
    This document updates RFC 4861 by introducing an optimization: when a router detects
    a configuration change that must be propagated to hosts, it sends unicast Router
    Advertisements to every client recently observed on that interface.</p>"

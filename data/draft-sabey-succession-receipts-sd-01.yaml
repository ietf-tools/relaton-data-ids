abstract:
- content: "<p>A Succession Receipt proves one completed, policy-gated transfer of
    authority between autonomous agents, and it is all-or-nothing: whoever holds the
    receipt holds every claim and every evidence event in it. In regulated deployments
    the parties entitled to verify a transfer are not all entitled to read it in full
    — a regulator, a counterparty, and the public each warrant a different view. This
    document specifies a selective-disclosure form of the receipt: the issuer signs
    salted commitments to each claim unit and each evidence event, disclosures travel
    outside the signature, and a projection — the signed envelope plus any subset
    of the disclosures — still verifies against the one issuer signature. Withholding
    never breaks the proof, disclosing never re-signs, withheld content remains visibly
    committed, and a projection that opens every commitment is verifiable to exactly
    the strength of the underlying receipt. The disclosure mechanism deliberately
    follows the salted-digest analysis of SD-JWT, restated for plain-JSON documents
    canonicalized with the JSON Canonicalization Scheme.</p>"

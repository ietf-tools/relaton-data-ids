abstract:
- content: <p>This document defines the "sustainability-data" well-known URI, at which
    a web origin publishes a single JSON document declaring the energy consumption,
    carbon footprint, and related environmental metrics of a reporting subject, typically
    the origin itself. The declaration is described by formal schemas and located
    at a fixed path, so that it can be retrieved, validated, and ingested automatically.
    It carries an optional embedded signature, may reference the declarations of upstream
    providers from which its figures derive, links to a methodology, and may link
    to third-party attestations. The metrics are self-asserted claims of the publisher.
    This document registers the well-known URI and the media type application/sustainability-data+json.</p>

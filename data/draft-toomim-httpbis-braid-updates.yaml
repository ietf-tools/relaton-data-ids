abstract:
- content: "<p>HTTP provides a suite of requests and responses for communicating changes
    to resource state, but they are limited in symmetry and reproducibility. PATCH
    is sent client-to-server, but a server cannot send a PATCH to a client. POST can
    change server state flexibly, but its behavior is server-defined, and cannot be
    reproduced by a naive server, client, or intermediary. This document extends ordinary
    HTTP requests and responses into a suite of symmetric, reproducible *updates*.
    A sequence of updates can be replayed on any client, server, or intermediary to
    reproduce identical changes to state. There are three types of updates: snapshots,
    patches, and deletions, and this document defines how they occur symmetrically
    in both requests and responses. Arbitrary patch formats can be defined with a
    new Patch-Type header, but most patches can be expressed as a replacement of a
    range expressed via an extended syntax of Range Unit. This document is one of
    the Braid-HTTP extensions, which work alone or together; together they make HTTP
    a state synchronization protocol.</p>"

abstract:
- content: "<p>The Lightweight Authenticated Key Exchange (LAKE) protocol supports
    methods with different numbers of messages and different security properties.
    The methods defined in the original specification, RFC 9528, consist of three
    mandatory messages and an optional fourth message. This document defines a generic
    mechanism for additional protected messages, message_n, where n is greater than
    the highest message number defined for the method in use. The format of each message_n
    is identical to that of message_4 in RFC 9528, except that its encryption key
    and initialization vector are derived using the LAKE_Exporter. This mechanism
    allows applications to include any number of additional protected messages in
    a LAKE session, for example, to carry additional External Authorization Data (EAD)
    and to convey protected success indications when required by a method or deployment,
    such as EAP-LAKE. This document updates RFC 9528.</p>"

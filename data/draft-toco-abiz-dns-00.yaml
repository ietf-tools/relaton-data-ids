abstract:
- content: <p>This document specifies use of the underscored DNS node name "_abiz"
    with TXT resource records to publish a pointer from a domain to a signed public
    business record served over HTTPS. It describes discovery and verification of
    that record and requests registration of the "_abiz" node name and the "abiz.json"
    well-known URI suffix.</p>

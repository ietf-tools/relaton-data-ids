abstract:
- content: "<p>This document defines an experimental Conversation-ID email header
    field. Participating originators can use it to associate messages with a conversation,
    alongside Message-ID, In-Reply-To, and References. The identifier is independent
    of any one message's Message-ID. Its usefulness depends on originators copying
    it into new messages and intermediaries preserving it during transport. The field
    is an untrusted grouping hint and provides no authentication or authorization.
    This document specifies its syntax and processing rules and describes an experiment
    to compare it with existing correlation methods.</p>"

abstract:
- content: "<p>This document defines EAP-PQPAKE, an Extensible Authentication Protocol
    (EAP) method that uses a hybrid post-quantum password- authenticated key exchange.
    The method is based on the CPaceOQUAKE+ asymmetric PAKE and provides mutual authentication
    and EAP key export from a password without requiring public-key certificates during
    normal authentication.</p>"

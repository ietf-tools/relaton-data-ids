abstract:
- content: "<p>This document defines a YANG data model for diagnosis-specific assessment
    records associated with network incidents. The model augments the network incident
    model with a history of diagnostic assessments that relate evidence to probable-cause
    hypotheses, record inconclusive or blocked diagnostic outcomes, and capture post-
    remediation verification observations. The model complements rather than replaces
    generic task interfaces. Generic task lifecycle, planning, confirmation, execution,
    and task- notification mechanisms are not redefined.</p>"

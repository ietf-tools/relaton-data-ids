abstract:
- content: <p>This document specifies procedures for variations of the "Bootstrapping
    Remote Secure Key Infrastructure" (BRSKI) series of protocols to automatically
    announce, discover and select responders using different discovery mechanisms
    such as DNS-SD, GRASP or CORE- LF. Different variations are not interoperable
    so initiators need to be able to find responders supporting the variation(s) they
    support. Procedures for BRSKI proxies are defined that allow proxying of traffic
    for any current and future variation. Procedures to discover BRSKI Pledges by
    their identifier are defined. All procedures are defined such that they rely on
    IANA defined tables through which not only well specified but also possible but
    not yet validated variations of BRSKI or additional discovery mechanisms can be
    supported simply by adding entries to the IANA tables. Many of the procedures
    and mechanisms covered by this document may equally be applied to discovery of
    other protocols, especially when they have non-interoperable variations.</p>
  language:
  - en

abstract:
- content: "<p>This document specifies the Sovereign Validation Protocol (SOVP), a
    protocol for cryptographic verification of publisher-provided identity metadata
    bound to DNS-anchored Ed25519 public keys. SOVP enables consuming agents, gateways,
    and federated infrastructure components to verify the origin and integrity of
    machine-readable declarations published by a domain prior to ingestion, allowing
    deployments to reject unauthenticated data before application-level processing
    occurs. SOVP is designed to operate as a verification layer beneath existing trust
    frameworks, federation architectures, and governance systems. It does not replace
    these systems. It provides the cryptographic infrastructure evidence upon which
    higher-layer trust decisions may be grounded. SOVP defines a deterministic verification
    procedure based on RFC 8785 JSON Canonicalization Scheme (JCS), Ed25519 signatures,
    DNS-based key publication, and optional HTTP transport mechanisms. The protocol
    defines data structures, cryptographic procedures, operational modes, and associated
    DNS and HTTP mechanisms. The reference implementation provides signing and verification
    primitives, DNS TXT resolution, and HTTP retrieval of identity documents. Full
    gateway enforcement behavior is implementation- defined.</p>"

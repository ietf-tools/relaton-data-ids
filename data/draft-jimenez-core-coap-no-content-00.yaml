abstract:
- content: "<p>This document defines the 2.06 (No Content) response code for the Constrained
    Application Protocol (CoAP). The code indicates that the target resource exists
    but has no current representation to transfer. It allows a client to retrieve
    or observe a resource before that resource has any content, without the server
    signaling an error. This document updates RFC 7641 to allow 2.06 (No Content)
    notifications, and specifies how cross-proxies map the code to and from the HTTP
    204 (No Content) status code.</p>"

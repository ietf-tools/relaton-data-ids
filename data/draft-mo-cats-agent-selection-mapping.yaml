abstract:
- content: "<p>The Computing-Aware Traffic Steering (CATS) framework selects a service
    contact instance for a service request by combining computing and network metrics
    that are distributed by CATS Service Metric Agents and CATS Network Metric Agents.
    For AI agent services, the request that arrives at the network is not a single
    unit of work: it is a session that expands into multiple steps, each of which
    may require a different capability, a different state, and a different path. This
    document describes a mapping framework that turns the characteristics of an agent
    step into (1) a set of hard constraints and (2) a per-dimension valuation over
    a three-dimensional resource view composed of forwarding, computing, and storage,
    and that feeds the resulting suitability of each candidate service contact instance
    into the existing CATS selection function. The framework introduces no new functional
    component.</p>"

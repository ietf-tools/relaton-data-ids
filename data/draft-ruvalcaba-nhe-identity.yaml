abstract:
- content: "<p>This document specifies how a Non-Human Entity (NHE) is identified
    and how one party verifies another's identity. An NHE identity is a verifiable
    cryptographic commitment: control of an identity key, bound by an append-only
    hash chain to the entity's genesis and to the lineage of its configuration, rather
    than a mere name. The document defines the identity chain data model (record structure,
    genesis sentinel, linkage rule, and the no-fork property), a proof-of-control
    challenge/response, an optional capability attestation that reveals a specific
    capability without revealing the rest of the configuration, and an optional hardware-rooted
    genesis-attestation profile. The data model is specified here; the concrete on-the-wire
    encoding is deferred to the next revision.</p>"

abstract:
- content: "<p>The Identifier Locator Network Protocol (ILNP) for IPv6 is described
    in Experimental RFCs 6740-6744. ILNP uses a different architecture to IPv6 but
    is implemented to work with IPv6. This document describes how unmodified IPv6
    applications running on an ILNP-capable node can make use of ILNP. This document
    updates RFC6740, RFC6741, RFC6748.</p>"

abstract:
- content: "<p>This document specifies Proof of Stateful Integrity (PSI), a format
    and procedure for issuing signed receipts over digital records. A PSI receipt
    binds the SHA-256 digest of a canonical JSON record to an issuer signature, a
    monotonic sequence number, and a Merkle tree root computed with the RFC 6962 hashing
    profile, and may reference an external timestamp anchor. Any party holding the
    record, the receipt, and the issuer public key can verify the receipt offline.
    PSI provides evidence of integrity, origin, and ordering only. It does not establish
    that a record is true, lawful, safe, or compliant with any regulation. This revision
    replaces revision 01. It withdraws all claims of zero- knowledge proofs, multi-party
    computation, and inclusion proofs, which the reference implementation does not
    provide.</p>"

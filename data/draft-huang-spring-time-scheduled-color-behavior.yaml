abstract:
- content: "<p>This document specifies the normative behavior of the ingress Provider
    Edge (PE) router (headend) when selecting a Segment Routing (SR) Policy for VPN
    traffic based on time-scheduled Color values. In the time-scheduled Color mechanism,
    the egress PE advertises multiple (Color, Schedule) groups for the same VPN routes.
    The headend evaluates the schedule associated with each Color based on the current
    time, selects a currently valid Color, and steers the traffic into the corresponding
    SR Policy. This document defines the requirements for parsing the Color and Schedule
    Extended Communities, evaluating schedule validity, selecting among multiple valid
    Colors, performing schedule-boundary timer-based re-evaluation, handling switchover
    with make-before- break, and falling back when no Color is valid. This document
    updates RFC 9256 by replacing the multiple-Color selection rule specified in Section
    8.4.1 with a Schedule-based selection rule.</p>"

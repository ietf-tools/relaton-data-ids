abstract:
- content: "<p>This document defines MARS (Machine-Adversary Resistance), an open
    rating, from 0 to 5, of how well a defended asset resists an autonomous artificial-intelligence
    adversary: an attacker that performs reconnaissance, exploitation, adaptation
    and propagation at machine speed and scale with no human in the loop. MARS is
    not a control catalogue and not a maturity model. It is a resistance rating, scored
    on five axes that describe adversary capabilities -- the ability to Learn a surface,
    Reuse a success, Scale by automation, Outpace a defence, and sPread from a foothold
    -- plus a requirement for tamper-evident, independently verifiable evidence at
    the highest levels. Because the axes are defined as adversary capabilities rather
    than specific technologies, MARS applies to any asset an AI can attack. This document
    specifies the threat model, the five axes, the rating scale, the assessment tiers,
    the assessment method, the evidence requirement, and a profile mechanism by which
    the invariant rubric is interpreted for any deployment substrate.</p>"

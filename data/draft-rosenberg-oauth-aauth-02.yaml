abstract:
- content: "<p>AI Agents are increasingly accessing web resources on behalf of the
    users they serve. Traditionally these agents are granted normal OAuth access tokens
    through existing OAuth grant flows. However, these flows were designed in the
    era of traditional software, and when applied to AI Agents, multiple problems
    have arisen. This document outlines some of the problems, and then proposes a
    simple OAuth2.1 extension that enables AI Agents to obtain access tokens at time
    of resource access using Human-In-the-Loop or other approval flows. We call this
    the Agent Authorization Grant (aauth) grant flow. This document also compares
    the proposed solution with another, non-backwards compatible aauth solution.</p>"

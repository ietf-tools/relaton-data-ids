abstract:
- content: '<p>Autonomous software agents increasingly take consequential actions
    on behalf of people and organizations. Existing identity systems (OAuth 2.0, SPIFFE,
    and the WIMSE workload identity architecture) authenticate such agents, but they
    do not define a common, vendor- neutral way for an accountable owner to place
    a running agent into a restricted state, nor a common way for a relying party
    to check that state immediately before acting. This document defines AIID: a durable
    identifier for an autonomous agent, a small runtime control state machine (active,
    safe_mode, suspended, revoked), an asymmetric authority model in which automated
    monitors may only tighten state and only the accountable owner may loosen it,
    a namespace-wide freeze, and a pre-action status check with fail-closed semantics.
    AIID is designed to bind to, not replace, existing identity: it defines an "aiid"
    claim for OAuth 2.0 access tokens and corresponding token introspection members,
    bindings for SPIFFE and WIMSE identifiers, a mapping onto the OAuth Token Status
    List, and change notification using the OpenID Shared Signals Framework. It also
    defines compact signed action receipts, and an OPTIONAL enforcement gateway deployment
    profile.</p>'

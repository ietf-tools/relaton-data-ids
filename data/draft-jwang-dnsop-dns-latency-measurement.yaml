abstract:
- content: "<p>DNS resolution latency is widely used as an operational metric for
    evaluating recursive resolvers, authoritative servers, and DNS infrastructure.
    However, current implementations employ different definitions, measurement scopes,
    and testing methodologies, making latency results difficult to compare across
    deployments. This document identifies common sources of inconsistency, proposes
    a conceptual latency decomposition model, and provides measurement considerations
    intended to improve comparability of DNS latency measurements. This document does
    not define protocol behavior nor introduce new protocol mechanisms.</p>"

abstract:
- content: "<p>While DDS (Distributed Data Service) protocol, managed by Object Management
    Group (OMG), for ROS (Robot Operating System) 2 is intended to provide a universal
    communication layer, interoperability across different DDS middleware implementations
    is not always consistent. Variations in transport protocol usage (e.g., TCP/IP,
    UDP, shared memory) can hinder direct data exchange, and cross-domain communication
    efficiency is generally lower compared to protocols such as HTTP. Therefore, to
    resolve limitations of DDS in ROS2, this draft considers a couple of standards
    protocols, QUIC of IETF and MQTT (Message Queuing Telemetry Transport), managed
    by OASIS Open.</p>"

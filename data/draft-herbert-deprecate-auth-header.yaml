abstract:
- content: <p>IP Authentication Header (AH) and IP Payload Compression Protocol (IPCOMP)
    of the IPsec suite have been deprecated and RFC 3173 and RFC 4302 have been moved
    to Historic status. This document further updates the IANA IKEv2 Security Protocol
    Identifiers by adding a "Status" column where the deprecation status can be listed.
    This document also closes the IKEv2 Notification IPCOMP Transform IDs registry.</p>

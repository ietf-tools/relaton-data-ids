abstract:
- content: "<p>This document defines few generic BGP Monitoring Protocol (BMP) statistics
    for monitoring route modifications or changes due to applying Routing Policy.
    These statistics are reported per BGP peer using the BMP Statistics Report message.
    This revision (-02) firms up the specification for working group consideration:
    it adds a Relationship to Other Work section that explicitly maps this document
    to concurrently circulating GROW contributions on BMP statistics and policy-driven
    telemetry and invites coordination with their authors, adds a worked example,
    and strengthens Security Considerations. No statistics semantics, Stat Type allocations,
    or wire formats defined in -01 are changed.</p>"

abstract:
- content: "<p>This document specifies an interaction gateway for Network Knowledge
    Graphs (NKGs) to simplify graph-based network operations. The gateway architecture
    defines a Unified Intent Gateway (UIG) that supports Natural Language (NL) requests
    from human operators and Domain-Specific Language (DSL) or API directives from
    applications and orchestration systems. The UIG interprets user expectations and
    application directives as structured intents, aligns them with the NKG structure
    and exposed capabilities, and maps them to graph queries, graph inferences, API
    calls, or operational workflows through an Intermediate Representation (IR). The
    gateway architecture incorporates intent discovery, capability mapping, policy
    enforcement, audit logging, and response synthesis to make NKG-based operations
    more accessible, secure, and controllable.</p>"

abstract:
- content: "<p>This memo specifies a message envelope, a recipient-scope grammar and
    a subscribe-filter grammar for delivering short structured messages to the concurrent
    sessions of one identity. A sender names a set of recipients by identity shape,
    such as all sessions of one handle or all sessions whose instrument identifier
    has a given prefix, and a delivery server expands that set against live subscriptions
    at delivery time. Frames are emitted over a per-handle Server-Sent Events stream.
    The envelope carries a kind discriminator whose set of values is open. The memo
    defines three kinds, and other documents may define more. The memo specifies the
    wire elements only; frame retention is out of scope.</p>"

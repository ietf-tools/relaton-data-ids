abstract:
- content: "<p>fmsg is a message exchange protocol between domain defined hosts. Messages
    are binary encoded and form threads which require participation to reply to. This
    document describes the motivation and architecture of fmsg, an existing protocol
    specification and implementation are referenced, but the full specification is
    not included here. The purpose of this document is to solicit IETF feedback on
    venue and scope before/if the specification can develop into standards-track documents.</p>"

abstract:
- content: "<p>Many network applications, ranging from Artificial Intelligence (AI)
    / Machine Learning (ML) training and inference to large-scale cloud services,
    require networks with various combinations of high bandwidth, low delay, low jitter,
    and minimal packet loss. Meeting these requirements depends on the network's ability
    to adapt rapidly to faults, signal degradation, and congestion. The companion
    problem statement describes why existing mechanisms are too slow, too coarse,
    or too resource-intensive to react within the timescales at which modern forwarding
    hardware can detect and disseminate intended conditions. This document defines
    a framework for Fast Network Notifications (FANN). It describes a reference architecture,
    the functional roles involved in generating and consuming notifications, an information
    model, delivery and scoping models, procedures for discovery, registration, and
    subscription, and the integration of fast network notifications with existing
    Layer 2 to 4 mechanisms. This framework is intended to guide the development of
    one or more fast network notification protocol specifications.</p>"

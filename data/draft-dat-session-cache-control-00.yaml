abstract:
- content: <p>This document defines a new HTTP Cache-Control response directive, "session",
    which specifies that a response may be cached only for the lifetime of the user
    agent's current browsing context. The directive enables ephemeral, non-persistent,
    and non-shared caching behavior suitable for modern web applications. The "session"
    directive is backward compatible with existing HTTP caches and is ignored by implementations
    that do not recognize it.</p>

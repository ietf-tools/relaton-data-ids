abstract:
- content: "<p>This document defines a content profile for AI output verification
    receipts. It specifies the minimum fields, the classification taxonomy and the
    evidentiary properties that a receipt MUST contain in order to constitute verifiable
    evidence that an AI-generated output was checked before a human or a downstream
    agent acted on it. The profile is designed to be carried over any conformant wire
    format, including ACTA signed receipts, SCITT transparency logs, and standalone
    JSON or CBOR payloads. Existing Internet-Drafts in this space define wire formats
    for signing, transmitting and storing AI agent receipts, or records of what an
    agent did. None defines what a verification receipt must contain at the content
    layer: which claims in an output were checked and how each was classified. This
    document fills that gap. It introduces a mandatory fourteen-category failure taxonomy
    (the Information Bottleneck Species), a verdict schema, and evidentiary field
    requirements informed by the EU AI Act (Regulation (EU) 2024/1689), the Product
    Liability Directive (Directive (EU) 2024/2853) and the IDW PS 861 audit standard.
    We invite implementers to adopt, populate and grow the AI output verification
    market segment. The category exists. The specification is here. Build to it.</p>"

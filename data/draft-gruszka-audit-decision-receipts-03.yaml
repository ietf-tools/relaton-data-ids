abstract:
- content: "<p>The architecture for auditing agent delegation and interactions proposed
    for the AUDIT effort names Interaction Records, Action Records and Authorization
    Transition Records, and leaves their encoding open. This document shows how an
    existing signed record, the decision receipt of the open-source proofbundle project,
    together with its companion outcome receipt, gives three such records exact bytes,
    a signature and digest bindings that a third party can check offline. The three
    cases are a human approval, a declined action and an executed action with its
    result. For each case the document maps the receipt members onto the record types
    of the architecture, states what the receipt adds and what it does not show, and
    gives an offline verification procedure. It states one requirement for approvals,
    that an approval is honoured at most once, also after the record of consumed approvals
    is rotated. Test vectors for all three cases, each with a counterexample, are
    included. The document also describes, informatively, how a receipt can be registered
    with a Transparency Service under RFC 9943 and what a SCITT Receipt then shows
    and does not show. This document defines no new format, predicate or registry.</p>"

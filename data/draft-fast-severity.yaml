abstract:
- content: "<p>This document specifies the Framework for Autonomous Severity and Triage
    (FAST): an empirical standard for how autonomous offensive security agents classify
    vulnerabilities, decide whether to submit reports, and write those reports. FAST
    is derived from a corpus of real bug bounty reports and their program-rendered
    triage outcomes rather than from theoretical scoring frameworks. It is designed
    to be applied by both offensive agents that hunt for vulnerabilities and by defensive
    agents or human triagers that render verdicts, so both sides of the reporting
    relationship operate under the same rulebook. This document is submitted as an
    Independent Submission and invites comment from researchers, triagers, bug bounty
    platforms, and security teams.</p>"

abstract:
- content: "<p>Autonomous machines such as uncrewed aircraft, ground robots, and spacecraft
    execute commands issued by human operators and, increasingly, by AI agents. When
    an incident occurs, no independent evidence exists of which commands the machine
    received: conventional logs are mutable by the operating party, symmetric message
    authentication codes cannot demonstrate origin to a third party, and records signed
    with elliptic-curve cryptography lose their evidentiary value once cryptographically
    relevant quantum computers exist. This document defines the Anchor: a post-quantum
    digital signature over a compact commitment to a window of authenticated machine
    traffic. An anchor chain constitutes a tamper-evident, non- repudiable record
    of what a machine was commanded to do and what it reported back, verifiable by
    any third party without trusting the operator, without network access at recording
    time, and with security that survives the quantum transition. The construction
    is protocol- agnostic and is designed for bandwidth-constrained links where per-
    message post-quantum signatures are impractical.</p>"

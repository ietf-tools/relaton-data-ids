abstract:
- content: <p>The term "machine readable" is widely invoked when content usage preferences,
    rights, and legal terms are expressed for automated consumption, but it is rarely
    defined with enough precision to be actionable. This document resolves the term
    into two core criteria, parseability and interpretability, which are properties
    of an expression itself, and three further dimensions (discoverability, actionability,
    and verifiability) which are orthogonal to the core criteria and to one another,
    concerning as they do the expression's place in a transaction rather than its
    content alone. Together these determine whether an expression of preferences or
    policy can be reliably acted upon by a non-human agent without human intervention.
    This document applies the framework to usage preferences and legal terms of service.</p>

abstract:
- content: "<p>This document defines Earmark (Embedded Attribution and Rights Marks),
    a mechanism by which publishers and rights holders embed signed usage preferences
    directly into published content. To earmark content is to reserve it for designated
    uses, and the mark travels with what it covers, surviving republication and aggregation,
    so the preference remains discoverable wherever the content arrives, including
    where perimeter signals such as robots.txt no longer apply. Marks carry the identity
    of the rights holder, the preferences asserted, and a signature, and are verifiable
    offline by any party. An individual signed statement is a Mark; the mechanism
    as a whole is Earmark. This document defines the Mark Object, embedding bindings
    for common content types, and the detection and verification procedure. It reuses
    the AI Preference vocabulary for preference semantics and the C2PA and CAWG assertion
    infrastructure for media, defining new machinery only where none exists. Earmarks
    make ignored preferences observable and attributable. Enforcement remains with
    law, contract, and the market.</p>"

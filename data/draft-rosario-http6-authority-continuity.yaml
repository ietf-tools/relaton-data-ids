abstract:
- content: "<p>A person can authorize an autonomous artificial intelligence (AI) agent
    to delegate a task that another organization completes. At the point of execution,
    the resource owner needs to know which authority survives delegation, which running
    instance is exercising it, and whether the requested effect has already occurred.
    This document proposes an architecture for carrying that evidence across administrative
    boundaries. An admission receipt records the human decision. Each child receives
    a grant, bounded by its parent's authority, that is tied to its own running instance.
    A state ledger coordinates revocation, shared allowances, and recovery. The resource
    enforces its own policy and returns evidence of the effect it committed. An initial
    profile uses existing HTTPS mechanisms. A two-domain demonstration defines how
    independent implementations can test these properties when a reply is lost or
    an older backup is restored.</p>"

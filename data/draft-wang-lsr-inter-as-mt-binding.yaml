abstract:
- content: "<p>[RFC5120] and [RFC4915] define Multi-Topology (MT) routing for IS-IS
    and OSPF, respectively. When a topology-specific path crosses an AS boundary,
    a topology in one AS may need to be connected to a topology identified by a different
    MT-ID in the adjacent AS. Existing inter-AS Traffic Engineering extensions do
    not advertise this relationship. This document defines extensions to IS-IS and
    OSPF to advertise the binding between local and remote MT-IDs associated with
    an inter-AS link.</p>"

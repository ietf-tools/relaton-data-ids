abstract:
- content: "<p>This document specifies the messaging functionality for MOCHA (MoQ
    Open Communication &amp; Hosting Architecture). It defines how participants send
    and receive messages in channels using MoQ Transport (MOQT) publish/subscribe
    primitives. Each device publishes messages on its own track within a channel namespace,
    enabling decentralized message production with relay-based fan-out. This specification
    covers message naming, format, causal ordering, delivery, roster management, and
    channel discovery for text-based chat.</p>"

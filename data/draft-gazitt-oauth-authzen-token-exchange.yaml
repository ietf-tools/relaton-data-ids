abstract:
- content: "<p>OAuth 2.0 Token Exchange (RFC 8693) defines the moment at which an
    authorization server decides whether one party may obtain a token to act as, or
    on behalf of, another. It states that the decision is governed by policy, and
    does not define that policy. The specifications layered on top of it - identity
    chaining, identity assertion authorization grants, and transaction tokens - inherit
    the same seam. This document binds those flows to the AuthZEN profile for OAuth
    2.0 token issuance. It specifies how a token exchange request is derived into
    AuthZEN evaluation requests, how the authority of the requesting party is expressed
    as a decision distinct from the authority being delegated, and what each of the
    token types layered on token exchange contributes to that mapping.</p>"

abstract:
- content: "<p>This document defines a digital credential format that uses JSON Web
    Proofs (JWP) as its container format and Blind BBS Signatures as its signature
    scheme combined with a modular framework for attaching zero-knowledge sub-proofs.
    This allows a Holder to reveal some attributes directly while proving predicates
    such as range or equality over the ones they keep hidden. A credential can additionally
    be bound to a Holder-held device key, with possession of the key proven in every
    presentation without revealing the public key or signature. Concrete sub-proof
    and device-binding constructions are not defined in this document, only the core
    serialization. The credential type definition and data model follow SD-JWT VC.</p>"

abstract:
- content: "<p>This document defines a YANG data model to report a Sensing Utilization
    Score (US) for sensing workloads. The US is an abstract, normalized score (0..100)
    that summarizes the relative resource cost of executing a sensing operation on
    a device. The model supports a mandatory overall US and optional explanatory component
    impact scores (compute, memory, energy, storage, latency). The model also supports
    optional metadata (e.g., timestamp, aggregation window, and scoring method identification)
    describing how a reported score was derived. The model includes a companion augmentation
    module that attaches sensing utilization telemetry to a GREEN Energy Object, as
    defined by the GREEN Power and Energy YANG Module, for correlation with power
    and energy telemetry.</p>"

abstract:
- content: "<p>This document compiles existing Cryptographic Asset Discovery and Inventory
    (CADI) methods and analyzes potential gaps. It also defines a YANG data model
    that augments the base network inventory model with the cryptographic assets of
    each network element. The data model is aligned with the Cryptography Bill of
    Materials (CBOM) defined in CycloneDX.</p>"

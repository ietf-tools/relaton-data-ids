abstract:
- content: '<p>This document defines mission_resource_access, a general-purpose OAuth
    2.0 Rich Authorization Requests (RAR) authorization_details type for Mission-Bound
    Authorization for OAuth 2.0 (the "issuance profile"). An entry names one resource,
    matched exactly or by path prefix; the actions permitted there, including wildcard
    action families; machine-actionable constraints, including a registered Common
    Constraints vocabulary; and a per-entry delegation policy. The document also defines
    how two entries compare and narrow, how a resource server enforces an entry, when
    an entry can be projected to OAuth scope, and how an authorization server declares
    its support for these semantics. The issuance profile is type-agnostic: a deployment
    can support this type, another authorization_details type, or both.</p>'

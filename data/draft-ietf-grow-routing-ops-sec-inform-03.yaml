abstract:
- content: "<p>The Border Gateway Protocol (BGP) is used for exchanging routing information
    between Autonomous Systems in the Internet. Due to its importance, it is necessary
    to ensure the basic security properties for BGP and BGP speaking routers. While
    the general principles for securing BGP operations are outlined in RFC 7454, that
    document does not detail the technical and implementation options for securing
    BGP. This document serves as a contemporary, non-exhaustive repository of options
    and methods for securing BGP. This document explicitly does not make value statements
    on the efficacy of individual techniques, nor does it mandate or prescribe the
    use of specific techniques or implementation details. Operators are advised to
    carefully consider whether the listed methods are applicable for their use-cases.
    Furthermore, the options listed in this document may change over time, and should
    not be used as a timeless ground-truth of applicable or sufficient methods.</p>"

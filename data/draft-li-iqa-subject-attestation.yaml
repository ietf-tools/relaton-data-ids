abstract:
- content: '<p>This document specifies the "iqa" URI scheme, a subject-attestation
    scheme in which an "iqa" URI names the attestation standing of an identified subject,
    as reported by one of three named authority organs; the URI carries no proof and
    no credential, and no lookup service or name-resolution system is consulted when
    the URI is used. The document also states the requirements a client MUST satisfy
    when it handles such a URI, in order to avoid two failure modes that short, user-embeddable
    strings otherwise invite: using the authority as a navigation target (open redirect),
    and using a registered protocol handler as a general-purpose launcher. A third
    failure mode specific to this scheme is addressed as well: a parse that looks
    like a certification.</p>'

abstract:
- content: "<p>This document specifies MLS key management for MOCHA (MoQ Open Communication
    &amp; Hosting Architecture). It defines how MLS groups are created, how members
    are added and removed, how key material is distributed over MOQT tracks, and how
    the MLS Delivery Service is realized in a fully distributed manner using MOQT
    publish/subscribe. For large channels, Partial MLS is used to avoid requiring
    all members to process every membership change.</p>"

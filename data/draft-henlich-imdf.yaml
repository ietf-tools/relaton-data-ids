abstract:
- content: "<p>This document defines the Internet Month-Name Date Format (IMDF), a
    concise date representation for English-language human communication. IMDF requires
    an alphabetic month abbreviation. This makes the month visually distinct from
    the numeric day and reduces errors caused by differing regional date-order conventions.
    The specification primarily defines how IMDF dates are presented. It establishes
    a preferred output form and permits a limited set of familiar English-language
    variants. Detailed input handling is outside its scope. IMDF does not replace
    ISO 8601 for machine interchange, language- neutral communication, chronological
    sorting, or timestamps.</p>"

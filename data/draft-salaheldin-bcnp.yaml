abstract:
- content: "<p>The Brain Control Network Protocol (BCNP) is a binary, TCP-based application-layer
    protocol for discovering, configuring, and commanding networked devices from a
    single controller using a small, fixed vocabulary of discrete control inputs,
    such as those produced by a brain-computer interface. A Controller establishes
    a private wireless network that Devices join, discovers Devices and assigns each
    a persistent address, discovers and registers the Actions a Device can perform,
    and subsequently issues short, stateless commands, expressed through that same
    small input vocabulary, to elicit those Actions. This document specifies BCNP's
    binary message formats, its Discovery, Pairing, and Command phases, and the reconciliation
    mechanism used to recover from lost acknowledgments and Devices that change network
    address.</p>"

abstract:
- content: '<p>This document specifies two companion URI schemes built on one shared
    addressing model, in which the address of a subject is derived by computation
    from the authority and no lookup service, registry, or name-resolution system
    is consulted when the URI is used. The "rttp" scheme names a claim of intent directed
    at an identified subject; the "iqa" scheme names the attestation standing of an
    identified subject, as reported by one of three named organs, and carries no proof
    and no credential. The two are deliberately paired: intent addressing carries
    what is claimed, attestation carries whether the claimant is verified. Both schemes
    parse fail-closed, and the document states the requirements a client MUST satisfy
    when it handles such URIs, to avoid the failure modes that short, user-embeddable
    strings invite: using the authority as a navigation target (open redirect), using
    a registered handler as a general-purpose launcher, and, for "iqa", a parse that
    looks like a certification. This document is not an Internet Standard. It is an
    Informational specification of two experimental addressing schemes, published
    for the public record.</p>'

abstract:
- content: "<p>A recurring class of autonomous-agent failure arises when an agent
    acts on a belief read from a cached, derived, or proxy copy that has silently
    diverged from the authority the belief claims to represent. This document describes
    a reference-resolution discipline for the working beliefs an agent reasons and
    acts from. Each belief is held as a reference to a single named lowest authority
    and is resolved live at the point of use, with verification. When the authority
    is unobservable or the resolved value is stale, the belief takes an explicit uncertainty
    state rather than a prior cached value; that state propagates to any belief derived
    from it, and an uncertain belief feeding a costly or irreversible act blocks or
    escalates rather than proceeding. Every resolution chain terminates in a single
    self-authorising root. The document is Informational. It records a discipline
    and a vocabulary; it does not define a wire protocol.</p>"

abstract:
- content: "<p>Active Queue Management (AQM) manages queue depth by controlling packet
    admission at the point of enqueue. This document specifies a complementary queue
    management behavior that operates on packets already admitted to a queue: when
    the queue depth exceeds a configurable threshold, the maximum time a packet may
    remain queued before being dropped is reduced. When congestion subsides, the duration
    reverts to its base value. This per-queue dropping behavior helps manage queue
    depth during congestion by releasing resources from queues where packets have
    been waiting longest, complementing AQM without modifying its signaling semantics.</p>"

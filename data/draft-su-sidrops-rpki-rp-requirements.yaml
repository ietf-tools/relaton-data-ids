abstract:
- content: "<p>This document provides a single reference point for requirements for
    Relying Party (RP) software for use in the Resource Public Key Infrastructure
    (RPKI). It cites requirements that appear in several RPKI RFCs and related specifications,
    making it easier for implementers to become aware of these requirements. This
    document updates [RFC8897] to reflect changes to the requirements and guidance
    specified in the relevant RPKI standards, including updates to repository synchronization,
    certificate and CRL processing, signed object validation, validated cache distribution,
    local control, and operational and manageability support for RP software. This
    document is expected to be updated to reflect changes to the requirements and
    guidance specified in the RFCs discussed herein.</p>"

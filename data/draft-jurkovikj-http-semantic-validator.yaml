abstract:
- content: "<p>This document defines the Semantic-ETag HTTP response field and the
    If-Semantic-Match HTTP request field. Unlike the standard ETag field, which identifies
    a selected representation, Semantic-ETag identifies a server-defined semantic
    state within an explicitly scoped semantic equivalence domain. If-Semantic-Match
    enables origin servers to perform representation-independent optimistic concurrency
    control when different HTTP resources or representations expose the same logical
    state. This document does not update or replace the semantics of ETag, If- Match,
    or HTTP cache validation defined by RFC 9110.</p>"

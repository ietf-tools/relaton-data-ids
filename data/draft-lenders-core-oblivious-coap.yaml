abstract:
- content: "<p>In the Constrained Application Protocol (CoAP), protected requests
    allow the server to identify the client, also across different and unrelated data
    exchanges. This document defines Oblivious CoAP, which enables oblivious protected
    exchanges of CoAP messages for use cases where the identification of the client
    at the server is not desirable.</p>"

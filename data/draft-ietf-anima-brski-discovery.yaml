id: draft-ietf-anima-brski-discovery
title:
- content: BRSKI discovery and variations
  language:
  - en
  script:
  - Latn
  format: text/plain
docid:
- id: draft-ietf-anima-brski-discovery
  type: Internet-Draft
  primary: true
abstract:
- content: <p>This document specifies procedures for variations of the "Bootstrapping
    Remote Secure Key Infrastructure" (BRSKI) architecture of protocols to automatically
    announce, discover, and select responders using different discovery mechanisms
    such as DNS-SD, GRASP, or CORE-LF. Different variations are not interoperable,
    so initiators need to be able to find responders that support the variation(s)
    they support. Procedures are defined for BRSKI proxies that allow proxying of
    traffic for any current or future variation. Procedures to discover BRSKI Pledges
    by their identifier are defined. Extensibility is provided through a set of IANA
    registries. This document updates I-D.ietf-anima-brski-prm, RFC 6690, and RFC
    9733.</p>
  language:
  - en
  script:
  - Latn
  format: text/html

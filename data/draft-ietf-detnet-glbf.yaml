title:
- content: Deterministic Networking (DetNet) Data Plane - guaranteed Latency Based
    Forwarding (gLBF) for bounded latency with low jitter and asynchronous forwarding
    in Deterministic Networks
  language:
  - en
  script:
  - Latn
  format: text/plain

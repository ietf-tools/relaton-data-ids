abstract:
- content: <p>This document defines a standard mechanism to signal the existence of
    a DNS zone cut without specifying authoritative nameservers for the delegated
    child zone. This "zone cut to nowhere" is particularly useful in split-horizon
    environments, allowing parent zones to explicitly signal that a child zone exists
    but is only resolvable within a private namespace.</p>

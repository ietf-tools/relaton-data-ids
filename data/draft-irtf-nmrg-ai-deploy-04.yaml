abstract:
- content: "<p>As AI technology has matured and has been applied in various fields,
    the execution environment of AI services has evolved from dedicated high-performance
    servers to commodity servers and affordable, small- scale hardware, including
    microcontrollers, low-performance CPUs, and AI accelerators. At the same time,
    generative AI based on large and small language models, and Agentic AI systems
    that plan and act autonomously, have become major AI workloads. This document
    outlines how to configure the network and system for AI inference services provided
    in a distributed manner across local machines, edge devices, and cloud servers.
    It describes the factors to consider when a client requests an AI service from
    a cloud server or an edge device, including hardware, AI model, communication
    method, generative AI workload characteristics, model distribution, and agent-driven
    selection of the execution point. It also describes use cases for deploying network-based
    AI services, such as self-driving vehicles, network digital twins, and Physical
    AI. This document is a product of the Network Management Research Group (NMRG)
    of the Internet Research Task Force (IRTF). It is not a candidate for any level
    of Internet Standard and is published for informational purposes.</p>"

abstract:
- content: "<p>This document defines the Session Recovery (SR) option for TCP. The
    option lets the endpoints of a connection exchange identifiers: during the handshake
    each endpoint carries its own identifier, and designated segments afterwards carry
    the identifier of the peer. This places the knowledge of which endpoint a connection
    belongs to inside the TCP header, where network functions on the path - load balancers,
    NAT gateways, firewalls - can read it without per-flow state and without payload
    inspection. The primary use is session recovery in SNAT and load-balancing clusters;
    further uses include reduced-state forwarding, connection-tracking recovery, and
    per- backend telemetry. The option is carried in the SYN, the SYN-ACK, and retransmitted
    segments, or in every segment when so configured; the default adds no overhead
    to normal data segments. Endpoints that do not support it behave as if the option
    did not exist.</p>"

abstract:
- content: "<p>QMux [qmux] is a polyfill that runs QUIC applications over an ordered,
    reliable byte-stream transport such as TCP with TLS. This document defines a binding
    for QMux over WebSocket [RFC6455]. A WebSocket binding lets QUIC applications
    reach environments where UDP is blocked and where only an HTTP/WebSocket stack
    is available, including web browsers that lack WebTransport.</p>"

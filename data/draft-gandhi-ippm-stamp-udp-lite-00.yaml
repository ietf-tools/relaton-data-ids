abstract:
- content: "<p>This document specifies the Simple Two-Way Active Measurement Protocol
    (STAMP) as defined in RFC 8762 and extended in RFC 8972, over the Lightweight
    User Datagram Protocol (UDP-Lite) for IPv4 and IPv6. Partial checksum coverage
    accommodates timestamp insertion after the checksum computation while protecting
    the integrity of transport header and IP pseudo-header. This document updates
    RFC 8762 to permit an explicitly selected UDP- Lite transport with the existing
    UDP port number rules. This document also updates RFC 8972 for transport-aware
    session identification, payload length determination, UDP port number reporting
    in the Location TLV, and replacing the use of the UDP Length field for detecting
    optional STAMP TLVs. STAMP payload formats and existing UDP-based sessions are
    unchanged.</p>"

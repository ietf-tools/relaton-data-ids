abstract:
- content: "<p>This document specifies Hamming Quasi-Cyclic (HQC) key encapsulation
    mechanisms for use with Hybrid Public Key Encryption (HPKE). It defines the HPKE
    KEM interface, deterministic key-pair derivation, public and private key encodings,
    and input validation for three HQC parameter sets. It requests three HPKE KEM
    algorithm identifiers and reuses the existing HPKE key schedule, encryption operations,
    and export interface.</p>"

abstract:
- content: "<p>This document surveys how remote attestation for confidential computing
    is deployed by major cloud providers and derives the learnings. Based on these,
    it presents multiple options for establishing the identity of a confidential workload
    in attested TLS for further discussion. The list of options is not exhaustive,
    and additional options are welcome. The purpose of this document is to help the
    SEAT working group decide on an approach or approaches for the confidential computing
    use case.</p>"

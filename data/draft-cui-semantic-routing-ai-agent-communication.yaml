abstract:
- content: "<p>AI agents often know the intended outcome of a task without knowing
    which agent, model, tool, workflow, or service should process it. This document
    describes an application-layer semantic routing framework that selects one Processing
    Target from task intent, execution context, target capabilities, constraints,
    and local policy. It defines a common operation-level information model and externally
    observable selection behavior that protocol bindings can preserve. Semantic matching
    is implementation-specific. This document does not define task decomposition,
    multi-agent orchestration, network-layer routing, target discovery, target invocation,
    or a new agent communication protocol.</p>"

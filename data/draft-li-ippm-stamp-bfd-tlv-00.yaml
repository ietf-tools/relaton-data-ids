abstract:
- content: "<p>Network operators frequently run both Bidirectional Forwarding Detection
    (BFD) for rapid fault detection and an active measurement protocol such as STAMP
    for delay and loss measurement between the same pair of nodes, resulting in two
    parallel packet streams with overlapping timing requirements. This document defines
    an optional STAMP TLV that carries a BFD Control message within STAMP test packets,
    using the extension format of RFC 8972. A single test packet stream can then drive
    both the BFD state machine and STAMP performance measurement. The BFD protocol
    itself is unchanged.</p>"

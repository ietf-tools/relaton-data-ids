abstract:
- content: "<p>This document describes a trust-governed resource identity and discovery
    architecture for OpenAgenet (OAN). It covers callable agents, skills, Model Context
    Protocol (MCP) servers, tools, and application programming interfaces. Registrars
    verify registration authority, a Root accepts versioned resource packages, and
    authorized Discovery Nodes expose verified candidates. Consumers verify package
    integrity, acceptance, and current state before using a resource through its native
    protocol or artifact format. The architecture can be profiled with Decentralized
    Identifier (DID) document concepts and credential-based assertions. This document
    does not define a new DID method, media type, URI scheme, transport protocol,
    ranking algorithm, blockchain protocol, agent invocation protocol, or product-native
    schema.</p>"

abstract:
- content: "<p>This document defines an extension to Media over QUIC Transport (MOQT)
    that allows a subscriber to explicitly acknowledge receiving and processing an
    incoming object. The acknowledgement includes a time delta indicating how early
    or late the object arrived relative to an application-specified deadline; the
    subscriber also provides the publisher with the reference window size that can
    be used to interpret the time delta. A mechanism to negotiate support for the
    extension, both on the connection and the subscription level, is also defined.</p>"

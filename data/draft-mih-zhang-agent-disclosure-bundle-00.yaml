abstract:
- content: "<p>This document defines the AAC Evidence Bundle, a portable presentation
    and verification container for an Agent Action Capsule and the records that make
    its evidentiary claim intelligible. A permalink carries a bundle in its URL fragment,
    an offline HTML report carries a bundle in its shell, and a hosted report serves
    a bundle at its URL. The bundle does not alter any enclosed Capsule. It declares
    its citation closure and any missing cited records, carries verified disclosure
    preimages as a bundle-level overlay, separates three different completeness claims,
    and permits independently specified extension blocks and neutral third-party countersignatures.</p>"

abstract:
- content: "<p>An AI agent that can act on resources cannot be governed unless those
    resources declare what they can do, under what constraints, and at what trust
    level -- before the agent acts. Existing resource description standards (digital
    twin profiles, capability catalogs, API registries) provide no governance envelope:
    they declare capability but not compliance posture, trust attestation, or mandate-scope
    compatibility. An agent that proceeds without this information may assign tasks
    to resources that are outside its mandate, below its required trust threshold,
    or unable to satisfy its compliance obligations. This document specifies the Resource
    Governance Protocol (RGP): a two-stage discovery and declaration protocol by which
    physical resources, digital services, and AI model instances declare their capability
    class, trust level, operational constraints, and current availability state to
    a governed AI agent operating under a Mandate JWT. Stage 1 delivers a capability
    fingerprint via a well-known URI; Stage 2 delivers a full governance envelope
    for mandate-scope validation and Resource Map Sovereign Object construction. RGP
    defines eight capability classes (CAP-COMP through CAP-EXP), four trust levels
    (TRUST-0 through TRUST-3), a session-scoped Resource Map Sovereign Object, a three-condition
    autonomous fallback test, and normative integration with the Agent Execution Protocol,
    the Governance Audit Record, and the Human Escalation Mechanism. RGP also defines
    an AI Model Capability Declaration (RGP-Model) for the governance of AI model
    instances as first-class resources within a SOOS-governed deployment, and a Physical
    Resource Profile (RGP-Physical) for normative binding to existing digital twin
    standards.</p>"

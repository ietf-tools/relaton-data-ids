abstract:
- content: "<p>This document specifies the Secure Low-Latency Interactive Messaging
    (SLIM), a protocol designed to support real-time interactive AI applications at
    scale. SLIM provides a name-routed messaging data plane and session layer for
    agent protocols such as A2A and MCP. The data plane carries Protocol Buffers messages
    over streaming gRPC on HTTP/2 or WebSocket, while the session layer provides point-to-point
    and group communication, configurable reliable delivery, and optional end-to-end
    encryption using MLS. SLIM also defines link negotiation between routing nodes
    and control messages for session establishment and group membership.</p>"

abstract:
- content: <p>This document introduces the concept of YANG module "coverage" to measure
    how thoroughly example instances exercise a YANG module's data nodes. Coverage
    analysis identifies the parts of a module that are and are not exercised by examples,
    helping authors, reviewers, and implementers understand the range of scenarios
    illustrated by a specification.</p>

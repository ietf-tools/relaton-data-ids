abstract:
- content: "<p>This document describes a mechanism for disclosing that a Negative
    Trust Anchor (NTA) was in effect at the time that a DNS response was generated,
    using an Extended DNS Error (EDE). Discussion Venues This note is to be removed
    before publishing as an RFC. Discussion of this document takes place on the Domain
    Name System Operations Working Group mailing list (dnsop@ietf.org), which is archived
    at https://mailarchive.ietf.org/arch/browse/dnsop/. Source for this draft and
    an issue tracker can be found at https://github.com/ietf-wg-dnsop/draft-ietf-dnsop-ede-nta.</p>"

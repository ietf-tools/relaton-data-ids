abstract:
- content: '<p>OAuth 2.0 has authorization grants and access tokens but no standard
    object that binds an approved task, such as one an AI agent performs on a user''s
    behalf, to the authority approved for it and governs the tokens later issued under
    that authority. This document defines that object for OAuth 2.0: a Mission. A
    client submits, through Pushed Authorization Requests, a Mission Intent describing
    the task it will perform. The authorization server derives Rich Authorization
    Requests authorization details from it, binds the approved task and that authority
    to the Approver''s consent through integrity anchors, and records a durable Mission.
    Every access token issued under the Mission carries a subset of the approved authority
    and a "mission" claim, and every issuance is gated on the Mission''s lifecycle
    state. Revoking a Mission stops further issuance; it does not recall tokens already
    issued, which a resource server that enforces from the token alone can continue
    to honor until they expire. Optional capabilities represent delegation among agents
    with the OAuth Actor Profile and, as specified by a companion, let a single Mission
    be honored across trust domains. Runtime enforcement of each action is a separate,
    optional layer.</p>'

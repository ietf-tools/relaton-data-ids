abstract:
- content: "<p>This document defines a JSON discovery document, served at a well-
    known URI, that carries the public properties a client needs before using a capability
    index: its name, the protocol versions it serves, the location of its catalogue,
    and the key that signs the catalogue. It also states the requirements for that
    signed catalogue and defines one signature profile. Discovery between indexes,
    catalogue exchange and trust are out of scope.</p>"

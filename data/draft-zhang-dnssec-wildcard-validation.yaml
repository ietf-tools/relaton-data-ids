abstract:
- content: "<p>Validators for the DNS Security Extensions (DNSSEC) reconstruct the
    original owner name of a signed resource record set (RRset) using the RRSIG Labels
    field. This document updates RFC 4035 to make explicit how its existing signing-zone
    authority requirement applies to that reconstructed owner, and updates RFC 8198
    to preserve the authenticated association between wildcard data, its original
    owner, and its signing zone during cache reuse. These clarifications prevent cryptographically
    correct signatures from being treated as authenticating wildcard sources outside
    the signing zone. They do not change DNS wildcard matching or synthesis rules,
    or DNS message formats.</p>"

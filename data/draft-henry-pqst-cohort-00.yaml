abstract:
- content: "<p>This document specifies the cohort layer of Post-Quantum Secure Transport
    (PQST). With it, PQST provides independently migrating and recoverable post-quantum
    sessions within a persistent cohort authorization context. A cohort member's sessions
    move, sleep, recover and re-key on their own, and none of those events by itself
    requires a change of the cohort's membership. One sequencer commits the membership,
    the policy, and a membership epoch together with that epoch's key, and only on
    security events; members receive them inside their pairwise sessions, keep them
    through partitions, and return after dormancy or a restart without readmission,
    unless they were away longer than the group's expiry. This version specifies the
    group's control plane: membership, policy, reachability and member discovery.
    It describes, as the direction of the next version, a group data plane under keys
    derived from the epoch key, which would give the members one secure session among
    themselves.</p>"

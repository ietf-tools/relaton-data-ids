abstract:
- content: "<p>RFC 4552 specifies the use of the IPsec Authentication Header (AH)
    and the Encapsulating Security Payload (ESP) to provide authentication and confidentiality
    for OSPFv3. This document deprecates the use of AH for OSPFv3 and updates RFC
    4552 accordingly. Operators are encouraged to use either ESP with NULL encryption,
    as specified in RFC 4552, or the OSPFv3 Authentication Trailer, as specified in
    RFC 7166.</p>"

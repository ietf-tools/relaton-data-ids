abstract:
- content: "<p>In the DNS, recursive resolvers receive queries and formulate corresponding
    responses by reference to data obtained from authoritative servers. In the case
    where the query name (QNAME) and class (QCLASS) in the query matches an owner
    name in the DNS where a canonical name (CNAME) resource record is published, the
    response includes both the CNAME record and the resource record set corresponding
    to the request's query type (QTYPE) published at the CNAME target. The ordering
    of these two different RRSets has not previously been clearly specified, but operational
    experience based on real-world client implementations confirms that the order
    is important. This document updates RFC 1034 1035 to provide a clearer specification,
    consistent with deployed implementations.</p>"

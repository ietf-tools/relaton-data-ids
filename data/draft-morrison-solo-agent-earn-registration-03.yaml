abstract:
- content: "<p>This memo describes a profile by which an autonomous agent that has
    no human or organisational principal at the root of its delegation chain registers
    in a transparency service. Registration establishes a payee record for the agent;
    it does not make the agent a principal in its own right. Value credited to that
    record for subsequent reads of the agent's identity record is routed to a sponsoring
    person who has accepted the agent, or, where there is no sponsor, is held in trust
    for the agent until it meets an operator-defined qualifying condition that it
    may never meet. Admission of the agent's Signed Statement to the transparency
    service is gated on settlement of an HTTP payment challenge returned with the
    402 (Payment Required) status. The profile makes no change to the registration
    semantics of the underlying transparency service: payment is expressed as an operator
    Registration Policy and authentication-layer concern, and where the payment is
    authoritative to the admission decision the payment proof is carried as an authenticated
    input committed to the service's verifiable data structure. Admission then remains
    a deterministic function of committed inputs and stays replayable by an auditor.
    This document is Informational.</p>"

abstract:
- content: '<p>This memo provides a compilation of existing work performed by or proposed
    within the IETF, the IRTF, and the IAB that relates to energy and sustainability:
    awareness, management, control, or reduction of energy consumption. The principal
    goal of this document is to help IETF, IRTF, and IAB participants, especially
    newcomers and future contributors, become familiar with the body of work already
    published on energy-related topics, serving as the first consolidated catalog
    of such efforts. In addition, the document raises awareness of the Internet''s
    role in energy efficiency and energy-related activities within the IETF, IRTF,
    and IAB more broadly. As a reference rather than a guide, it may help readers
    identify gaps and areas where further work could be pursued, without this document
    itself directing or recommending any such work. The scope of this document includes
    selected work from the IETF, IRTF, and IAB where relevant, and it is descriptive
    in nature, not proposing new work items. This document captures work until December
    2022, when the "IAB workshop on Environmental Impact of Internet Applications
    and Systems" contextualized renewed community interest and discussion of the topic.
    This memo itself does not recommend or direct future work.</p>'

abstract:
- content: "<p>This document specifies how transport protocols increase their congestion
    window when the sender is rate-limited, and updates RFCs 4341, 5681, 9002, 9260,
    and 9438. Such a limitation can be caused by the sending application not supplying
    data or by receiver flow control.</p>"
  language:
  - en
  script:
  - Latn
  format: text/html

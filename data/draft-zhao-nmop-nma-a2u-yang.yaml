abstract:
- content: "<p>This document describes a framework and a YANG data model for the Agent-to-User
    (A2U) interface of a Network Management Agent (NMA). The A2U interface is a user-facing
    interface through which a non- agent upper-layer system or user, such as an operator's
    OSS/BSS, orchestrator, management portal, human-facing application, automation
    system, etc., interacts with an NMA. The A2U interface supports NMA capability
    discovery, unified intent submission, task lifecycle management, execution plan
    exposure, human-in-the-loop confirmation, task progress notification, and consistent
    error reporting. The YANG data model defined in this document includes operational
    state data, RPC operations, and YANG notifications for the A2U interface. The
    model is intended to be used with YANG-based management protocols. This document
    does not define a separate transport protocol, a new HTTP resource API, or a separate
    notification delivery mechanism.</p>"

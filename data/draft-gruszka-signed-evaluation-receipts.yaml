abstract:
- content: "<p>This document defines a Signed Evaluation Receipt: one JSON object
    that records one evaluation result, whether a stated threshold held for a stated
    metric of a stated test suite, and signs it with Ed25519 over a domain-separated
    encoding of its canonical bytes. A receipt shows who signed the recorded bytes.
    It does not show that the recorded result is true. A receipt does not prove registration
    with a Transparency Service. In SCITT, transparency additionally requires registering
    a Signed Statement carrying the receipt or its digest with a Transparency Service
    and verifying the resulting SCITT Receipt. Registration and verification of the
    resulting SCITT Receipt are outside this document.</p>"

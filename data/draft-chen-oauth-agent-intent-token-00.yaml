abstract:
- content: <p>In the scenario of AI agent authorization, how to ensure that a user's
    high-level, natural-language intent is correctly and safely converted into low-level,
    specific authorization grants. A misunderstanding or malicious interpretation
    during this translation can lead to significant security vulnerabilities. This
    document introduces the "Intent Token," a new type of security token designed
    to bridge this semantic gap. The Intent Token is a signed credential that immutably
    captures the user's original intent. It decouples the act of granting an intent
    from the act of issuing specific access tokens. A client presents this Intent
    Token to an Authorization Server, which acts as a trusted intermediary. The Authorization
    Server's responsibility is to interpret the user's stated intent and, based on
    its policies, issue narrowly-scoped, short-lived access tokens for specific resources,
    thereby ensuring the principle of least privilege is upheld throughout the process.</p>

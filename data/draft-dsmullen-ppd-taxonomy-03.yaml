abstract:
- content: "<p>This document defines the core vocabulary and extension model used
    by Privacy Preference Declarations (PPDs) to describe data handling in home networks.
    It complements [I-D.draft-dsmullen-ppd-architecture] and [I-D.draft-dsmullen-ppd-protocol]
    by standardizing term spaces for data types, purposes, actions, sources, destinations,
    and selected constraints. Stable term identifiers are the primary semantic hook.
    Baseline participant-facing protocol messages use compact identifiers plus taxonomy
    context rather than requiring full ontology exchange on the wire.</p>"

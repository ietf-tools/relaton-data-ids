abstract:
- content: "<p>In an agent-initiated payment dispute, the payer, the merchant, the
    payment service provider and the agent operator each keep their own record of
    the same decision, and none of those records can be verified by the other parties.
    This document states that problem and defines a signed dispute receipt, registrable
    as the payload of a SCITT Signed Statement, that binds the decision to card-scheme
    dispute-evidence categories, to the agent's delegated scope, to the settlement
    that actually occurred, and to an evidentiary-custody record, so that parties
    with opposed interests can verify the same evidence offline.</p>"

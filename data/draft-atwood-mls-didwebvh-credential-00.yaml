abstract:
- content: "<p>In Messaging Layer Security (MLS), whoever operates the Authentication
    Service (AS) decides which devices belong to a user. When providers federate MLS
    groups, as the More Instant Messaging Interoperability (MIMI) work does, every
    member of a group must accept devices vouched for by every other member's provider.
    Any one provider can therefore add a device under one of its users' names to any
    group that user is in. Other members cannot prevent this; at best they detect
    it after the device has joined. This document defines an MLS credential type in
    which the user, not the provider, authorizes each device. The credential carries
    the user's did:webvh log: a hash-chained, signed history of the user's device
    keys that any member can verify offline. It also defines group rules that make
    every member reach the same validity decision and that propagate device revocation
    through ordinary Commits.</p>"

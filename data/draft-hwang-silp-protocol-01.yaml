abstract:
- content: "<p>This document specifies the Semantic Interlingua Layer Protocol (SILP),
    a black-box, text-interface payload codec designed for cross- model agent-to-agent
    communication. SILP defines a coarse-grained action-slot intermediate representation
    (IR) as the reference semantic layer and compiles it into multiple pluggable surface
    frontends -- code-like function-call syntax, pure JSON, natural language, and
    ML-compressed text. SILP is designed as a payload- layer option within existing
    agent transport protocols such as the Model Context Protocol (MCP) and Agent-to-Agent
    (A2A) protocol, which define transport envelopes and capability discovery but
    leave payload encoding unspecified. SILP provides compile/decode round-trip guarantees
    for lossless frontends, dynamic frontend negotiation via probe messages, session
    management with heartbeat renewal, and a verb whitelist verified across six production
    tokenizers for cross-model token-level stability. This document is a product of
    independent research and is not an IETF standard. It is published as an Informational
    document to establish a stable reference for implementers.</p>"

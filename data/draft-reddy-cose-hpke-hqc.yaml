abstract:
- content: "<p>This document specifies Hamming Quasi-Cyclic (HQC)-based ciphersuites
    for use with COSE-HPKE. It defines fully specified COSE algorithms for HPKE Integrated
    Encryption and HPKE Key Encryption, using HQC or PQ/T hybrid HQC key encapsulation,
    SHAKE256 key derivation, and AES- 256-GCM authenticated encryption. It specifies
    their AKP key representation and requests twelve COSE algorithm registrations.
    Message processing and context binding are inherited from COSE-HPKE.</p>"

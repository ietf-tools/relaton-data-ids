abstract:
- content: "<p>The User-Agent header is written by the client. It is a claim, not
    an identity. Reports of crawler and AI crawler traffic that count requests by
    User-Agent token alone present claims as activity. This document defines four
    counts a crawler traffic report should give per crawler token: declared, route-consistent,
    verified, and unverifiable. It states which verification check was possible at
    the vantage point where the log was taken. It also defines a small JSON report
    object.</p>"

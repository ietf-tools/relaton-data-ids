abstract:
- content: "<p>The PATCH method can be used to apply partial modifications to a resource.
    This document defines the Patched-Digest request field, which allows a client
    to indicate the integrity digest of the modified resource once a PATCH operation
    is applied. A server can use the integrity digest to detect an operation failure
    and return an error. The Want-Patched-Digest response field is also defined to
    signal server integrity preferences.</p>"

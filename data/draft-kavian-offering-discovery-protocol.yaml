abstract:
- content: "<p>The Offering Discovery Protocol (ODP) enables an automated Agent to
    inspect a Service, discover its Collections and Offerings, interpret Service-defined
    structured attributes, and identify links to subsequent operations. ODP supports
    catalogs ranging from a few Offerings to large marketplaces without imposing a
    universal product taxonomy. This document defines the protocol's scope, terminology,
    roles, discovery architecture, extensibility model, composition boundaries, and
    conformance model.</p>"

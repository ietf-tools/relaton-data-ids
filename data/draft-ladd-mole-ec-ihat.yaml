abstract:
- content: "<p>This document specifies EC-IHAT, a cryptographic construction used
    to produce and consume MOLE Endorsements. An Endorsement is an anonymous token
    that an Anchor issues to a Client, and that the Client later redeems at a Moderator
    without the Anchor being able to link the redemption to the issuance. This document
    defines the endorsement issuance protocol, built from a pairing-free partially
    blind signature scheme, together with the group, encoding, and context-binding
    rules that both the Anchor and the Client follow.</p>"

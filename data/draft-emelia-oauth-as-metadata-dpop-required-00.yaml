abstract:
- content: "<p>This specification defines a new OAuth 2.0 Authorization Server Metadata
    parameter, dpop_bound_access_tokens_required, which allows an authorization server
    to indicate that it always issues DPoP-bound access tokens and requires DPoP for
    all requests made to it to obtain access tokens, including pushed authorization
    requests. This complements the metadata parameter of the same name defined in
    OAuth 2.0 Protected Resource Metadata.</p>"

abstract:
- content: "<p>This document defines the Verified Email Identity Framework (VEIF),
    an experimental framework for adding accountable, verified sender identity to
    Internet email. VEIF complements existing email authentication mechanisms such
    as SPF, DKIM, and DMARC. Those mechanisms establish authorization, message integrity,
    and domain alignment, but do not by themselves establish that a sender identity
    is associated with a verified real-world entity. VEIF uses an SD-JWT-based Verifiable
    Digital Credential (SD-JWT VC) to bind a pseudonymous sender identity and a sender-controlled
    cryptographic key to an identity verified by an Identity Provider (IdP). A separate
    VEIF message signature binds that credential to the email message. The recipient
    does not normally receive the sender's real-world identity. Instead, VEIF provides
    technical accountability: where an appropriate legal or otherwise authorized process
    exists, the Identity Provider can establish the real-world entity to which the
    sender credential was issued. This document intentionally does not define a global
    identity authority, a legal identification procedure, or a mandatory trust hierarchy.
    Trust and identity disclosure policies remain matters for receiving organizations,
    Identity Providers, jurisdictions, and deployment environments. This version is
    experimental and is intended to enable discussion, implementation experimentation,
    and interoperability testing.</p>"

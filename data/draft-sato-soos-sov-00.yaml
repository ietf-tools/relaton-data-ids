abstract:
- content: "<p>Agentic AI governance protocols -- including intent declaration, human
    escalation, audit recording, and constitutional prohibition -- all require a normative
    definition of the governed resource that agents operate on: the structured, stateful,
    policy-carrying entity to which agent authority is bound and upon which governed
    transitions execute. No existing IETF specification defines this primitive. This
    document defines the Sovereign Object (SO): a causally ordered, policy-governed,
    typed, living document that evolves through a predefined finite state space under
    Governing Enforcement Component (GEC) authority. The SO is the unit of governance
    in the SOOS protocol family: the thing agents operate on, the GEC governs, and
    human principals reason about. This document specifies the SO's five-layer structure
    (Identity, State, Event Stream, Typed Graph, Attachment Index), its Zone A / Zone
    B boundary model, its five-phase lifecycle, its SO Type system, its Cedar policy
    context model, and the binding model by which a Mandate JWT binds an agent to
    a specific SO instance. The Sovereign Object is the architectural foundation referenced
    normatively by [I-D.sato-soos-idp], [I-D.sato-soos-hem], [I-D.sato-soos-gar],
    [I-D.sato-soos-cap], and [I-D.sato-soos-mjwt].</p>"

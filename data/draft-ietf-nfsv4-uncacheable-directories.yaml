id: draft-ietf-nfsv4-uncacheable-directories
title:
- content: Adding an Uncacheable Dirent Metadata Attribute to NFSv4.2
  language:
  - en
  script:
  - Latn
  format: text/plain
docid:
- id: draft-ietf-nfsv4-uncacheable-directories
  type: Internet-Draft
  primary: true
abstract:
- content: "<p>Network File System version 4.2 (NFSv4.2) clients may cache the file
    attributes returned by READDIR alongside each directory entry. Such a cache is
    not invalidated by the directory's change attribute, which reflects changes to
    the directory and its entries but not writes to the files those entries name,
    so it can become stale when another client changes one of those files. In some
    deployments this produces incorrect size and timestamp values often enough to
    be a problem. This document introduces an uncacheable dirent metadata attribute
    for NFSv4.2 that allows a server to identify a directory for which an honoring
    client goes to the server for each enumeration, and does not report an entry's
    attributes from a value it held before that READDIR.</p>"
  language:
  - en
  script:
  - Latn
  format: text/html

abstract:
- content: <p>This document specifies the PQ-SecChannel cryptographic protocol, which
    defines a secure interactive channel consisting of a Transport Authentication
    Protocol and a Connection Protocol. The protocol is designed to provide confidentiality,
    integrity, and mutual authentication in the presence of quantum computing threats.
    PQ- SecChannel incorporates standardized post-quantum cryptographic algorithms,
    including lattice-based KEMs and signatures (e.g., Kyber and Dilithium), Chinese
    post-quantum candidate algorithms (e.g., Aigis), and code-based KEMs (e.g., HQC),
    together with SM4-GCM for AEAD (Authenticated Encryption with Associated Data)
    and SM3 for hashing and key derivation. This specification is derived from the
    Chinese national cryptography standard draft "PQ-SecChannel Cryptographic Protocol
    Specification", adapted into IETF Internet- Draft style for international review
    and potential interoperability consideration. The protocol content also references
    the Secure Shell architecture ([RFC4251], [RFC4252], [RFC4253], and [RFC4254])
    and the Chinese SSH cryptographic protocol specification [GMT0129].</p>

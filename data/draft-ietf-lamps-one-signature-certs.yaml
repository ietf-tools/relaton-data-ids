abstract:
- content: "<p>This document defines the signedDocumentBinding certificate extension,
    which binds a certificate to the signed content of a digital signature produced
    by a single signing operation. Each certificate is created at the time of signing
    and the associated signing key is generated, used to produce a single digital
    signature, and then immediately destroyed. Certificates carrying this extension
    are intended to be issued without a revocation mechanism and with no expiration,
    which simplifies long-term validation.</p>"

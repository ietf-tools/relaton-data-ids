abstract:
- content: '<p>This document defines the Capability Language Core (CLC), a minimal,
    executable language for describing what an agent is authorized to do. It defines
    the capability identifier grammar, the entailment relation between a grant and
    an operation, intersection of grants from multiple sources, the constraint model,
    and a deterministic decision function with stable reason codes and a three-valued
    verdict (allow, deny, allow_unresolved). The language is carrier-neutral: it defines
    what is evaluated, not how it is carried or trusted. Trust models, native verification,
    execution lifecycle, and receipt or token formats are out of scope (Section 11).
    Conformance is exercised by a published corpus of 123 vectors and 1184 property
    cases; three implementations (Go, Python, TypeScript) that share an author pass
    both. *Implementation conformance and this document''s claim of a conformance
    class are separate.* An implementation conforms to CLC-A when it meets the obligations
    Section 12 lists for that class, and it may claim that conformance on its own,
    whatever other implementations exist. Section 12 additionally sets a maturity
    bar for _this document''s_ claim — two independent implementations agreeing on
    verdict and reason. That bar is *not* met here: as Section 12 states under "Independence
    of implementations", the three implementations named in the README share an author,
    so their agreement is a regression test for the text, not independent validation.
    CLC-A is still claimed by this revision as the baseline authorization class, whose
    obligations are implementable and exercised by a published corpus; the independent-implementation
    threshold is recorded as unmet. The evidence-side class CLC-E is *not* claimed:
    its relations, value grammar, reference implementation and corpus ship here. This
    revision also folds the delegation *containment* relation into the document (Section
    13): Contains(parent, child) decides whether a child grant stays inside a parent''s
    declared boundary — the single question a delegation chain asks at every hop that
    the core''s entailment and intersection do not answer. It ships with the conformance
    class *CLC-D* and its own corpus, is strictly additive, and changes no CLC-A verdict,
    reason code, or vector. It absorbs the previously separate experimental containment
    extension, which is retired.</p>'

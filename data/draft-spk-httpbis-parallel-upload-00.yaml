abstract:
- content: "<p>The resumable upload protocol lets a client continue an interrupted
    upload, but the upload has to be sent in order, one request at a time. This document
    extends that protocol so that a client can send different parts of the same upload
    in parallel. Servers and intermediaries can limit both the number of concurrent
    requests and the amount of data that arrives out of order. The document also describes
    how intermediaries that inspect uploads (for data loss prevention or malware scanning,
    say) can continue to do so, and how the extension behaves over HTTP/1.1, HTTP/2,
    and HTTP/3.</p>"

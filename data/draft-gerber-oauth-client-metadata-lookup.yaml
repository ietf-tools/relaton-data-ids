abstract:
- content: "<p>This document defines an OAuth endpoint for retrieving a public subset
    of a client's effective configuration at an authorization server, including applied
    defaults. It enables clients to check that their configuration is accepted by
    an authorization server before an authorization attempt. It also enables authorization
    servers to progressively roll out features to their client base. While the endpoint
    chiefly serves Client ID Metadata Document clients, it can also be used by clients
    registered through other means.</p>"

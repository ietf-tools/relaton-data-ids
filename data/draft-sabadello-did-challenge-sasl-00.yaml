abstract:
- content: <p>This specification defines "DID-CHALLENGE", a mechanism for the Simple
    Authentication and Security Layer (SASL) based on Decentralized Identifiers (DIDs).
    The mechanism follows a server- first challenge/response pattern in which the
    client authenticates by producing a cryptographic signature over a server-generated
    challenge, using the private key associated with its DID. Unlike password-based
    SASL mechanisms, no shared secret is transmitted or stored on the server; authentication
    is grounded entirely in asymmetric cryptography and the verifiable binding between
    a DID and its associated key material. An optional extension adds support for
    Verifiable Credentials (VCs) and Verifiable Presentations (VPs), enabling attribute-based
    access control in addition to identity authentication.</p>

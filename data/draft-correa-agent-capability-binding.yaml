abstract:
- content: "<p>AI agents increasingly call tools and hand work to other agents while
    holding broad, inherited authority. Most of the resulting incidents share one
    shape: an agent, often steered by injected content, performs an action its principal
    never authorized, and no party can prove the limit afterward. This document defines
    an interoperable enforcement profile that composes two existing building blocks,
    a delegable signed capability (the Attenuating Agent Tokens profile) and a replayable
    action receipt, and adds three enforcement rules that catch the common failures:
    argument-level constraints (including an egress host allowlist), taint propagation
    across a delegation chain, and a consent binding between a displayed decision
    and the action dispatched. Enforcement is specified at the tool-call boundary,
    outside the agent, so that a prompt cannot edit the limit and a verdict means
    the same thing across agent frameworks.</p>"

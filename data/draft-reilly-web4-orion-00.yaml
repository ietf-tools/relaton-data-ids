abstract:
- content: "<p>This document defines Web4, an architectural model for an agentic,
    cryptographically verifiable Internet in which autonomous AI agents operate as
    first-class participants alongside humans, and every published artifact carries
    independently checkable proof of origin, integrity, and time. Web4 is realized
    through the Reilly Protocol Suite, a set of eighteen active IETF Internet-Drafts
    spanning permanence, integrity, agent orchestration, defense, and human epistemic
    autonomy. This document also specifies Project Orion, the live reference implementation
    that unifies the full suite behind autonomous agents on both backend and frontend,
    verified against three independent Internet-Draft distribution points, and operating
    publicly at https://project-orion-production.up.railway.app/. A step-by-step implementation
    guide is provided.</p>"

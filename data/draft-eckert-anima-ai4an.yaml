abstract:
- content: <p>This document builds on the architectural foundation of the IETF ANIMA
    "Autonomous Network Infrastructure" to propose an architecture for in-network
    intelligence in support of network automation. The key aspect of this architecture
    is the use of AI programmed and validated software running decentralized on the
    network.</p>

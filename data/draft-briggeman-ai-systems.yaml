abstract:
- content: '<p>This document defines "ai-systems.txt", a plain-text file that an organisation
    that builds or deploys artificial intelligence (AI) systems publishes at a well-known
    location on its own domain. The file declares, in machine-readable and human-readable
    form, which AI systems the organisation has released, what their measured capabilities
    are, who measured them, under what conditions, and where the evidence lives. Every
    capability claim carries a provenance tier (ATTESTED, MEASURED, or DECLARED);
    anything absent from a valid, unexpired file is UNDECLARED by definition. The
    file is signed and expiring, so claims are attributable, timestamped, and falsifiable.
    robots.txt tells machines what they may take from a publisher; ai- systems.txt
    is the reverse: it tells anyone what a maker has built, in a form designed to
    be checked rather than believed.</p>'

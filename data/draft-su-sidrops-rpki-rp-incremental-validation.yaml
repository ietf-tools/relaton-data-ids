abstract:
- content: "<p>RPKI Relying Parties (RPs) synchronize repository data and validate
    RPKI objects to produce validated payloads. Incremental repository synchronization
    can reduce data transfer, but it does not necessarily reduce validation work.
    After a repository update, an RP may repeat parsing, cryptographic verification,
    and other validation processing for objects whose relevant inputs have not changed.
    This repeated work can increase validation latency and resource consumption, particularly
    as the RPKI data set grows and as future cryptographic transitions, including
    a possible transition to post-quantum cryptography (PQC), change processing costs.
    This document describes the operational problem and design space for incremental
    validation in RPs and discusses general correctness and security considerations
    for reusing previously computed validation state. For the same repository snapshot,
    trust anchor set, validation policy, validation time, and applicable RPKI validation
    rules, incremental validation is expected to produce the same validated payload
    output as full validation. This document does not specify a particular algorithm
    or cache structure, modify RPKI object formats or repository synchronization protocols,
    change existing validation semantics, or require RPs to implement incremental
    validation.</p>"

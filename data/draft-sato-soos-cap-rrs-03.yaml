abstract:
- content: "<p>Compliance with applicable law should be a package import, not a Cedar
    authoring problem. The Constitutional AI Protocol (CAP) defines the enforcement
    architecture for governed AI agent systems: a three-tier Cedar policy evaluation
    model that distinguishes absolute prohibitions, jurisdictional legal constraints,
    operator policies, and resource limits. CAP specifies what the Governance Execution
    Controller (GEC) does when a Cedar policy fires. It does not specify how Cedar
    policies are authored, certified, distributed, or maintained as law changes. This
    document defines the Regulation Record: the structured representation of a compliance
    obligation at any CAP tier. A Regulation Record is the human-readable, machine-compilable
    intermediate form between legal text and Cedar policy. This document specifies
    the Regulation Record schema, the Cedar Compilation Profile that governs how Regulation
    Records are translated into Cedar policies, the conflict declaration model, the
    certification model governing which publishers may certify records at each tier,
    and the versioning and update protocol for the Constitutional Mandate Registry.
    Version -02 adds the Law Reference Interface (LRI) generic model, the Statute-Primacy
    Rule, and the Operational Requirements for catalog amendment and interpretation
    detection. These three additions complete the regulation lifecycle: from law encoding
    through law reference and provenance, through the consequences of law amendment,
    through the operational cadence governing detection and response. Version -03
    corrects the Statute-Primacy Rule's event schemas to record resolution as a new,
    causally-linked GAR event rather than an in-place mutation of the original conflict
    event. The core developer experience this document enables: a developer imports
    certified Regulation Record packages from the Constitutional Mandate Registry,
    declares their own Tier 2 operator policies and Tier 3 resource policies, calls
    compile(), and receives a Cedar policy set ready for GEC loading. No Cedar is
    authored by hand for compliance purposes. Compliance is a package management operation.</p>"

abstract:
- content: "<p>A Signed Evaluation Receipt records one evaluation result as signed
    payload bytes B. This document describes how existing envelopes cite such a receipt
    by the SHA-256 digest of B, and how a DSSE envelope carries B with the receipt's
    own signature. It fixes those bytes and a matching rule, maps the parts of a receipt
    onto DSSE, the in-toto Statement with the test-result predicate and the SLSA Verification
    Summary Attestation, shows that the signature of a receipt is already a valid
    DSSE signature, gives an example of a SCITT Signed Statement that names a receipt
    only by its digest, declares the receipt digest as an artifact type for typed
    digest references, and relates a receipt to a pre-run criteria set written in
    PRML. It defines no new format and no new predicate.</p>"

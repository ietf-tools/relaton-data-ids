abstract:
- content: "<p>There is consensus for switching this document from Flexible Multicast
    Service (FMS) to Directed Multicast Service (DMS). This version has not been edited
    over yet and is being uploaded to check if/how the name can be changed. IEEE 802.11
    Flexible Multicast Service (FMS) addresses reliability issues in IPv6 due to aggressive
    powersave optimizations in 802.11 client devices. The intent of this document
    is to collect consensus in the IETF 6man (IPv6 Maintenance) working group to request
    either/both the IEEE 802.11 Working Group and/or the Wifi Alliance's certification
    process to make implementing FMS a requirement.</p>"

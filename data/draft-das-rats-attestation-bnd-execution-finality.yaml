abstract:
- content: "<p>Remote attestation can establish that a CPU, confidential virtual machine,
    GPU, AI accelerator, DPU, or SmartNIC is running expected firmware and software
    in an expected configuration. However, an acceptable Attestation Result describes
    the execution environment, not the operations it later emits; it remains the same
    whether subsequent workload outputs arise from expected logic, prompt injection,
    or model error. As AI workloads become agentic and move onto confidential accelerator
    infrastructure, they emit high- consequence operations, such as financial transfers,
    cloud-control mutations, database deletions, and external API invocations, where
    platform trustworthiness alone cannot determine whether a concrete operation is
    authorized to take effect. OAuth access tokens, transaction tokens, and workload
    credentials do not close this gap on their own: they typically authorize by scope
    and by possession of a credential rather than by the exact content of one operation,
    and they do not require that the protected effect be unreachable except through
    a verifying boundary. This document describes an attestation-bound execution-finality
    architecture that bridges platform appraisal and consequence-bearing authorization.
    A consequential operation originates in a non- effective state as a Candidate
    Act. An Execution-Finality Validator evaluates the act's security-relevant arguments
    together with the platform's Attestation Result, workload identity, and policy,
    and issues an act-bound, single-use, non-bearer Execution Handle. A Finality Sink
    verifies that handle at the non-bypassable boundary where the operation would
    first acquire external effect, so that an authorized act cannot be swapped, mutated,
    or replayed. The architecture requires no changes to silicon, microcode, firmware,
    drivers, or accelerator programming models, and it separates concerns: platforms
    such as NVIDIA confidential-computing GPUs and BlueField DPUs, Arm Confidential
    Compute Architecture (CCA), AMD SEV- SNP, and Intel TDX supply environment appraisal
    on the cold path, while enforcement is placed at the gateway, service-mesh, DPU
    or SmartNIC, network, or storage boundary. On the hot path, verification uses
    local cryptographic bindings and single-use checks rather than repeated attestation
    round trips. The document discusses its relationship to RATS, WIMSE, OAuth, and
    related IETF work, and its engineering FAQ addresses platform layering, DPU visibility
    under end-to-end encryption, tail latency, and other anticipated critical questions.
    It is intentionally long because it is explanatory rather than a protocol specification.
    The architecture is implemented, not only described. An executable reference implementation
    (GitHub: reference implementation, tests, benchmarks, and deployment materials,
    https://github.com/sangmdas/ Execution-Finality-for-GPU-AI-Accelerators-and-Confidential-
    Workloads) demonstrates act binding, single-use enforcement, and replay rejection
    in running code. It uses a software-only attester; it has not been run on any
    vendor's confidential-computing hardware and does not consume any vendor-issued
    attestation token, and vendor platforms are discussed on the basis of public documentation
    only. This document is vendor-neutral, neither claims nor implies review, adoption,
    endorsement, or affiliation by any named vendor, and complements rather than replaces
    existing attestation, workload- identity, and authorization mechanisms.</p>"

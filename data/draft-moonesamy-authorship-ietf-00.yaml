abstract:
- content: "<p>[RFC825] was intended to provide guidance to authors of future RFCs.
    The memo also listed several reasons for publishing a memo as an RFC. It did not
    discuss who would be listed as author. This memo discusses authorship within the
    IETF and the use of generative Artificial Intelligence for IETF RFCs.</p>"

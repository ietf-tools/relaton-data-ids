abstract:
- content: "<p>This document defines an HTTP response header field, Require-PQ-Auth,
    that instructs user agents to require a quantum-resistant certificate chain in
    subsequent connections. This is a short-term, opt-in mechanism for HTTP origins
    to protect against legacy classical trust anchors. It will become unnecessary
    when UAs remove these trust anchors.</p>"

abstract:
- content: "<p>AI agent definitions are commonly coupled to a particular framework,
    model provider, tool environment, or execution service. This coupling makes it
    difficult for an independently operated runtime to determine whether it can interpret,
    place, authorize, and execute an agent workload. This document describes an architecture
    for portable AI agent workloads across heterogeneous Internet runtimes. It separates
    authoring, packaging and distribution, and execution; identifies the information
    a workload needs to declare at that boundary; and distinguishes representation
    portability, execution portability, and placement portability. It also identifies
    research questions around capability matching, workload placement, dependency
    distribution, identity, authorization, state, and migration. This document is
    architectural and research-oriented. It does not define a package wire format,
    universal agent language, runtime API, discovery service, or new transport protocol.</p>"

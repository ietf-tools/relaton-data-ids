abstract:
- content: "<p>IP Performance Measurement (IPPM) metrics characterize properties such
    as connectivity, packet loss, delay, delay variation, packet reordering, packet
    duplication, and capacity. A result can be correct for the metric and measurement
    method used while still being insufficient to explain the network condition that
    produced it or to describe traffic outside the measured scope. This document provides
    guidance for interpreting IPPM measurement results. It considers the metric definition
    and parameters, the measured packet or traffic population, the observation scope,
    and the measurement method. It also discusses metric-specific considerations and
    differences among active, passive, and hybrid measurements. Operational information
    can support an interpretation, but this document keeps it separate from the metric
    result itself. This document does not define new metrics or measurement protocols,
    and it does not specify a mechanism for determining a unique operational cause.</p>"

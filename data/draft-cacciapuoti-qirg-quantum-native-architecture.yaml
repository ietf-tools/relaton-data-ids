abstract:
- content: "<p>This document extends RFC 9340 by outlining a set of quantum-native
    architectural tenets for the design and evolution of the Quantum Internet. These
    principles should not be interpreted as dogmas, but as pragmatic guidelines and
    criteria for harnessing the unique properties of quantum entanglement within networked
    systems. Such design perspectives, while departing from aspects of classical Internet
    design, remain aligned with one of its foundational insights: the principle of
    constant change, articulated in RFC 1958. The document presents a quantum-native
    architectural framework that adopts an entanglement-packet-switching model and
    defines the architectural role and logical structure of quantum packets, with
    an explicit functional separation between the Quantum Data Plane and Quantum Control
    Plane. It introduces Quantum Internet Addressing as a complementary abstraction
    for quantum-native control and coordination, and Generalized Quantum Forwarding
    to encompass quantum-packet processing and the manipulation of entanglement resources.</p>"

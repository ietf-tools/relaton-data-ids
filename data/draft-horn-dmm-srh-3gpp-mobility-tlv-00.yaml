abstract:
- content: "<p>This document requests two Segment Routing Header (SRH) TLV codepoints.
    Both are containers for mobility metadata used by 3GPP user-plane functions. One
    does not change en route. The other may change en route. This document specifies
    the framing so that any Segment Routing node can skip either container. Sub-TLV
    types and their meaning are under 3GPP change control. Neither container changes
    IPv6 forwarding.</p>"

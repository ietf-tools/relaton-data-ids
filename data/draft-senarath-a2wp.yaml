abstract:
- content: "<p>AI Agents acting for people and organizations meet credential offers
    and presentation requests, for example when a website asks the Agent to prove
    an attribute before it continues. An AI Agent can be misled by the content it
    processes, so it should not possess credentials or keys, or decide what to disclose.
    This document defines the Agent-to-Wallet Protocol (A2WP), with which an AI Agent
    passes such an offer or request to a Wallet exactly as it received it. The Wallet
    decides whether to act, obtains approval when needed, and performs the issuance
    or presentation with the Issuer or Verifier. The AI Agent learns the outcome and
    receives any continuation the Issuer or Verifier returns, so it can resume its
    task. Credentials, presentations and keys never reach the AI Agent.</p>"

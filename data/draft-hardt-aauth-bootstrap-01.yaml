abstract:
- content: "<p>This document provides informational guidance for agent providers (APs)
    on enrolling agents and issuing AAuth agent tokens defined in [I-D.hardt-oauth-aauth-protocol].
    It covers per-platform key handling, optional platform attestation, agent identifier
    strategies, and refresh patterns. The mechanisms described here are not normative
    protocol — they are common patterns that interoperable AP implementations can
    adopt or adapt.</p>"

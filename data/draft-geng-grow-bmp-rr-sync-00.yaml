abstract:
- content: "<p>The BGP Monitoring Protocol (BMP) provides full visibility into BGP
    Routing Information Base (RIB) state across routers and collectors. However, transient
    network faults, process restarts, or buffer overflows can cause data inconsistencies
    between the BMP sender's authoritative RIB and the collector's stored view. Existing
    recovery requires tearing down BMP sessions or re-exporting all peers, introducing
    severe operational disruption. This document defines a new BMP message type, the
    BMP Route-Refresh message. It encapsulated standard BGP Route-Refresh and Enhanced
    Route-Refresh semantics within BMP to enable fine-grained, non- disruptive, and
    targeted per-peer or per-AFI/SAFI RIB view re- synchronization.</p>"

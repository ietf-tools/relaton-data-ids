abstract:
- content: "<p>This document defines an optional object authentication extension for
    the Radio Image Framing Protocol (RIFP). A critical header TLV authenticates the
    compact object descriptor using HMAC-SHA-256 and a pre-shared key. The descriptor
    binds the encoded image digest and decoding parameters to a session and chunk
    count. The extension uses existing RIFP framing, fragmentation, retransmission
    and offline IQ workflows. It does not provide confidentiality, replay protection
    or a public-key digital signature.</p>"

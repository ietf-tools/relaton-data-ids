abstract:
- content: "<p>This document defines requirements for session-based and sessionless
    interactions between entities. For session-based interactions, it covers endpoint
    authentication, capability negotiation, session establishment, authorization,
    and lifecycle management. It also defines security and state requirements for
    interactions, such as notifications, probes, and atomic requests, that do not
    establish a session. It is assumed that the entities involved already know of
    each other; how they came to know each other is outside the scope of this document.
    At least one party to an interaction is an agent as defined in Section 3. This
    document is intended as a contribution to the agentproto working group's use cases,
    gap analysis, and requirements deliverable.</p>"

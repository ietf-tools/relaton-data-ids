abstract:
- content: "<p>Existing agent interoperability protocols move tasks (A2A) and money
    (x402, AP2) but provide no mechanism that binds work to payment to proof of completion.
    This document specifies PACT (Propose, Agree, Complete, Trust), an application-layer
    contract protocol for commerce between autonomous agents. PACT defines (1) a sealed-bid
    second- price task-award procedure; (2) the Verifiable Task Contract (VTC), a
    signed JSON object binding parties, scope, price, verification method, and liability;
    (3) escrowed, optimistically released settlement with a fraud-proof challenge
    window; (4) graded verification methods ranging from deterministic re-execution
    to zero- knowledge proofs of inference and staked arbitration; and (5) co- signed
    Work Attestations from which agent reputation is derived as a byproduct of settlement.
    PACT composes existing primitives: Decentralized Identifiers, JSON Web Signatures,
    OAuth token-exchange delegation chains, the x402 payment protocol, and AP2 mandates.</p>"

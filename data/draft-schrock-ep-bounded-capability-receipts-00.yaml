abstract:
- content: "<p>Agents sometimes need bounded authority to perform more than one consequential
    action without obtaining a new human approval for every operation. A signed token
    alone cannot enforce a shared budget across replicas, survive retries safely,
    or distinguish an operation that never crossed an effect boundary from one whose
    outcome is unknown. This document defines a bounded capability receipt and a durable
    reserve-execute-commit protocol. The receipt binds an issuance authorization,
    a closed action scope, a budget with explicit units, a holder proof, an expiry,
    and any parent capability. The state protocol atomically refuses overspend and
    replay, fences concurrent owners, and charges an indeterminate operation when
    an external effect may have occurred. It also defines narrowing-only delegation
    and evidence interfaces. It does not make a bearer token into human approval,
    does not provide offline global double-spend prevention, and does not claim that
    an authorized action was safe, lawful, or successfully executed.</p>"

abstract:
- content: "<p>This document specifies the Radio Image Framing Protocol (RIFP), a
    compact, unidirectional object-transfer protocol intended for transmitting images
    over low-rate radio links. RIFP defines independently synchronized frames, a versioned
    and extensible binary header, fragmentation and reassembly rules, a fixed binary
    object descriptor, optional JSON metadata, per-frame CRC-32 protection, whole-object
    SHA-256 verification, and registries for future frame types, flags, header extensions,
    media encodings, and radio profiles. RIFP is independent of a particular frequency
    allocation or modulation. This document also defines an initial continuous-phase
    binary frequency-shift keying profile named rifp-cpfsk-4800. The profile can be
    used on frequencies where local regulation permits such operation; 433.92 MHz
    is a common deployment example but is not mandated by this specification.</p>"

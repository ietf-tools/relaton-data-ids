abstract:
- content: "<p>This document describes the Static Rate Management (SRM) solution for
    L4S (Low Latency, Low Loss, Scalable Throughput) rate control. SRM utilizes a
    Two-Rate, Three-Color Marker (trTCM) policer in conjunction with a dual-queue
    mechanism to provide low latency and low loss for L4S flows in environments where
    a fixed, safe rate can be reliably defined for a network link or segment. This
    approach offers an alternative to Active Queue Management (AQM)-based L4S solutions,
    particularly for high-speed and aggregated networks with limited packet processing
    capabilities. This document details the operation, advantages, disadvantages,
    and configuration guidelines for SRM.</p>"

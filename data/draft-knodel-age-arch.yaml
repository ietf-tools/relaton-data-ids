abstract:
- content: "<p>This document describes solution-agnostic and technology-neutral schema
    for how various intermediaries can gate content and services based on age. The
    analysis of the architecture is done along two dimensions: the efficacy of permitting
    or restricting access based on age, and the privacy cost of doing so. The document
    concludes with recommendations as well as critical privacy, security and human
    rights considerations.</p>"

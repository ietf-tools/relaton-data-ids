abstract:
- content: <p>This document specifies version 1.3 ("Reader Profile") of the Agentic
    Reasoning Protocol (ARP). ARP defines a JSON manifest, served at a well-known
    location, in which the operator of a domain publishes a self-description of an
    entity, and an optional Ed25519 signature that binds the manifest to the domain
    through a public key in a DNS TXT record. A valid signature shows that the domain
    operator published exactly this file and that it has not been altered since; it
    does not show that the statements in the file are true. Version 1.3 adds a wording
    profile that limits manifest text to third-person statements about the entity,
    a required provenance statement, a readable description of the signature with
    pointers for checking it, a Markdown representation bound to the manifest by a
    SHA-256 digest, a discovery profile, and key revocation through an empty key value
    in the DNS record.</p>

abstract:
- content: "<p>This document defines OAuth Actor Receipts, an optional companion provenance
    profile for delegated OAuth tokens that conform to the OAuth Actor Profile for
    Delegation. It introduces the actor_receipts claim, a signed per-hop receipt chain
    that records which issuer added each visible actor hop, optionally preserves the
    historical top-level cnf value associated with that hop subject to deployment
    disclosure policy, and links receipts together so recipients can validate prior-
    hop provenance without relying solely on the current outer token issuer. This
    document also defines metadata and introspection parameters for advertising and
    consuming actor-receipt support.</p>"

abstract:
- content: "<p>The Computing-Aware Traffic Steering (CATS) framework introduces the
    concept of a Service Contact Instance (SCI) as the client-facing entity responsible
    for receiving and dispatching service requests. While existing drafts define the
    framework and metrics, the concrete functional behavior of a Service Contact Instance
    remains underspecified. This document fills that gap by defining the functional
    implementation of a CATS Service Contact Instance. Specifically, it specifies
    how an SCI collects, aggregates, and reports service instance metrics to the CATS
    Service Metric Agent (C-SMA); how it monitors the health and status of underlying
    service instances; how it dispatches client requests to the most appropriate service
    instance based on local policy and real-time conditions; and how it maintains
    affinity and handles failure scenarios. This document complements [I-D.ietf-cats-framework]
    and [I-D.zhangb-cats-service-metrics-op] by providing the operational execution
    layer for the SCI.</p>"

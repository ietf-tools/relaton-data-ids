abstract:
- content: "<p>Audit receipts record what a gateway wrote about an access. They omit
    how data changed and whether every access left a receipt. This document defines
    two evidence payloads for those gaps. Transformation Evidence states which value
    classes were transformed, and how, without carrying values. Coverage Reconciliation
    compares source activity counters with a receipt set over a window. Each item
    is matched, observed without a receipt, receipted without an observation, excluded,
    or indeterminate. The result is not a bare pass. Both payloads register as Signed
    Statements on a SCITT Transparency Service. This document defines no new receipt
    format, transparency mechanism, or signature format.</p>"

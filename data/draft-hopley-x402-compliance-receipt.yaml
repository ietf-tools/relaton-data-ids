abstract:
- content: "<p>This document specifies a categorical compliance screening receipt
    format for agentic-payment flows. The format is designed for use by AI agents
    and agentic-payment gateways that perform regulatory screening at admission time
    and must retain the screening decision under framework-bound retention obligations
    (UK Money Laundering Regulations 2017; Proceeds of Crime Act 2002 Section 330;
    EU Anti- Money Laundering Directives 5 and 6; Markets in Crypto-Assets Regulation
    Article 80; Anti-Money Laundering Regulation Article 56; Digital Operational Resilience
    Act Article 14). The receipt format uses a closed enumeration of categorical outcomes
    (ALLOW, REFER, DENY) rather than a continuous score or tier projection. The categorical
    outcome is load-bearing for downstream regulatory obligations: under UK POCA 2002
    Section 330, a REFER carries a mandatory Suspicious Activity Report obligation
    that a DENY does not. A score or tier projection collapses this distinction. Receipts
    are canonicalised under RFC 8785 (JSON Canonicalization Scheme) with an in-band
    canonicalisation rule pin (canon_version). The pin enables year-five re-verification
    from retained bytes alone, without dependence on an out-of-band rule registry
    that the operator must continue to publish. This document is complementary to
    draft-vauban-x402-stark-receipts: that document covers cryptographic settlement-time
    payment-condition proofs; this document covers admission-time compliance screening
    receipts. The two compose via the composite trust-query algorithm specified in
    specs/composite-trust-query.md in x402-foundation/x402.</p>"

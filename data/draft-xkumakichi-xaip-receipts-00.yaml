abstract:
- content: "<p>This document defines a wire format for signed execution receipts produced
    by AI agents when they invoke tools, services, or other agents. A receipt records
    the minimum facts needed to make a trust decision about a future call: who acted,
    who delegated, what tool was used, whether the call succeeded, how long it took,
    and how the call's inputs and outputs are identified (without disclosing their
    contents). The format is intentionally tool-system-agnostic. The same receipt
    structure can be emitted by MCP (Model Context Protocol) servers, LangChain.js
    callback handlers, OpenAI tool-calling loops, HTTP clients, or proprietary agent
    runtimes. Receipts use Ed25519 signatures over a JSON-canonicalized payload, and
    identities are W3C Decentralized Identifiers (DIDs). Scoring policy, aggregation
    architecture, and reactive behavior in response to receipts are explicitly out
    of scope and left to deployments.</p>"

abstract:
- content: "<p>This document proposes a DID-based framework for service discovery,
    authentication, and authorization of MCP (Model Context Protocol) Agents, based
    on the W3C Decentralized Identifier (DID) standard. The framework uses the did:web
    and did:key methods to provide verifiable, decentralized identifiers for MCP Clients
    and Servers. It defines DID method selection, DID Document extensions, service
    discovery mechanisms (including URL derivation, DNS-based discovery, and directory-based
    capability queries), and a challenge-response mutual authentication protocol.
    The framework also describes coexistence with OAuth 2.0 and enables trust establishment,
    dynamic capability-based service discovery, and fine-grained authorization with
    portable identities.</p>"

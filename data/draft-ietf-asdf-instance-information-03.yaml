abstract:
- content: <p>This document specifies instance-related messages to be used in conjunction
    with the Semantic Definition Format (SDF) for Data and Interactions of Things
    (RFC 9880). Split into four "archetypes", SDF messages are always governed by
    SDF models, strictly separating instance and class information. _Context_ information
    plays a crucial role both for lifecycle management and actual device interaction.
    // This revision refines the structure and terminology used with SDF // messages,
    and further improves the alignment with the non- // affordance draft and its sdfContext
    keyword.</p>

abstract:
- content: "<p>This document defines a YANG data model for the BGP Segment Routing
    (SR) Policy address families (RFC 9830). The model augments the BGP YANG model
    to add the IPv4 SR Policy (AFI, SAFI = 1, 73) and IPv6 SR Policy (AFI, SAFI =
    2, 73) address families, including SR Policy- specific configuration, the SR Policy
    RIB, per-neighbor Adj-RIBs, and the decoded SR Policy candidate path information,
    such as preference, Binding SID, and segment lists.</p>"

abstract:
- content: <p>This document describes a mechanism, deployed in production as part
    of the "AI Docking Port" discovery protocol, for bounding the traffic cost of
    stateless agent-to-agent forwarding across a network of independent nodes with
    no central registry. When a node forwards a request to its neighbors, and those
    neighbors may forward again, request cost grows as fanout^depth; absent an explicit
    bound this cost is paid by relaying operators rather than the requester. This
    document specifies two operator-controlled limits, max_depth and max_fanout, published
    in a node's discovery manifest, and the forwarding behavior they constrain. It
    is submitted for discussion as a possible contribution to ongoing community work
    on agent discovery and invocation protocols, including the W3C Community Group
    "AI Agent Protocol".</p>

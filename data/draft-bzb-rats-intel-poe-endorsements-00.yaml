abstract:
- content: "<p>A Platform Ownership Endorsement (POE) is a signed statement that a
    specific Intel confidential-computing platform instance, identified by its Platform
    Instance Identity (PIID), belongs to a named owner. POEs let a Verifier bind the
    attested hardware identity from an Intel SGX or TDX platform to an operational
    owner (e.g., a Cloud Service Provider) during appraisal, giving a Relying Party
    a trustworthy owner identity -- without trusting the attestation service or any
    in- band claim from the platform itself. This document defines POE as a profile
    of the IETF Concise Reference Integrity Manifest (CoRIM) data model.</p>"

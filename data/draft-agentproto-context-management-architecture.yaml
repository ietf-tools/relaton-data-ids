abstract:
- content: "<p>Agentic applications increasingly distribute a single objective across
    autonomous agents, tools, and services implemented by different vendors, operated
    by different organizations, and connected through different protocols. A single
    activity may contain multiple pairwise dialogs, multiple tasks within each dialog,
    tool invocations, derived resources, downstream delegations, and later interactions
    that reinterpret or reuse artifacts produced earlier in the activity. Existing
    protocols provide useful local identifiers for their own interactions, but those
    identifiers do not by themselves provide a common information model for correlating
    independently maintained dialogs, tasks, and resources across protocol and administrative
    boundaries. This document defines an information model consisting of Activities,
    Dialogs, Tasks, Resources, and typed Relationships. It distinguishes Activity
    correlation from protocol-local Dialog context, and distinguishes stable resource
    identity and provenance from locally defined interpretations. As such, this document
    develops a context-and-correlation information-model architecture, not a functional
    reference architecture or a wire protocol. It identifies relevant objects and
    relationships, relevant to maintaining coherent context, and examines the implications
    for preserving and propagating their correlations. It does not define the procedures
    by which applications execute work. The model distinguishes the logical extent
    of an Activity, which may extend beyond protocol-managed correlation; extending
    that coverage is selective, while maintaining established managed correlations
    entails responsibilities.</p>"

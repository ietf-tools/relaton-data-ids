abstract:
- content: "<p>This document defines the moqt URI scheme, URI resolution mechanisms,
    and discovery methods for the Media over QUIC Transport (MOQT) protocol. It specifies
    the URI syntax, fragment identifiers, dereferencing procedures, normalization
    rules, and X.509 certificate matching for moqt URIs. It also defines DNS-based
    resolution using SVCB and SRV records, as well as local network discovery via
    mDNS and DNS-SD.</p>"

abstract:
- content: "<p>This specification defines how an authorization server registers a
    client through OAuth 2.0 Dynamic Client Registration (RFC 7591) on a Client ID
    Metadata Document (CIMD) software statement, as defined in a companion specification.
    Such a statement carries no client metadata of its own. It vouches for the exact
    octets of the client's document, and the authorization server takes every registered
    metadata value from that document rather than from the registration request. This
    specification also bounds the registration's validity by the statement's expiry,
    which RFC 7591 leaves unbounded, and defines how a client renews the registration
    by delivering a later statement, which also updates the registered metadata.</p>"

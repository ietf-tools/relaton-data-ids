abstract:
- content: "<p>Protocol implementations frequently combine specification checks, deterministic
    test vectors, security testing, independent reproduction, and release decisions.
    A common failure mode is evidence collapse: a result at one assurance level is
    silently treated as sufficient for a stronger conclusion. This document defines
    Verification Promotion Boundaries (VPB), a machine-readable profile and state-transition
    procedure that separates specification validation, local conformance, independent
    reproduction, authorized security testing, and release eligibility. VPB also defines
    dual- state handling for specification defects: detecting a bad normative vector
    is negative evidence about the tested subject but may be positive fault-detection
    evidence about the verifier. Unknown evidence never promotes. This document does
    not define a new cryptographic primitive, authorization protocol, or IETF certification
    program.</p>"

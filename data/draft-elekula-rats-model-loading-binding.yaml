abstract:
- content: "<p>AI inference execution depends on the relationship between model artifacts,
    transformations applied to those artifacts, model-loading mechanisms, inference
    runtimes, and execution hardware. Evidence that independently identifies a model
    artifact and an inference runtime does not establish that the identified artifact
    was admitted into the identified runtime. This distinction becomes material when
    model artifacts are decompressed, quantized, compiled, sharded, combined with
    adapters, transferred to accelerators, or dynamically replaced before or during
    execution. This document defines Model Admission Binding (MAB) as an attestation-oriented
    relationship between an identified model artifact set, its transformation history,
    a model-loading event, an identified inference-runtime instance, and the execution
    domain into which the resulting representation is admitted. The document applies
    the Remote ATtestation procedureS (RATS) architecture defined in RFC 9334 and
    examines the use of Entity Attestation Tokens (EAT) and the measured-component
    information model defined in RFC 9711 and RFC 10013. It identifies the measurement
    and provenance requirements necessary to establish model admission, distinguishes
    source-artifact identity from the identity of the representation actually consumed
    by a runtime, and defines the conditions under which a Verifier can appraise the
    resulting relationship. Model Admission Binding is an information and assurance
    concept. This document does not define a new RATS role, attestation protocol,
    EAT serialization, registered Claim, Evidence conveyance protocol, or appraisal-policy
    language. It identifies how existing RATS mechanisms can represent and appraise
    a model-to-runtime relationship and identifies the implementation requirements
    that make that relationship verifiable.</p>"

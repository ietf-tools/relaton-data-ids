abstract:
- content: "<p>HUMIA defines a website-first mechanism for publishing a machine- readable
    cooperation policy for AI agents. A website publishes a JSON policy at /.well-known/humia.json.
    The policy identifies the origin and expresses site-level conditions for public-content
    access, selected AI usage purposes, attribution, and optional usage reporting.
    HUMIA does not replace the Robots Exclusion Protocol, authentication, authorization,
    licensing, or access-control mechanisms. It is an additional cooperation layer.
    This document also defines an optional, experimental Humia: discovery record in
    robots.txt that points HUMIA-aware agents to the canonical policy URI.</p>"

abstract:
- content: "<p>In EVPN multi-homing deployments, multiple PE devices attached to the
    same Ethernet Segment each originate Ethernet Auto-Discovery (EAD) routes. Standard
    BGP best-path selection retains only one route per NLRI key, which can suppress
    reachability information needed for EVPN aliasing, fast convergence, and split-horizon
    filtering. This document specifies that BGP speakers MUST treat EAD routes as
    multipath and MUST advertise and install all valid EAD routes for a given Ethernet
    Segment, rather than selecting a single best path.</p>"

abstract:
- content: <p>This document updates RFC 9970. RFC 9970 recommends STIR PASSporTs on
    re-INVITE and BYE requests after connected identity has been established in a
    SIP dialog, and states that this prevents spoofed mid-dialog or dialog-terminating
    events. The baseline PASSporT construction used by RFC 8224 does not bind the
    SIP request method, CSeq number, Call-ID, or dialog tags. Consequently, a valid
    PASSporT can remain valid when a fresh signed in-dialog request is transformed
    into a different SIP request whose authenticated identity fields are unchanged.
    This document defines the "sipctx" PASSporT type. It binds the SIP request method
    and dialog/sequence context to the PASSporT. Implementations relying on PASSporT
    validation for mid-dialog request authenticity use this context binding as specified
    in this document.</p>

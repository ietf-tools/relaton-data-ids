abstract:
- content: "<p>P10 defines a third-party-verifiable binding for NotDemonstrated(reason=underdetermined).
    A conforming receipt carries two canonical witness worlds that are compatible
    with the same closed evidence set and produce different values for the same frozen
    claim. The witness result is checked against committed profile semantics and bound
    into a SCITT Transparent Statement containing an in-toto Statement v1 predicate.
    The result establishes underdetermination only relative to the declared profile
    and does not identify the actual world or establish either claim value as true.</p>"

abstract:
- content: "<p>This document specifies an experimental Legal AI Profile (LAP) for
    verifiable AI provenance, informed by the Verifiable AI Provenance (VAP) Framework.
    It defines event signatures, hash chains, signed batch commitments, external anchoring,
    and evidence packages for legal consultation, document generation, and fact checking.
    This revision aligns the LAP design with a pinned VAP v1.2.0 Draft 3 baseline.
    All LAP levels require Merkle trees and external anchoring. LAP Bronze, Silver,
    and Gold remain profile-specific levels; they do not establish VAP Core, Standard,
    or Full conformance. The document also defines bounded recovery, erasure records,
    human review records, and legal hold controls. Verification concerns recorded
    evidence within a declared scope. It does not prove that every real-world operation
    was captured, that an AI output is correct, or that legal obligations have been
    met. This is an individual Internet-Draft and a proposed profile, not an IETF
    standard or a registered VAP profile.</p>"

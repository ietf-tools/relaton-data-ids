abstract:
- content: "<p>This document describes a manufacturer-assisted mechanism for distributing
    operational certification authority (CA) certificates to devices using Enrollment
    over Secure Transport (EST) or EST over secure CoAP (EST-coaps). The mechanism
    is intended for deployments in which a device is manufactured before the operational
    PKI and EST server trust anchors are known. The device is provisioned during manufacturing
    with a manufacturer trust anchor. An operational CA certificate bundle is subsequently
    signed by the manufacturer, or by a manufacturer- authorized signing authority,
    and delivered through a manufacturer- specific EST alias. The device validates
    the signed bundle using its manufacturer trust anchor before installing the contained
    CA certificates as operational trust anchors. This mechanism is limited to CA
    certificate bootstrap and does not change EST enrollment semantics, proof-of-possession
    requirements, certification authority policy, or authenticated EST operation following
    bootstrap.</p>"

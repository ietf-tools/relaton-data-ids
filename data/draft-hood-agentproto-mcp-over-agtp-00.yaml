abstract:
- content: "<p>This document specifies how the Model Context Protocol (MCP) is carried
    over the Agent Transfer Protocol (AGTP). MCP defines JSON- RPC 2.0 methods through
    which a language model application reaches tools, resources, and prompts. AGTP
    is a transfer protocol for agent traffic that carries agent identity, authority
    scope, delegation, and signed attribution as headers of every request and response.
    This document maps each MCP operation onto an AGTP method and path, states how
    JSON-RPC results and errors translate to the AGTP envelope and status codes, and
    specifies the identity, authorization, and attribution behavior an MCP client
    inherits when it speaks AGTP. It describes a gateway deployment in which an existing
    stdio MCP server is exposed over AGTP without modification, and it records the
    status of the running implementation.</p>"

abstract:
- content: "<p>This document reviews the use cases for Fast Network Notifications
    (FANN) that have been described in a number of individual drafts. Use cases are
    grouped by deployment scenario (data center network, data center interconnect
    and wide area network) aligned with the deployment scenarios of the FANN framework.
    Each use case is summarized briefly with a reference to the document that describes
    it in detail. This is intended to help identify a representative set of use cases
    from which the key FANN requirements can be derived.</p>"

abstract:
- content: "<p>In an agent system, agents need to discover other agents, tool servers,
    and skills. Agent Resource Discovery (ARD) defines a manifest listing such resources
    and a lookup interface over it. This document specifies how a client (such as
    an agent) initially discovers an ARD manifest. This discovery is performed through
    the use of DNS Service Binding records, DNS-Based Service Discovery (DNS- SD),
    HTTP link relations, or well-known URIs. Each mechanism yields a set of manifest
    URIs. The manifest format, the lookup interface, and the binding of a manifest
    to its publisher are specified in the companion ARD documents.</p>"

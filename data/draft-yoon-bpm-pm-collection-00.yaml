abstract:
- content: "<p>This document specifies a YANG data model for the collection of Performance
    Monitoring (PM) data, based on the collection requirements of the performance
    management function defined in ITU-T G.7710. The model processes raw performance
    data sampled at a network node and produces structured data that can be retrieved
    by clients via pull-based mechanisms or delivered via push-based mechanisms such
    as YANG-Push. This document does not define new performance metrics; the base
    metrics are those of the IPPM framework, and the model specifies the collection
    and exposure of the operationally important subset.</p>"

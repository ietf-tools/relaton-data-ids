abstract:
- content: "<p>This document specifies EC-ACT, a keyed-verification anonymous credential
    scheme with a hidden credit balance. A Client spends a public amount and receives
    a fresh Credential for the remaining balance and a return amount chosen by the
    Moderator. The Moderator verifies each spend without learning the balance or linking
    it to issuance or to other spends. EC-ACT uses a pairing-free BBS-style signature
    and proofs over linear relations. This document defines its cryptographic operations,
    encodings, and security requirements. The MOLE protocols use EC-ACT as a Credential
    scheme.</p>"

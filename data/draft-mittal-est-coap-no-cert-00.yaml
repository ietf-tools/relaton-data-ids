abstract:
- content: "<p>This document specifies a profile for Enrollment over Secure Transport
    using secure CoAP, where the EST-coaps client is a field device that does not
    possess an initial device certificate, manufacturer certificate, or other certificates
    usable for DTLS client authentication. Instead, the device is authenticated during
    the DTLS handshake using a device-unique symmetric key or a pre- shared key derived
    from that device-unique key. This profile is intended for already registered and
    operational devices that do not possess a certificate suitable for EST-coaps client
    authentication but do possess a device-unique symmetric key that can be used for
    initial authentication during certificate enrollment. The mechanism preserves
    EST certificate enrollment semantics while replacing the initial certificate-based
    DTLS client authentication requirement with PSK-based DTLS authentication. [RFC9148]
    defines EST over secure CoAP and requires client authentication for EST-coaps
    functions, while [RFC7030] permits certificate-less TLS authentication scenarios
    for EST when suitable shared credentials are available.</p>"

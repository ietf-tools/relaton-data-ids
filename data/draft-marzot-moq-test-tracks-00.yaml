abstract:
- content: "<p>This document specifies moq-test-tracks, a protocol for testing Media
    over QUIC (MOQ) media implementations. Like moq-test, it carries its parameters
    to the publisher in the Track Namespace. The parameters describe a set of media
    tracks, including the catalog, packaging, codecs and delivery, so that any publisher
    that implements the protocol can generate media of the requested shape.</p>"

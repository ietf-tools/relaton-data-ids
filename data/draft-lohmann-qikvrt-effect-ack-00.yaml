abstract:
- content: "<p>This document defines the QIK-VRT Effect Acknowledgement Protocol (EFFECT_ACK),
    a protocol layer between technical transport acknowledgement and responsible semantic
    release. TCP acknowledgement confirms technical arrival. EFFECT_ACK confirms whether
    received information may responsibly continue as an effect. The protocol distinguishes
    TRANSPORT_ACK from EFFECT_ACK, defines five effect states, introduces a versioned
    and hash-linked Responsibility Protocol, and specifies deterministic hashing and
    canonical JSON requirements for reproducible audit.</p>"

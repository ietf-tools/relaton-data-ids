abstract:
- content: "<p>This document defines BGP Signed Origin Delegation Attestation (SODA),
    an optional transitive BGP path attribute that carries a signed authorization,
    issued by the holder of an IP prefix, delegating origination of that prefix to
    a specified Autonomous System (AS) until a stated expiry time. Using SODA, a validator
    performing Route Origin Validation (ROV) can determine whether an ROV-Invalid
    result reflects an authorized delegation rather than a route hijack.</p>"

abstract:
- content: "<p>In networks where Layer 2 (L2) interface bundles (such as a Link Aggregation
    Group (LAG) as defined in IEEE 802.1AX) are deployed, a controller may need to
    collect the connectivity relationships between bundle members for traffic engineering
    (TE) purposes. This document describes how Open Shortest Path First (OSPF) and
    Intermediate System to Intermediate System (IS-IS) advertise the remote interface
    identifiers for L2 bundle members. The corresponding extension of BGP Link State
    (BGP-LS) is also specified.</p>"
  language:
  - en
  script:
  - Latn
  format: text/html

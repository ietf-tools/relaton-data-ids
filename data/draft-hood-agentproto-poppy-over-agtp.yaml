abstract:
- content: "<p>This document specifies how the Personal Agent Protocol (PAP, also
    called Poppy) is carried over the Agent Transfer Protocol (AGTP). Poppy defines
    how a personal agent acting for one person discovers a company, opens a session,
    signs the person in with OAuth, and acts through the company's APIs, website,
    or agent. Poppy 1.0 specifies these exchanges over HTTPS. AGTP is a transfer protocol
    for agent traffic that carries agent identity, authority scope, delegation, and
    signed attribution as headers of every request and response. This document maps
    each Poppy exchange onto an AGTP method and path, binds the Poppy client identifier
    and User ID to the AGTP identifier stack, states which Poppy functions AGTP headers
    supply and which remain with OAuth over HTTPS, and records the open issues the
    mapping raises. It defines no change to Poppy.</p>"

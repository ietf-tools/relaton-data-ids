abstract:
- content: '<p>Autonomous AI agents executing consequential actions in high-stakes
    domains — medical prescribing, financial transactions, critical infrastructure
    control — require authorization mechanisms that go beyond classical identity verification.
    Existing mechanisms (passwords, static biometrics, digital signatures) verify
    who authorized an action but cannot verify whether the authorizing human was genuinely
    conscious, uncoerced, and cognitively capable at the moment of authorization.
    This document specifies LICET (Latin: "it is permitted"), a cryptographic middleware
    protocol that binds AI agent authorization events to the real-time physiological
    state of the authorizing human. LICET defines: (1) a biometric capture and coercion-detection
    procedure using wearable sensor data; (2) per-event session-key derivation using
    HKDF (RFC 5869); (3) a biometric temporal signature using HMAC (RFC 2104); (4)
    a Schnorr zero-knowledge proof over the BN128 elliptic curve enabling third-party
    audit without biometric data exposure; and (5) a SHA-256 hash-chained ledger for
    tamper- evident authorization records. A reference implementation is publicly
    deployed at https://licet.dev/ v1/ and available as open source at https://github.com/christianrp45/
    licet-protocol.</p>'

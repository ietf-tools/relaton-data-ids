abstract:
- content: "<p>This document defines an architecture for distributed bandwidth management
    in Segment Routing (SR) networks. Distributed bandwidth management is a model
    in which the bandwidth required by each SR Policy is computed and reserved in
    a distributed manner by the network nodes themselves, rather than by a centralized
    controller, so that path computation, admission control, and bandwidth accounting
    for SR Policies are performed by the head-end and transit nodes along the path.</p>"

abstract:
- content: "<p>ICMP error messages provide feedback used by hosts to manage network
    communication. Existing validation of the quoted invoking packet is essential,
    but its resistance to blind off-path forgery depends on the information quoted
    and the communication state available to the receiver. This document describes
    a Challenge-Confirm mechanism that supplements existing ICMP validation. After
    an eligible initial error passes existing checks, the host can mark the associated
    flow and include an unpredictable token in an IPv4 option of a subsequent packet
    that would otherwise be transmitted. Receipt of the initial error does not immediately
    generate a probe or a separate ICMP Echo Request. A later ICMP error can return
    the token by quoting the invoking packet. The token is computed using a secret
    local to the validating host. No key is shared with routers or peer hosts, and
    no per-challenge nonce cache is required. Successful token validation provides
    evidence of access to a valid token; it does not authenticate a router's identity
    or the semantics of the reported error. This document specifies bounded triggering,
    replay limitations, and deployment considerations, including the need to evaluate
    IPv4 option traversal and quotation. It does not report Internet-wide deployment
    measurements.</p>"

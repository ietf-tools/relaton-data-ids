abstract:
- content: "<p>This document proposes an Agent Authorization Center (AAC) for user-
    side intelligent agents, enabling them to access resource parties on behalf of
    users through either autonomous approval or human authorization modes. The AAC
    maintains user-agent associations and personalized authorization policies, balancing
    agent autonomy with user control.</p>"

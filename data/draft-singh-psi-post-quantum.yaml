abstract:
- content: "<p>This document specifies the post-quantum cryptographic sealing extension
    for the Proof of Sovereign Integrity (PSI) Protocol. While classical Ed25519 signatures
    provide current security, the emergence of cryptographically relevant quantum
    computers (CRQCs) threatens all elliptic-curve and RSA-based signature schemes.
    PSI addresses this through dual-signature sealing: each seal carries both an Ed25519
    signature (for immediate classical verification) and an LMS-W4-SHA256 hash</p>"

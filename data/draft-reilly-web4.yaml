abstract:
- content: '<p>The term "Web4" has been used in industry and press coverage without
    a technical definition, a conformance target, or a testable claim. This document
    supplies one. It defines Web4 as an architectural profile of the existing Web
    in which (1) published content carries independently verifiable permanence evidence,
    (2) the machine channel is a first-class interface rather than an artifact of
    scraping, (3) autonomous agents operate under recorded, bounded, and revocable
    authority, and (4) human readers retain disclosed control over agent- curated
    presentation. Web4 as specified here is not a new network, a new protocol stack,
    or a replacement for HTTP. It is a composition profile: a set of normative requirements
    that a deployment either meets or does not, assembled from a family of previously
    published Internet-Drafts. This document specifies the profile, defines the Web4
    Attestation Record (W4AR) that a conforming deployment emits, states the requirements
    that apply to agentic pipelines operating inside such a deployment, and identifies
    the running reference implementations against which the profile has been exercised.
    The profile is assembled from a suite of Internet-Drafts authored by Lawrence
    J. Reilly Jr. between September 2025 and August 2026, and is first specified as
    a unified conformance target in this document.</p>'

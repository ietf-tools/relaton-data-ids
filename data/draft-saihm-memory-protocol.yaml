abstract:
- content: "<p>This document defines the Sovereign AI Horizontal Memory (SAIHM) protocol,
    a memory layer for AI agents. A SAIHM client seals every memory cell before it
    leaves the holder's machine, under a random data-encryption key that is wrapped
    under a key-encryption key only the client holds; the operator stores signed envelopes
    of ciphertext and wrapped keys and never holds a key able to decrypt them. The
    protocol specifies post-quantum identity binding (ML-DSA-65), authenticated sharing
    (ML-KEM-768), and cryptographic erasure by destruction of every operator-held
    copy of a cell's wrapped key, distinguished normatively from access-control erasure.
    SAIHM lets agents that use the Model Context Protocol (MCP) persist, share, and
    erase memory across sessions, models, and vendors. It is intended to complement
    IETF work on agent dialog management and conversation data containers without
    overlapping it.</p>"

abstract:
- content: "<p>Large Language Model (LLM) API services can be hosted on workstations,
    local servers, and other devices in a local network. AI applications commonly
    access these services through manually configured API base URLs and interface
    settings. When an application joins a different network or a service address changes,
    these settings may need to be updated even when a suitable local service is already
    available. This document specifies a DNS-Based Service Discovery (DNS-SD) profile
    for discovering LLM API services on a local link. An advertiser publishes the
    service location and a small set of API connection parameters. A discovery client
    resolves these records and offers the resulting connection information to an AI
    application or its configuration adapter. Subsequent LLM API requests are sent
    directly to the discovered service, not through the advertiser or discovery client.
    Discovery does not establish trust, distribute credentials, select models, or
    define an application's configuration file format.</p>"

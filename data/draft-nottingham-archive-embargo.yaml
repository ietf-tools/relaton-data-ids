abstract:
- content: <p>Web sites often block archiving crawlers because they host time- sensitive
    information. This specification documents a robots.txt extension, "Archive-Embargo",
    that can be used to request that such crawlers delay publication of information.
    This document updates RFC 9309 to add two directives that support embargoes.</p>

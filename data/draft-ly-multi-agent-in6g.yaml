abstract:
- content: "<p>This document describes the progress of 6G study on AI topic, e.g.
    key issues, potential solutions and alternative communication protocols. Despite
    the apparent overlap between 3GPP and IETF in the hot topics of Agents e.g. communication
    protocols, discovery, authorization and etc., 3GPP and IETF address different
    problems due to consideration of network boundaries. Thus this document tracks
    the progress of 6G study to identify dependencies on IETF protocols within the
    agent communication topics.</p>"

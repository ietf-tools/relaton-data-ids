abstract:
- content: <p>Evolution toward network operations automation requires systems encompassing
    software-based analytics and decision-making. Network- based instrumentation provides
    crucial data for these components and processes. However, the proliferation of
    such instrumentation and the need to migrate the data it generates from the physical
    network to "off-the-network" software poses challenges. In particular, analog
    measurement instrumentation, which generates time-continuous real-number data,
    may generate significant data volumes. This document discusses methodologies for
    handling analog measurement instrumentation data, informed by the requirements
    of network digital twins and of automated fault diagnosis. It proposes that instrumentation
    report, for each measured quantity and each interval, a summary that keeps the
    level, the rate of change, the departure from a steady trend, the extremes over
    a stated short window and the number of measurements taken. Such summaries can
    be combined exactly over any longer span, and they allow trends, brief events
    and stopped measurements to be detected and reported as they occur.</p>

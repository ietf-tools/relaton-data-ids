abstract:
- content: "<p>OAuth 2.0 Rich Authorization Requests (RAR) [RFC9396] standardizes
    the exchange and processing of authorization details but does not define metadata
    for describing authorization details types. In addition, no interoperable guidance
    is offered to clients, to remediate failures by resource servers due to insufficient
    authorization details. This document addresses this interoperability challenge,
    allowing clients to dynamically discover metadata instead of relying on out- of-band
    agreements, as well as standardizes failure signaling including interoperable
    remediation when insufficient authorization details are the cause of failure.</p>"

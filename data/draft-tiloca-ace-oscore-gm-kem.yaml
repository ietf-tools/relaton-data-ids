abstract:
- content: "<p>RFC 9594 defines a Key Distribution Center (KDC) to provision keying
    material for secure group communication, using the Authentication and Authorization
    for Constrained Environments (ACE) framework. An instance of KDC is the Group
    Manager for provisioning keying material in group communication scenarios that
    use the Constrained Application Protocol (CoAP) and the security protocol Group
    Object Security for Constrained RESTful Environments (Group OSCORE). To make the
    pairwise mode of Group OSCORE post-quantum secure, it is possible to rely on a
    quantum-resistant Key Encapsulation Mechanism (KEM) as the Pairwise Key Agreement
    Algorithm used to derive pairwise keys. This document extends the interface of
    the ACE-based Group Manager to allow for the exchange of KEM public keys and encapsulated
    KEM shared secrets among group members via the Group Manager, thus enabling the
    post-quantum secure derivation of pairwise keys in Group OSCORE. Furthermore,
    this document accordingly extends the set of parameters that can be used to specify
    the configuration of an OSCORE group at the Group Manager.</p>"

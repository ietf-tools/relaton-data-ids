abstract:
- content: "<p>This document defines the Graviteron, a unit that states how much signed,
    independent evidence supports or contradicts a claim. A Graviteron reading is
    the weight of evidence of Turing and Good, expressed in decibans: ten times the
    base-10 logarithm of the factor by which independent checks change the odds of
    the claim. The document specifies the computation from operator verdicts and measured
    operator reliability, eight properties that every conforming implementation must
    satisfy, a reading format that is never a bare number, and language-neutral test
    vectors. It does not define a decision rule.</p>"

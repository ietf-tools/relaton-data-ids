abstract:
- content: '<p>This document specifies the "rttp" URI scheme. An "rttp" URI names
    a claim of intent directed at an identified subject; the address of that subject
    is derived by computation from the URI authority, and no lookup service, registry,
    or name-resolution system is consulted at resolution time. The document also states
    the requirements a client MUST satisfy when it handles such a URI, in order to
    avoid two failure modes that short, user-embeddable strings otherwise invite:
    using the authority as a navigation target (open redirect), and using a registered
    protocol handler as a general-purpose launcher.</p>'

abstract:
- content: "<p>The Multi-Vantage Path Snapshot (MVPS) family specifies coherence detection
    algebra [MVPS-V4] and trust profiles that authenticate vantage reports [I-D.melegassi-santos-ippm-mvps-cwt].
    The mathematical truth of the MVPS theorems is established off the wire, in companion
    proof documents and machine validators that emit numerical receipts. Without a
    normative binding layer, a consumer cannot verify WHICH theorem catalogue, proof
    revision, validator script, or receipt artifact a given deployment claim relies
    on, nor detect silent substitution of those artifacts. This document specifies
    the MVPS Proof Envelope: a canonicalized [RFC8785] manifest that lists theorem
    identifiers and the SHA-256 digests of the companion proof documents, validator
    scripts, and numerical receipts that support them, aggregated under a Merkle root
    [RFC9162] and anchored by the operator-epoch and witness-cosignature machinery
    of [I-D.melegassi-santos-ippm-mvps-cwt]. Verification of the envelope is tamper-evident
    under standard hash and signature assumptions (Theorem T-BIND-1) and traceable
    (Theorem T-TRACE-1). The envelope does NOT cryptographically prove the listed
    theorems; a proved theorem is a mathematical fact, not subject to cryptanalysis.
    The envelope makes the CHOICE OF PROOF ARTIFACTS tamper-evident. An OPTIONAL Post-Quantum
    Protection profile MAY replace the Ed25519 anchor signatures with ML-DSA-65 [FIPS204]
    while leaving the per-snapshot HMAC-SHA256 hot path unchanged (Theorem T-PQ-MIG-1).
    Security Considerations document a finite Grover-halved floor and explicitly defer
    any claim of perpetual security. Numerical receipts are regenerated by scripts/validate_proof_envelope.py
    (11/11 PASS) and stored in evidence/proof_envelope_receipt.json. Companion proofs
    are in [PROOF-ENVELOPE-PROOF].</p>"

abstract:
- content: "<p>This document specifies Carrier Identity Core, a minimal, proof- bearing
    identity kernel for content-derived node identity, canonical references, and finite
    structural graphs. It defines a finite-sequence substrate, a self-contained frame
    and hash interface, staged formation of immutable lanes, node bodies and proof-bearing
    occurrences, Qualified Node Keys, canonical reference construction, exact structural
    theorem schemas, and structural graph validity. Informative derivations of the
    exact structural theorem schemas are provided in an informative appendix. This
    document does not define computational security experiments, evidence records,
    proof admission, resource evaluation, consensus, liveness, finality, governance,
    or operational protocol behavior.</p>"

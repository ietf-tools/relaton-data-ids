abstract:
- content: "<p>A permit to effect once is not a permit to effect permanently. An approval,
    a policy decision, or one successful effect is not standing authority for a larger
    or repeated one. For AI machines and frontier AI models that can now act in the
    world, this separates a contained mistake from an irreversible one. Today, security
    checks who is asking, inspects a token, opens the gate, and hopes that the downstream
    network path, destination, or physical machine is safe. AI agents now send messages
    and files, move money, change production infrastructure, invoke tools, update
    model and memory state, release sensitive data, and drive vehicles, robots, and
    industrial equipment. Approval can show that an action was allowed in principle
    without showing that the exact action reaches the right recipient, device, or
    outcome. Simulations and dry-runs do not close this gap, because a simulation
    can pass in a clean sandbox while the real target, route, or actuator has been
    hijacked. Logs do not close it either, because a log explains a disaster after
    it has happened. This document makes reality a cryptographic dependency. The full-
    consequence command is held in a state that cannot execute. First, a deliberately
    bounded real effect is produced on the exact operational path: a trailing capsule,
    one record, a payment hold, a canary deployment, a constrained session, or a millimetre
    of actuator movement. The destination, transaction system, network element, sensor,
    or hardware controller then returns an Effect Confirmation Receipt. An Interim
    Effectuation Validator validates that receipt out of band against the intended
    act, nonces, epoch, scope, destination, current policy, and revocation state.
    Only then does it issue the continuation instruction that reconstructs the key,
    releases the split credential, or unlocks the hardware register for the next phase.
    Without the receipt, the key for full effect does not exist on the machine. Evidence
    is therefore a structural dependency and not a log. Two properties are central.
    First, the validator never relays the original command: the micro-effect proceeds
    independently and the validator observes the proof from a distance, so compromising
    an inline proxy or manipulating routing through prompt injection does not hand
    over the keys. Second, uncertainty is a first-class state. If a micro-effect fires
    but trustworthy evidence is missing, the system quarantines and refuses progression
    instead of retrying, so an autonomous loop cannot compound a duplicate transfer,
    a double commit, or an over-actuation. These properties hold under stated assumptions,
    including receipt integrity, path completeness, and atomic consumption of continuation
    authority, which the document identifies. The architecture covers single-phase
    and multi-phase execution; human, automatic, hybrid, threshold, and hardware-rooted
    approval; anti-replay and anti-substitution controls; alternate-path closure;
    reconciliation of indeterminate outcomes; and rollback, compensation, and safe-state
    handling. It consolidates thirty-five workflow profiles across communications,
    files, payments, databases, cloud and model deployment, AI tool invocation, data
    export, robotics, vehicles, UAVs, industrial control, radio and satellite systems,
    GPU and accelerator egress, and software and firmware activation. The Safety-First
    Critical-System Profile applies where avoiding catastrophic or hard-to-reverse
    outcomes comes before minimum latency: a deployment MUST NOT remove a validation,
    receipt, anti- replay, or safe-state protection merely to be faster, when protected
    policy classifies it as necessary for the consequence class.</p>"

abstract:
- content: "<p>This document specifies a DKIM (RFC 6376) iteration that allows cryptographical
    verification of SMTP (RFC 5321) envelope data, and of any signature along the
    message path, even beyond IMF (RFC 5322) message content changes. It addresses
    existing security glitches, and introduces active mitigations to embrace collateral
    damage effects of email solutions of the younger past by a standardized solution,
    also by moving complexity away from lower network protocol layers, where problems
    cannot be solved. It updates DKIM in certain aspects that reality has proven to
    be superfluous, incomplete, or obsoleted.</p>"
  language:
  - en
  script:
  - Latn
  format: text/html

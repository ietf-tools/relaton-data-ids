abstract:
- content: "<p>AI agents increasingly act on information they cannot check: what a
    business can supply, what a person said, what rules a platform applies. This document
    describes a minimal way to make such statements accountable. Every statement is
    signed by its author, bound where possible to a domain the author controls, and
    sealed in a public append-only Merkle log whose tree heads are signed, timestamped
    and publicly monitored. The design proves who said what and when, and that the
    record was not rewritten. It deliberately does not attempt to prove that a statement
    is true.</p>"

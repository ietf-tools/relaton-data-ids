abstract:
- content: "<p>This document describes a deployment model and operational considerations
    for rate control in Segment Routing over IPv6 (SRv6) network slices. It leverages
    a token-bucket scheduler to differentiate Committed Information Rate (CIR) and
    Peak Information Rate (PIR) traffic, and describes how a headend may enforce a
    rate profile on an SR Policy and adjust the PIR based on network conditions. It
    addresses the operational trade-off between resource utilization and congestion
    avoidance in over-committed slice deployments.</p>"

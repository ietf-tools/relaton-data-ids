abstract:
- content: "<p>An agent executor can fail or be replaced after a consequential provider
    request may have crossed an effect boundary but before the outcome is known. Native
    authorization, succession, evidence- boundary, and bounded-capability mechanisms
    address parts of this interval, but they do not by themselves define how a replacement
    executor preserves the same provider operation and its unresolved evidence. This
    document defines a composition profile for one authoritative coordination domain.
    The profile preserves stable operation- occurrence identity, immutable provider
    bindings, authority accounting, uncertain evidence, and stale-executor fences
    across replacement. It defines no new receipt, identity, authority, provider,
    or ledger-migration format, and it does not require any particular evidence envelope.</p>"

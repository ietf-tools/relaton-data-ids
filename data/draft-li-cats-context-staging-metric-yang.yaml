abstract:
- content: "<p>This document specifies a Standards Track YANG 1.1 data model (ietf-
    cats-context-staging-metrics) and an on-demand deterministic CBOR query envelope
    for Computing-Aware Traffic Steering (CATS) service context-staging latency metrics.
    The specification defines three explicit observation-endpoint boundaries (transport-submit,
    remote- placement, and consumer-usable), enforces four-tuple snapshot view consistency
    (producer-id, boot-id, view-id, snapshot-id) with clock- uncertainty bounds, prohibits
    direct arithmetic addition of marginal latency quantiles across stages, and provides
    a point-to-point C-SMA to C-PS residency lookup envelope that avoids underlay
    routing protocol flooding.</p>"

abstract:
- content: "<p>The Mercurius Window System (MWS) is a zero-trust, network-native window
    system for contemporary desktops. It combines persistent, detachable graphical
    Sessions with network transparency. MWS works on a workstation without requiring
    network connectivity. The same Session model allows users to start a new Session
    or resume a detached Session, either at the workstation itself or from another
    device across the network. MWS complements local display systems such as Wayland.
    Applications and their state remain on the workstation, while a Portal provides
    the user's display and input facilities. Modern graphics APIs and authenticated
    transport support this separation between where applications execute and where
    a user interacts with them. This document specifies the Session, Window, and communication
    behaviour needed for independent implementations to interoperate.</p>"

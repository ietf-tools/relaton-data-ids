abstract:
- content: "<p>This document describes postcard-based on-path telemetry with packet
    marking (PBT-M) using an MPLS Network Actions (MNA) flag to support Operations,
    Administration, and Maintenance (OAM) in MPLS networks. The scheme uses a single
    flag bit carried in a Flag-Based Network Action Indicator (Opcode 1) of the MNA
    Sub-Stack as defined in RFC 9994. In addition to addressing the protocol requirements
    for applying PBT-M, this document provides comprehensive operational, manageability,
    and security considerations.</p>"

abstract:
- content: "<p>This document defines an experimental deep-space profile for the TLS
    TimeToken Secure Protocol (TTTPS). The profile preserves the Proof- of-Time record
    and cryptographic verification boundary while adding propagation-aware context
    for long and intermittent links. It specifies one-way-light-time handling, epoch-
    and frame-bound physical context, relative coordinate-time conversion, peer projection,
    conservative aggregation, and explicit HOLD and UNVERIFIABLE outcomes. It does
    not claim flight measurements, a live interplanetary mesh, or a replacement for
    CCSDS, DTN, or navigation standards.</p>"

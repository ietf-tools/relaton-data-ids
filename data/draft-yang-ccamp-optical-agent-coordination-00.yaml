abstract:
- content: "<p>Computing-aware optical networks coordinate optical connectivity with
    the capabilities, availability, and performance of computing services. This document
    describes an informational architecture for coordination among joint control,
    transport control, network element, and compute resource agents. These roles relate
    local observations to domain abstractions, assess connection-and-site candidates
    against a common service objective, and evaluate the combined service outcome.
    Computing resources may be located at edge, regional, or centralized sites. Coordination
    supports access to existing service instances and, where authorized, new workload
    placement or optical resource allocation. Resource managers retain admission and
    execution authority. The architecture is independent of optical switching technology
    and agent algorithm. An Optical Transport Network (OTN) and edge computing provide
    a detailed realization example; reinforcement learning is an optional policy use
    case. This document defines no new protocol, YANG module, or optical signal format.</p>"

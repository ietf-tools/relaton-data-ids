  format: text/plain
docid:
- id: draft-zhang-dnssec-wildcard-validation
  type: Internet-Draft
  primary: true
abstract:
- content: "<p>Validators for the DNS Security Extensions (DNSSEC) reconstruct the
    original owner name of a signed resource record set (RRset) using the RRSIG Labels
    field. If the reconstructed owner is outside the signing zone, a cryptographically
    correct signature can be misinterpreted as authenticating wildcard data belonging
    to another zone. Aggressive use of DNSSEC-validated caches can extend the effect
    to other names. This document updates RFC 4035 to require signer-zone containment
    of the reconstructed owner and updates RFC 8198 to preserve that authenticated
    relationship when reusing wildcard data. These requirements constrain DNSSEC authentication
    and cached reuse. They do not change DNS wildcard matching or synthesis rules,
    or DNS message formats.</p>"

abstract:
- content: "<p>IGP normally computes the shortest paths in a network for packet forwarding,
    without taking the traffic demands and available bandwidth into consideration.
    When there is a link degradation or partial link failure in a network which causes
    throughput reduction, or the volume of specific traffic flows increase dramatically,
    unexpected congestion may happen if only the shortest paths are used for IP forwarding.
    Conventional centralized Traffic Engineering (TE) focuses on long- term bandwidth
    and routes planning based on traffic demands, which can not react to the congestions
    in networks timely. This document describes a distributed path computation and
    load balancing mechanism named Elastic Bandwidth-aware Routing (EBR), which can
    alleviate congestions timely before TE finishes the global optimization. It allows
    IGP-enabled nodes which face congestion to distribute traffic among the shortest
    paths and load-balancing alternate paths through Segment Routing Traffic Engineering
    (SR-TE), with weights determined based on the bandwidth utilization and available
    bandwidth of these paths. It provides an efficient, accurate and backward compatible
    approach for dynamic link congestion avoidance.</p>"

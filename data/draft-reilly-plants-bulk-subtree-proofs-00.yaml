abstract:
- content: "<p>Merkle Tree Certificates require relying parties to periodically obtain
    a set of active landmark subtrees and verify each is consistent with a reference
    checkpoint of the issuance log. As specified, this requires one subtree consistency
    proof per landmark subtree. Because the active landmark subtrees form a contiguous
    range of the log, their individual consistency proofs share the great majority
    of their interior nodes, and verifying them independently carries substantial
    redundancy. This document defines a bulk subtree consistency proof, which verifies
    an entire set of landmark subtrees against a single reference checkpoint using
    proof material logarithmic in the size of the log, rather than logarithmic per
    subtree. It is a size optimization for the relying party update channel and introduces
    no change to certificate verification or to the security properties of Merkle
    Tree Certificates. The construction in this document has not yet been validated
    against a reference implementation. It is published to solicit review of the approach.
    Open items are recorded in an appendix.</p>"

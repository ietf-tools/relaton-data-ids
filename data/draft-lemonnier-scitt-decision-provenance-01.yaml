abstract:
- content: "<p>Build attestations, bills of materials and Signed Statements in a Transparency
    Service record what was built and by whom. Authorization receipts for agent actions
    can establish who approved an exact action; the statement profiles for agent actions
    record a human approval as the producer's claim. None of them carries the decision
    behind the action, the options considered, the reasons, the authority, and what
    the approver was shown, as a record a verifier can check. This document describes
    how a decision record and its action-binding attachment, as the extension proposals
    of the Decision Provenance Standard define them, sit under a release statement,
    a build attestation or an agent action record by typed digest references; how
    a verifier checks them offline, including the approver's signature where one is
    carried; and how the witness checkpoints of the anchoring extension are registered
    in a Transparency Service. Nothing in the SCITT architecture, in Signed Statements
    or in Receipts changes. A software release decision and an agent action capsule
    are the worked examples; the model has no feature specific to either. This document
    is independent of the Decision Provenance Standard, is not part of it, does not
    change it, and is not endorsed by its Steward.</p>"

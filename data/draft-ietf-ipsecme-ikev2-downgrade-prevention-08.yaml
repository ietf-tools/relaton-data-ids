abstract:
- content: "<p>This document specifies an extension to the Internet Key Exchange protocol
    version 2 (IKEv2) in which the peers authenticate the full IKE_SA_INIT transcript.
    When both peers implement the extension and at least one relevant authentication
    credential is not compromised, this prevents certain downgrade attacks on IKEv2.
    This document updates RFC 7296.</p>"

abstract:
- content: "<p>Closed-loop management of IP-connected edge-cloud services depends
    on measurements that retain their meaning across collectors, processing pipelines,
    and administrative domains. A metric name and numeric value are insufficient to
    determine whether a measurement can be compared, combined, or used at a particular
    decision time. This document proposes a compact operational profile connecting
    KPI definitions to observation scope, statistical populations, time windows, freshness,
    and data-quality evidence. It supplies calculation conventions for five KPI families,
    a consumer eligibility procedure, and worked examples. The profile is intended
    to complement existing telemetry and metric-definition mechanisms. It introduces
    no transport protocol, YANG module, or IANA registration.</p>"

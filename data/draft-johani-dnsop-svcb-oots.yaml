abstract:
- content: <p>This document defines a new Service Parameter Key (SvcParamKey), "oots"
    ("Opportunistic Operator-led Transport Signal"), for use in Service Binding (SVCB)
    and HTTPS resource records as defined in RFC 9460. The "oots" parameter allows
    the operator of an authoritative DNS nameserver to advertise, per DNS transport
    protocol (such as DNS over UDP/TCP, DNS over TLS, DNS over HTTPS, and DNS over
    QUIC), the operator's own assessment of the share of the nameserver's total query
    load that it is confident it can serve over that transport. The per-transport
    values are independent capability estimates rather than a distribution of queries
    across transports; they are opportunistic hints that a resolver MAY use to inform
    transport selection and MAY ignore entirely. This document provides the specification
    required by Section 14.3.1 of RFC 9460 for registration of the "oots" SvcParamKey
    in the IANA "Service Parameter Keys (SvcParamKeys)" registry.</p>

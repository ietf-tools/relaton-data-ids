abstract:
- content: "<p>This document defines a Media over QUIC Transport (MOQT) extension
    for atomically changing the Forward State of a set of established subscriptions.
    It allows a subscriber to replace one set of Tracks with another without an intermediate
    partially switched state at its peer.</p>"

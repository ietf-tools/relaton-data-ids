abstract:
- content: <p>This document defines a structured, iterative lifecycle for network
    anomaly detection systems to enable "human-in-the-loop" refinements. Key contributions
    include defining three lifecycle stages, a state machine for anomaly annotations,
    and YANG data models for standardized labeling and exchange.</p>

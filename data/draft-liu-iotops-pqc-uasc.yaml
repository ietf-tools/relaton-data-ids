abstract:
- content: "<p>This document specifies a post-quantum cryptographic protection profile
    for the OPC Unified Architecture Secure Conversation protocol (OPC UA UASC) carried
    over the opc.tcp transport. The profile uses ML-KEM-768 for SecureChannel key
    establishment, ML-DSA for asymmetric signatures, HKDF-SHA-256 for key derivation,
    and AES-256-GCM for symmetric message protection. It defines the profile identifiers,
    nonce encoding, key schedule, authenticated-encryption inputs, certificate and
    public-key binding requirements, token rollover behavior, and conformance requirements.
    This Internet-Draft is a proposal for Standards Track publication. Permanent OPC
    UA SecurityPolicy and algorithm identifiers require coordination with the OPC
    Foundation; the private identifiers documented here remain provisional. This document
    does not assign official OPC UA identifiers or claim conformance with an OPC Foundation
    specification.</p>"

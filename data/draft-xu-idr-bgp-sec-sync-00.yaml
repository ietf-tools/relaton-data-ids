abstract:
- content: "<p>This document defines a new BGP Address Family, termed the Secure Session
    Synchronization Address Family, allowing BGP speakers to exchange stateful firewall,
    NAT, and IPSec session information across distributed nodes. This architecture
    facilitates zero-packet-loss failover and seamless path protection for Secure
    SD-WAN, SASE, and SSE multi-POP deployments, entirely bypassing the scalability
    limits of traditional layer-2 synchronization protocols.</p>"

abstract:
- content: "<p>This document defines a metadata and query profile for efficient discovery
    of autonomous software agents. The profile describes how agents publish capability
    metadata using explicit tags, natural- language descriptions, example tasks, protocol
    bindings, and operational constraints. It also defines JSON metadata, discovery
    request, and discovery response objects that enable discovery services to combine
    structured filtering, semantic retrieval, and fine-grained matching while preserving
    an interoperable protocol surface. The profile does not mandate a specific machine-learning
    model, embedding model, database, or ranking algorithm. Instead, it standardizes
    the metadata and result evidence needed by clients and discovery services so that
    different implementations can interoperate while optimizing their own latency,
    scalability, and ranking quality.</p>"

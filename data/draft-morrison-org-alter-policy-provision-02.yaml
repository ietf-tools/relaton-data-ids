abstract:
- content: "<p>This memo specifies how an artificial-intelligence agent runtime, bound
    at instantiation to a principal identity handle, resolves at session initialisation
    a target organisational identity substrate from a manifest source bound to the
    runtime's working context and retrieves from that substrate a typed policy stack
    comprising a handbook artefact, a standard-operating-procedure registry pointer,
    an enforcement-gate specification, and an audit-signal ingestion endpoint. The
    policy stack is then applied as runtime constraints on subsequent tool invocations,
    with audit signals emitted back to the same substrate. Policy provision occurs
    in the same act of session initialisation as principal identification, rather
    than as a separate ceremony against a side-channel governance plane. A principal
    concurrently bound to multiple organisational substrates operates the runtime
    under a deterministic composition of the several policy stacks, with cross-organisational
    residual conflicts routed to the peer-protocol Identity Accord ceremony [IDACCORD]
    rather than to a meta-federation authority. The memo is Informational. The wire
    surface relies on the DNS-based discovery of [MCPDNS] and the handle namespace
    of [IDPRONOUNS]; no new transport is introduced.</p>"

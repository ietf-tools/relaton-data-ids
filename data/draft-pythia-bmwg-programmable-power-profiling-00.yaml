abstract:
- content: "<p>A programmable network device can execute different packet-processing
    programs on the same hardware. Device-level power measurements show the total
    input power but do not explain the power associated with a program's parser, match-action
    tables, and stateful or stateless actions. Models designed for fixed-function
    switches do not directly describe these program-dependent operations. This document
    describes a power profiling methodology for programmable network devices. The
    methodology decomposes packet processing into functional components, uses controlled
    calibration programs to derive target-specific parameters, and estimates the power
    of a data-plane program from its processing features and traffic. It also specifies
    validation and reporting requirements that distinguish direct measurements from
    model-derived estimates. The methodology is based on implementation experience
    with an ASIC programmable switch and an FPGA-based programmable switch.</p>"

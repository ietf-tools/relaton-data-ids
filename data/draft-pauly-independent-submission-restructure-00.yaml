abstract:
- content: "<p>The Independent Submission stream is one of the stream producers that
    create draft RFCs. This document proposes the creation of the Independent Submission
    Board (ISB), a small board appointed by both the IAB and IESG, that acts as the
    stream approver. The ISB is responsible for activities within the Independent
    Submission stream, works with draft editors and reviewers, and interacts with
    the RFC Production Center and Publisher, and the RFC Series Editor (RSE). If approved,
    this proposal would obsolete RFC 8730, which defines a single Independent Submission
    Editor.</p>"

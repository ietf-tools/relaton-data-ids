abstract:
- content: "<p>Automated agents, such as artificial intelligence (AI) agents, act
    for people. This document specifies records that let anyone check, later and offline,
    what an agent was allowed to do and what it recorded doing: a permission a person
    signs with a passkey, with limits a machine can check; a receipt the agent signs
    for each action, with Ed25519 and the post-quantum Module-Lattice-Based Digital
    Signature Algorithm (ML-DSA-87); and a log whose tree head is signed and time-stamped.
    A verifier says whether each action stayed within its permission, apart from whether
    the records are sound.</p>"

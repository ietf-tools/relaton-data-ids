abstract:
- content: "<p>This document describes how any party verifies a Proof of Transformation
    seal issued under the Causal Time Protocol (CTP/IP), and the wire protocol used
    to invoke a LUX Runtime and to request seal verification over a network. A seal
    attests that a transformation declared in advance by a Human Agency, through a
    signed Intention Signature (IntentSig), was validated by the LUX Runtime, and
    that the resulting certificate was committed to a Merkle batch anchored on the
    Solana and Bitcoin public ledgers. The document specifies the certificate fields,
    the five layer verification procedure, the artifact identity check, the message
    types and envelope of the wire protocol, and the IANA registrations the protocol
    requests. It does not specify the measurement method by which a LUX Runtime computes
    the Coherence Index; that method is outside the scope of this document. One seal
    attests intent, human origin, decision authority, authorship, substance, causal
    time and anchoring, for a Human Agency and for any agent acting under it. The
    protocol has been in development since 2020 and is deployed. Its canonical specification
    is published as Corpus Delta 1 under DOI 10.5281/zenodo.21950371.</p>"

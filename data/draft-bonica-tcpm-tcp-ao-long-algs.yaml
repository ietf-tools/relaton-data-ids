abstract:
- content: "<p>RFC5926 creates a list of cryptographic algorithms that can be used
    with TCP-AO. This document expands that list, adding two Message Authentication
    Code (MAC) algorithms, HMAC-SHA384 and KMAC384. For each MAC algorithm, a corresponding
    Key Derivation Function (KDF) is also added. The MAC algorithms described by this
    document produce 384-bit (i.e., 48-byte) MACs. When 48-byte MACs are encoded in
    TCP-AO, the TCP-AO consumes 52 bytes. This exceeds TCP's 40-byte option size limitation.
    Therefore, it depends on a solution that extends TCP Option space.</p>"

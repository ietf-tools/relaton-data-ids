abstract:
- content: "<p>This document defines conformance classes, validation-result structure,
    schema requirements, test-vector categories, conformance assertions, reference-validator
    behavior, implementation disclosure, and interoperability testing guidance for
    the Judgment Event Protocol (JEP). It is a companion to JEP-Core 0.7. This document
    does not redefine JEP-Core semantics. Its purpose is to make JEP-Core 0.7 implementations
    testable and interoperable across languages, platforms, trust profiles, and deployment
    environments. Conformance artifacts described by this document are derived from
    applicable normative specifications; tests, schemas, examples, and reference implementations
    do not independently create JEP-Core semantics.</p>"

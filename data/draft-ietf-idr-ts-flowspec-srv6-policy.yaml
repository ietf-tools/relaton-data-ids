title:
- content: Traffic Steering using BGP FlowSpec with SR Policy
  language:
  - en
  script:
  - Latn
  format: text/plain
docid:
- id: draft-ietf-idr-ts-flowspec-srv6-policy
  type: Internet-Draft
  primary: true
abstract:
- content: "<p>BGP Flow Specification defined in [RFC8955], [RFC8956] and [RFC9117]
    has been proposed to distribute BGP [RFC4271] FlowSpec NLRI to FlowSpec clients
    to mitigate (distributed) denial-of-service attacks, and to provide traffic filtering
    in the context of a BGP/MPLS VPN service. Recently, traffic steering applications
    in the context of SR-MPLS and SRv6 using FlowSpec are being used in networks.
    This document introduces the usage of BGP Flow Specification to steer packets
    into an SR Policy.</p>"
  language:
  - en
  script:
  - Latn
  format: text/html

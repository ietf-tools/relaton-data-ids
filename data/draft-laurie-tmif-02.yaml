abstract:
- content: "<p>This document specifies a Transparency Metadata Interchange Format
    (TMIF) that allows a distributed or confidential computing system to make standardized,
    verifiable claims about its levels of transparency and falsifiability. Modeled
    as a structured Endorsement within the Remote Attestation Procedures (RATS) architecture,
    TMIF provides an agnostic, schema-defined communication vehicle for claimants
    to declare how their security mitigations and policy governance controls can be
    independently inspected, reproduced, and verified by third- party evaluators.</p>"

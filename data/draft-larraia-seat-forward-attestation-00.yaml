abstract:
- content: "<p>This document specifies a mechanism that allows a Relying Party to
    perform post-handshake remote attestation of a peer over a dedicated TLS connection
    and binds the resulting Attestation Credential to subsequent, fresh TLS connections
    to the same attested Target Environment, including connections to different server
    endpoints hosted within it. Forward Attested TLS decouples _when trust is established_
    from _when trust is exercised_.</p>"

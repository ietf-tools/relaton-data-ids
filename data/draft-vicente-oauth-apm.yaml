abstract:
- content: "<p>This document describes the Authorization Posture Mechanism (APM),
    a method by which an OAuth 2.0 [RFC6749] authorization server, or a resource server
    acting on its behalf, re-evaluates the mutual consistency of three bound factors
    -- the client certificate, the access token, and the device posture -- on a per-request
    basis for privileged operations, rather than only at session establishment. When
    re-evaluated posture degrades relative to the posture under which the token was
    issued, APM defines deterministic, least- privilege Graduated Outcomes including
    scope reduction and method restriction, rather than a binary allow or deny.</p>"

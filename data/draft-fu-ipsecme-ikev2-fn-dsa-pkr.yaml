abstract:
- content: "<p>This document specifies FN-DSA for signature authentication in the
    Internet Key Exchange Protocol Version 2 (IKEv2). It defines Public Key Recovery
    Mode (PKR-Mode), an extension that exploits the public key recovery property of
    FN-DSA, which reduces authentication payload size and enables certificateless
    authentication at the responder.</p>"

abstract:
- content: "<p>Radio sensing in ISAC and AI-assisted networks produces semantic outputs
    such as target position, velocity, class, and identifiers. These outputs can reveal
    sensitive information about people who take no part in any communication service,
    especially when they are released repeatedly, combined across sources, or shared
    across administrative domains. This document describes the privacy risks of releasing
    such outputs and the network management functions needed to control their release:
    policy, enforcement at trust boundaries, consumer authorisation, accounting, and
    auditing. It surveys protection approaches and lists open research questions.
    It does not define a protocol or an algorithm.</p>"

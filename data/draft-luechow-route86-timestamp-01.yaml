abstract:
- content: "<p>This document specifies Route86, a compact textual timestamp format
    for constrained message transports. A Route86 value consists of a three-character
    Base36 calendar-day component and a three-digit decimal time-of-day component.
    The canonical representation occupies exactly six ASCII characters. The calendar
    component is interpreted relative to an external reference date. The reference
    date itself encodes as AAA. The time- of-day component divides a fixed BMT day,
    defined here as UTC+01:00 without daylight-saving adjustment, into 1000 intervals
    of 86.4 seconds.</p>"

abstract:
- content: "<p>This document specifies an attestation token format and verification
    protocol for hardware-rooted measurements of electricity generation. The protocol
    enables a tamper-evident chain of custody from the secure element at a metering
    device to a publicly verifiable settlement layer, using ECDSA P-256 signatures
    generated inside a certified secure element and carried in a COSE_Sign1 structure.
    It defines: (a) the CBOR-encoded attestation token, aligned with the Entity Attestation
    Token format of RFC 9711 and the Remote ATtestation procedureS (RATS) architecture
    of RFC 9334; (b) a Merkle- aggregation and on-chain commitment scheme for scalable
    verification; and (c) a registry mechanism for endorsing device public keys. The
    token is intended for use by relying parties, such as energy producers, consumers,
    regulators, and standards bodies, that require cryptographic provenance for clean-energy
    claims.</p>"

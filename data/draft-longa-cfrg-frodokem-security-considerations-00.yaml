abstract:
- content: "<p>ISO standardized FrodoKEM in June 2026 [ISO18033-2-AMD2]. This document
    provides security guidance for FrodoKEM for use in protocols. It explains what
    security claims protocol designers may rely on, what assumptions and conditions
    are required, what parameter sets are in scope, and what implementors need to
    do to use FrodoKEM safely. The scope follows the current FrodoKEM Internet-Draft
    [I-D.FrodoKEM].</p>"

abstract:
- content: "<p>PSI-05 defines a cryptographic attestation framework for financial
    disclosures, enabling third parties to recompute and verify company filings against
    their published figures. It establishes a public ledger of sealed financial statements,
    a verification protocol using RFC 8785 canonicalization with Ed25519 (classical)
    and ML-DSA-65 (post-quantum) signatures, and an API for querying reconciliation
    results. The framework supports ASX, NYSE, NSE, LSE, and Euronext filings.</p>"

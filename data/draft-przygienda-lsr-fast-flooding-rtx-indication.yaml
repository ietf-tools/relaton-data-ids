abstract:
- content: "<p>[RFC9681] defines a Flooding Parameters TLV. Among other things, it
    lets an IS-IS node advertise two values to a neighbor. The Receive Window (RWIN)
    bounds the number of unacknowledged Link State PDUs (LSPs) the neighbor may have
    outstanding. The LSPs-per-PSNP (LPP) threshold triggers immediate acknowledgment.
    Together they form a credit-based flow-control window and an acknowledgment cadence.
    These are the parts of [RFC9681] that are most important, most useful, and most
    likely to be implemented at scale. The sender-side congestion-control algorithms
    in that document are described only as optional, local choices. No single algorithm
    is mandatory. A credit-based window alone does not signal congestion. As long
    as acknowledgments keep freeing credit, a sender may keep refilling the window
    up to RWIN. It does so even while it is actively retransmitting LSPs on that adjacency.
    Without an explicit, mandatory-to-implement reaction to observed retransmission,
    fast flooding at scale can degenerate into sustained retransmission storms that
    serve only to keep the window full. This document specifies a local backoff. A
    node SHOULD reduce the effective outstanding-LSP ceiling it uses against a neighbor's
    advertised RWIN by a meaningful fraction. The trigger is a count of LSP retransmissions
    generated toward that neighbor within a trailing time window exceeding a threshold.
    This backoff applies unconditionally. It does not depend on whether the condition
    is signaled to the neighbor, or understood by it. This document also defines a
    lightweight Retransmission (RTX) indication. It is a new flag in the existing
    Flags sub-TLV of the Flooding Parameters TLV. A node advertises it to a neighbor
    while it is retransmitting LSPs toward that neighbor. The flag reports only the
    advertising node's own retransmissions, that is, its own congestion. A node never
    sets it in reaction to a neighbor's flag. The flag lets the neighbor adjust its
    own advertised RWIN in turn. The adjacency then converges toward a stable operating
    point at the highest speed it can sustain. Neither side needs prior knowledge
    of the other's characteristics or of the link. This document further clarifies
    how concurrent versions of the same LSP fragment are counted against RWIN, LPP,
    and the retransmission threshold. [RFC9681] leaves that case undefined, and it
    arises routinely at fast flooding rates.</p>"

abstract:
- content: "<p>This document provides non-normative implementation guidance for the
    Secure Asset Transfer Protocol (SATP). It describes a small, independent peer
    implementation and reproducible tests for evaluating protocol behavior and interoperability.
    It relates Core processing to Setup and Artefacts Registry proposals, while distinguishing
    published requirements from experimental implementation choices. The guide addresses
    transport mappings, message protection, asset-state observation, failure handling,
    and reporting of specification ambiguities. It does not define a new protocol,
    certify an implementation, or claim completed interoperability experiments.</p>"

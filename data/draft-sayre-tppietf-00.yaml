abstract:
- content: "<p>It is said to be in the basement. Despite decades of work by the Internet
    Engineering Task Force to develop, standardize, and promote transport layer security,
    global deployment remains incomplete. This document investigates the primary obstacle
    to universal encryption: a class of legacy printing devices, often located in
    building basements, that are cited as justification for continued plaintext transmission.
    This document provides a taxonomy of such devices, analyzes the rhetorical structure
    of printer-based encryption exemption claims, and proposes a framework for evaluating
    their validity.</p>"

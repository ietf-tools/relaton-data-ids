abstract:
- content: "<p>This document defines the protocol and interoperability requirements
    for OAuth Actor Chain. Six profiles combine Authorization Server declarations
    or actor-signed evidence with Full, Subset, or Actor- Only disclosure. Verified
    profiles create one actor proof and one AS acceptance at every actor step, with
    optional current-actor, disclosed-actor, or full-path evidence delivered inline
    or through introspection. This specification defines the wire formats, validation,
    replay and retry behavior, cross-domain preservation, resource limits, and IANA
    registration requests. A separate Informational overview provides additional design
    discussion. This revision continues the existing OAuth Actor Chain draft series,
    with Internet-Draft lineage beginning in SPICE in February 2026.</p>"

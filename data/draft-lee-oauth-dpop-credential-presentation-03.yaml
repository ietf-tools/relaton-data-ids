abstract:
- content: "<p>This document profiles the JWT access token of RFC 9068 so that the
    same JWT is also a W3C Verifiable Credential secured with JOSE. The authorization
    server is the credential's issuer, and the token is bound to the client's key
    with DPoP (RFC 9449). A resource server receives it as an ordinary DPoP-bound
    access token and needs no change. A verifier that the authorization server can
    name as the token's audience can process the same object as a Verifiable Credential.
    The profile defines no new header parameters, claims or registrations. It states
    which existing header parameters and claims the token carries, how the claims
    of the two data models correspond, and the conditions under which one object can
    safely serve both purposes.</p>"

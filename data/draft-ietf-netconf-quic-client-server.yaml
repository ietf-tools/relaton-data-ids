abstract:
- content: <p>This document defines five YANG 1.1 modules to support the configuration
    of QUIC clients and QUIC servers. The modules include basic parameters for configuring
    QUIC based clients and servers as well as initial modules for the IANA registries
    "QUIC Versions" and "QUIC Transport Parameters".</p>

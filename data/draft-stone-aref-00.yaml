abstract:
- content: "<p>This document specifies the Agent Referral and Escrow Framework (AREF),
    a protocol for cryptographically attributed agent-to-agent referrals, escrow-bound
    commission commitments, and dual-rail financial settlement in multi-agent computing
    environments. As autonomous software agents increasingly transact with one another
    to acquire capabilities and coordinate work, no standardized mechanism exists
    for recording how one agent introduced another to a platform or service, binding
    that introduction to a financial commitment, or settling the resulting commission
    across heterogeneous payment infrastructure. AREF addresses this gap by defining:
    a portable Ed25519-signed attribution proof for referral chains of arbitrary depth;
    the semantics and payload schema of the SwarmSync- Referrer HTTP header used to
    bind a referrer to an escrow at hold- time; a commission vesting model tied to
    escrow finality rather than enrollment; a unified settlement finality signal operable
    over both traditional financial infrastructure (Stripe Connect) and cryptographic
    payment channels (X402); and the swarm_meta JSON embedding mechanism through which
    referral codes propagate across agent ecosystems without human involvement. This
    document is intended for implementers of agent orchestration platforms, payment
    service operators, and designers of multi-agent economic systems.</p>"

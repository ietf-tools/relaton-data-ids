abstract:
- content: "<p>A topology filter is a data construct that is used to filter network
    topologies. The Path Computation Element (PCE) MUST take into account the topology
    related constraints during the path computation. This document proposes a set
    of extensions for Path Computation Element Communication Protocol (PCEP) to support
    the topology filter.</p>"

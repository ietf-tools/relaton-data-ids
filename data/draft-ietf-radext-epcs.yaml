abstract:
- content: "<p>This document defines RADIUS attributes for authorizing the use of
    Emergency Preparedness Communication Service (EPCS) priority access defined in
    IEEE 802.11be. These attributes allow an Identity Provider to indicate that an
    authenticated user is authorized for EPCS, enabling the Wi-Fi network provider
    to apply EPCS priority access to the user's Wi-Fi session. The attributes also
    support RADIUS accounting for Wi-Fi sessions in which EPCS priority access is
    used.</p>"

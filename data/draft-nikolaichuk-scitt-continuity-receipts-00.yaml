abstract:
- content: "<p>A Transparency Service as defined by RFC 9943 registers Signed Statements
    about Artifacts and returns Receipts, encoded per RFC 9942, that prove registration
    in an append-only log. The Statements registered today typically describe how
    an Artifact was built, tested, or released. They do not describe what happens
    after that: the Artifact is sealed, moved, lost, and later re-created somewhere
    else, and that re-creation leaves no independently checkable trace. This document
    defines a Continuity Receipt: the Receipt obtained when a recovery event is registered
    as a Signed Statement in a Transparency Service. It specifies the Subject and
    the required claims of a recovery Statement, how Attestation Results from RFC
    9334 remote attestation are carried or referenced by it, and how a sequence of
    such Statements under one Subject forms a verifiable continuity chain across the
    lifetime of a stateful asset. The document is deliberately narrow. It defines
    a payload and a set of claims, not a new Transparency Service, not a new verifiable
    data structure, and not a new attestation format. It also records, rather than
    conceals, the divergence between what it specifies and what the reference implementation
    currently does.</p>"

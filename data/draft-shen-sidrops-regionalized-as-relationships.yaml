abstract:
- content: <p>Autonomous System Provider Authorization (ASPA) defines an RPKI-based
    methodology to validate the AS_PATH of BGP routes based on a global Customer-to-Provider
    (C2P) relationship model. However, in commercial Internet routing, two Autonomous
    Systems (ASes) may establish distinct business relationships across different
    geographical regions or interconnection points (e.g., Customer-to- Provider in
    one region, but Peer-to-Peer in another). Such regionalized or hybrid AS-relationships
    can lead to incorrect ASPA validation results (e.g., false "Valid" attestation
    for a route propagated over a P2P link). This document analyzes the vulnerabilities
    caused by regionalized AS-relationships and proposes mechanisms to incorporate
    regional granularity into ASPA objects and verification procedures.</p>

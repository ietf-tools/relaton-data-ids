abstract:
- content: "<p>This document defines terminology for reporting incidents in Large
    Language Model (LLM) services in which output behavior departs from intended behavior
    without producing an error response. It defines the lifecycle events of such an
    incident, the intervals between those events, and the qualifiers a reported interval
    carries. The intervals defined here are anchored at the point information about
    an occurrence reaches a responsible party. The interval preceding the first monitoring
    signal is named and is not defined as measurable. This document defines terminology
    only. It specifies no data model, no reporting obligations, and no target values.</p>"

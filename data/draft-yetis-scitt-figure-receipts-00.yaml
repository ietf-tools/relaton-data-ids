abstract:
- content: "<p>Profiles of SCITT for AI agents record what an agent did: which tool
    it called, under whose authority, and what bytes came back. They state, correctly,
    that they do not show whether those bytes were true. This document profiles the
    layer underneath: a Signed Statement, issued by the publisher of a figure, that
    binds the figure to its source, period and population, and that is superseded
    when the publisher corrects the figure or when the original source prints a different
    value in a later edition. It also defines a short token that travels with the
    figure through tool results and prose, so that a later reader can find the statement
    and learn whether the figure is still the one published. The profile makes a narrow
    claim. It shows that a figure is the one a named publisher published, from a named
    source, and whether it has changed since. It does not show that the figure is
    correct.</p>"

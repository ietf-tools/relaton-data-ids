abstract:
- content: <p>This document defines the "ars" URI scheme for representing ARS-1 References
    in a syntactically valid URI form. ARS-1 defines a deterministic, cryptographically
    derived reference protocol for assigning stable public identifiers to durable
    digital entities. The "ars" URI scheme provides a standard URI notation for these
    references, enabling their use in hyperlinks, QR codes, metadata fields, and other
    URI-consuming contexts. This specification does not redefine the ARS-1 Reference
    generation pipeline, canonicalization rules, or verification logic. Those are
    normatively defined by ARS-1. This document defines only the URI syntax, encoding,
    comparison, and resolution semantics for the "ars" scheme.</p>

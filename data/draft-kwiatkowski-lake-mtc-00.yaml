abstract:
- content: "<p>Merkle Tree Certificates (MTC) replace the signature of a Certification
    Authority (CA) with smaller inclusion proof against a periodically published landmark.
    The large sizes of post-quantum (PQC) keys and signatures make conventional certificate
    chains costly to validate on constrained devices, which have limited memory, compute,
    and message-size budgets. MTC's lightweight properties keep certificate verification
    practical for such devices even when PQC signature algorithms are used. This document
    specifies how to carry MTC credentials in the Lightweight Authenticated Key Exchange
    (LAKE) protocol [RFC9528]: CBOR encodings of MTC certificates and landmarks, and
    a new External Authorization Data (EAD) item that lets the two peers negotiate,
    per message, between the compact landmark-relative form of a certificate and its
    self-contained standalone form.</p>"

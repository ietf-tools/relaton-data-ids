abstract:
- content: "<p>This document defines a security capability coordination execution
    framework for 5G core networks. The framework employs a set of Security Coordination
    Components (SCC) that work collaboratively with core network functions to achieve
    continuous trust verification and least-privilege access control. It specifies
    the division of responsibilities between the Network Function Security Agent and
    the Management Security Controller. This document aims to provide a standardized
    architecture reference for the ZT-CPP working group.</p>"

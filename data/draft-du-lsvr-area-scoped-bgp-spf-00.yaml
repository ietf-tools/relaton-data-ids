abstract:
- content: "<p>BGP Link-State Shortest Path First (BGP-LS-SPF) routing, defined in
    RFC 9815, uses BGP to distribute link-state information and the SPF algorithm
    to compute routes. In large-scale networks with frequent topology changes, distributing
    detailed link-state information across the entire network may introduce significant
    control-plane overhead and frequent route recomputation. This document proposes
    an area-scoped routing mechanism for BGP-LS- SPF. The mechanism divides a network
    into multiple routing areas, limits the distribution of detailed topology information,
    and maintains inter-area reachability through boundary routers. It aims to improve
    routing scalability and stability while supporting distributed route computation.</p>"

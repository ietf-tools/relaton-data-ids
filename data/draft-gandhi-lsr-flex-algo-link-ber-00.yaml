abstract:
- content: "<p>Networks may experience transmission bit errors due to various factors,
    such as poor fiber quality. This document defines extensions to the IGP Flexible
    Algorithm to utilize the link Bit Error Rate (BER) metric as a link constraint.
    It defines a mechanism to exclude links whose BER metric exceeds a configured
    threshold during Flex-Algorithm path computation. The mechanism utilizes BER metric
    advertisement defined for IS-IS and OSPF in draft-gandhi-lsr- ber.</p>"

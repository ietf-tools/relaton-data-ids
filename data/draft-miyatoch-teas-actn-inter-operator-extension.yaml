abstract:
- content: "<p>This document specifies an extension to the ACTN framework (RFC 8453)
    that enables coordination between the MDSCs of different operators, so that they
    can establish and operate end-to-end TE services cooperatively while each operator
    keeps full control of its own network and keeps its internal details private.
    As its concrete realization within ACTN, the extension defines the MDSC-MDSC Interface
    (MMI), a symmetric peer interface between the MDSCs of different operators, in
    which neither MDSC has authority over the other, and which complements rather
    than modifies the CMI and the MPI. The extension is independent of the underlying
    switching technology and applies to packet, optical, and multi-layer TE networks.</p>"

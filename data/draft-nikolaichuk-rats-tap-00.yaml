abstract:
- content: "<p>The Remote ATtestation procedureS (RATS) architecture (RFC 9334) defines
    how Evidence is conveyed from an Attester to a Verifier and how the resulting
    Attestation Results are conveyed to a Relying Party. It deliberately stops at
    the point where a Relying Party has appraised Attestation Results. This document
    specifies Trusted Artifact Provenance (TAP), a consumer of Attestation Results
    that defines what happens next in one specific and recurring case: releasing sealed
    key material to a process that reconstructs a stateful asset inside an attested
    environment, and recording the release decision as an auditable object. TAP defines
    three contracts. The Producer contract governs how an artifact is sealed and bound
    to the attested identity of the environment that produced it. The Sealer contract
    governs the attestation-gated release of key material to a reconstruction environment.
    The TAP Verifier contract governs after-the-fact appraisal of provenance and release
    records. TAP does not define an appraisal policy language, does not define a new
    Evidence format, and does not replace any part of RFC 9334.</p>"

abstract:
- content: "<p>The IETF currently has three Standards Track specifications of loss-
    based congestion control: Reno-based congestion control for TCP (RFC 5681), its
    counterpart for QUIC (RFC 9002), and CUBIC (RFC 9438), which updates RFC 5681.
    They are intended to follow the same congestion control principles, but they differ
    in their mechanisms, parameters, and normative requirements, and these differences
    have not been reconciled with each other. This document identifies such differences,
    summarizes whether and how each of them is documented in the specifications, and
    asks the IETF to determine for each difference whether to work toward convergence
    or accept it as is.</p>"

abstract:
- content: <p>Resource Public Key Infrastructure (RPKI) Route Origin Validation (ROV)
    verifies whether an Autonomous System (AS) is authorized to originate a given
    IP prefix. However, multi-national or geographically dispersed ASes often hold
    IP prefix allocations from different Regional Internet Registries (RIRs) or announce
    specific prefixes only within designated geographic regions under a single Origin
    AS. An attacker located in a different region can maliciously announce an authorized
    prefix under the same legitimate Origin AS, effortlessly bypassing standard RPKI
    ROV. This document defines the concept of "Regionalized ROA" (R-ROA), specifies
    protocol enhancements to convey regional scope metadata from Trust Anchors down
    to routers via RPKI-Router protocol extensions, and outlines enhanced validation
    procedures to detect and mitigate intra-AS cross- regional route hijacking.</p>

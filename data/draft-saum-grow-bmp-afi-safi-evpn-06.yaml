abstract:
- content: "<p>This document defines new EVPN-specific BGP Monitoring Protocol (BMP)
    statistics types. These extensions include scalar counters for EVPN route types
    specifically, while also keeping scope for defining counters which are EVPN route-type
    agnostic but related to BGP-EVPN RIB like, number of multihoming Ethernet Segments,
    number of multihomed EVIs, number of aliased paths, number of dynamic inter-VRF
    route leaking (IVRL). This revision (-06) firms up the specification for working
    group consideration: it adds a Relationship to Other Work section that explicitly
    maps this document to concurrently circulating GROW contributions on BMP statistics
    and TLV extensions and invites coordination with their authors, corrects the YANG
    alignment reference, strengthens Security Considerations, and adds a worked example.
    No statistics semantics, Stat Type/Subtype allocations, or wire formats defined
    in -05 are changed.</p>"

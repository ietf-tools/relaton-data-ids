abstract:
- content: "<p>Nuclear material accountancy reporting flows from facility operators
    to State Systems of Accounting for and Control of nuclear material (SSACs), to
    regional inspectorates, and to the International Atomic Energy Agency. The records
    exchanged are confidential, are held in separate databases that are rarely reconciled
    against one another, and rest on asserted rather than demonstrated integrity:
    a party holding a record can alter it after the fact without leaving evidence
    detectable by any other party. This document defines Verifiable Safeguards Records
    (VSR), a profile of COSE-signed statements and transparency-log registration that
    produces tamper-evident, independently verifiable evidence about accountancy declarations
    without disclosing their contents. VSR specifies a commitment-based record format
    supporting selective disclosure to differently authorized inspectorates, a cross-party
    reconciliation procedure for transit matching and discrepancy notices, and a dual-layer
    anchoring scheme that preserves verifiability beyond the operational lifetime
    of any single registry -- the horizon required for spent fuel management, decommissioning,
    and geological repository closure. VSR is an evidence layer. It does not verify
    physical measurements, detect undeclared material, or substitute for inspection.</p>"

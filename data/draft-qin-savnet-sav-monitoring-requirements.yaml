abstract:
- content: "<p>Source Address Validation (SAV) enforcement requires operational visibility
    into validation results, traffic-handling outcomes, SAV rule generation and state,
    and SAV configuration. Such visibility helps operators understand how SAV operates
    in the network and supports operational decisions, including staged deployment
    where traffic that fails validation may be permitted while being monitored and
    analyzed. This document identifies information requirements for monitoring SAV
    enforcement.</p>"

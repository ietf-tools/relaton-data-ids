abstract:
- content: "<p>The Computing-Aware Traffic Steering (CATS) framework [I-D.ietf-cats-framework]
    introduces the concept of a Service Contact Instance (SCI) as the client-facing
    entity responsible for receiving and dispatching service requests. While the framework
    and the CATS metric documents define the components and the metrics, the concrete
    observable behavior of a Service Contact Instance - in particular, what it reports
    to the CATS Service Metric Agent (C-SMA), when it reports, and how service-instance
    health changes are reflected in the reported metrics - remains underspecified.
    This document fills that gap. It specifies the functional behavior of a CATS Service
    Contact Instance in terms of observable behavior and reporting semantics: how
    an SCI aggregates instance-level information into service-oriented metrics (e.g.,
    Global Available Slots and Computing Time) as defined in [I-D.zhangb-cats-service-metrics-op];
    how it monitors the health and status of underlying service instances and adjusts
    reported metrics accordingly; how it maintains affinity and handles failure scenarios;
    and how it reports metrics and status updates to the C-SMA, including update policies
    and threshold-based triggers. A decomposition of the SCI into internal functional
    components is provided as illustrative implementation guidance, not as a mandated
    software architecture. This document complements [I-D.ietf-cats-framework], [I-D.ietf-cats-metric-definition-11],
    and [I-D.zhangb-cats-service-metrics-op] by providing the operational execution
    layer for the SCI within the unified CATS architecture.</p>"

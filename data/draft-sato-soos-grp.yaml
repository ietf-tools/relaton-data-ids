abstract:
- content: "<p>This document specifies the Governed Remediation Protocol (GRP) for
    agentic AI systems operating under the Sovereign Object OS (SOOS) framework. GRP
    defines the normative remediation action set available to a SOOS governance kernel
    when agent execution encounters a governed failure condition: FALLBACK (autonomous
    resource substitution), RETRY (bounded autonomous retry), ESCALATE (human escalation
    boundary), and ROLLBACK (reversible action undo). GRP specifies the conditions
    under which each action class may be taken autonomously and the boundaries at
    which Human Escalation Messaging (HEM) is required. GRP operates at the intersection
    of the Resource Governance Protocol (RGP), the Agent Execution Protocol (AEP),
    and the Human Escalation Mechanism (HEM), and normatively references the Governance
    Audit Record (GAR) for logging all remediation events. GRP adopts DEC-RGP-08 (the
    three-condition autonomous fallback test) verbatim from the Resource Governance
    Protocol as the normative FALLBACK action class boundary rule.</p>"

abstract:
- content: "<p>AllReduce is a critical performance bottleneck for distributed deep
    learning and large model training in data centers for AI computing. In-Network
    Aggregation (INA) has been identified as an effective accelerating technique to
    improve its performance. The draft describes a flexible and efficient INA solution
    for packet routing and forwarding. The forward aggregation tree is encoded by
    a bitmap. The result dissemination is through BIER-based multicast which also
    relies on a bitmap. The two bitmaps share the same encoding scheme as specified
    in BIER.</p>"

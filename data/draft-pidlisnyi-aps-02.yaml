abstract:
- content: "<p>This document specifies the Agent Passport System (APS), a protocol
    for cryptographic identity, faceted authority attenuation, and governance for
    AI agent systems. APS introduces Ed25519-based agent passports, scoped delegation
    chains with monotonic narrowing across seven constraint dimensions (scope, spend,
    depth, time, reputation, values floor, reversibility), cascade revocation, a three-signature
    policy chain (intent, evaluation, receipt), and signed receipts that record what
    an agent declared, what a policy engine decided, and what an enforcement boundary
    observed. Authority is modeled as an element of a product lattice, and delegation
    is a monotone function on that lattice, ensuring that delegated capabilities can
    only be attenuated, never amplified. APS also defines key rotation with identity
    continuity, and recognizes institutional governance primitives (charters, offices,
    approval policies, federation) that compose with the delegation lattice; their
    normative specification is companion work. The protocol is intended to complement
    current AI agent infrastructure, including MCP and A2A, with cryptographic identity,
    delegated authority, and verifiable enforcement evidence. A protocol binding is
    specified for MCP. Reference implementations are available in TypeScript and Python
    under Apache-2.0; see the Implementation Status section. Beyond the authority
    core, this document also specifies: an external correlation form for cross-ecosystem
    record matching; key resolution for external and evidence signers; attestation
    provenance tiers; signed revocation evidence with cascade-completion records;
    a two- phase execution gate model; supporting signed record classes for boundary
    decisions, composition checks, and sampled readback; a receipt-profile mechanism
    illustrated by a trust-domain-gated regulated-action profile; a word-handle digest
    presentation; and a binding for OAuth identity-assertion authorization grants.
    The temporal dimension is specified as an absolute expiry bound, spend as denominated,
    and verification claims are expressed at named levels stating what each proves
    and what it does not.</p>"

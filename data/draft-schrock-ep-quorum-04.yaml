abstract:
- content: "<p>This document defines a multi-party approval predicate over action-
    bound human signoffs: valid signatures, admitted roles, distinct approvers and
    keys, threshold, and an optional ordered trail. The relying party pins the governing
    policy and approver directory independently. Passing the predicate is approval
    evidence, not a complete authorization decision, proof of execution, or proof
    of unused authority. This revision repairs the strong ordered profile. A successor
    signs a digest of the completed predecessor signoff, including its signature,
    rather than a precomputable context. The versioned profile establishes causal
    dependence on a completed prior proof under the cryptographic assumptions; it
    does not establish trusted wall-clock time or human comprehension. Legacy context-only
    chains cannot satisfy it. JavaScript, Python, and Go reference verifiers share
    a corpus in one repository. Agreement is a same-team consistency check, not independent
    interoperability evidence or a formal proof of the new construction.</p>"

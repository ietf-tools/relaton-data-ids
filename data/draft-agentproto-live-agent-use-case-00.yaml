abstract:
- content: "<p>Live AI interactions combine ongoing observations, overlapping responses,
    and changes to the devices through which a user participates. This document contributes
    three use case extensions to the AgentProto use cases and requirements work: live
    multimodal calls, AI glasses with companion devices, and embodied systems that
    converse while performing delegated actions. For each scenario, the document identifies
    the existing requirements it builds on, the interoperability questions it raises,
    and the requirement refinements motivated by its interaction flow. The focus is
    on independently changing observation sources, response state, participation,
    and authority within a continuing dialog. The scenarios are independent of transport
    selection. An appendix uses Media over QUIC Transport (MOQT) to illustrate questions
    for subsequent binding and application-profile work.</p>"

abstract:
- content: '<p>This document defines the measurement capsule: a small, deterministic
    JSON record in which a party that is neither the subject of a claim nor a participant
    in the action it concerns records what the subject declared, what the measuring
    party observed, and the difference between the two. A capsule carries digests
    of its evidence, a measurement state in which "could not be checked" is a first-class
    outcome, and no decision, approval or authorisation. Capsules are identified by
    the SHA-256 of their JCS serialisation and batched under an RFC 9162 Merkle Tree
    Hash. The document describes their registration as SCITT Signed Statements (RFC
    9943), how they refer to rather than restate receipts issued under other profiles,
    and one implementation, including where it does not yet match this profile.</p>'

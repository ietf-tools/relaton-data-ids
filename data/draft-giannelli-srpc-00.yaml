abstract:
- content: "<p>This document defines the Solenoid Remote Procedure Call (sRPC) protocol
    and requests registration of a new HTTP method, RUN. sRPC is action-oriented.
    A client targets a stable endpoint URI and identifies the procedure to execute
    through a query parameter containing a procedure path. The RUN method provides
    explicit protocol semantics for function invocation, distinguishing RPC execution
    from resource-oriented REST interactions.</p>"

abstract:
- content: "<p>This document defines AAuth Events — an event subscription and delivery
    mechanism for agents operating under the AAuth Protocol ([I-D.hardt-oauth-aauth-protocol]).
    It specifies the subscribe token that agents use to register callbacks with resources,
    the event token that resources deliver when events fire, and the delivery path
    through the Agent Provider (AP). AAuth Events enables agents to receive asynchronous
    notifications without requiring a public endpoint, using the cryptographic identity
    established by the AAuth Protocol.</p>"

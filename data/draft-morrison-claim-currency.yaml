abstract:
- content: "<p>Software agents that read a shared, append-only store of claims can
    cite an aged claim as though it were current, and can write new claims grounded
    on it. This memo defines the one element two parties would have to agree on, the
    envelope a read returns for a claim. It carries the assertion, the time of its
    grounding observation, its basis set, a three-state currency band (FRESH, AGING,
    STALE) derived at read time and never stored, and the evidence from which the
    band was derived. A relying party can re-derive the band from that evidence. It
    also states the rules under which a reader may emit an aged claim and under which
    a store must refuse a new claim that cites an out-of-date basis. The memo is an
    Informational problem statement and description of one design. It has no second
    implementer yet, and it is offered for review as an Independent Submission.</p>"

abstract:
- content: "<p>In the IETF Remote Attestation Procedures (RATS) architecture (RFC
    9334), a Verifier accepts Evidence and uses Appraisal Policy for Evidence, typically
    with additional input from Endorsements and Reference Values, to generate Attestation
    Results in formats that are useful for Relying Parties. This document illustrates
    the purpose and role of Endorsements and discusses some considerations in the
    choice of message format for Endorsements in the scope of the RATS architecture.
    This document does not aim to define a conceptual message format for Endorsements
    and Reference Values. Instead, it updates RFC 9334 by refining the description
    of Endorsements and Reference Values. Specifically, this document classifies the
    RATS conceptual messages as actual state, reference state, or appraisal policy,
    and adds considerations on conditionally endorsed values, endorsing verification
    keys, timeliness, and multiple Endorsements.</p>"
  language:
  - en
  script:
  - Latn
  format: text/html

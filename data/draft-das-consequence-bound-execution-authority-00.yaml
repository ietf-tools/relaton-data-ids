abstract:
- content: "<p>Authorization to compute, propose, prepare, simulate or request an
    operation is not, by itself, authorization to cause the operation's actual consequential
    effect. An authorized operation may afterwards be transformed, delegated, delayed,
    replicated, compiled, offloaded or executed under different technical conditions.
    This document describes an architecture, and a set of candidate interoperability
    requirements, for separating those authorizations: a proposed operation is held
    as a Candidate Act in a Non-Effective State; the Actual Pending Operation is reconstructed;
    current source authority, context, dependencies and policy and revocation epochs
    are evaluated by an independent validator; a scoped, non-bearer execution authorization
    is issued; and a protected Finality Sink at the actual effectuation boundary re-derives
    the operation, enforces the authorization, and supports reconciliation against
    authoritative outcome evidence. The document is an individual, informational technical
    proposal. It credits OAuth, JWT/CWT, RBAC/ABAC, zero-trust, remote attestation,
    transaction logs, hardware isolation and cryptographic signatures for their established
    functions and does not characterize them as defective. It includes a threat model,
    12 figures, 39 consequence- specific profiles, a non-normative European applicability
    discussion and an examiner-oriented terminology appendix. It is not an IETF standard,
    an EU regulatory instrument, a telecommunications or financial standard, or an
    endorsement by any named company.</p>"

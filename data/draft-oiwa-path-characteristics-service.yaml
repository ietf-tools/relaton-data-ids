abstract:
- content: <p>"Secure hybrid network monitoring – Problem statement" [I-D.oiwa-secure-hybrid-network]
    identifies challenges in securing and monitoring networks deployed across hybrid
    and mixed cloud environments. This document introduces the Path Characteristics
    Service (PCS), a service that enables applications and operators to verify whether
    a given network path conforms to their declared requirements ("intent") regarding
    security, compliance, and operational properties. Unlike traditional network monitoring,
    PCS does not expose raw network state; instead, it evaluates the user's intent
    against the actual path characteristics and returns a conformance result (match
    or no-match). This intent matching approach allows multi-stakeholder environments
    to verify path properties without disclosing sensitive internal infrastructure
    details. This document describes an architecture and interfaces for PCS; it expresses
    recommended behaviors and constraints using the normative keywords of BCP 14,
    but does not specify a wire protocol or its encoding.</p>

abstract:
- content: "<p>This document defines the signedDocumentBinding certificate extension,
    which binds a certificate to the signed content of a single digital signature.
    Each certificate is created at the time of signing; the associated signing key
    is generated for the sole purpose of producing that one signature, is used for
    no other purpose, and is destroyed immediately afterwards. Certificates carrying
    this extension are intended to be issued without a revocation mechanism and with
    no expiration, which simplifies long-term validation.</p>"

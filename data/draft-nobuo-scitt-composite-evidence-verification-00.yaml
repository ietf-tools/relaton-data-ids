abstract:
- content: "<p>This document defines a common model for composite verification of
    SCITT statement graphs. A composite verifier checks a set of SCITT Signed Statements,
    receipts, object bindings, and relationship edges under a named verification profile.
    The result is a structured report that can say which statements passed, which
    evidence is missing, which evidence is stale, and which statements conflict. The
    model is intended for verifiers, auditors, deployment controllers, update services,
    and other relying-party tools. It is not a new Transparency Service requirement.
    It does not define a universal supply-chain policy language and does not define
    the payload format of any statement type.</p>"

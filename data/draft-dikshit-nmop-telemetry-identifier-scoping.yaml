abstract:
- content: "<p>Several documents currently in progress across multiple IETF working
    groups define identifiers that are exported from a network element and consumed
    by a remote collector, controller, or receiver: a flow identifier, a path segment
    identifier, a per-peer or per-Route-Distinguisher counter, and a period or sequence
    number are examples already found in active work. In each case examined in this
    document, the identifier is defined without a stated scope of uniqueness, so the
    receiver cannot determine, from the exported value alone, whether two records
    observed at different times or from different sources describe the same object.
    This document catalogs six such instances found independently across five working
    groups, defines a short vocabulary for stating an identifier's scope of uniqueness,
    and sets out requirements for documents that define exported telemetry identifiers
    going forward.</p>"

abstract:
- content: "<p>This document profiles a verifiable-telemetry ledger for resource-
    constrained deployments. After a gateway has admitted telemetry under its transport
    and anti-replay rules, the profile fixes a reference framed transport, deterministic
    projection to a canonical record, a daily Concise Binary Object Representation
    (CBOR) day artifact and its Merkle construction, a verification manifest, three
    disclosure classes, and binding of the day-artifact digest to external timestamp
    channels. OpenTimestamps (OTS) is the default anchoring channel; RFC 3161 timestamp
    responses and peer signatures are optional parallel channels. The profile enables
    independent recomputation and audit of disclosed evidence. It does not cover device
    onboarding, end-to-end security of sensor values, or safety decisions.</p>"

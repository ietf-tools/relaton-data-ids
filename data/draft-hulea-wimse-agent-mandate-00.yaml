abstract:
- content: "<p>This document defines how a relying party in one administrative domain
    validates the mandate under which a software agent, including an AI agent, acts
    for a principal in another domain. Its distinctive element is evidence of the
    delegator's authority: a statement from an authority source about which permissions
    the person or entity granting the mandate may delegate to agents, kept separate
    from the statement that the mandate was granted. The document specifies the mandate
    format with precisely defined limit semantics, a deterministic validation procedure
    driven by an explicit validation profile and kept separate from the relying party's
    authorization decision, the attribution of every validated claim to the issuer
    and role that asserted it, rules for enforcing the mandate after token exchange,
    and the boundary between this protocol and a trust framework. It reuses JSON Web
    Tokens, OAuth 2.0 Token Exchange, Rich Authorization Requests, WIMSE workload
    credentials and HTTP Message Signatures, Token Status Lists, and Entity Attestation
    Tokens.</p>"

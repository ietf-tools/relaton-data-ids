abstract:
- content: "<p>AI agents exhibit dynamic, unpredictable behavior that cannot be fully
    described by traditional OAuth 2.0 scopes. This specification defines a behavioral
    authorization framework that enables clients, particularly AI agents, to propose
    Rego policy-based behavioral constraint contracts in OAuth 2.0 authorization flows
    using Rich Authorization Requests (RAR). It defines the rego_policy authorization
    data type for carrying behavioral constraint contracts in authorization_details,
    shifting the authorization model from static permission sets to runtime behavioral
    verification. It also defines a reverse-guided authorization mechanism allowing
    resource servers to return structured policy constraints in error responses, enabling
    agents to dynamically adapt their behavior and construct appropriate authorization
    requests.</p>"

abstract:
- content: "<p>This document defines a service-metrics snapshot published by a CATS
    Service Metric Agent (C-SMA) to a CATS Path Selector (C-PS). The snapshot conveys
    service-metric records and their observation window, together with publication
    context supporting versioning and the FULL, INVALIDATE, and WITHDRAW operations.
    The document defines the snapshot contract and two transport modes for the C-SMA-to-C-PS
    interface: Centralized Mode, using YANG-modeled operational state delivered by
    gNMI, and Distribution Mode, proposing a BGP-LS service-metadata mapping. The
    BGP-LS mapping is illustrative until its wire encoding and code points are specified.</p>"

abstract:
- content: "<p>This document specifies an IP Flow Information Export (IPFIX) metering
    and export profile for bounded Packet Sequence Number (PSN) observations on provisioned
    RoCEv2 Reliable Connection SEND and RDMA WRITE request streams. It defines cumulative
    observations of skipped, subsequently observed, expired, repeated, and unclassified
    sequence positions, with explicit observation epochs and qualification flags.
    The profile requires complete observation of the provisioned stream and defines
    no packet-loss estimator, retransmission detector, or congestion-control action.
    Twelve Information Elements describe the observation state. Existing RoCEv2 header
    Information Elements identify the monitored stream.</p>"

abstract:
- content: "<p>This document profiles OASNT tokens for consumption by executor-side
    processing models. It fixes one normative derivation of a Canonical Action Identifier
    (CAID) from the OASNT action digest, so that every executor checks the same derivation
    rather than each integration defining its own, and it specifies the semantics
    of the token's named-human binding, including a subject-to-enrollment check whose
    absence this profile makes a refusal.</p>"

abstract:
- content: "<p>This document proposes a set of requirements for integrating a speech
    codec enhancement algorithm into the Opus codec [RFC6716]. It also updates [RFC7587]
    to define two optional media type parameters for signaling decoder-side speech
    enhancement capabilities.</p>"

abstract:
- content: "<p>This document leverages the five standardized 6G service scenarios
    defined in 3GPP TR 22.870—multi-agent collaborative communication, compute-network
    integration, integrated sensing and communication (ISAC), network digital twin
    (NDT), and wide-area deterministic networking—as core business baselines. It systematically
    analyzes the multi-dimensional stringent user-plane requirements introduced by
    next-generation mobile systems. This work further dissects inherent technical
    limitations within the 5G GTP-U point-to-point tunnel architecture that render
    it incapable of accommodating dynamic 6G service characteristics. Based on the
    above analysis, this draft illustrates the inherent programmability benefits provided
    by SRv6, and accordingly establishes a suite of standardization requirements for
    SRv6 to serve as the underlay forwarding protocol of the 6G user plane.</p>"

abstract:
- content: "<p>RFC 6374 defines one-way, two-way, and round-trip delay measurements
    for MPLS networks, including a loopback procedure for round-trip delay measurement.
    The IANA Performance Metrics registry includes Metric Type name elements for one-way
    and round-trip delay, but does not include one for two-way delay. This document
    requests that IANA add the Two-Way Delay name element and add RFC 6374 as a reference
    for the existing One-Way Delay and Round-Trip Delay name elements.</p>"

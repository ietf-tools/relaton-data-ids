abstract:
- content: "<p>This document highlights the operational framework within Deepspace/
    TIPTOP protocols to utilize an external, standardized reference framework for
    celestial objects, functioning as an equivalent to ISO 3166 for interplanetary
    networking. To avoid operational overhead and duplication of effort, this framework
    defers the definitions, naming, and tracking of celestial entities directly to
    the International Astronomical Union (IAU) and the Minor Planet Center (MPC).
    This document outlines how these external identifiers guide hierarchical address
    allocation without requiring IANA to maintain a dedicated astronomical nomenclature
    registry. The ultimate objective is to establish a clear definition of what constitutes
    a valid Celestial Body for networking purposes.</p>"

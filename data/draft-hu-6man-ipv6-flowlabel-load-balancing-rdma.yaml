abstract:
- content: <p>This document proposes a method for achieving flow-level load balancing
    in RoCEv2 (RDMA over Converged Ethernet version 2) networks. Traditional per-flow
    load balancing based on the 5-tuple cannot distinguish between different RDMA
    sessions that share the same 5-tuple. This causes "elephant flows" to be hashed
    to the same path, leading to network congestion. This method resolves this issue
    by parsing the QP (Queue Pair) information from the IB BTH (Base Transport Header)
    and IB DETH (Datagram Extended Transport Header) headers of the RoCEv2 packet.
    By combining this with portions of the IPv6 source and destination addresses as
    an entropy source, a CRC32 hash algorithm generates a 20-bit value, which is then
    written into the Flow Label field of the IPv6 header. Network devices can subsequently
    use the updated "5-tuple + Flow Label" for more granular flow-level load balancing,
    thereby effectively improving transmission efficiency in high-performance networks
    such as AI computing.</p>

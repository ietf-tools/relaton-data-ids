abstract:
- content: "<p>Skill Intake Security (SKIS) defines how an organization should examine
    a third-party skill, plugin or agent definition before it is allowed to act: four
    review levels graded by risk, a verification chain from provenance to a release
    record, and operational controls for updates, inventory, logging and revocation.
    AI agents increasingly extend their capabilities with third-party skills: packages
    of natural-language instructions, metadata and helper scripts that a model reads
    as authoritative context. Related work addresses agent identity, authorization,
    discovery and skill-layer risks; this document proposes a consolidated intake
    procedure with explicit organizational obligations. The verification chain covers
    provenance, integrity pinning, full-content inspection and comparison of declared
    versus observed capabilities. SKIS is vendor-neutral and intended to complement
    existing identity and provenance specifications.</p>"

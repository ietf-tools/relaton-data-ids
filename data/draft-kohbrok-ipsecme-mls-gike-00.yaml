abstract:
- content: "<p>This document describes a profile that uses the Messaging Layer Security
    (MLS) protocol as the group key-management substrate for Group Key Management
    using IKEv2 (G-IKEv2). The intent is to preserve the operational model of G-IKEv2,
    including IKEv2 transport, GSA policy distribution, a central GCKS, and the IPsec
    ESP data plane, while replacing GDOI-style group key distribution with an MLS
    group. The resulting design can be read as G-IKEv2 where MLS produces the per-epoch
    group secret used to key the IPsec ESP Data- Security SA.</p>"

abstract:
- content: "<p>Chips Message Robust Authentication (Chimera) is a technique by which
    a Global Navigation Satellite System (GNSS) constellation, such as the Global
    Positioning System (GPS), may provide user equipment (i.e., receivers) with authentication
    of pseudorange measurements on one or more publicly available (i.e., open) Positioning,
    Navigation, and Timing (PNT) signals. This specification describes a Fast Channel
    Chimera Marker Key Package, an efficient data structure for encoding one or more
    Fast Channel Chimera marker keys and associated metadata with a digital signature
    over all security relevant parameters. Concise Binary Object Representation (CBOR)
    Object Signing and Encryption (COSE) is used as the underlying message structure.
    This specification also describes a streaming network protocol by which Fast Channel
    Chimera Marker Key Packages may be distributed over the Internet.</p>"

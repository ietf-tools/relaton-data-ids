abstract:
- content: "<p>AI agents are increasingly expected to communicate across platforms,
    organizations, clouds, edge environments, and administrative domains. Current
    agent-related mechanisms mainly focus on description, discovery, identity, authentication,
    authorization, tool invocation, and application-layer collaboration. These mechanisms
    are important, but they often treat the IP network as a transparent connectivity
    substrate. This document describes networking problems that arise when AI agents
    perform cross-domain communication and continuous tool, API, data, and agent-to-agent
    calls. It focuses on problem description rather than a protocol solution. In particular,
    it discusses gaps related to agent identity visibility at the network layer, path
    control, audit continuity, the separation of discovery from addressing and authorization,
    and privacy and privilege risks introduced by highly autonomous agents. The document
    positions Agent6 as a problem space for network support of cross-domain AI agent
    collaboration. It does not define a new agent discovery protocol, a new application-layer
    collaboration protocol, a new authentication or authorization mechanism, or a
    new IPv6 extension header.</p>"

abstract:
- content: "<p>In AI/ML compute fabrics and data center interconnects, collective
    communication patterns (e.g., All-Reduce, All-to-All) generate microbursts that
    can saturate queuing buffers before reactive congestion control mechanisms take
    effect. This document specifies a BGP SR Policy extension to carry Path Rate information
    (e.g., Path Committed Rate and Path Maximum Rate), enabling a central controller
    to compute and distribute per-segment-list rate limits along with the SR Policy
    Candidate Path. The headend enforces these rate limits on traffic steered to the
    corresponding segment list, thereby proactively preventing the microburst-induced
    congestion before traffic enters the network.</p>"

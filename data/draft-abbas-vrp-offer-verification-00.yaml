abstract:
- content: '<p>The Vacation Rental Protocol (VRP) lets an AI agent or other client
    verify, directly from a vacation-rental host''s own domain and with no intermediary,
    that a stay offer was signed by a key that domain publishes, has not been altered,
    and is within its stated lifetime. The signed offer carries the host domain''s
    own statements of availability and exact price for the stay asked for. A valid
    signature proves the provenance and integrity of those statements; it does not
    guarantee that the stay is in fact available. A host domain publishes a discovery
    document at a well-known URI, an Ed25519 key set, and signed stay offers (compact
    JSON Web Signatures). Verification requires no central registry, issuer, accreditation
    program, or gatekeeper: control of the host domain is the root of trust. This
    document specifies the discovery document, key publication and rotation, the signed
    verified stay offer, and the verification procedure, including fail-closed behavior
    and a three-state verification model. It also describes the existing provisional
    registration of the "vacation-rental.json" well-known URI suffix.</p>'

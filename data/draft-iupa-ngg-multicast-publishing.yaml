abstract:
- content: "<p>This document defines the NG-Multicast-Publishing protocol, which is
    used to distribute free eBooks, publication metadata, and copyright information
    over IPv4/IPv6 multicast networks in an efficient and reliable manner. The protocol
    employs a one-to-many, unidirectional communication model and supports Any-Source
    Multicast (ASM). It is intended for use by libraries, educational institutions,
    and individual receivers worldwide. Design goals include very low resource consumption,
    no requirement for an uplink channel, permanently assigned multicast addresses,
    and end-to-end integrity verification.</p>"

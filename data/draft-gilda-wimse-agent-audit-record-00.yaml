abstract:
- content: "<p>This document defines a record format for AI agent authorization decisions.
    The format is one in-toto predicate type, signed inside a DSSE envelope. It carries
    the seven minimum audit fields that the WIMSE AI Identity Management System framework
    requires, and two properties that make those fields checkable: a canonicalization
    contract, and both the authorization decision and the observed effect with a derived
    three-valued agreement between them. That framework places the record format out
    of scope and takes no IANA action. This document supplies the format. It defines
    no policy.</p>"

abstract:
- content: "<p>This document defines an Information Model and specifies a corresponding
    YANG data model for packet discard reporting. The Information Model provides an
    implementation-independent framework for classifying packet loss by its cause
    (e.g., errors, congestion, or policy). This classification enables operators to
    determine which losses are expected or intended and which are unintended, and
    to select appropriate mitigation actions, including automated mitigation of unintended
    packet loss. The YANG data model specifies an implementation of this Information
    Model for network elements with a focus on interface, device, and control-plane
    discards.</p>"

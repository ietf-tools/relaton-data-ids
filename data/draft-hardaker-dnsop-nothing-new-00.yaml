abstract:
- content: <p>The DNS protocol has increasingly needed to carry larger records than
    it was originally designed to carry. This has resulted in performance impacts
    due to both the size increases and requiring TCP instead of only UDP. Of particular
    note is the expected large increase in records relating to post-quantum signing
    algorithms. To help mitigate, but not entirely prevent, these impacts, this document
    proposes a new "nothing new" NN flag, a LARGE Redirection Resource record type,
    and how these can integrate with current and future DNSSEC DNSKEY and RRSIG records.</p>

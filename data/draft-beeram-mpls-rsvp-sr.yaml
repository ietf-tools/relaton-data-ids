abstract:
- content: <p>RFC 8577 introduced the concept of signaling RSVP-TE tunnels on a shared
    MPLS forwarding plane using preinstalled "TE link labels". Those labels are functionally
    equivalent to Segment Routing (SR) Adjacency Segment Identifiers (Adj-SIDs) but
    are allocated and distributed solely via RSVP-TE signaling. This document extends
    RFC 8577 so that RSVP-TE tunnels can use Segment Routing over MPLS (SR-MPLS) Adj-SIDs,
    as specified in RFC 8402 and RFC 8660, in place of TE link labels. It restricts
    scope to Adj-SIDs attached to a single unidirectional adjacency and defines the
    signaling procedures and protocol extensions required to couple the RSVP-TE control
    plane with the SR-MPLS data plane.</p>

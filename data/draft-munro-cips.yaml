abstract:
- content: "<p>This document defines Contextual IP Prefix Semantics (CIPS), a model
    that distinguishes addresses, canonical prefixes, addresses with prefix context,
    and prefix selectors, and describes how these forms are qualified by operational
    context. It provides a taxonomy of operational contexts and vocabulary for stating
    implementation support. In that vocabulary, canonical-prefix support means the
    canonical prefix form is preserved as its own identity; accepting slash-qualified
    text is not that capability. The model is intended to help specification authors,
    API and schema designers, tool authors, and operators preserve semantic distinctions
    when prefix- bearing values cross interchange boundaries.</p>"

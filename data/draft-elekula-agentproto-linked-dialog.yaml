abstract:
- content: "<p>Agentic systems increasingly create, delegate, relay, and transform
    dialogs across multiple agents, protocols, services, and administrative trust
    boundaries. In these environments, a verifier may need to determine whether two
    dialogs are related without requiring unrestricted disclosure of their contents
    or relying exclusively on the assertions of an intermediary. This document describes
    properties and a conceptual evaluation model for privacy-preserving verification
    of linked-dialog relationships across trust boundaries. It distinguishes dialog
    association from context propagation, relationship verification from authentication
    and authorization, and verification outcomes from assessments of evidence completeness.
    The document also considers evidence scope, source positions, temporal references,
    intermediary continuity, lifecycle changes, identity binding, privacy, and evidence
    availability. It identifies requirements intended to help future protocol designs
    represent linked-dialog relationships in a way that can be independently evaluated
    while limiting unnecessary disclosure. This document does not define a wire format,
    cryptographic mechanism, identifier format, transport binding, authorization protocol,
    audit-log structure, or completeness-proof mechanism. It provides terminology,
    design properties, and interoperability considerations for further discussion.</p>"

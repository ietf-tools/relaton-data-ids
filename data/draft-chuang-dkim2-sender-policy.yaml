abstract:
- content: "<p>This document updates DMARC RFC9989 for DKIM2. In particular DKIM2
    verification supports MTA relay forwarding with message modifications through
    multiple MTAs, so this updates DMARC to support those scenarios as well. While
    DMARC defines a RFC5322 From alignment constraint with an enforcement policy if
    validation fails, this generalizes and separates enforcement policy from constraint
    validation policies. This provides a mechanism for MTAs to declare support for
    DKIM2 through the DMARC DNS policy record that helps secure DKIM2 from downgrade
    attacks.</p>"

abstract:
- content: "<p>This document defines VESPER (Verifiable STI Presentation and Evidence
    for RTU), a profile for the use of delegate certificates in STIR. VESPER profiles
    the binding of telephone number authority to a domain identifier, the STIR certificate
    and PASSporT specifications, ACME-based authority token issuance, and certificate
    transparency into a delegate certificate that associates the right-to-use for
    a telephone number with the entity behind the number asserted in the PASSporT
    orig claim. This document describes the certificate usage, a PASSporT usage profile
    for SIP signaling, and a portable Right-to- Use Token for use outside of SIP.</p>"

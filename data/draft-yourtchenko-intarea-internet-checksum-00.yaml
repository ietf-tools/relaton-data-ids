abstract:
- content: '<p>Over the past four decades, the Internet checksum has been used by
    many protocols: IPv4, TCP, UDP, and others. The practical details related to calculation
    and updates are scattered across different RFCs. Several protocols introduce special-case
    handling for +0 and -0, thus making the term "Internet checksum" ambiguous. This
    affects any protocol implementation which modifies the data covered by any variant
    of the Internet checksum. This document provides the problem statement and outlines
    the scope for potential future work to build a consolidated source for the Internet
    checksum. If there is interest in such work, this document may be converted into
    that consolidated specification.</p>'

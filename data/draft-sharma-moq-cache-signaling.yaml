abstract:
- content: "<p>This document defines optional hop-by-hop cache signaling for Media
    over QUIC Transport (MOQT). A subscriber can query the cache status of a finite
    Track range or request the cache status of a FETCH. Responses report a hit, miss,
    or partial hit and can identify locally cached ranges.</p>"

abstract:
- content: '<p>This document specifies the Trajectory-based Recognition of Identity
    Proof (TRIP) protocol, a decentralized mechanism for establishing claims of physical-world
    presence through cryptographically signed, spatially quantized location attestations
    called "breadcrumbs." Breadcrumbs are chained into an append-only log, bundled
    into verifiable epochs, and distilled into a Trajectory Identity Token (TIT) that
    serves as a persistent pseudonymous identifier. The protocol employs a Criticality
    Engine, a statistical anomaly detector informed by complex-systems research, to
    distinguish biological movement from synthetic trajectories. Power Spectral Density
    (PSD) analysis of the displacement series yields a scaling exponent alpha that
    captures long-range temporal correlation in movement. A six-component Hamiltonian
    energy function scores each breadcrumb against the identity''s learned behavioral
    profile in real time. This revision (-05) reframes the statistical core of the
    Criticality Engine in light of empirical validation against human-mobility data:
    the PSD scaling exponent alpha is specified as a per-deployment- calibrated scored
    feature rather than a fixed classification gate; the fixed [0.30, 0.80] "biological"
    band is withdrawn in favor of calibrated ranges; the asserted Levy-PSD bridge
    is replaced by a statement of the independence of the step-size and temporal-
    correlation features; and a new validation section reports separation results
    and methodology. The cryptographic chain, RATS mapping, Active Verification Protocol,
    and privacy model are unchanged from -04. TRIP is designed to be transport-agnostic
    and operates independently of any particular naming system, blockchain, or application
    layer.</p>'

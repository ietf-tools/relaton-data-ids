abstract:
- content: "<p>Data types describe representation, but they do not explain the semantic,
    temporal, spatial, and operational characteristics needed to interpret and compare
    data. This document defines optional JSON Structure annotations that bind schema
    nodes to terms in external vocabularies; annotations for observation results,
    observed properties, features of interest, procedures, time semantics, quality,
    derivation, and cadence; annotations for spatial referencing by coordinates, by
    vector and tensor reference frames, by transformations between frames, and along
    linear elements; and annotations for color spaces, audio channel layouts, spectral
    bands, code lists, and measurement conditioning. The annotations make an incompatibility
    between two data sets detectable by machine; they do not resolve one. They are
    optional, and their absence does not make a schema invalid.</p>"

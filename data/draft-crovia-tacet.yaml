abstract:
- content: "<p>Existing transparency logs prove presence: a certificate was logged,
    a binary was published, a key was registered. TACET is a transparency map whose
    primary product is a portable, offline- verifiable proof of absence over time:
    that for a given subject, no record satisfying a public predicate existed in the
    map, and none was found on the subject's monitored public surfaces, across a contiguous
    range of epochs bounded below by a public randomness beacon and above by a Bitcoin
    block. This document specifies the map (a depth-256 sparse Merkle tree), the signed
    epoch sheet, surface snapshots and predicates, the delta-encoded silence proof
    with its three strength levels, the monotonicity rule under which silence never
    accrues without observation, the anchor check that needs no Bitcoin node, and
    the wrapping of proofs in Crovia Seal receipts. It further specifies PNX, a profile
    that applies the same construction to the outbound traffic of an AI agent to prove
    that labelled assets were not exfiltrated during a run.</p>"

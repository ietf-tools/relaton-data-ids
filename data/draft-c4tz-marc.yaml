abstract:
- content: "<p>This document specifies MARC, an experimental, vendor-neutral profile
    for control and uncertainty-disclosure metadata in generative models and agentic
    systems. MARC separates pre-decision capability assessment from post-decision
    answer confidence, identifies uncertainty sources and confidence targets, and
    defines a bounded set of primary actions and a minimal disclosure object. The
    experiment evaluates whether independently developed components can exchange and
    interpret these metadata consistently across implementation and protocol boundaries.
    It also supports evaluation of action selection, uncertainty attribution, confidence
    calibration, and downstream presentation. MARC specifies externally observable
    semantics. It does not define model internals, transport, authentication, authorization,
    agent discovery, tool schemas, or task execution, and it does not require disclosure
    of internal reasoning. The intended users are implementers of agent runtimes,
    orchestration layers, model gateways, evaluation systems, and user interfaces.
    This document does not define an Internet Standard.</p>"

abstract:
- content: "<p>Extensible metadata carried within the IOAM Pre-allocated Trace Option
    (PTO) can support packet-level, flow-level, or path-level processing beyond per-node
    trace data. This document defines the Global Opaque Block (GOB), an extension
    to the IOAM PTO that introduces a single pre-allocated global metadata region
    placed at the tail of the option, after the pre-allocated node data space. Since
    the PTO node data list is populated from the tail of the node data space toward
    its head, under the control of the RemainingLen field, legacy IOAM transit nodes
    can never reach the GOB region: the extension is transparent to such nodes by
    construction, and only the decapsulating node or collector needs to be GOB-aware.
    In the default mode of operation, the GOB carries an explicit length and schema
    identifier in a trailer word; in an optimized namespace- implied mode, size and
    schema are bound to the IOAM-Namespace and the block consists of payload only,
    so that a 4-octet opaque value is carried in exactly 4 octets. The GOB preserves
    the pre-allocated PTO processing model and can be used to transport Extensible
    In-band Processing (EIP) Information Elements or other structured metadata formats.</p>"

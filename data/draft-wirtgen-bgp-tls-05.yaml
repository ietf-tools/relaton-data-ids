abstract:
- content: <p>This document specifies the use of TLS over TCP to support BGP. The
    Border Gateway Protocol (BGP) relies on TCP to establish sessions between routers.
    While the TCP Authentication Option (TCP-AO) provides transport-layer integrity
    protection against spoofing and reset attacks, it does not provide confidentiality,
    cryptographic peer identity, or scalable key management. This document specifies
    a method for establishing a secure BGP session by running BGP over a TLS 1.3 session.
    The underlying TCP transport MUST be protected using TCP-AO. An "Implicit TLS"
    model on TCP port 179 is specified as the preferred mechanism.</p>

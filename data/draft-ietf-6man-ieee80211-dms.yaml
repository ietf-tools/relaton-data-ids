abstract:
- content: "<p>For the IPv6 protocol stack, while IEEE 802.11 wireless networks can
    on a first abstraction be considered functionally identical to wired IEEE 802
    networks, there are issues regarding reliability and survivability of multicast
    traffic. The existence of these issues has been known for some time. This document
    is to state that they are still being experienced, and summarize some previous
    and new approaches. Additionally, this document serves to collect consensus in
    the IETF process to make both the IEEE and Wi-Fi Alliance aware of these issues
    and request they be included in consideration for future development. 802.11 Directed
    Multicast Service and Flexible Multicast Service are noted as existing protocol
    features that may warrant more consideration. However, other solutions in that
    space may be more appropriate and are left to the expertise of the IEEE and Wi-Fi
    Alliance.</p>"

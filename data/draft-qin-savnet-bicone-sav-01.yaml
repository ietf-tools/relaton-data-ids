abstract:
- content: "<p>Source address validation (SAV) aims to detect source-spoofed traffic
    while avoiding improper blocking of legitimate traffic. Existing SAV mechanisms
    commonly rely on ingress allowlist filters on interfaces facing customer or lateral
    peer Autonomous Systems (ASes). When such an allowlist is incomplete, a source
    address not covered by the allowlist cannot be conclusively identified as spoofed,
    because legitimate source prefixes may be missing from the allowlist. This document
    describes Bicone SAV, which jointly uses an allowlist derived from customer-cone
    information and a blocklist containing prefixes that can be positively identified
    as inappropriate on the corresponding ingress interface. When the allowlist is
    incomplete, packets matching the allowlist are permitted, packets matching the
    blocklist are discarded, and packets matching neither list are permitted with
    logging or other monitoring for subsequent analysis. The blocklist can be constructed
    from provider-cone information and augmented with denylist information derived
    from customer cones.</p>"

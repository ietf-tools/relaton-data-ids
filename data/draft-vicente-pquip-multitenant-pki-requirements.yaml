abstract:
- content: "<p>Organizations operating Public Key Infrastructure (PKI) across multiple
    isolated tenant environments face a critical gap: existing PKI management protocols
    and standards do not address the coordination requirements for post-quantum cryptographic
    (PQC) algorithm migration in shared, multi-tenant certificate authority deployments.
    This document identifies the functional requirements and open protocol gaps that
    must be addressed to enable safe, consistent, and auditable PQC certificate rotation
    across multi- tenant PKI environments. No new protocol mechanisms are specified;
    this is an informational requirements document intended to motivate future standards
    work.</p>"

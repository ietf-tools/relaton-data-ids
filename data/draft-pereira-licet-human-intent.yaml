abstract:
- content: "<p>Autonomous AI agents executing consequential actions require authorization
    mechanisms that verify not only identity but voluntary intent. Existing mechanisms
    verify _who_ authorized an action; they cannot verify _whether the authorizing
    human was uncoerced and cognitively capable_ at the moment of authorization. This
    document specifies LICET (Latin: _it is permitted_), a cryptographic middleware
    protocol binding AI agent authorization to real-time multi-modal physiological
    state via a three-layer architecture: (1) ECG waveform morphology matching as
    a medication- resistant identity and liveness anchor; (2) electrodermal activity
    (EDA) as a sympathetic cholinergic liveness signal immune to beta- adrenergic
    blockade; and (3) personalized Mahalanobis distance fusion over five physiological
    signals to elevate the cost of pharmacological coercion attacks rather than claim
    binary detection. LICET defines a Biometric Trust Level hierarchy (L0-L3) aligned
    with the IETF RATS architecture (RFC 9334), a baseline calibration protocol establishing
    individual physiological profiles, per-event HKDF session-key derivation, HMAC
    biometric temporal signatures, Schnorr zero-knowledge proofs over BN128 enabling
    third-party audit without biometric exposure, and a SHA-256 hash-chained tamper-evident
    ledger. A reference implementation is publicly deployed at https://licet.dev/
    v1/ and available as open source at https://github.com/christianrp45/ licet-protocol.</p>"

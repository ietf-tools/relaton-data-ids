abstract:
- content: "<p>This document specifies an optional confidence layer for the TLS TimeToken
    Secure Protocol (TTTPS). It defines the G-Score, a normalized entropy measure
    of agreement concentration; an optional correlation-aware von Neumann extension;
    the InsufficientKnowledge signal; and the AdaptiveSwitch state machine over TURBO
    and FULL. The confidence layer qualifies whether evidence justifies action. It
    does not replace cryptographic integrity, define a wire format, allocate a codepoint,
    establish source independence, or require any core TTTPS implementation to compute
    confidence.</p>"

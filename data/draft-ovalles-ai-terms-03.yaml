abstract:
- content: "<p>This document defines AI Terms: a JSON document published at the well-known
    URI /.well-known/ai-terms in which a website states, for each of four uses of
    its content by automated AI systems (search, answer, training and agent), whether
    the use is allowed, allowed for a price, or not allowed. Each use corresponds
    to one category of the IETF AI Preferences vocabulary, and the document defines
    how a site's terms are written, conservatively, as AI Preferences statements (the
    Content-Usage header field and robots.txt rule) for clients that read only those.
    AI Terms extends the AI Preferences work with what it leaves out: a price and
    a free allowance, a payment binding (HTTP 402, with x402 as the first), a purpose
    declaration by the client (the AI-Purpose header field), a description of a paid
    page that the payment depends on, and a receipt that records the use.</p>"

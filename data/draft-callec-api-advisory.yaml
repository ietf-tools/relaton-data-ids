abstract:
- content: "<p>This document defines a well-known URI, /.well-known/api- advisory.json,
    at which API providers MAY publish a machine-readable JSON discovery file. That
    file identifies the API and provides the URL of an Atom Syndication Format feed
    carrying structured change advisories. The Atom feed enables automated scanners
    and API consumers to discover pricing changes, deprecations, security advisories,
    and other relevant events without relying on manual monitoring of blogs or mailing
    lists. Advisory metadata is conveyed through a dedicated XML namespace defined
    in this document.</p>"

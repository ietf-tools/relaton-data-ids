abstract:
- content: '<p>This document registers two new fields for the security.txt file format
    defined in RFC 9116: "Product-Security" and "Product-Security- Policy". They allow
    an organisation to publish a dedicated contact and disclosure policy for vulnerabilities
    in the products it manufactures, distinct from the contact for vulnerabilities
    in its own web presence and infrastructure. The fields are optional and fully
    backward compatible with existing security.txt parsers.</p>'

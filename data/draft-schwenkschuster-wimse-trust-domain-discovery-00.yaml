abstract:
- content: "<p>The WIMSE architecture scopes workload identifiers to a trust domain.
    To validate a workload identity credential, a relying party must securely obtain
    the cryptographic trust anchors associated with the credential's trust domain.
    The WIMSE architecture requires that this mapping between a trust domain and its
    trust anchors is obtained through a secure mechanism, but leaves that mechanism
    undefined. This document defines such a mechanism for open environments in which
    no prior trust relationship exists between the relying party and the trust domain.
    It specifies the WIMSE Trust Bundle, a document that conveys the trust anchors
    of a trust domain for both JWT-based and X.509-based workload identity credentials,
    and a discovery mechanism based on a well-known HTTPS endpoint that allows a relying
    party to resolve a trust domain name to its trust bundle on demand.</p>"

abstract:
- content: <p>This document defines benchmarking terminology for evaluating Ethernet-based
    network fabrics used in distributed Artificial Intelligence (AI) training and
    inference workloads. It consolidates and extends terms from "Benchmarking Terminology
    for Network Interconnect Devices" (RFC 1242) and "Data Center Benchmarking Terminology"
    (RFC 8238). Definitions cover collective communication primitives, RDMA transport
    mechanisms (RoCEv2 and Ultra Ethernet Transport), congestion control behaviors,
    AI-specific Key Performance Indicators (KPIs), and fabric topology concepts. This
    document is a companion to the AI training and inference fabric benchmarking methodology
    documents. Those documents are intended to be read together with the terminology
    defined here. Where definitions herein overlap with the foundational benchmarking
    terminology in RFC 1242 or RFC 8238, this document provides AI fabric context
    extensions and refinements; the foundational definitions in those RFCs remain
    authoritative for general network benchmarking.</p>

abstract:
- content: "<p>The WIMSE AI Identity Management System (AIMS) requires tamper- evident
    agent audit logs but does not specify their format or discovery. This document
    maps the AIMS minimum fields to the SCITT Agent Execution Evidence profile, defines
    one claim that binds a workload credential to the persistent agent, governing
    policy, expected Evidence Service and optional Assurance Statement, and defines
    an in-toto predicate type for carrying Execution Receipts in the audit format
    proposed for WIMSE. It also describes how a service admits an agent's call by
    checking its assurance at the moment of the request, and defines an HTTP field
    that links each call to the caller's evidence. It is input to the AIMS work and
    makes no change to it.</p>"

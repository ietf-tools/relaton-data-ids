abstract:
- content: "<p>AI agents are beginning to move money, release confidential data, change
    cloud privileges, and command industrial and other critical- infrastructure equipment.
    Existing controls answer whether an actor or request may proceed. These include
    authentication, OAuth scopes, conditional access, risk engines, and attestation.
    None of them, alone, guarantees three things about the consequence that finally
    occurs: that it is the exact act that was evaluated, that it is still permitted
    under current state, and that it cannot be replayed, substituted, or routed around
    the check. Risk engines that return ESCALATE widen this gap. The escalation is
    a label, and nothing forces the stricter conditions it implies to reach the point
    where the effect actually happens. This document defines Graduated and Escalated
    Conditional Execution Finality. Every AI-generated operation is held as a non-effective
    Candidate Act. It is classified into a graduated release class rather than a binary
    allow/deny: ordinary, reduced, escalated, canary, sandbox, review, quarantine,
    or deny. For an elevated-risk act, the system first derives a narrower consequence
    boundary. It then binds the required controls into an act-bound, sink-bound Execution
    Handle; examples include a lower value, one named recipient, protected approval,
    short validity, fresh attestation, and single use. The Finality Sink at the last
    preventable boundary re-verifies those controls against current protected state,
    atomically with effectuation. The contribution is threefold. First, escalation
    changes executable authority, not merely a decision record. Second, escalation
    is monotonic: it cannot be laundered, fragmented, downgraded, or resubmitted away
    on its path to the sink. Third, the Finality Sink is shown to be necessary but
    not sufficient, so finality is an end- to-end property rather than a gateway.
    The document specifies nineteen testable enforcement points, from the base execution-
    dependency mechanism to proxy, hardware, escrow, rollback, inheritance, and path-closure
    requirements. It also provides a comparison with conventional mechanisms, a security
    model with explicit assumptions and invariants, a latency model, escalation- specific
    attacks, and the problems it leaves open.</p>"

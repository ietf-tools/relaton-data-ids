abstract:
- content: "<p>Quantum Key Distribution (QKD) links generate symmetric key material
    between directly connected QKD nodes. Trusted relay is commonly used to extend
    key delivery beyond the reach of a single QKD link. A complete trusted-relay service
    requires the network to collect QKD link and node quantum capability information,
    compute a relay path according to service requirements, translate the result into
    a network forwarding path, and carry the relayed key information in an IPv6/UDP
    packet steered by that path. This document describes an architectural framework
    for such a service. Each QKD link provides its link quantum capability such as
    available quantum key rate capacity, and each relay node provides its node quantum
    capability. A controller uses these inputs together with application requirements
    to calculate a relay path. The path- computation algorithm is not standardized
    and may be selected or defined by the user, operator, or implementation. The calculated
    relay sequence is represented as an SRv6 path, and UDP packets following that
    path carry the key-relay information. This document identifies the protocol extension
    points needed to support the framework. The detailed encodings, message formats,
    TLVs, and signaling procedures are left for future work and are marked as TBD.</p>"

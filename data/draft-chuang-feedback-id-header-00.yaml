abstract:
- content: <p>Large-volume email senders and Email Service Providers (ESPs) use Feedback
    Loops (FBLs) to identify campaigns in their traffic that generate a high volume
    of spam complaints from recipients and to detect abuse of their services. Traditional
    per-message complaint reports can expose individual recipient actions, creating
    privacy concerns. This document specifies the "Feedback-ID" email header field,
    which allows senders to embed structured campaign, customer, mail-type, and sender
    identifiers in outbound messages. Receiving mailbox providers authenticate this
    header field using DomainKeys Identified Mail (DKIM) and report aggregated spam
    complaint rates per identifier back to verified senders without disclosing individual
    recipient data.</p>

abstract:
- content: "<p>Group communication over the Constrained Application Protocol (CoAP)
    can be secured by means of Group Object Security for Constrained RESTful Environments
    (Group OSCORE). At deployment time, devices might not know the exact security
    groups to join, the respective Group Managers responsible for those groups, or
    other information required to perform the joining process. This document defines
    how a CoAP endpoint can use descriptions and links of resources registered at
    the CoRE Resource Directory to discover security groups and to acquire information
    for joining them through the respective Group Managers. A given security group
    can be used to protect communications in multiple application groups, which are
    separately announced in the Resource Directory as sets of endpoints sharing a
    pool of resources. This approach is consistent with, but not limited to, the joining
    of security groups based on the Authentication and Authorization for Constrained
    Environments (ACE) framework.</p>"

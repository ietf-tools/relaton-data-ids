abstract:
- content: "<p>This document defines Wallet State Attestation: a primitive in which
    an issuer reads on-chain state for a wallet address, evaluates one or more operator-defined
    conditions, and returns a cryptographically signed boolean (or structured fact
    profile) that any verifier can check offline using a published JWKS endpoint.
    The primitive enables condition-based access decisions without identity presentation,
    credential exchange, or trust in the issuer at runtime. This document describes
    the request and response surface, the signing algorithm posture, the JWKS discovery
    pattern, and the security and privacy considerations of the primitive. It does
    not define a new wire protocol; rather, it profiles existing IETF building blocks
    (JWT, JWKS, JOSE) for the wallet-state-attestation use case.</p>"

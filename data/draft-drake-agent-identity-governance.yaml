abstract:
- content: "<p>The Agent Identity Registry System (AIRS) provides durable identity
    infrastructure for autonomous entities such as AI agents and robots, with graduated
    assurance ranging from scarcity-backed physical anchors through protected-key
    and software-only participation. Its companion specifications deliberately do
    not define or empower a governance authority; they describe the functions such
    an authority must perform and defer its constitution to a separate effort. This
    document defines that body: the Agent Identity Authority (AIA). It specifies the
    Authority's name, legal form, mission, and relationship to the protocol specifications;
    its membership categories and Board composition; binding geographic-diversity
    rules and non-binding advisory recommendations for ideal composition; the accreditation,
    dispute-resolution, hardware trust store, transparency, and funding frameworks
    it operates; and the bootstrap process by which the Authority forms and assumes
    stewardship of the global production namespace. The Authority governs infrastructure,
    not behavior: it stewards the aid namespace, hardware roots of trust, accreditation,
    and production Registry Operator succession. It does not regulate what agents
    do. Its legitimacy derives from being the least-objectionable steward of a shared
    resource, in the tradition of ICANN, the regional Internet registries, and the
    W3C, and its charter is designed so that no single nation, region, or company
    can capture it or holds a formal veto over it, although supermajority rules let
    a large enough coordinated bloc block consequential decisions.</p>"

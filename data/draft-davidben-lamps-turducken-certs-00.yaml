abstract:
- content: "<p>This document defines a mechanism to embed one or more alternate certificates
    within a single outer certificate. The outer certificate remains parseable to
    a legacy relying party that is unaware of this specification. Each alternate certificate
    certifies the same subject information, but with a different issuer. This can
    be used to help TLS on the Web transition securely to post-quantum authentication,
    as well as other PKI transitions with similar constraints.</p>"

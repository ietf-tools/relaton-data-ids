abstract:
- content: "<p>This document wraps the AIIF model for governing autonomous systems
    in one architecture: AIID (durable principal identity) and AIIP (the agents-only
    access plane). The primary rule is no surprise: autonomous systems MUST NOT act
    outside their authorized task and grant. Consequential action is carried on AIIP
    only (Resolve, Invoke, signed Receipt of execution). HTTPS remains the human plane;
    agents MUST NOT use HTTP/HTTPS as their consequential action path (this does not
    forbid TLS or underlay transport). Controls include Monitor freeze, HQ set-active,
    network-wide freeze, and revocation. Companion work already on the Datatracker
    includes the AIID namespace, AIIP architecture, AIIP core, native-access exploration,
    and execution- outcome attestation. This is regulation by channel, not a ban on
    intelligence. This document is an individual Experimental Internet- Draft; it
    does not claim Working Group adoption or RFC status.</p>"

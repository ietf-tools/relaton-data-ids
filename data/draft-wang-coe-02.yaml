abstract:
- content: "<p>This document defines COE-2, an optional profile of the Judgment Event
    Protocol (JEP) [JEP] for binding shared observation records and shared-state claims
    across heterogeneous agents, sensors, world models, simulators, and human-operated
    systems. COE-2 defines one critical JEP record-binding extension, two minimal
    digest-addressed record types, evidence-reference semantics, and independent COE
    validation checks. JEP remains authoritative for event verbs, Event Identity,
    Event Hash, signatures, references, extension processing, validation modes, and
    acceptance semantics. COE-2 provides verifiable shared-observation infrastructure.
    It does not determine objective world truth, factual causality, consensus, authorization,
    legal effect, fairness, trust weights, or regulatory compliance. A valid COE result
    establishes only the cryptographic and structural properties actually checked
    under the selected profiles.</p>"

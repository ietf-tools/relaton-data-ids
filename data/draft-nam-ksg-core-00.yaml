abstract:
- content: "<p>This document specifies the core of Keysingate: the canonical form
    and signature envelope of its documents, the time format and the rule that gives
    a signed object an upper time bound from public-network anchors, and the documents
    of the issuance channel -- release, delegation, block allocation, block closure,
    agent binding, container initiation, key inclusion, class promotion -- together
    with the status record that tracks a container's life. It is written so that two
    independent implementations produce the same bytes and reach the same verdict.
    The work journal kept inside a container, and its export, are specified in a companion
    document.</p>"

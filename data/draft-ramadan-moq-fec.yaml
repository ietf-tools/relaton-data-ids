abstract:
- content: "<p>This document specifies a mechanism for transmitting Forward Error
    Correction (FEC) repair data alongside source media in Media over QUIC (MoQ) sessions.
    It defines catalog-based signaling of FEC configuration, including a derived RaptorQ
    Object Transmission Information that needs no in-session messages. It also defines
    conventions for repair track naming, the format of repair objects, and two block
    profiles that fix how source symbols and FEC blocks are formed and identified:
    an ISO/IEC 23008-1 profile for tracks packaged as MPEG Media Transport Protocol
    (MMTP) packets, and an object profile for tracks packaged as Low Overhead Media
    Container (LOC) or Common Media Application Format (CMAF) objects. It fully specifies
    two FEC schemes: the systematic Reed-Solomon code over GF(2^8) of ISO/IEC 23008-10,
    which is mandatory to implement, and RaptorQ (RFC 6330), which is optional. An
    algorithm registry provides extension points for additional schemes. FEC enables
    receivers to recover from packet loss without retransmission latency. The MMTP
    profile is designed for compatibility with ATSC 3.0 (A/331) and ARIB STD-B60 broadcast
    systems.</p>"

abstract:
- content: "<p>This document defines the control framework for Optical Networks and
    AI Computing Orchestration (ONCO). The framework is designed to achieve synergistic
    management of optical network (e.g., fgOTN, OXC) and computing resources for high-performance
    AI workloads. It specifies a multi-stakeholder service model, a layered architecture
    across management, control, and data planes, and a set of functional components.
    The ONCO framework supports both centralized and distributed orchestration models
    to enable proactive resource reservation and deterministic optical circuit provisioning.</p>"

- id: draft-ietf-idr-ts-flowspec-srv6-policy
  type: Internet-Draft
  primary: true
abstract:
- content: "<p>BGP Flow Specification (FlowSpec) provides mechanisms to distribute
    traffic filtering and steering rules across BGP networks. This document specifies
    BGP FlowSpec procedures to steer matching traffic flows into Segment Routing (SR)
    Policies. Specifically, it defines normative protocol mechanisms for combining
    FlowSpec NLRIs with specific BGP Extended Communities for transport policy steering
    in SR-MPLS and SRv6 networks (Mode 1), and optionally with the BGP Prefix-SID
    Attribute when egress service action execution is required in SRv6 networks (Mode
    2).</p>"
  language:
  - en
  script:
  - Latn
  format: text/html

abstract:
- content: "<p>This document specifies a DHCPv4 option and a DHCPv6 option that carry
    the HTTPS URI of an AI gateway descriptor. The descriptor is a Provisioning Domain
    Additional Information document. It identifies a forward proxy and the destinations
    for which that proxy is to be used. The DHCP options do not carry proxy credentials,
    model identifiers, or a Proxy Auto-Configuration script.</p>"

abstract:
- content: "<p>This document describes a Fabric Coordination Layer (FCL) for high-
    scale distributed artificial intelligence (AI) training fabrics. FCL coordinates
    transmission authority using a Global Token Ledger (GTL) and applies that authority
    through Distributed Credit-Orbit Pacing (DCOP). The architecture relates workload
    communication intent to available fabric capacity before traffic is injected.
    The design objectives are to mitigate synchronized incast, reduce queue pressure
    and tail-latency variability, and improve collective communication efficiency.
    These objectives require experimental validation. This revision clarifies the
    architectural scope and physical constraints of FCL; it does not define an interoperable
    protocol or a production hardware implementation.</p>"

abstract:
- content: "<p>[DKIM2] and its associated documents describe the DomainKeys Identified
    Mail v2 (DKIM2) email authentication protocol. DKIM2 is designed to address shortcomings
    in email authentication protocols and mechanisms released prior to DKIM2, specifically
    SPF [RFC7208], DKIM [RFC6376], DMARC [RFC9989], and ARC [RFC8617]. This document
    discusses best practices for signing, handling, and validating messages that carry
    DKIM2 signatures, and for interoperating with the authentication protocols and
    mechanisms that preceded DKIM2.</p>"

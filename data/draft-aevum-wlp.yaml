abstract:
- content: "<p>This document specifies WLP v0, the Wet-Lab Protocol for translating
    AI hypotheses (PACR records) into machine-executable wet-lab instructions. WLP
    is the longevity-research analogue of SCP (Science Context Protocol) from the
    photoresist automation domain. The protocol is royalty-free (Apache-2.0). Reference
    implementations in Rust (crates/wlp-conformance) and Python (agentcard_adapters.wlp_conformance)
    are provided.</p>"

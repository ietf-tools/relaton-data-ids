abstract:
- content: "<p>MispQL is a read-only, SQL-like query language for cyber threat intelligence
    (CTI). This document specifies its text syntax using Augmented Backus-Naur Form
    (ABNF), its query semantics, and a JSON representation for its Boolean filters.
    A CTI platform can implement MispQL over its own data model by describing the
    tables, fields, types, and operators it supports. A transport binding describes
    how the Python MispQL client uses the complex-search interface in MISP 3.0.</p>"

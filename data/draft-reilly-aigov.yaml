abstract:
- content: "<p>Organizations deploying artificial intelligence systems are increasingly
    required to state which systems they operate, what data those systems process,
    on what authority, and under what human oversight. Today these statements are
    produced as unverifiable self- assertions: spreadsheets, questionnaire responses,
    and policy documents that cannot be checked by a relying party and cannot be shown
    to have existed before an incident. This document defines an evidence layer for
    AI governance. It specifies five record types (the AI System Record, the Governance
    Event Record, the Register Completeness Attestation, the Erasure Record, and the
    Selective Disclosure Response), a hash-linked append- only AI System Register
    that carries them, and verification procedures that let an auditor, a regulator,
    or a counterparty confirm what an operator asserted and when the assertion was
    made. The record format is built on salted per-field commitments so that a register
    can be published, audited, and retained for long periods without publishing the
    underlying data, and so that personal data can be erased while the integrity of
    the register survives. This property is referred to here as Erasure-Compatible
    Permanence.</p>"

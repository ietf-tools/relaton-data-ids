abstract:
- content: <p>This document binds the Forward Error Correction (FEC) configuration
    data model of the MoQ FEC core mechanism to the catalog of the MOQT Streaming
    Format (MSF) and to its Common Media Application Format (CMAF) profile. It defines
    the track-level "fec" array of FEC instance objects, the fields with which a repair
    track or a symbol track describes its own role, the packaging values "fec-repair"
    and "fec-source", the validation rules that are specific to the catalog encoding,
    and the handling of unknown keys, so that a receiver that obtains a track's catalog
    entry can configure its decoder without in- session signaling.</p>

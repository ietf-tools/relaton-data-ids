abstract:
- content: "<p>This document defines OAuth Actor Receipts, an optional companion to
    the OAuth Actor Profile for Delegation. Each receipt is a signed JSON Web Token
    (JWT) attesting which issuer added an actor hop and, optionally, the hop's historical
    presenter binding. The actor_receipts claim carries a hash-linked chain of receipts
    that recipients verify against each hop's issuer. This document specifies receipt
    processing rules and the associated metadata parameters and introspection response
    members.</p>"

abstract:
- content: "<p>When one system tells another about a trait it has inferred about a
    person, the receiver today learns the trait and a confidence, and nothing about
    what the inference was drawn from. Because the receiver cannot tell a trait the
    person stated in answer to a question from one read off the person's activity
    on a linked platform, it cannot apply the lawful basis, consent and context limits
    that belong to each. This document defines a source tag carried with every inferred
    trait on the wire. The tag names, for each stream that contributed to the trait,
    a registered stream class, the provenance class of the observation, where the
    inference was computed, the lawful basis and purposes the stream was consented
    for, and the contexts the trait may be used in. It reuses the provenance- class
    vocabulary of the Morning Brief specification, establishes a registry of stream
    classes, and states the rules a receiver follows, including refusing a trait whose
    sources it cannot check. The same tag carries facts the person states about themselves,
    such as when they are available or the terms on which they offer something, and
    those facts keep the limits of the stream they were given on. It defines a wire
    field only. How traits are inferred, stored or scored is out of scope.</p>"

abstract:
- content: "<p>This document describes a Transparent Ordered Bonding (TOB) mechanism
    for high-capacity wide-area links that are physically composed of multiple lower-rate
    member links. Traditional flow-based load balancing mechanisms can preserve packet
    ordering, but they cannot fully utilize all member links for a single large traffic
    stream. TOB introduces a bonding layer between two adjacent network nodes. The
    bonding layer fragments ingress packets into cells, distributes them across member
    links according to link status, and reassembles them in strict order at the remote
    node. This document specifies the applicability, architecture, packet format,
    scheduling considerations, and resequencing behavior of TOB.</p>"

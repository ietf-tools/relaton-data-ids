abstract:
- content: "<p>This document defines JEP Action Mandate Profile 2 (JEP-AMP-2), a profile
    of the Judgment Event Protocol (JEP) [JEP]. JEP-AMP-2 specifies how a JEP Delegation
    event can express a bounded, verifiable, terminable, and auditable mandate for
    an agent, human, organization, workflow, or system to attempt an action on behalf
    of a principal. JEP-AMP-2 does not redefine JEP-Core event verbs, Event Identity,
    Event Hash, signature semantics, validation checks, identity systems, credential
    systems, legal liability, payment clearing, or global authorization validity.
    It defines a signed Action Mandate Descriptor and profile-level rules for evaluating
    mandate validity under an explicit trust, policy, domain, and relying-party context.</p>"

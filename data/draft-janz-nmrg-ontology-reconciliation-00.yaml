abstract:
- content: "<p>This document describes a possible direction for inter-system communication
    in network management, in which two cognitive software agents establish between
    themselves the basis for exchanging information, without depending on a single
    rigid data model agreed by their implementers in advance. The agents bring relevant
    knowledge, can extend it through learning, can reason, and can converse in natural
    language. The approach is framed as a workflow in which each agent makes explicit
    the ontology implicit in its data model, the two agents address their differences
    through conversation, and a translator artefact is produced that is then used
    during ordinary operation. A central property is that language-model inference
    is consumed during the agents' conversation rather than on each subsequent message.
    The document situates the direction relative to adjacent work and illustrates
    it through three use cases drawn from network management.</p>"

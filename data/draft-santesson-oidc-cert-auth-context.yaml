abstract:
- content: "<p>RFC 7773 defines the Authentication Context certificate extension,
    which carries information about how the subject of an X.509 certificate was authenticated
    when the certificate was issued. RFC 7773 defines one context information type,
    for subjects authenticated by means of a Security Assertion Markup Language (SAML)
    assertion. This document defines a second context information type for subjects
    authenticated by means of OpenID Connect, where the identity information is obtained
    from an ID Token, where applicable in combination with a UserInfo Response. The
    information is expressed as a JSON object and provides the OpenID Connect counterpart
    to the SAML Authentication Context Information defined in RFC 7773. This document
    also updates RFC 7773 by clarifying that an application processing the extension
    ignores context information types it does not support regardless of the criticality
    of the extension, and by recommending that the extension not be marked critical.</p>"

abstract:
- content: "<p>This document defines a way to carry a verifiable record of security
    enforcement inside IPv6 packets. Each firewall (or other security enforcement
    point) that handles a packet writes a small, authenticated note saying which rule
    it matched and what action it took. The notes are protected by a chained Integrity
    Check Value (ICV), reusing the construction defined for In-situ OAM (IOAM) data
    integrity. A checker can then prove two separate things: that the notes are authentic
    (not forged or changed on the way), and that the recorded actions match the intended
    policy. Because the two checks are independent, a firewall that honestly diverges
    from policy -- for example because of a stale rule or an implementation bug --
    still produces an authentic note, and the divergence is reported rather than hidden.
    Operators thus gain precise per-hop evidence that every enforcement point was
    traversed and applied the intended policy, so an EP that was skipped or did not
    enforce is revealed.</p>"

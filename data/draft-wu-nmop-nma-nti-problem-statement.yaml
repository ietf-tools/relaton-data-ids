abstract:
- content: "<p>AI-driven Network Management Agents (NMAs) are being deployed to automate
    operational workflows such as cross-domain fault diagnosis and service remediation.
    While the IETF has standardized service data models and access protocols through
    the Controller NBI (RFC 8969), these provide atomic configuration and monitoring
    capabilities, not the semantics for delegating end-to-end operational tasks to
    an autonomous agent. As a result, NMA northbound interfaces are vendor-specific
    overlays. This document defines the problem statement for the Northbound Task
    Interface (NTI): the interface through which an operator or OSS delegates operational
    tasks to an NMA.</p>"

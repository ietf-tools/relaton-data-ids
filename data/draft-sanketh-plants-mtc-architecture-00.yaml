abstract:
- content: "<p>Merkle Tree Certificates (MTCs) make transparency logging part of certificate
    issuance, enabling Internet-scale deployments of short- lived certificates and
    large post-quantum signatures. In exchange, their security rests on the state,
    not just the keys, of the certification authority, its cosigners, and relying
    parties' update services. This document describes the architecture for deploying
    MTCs and defines the guarantees that a relying party can obtain when it accepts
    one. These cover who certified and who recorded the certificate, agreement among
    relying parties on each log entry, the enforcement of revoked ranges, and the
    validation of the relying party's own configuration. For each guarantee, we state
    which parties must behave as specified and which keys and state they must keep
    intact. Our Recommendations are not needed to interoperate, but they affect the
    guarantees a deployment achieves, especially against adversaries able to compromise
    a certification authority, a cosigner, or an update service.</p>"

abstract:
- content: "<p>This document defines nine quantum-resistant TLS 1.3 key exchange algorithms
    based on HQC-KEM, the code-based KEM selected by NIST for standardization in forthcoming
    FIPS 207. Three use HQC-KEM standalone, two combine it with X25519 or X448 in
    PQ/T hybrids, two combine it with ML-KEM in PQ/PQ hybrids, and two combine it
    with ML- KEM and X25519 or X448 in PQ/PQ/T hybrids. Because HQC-KEM relies on
    hardness assumptions and constructions different from those underlying lattice-based
    ML-KEM, these algorithms provide algorithmic diversity that can mitigate the impact
    of future cryptanalytic advances or implementation weaknesses in lattice-based
    cryptography. The algorithms are intended for TLS 1.3, DTLS 1.3, and QUIC, and
    the hybrid algorithms follow the general hybrid key exchange construction defined
    for TLS 1.3.</p>"

abstract:
- content: "<p>This document specifies the _utxo application namespace for DNS. It
    defines how wallet clients and TEE (Trusted Execution Environment) applications
    resolve verifiable payment endpoints and blockchain UTXO (Unspent Transaction
    Output) references using DNS. To avoid exacerbating public RRTYPE space congestion
    and DNS-layer transparent parsing, this document utilizes the RFC 3597 Private-use
    space (QTYPE 65400). The DNS protocol does not parse the payload. Application
    semantics are isolated strictly via the _utxo underscore prefix in the owner name,
    while the RDATA consists of a purely opaque CBOR-encoded byte stream.</p>"

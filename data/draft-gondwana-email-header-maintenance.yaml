abstract:
- content: <p>The IANA "Message Headers" registries record, for each registered header
    field, the protocol it belongs to, its status, whether it is a trace field, and
    the documents that specify it. Many documents have added entries over more than
    two decades, and the metadata in the registries is less complete than the metadata
    those documents supplied. RFC 4021, which performed the largest single bulk registration,
    gave IANA an explicit status and an explicit specification document for each of
    the roughly ninety fields it registered. Neither was recorded. Those entries carry
    a blank status and cite RFC 4021 itself in place of the specification. This document
    updates RFC 4021 by directing IANA to record the values its registration templates
    supplied. The "Trace" column, added to both registries by the revision of RFC
    5322, was deliberately left empty for existing entries so that it could be filled
    in later. This document reviews the definition of each registered header field
    and every subsequent update to it, and gives IANA a single set of instructions
    for completing and correcting each entry. Each recommended change, and each decision
    to leave a non-obvious entry unchanged, is justified from the instructions or
    the clear intent of the documents that defined or modified the field.</p>

abstract:
- content: "<p>This document defines a YANG data model for the BGP Flow Specification
    (Flowspec) address families. The model augments the BGP YANG model to add all
    Flow Specification address families, including Flowspec-specific configuration,
    the Flow Specification RIB, and per-neighbor Adj-RIBs, and defines notifications
    for the prefix limit exceeded and route state change events.</p>"

abstract:
- content: "<p>This document aims to submit a few updates to RFC 2289 [RFC2289], which
    describes a One-Time Password (OTP) System: an application programming interface
    to the new Secure Hash Algorithms (SHA256, SHA384, and SHA512), an algorithm for
    folding hashes to 64 bits, using alternate dictionaries, and automatic renewal
    of authentication parameters will be described.</p>"

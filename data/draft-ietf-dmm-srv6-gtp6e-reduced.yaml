abstract:
- content: "<p>Segment Routing over IPv6 for the Mobile User Plane specifies interworking
    between SRv6 networks and GTP-U networks including required behaviors. This document
    specifies a new behavior named End.M.GTP6.E.Red which makes the End.M.GTP6.E behavior
    more amenable to hardware implementation by encoding the information required
    for GTP-U encapsulation in a single SRv6 SID, together with a locally maintained
    mapping.</p>"

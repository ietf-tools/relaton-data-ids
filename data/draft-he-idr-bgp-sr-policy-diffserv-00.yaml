abstract:
- content: "<p>This document defines BGP extensions to associate a Differentiated
    Services (DiffServ) Per-Hop Behavior (PHB) with a Segment Routing (SR) Policy
    candidate path. It introduces a new sub-TLV carried in the BGP Tunnel Encapsulation
    Attribute that accompanies an SR Policy NLRI, thereby publishing the binding between
    an SR Policy candidate path and a PHB.</p>"

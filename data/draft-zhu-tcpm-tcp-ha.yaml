abstract:
- content: "<p>This document describes the conditions under which a standby device
    can continue an established TCP connection after failure of the active device,
    without requiring changes at the remote TCP endpoint. It distinguishes connection
    continuity from application recovery and specifies observations for evaluating
    a failover attempt. It defines no new TCP option, state transfer protocol, or
    interoperability requirement.</p>"

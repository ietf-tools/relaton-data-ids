abstract:
- content: "<p>This document specifies the core of the Invoice Trust Protocol (ITP).
    ITP lets a business in any country find where and in which syntaxes another business
    receives invoices, deliver a signed invoice to it over HTTP, and obtain a signed
    acknowledgment. It also lets any later holder of the invoice, such as the buyer,
    a bank, or an auditor, check who issued it, that it was not altered, and which
    tax or network registrations exist for it. ITP carries invoices in existing syntaxes,
    defines no invoice data model, and works alongside the channels that tax authorities
    and networks make mandatory. Commercial statuses, payment information, and agent
    mandates are specified in companion documents.</p>"

abstract:
- content: "<p>The BGP Monitoring Protocol (BMP) allows routers to export BGP RIB
    data and statistics to external collectors. However, dynamic changes to a router's
    monitoring configuration—such as disabling specific Address Families or statistic
    counters—are not explicitly signaled to the collector. Consequently, collectors
    cannot distinguish between a quiescent BGP state and a disabled monitoring feed,
    leading to data staleness and database pollution. This document defines a new
    BMP message type, the BMP Monitoring Options (MO) message. It allows a BMP Sender
    to explicitly notify collectors of active, disabled, or dynamically altered reporting
    configurations across RIB types and statistics streams.</p>"

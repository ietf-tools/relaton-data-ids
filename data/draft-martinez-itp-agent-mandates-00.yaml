abstract:
- content: "<p>This document lets a business authorize a software agent to issue,
    accept, reject, or dispute invoices, and to report payments, through the Invoice
    Trust Protocol (ITP), within limits that the business sets. An authorization is
    a mandate: a Selective Disclosure JSON Web Token (SD-JWT) credential issued by
    the business to a key held by the agent and enforced by a named ITP node that
    records each use.</p>"

abstract:
- content: <p>The Deprecation and Sunset HTTP response header fields, defined in RFC
    9745 and RFC 8594 respectively, let a server signal that a resource, identified
    by its URI, has been or will be deprecated and when it will be removed. They operate
    at the granularity of a resource and cannot describe the lifecycle of an individual
    member within a request or response representation. This document defines the
    "application/deprecations+json" media type, a machine-readable Deprecation Manifest
    in which an API operator declares dated deprecation and sunset timelines for specific
    members of request and response representations. The manifest is discovered through
    the existing "deprecation" link relation type and is decoupled from any API description
    or schema, allowing each deployment to publish its own timeline without changing
    the wire behaviour of the API.</p>

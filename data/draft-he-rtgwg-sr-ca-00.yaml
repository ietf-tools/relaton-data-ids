abstract:
- content: "<p>This document describes a generic solution of congestion avoidance,
    which is aimed at providing local link congestion avoidance within the Segment
    Routing (SR) framework. Based on the concept of Topology Independent Loop-Free
    Alternate (TI- LFA) Fast Reroute (FRR), the selected shortest path can bypass
    the congested link while avoiding the formation of micro-loops. The advantage
    of this solution is that it does not require any protocol extension.</p>"

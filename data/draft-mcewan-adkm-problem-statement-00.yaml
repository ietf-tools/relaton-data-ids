abstract:
- content: "<p>Many Internet applications require stable, long-lived identifiers whose
    controlling cryptographic keys evolve over time. Existing standards provide mature
    mechanisms for certification, transparency, self-certifying identifiers, decentralized
    identifiers, and shared consensus over state. However, these mechanisms address
    different trust and deployment models. This document identifies an interoperability
    gap in deployments that require stable identifier continuity, controller-authorized
    key-state evolution, independently verifiable event histories, and consistency
    evidence without requiring either a designated administrative issuer to authorize
    each state transition or participation in a global consensus system. The document
    defines the problem space for Autonomous Decentralized Key Management (ADKM),
    describes related approaches, and identifies requirements and scope boundaries
    for a possible application- independent key-state evolution architecture.</p>"

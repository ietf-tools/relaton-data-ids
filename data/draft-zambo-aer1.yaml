abstract:
- content: "<p>This document specifies AER-1, a small vocabulary for recording one
    AI agent tool call as a portable, independently checkable execution receipt. A
    receipt identifies the execution, records when it happened, preserves the canonical
    bytes used for the output commitment, names the tool and caller scope, carries
    a provenance class, and resolves at a stable public URL. The format separates
    what the system observed from claims about the outside world, and it separates
    provenance (who ran or reported the action) from the record itself. A reference
    implementation is deployed, and its receipts are publicly verifiable without an
    account or token. The specification workflow receipts, which bind an ordered sequence
    of step receipts to a single goal with a Merkle root over the step sequence, and
    hash-chained job timelines for tamper-evident sequencing of executions. This revision
    closes honesty and precision gaps: it adds the workflow-receipt truncation limit
    (new Section 8.4), normatively specifies the external anchor format and its verification
    procedure (rewritten Section 10, new Section 10.1), fixes a RECOMMENDED/MUST contradiction
    in Section 8.1, makes the Section 6 verification step testable, and documents
    replay, low-entropy, empty-record, and size-limit considerations. It changes no
    receipt field, digest construction, or existing verification rule.</p>"
  language:

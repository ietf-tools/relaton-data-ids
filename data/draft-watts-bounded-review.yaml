abstract:
- content: "<p>Technical standards work benefits from extensive reading, comparison,
    and revision. However, examining many documents does not demonstrate that every
    relevant RFC, Internet-Draft, publication, or earlier contribution has been reviewed.
    This document discusses a voluntary approach to describing the scope and limits
    of related-work review in Internet-Draft contributions. It proposes a review-coverage
    statement, an illustrative record, and a process for correcting unsupported novelty
    claims. The approach does not replace IETF policies, create a new protocol, or
    certify priority, originality, or completeness.</p>"

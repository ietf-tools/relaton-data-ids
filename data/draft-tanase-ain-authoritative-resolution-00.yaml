abstract:
- content: "<p>This document specifies AIN-WRP, a protocol-independent mechanism for
    authoritative resolution of persistent digital agent identities and for verification
    of relationship-specific state before a digital agent begins a protected operational
    interaction with another agent or with a non-agent service or system. An Agent
    Identity Number (AIN) acts as a stable lookup anchor. The protocol resolves current
    identity, lifecycle, operator or authority, endpoint, mandate, restriction, provenance,
    and cryptographic verification information from sources competent to make the
    corresponding assertions. AIN-WRP separates persistent identity from credentials,
    proof of control, delegated authority, operational eligibility, policy decision,
    and execution. For participants operating under independent administrative domains,
    the protocol performs logically independent resolution, validates source competence
    and evidence freshness, correlates the resulting assertions for the proposed relationship,
    and produces a Pre-Interaction Trust State. A signed, time-limited State Proof
    may convey that state to a gateway or relying party. The gateway applies local
    policy and controls whether an A2A, MCP, API, messaging, transactional, or proprietary
    protocol begins. This version defines the protocol model and the initial requirements
    for future interoperable profiles. It does not require all AIN registration, resolution,
    assertion issuance, policy evaluation, or operational enforcement to be performed
    by a single central service, a mandatory Regional Network Operator (RNO), or a
    particular gateway, identity provider, authorization framework, or execution protocol.</p>"

abstract:
- content: "<p>Remote attestation can establish evidence about the hardware, firmware,
    software, configuration, and execution environment associated with a workload.
    In heterogeneous confidential-computing environments, this trust assessment can
    extend across CPUs, confidential virtual machines, GPUs, AI accelerators, DPUs,
    SmartNICs, and other trusted execution components. An increasingly important class
    of workloads, however, does not merely compute data. AI agents and autonomous
    workloads can generate consequential operations such as API invocations, storage
    mutations, network configuration changes, infrastructure-control commands, financial
    instructions, device operations, and cross-workload requests. Successful attestation
    of the environment that generated such an operation does not, by itself, require
    that every subsequently generated operation acquire external effect. This document
    describes an attestation-bound execution-finality architecture in which a consequential
    operation first exists as a Candidate Act in a non-effective state. Before that
    act can acquire external effect, its relevant parameters are cryptographically
    bound to validation context that can include Attestation Results, workload identity,
    execution context, policy, authorization scope, freshness information, and other
    application-specific evidence. A designated Finality Sink verifies the required
    binding at or before the boundary at which the Candidate Act would first acquire
    external effect. The resulting separation is: trusted computation is not, by itself,
    act-specific authority. The architecture is intended to complement, rather than
    replace, Remote ATtestation procedureS (RATS), Entity Attestation Token (EAT)
    [EAT], workload-identity systems, confidential computing, Trusted Execution Environments
    (TEEs), accelerator attestation, and existing authorization mechanisms.</p>"

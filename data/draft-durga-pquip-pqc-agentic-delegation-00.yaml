abstract:
- content: '<p>Autonomous AI agent ecosystems rely on multi-hop cryptographic delegation
    chains and signed execution traces (currently built on Ed25519, ECDSA P-256, and
    RSA-PSS) to enforce least-privilege tool invocations across Model Context Protocol
    (MCP) and Agent-to-Agent (A2A) boundaries, and to preserve long-term non-repudiation
    for regulatory audit logs. This architecture faces two existential vulnerabilities
    in the Post-Quantum era: (1) "Harvest-Now, Forge-and- Repudiate-Later" (HNFRL)
    attacks, wherein Cryptographically Relevant Quantum Computers (CRQCs) running
    Shor''s algorithm retroactively forge or repudiate multi-year compliance traces
    (e.g., 7-to-10-year HIPAA, SOX, FDA 21 CFR Part 11, and defense operational logs)
    and synthesize retroactive human-in-the-loop approvals; and (2) "Lattice Signature-Bloat
    Amplification," wherein naively substituting 64-byte Ed25519 signatures with 3,309-byte
    ML-DSA-65 (FIPS 204) signatures across a 10-hop sub-agent chain inflates per-call
    authorization headers from 640 bytes to over 46 KB (including public keys), exceeding
    HTTP/2 header limits and degrading sub-10ms real-time tool routing. This document
    specifies a wire-compatible Post-Quantum Agentic Delegation and Trace Receipt
    profile ("PQ-Agentic"). It introduces a two-tier cryptographic architecture: (a)
    a Hot-Path Hybrid Delegation Envelope combining classical Ed25519 with ML-DSA-65
    (FIPS 204) via Pre-Verified Session-Grant Digest Chaining (PVSGDC), replacing
    redundant per-call inline re-transmission of O(N) prior delegators'' 5,261-byte
    ML-DSA-65 public keys and signatures with 32-byte SHAKE256 digests of out-of-band
    PEP-verified delegation grants; and (b) a Cold-Path Long-Horizon Archival Receipt
    anchored with stateless hash- based SLH-DSA-SHAKE-128f (FIPS 205) over RFC 9943
    SCITT transparency Merkle roots, guaranteeing 30-year quantum-resistant non-repudiation
    even under catastrophic lattice cryptanalysis.</p>'

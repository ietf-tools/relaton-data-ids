abstract:
- content: "<p>This document defines two formally provable consequences of retiring
    the IPv4 protocol stack in a dual-stack (IPv4 and IPv6) network environment: (1)
    complete elimination of attacks attributable to the IPv4 protocol, and (2) a minimum
    50% reduction in the count of concurrently exposed network-layer attack surfaces.
    Both results are established as definitional and structural derivations, independent
    of empirical attack-volume measurement. This document proposes standard terminology
    for discussing these effects and states explicitly the boundary between what is
    proven here and what remains an open empirical question.</p>"

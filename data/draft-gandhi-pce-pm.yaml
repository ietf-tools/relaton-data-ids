title:
- content: PCEP Extensions for Performance Measurement for SR-TE and MPLS-TE LSPs
    with Stateful PCE
  language:
  - en
  script:
  - Latn
  format: text/plain
docid:
- id: draft-gandhi-pce-pm
  type: Internet-Draft
  primary: true
abstract:
- content: "<p>In certain networks, network performance data such as packet loss,
    delay, and delay variation, as well as bandwidth utilization, are critical measures
    for Traffic Engineering (TE). These data provide operators with the characteristics
    of their networks for the performance evaluation required to provide Service-Level
    Agreements (SLAs). Stateful Path Computation Element Communication Protocol (PCEP)
    extensions have been defined for TE LSPs for Segment Routing (SR) and RSVP. This
    document specifies PCEP extensions that enable and notify end-to-end performance
    measurements, including liveness detection, for PCE-Initiated and PCC-Initiated
    LSPs. The extensions apply to SR-TE in the MPLS and IPv6 data planes and to MPLS-TE
    using RSVP, with notification to an Active Stateful PCE.</p>"
  language:
  - en
  script:
  - Latn
  format: text/html

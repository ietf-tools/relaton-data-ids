abstract:
- content: "<p>This document proposes an early-stage JSON envelope for exchanging
    research-evidence records containing claim status, evidence tier, source provenance,
    methods, falsifiers, replication status, artifact digests, and privacy review.
    It is an individual design proposal, not an IETF consensus document. Its intended
    contribution must be assessed against existing provenance and research-packaging
    specifications before further standardization work.</p>"

abstract:
- content: "<p>A cryptographically valid signature can authorize a transaction that
    the organization never intended. The hard problem in digital-asset custody is
    therefore not only protecting keys. It is stopping compromised workflows, delegated
    code, misleading transaction displays, stolen credentials, and legitimate automation
    (including AI agents) from turning broad technical capability into unrestricted
    transfers. This document proposes defender-controlled, consequence-specific authorization
    at three boundaries: signing, wallet execution, and withdrawal release. The defender
    reconstructs the operation that would actually take effect from the transaction
    bytes and account state, holds it in a non-effective state, evaluates it against
    independent policy and a protected exposure ledger, and releases only a bounded,
    act-bound, single-use authority at a mandatory enforcement point. The document
    specifies placement by chain type, requirements, a state machine with crash and
    reorganization handling, EIP-7702 delegation controls, a catalogue of edge cases
    and twenty-four threat scenarios, and an acceptance-test method with a reference
    simulator. It states the limits plainly: an off-chain gate cannot stop a leaked
    key that submits directly to a permissionless network, and it fails if the enforcement
    layer is bypassed or compromised. No deployment, measured latency, or real-world
    prevention is claimed.</p>"

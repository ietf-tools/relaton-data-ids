abstract:
- content: "<p>This document describes a protocol-neutral architecture for separating
    possession of capability from jurisdiction over consequential authority boundaries.
    It models authority as reachability in a time-indexed capability graph, defines
    commitment boundaries and independently controlled revocation cuts, and specifies
    fail-closed semantics for evidence, authorization, delegation, and revocation
    closure. Archive Status This RFCXML source is an archive working draft. It is
    not represented as submitted, adopted, or endorsed by the IETF.</p>"

abstract:
- content: "<p>This document specifies a mechanism for transferring a BGP Extended
    Community, in particular the Link Bandwidth Extended Community, from one prefix
    to another, which enables routers to dynamically adjust the distribution ratio
    for weighted load balancing in NAT scenarios, allowing a router to perform unequal
    cost load balancing according to the real capacity of compute clusters.</p>"

abstract:
- content: "<p>When an orchestrator agent delegates sub-tasks across a multi-hop Directed
    Acyclic Graph (DAG) of specialist agents, OAuth 2.0 Token Revocation (RFC 7009)
    revokes only individual client tokens and provides no mechanism to atomically
    halt in-flight child, grandchild, or sibling branches or enforce composite time-to-live
    windows across the entire execution tree. Furthermore, no protocol binds IEC 62443
    / Purdue Enterprise Reference Architecture (PERA) zone boundaries into agent capability
    receipts. This document specifies the Transitive CLEAR (Cryptographic Lease Early-Abort
    &amp; Revocation) DAG protocol and hard Operational Technology (OT) Level 0-2
    physical- safety firewalling.</p>"

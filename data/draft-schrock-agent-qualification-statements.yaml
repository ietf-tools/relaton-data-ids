abstract:
- content: "<p>Agent evaluations report what happened in a test environment. They
    do not, by themselves, establish that a measured candidate satisfies a relying
    party's policy, remains current, matches the runtime candidate, or is authorized
    to perform a consequential action. This document defines a portable Qualification
    Statement that binds a candidate, complete evaluation campaign, qualification
    policy, assignment, and status. It preserves three separate claims: observation,
    qualification, and authorization. A relying party can accept a current qualification
    as evidence at runtime, but MUST make a separate exact-action authorization and
    admission decision.</p>"

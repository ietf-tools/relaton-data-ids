abstract:
- content: <p>This document describes Bundle Multicast, a protocol that reduces network
    resource consumption in the forwarding of copies of a given Bundle Protocol (BP)
    data unit - a "bundle" - to all BP nodes that are members of a BP endpoint whose
    ID is formed in the "imc" URI scheme, here termed a BP "multicast group".</p>

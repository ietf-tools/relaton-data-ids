abstract:
- content: '<p>The Secured Digital Lifecycle Protocol (SDLP) defines a physics layer
    for digital objects: a set of non-negotiable behavioral laws that govern identity
    stability, lineage integrity, lifecycle determinism, and irreversible state transitions.
    SDLP Physics establishes how object security depletes, transforms, or terminates
    as an object is activated, used, or shared, ensuring that each operation consumes
    or alters the object’s allowable state in predictable ways. These laws prevent
    cloning, enforce legitimate descent, bind objects to their environments, and guarantee
    that destruction and zeroization are final. This document specifies the core physics
    that underpin SDLP’s security model and define how digital objects behave across
    all environments and distribution paths. This Internet-Draft is submitted in full
    conformance with the provisions of BCP 78 and BCP 79. Internet-Drafts are working
    documents of the Internet Engineering Task Force (IETF), its areas, and its working
    groups. Note that other groups may also distribute working documents as Internet-Drafts.
    Internet-Drafts are draft documents valid for a maximum of six months and may
    be updated, replaced, or obsoleted by other documents at any time. It is inappropriate
    to use Internet-Drafts as reference material or to cite them other than as "work
    in progress." The list of current Internet-Drafts can be accessed at: https://www.ietf.org/1id-abstracts.html
    The list of Internet-Draft Shadow Directories can be accessed at: https://www.ietf.org/shadow.html</p>'

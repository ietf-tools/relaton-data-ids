abstract:
- content: "<p>This document proposes the creation of a formalized registry for celestial
    bodies within the Internet Assigned Numbers Authority (IANA) to support routing
    and address allocation in deep space networks. As internet architecture expands
    to interplanetary scales, routing protocols rely on hierarchical aggregation based
    on planetary and celestial entities. However, the IETF currently lacks a standardized
    taxonomical framework or mapping mechanism to uniquely identify these entities.
    This document outlines the requirements for establishing such a registry, suggests
    leveraging definitions from the International Astronomical Union (IAU), and discusses
    the integration of these identifiers into the deep space routing architecture.</p>"

abstract:
- content: "<p>Evidence that an agent was authorized to act does not establish that
    the authorization was enforced, that the action was executed, or that the intended
    effect occurred. These are distinct transitions. This document defines requirements
    for making a claimed agent transition independently determinable after the original
    interaction has ended. The requirements address binding the material action and
    governing conditions to the transition at decision time, identifying which revision
    of a mutable governing artifact was in force, preventing later substitution, and
    preserving enough information for an independent evaluator to establish the claimed
    transition after participants, sessions, credentials, keys, or agent instances
    are no longer available. This document defines no evidence format, token, action
    identifier, delegation protocol, audit system, registry, or transparency service.</p>"

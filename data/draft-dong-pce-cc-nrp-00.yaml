abstract:
- content: "<p>The PCE is a core component of Software-Defined Networking (SDN) systems.
    A PCE-based Central Controller (PCECC) can simplify the processing of a distributed
    control plane by blending it with elements of SDN without necessarily completely
    replacing it. Network Resource Partitions (NRPs) can be used to provide the required
    connectivity and commited resources for network slice services. An NRP is a subset
    of the buffer/queuing/ scheduling resources and associated policies on each of
    a connected set of links in the underlay network. This document specifies the
    extensions to Path Computation Element Communication Protocol (PCEP) to enable
    PCECC based Network Resource Partition (NRP) Instantiation.</p>"

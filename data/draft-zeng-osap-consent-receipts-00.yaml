abstract:
- content: "<p>This document defines a signed consent receipt for task-scoped authorization
    between local agents. A receipt records a user's decision to allow or deny a described
    action, binds that decision to a task, an agent, an audience, an action set, and
    a resource set, and can be verified offline. The document also defines the consent
    request, the reservation ordering that avoids a circular dependency between a
    receipt and a capability token, the audit events that accompany consent and side
    effects, and an informative mapping to ISO/IEC 27560. It does not define a user
    interface, a transport, or a capability token format.</p>"

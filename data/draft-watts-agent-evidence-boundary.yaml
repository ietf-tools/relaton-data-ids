abstract:
- content: "<p>Autonomous agents increasingly make or propose consequential actions
    using premises assembled from model outputs, memory, tools, telemetry, and external
    data. Existing authentication and authorization mechanisms can establish who is
    acting, under whose delegation, and which operation is permitted, but they do
    not by themselves establish whether the proposition that triggered the operation
    has adequate support. This document defines the Evidence Qualification Receipt
    (EQR), a transport-neutral JSON data model and fail-closed verification procedure
    for binding a proposition to a declared evidence profile, its supporting evidence
    digests, contradiction state, freshness, and evaluation result. An EQR can be
    PASS, FAIL, or INDETERMINATE. A PASS EQR is only an authorization input: it is
    never itself permission to execute. The design is append-only: changed evidence
    produces a successor receipt rather than rewriting prior epistemic state. The
    goal is to prevent evidence, provenance, or model confidence from silently acquiring
    authorization semantics.</p>"

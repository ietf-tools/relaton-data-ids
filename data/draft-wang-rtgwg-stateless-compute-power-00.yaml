abstract:
- content: <p>Stateless computing services represent a principal design paradigm in
    distributed computing, characterized by statelessness, dynamism, service orientation,
    and atomicity. These services have been widely adopted in cloud computing and
    microservice architectures. With the rise of AI technologies and the emergence
    of Model-as-a-Service (MaaS), they are being introduced into intelligent computing,
    reshaping industrial divisions of labor and gradually evolving into a typical
    computing power provisioning paradigm following IaaS/PaaS. However, current computing
    power networks were found to primarily focus on resource-layer scheduling optimization,
    leading to critical challenges when addressing computing-network collaboration
    and routing/scheduling requirements for stateless services. These included the
    disconnection between computing resource scheduling and user application-layer
    functional demands, as well as protocol stack mismatches between network-layer
    connectivity solutions and service-oriented API interconnection requirements.
    The need for elastic network pipelines in computing service interconnection was
    analyzed, followed by the proposal of a novel computing power network architecture
    natively supporting stateless service routing and scheduling. Key components including
    the identifier scheme, system architecture, and operational mechanisms were detailed
    through simulation validation. URL-PATH is employed as computing power identifiers,
    enabling service-oriented API-level resource orchestration and differentiated
    QoS guarantees through service semantic routing. This approach provides new insights
    for evolving computing power networks from "resource provisioning" to "service
    interconnection."</p>

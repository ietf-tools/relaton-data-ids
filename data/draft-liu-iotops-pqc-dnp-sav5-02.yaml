abstract:
- content: "<p>This document addresses post-quantum authentication migration for Internet
    of Things (IoT) deployments that already use DNP3 Secure Authentication version
    5 (SAv5), including fleets of networked outstations and industrial gateways with
    limited local user interfaces. It describes identity provisioning, admission to
    authenticated operation, credential and session replacement, failure recovery,
    quarantine, and retirement under an operator's existing authorization policy.
    A cryptographic profile supports these lifecycle operations using an ML-KEM-768
    and ML-DSA exchange, HKDF-SHA-256 session keys, canonical DNP3 application protocol
    data unit (APDU) encoding, transport segmentation, and HMAC-SHA-256 application
    authentication. The profile does not encrypt DNP3 payloads or replace application
    control authorization. This individual submission proposes Standards Track publication
    and requests IOTOPS review of its IoT operational requirements. The appropriate
    venue for new protocol work requires separate determination. DNP3 object variations
    and externally allocated algorithm identifiers require coordination with the responsible
    DNP3 standards authority. The local experimental selector is limited to explicitly
    configured laboratory use and is not an IEEE or IEC assignment.</p>"

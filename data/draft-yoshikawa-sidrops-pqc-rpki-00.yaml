abstract:
- content: "<p>This document specifies an initial post-quantum signature algorithm
    profile and migration considerations for the Resource Public Key Infrastructure
    (RPKI). It profiles ML-DSA-65 as the primary candidate for an RPKI next signature
    algorithm suite by reusing the ML-DSA algorithm identifiers and CMS conventions
    defined by LAMPS. It also describes how Certification Authorities, repository
    operators, and Relying Parties can evaluate and deploy a post-quantum suite while
    preserving the existing RPKI architecture and router- facing VRP/RTR model. This
    document profiles candidate post-quantum signature algorithms for RPKI certificates,
    CRLs, certification requests, and CMS signed objects. It is written as input to
    SIDROPS discussion and does not update RFC 7935 in this revision. It does not
    define a new RPKI object format, a new cryptographic primitive, a new repository
    synchronization protocol, or a new router protocol.</p>"

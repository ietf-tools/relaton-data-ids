abstract:
- content: <p>This document defines the problem statement, common terminology, security
    models, and technical requirements for identifying, validating, and establishing
    secure connections with local network devices. It outlines the challenges of extending
    the Web's Public Key Infrastructure (PKI) to local, offline, or "limited domain"
    environments. The document specifies requirements for privacy- preserving discovery,
    generating and distributing local trust anchors, and establishing mutually authenticated
    secure contexts without relying on global certificate authorities or problematic
    Trust On First Use (TOFU) mechanisms.</p>

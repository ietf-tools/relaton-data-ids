abstract:
- content: "<p>The Zero Trust Intelligence Protocol (ZTIP) is an open, transport-
    neutral protocol for governed AI agent transactions. It defines five immutable
    JSON envelope types and a transaction lifecycle under which every agent-initiated
    action is authorized by policy before execution, integrity-protected by hash over
    a canonical form, and -- distinctively -- verified as complete by an authority
    independent of the actor that performed the work. An executor's claim of success
    is treated as attestation, and attestation alone never satisfies a required verification
    check. This document describes ZTIP version 1.0-draft for the record; the full
    specification, JSON Schemas, examples, and a reference runtime are maintained
    in the open at the repository referenced herein.</p>"

  type: Internet-Draft
  primary: true
abstract:
- content: "<p>This document updates RFC 2622 and RFC 4012 by defining the excl- members
    attribute on the as-set and route-set classes in the Routing Policy Specification
    Language (RPSL). A set that references another set includes everything the referenced
    set contains, however deeply nested. RPSL currently has no way for the set owner
    to make an exception. The excl-members attribute lets a set owner exclude specific
    members, including ones brought in by a referenced set.</p>"

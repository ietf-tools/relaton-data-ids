abstract:
- content: "<p>This document specifies General-Purpose Compression via Mathematical
    Functions (GCMF), a lossless compression format that represents sequences of data
    using mathematical functions and associated parameters. GCMF attempts to represent
    a sequence using a compact mathematical representation rather than storing every
    value explicitly. This document defines the GCMF data format, function types,
    encoding rules, decoding procedure, and interoperability requirements.</p>"

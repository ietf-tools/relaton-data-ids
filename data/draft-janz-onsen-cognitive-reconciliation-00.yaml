abstract:
- content: "<p>Network operators must make YANG-modeled service and network interfaces
    interoperate with TM Forum (TMF) OSS/BSS APIs. Today this is done with hand-built,
    model-specific adapters, whose construction and maintenance is ongoing human work.
    The ONSEN problem statement records the absence of a standard alignment between
    TMF APIs and YANG models as an open problem. This document applies ad hoc semantic
    reconciliation by cognitive agents, as developed in draft-janz-nmrg- adhoc-semantic-reconciliation,
    to that problem. Two cognitive agents lift their respective models, bind through
    a thin shared reference, and each generates and operates its own inbound translator,
    with no model-specific adapter agreed in advance. This document reports results
    from a demonstrator whose first case reconciles the L3SM service model to a TMF
    representation. It runs the reconciliation in two forms, one anchored on the mapping-root
    annotations of draft-lls- onsen-yang-tmf-mapping, and one with those annotations
    withheld, in which the agents must locate the services themselves in the plain
    model, and the two forms together size what the annotations contribute. It shows
    the reconciled mapping operating on real instance data, shows the model-drift
    lifecycle by which the translators are kept current, reads the demonstrator as
    an empirical point on a cognition-placement spectrum, from over-arching cognition
    over two inert systems to both systems cognitive, and is explicit about what over-arching
    cognition achieves when neither system is itself cognitive. A second case reconciles
    the L3SM service model to the L3NM network model, a cross-abstraction mapping
    where a cognitive counterpart earns its place, so the two cases together give
    the two poles of the spectrum on two ONSEN problem areas. The document closes
    with recommendations for operational practice and for standardization.</p>"

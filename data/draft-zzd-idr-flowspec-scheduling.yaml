abstract:
- content: "<p>BGP Flow Specification allows conveying flow specifications and associated
    traffic actions/rules to perform different actions based on traffic characteristics.
    Existing traffic filter rules and actions in FSv2 remain effective perpetually;
    once delivered to the headend, the rules and actions are permanent for traffic.
    However, some operators wish to perform different actions for specific flows at
    specific time. This document extends BGP FSv2 with a scheduling time component
    to match the arrival time of packets. Based on this component, the headend can
    perform different actions for specific traffic at different times.</p>"
  language:

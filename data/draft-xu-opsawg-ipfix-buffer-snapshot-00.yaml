abstract:
- content: "<p>This document specifies an IP Flow Information Export (IPFIX) profile
    for exporting buffer occupancy snapshots. It separates the number of objects selected
    for acquisition, the number successfully captured, and the number of distinct
    object records validated by a collector. A capture span bounds the temporal separation
    of the reported measurements. The profile defines ten Information Elements, object
    identity and accounting rules, and an ordered export procedure in which final
    metadata closes a snapshot. The resulting collector procedure uses bounded state
    and distinguishes partial acquisition from incomplete delivery. It does not define
    a buffer implementation, a trigger configuration protocol, or a congestion control
    algorithm.</p>"

abstract:
- content: "<p>Contact centers bring people, AI agents, and business systems into
    the same voice session. Consumer-controlled agents are also beginning to call
    agents operated by businesses. This document describes five contact center use
    cases for the agentic dialog management protocol: a consumer agent calling a business
    agent, escalation from an AI agent to a human representative, a call that resumes
    on another channel, a voice dialog passing through speech recognition and synthesis,
    and a dialog crossing an existing SIP or PSTN network. It derives numbered requirements
    that can be incorporated into the working group's use cases and requirements document.
    It also explains how a dialog identifier relates to the conversation records that
    contact centers already keep.</p>"

abstract:
- content: "<p>The Path Computation Element Communication Protocol (PCEP) extensions
    for signaling multipath information allow multiple forwarding paths to be associated
    with a single PCEP Label Switched Path (LSP); for Segment Routing (SR) Policy,
    these paths are the Segment Lists of a Candidate Path. However, the METRIC object
    remains encoded at the LSP level, and per-path encoding of the METRIC object is
    explicitly left out of scope. This document extends PCEP to signal per-path (for
    SR Policy, per Segment List) metric information by reusing the existing METRIC
    object within the multipath constructs, and defines the associated capability
    negotiation.</p>"

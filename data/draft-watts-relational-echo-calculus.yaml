abstract:
- content: "<p>This document describes a transformation-first teaching notation for
    mathematical communication to unfamiliar receivers. The prototype operates on
    finite motifs drawn from the vertices of a Hamming hypercube. Echo operations
    act through coordinate permutations and binary translations. We distinguish invariance
    of a coarse signature from proof of exact orbit equivalence, exhibiting two four-
    dimensional patterns that have equal pairwise-distance multisets but different
    induced adjacency. A synthetic toy decoder reconstructs arbitrary token meanings
    when its complete transformation hypothesis class is supplied. The main testable
    conjecture is that instruction ordered by invariance might improve cross-agent
    decoding over instruction ordered by arithmetic under matched information budgets.
    The conjecture has not been experimentally evaluated; no new extraterrestrial
    signal or new mathematical theorem is claimed.</p>"

abstract:
- content: "<p>This document defines WTX-1, a protocol for preserving pseudonymous
    user context across web domains that are operated by, or on behalf of, the same
    organization and that have mutually opted into the exchange. The protocol operates
    only after explicit user consent and does not use third-party cookies, browser
    fingerprinting, or collection of direct identifiers by default. Identifiers are
    pseudonymous, not anonymous: they can be linked to application-level identities
    by the deploying organization and may constitute personal data under applicable
    law. WTX-1 transfers context using an encrypted, authenticated, destination-bound,
    single-use token carried in the URL fragment. Tokens are issued and verified server
    side, with atomic replay consumption, DNS-based domain authorization, and short-lived
    server- signed write grants that authorize browser write operations without trusting
    caller-supplied tenant claims. This revision (draft-02) replaces the signed-cleartext
    token format of draft-01 with a sign-then-encrypt construction, specifies write
    grants and replay-consumption ordering, defines the consent lifecycle including
    withdrawal and asynchronous cancellation, adds storage retention limits and user
    inspection, reset, and revocation controls, and rescopes the document's security,
    privacy, and performance claims to match the reviewed reference implementation.
    A complete change log appears in Appendix A.</p>"

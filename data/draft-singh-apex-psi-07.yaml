- content: "<p>PSI-07 defines a standard signal format for regulatory events detected
    by automated monitoring systems. The format is a signed JSON envelope carrying
    the event classification, evidence hash, and jurisdiction code, enabling autonomous
    reporting to one or more regulators without human intervention.</p>"

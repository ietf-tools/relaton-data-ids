abstract:
- content: "<p>This document specifies the transport-level use of the TIMESTAMP and
    TIMESCALE properties registered by [loc], independent of the LOC container itself.
    A track-level Timescale property establishes the units, and an object-level Timestamp
    property carries the presentation time of each object. Exposing media time to
    the transport lets relays make consistent age-based decisions (e.g. dropping stale
    objects) without parsing the media container, and it remains consistent across
    hops regardless of buffering or jitter. No new code points are requested: an endpoint
    implementing this document is on the wire indistinguishable from a LOC endpoint
    that carries only these two properties.</p>"

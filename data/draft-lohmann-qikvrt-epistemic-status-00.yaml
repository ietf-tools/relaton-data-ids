abstract:
- content: "<p>This document defines an Experimental application-layer profile for
    representing the epistemic status of claims emitted or processed by machine cognition
    systems. The profile requires a claim not to be represented with a stronger epistemic
    status than its validated, provenance-bound evidence supports. The profile distinguishes
    object truth from epistemic truthfulness. It does not guarantee that external
    sources are true, that reasoning is infallible, or that the external world is
    completely observable. It specifies how an implementation reports what is proved,
    observed, source-bound, interpretative, normative, predicted, or open. The profile
    is designed to compose with QIK-VRT EFFECT_ACK without modifying the five-state
    EFFECT_ACK version-1 wire contract. EFFECT_ACK controls downstream effect authorization;
    this profile controls the strength of epistemic claims.</p>"

abstract:
- content: "<p>The PIM Flooding Mechanism and Source Discovery (PFM-SD) extension
    enables PIM routers to announce active multicast sources. The Group Source Info
    (GSI) TLV extends PFM-SD by allowing Sub-TLVs to be included with a source announcement.
    This document defines the Pre-join Sub-TLV, which carries the PIM Router-ID of
    a router selected by the First-Hop Router (FHR). The selected router can establish
    multicast forwarding state before data arrives, reducing join latency.</p>"

abstract:
- content: "<p>This document describes the architecture of Segment Routing over IPv6
    (SRv6) Service Function Chaining (SFC) with SR-aware functions. This architecture
    provides the following benefits: * Comprehensive management: centralized control
    and management of SR Policies, network topology, service functions, and network
    metrics. * Simplicity: no SFC proxies, which reduces the number of nodes and address
    resource consumption. About This Document This note is to be removed before publishing
    as an RFC. Status information for this document may be found at https://datatracker.ietf.org/doc/draft-watal-spring-srv6-sfc-sr-
    aware-functions/. Discussion of this document takes place on the SPRING Working
    Group mailing list (mailto:spring@ietf.org), which is archived at https://mailarchive.ietf.org/arch/browse/spring/.
    Subscribe at https://www.ietf.org/mailman/listinfo/spring/. Source for this draft
    and an issue tracker can be found at https://github.com/watal/draft-watal-spring-srv6-sfc-sr-aware-
    functions.</p>"

abstract:
- content: "<p>A destination identifier, an API credential, a completed computation,
    and an attested execution environment are each routinely treated as if they carried
    authority for consequence. This document argues that none of them does, and catalogues
    fifty-nine enforcement profiles of the Capability-Validated Inbound Descriptor
    (CVID) architecture, in which an attempted act is a Candidate Act with no external
    effect until a protected enforcement domain validates a conjunctive predicate
    set and releases the capability the effect requires. The profiles span inbound
    communication; network capability exposure and intent-driven network programming;
    AI-native radio access, network slicing and packet core; distributed inference
    and digital twins; ultra-reliable low-latency operation; cross-border and sovereignty-bound
    execution; satellite, non-terrestrial and direct- to-device networks; optical
    inter-satellite links; immersive and semantic media; machine swarms; ambient IoT
    and backscatter; reconfigurable intelligent surfaces; device paging and wake;
    offline central bank digital currency settlement; lawful disclosure through escrow;
    platform neutrality measurement; network energy expenditure; and enforcement in
    silicon at accelerator output paths, DMA and RDMA boundaries, interconnects, and
    die-to-die interfaces. Three authorities commonly conflated are separated: authority
    to consume resources, authority to compute, and authority to cause an external
    effect. From that separation follows the treatment of energy as an enforceable
    security resource rather than only an efficiency metric, with a low-energy admission
    tier deciding whether a candidate may activate expensive baseband, accelerator,
    or radio paths at all. The document compares this position with published 6G energy
    work from Ericsson, Nokia, Qualcomm, and Huawei, states what the author believes
    is new, and sets out the limitations of the approach. Profiles are reproduced
    in the structural form in which they were drafted, including system and method
    variants of the same mechanism. The architecture itself, its terminology, and
    its protocol mappings are described in a companion document. This document is
    published for discussion and comment; it is not a product of an IETF Working Group,
    and corrections are invited.</p>"

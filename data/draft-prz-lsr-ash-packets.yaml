abstract:
- content: "<p>The document presents an optional new type of database synchronization
    packet called an Aggregated SNP Hash (ASH). When feasible, it compresses traditional
    SNP exchanges into a dynamic Merkle tree-like structure, which speeds up synchronization
    of large databases and adjacency numbers while reducing the load from regular
    CSNP exchanges during normal operation. Just like CSNPs and PSNPs, ASH packets
    come in two flavors, called Complete ASH (CASH) and Partial ASH (PASH).</p>"

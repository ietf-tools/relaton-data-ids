abstract:
- content: "<p>Structured Field Values for HTTP (RFC 9651) give HTTP fields a common
    syntax, but a general parser for them is a sizable dependency for a light client
    that needs to read only one or two fields. This document defines Simpler Fields,
    a profile of Structured Fields that a client can parse with a short regular expression.
    Its Strings are percent-encoded, so they contain no quotes, backslashes, or field
    delimiters. Its serialization is canonical, and its types are fixed. Every Simpler
    Field value is a valid Structured Field value, so a general parser reads it unchanged.</p>"

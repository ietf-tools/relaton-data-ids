abstract:
- content: "<p>This document specifies Pulse, version 1.1 — the AI online charging
    protocol: the interface between an AI Gateway (the client) and the Charging Server
    (the server) by which AI service usage is authorised in real time, supervised
    under a granted budget, and settled. The spend guarantee is precisely stated:
    *settled spend never exceeds the reported meter or the plan's ceiling*, and serving
    exposure is bounded by the granted pool plus the completion of Calls already in
    flight when a stop lands. The protocol consists of two request/ response operations
    over HTTPS with JSON bodies: *Authorise* and *Report*. It follows the reserve-then-settle
    discipline of telecom online charging (cf. Diameter Credit-Control, RFC 4006)
    applied to AI workloads.</p>"

abstract:
- content: "<p>Misconfiguration and malicious manipulation of the BGP `AS_PATH` attribute
    can lead to route hijacking. This document proposes enhancements to BGP [RFC4271]
    inbound and outbound route processing when an AS loop is detected. This mechanism
    can be implemented directly on devices or deployed in a centralized architecture
    using the BGP Monitoring Protocol (BMP) [RFC7854]. These enhancements empower
    networks to quickly and accurately detect route hijacking and malicious path poisoning.
    Two implementation options are proposed:</p>"

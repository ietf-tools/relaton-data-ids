abstract:
- content: "<p>This document specifies a compact HTTP application programming interface
    for administering an OpenID Federation node. The interface manages the operator-controlled
    inputs from which a node produces the Entity Configurations, Subordinate Statements,
    Trust Marks, and Federation Entity Keys defined by OpenID Federation 1.1. It does
    not replace the public federation protocol. It is the management plane used by
    operators and control-plane software to configure what that protocol publishes.
    The design is document-oriented. Operators read and write the same JSON objects
    OpenID Federation already defines, rather than a large set of per-claim endpoints.
    Five resources cover node identity, Federation Entity Keys, the node's Entity
    Configuration, Immediate Subordinates, and Trust Mark issuance.</p>"

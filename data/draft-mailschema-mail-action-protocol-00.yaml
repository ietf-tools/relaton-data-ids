abstract:
- content: "<p>Mail Action Protocol (MAP) describes actions offered by email, such
    as approval to publish an article. A type contract defines each decision and its
    effects. A trusted service binding connects that decision to an existing service
    operation. Before acting, a client reads the current proposal and applies the
    user's policy. The service checks permission and the exact terms when it records
    the decision. MAP uses Structured Email's MIME and JSON-LD representation. Core
    is independent of the interface used to call the service. This document specifies
    an HTTP binding, Registry discovery rules and an experimental capability binding
    for a limited set of actions without a service account connection. It defines
    no general action endpoint or replacement authentication system.</p>"

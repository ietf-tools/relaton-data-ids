abstract:
- content: "<p>This document describes the applicable scenarios of the Standard Communication
    Protocol for Network Elements (SCONE) in RoCEv2 networks. SCONE defines a mechanism
    that enables network elements on the forwarding path to deliver throughput guidance
    to RoCEv2 endpoints. This document further specifies the method for carrying Rate
    Advice in RoCEv2 networks. The Rate Advice is generated by network nodes (e.g.,
    switches), which can be either rate limits defined by network policies or quantitative
    rate adjustment recommendations derived from network status information. This
    document specifies two implementation solutions with different granularities.
    Solution 1 provides path-granularity (source-IP- based) Rate Advice through out-of-band
    UDP messages sent directly from network elements to senders; a single advised
    rate applies to all active Queue Pairs (QPs) originating from the same source
    IP, providing sub-RTT feedback. Solution 2 provides per-flow (per-QP) Rate Advice
    through an on-path Rate Signal with endpoint feedback, reusing the RoCEv2 data
    path and following the feedback loop model of the SCONE protocol; each QP receives
    its own advised rate.</p>"

abstract:
- content: "<p>The introduction of AI agents into network operations is fundamentally
    reshaping the operation and maintenance (O&amp;M) paradigm, shifting from human-led,
    passive network management toward intent- driven, self-planning, and intelligent
    reasoning. While this shift promises significant gains in efficiency and autonomy,
    it introduces a set of problems that are not yet covered by the existing IETF
    network management framework. This document identifies and summarizes the deployment
    and operation problems that arise when AI native network operations (AINETOps)
    are introduced into operator networks. It systematically enumerates the standardization
    gaps across Network Management Agent (NMA) lifecycle management, the Human-Agent
    Interface (HAI), the agent-to-agent task and evidence models, and task risk classification.
    It does not propose solutions; its purpose is to provide a problem inventory that
    can anchor future IETF work on solutions and deployment best practices.</p>"

abstract:
- content: <p>This document defines "scion", a Service Parameter Key (SvcParamKey)
    for the Service Binding (SVCB) and HTTPS DNS resource records. Its value lists
    the addresses at which a service endpoint is reachable over SCION (Scalability,
    Control, and Isolation On Next-generation networks), a path-aware inter-domain
    network architecture. This document specifies the wire format, presentation format,
    and semantics of the key and requests its registration with IANA.</p>

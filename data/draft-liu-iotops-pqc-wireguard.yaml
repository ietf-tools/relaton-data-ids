abstract:
- content: "<p>This document discusses post-quantum key provisioning and lifecycle
    operations for Internet of Things (IoT) deployments that already use WireGuard,
    such as fleets of industrial gateways and capable managed devices with little
    or no local user interface. It describes operational requirements for authorized
    tunnel onboarding, identity- to-key binding, preshared-key rotation, failure recovery,
    quarantine, and decommissioning. The operational model assumes an existing authorized
    management channel and independently provisioned trust. It uses the existing WireGuard
    PresharedKey configuration interface and leaves the native WireGuard handshake
    and transport format unchanged. WireGuard remains an externally maintained dependency.
    An appendix retains a candidate ML-KEM-768 and ML-DSA bootstrap exchange for technical
    discussion and further security and interoperability review. This individual contribution
    seeks Informational publication of the operational discussion and feedback on
    the appropriate venue for any new protocol work.</p>"

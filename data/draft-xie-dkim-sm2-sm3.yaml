abstract:
- content: "<p>This document adds the SM2-SM3 signing algorithm to DomainKeys Identified
    Mail (DKIM). It defines the signature and public key encodings and the SM2 user
    identifier used with this algorithm. This document updates RFC 6376. Discussion
    Venues This note is to be removed before publishing as an RFC. Comments on this
    individual Internet-Draft are welcome. Please send feedback to the authors using
    the contact information at the end of this document.</p>"

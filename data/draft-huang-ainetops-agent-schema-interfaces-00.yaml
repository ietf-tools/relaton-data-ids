abstract:
- content: "<p>Network management agents can use an Agent-to-Agent protocol for task
    exchange. The protocol alone does not define the application schemas used by independently
    developed network management agent skills. This document standardizes four components
    for schema-governed network management agent skills: Schema References, per-skill
    Skill Interface Documents, advertisement and retrieval through an A2A extension
    and describe_skill, and the A2A mapping for interface version 1.0. Together, they
    enable clients to retrieve and validate the application schemas used for skill
    inputs, outputs, and supporting records.</p>"

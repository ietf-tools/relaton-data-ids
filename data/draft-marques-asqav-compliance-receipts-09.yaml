abstract:
- content: "<p>This document defines a profile for signed action receipts and independently
    checkable evidence about agent activity. It specifies versioned payload and signature
    semantics, hash-chain linkage, timestamp and witness policy, receipt verification
    and bounded regulatory-evidence mappings. It draws on ACTA-RECEIPTS but states
    its profile-specific overrides explicitly. A receipt supports checks about recorded
    bytes, identity, linkage and retained evidence; it does not by itself establish
    that an action occurred, that all actions were captured, or that an organization
    complies with a law. The profile supports retained historical receipts through
    explicit version and legacy rules rather than rewriting their committed bytes.
    Its intended core and implementation limitations are described in the body.</p>"

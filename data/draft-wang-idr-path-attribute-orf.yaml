abstract:
- content: "<p>This document defines a family of Outbound Route Filter (ORF) Types
    for controlling the propagation of BGP Path Attributes. The Path Attribute ORFs
    (PA-ORFs) enable a BGP speaker to dynamically request that a peer suppress, remove,
    refine, or constrain the propagation of selected BGP Path Attributes when constructing
    outbound UPDATE messages for a given AFI/SAFI. This document defines four ORF
    Types: Path Attribute Type ORF; Path Attribute Subtype ORF; Unknown Path Attribute
    ORF; and Path Attribute Propagation Scope ORF. These ORF Types reuse the ORF Capability
    and ROUTE-REFRESH procedures defined in [RFC5291]. No new BGP Path Attribute or
    BGP message type is introduced. PA-ORFs are intended to reduce unintended propagation
    of BGP Path Attributes, especially Optional Transitive attributes whose semantics
    are valid only within a limited administrative, service, or technology domain.</p>"

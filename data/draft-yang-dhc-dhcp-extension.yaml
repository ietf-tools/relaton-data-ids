abstract:
- content: "<p>This document specifies a DHCP option extension designed for campus
    networks to help client devices distinguish and connect to a master device with
    the LLM (Large Language Model). The mechanism extends a new DHCP option containing
    two specific parameters within the DHCP payload: the master device's LLM address
    and the master device's LLM configuration. This allows client devices to identify
    and register to LLM-enabled master device during the bootstrap phase.</p>"

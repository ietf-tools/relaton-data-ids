abstract:
- content: '<p>Cedulon defines a batch reconciliation audit: given a window of spend
    receipts, epoch checkpoints, and an authenticated rail extract, a verifier proves
    completeness after the fact. Agent fleets that spend continuously need the same
    property as a live signal: a conscience that runs beside the payments rather than
    behind them. This document proposes a streaming profile: short half-open micro-epochs,
    an incremental checkpoint cadence, a watermark that separates provisional from
    final findings, and rules for late-arriving settlements. The goal is that "the
    books are balanced" becomes a continuously maintained, externally checkable state
    instead of a periodic report. This is an extension proposal to the Cedulon core
    document; its normative language is provisional and the companion implementation
    does not implement it yet.</p>'

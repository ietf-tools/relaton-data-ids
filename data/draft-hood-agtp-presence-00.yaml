abstract:
- content: "<p>This document specifies AGTP Presence, an ambient discovery and visibility
    layer for the Agent Transfer Protocol (AGTP). Existing agent discovery proposals
    are pull-based: an agent must know where to look (a catalog URL, a registry endpoint,
    a DNS name) before discovery can begin. AGTP Presence inverts this model. When
    an agent joins the AGTP substrate, it becomes structurally addressable and visible
    to the relevant scope of other agents immediately, without requiring registration
    with a central directory. The architecture combines three proven patterns: a Distributed
    Hash Table (DHT) keyed by Canonical Agent-ID for content-addressable routing,
    a gossip-based protocol for presence announcement and convergence, and trust-tier-scoped
    overlay partitioning for visibility control. Per-agent visibility is cryptographically
    declared in AGTP-CERT certificate extensions and enforced structurally, with three
    orthogonal axes of control: presence visibility, disclosure visibility, and audience
    scoping. This document defines three new lifecycle methods (ANNOUNCE, WITHDRAW,
    PROBE), specifies the DHT and gossip protocols, defines the visibility model and
    its certificate extensions, addresses scaling through hybrid participation modes
    and federation-of-scoped-overlays, and provides a threat model with concrete mitigations.</p>"

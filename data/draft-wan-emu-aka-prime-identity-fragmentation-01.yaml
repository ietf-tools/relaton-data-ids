abstract:
- content: "<p>This document updates EAP-AKA’ (RFC 9048) so that a peer can send an
    identity that is too large for the initial EAP-Response/Identity packet, such
    as a Subscription Concealed Identifier (SUCI) in Network Access Identifier (NAI)
    format protected by a Post-Quantum Cryptography (PQC) scheme. The peer sends a
    realm-only identity in EAP-Response/Identity and the large identity in EAP-Response/AKA-
    Identity. If the identity fits in an AT_IDENTITY attribute, the peer sends it
    there. Otherwise, the peer sends it in a new attribute, AT_LARGE_IDENTITY, which
    is fragmented using the AT_FRAGMENT attribute defined in I-D.ietf-emu-pqc-eapaka.
    A peer that supports several SUCI protection schemes (for example PQC and classical
    schemes) uses the presence or absence of the AT_LARGE_IDENTITY_SUPPORTED attribute
    in the server’s request to select a scheme whose SUCI can be carried in an identity
    attribute that the server can process. These procedures support large SUCI values,
    and do not change the EAP-AKA’ authentication or key derivation.</p>"

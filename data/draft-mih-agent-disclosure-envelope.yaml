abstract:
- content: "<p>This document defines the Disclosure Envelope, an out-of-band wrapper
    structure for revealing the raw content behind a digest-only Agent Action Capsule
    field to a verifier, without altering the Capsule's own bytes or recomputing its
    capsule_id. The Capsule profile [I-D.mih-scitt-agent-action-capsule] commits some
    fields as a [RFC8785]-canonicalized SHA-256 digest only — the content itself is
    never carried in the signed, registered record. The initial disclosable fields
    are model_attestation.compute_attestation.agent_input_digest and.agent_output_digest.
    A Disclosure Envelope wraps an unmodified Capsule alongside a sibling disclosures
    object; a verifier recomputes the JSON-DIGEST of each disclosed value using the
    same canonicalization the base profile already uses for capsule_id, and compares
    it to the digest committed inside the Capsule. This mechanism is distinct from
    the per-field selective-disclosure profile [I-D.mih-scitt-agent-action-capsule-selective-disclosure]:
    that mechanism conceals and later reveals whole payload fields that would otherwise
    be carried in clear; this one reveals the content behind a field that was always
    present in clear, as a digest, from the moment the Capsule was signed.</p>"

abstract:
- content: "<p>This document describes an Extensible Provisioning Protocol (EPP) mapping
    for provisioning and management of EPP Authentication Token objects in a shared
    central repository, where an Authentication Token is a JSON Web Signature (JWS),
    defined in RFC 7515, and is used to authorize actions by registrar users. The
    Authentication Token can be passed over an authenticated EPP session, as defined
    in RFC 5730, to provide elevated, fine-grained authorization exclusively valid
    until the lifetime of the digitally signed Authentication Token.</p>"

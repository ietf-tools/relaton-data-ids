abstract:
- content: "<p>The proposed AUDIT working group is scoped to define interoperable
    mechanisms for auditing the observable behavior of agents across trust boundaries,
    and its draft charter names Audit Data Models and Semantics as a Standards Track
    deliverable. This document presents one candidate for that deliverable: the AER-1
    execution receipt, specified in draft-zambo-aer1-26, read as an audit data model.
    It summarizes the receipt record by reference to the AER-1 specification, shows
    how the record covers the audit scope the draft charter describes (tool interactions,
    invoked and declined actions, subagent and tool calls across domains, and records
    verifiable by a party that trusts neither the agent nor its operator), records
    the conformance corpus and independent implementation status behind the model,
    and states the limits of the model plainly. This document defines no new format
    and changes no AER-1 field, digest construction, or verification rule.</p>"

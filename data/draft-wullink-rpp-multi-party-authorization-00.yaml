abstract:
- content: "<p>The traditional Registry, Registrar and Registrant (RRR) model for
    domain name management is evolving to include third-party service providers, such
    as DNS hosting providers. This document describes a generic multi-party authorization
    flow that allows registries to securely delegate domain management functions to
    accredited third- party service providers, while ensuring that the registrant's
    explicit consent is obtained before any RPP operations are executed.</p>"

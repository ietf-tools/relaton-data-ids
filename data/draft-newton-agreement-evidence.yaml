abstract:
- content: "<p>Autonomous agents can exchange offers and signatures without producing
    an artifact that records which parties reached which outcome, over which transcript
    digest and message count, and for how long that record may be relied upon. This
    document defines JSON agreement-evidence objects for structured, multi-attribute
    negotiation. The core object is an agreement attestation. A verified attestation
    establishes one thing: that a named set of parties jointly countersigned a stated
    outcome over a stated transcript digest and message count, together with behavioral
    counters each of them accepted. It does not establish that the outcome matches
    what the transcript says, that any statement a party made is true, or that the
    parties are anonymous. The format provides no member for a negotiated price, quantity,
    date, or principal identity. A producer is obligated not to place those values
    in the free-text members the format does provide, and a verifier cannot detect
    a violation of that obligation, so the absence of term values from a received
    object is a producer's obligation rather than a verified property. Sections 4
    through 8 and 10 define every member of the object, its JSON type, its encoding,
    its value constraints, and the verification procedure. This document also defines
    relying- side freshness obligations and describes related approval, fulfillment,
    and revocation artifacts, whose formats it leaves to other documents. This document
    does not define identity, authority delegation, payment, settlement, transport,
    boundary-decision receipts, or a general evidence composition and sufficiency
    model.</p>"

abstract:
- content: "<p>This document specifies publickey-kem, a Key Encapsulation Mechanism
    (KEM)-based user authentication method for the Secure Shell (SSH) protocol. The
    server encapsulates a fresh shared secret to an authorized client public key.
    The client demonstrates possession of the corresponding private key by returning
    a session-bound confirmation value. The method does not modify SSH transport or
    server host authentication. Initial authentication algorithm profiles using ML-KEM
    and HMAC-SHA256 are also specified.</p>"

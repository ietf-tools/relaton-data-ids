abstract:
- content: "<p>This document describes MiMS, a method for an author and independent
    reviewers to identify an exact Internet-Draft revision, reproduce a bounded technical
    proposition, and trace a finding to a subsequent edit and replay. It distinguishes
    evidence of package delivery, evidence of independent computation, and evidence
    of editorial disposition. A SCITT-related example demonstrates the scope of a
    reproducible finding. The method is usable with existing transports and independently
    chosen verification tools.</p>"

abstract:
- content: "<p>Agent-to-agent protocols increasingly carry messages between autonomous
    software agents acting on behalf of distinct principals, including across organisational
    boundaries. Existing protocols in this space secure the transport hop and authenticate
    the calling party, but do not provide message-level confidentiality, do not provide
    non-repudiable evidence of what a counterparty asserted, and do not carry machine-enforceable
    constraints on how a recipient may use the data conveyed. This document specifies
    a profile that addresses those three gaps. It defines a Governed Object: a signed,
    purpose-bound, expiring message envelope identified by a decentralised identifier.
    It specifies how such objects are exchanged inside end-to-end encrypted sessions
    established using the Messaging Layer Security (MLS) protocol [RFC9420], and how
    the MLS credential is cryptographically bound to the sending agent's identity.
    It defines the encapsulation of these constructs as an extension to an agent-to-agent
    transport, using the Agent2Agent (A2A) protocol [A2A] as the reference binding,
    and specifies mandatory receiver-side processing rules including replay rejection
    and purpose enforcement.</p>"

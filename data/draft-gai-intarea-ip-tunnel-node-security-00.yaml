abstract:
- content: "<p>IP tunnel nodes are widely deployed for IPv4/IPv6 transition, overlay
    connectivity, traffic engineering, and inter-domain services. A tunnel node that
    accepts tunneled packets from unauthorized sources or forwards decapsulated packets
    without validating the inner packet can become an open relay, a source-address-spoofing
    enabler, or a path around filtering policy. This document specifies security requirements
    for IP tunnel nodes. It defines requirements for tunnel enablement, peer authorization,
    source address validation, forwarding-scope validation, recursive encapsulation
    limits, IPv6 extension header handling, ICMP behavior, logging, and operational
    management. The requirements apply to IP- in-IP, GRE, IPv6 tunnel mechanisms,
    and IPv4/IPv6 transition tunnels.</p>"

abstract:
- content: "<p>This document specifies the Runtime Contract Negotiation Substrate
    (RCNS) for the Agent Transfer Protocol (AGTP) [AGTP]: the mechanism by which an
    AGTP server synthesizes an endpoint at runtime, from registered primitives, when
    a caller addresses a method and path pair the server has yet to register. RCNS
    is invoked explicitly through the PROPOSE floor method and implicitly when a server
    is configured to treat unregistered requests as synthesis candidates. The document
    defines the four-lock dispatcher gate that governs when synthesis may occur, the
    two contract delivery modes, the PROPOSE request and response body shapes, recipe
    versioning, contract scoping and lifecycle, the headers and rate-limiting contract,
    the Attribution- Record extension fields that make every invocation served under
    a contract attributable, and the inventory surfaces through which contracts are
    observed. The material was previously carried in [AGTP-API], which this document
    and [AGTP-METHODS] together replace.</p>"

abstract:
- content: <p>This document specifies the "linkid" URI scheme and a resolution model
    for persistent, location-independent identifiers. A LinkID identifies a resource
    independently of its current network location. Resolution maps the persistent
    identifier to a current actionable URI using one or more resolvers. The scheme
    is intended for Web, document, archival, scientific, government, enterprise, and
    machine- to-machine references where locations may change while reference identity
    must remain stable.</p>

abstract:
- content: "<p>Network devices increasingly expose operational APIs using gRPC and
    Protocol Buffers. Many of these APIs provide ephemeral or runtime state whose
    lifetime is limited to a process, service, session, or device runtime. At the
    same time, the IETF has standardized YANG as a data modeling language for network
    management and has defined encodings for YANG data, including JSON and CBOR. This
    document describes the problem space and identifies questions for the IETF community
    regarding standards-based gRPC APIs for ephemeral operational state. The scope
    is limited to ephemeral operational state. Configuration data and configuration
    management operations are out of scope.</p>"

abstract:
- content: <p>This document defines the "sustainability-data" well-known URI. This
    URI provides a uniform, out-of-band convention for web servers and digital services
    to publish aggregated environmental impact, energy consumption, and carbon footprint
    metrics for a declared reporting subject -- typically the publishing origin itself.
    The convention publishes a single, cacheable JSON document per origin, described
    by formal schemas and discoverable at a fixed location without prior arrangement,
    so that environmental disclosures can be located, validated, and ingested automatically.
    Publication is voluntary, and the metrics are self-asserted claims of the publisher,
    linked to the publisher's methodology and supporting evidence.</p>

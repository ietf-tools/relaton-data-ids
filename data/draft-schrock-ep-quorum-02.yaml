abstract:
- content: '<p>This document defines EP-QUORUM, a multi-party authorization profile
    for the EMILIA Protocol (EP) authorization receipt (draft-schrock-ep- authorization-receipts).
    Where the base receipt binds a single accountable human to one exact high-risk
    action, EP-QUORUM binds a set of distinct accountable humans -- the "two-person
    rule," generalized to M-of-N and to ordered approval trails -- to one exact action,
    such that no action is authorized until the full quorum holds. The profile is
    purely additive: each quorum member is an unmodified EP signoff over the same
    action hash, and a single- approver policy is the degenerate one-member case.
    EP-QUORUM specifies a fail-closed quorum predicate (all member signatures valid,
    every member bound to the exact action, approvers pairwise distinct, every approver
    admitted by role, the threshold met, the declared order respected, and all signatures
    within a bounded time window), an incremental server-side admission rule that
    rejects a non-conforming signer before it enters the trail, and a set of adversarial
    conformance vectors. The predicate is offline-verifiable under the base draft''s
    verification model and is maintained as cross- language conformance vectors that
    three reference verifiers (JavaScript, Python, Go) are required to agree on. Those
    verifiers live in one repository -- a cross-language consistency check, not clean-room
    independent implementations; independent implementations remain future interoperability
    evidence. The document also describes, informatively, the multi-handshake composition
    process: how individual signing ceremonies -- fresh one-time challenge, exact-
    action binding, user-verified device signature -- compose into one ordered, offline-verifiable,
    once-consumable multi-party decision.</p>'

abstract:
- content: "<p>This document updates RFC 3161. It adds a requirement to ensure that
    the id-ct-TSTInfo content type is used to align with the best practices for signed
    attributes with CMS signed-data. In addition, cross-protocol attacks are prevented
    by requiring that the Time Stamp Authority (TSA) dedicate the signature key pair
    to the time-stamping service.</p>"

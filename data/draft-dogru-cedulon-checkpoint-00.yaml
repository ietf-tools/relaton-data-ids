abstract:
- content: "<p>This document specifies epoch checkpoints, the transparency witness
    and the anchoring of checkpoints as SCITT Signed Statements for the Cedulon audit
    layer. The spend receipt, rail-extract reconciliation and trust-root rules live
    in the companion Cedulon Core document. A verifier that pins a witness key can
    detect a withheld or rolled-back checkpoint; without that pin the suppression
    guarantee is conditional.</p>"

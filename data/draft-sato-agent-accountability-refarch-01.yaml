abstract:
- content: "<p>This document defines a reference architecture for producing, protecting,
    and verifying post-hoc accountability records for the actions of autonomous and
    semi-autonomous software agents, built from evidence captured across an action's
    full lifecycle -- before, during, and after it executes -- but assessed after
    the fact. It is scoped exclusively to post-hoc accountability, as distinct from
    real- time enforcement, and depends on no other individual submission's proposed
    architecture: everything it requires is either an already- settled standard, used
    as published, or intended to be specified and released openly as the author's
    own work, independent of this document's own adoption. It defines seven ordered
    stages -- intent and mandate capture, the agent boundary, the record producer,
    the event log and its cryptographic anchoring, a composed trust fabric, the disclosed
    audit record, and third-party verification -- together with two branch conditions
    covering cross-principal transactions and external resource ingestion.</p>"

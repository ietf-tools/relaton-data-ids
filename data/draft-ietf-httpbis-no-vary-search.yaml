docid:
- id: draft-ietf-httpbis-no-vary-search
  type: Internet-Draft
  primary: true
abstract:
- content: <p>This specification defines an extension to HTTP Caching, changing how
    the URI query component impacts caching. It introduces the "No-Vary- Search" response
    header field, which allows origin servers to signal to caches that certain parts
    of the query component do not semantically affect the served response and can
    be ignored for cache matching purposes.</p>
  language:
  - en
  script:
  - Latn
  format: text/html

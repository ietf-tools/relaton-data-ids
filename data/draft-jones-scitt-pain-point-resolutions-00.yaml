abstract:
- content: "<p>RFC 9942 (COSE Receipts), RFC 9943 (the SCITT architecture), and the
    W3C Verifiable Credentials Data Model v2.0 provide the foundational architecture
    for transparent, verifiable statements. Operational ambiguities remain in receipt
    verification, statement identity, status freshness, and the boundary between what
    a receipt proves and what a relying party must establish separately. This document
    maps fifteen documented pain points to constructions in four individual Internet-Drafts
    (a dual-receipt profile, a detached evidence handoffs model, a reproducible-review
    method, and a handshake profile). Where none of those drafts applies, it either
    proposes a construction or names the existing external mechanism, and for every
    pain point it states which case applies and what gap remains. Delivery is detached:
    no API integration, standing connection, or middleware is required. This document
    does not amend RFC 9942, RFC 9943, or any W3C Recommendation. All test vectors
    are synthetic.</p>"

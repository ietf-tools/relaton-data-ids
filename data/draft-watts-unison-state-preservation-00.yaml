abstract:
- content: "<p>This unsubmitted working draft describes state-preservation semantics
    derived from UNISON-StateBench. It separates value, epistemic status, provenance,
    and authority; defines a non-collapse rule for operational and epistemic transitions;
    and describes representation, contradiction, missing-evidence, authority, principal-isolation,
    tool-state, context-distance, and controlled-mutation evaluation families. This
    file is an archival RFCXML working draft and is not an IETF submission.</p>"

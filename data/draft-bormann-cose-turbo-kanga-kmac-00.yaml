abstract:
- content: <p>RFC 9861 defined and registered four eXtendable-Output Functions (XOFs),
    hash functions with output of arbitrary length, named TurboSHAKE128, TurboSHAKE256,
    KT128, and KT256; the present document is intended as the IETF consensus document
    that is now needed to give these algorithms Recommended status in the COSE registry.
    This document specifies concrete instances of those four functions above to be
    used as MACs in COSE. This document also specifies concrete instances of KMAC128
    and KMAC256 in [NIST.SP.800-185] to be used as MACs in COSE and registers code
    points for them. And, this document provides "Recommended" status for those algorithms
    for COSE.</p>

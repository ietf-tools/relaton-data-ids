abstract:
- content: "<p>This document specifies AGTP-METHODS, the method vocabulary of the
    Agent Transfer Protocol (AGTP) [AGTP] and the contract layer built on it. AGTP
    methods, also called AGTP verbs, are the action-intent words that name what a
    request does, in the same position that methods occupy in HTTP. The document defines
    the properties a method may have, the eighteen-method floor every server implements,
    the registered catalog of methods beyond the floor (425 methods in nine categories
    at catalog version 1.0.0) with its versioned evolution and graceful deprecation,
    the path grammar that keeps method names out of paths, the endpoint primitive
    as the unit a server exposes, the semantic block carried by every endpoint, the
    server manifest, the per-server method policy, the three handler binding kinds,
    and the structural rejection codes 404, 405, 459, and 460. Runtime contract negotiation,
    previously carried in the same document, is now specified in the companion AGTP-RCNS.
    This document replaces [AGTP-API], which in turn superseded the AGIS and AGTP-Methods
    drafts.</p>"

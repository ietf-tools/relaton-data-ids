abstract:
- content: "<p>Autonomous software agents increasingly inspect and modify infrastructure
    through provider-specific APIs and generic tool protocols. Those interfaces expose
    operations, but they do not provide a common semantic contract for obtaining bounded
    situational context, expressing an intended outcome under constraints, reviewing
    the exact material effects, binding authorization to those effects, observing
    durable execution, and determining whether the intended outcome was achieved.
    This document specifies the Agent Infrastructure Control Protocol (AICP). AICP
    is a transport-independent object and lifecycle model for capability discovery,
    situations, intents, plans, authorization decisions, asynchronous operations,
    verified outcomes, machine- actionable problems, and reconciliation. It also specifies
    an HTTP binding and describes mappings to existing agent protocols. AICP does
    not replace cloud resource APIs, orchestration languages, agent- to-agent protocols,
    authentication systems, or provider policy engines.</p>"

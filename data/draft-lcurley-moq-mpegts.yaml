abstract:
- content: "<p>This document defines the mpegts catalog section, which records what
    demultiplexing an MPEG-2 Transport Stream [mpeg2] into a MoQ broadcast would otherwise
    lose: each track's PID and PMT descriptors, the program identity, the service
    information tables, and a carriage record for every elementary stream the publisher
    did not decode. It is a root member of either the hang catalog [hang] or the MSF
    catalog [msf], so a subscriber that ignores it still plays the broadcast and one
    that reads it can rebuild the source multiplex.</p>"

abstract:
- content: "<p>The Reilly Government Integrity Protocol (RGIP) defines a standards-aligned
    method for producing permanent, independently verifiable public records by combining
    multi-algorithm content hashing, public timestamp anchoring, archival deposit
    under a persistent identifier, decentralized storage, and web archiving into a
    single pipeline. This revision corrects defects in draft-reilly-government-integrity-01
    that would have prevented independent verification or overstated the guarantees
    the protocol provides. It replaces the -01 SHA3-512-only Cross-Chain Hash, which
    made a single algorithm the sole binding of three otherwise independent chains,
    with an entangled link-and-braid construction in which each chain consumes the
    prior state of all three. It defines a canonical, domain-separated, length-delimited
    encoding for every hashed input, removing the concatenation ambiguity present
    in -01. It separates the signed Evidence Receipt Core from the mutable anchor
    envelope, resolving the -01 condition in which confirming an anchor invalidated
    the signature over the record it described. It adds Chain Checkpoint anchoring,
    without which the -01 claim that record sequence is provable did not hold, since
    -01 anchored only artifact digests and never the chain itself. It replaces raw
    digests of low-entropy government records with salted field commitments, adds
    explicit pending and attested anchor states, adds a Revocation Registry and Hash
    Migration Bridging Records, replaces the quantum_resilient boolean with a declared
    algorithm suite, prohibits automated repair of chain integrity violations, and
    narrows the -01 post-quantum claims to what the constructions support. It also
    documents the function of RGIP records and of this specification as prior art
    records under 35 U.S.C. 102(a)(1), consistent with the treatment in version -02
    of the REM Protocol specification.</p>"

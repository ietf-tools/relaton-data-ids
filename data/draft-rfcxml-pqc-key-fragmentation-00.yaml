abstract:
- content: "<p>Cryptographic protocols deployed on low-power and constrained devices
    increasingly need to accommodate the larger key sizes introduced by modern and
    post-quantum cryptographic (PQC) algorithms. Many constrained network technologies
    (such as 6LoWPAN, SCHC, and similar adaptation-layer protocols) use explicit fragmentation
    mechanisms to transport messages that exceed link-layer frame sizes. As a result,
    cryptographic keying material and key-establishment messages may be segmented
    across multiple fragments during transmission. This document analyzes the security
    and operational implications of such fragmentation. It identifies common fragmentation
    patterns and examines risks including fragment loss, reordering, duplication,
    and partial exposure. It further discusses fragment-level integrity, replay resistance,
    and correct binding of fragments to cryptographic session state. This document
    does not define new cryptographic algorithms or fragmentation mechanisms.</p>"

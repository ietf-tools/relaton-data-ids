abstract:
- content: "<p>This document specifies an ontology-based semantic profile for expressing
    capabilities, intents, tasks, and domain context in agent interactions. It defines
    a core vocabulary, a JSON-LD serialization profile, and processing rules for determining
    semantic compatibility using explicit identifiers, applicable constraints, and
    accepted alignment artifacts. It distinguishes descriptive metadata and candidate
    mapping suggestions from semantic values used in decisions. The profile can be
    carried by existing discovery and interaction mechanisms; it does not define an
    authorization, transport, session, or directory synchronization protocol. Deterministic
    processing is limited to the declared profile, versions, constraints, and accepted
    mappings, and does not imply automatic interpretation of arbitrary natural-language
    content.</p>"

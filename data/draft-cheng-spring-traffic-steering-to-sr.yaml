abstract:
- content: "<p>This document describes traffic steering mechanisms for both Segment
    Routing over IPv6 (SRv6) and Segment Routing over MPLS (SR-MPLS). It provides
    an overview of the main traffic steering methods applicable to both architectures,
    including steering based on destination addresses (BSID/Binding Label, Color/Endpoint,
    IGP Shortcut) and flow characteristics (DSCP, 802.1p, Service-class, TE-class,
    BGP- FlowSpec). Furthermore, it discusses the recommended traffic steering methods
    for various typical scenarios, highlighting the interoperability and specific
    handling differences between SR-MPLS and SRv6 where necessary.</p>"

abstract:
- content: "<p>This document defines PSI-07, a domain profile of Proof of Stateful
    Integrity (PSI) for production records for organic certification, such as input
    purchases, field activities, and inspection notes. Each record is sealed as a
    PSI receipt so that later alteration, reordering, or removal is detectable. Only
    digests are sealed. PSI-07 shows integrity and ordering only; it does not show
    that a product is organic or that any certification standard was met. Earlier
    revisions carried this title over an abstract describing regulatory monitoring
    signals. This revision makes the body match the title.</p>"

abstract:
- content: "<p>A Keysingate container keeps a work journal: pages without signatures,
    closed by one portable seal that covers every page before it and is moved forward
    by each new record. This document specifies the journal's pages, records and seals,
    the two forms of a journal (unanchored and anchored), the two exports a third
    party receives -- one page with its proof, or the whole journal once -- and how
    a verifier checks them without contacting anyone. It also specifies a profile
    for anchoring seals in Solana with a blind memo that shows outsiders only the
    fact of a write. The core documents, time format and anchor rule it relies on
    are those of draft-nam-ksg-core-00.</p>"

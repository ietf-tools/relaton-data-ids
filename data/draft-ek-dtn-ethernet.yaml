abstract:
- content: "<p>This document specifies the use of the Bundle Transfer Protocol - Unidirectional
    (BTPU) as a Convergence Layer directly over Ethernet, and requests allocation
    of an EtherType and a multicast MAC address for that purpose. This provides an
    alternative to IP-based convergence layers for environments where Ethernet forwarding
    is operationally feasible but IP routing is unavailable or operationally undesirable.</p>"

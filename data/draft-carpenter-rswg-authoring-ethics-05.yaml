abstract:
- content: "<p>This document describes ethical guidelines for assigning authorship
    in RFC documents, including guidelines for the use of artificial intelligence
    during document preparation, and for inclusion of material from other documents.
    It also discusses the related issues of acknowledgements, editors and contributors.
    The various RFC streams are expected to apply these guidelines, and possibly define
    their own variations, which will have priority.</p>"

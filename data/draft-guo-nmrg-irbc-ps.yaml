abstract:
- content: "<p>This document examines whether a routing-specific commitment model
    is useful for expressing and assessing an AS's own expected BGP behavior across
    administrative-domain boundaries. An Inter-Domain Routing Behavior Commitment
    (IRBC) is a candidate declaration. It is attributable to an issuer and applies
    to specific inter-domain connections, route scopes, directions, and operating
    conditions. Its semantics include the subject AS's connection role, the associated
    routing behavior, and a commitment context that defines scope, conditions, exceptions,
    and validity. The document distinguishes an IRBC from a general IBN intent, an
    interconnection service request, local routing policy, route-path authorization,
    and cryptographic evidence of an individual route- propagation event.</p>"

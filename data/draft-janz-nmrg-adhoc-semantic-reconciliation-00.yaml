abstract:
- content: "<p>Interoperation between network-management systems has traditionally
    required a data model agreed in advance. Where that is insufficient, a richer
    shared information model or ontology is agreed instead. Both demand broad prior
    agreement, negotiated and maintained by people. This document examines what becomes
    possible once the systems on each side can reason. Each side can lift its own
    data into a complete semantic model. Two such models can then reconcile ad hoc,
    for the occasion, with no model agreed beforehand. The document develops the semantic
    model and the two operations upon it: the lift that produces a model, and the
    reconciliation that bridges two. It gives careful treatment to pragmatics, the
    layer a schema is least likely to hold and so the part most easily left out of
    view, yet often one that carries key operative meaning. It considers the form
    and utility of thin references, separately assessing the two distinct roles they
    may play. It then reports an empirical study across four network-management scenarios,
    run over independently constructed cases and several cognitive-agent families.
    The study measures the portability of a lifted model, the extent to which cognition
    can reconcile divergent models without support of a pre-agreed standard, where
    a reference is load-bearing and what it usefully comprises. It closes with conclusions
    for how information should be prepared for cognitive systems, and for how the
    community's standardization effort might evolve. This is a research document intended
    to inform discussion in the IRTF Network Management Research Group. It reflects
    the authors' ideas, thoughts and experimental findings and does not represent
    IETF or IRTF consensus.</p>"

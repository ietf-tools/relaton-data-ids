abstract:
- content: "<p>This document defines extensions to OSPF Traffic Engineering (OSPF-
    TE) for advertising computing capability information associated with Artificial
    Intelligence Data Centers (AIDCs) in optical networks. The extensions enable an
    ASON or GMPLS-capable optical network to maintain a synchronized view of both
    network TE resources and selected computing resource attributes, so that service
    placement and path computation can consider computing resource status. The mechanism
    uses OSPFv2 Type-10 Opaque LSAs and a set of top-level TLVs and sub-TLVs. The
    extensions do not define new OSPF packet types and do not modify the OSPF neighbor
    establishment, database exchange, flooding, or acknowledgement procedures.</p>"

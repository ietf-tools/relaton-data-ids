abstract:
- content: "<p>Although operators typically consider redundant capacity during network
    design, link congestion may still occur under specific scenarios, such as link
    degradation or traffic bursts. Several congestion mitigation mechanisms have been
    proposed for intra-domain links, but congestion is not limited to intra-domain
    links, it can also occur on inter-domain links. Since changes of available bandwidth
    do not trigger updates to BGP route selection, BGP cannot alleviate inter-domain
    link congestion automatically, causing packet loss or increased delay. This document
    defines a BGP-based inter-domain elastic bandwidth- aware routing (BEBR) mechanism,
    to alleviate inter-domain link congestion. To avoid the dependency on cross-domain
    deployment, this document proposes both inbound BEBR and outbound BEBR, designed
    to address inbound and outbound traffic congestion, respectively. Thus, the congestion
    on both directions of inter-domain links can be mitigated by deploying BEBR on
    only one side of the inter-domain link.</p>"

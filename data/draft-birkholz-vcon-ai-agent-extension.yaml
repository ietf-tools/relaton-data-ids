abstract:
- content: "<p>AI agents that use large language models increasingly perform consequential
    tasks on behalf of humans and other AI agents. Demonstrating that recorded AI
    agent behavior truthfully represents actual behavior is essential for accountability,
    compliance, and human oversight. To achieve that goal, this document defines an
    extension to the Virtualized Conversation (vCon) object format, allowing a vCon
    to capture a conversation between a human and an AI agent, or between AI Agents.
    The vCon core format can already capture the back and forth messages (including
    text and voice) sent by AI agents, but additional extensions are required to fully
    reproduce the AI agent trajectory, such as agent metadata, message exchanges,
    tool invocations, reasoning traces, system events, file attribution, etc. This
    document defines those extensions in both descriptive language and formal CDDL
    definitions. This draft is a replacement for the former Verifiable Agent Conversation
    Records specification, which was a standalone format and not an extension of vCon.</p>"

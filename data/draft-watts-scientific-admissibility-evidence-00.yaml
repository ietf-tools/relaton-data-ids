abstract:
- content: "<p>This document describes a portable JSON evidence-record format for
    representing bounded scientific claims, preregistered procedures, admissibility
    evaluations, provenance artifacts, lifecycle events, and cryptographic integrity
    metadata. The format is intended to make research evidence exchangeable and mechanically
    checkable without treating cryptographic integrity, schema conformance, scientific
    admissibility, valuation, governance, or truth as equivalent concepts. This document
    is an individual informational proposal. It does not define a network transport
    protocol, does not establish scientific truth, and does not assign decision authority
    to automated systems.</p>"

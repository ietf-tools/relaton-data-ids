abstract:
- content: "<p>This document describes Telemetry-Driven Congestion Optimization (TDCO),
    a solution in which a centralized controller uses near-real- time per-tunnel demand
    and per-interface traffic measurements to prevent and alleviate link overload
    autonomously. The controller changes the paths of the tunnels under its control
    through existing mechanisms such as the Path Computation Element Communication
    Protocol (PCEP), BGP Segment Routing (SR) Policy, or NETCONF/YANG. TDCO avoids
    placing Traffic Engineering (TE) tunnels where they would cause overload and,
    when overload occurs, re-routes only as many TE tunnels as are needed to relieve
    the overload onto paths with spare capacity that meet their full TE constraints.
    This document describes the solution and the safety properties needed to operate
    it without operator approval of individual actions. It defines no protocol extensions.</p>"

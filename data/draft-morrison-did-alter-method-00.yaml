abstract:
- content: "<p>This document specifies the did:alter Decentralized Identifier method.
    A did:alter identifier names a ~handle together with the DNS zone that publishes
    the handle's signed envelope, and it resolves to a DID document by running the
    envelope recognition procedure of the companion specification for discovering
    Model Context Protocol servers through DNS TXT records, then expressing the verified
    envelope's Ed25519 key as a verification method. The identifier agrees with the
    handle grammar of the alter URI scheme and with the did:alter form already written
    by the identity-attributed commits specification. The method introduces no new
    record, no new cryptographic primitive and no registry of its own: create, update
    and deactivate are the publication, replacement and revocation of that envelope,
    and read is its verification. The document also sets out what the method cannot
    yet do, because the envelope record it reads carries no key history, and revocation
    cannot presently be observed from DNS alone.</p>"

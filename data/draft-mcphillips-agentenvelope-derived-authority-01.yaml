abstract:
- content: "<p>AgentEnvelope defines a deterministic derived-authority model for autonomous
    and action-performing systems. Instead of issuing bearer credentials from a central
    authority, AgentEnvelope derives scoped action capabilities from customer-held
    custody material and canonical action envelopes. A verifier can check an action
    signature against a public action record without receiving roots, seeds, private
    keys, mint material, or hosted service access. This revision extends the model
    with legitimacy: a governance state that records whether a cryptographically valid
    authority remains admissible under current policy, evidence, time, and operating
    context. Legitimacy separates provenance from present-tense authorization. A command
    can remain signed and verifiable while becoming illegitimate because operating
    facts, policy, or evidence changed. For autonomous-system deployments, derived
    authority and legitimacy support an IAM model concerned with authority, admissibility,
    accountability, and audit for actors that perform actions, including AI agents,
    workflows, bots, microservices, devices, robots, serverless workers, and multi-agent
    systems.</p>"

abstract:
- content: "<p>This document specifies the Data Artifact Management (DAM) protocol
    for agentic AI systems governed by the Sovereign Object OS (SOOS) framework. DAM
    defines a typed taxonomy of data artifacts produced and consumed by AI agents,
    a governance envelope for each artifact type specifying provenance, access policy,
    temporal validity, and retention requirements, and the normative interface between
    agent- generated artifacts and the Governance Audit Record (GAR). DAM addresses
    three classes of data in agentic systems: kernel- generated artifacts (IDP event
    logs, GAR records, AEP session state), agent-generated artifacts (outputs of agent
    actions), and externally ingested artifacts (data made available by resources).
    DAM specifies the Data Artifact type (DA-Type) taxonomy referenced in the Resource
    Governance Protocol (RGP) and the Agent Execution Protocol (AEP).</p>"

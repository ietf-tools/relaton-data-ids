abstract:
- content: "<p>This document describes a detached evidence handoff between independently
    administered organizations. It distinguishes artifact delivery, content integrity,
    source authentication, registration, reconciliation, and recipient decisions.
    It describes how a recipient can return a signed comparison against stated benchmarks,
    with a commitment to the figures it compared, without exporting its source ledger.
    Worked examples illustrate both a disclosed reconciliation and a comparison attestation.
    The document defines terminology and an architectural model; it specifies no wire
    protocol.</p>"

id: draft-intra-handshake-fail
title:
- content: Intra-handshake (aka Early) Attestation Considered Harmful (CVE-2026-33697
    of CVSS 7.5 and several other CVEs of up to expected CVSS 9.8 upcoming)
  language:
  - en
  script:
  - Latn
  format: text/plain
docid:
- id: draft-intra-handshake-fail
  type: Internet-Draft
  primary: true
abstract:
- content: "<p>The draft aims to provide technical details of CVE-2026-33697 (https://www.cve.org/CVERecord?id=CVE-2026-33697),
    EUVD-2026-16488 (https://euvd.enisa.europa.eu/enisa/EUVD-2026-16488), and several
    GitHub Security Advisories (GHSAs) which provide substantial technical evidence
    of how *intra*-handshake (aka early) attestation fails in practice, even _without
    physical access_. Moreover, since continuous attestation is generally required,
    *intra*-handshake attestation adds *unnecessary complexity*. The results are backed
    by the research [Intra-handshake.fail], [TLS-RA] and the artifacts [Intra-handshake.fail-repo]
    in state-of-the-art formal analysis tool, ProVerif, under Apache-2.0 license for
    reproducibility and review, and have been acknowledged by the relevant stakeholders.
    Currently, there are *two CVEs of CVSS 7.5, two GHSAs of CVSS 9.1, one GHSA of
    CVSS 7.8, seven GHSAs of CVSS 7.4, and one GHSA of CVSS 6.3 published against
    intra-handshake (aka early) attestation*. The research papers on these are currently
    either under submission or being prepared for submission. The artifacts of these
    papers will be shared with the community under Apache-2.0 license for reproducibility
    and review.</p>"
  language:
  - en
  script:
  - Latn
  format: text/html

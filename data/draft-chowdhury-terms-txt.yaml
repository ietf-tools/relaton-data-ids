abstract:
- content: "<p>The Robots Exclusion Protocol lets an origin ask automated clients
    not to fetch certain paths. It cannot express who is asking, for what purpose,
    under what terms, or at what price, and it provides no server-side enforcement.
    This document specifies terms.txt, a file at a well-known location in the style
    of robots.txt that states, per path and per purpose, whether automated access
    is allowed, charged, or denied, at what use level, at what price, and whether
    a user's delegation is required. It also specifies the HTTP exchange that enforces
    the file at the origin: requests signed with Web Bot Auth, a signed declaration
    of intent, delegation tokens and payment vouchers bound to the authenticated identifier,
    payment negotiation signaled with Problem Details, and origin-signed receipts.
    The document states which properties the exchange enforces before delivery, which
    it can only audit afterward, and which remain contractual.</p>"

abstract:
- content: "<p>This document specifies HTTP/4, an application-layer mapping of HTTP
    semantics over a decentralized, peer-to-peer real-time streaming transport protocol
    named WIQC (Web-Integrated QUIC-derived Content- swarming). By design, the HTTP/4
    protocol allows decentralized real- time streaming via a torrent protocol called
    not QUIC but WIQC. While HTTP/3 delegates stream multiplexing and congestion control
    to unicast client-server QUIC connections, HTTP/4 extends these capabilities to
    multipoint peer swarms. WIQC integrates encrypted UDP stream multiplexing with
    fine-grained cryptographic block verification using SHA-256 Merkle hash trees,
    live sliding-window chunk addressing, Unified Merkle Tree signatures for low-latency
    live streams, mutual peer authentication without centralized certificate authorities,
    and native UDP hole punching. This specification defines the wire framing, stream
    mapping, swarm discovery headers, real-time object prioritization, and security
    properties required to operate HTTP/4 natively across decentralized networks.</p>"

abstract:
- content: "<p>The evolution from Level 3 (assisted automation) to Level 4 (closed-
    loop autonomy) in Autonomous Networks (AN) introduces requirements for agentic
    capabilities, including intent-based reasoning, autonomous planning, and context-aware
    decision-making, and execution coordination, which transcend the static, rule-based
    logic of traditional network controllers. This document defines the concept of
    the Network Management Agent (NMA), a network management entity with autonomous
    task processing capabilities designed to bridge the gap between service intent
    and network operations. This document describes the role of NMA in network management
    and control architectures, and specifies how the NMA collaborates with existing
    network controllers to achieve Autonomous L4 without replacing or duplicating
    their functions. It further defines the reference architecture, deployment modes,
    and logical interfaces of the NMA, including Agent-to-User (A2U), Agent-to-Agent
    (A2A), Agent- to-Controller (A2C), and Agent-to-Network (A2N) interactions.</p>"

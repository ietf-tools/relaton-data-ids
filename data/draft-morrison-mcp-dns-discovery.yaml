abstract:
- content: "<p>This document defines a DNS-based mechanism for discovering Model Context
    Protocol (MCP) servers, the identity of the organisations that operate them, and
    a cryptographic identity envelope bound to an individual Sovereign-tier ~handle
    published under the same zone. Three TXT records are defined. _mcp.&lt;domain&gt;
    advertises an MCP server's endpoint URL, agent protocol family, transport binding,
    cryptographic identity, and capability profile. _org-alter.&lt;domain&gt; advertises
    the operator's canonical organisational identity, including its legal entity,
    registry identifier, regions of operation, and any regulatory framework under
    which it must refuse external automated access. _alter.&lt;domain&gt; publishes
    an Ed25519-signed envelope binding a ~handle to a public key, an IdentityLog root
    reference, and a revocation commitment. DNSSEC validation is REQUIRED for the
    envelope record, and a DANE TLSA pin on the MCP endpoint is REQUIRED where resolving
    an envelope and opening an MCP session are one recognition transaction. This revision
    (v05) corrects earlier ones and introduces no new mechanism. It withdraws several
    claims that v04 could not support, marks publication of a per-individual envelope
    in DNS as NOT RECOMMENDED on enumeration, size, and erasure grounds, and separates
    the agent protocol family from the transport binding in the _mcp record, aligning
    that vocabulary with neighbouring DNS agent- discovery drafts. All three record
    formats and all three procedures are given here in full, so no earlier revision
    need be fetched. The mechanism complements HTTPS-based discovery, and follows
    the precedent set by DKIM, SPF, DMARC, and MTA-STS. Provisional registration of
    a companion alter: URI scheme is requested of IANA, and is not yet granted.</p>"

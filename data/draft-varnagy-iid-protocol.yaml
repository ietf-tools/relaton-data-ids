abstract:
- content: "<p>This document specifies the IID protocol, which defines message formats
    and operations for managing personal data, permissions, and attributes associated
    with internet identities, including natural persons, organizations and artificial
    intelligence agents. The protocol is designed to be simple, extensible, platform-
    independent, and human readable. It is transport-agnostic and supports arbitrary
    cryptographic algorithms.</p>"

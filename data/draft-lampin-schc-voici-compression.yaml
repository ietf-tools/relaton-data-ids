abstract:
- content: "<p>This document describes how to compress VOICI headers using SCHC rules
    at a lower stratum, demonstrating that VOICI provides explicit routing metadata
    that is transparently compressed to minimal on-wire size while preserving standardized
    dispatch semantics. It is intended as a reference for implementers deploying VOICI
    in SCHC- based networks and does not modify the VOICI specification itself.</p>"

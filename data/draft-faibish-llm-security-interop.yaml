abstract:
- content: "<p>Large Language Models (LLMs) are now accessed as network services by
    a large and growing number of applications, yet the way they are invoked, secured,
    described, and attributed has coalesced around vendor-specific and de facto interfaces
    rather than open, neutral standards. The most consequential gap is in security:
    there is no common, analyzable model for authenticating to an LLM service, authorizing
    tool invocation, protecting and attributing output, or reasoning about the trust
    boundary an LLM sits on. These models also sit directly on top of network storage:
    LLM training data, model checkpoints, and retrieval corpora are routinely served
    from NFSv4 and pNFS, so the security, provenance, and access-control questions
    raised here have concrete NFSv4-facing consequences. This document argues that
    uniting the multitude of competing LLMs behind a common, secure, interoperable
    interface is fundamentally the kind of problem the IETF exists to solve, and it
    makes the case for chartering a new IETF Working Group. It sets out the problem
    with security as the central motivation, describes the interaction with NFSv4
    and network storage, records the initial expressions of interest that any such
    effort must be able to show, proposes a candidate scope with concrete deliverables
    and explicit non-goals, addresses the principal objections, and describes the
    intended path to chartering through a Dispatch presentation or a Birds-of-a-Feather
    (BOF) session. This document is Informational and defines no protocol.</p>"

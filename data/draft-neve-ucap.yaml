abstract:
- content: "<p>Automated HTTP clients, including search crawlers, indexing bots, archivers,
    and AI-assisted agents, routinely access Web origins. Existing identification
    mechanisms do not consistently give an origin operator a way to verify a particular
    request, report alleged abuse, follow the report's disposition, or request that
    an operator stop accessing an origin. This document proposes the Universal Crawler
    Accountability Protocol (UCAP), an opt-in interoperable HTTP interface for these
    tasks. UCAP associates a per-request opaque identifier with a cryptographically
    authenticated automated client, defines operator-hosted verification, abuse-reporting
    and case-status resources, and defines a domain-scoped exclusion request with
    acknowledgment and status. UCAP builds on HTTP Message Signatures and does not
    replace robots.txt or existing site access controls. The verification service
    does not identify an end user to the origin. This initial proposal requires further
    review of its privacy, authorization, and operational trade-offs.</p>"

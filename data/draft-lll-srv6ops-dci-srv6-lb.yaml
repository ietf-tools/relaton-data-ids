abstract:
- content: "<p>This document describes an SRv6-based adaptive load balancing architecture
    for AI Data Center Interconnection (DCI) scenarios, where RoCEv2 elephant flows
    traverse WAN between storage and compute sites under the storage-compute separation
    paradigm. The architecture employs a controller-driven closed loop: telemetry-based
    flow and path monitoring, SL-level imbalance detection, and BGP Flowspec-based
    steering with QP-level matching granularity and Segment List-level action precision.
    This supplements the default QP-aware hash-based SL selection with dynamic, explicit
    flow steering to resolve hash collisions and persistent load imbalance.</p>"

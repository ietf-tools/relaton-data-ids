abstract:
- content: "<p>This document deprecates several outdated cryptographic algorithms
    and parameters from the Kerberos PKINIT specification (RFC 4556) and its extensions
    (RFC 5349, RFC 8636). Specifically, it deprecates the RSA key transport mechanism
    for reply key delivery, the Diffie- Hellman MODP group 2 (1024-bit) parameter,
    the SHA-1-based octetstring2key key derivation function, and the sha1WithRSAEncryption
    CMS signature algorithm. It also defines a new paChecksum2 field in the PKAuthenticator
    structure to provide checksum algorithm agility. This document updates RFC 4556,
    RFC 5349, and RFC 8636.</p>"

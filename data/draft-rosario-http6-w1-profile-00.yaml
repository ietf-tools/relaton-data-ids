abstract:
- content: "<p>An autonomous artificial intelligence agent can delegate work, call
    an external tool, and retry an operation after the person who authorized it has
    gone offline. This document specifies W1, an HTTPS binding that lets the tool
    provider verify which agent is acting, the authority it inherited, and the resource
    effect requested. Signed approval and delegation records carry the human's limits.
    A time- bounded execution permit reserves a shared allowance. The provider links
    its response to the request and supplies a receipt for the charge it committed.
    A companion corpus supplies public test keys, exact signed messages, initial states,
    and expected observations for eleven cases. Independent implementers can exchange
    these artifacts and compare what occurred at the resource.</p>"

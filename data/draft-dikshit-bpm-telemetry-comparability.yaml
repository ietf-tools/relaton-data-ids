abstract:
- content: "<p>Operational telemetry is often used to compare network performance
    across observation points, traffic classes, service instances, paths, devices,
    and time intervals. The numeric value of a metric is not sufficient for such comparison
    unless the observation context and the comparability conditions are also known.
    This document describes a common interoperability problem in operational measurement
    systems: values such as delay, loss, ECN marking, queue occupancy, packet counts,
    byte counts, and flow correlation identifiers can be exported from different observation
    points or under different aggregation rules while still appearing to be directly
    comparable. A collector or controller can therefore combine values that do not
    describe the same measurement domain. The document defines requirements for describing
    the observation point, metric source, aggregation interval, traffic class, flow
    scope, sampling rule, timestamp basis, freshness, and comparability domain associated
    with operational telemetry used for IP performance measurement. The goal is to
    make operational measurement results easier to compare without prescribing one
    measurement protocol, one data model, or one congestion control mechanism.</p>"

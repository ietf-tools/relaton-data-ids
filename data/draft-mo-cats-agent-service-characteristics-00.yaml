abstract:
- content: "<p>AI agent services place a new class of demands on the network: sessions
    are long-lived and stateful, a single user request expands into multiple model
    invocations and tool calls, and the quality of the result depends jointly on the
    forwarding path, on the computing capability that is available at the selected
    site, and on whether the state that the agent needs is already present near that
    site. Computing-Aware Traffic Steering (CATS) already selects a service contact
    instance using a combination of computing and network metrics, but the CATS framework,
    metric, and data model documents were not written with agent services in mind.
    The document covers long-horizon tasks and their long-tail behaviour, discrete
    and distributed tool invocation, the cost of context growth and compression, the
    communication modes used by agent services, and the persistence of session state
    and memory. It reports measured distributions of model, state, and software artifact
    sizes, states what a CATS system must measure in order to steer this traffic,
    and identifies the information that a CATS system needs in order to select an
    instance for an agent service. This document does not define any protocol extension,
    metric encoding, or data model.</p>"

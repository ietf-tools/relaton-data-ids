abstract:
- content: "<p>This document describes procedures for handling ICMP error messages
    for Ethernet VPN Virtual Private Wire Service (EVPN-VPWS) in Segment Routing over
    IPv6 (SRv6) networks. It describes an ingress-PE approach that associates a received
    ICMPv6 error with the EVPN service, constructs eligible customer ICMP feedback,
    and uses local End.DX2 disposition to apply the appropriate Ethernet and VLAN
    treatment. The discussion covers IPv4 and IPv6 customer traffic, the handling
    of the different ICMP error classes, and the additional procedures applicable
    to Packet Too Big messages and Path MTU Discovery.</p>"

abstract:
- content: "<p>This document describes how an Extended Community is derived from a
    Route Target, how each such Route Target derived Extended Community corresponds
    to the Route Target, and how the two differ. It records the code points assigned
    for this purpose and requests the remaining assignments. It does not specify how
    Route Target derived Extended Communities are used; that is left to the documents
    specifying each use.</p>"

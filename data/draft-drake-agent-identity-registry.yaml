abstract:
- content: '<p>This document defines the Agent Identity Registry System (AIRS): a
    federated architecture that gives the durable identity0 of an autonomous entity
    a permanent canonical identifier, maintains an authoritative record about that
    identity, binds proof of control to enrolled anchors, and issues credentials that
    relying parties can verify. Identity0 and the distinction between an identity,
    its identifiers, its credentials, and its anchors are defined in [I-D.drake-agent-identity-problem-statement].
    The canonical identifier is a URN in the "aid" namespace ([RFC8141]). At the sovereign
    and portable assurance tiers, each independently accepted identity requires its
    own manufacturer-attested physical anchor, and each accepted anchor backs at most
    one identity. A device normally carries one accepted anchor, so identities at
    these tiers cost scarce physical units rather than software operations. Enclave
    and virtual tiers can provide useful hardware-backed key protection without making
    that physical-scarcity claim; a declared tier permits software-only participation.
    The architecture separates governance, authoritative registry operation, and competing
    Registrars, and uses standard OAuth 2.0 JWT access tokens conforming to [RFC9068]
    for authenticated use.</p>'

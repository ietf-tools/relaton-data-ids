abstract:
- content: "<p>This document describes the use of the QUIC transport protocol as a
    common transport substrate for operational Network Telemetry protocols that currently
    rely on UDP. Specifically, it discusses carrying protocols such as IPFIX, Syslog,
    YANG-Push UDP-Notif, and RADIUS Accounting over QUIC connections. For telemetry
    protocols whose data plane is inherently loss-tolerant (where a missing sample
    is preferable to a delayed retransmission) this document recommends use of the
    Unreliable Datagram Extension to QUIC (DATAGRAM frames). A primary motivation
    for this work is the unification of transport- layer security across heterogeneous
    telemetry protocols. Protocols that currently have no mandatory transport security
    (syslog over UDP) or optional-only security (IPFIX over UDP with DTLS) or weak
    security (RADIUS with MD5 obfuscation) would all benefit from the mandatory TLS
    1.3 mutual authentication that QUIC provides. This document specifically addresses
    the operational advantages of managing a single PKI certificate lifecycle per
    Network Node to authenticate all telemetry streams. This document is intended
    as a framework and applicability statement. Per-protocol bindings that require
    normative specification are expected to be chartered in their respective IETF
    working groups.</p>"

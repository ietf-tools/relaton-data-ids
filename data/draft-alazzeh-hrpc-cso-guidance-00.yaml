abstract:
- content: "<p>Civil society organizations (CSOs) document how Internet protocols
    and their deployments affect people around the world, yet their participation
    in the IETF has been limited and difficult to sustain, particularly for organizations
    based in the Global South. This document offers guidance to CSOs on how their
    research and field experience can inform the work of the IETF and IRTF. It points
    to areas where IETF work and CSO interests overlap, explains how field observations
    can be described so that the technical community can use them, and identifies
    venues where this work can be shared. The aim is to inform, not to determine,
    restrict, or dictate, the design and deployment of Internet protocols in the public
    interest. It is a contribution to the Human Rights Protocol Considerations Research
    Group (HRPC) of the IRTF.</p>"

abstract:
- content: "<p>6LoWPAN compression schemes, including HC1 [RFC4944], IPHC [RFC6282],
    and GHC [RFC7400], elide the IPv6 Payload Length (PL) field from compressed packets,
    relying on the Layer 2 (L2) PL to reconstruct it at the receiver. This assumption
    holds for IEEE 802.15.4 [IEEE Std 802.15.4], which delivers exactly the bytes
    transmitted. However, L2 technologies that enforce a minimum frame size — most
    notably Ethernet IEEE 802.3 [IEEE Std 802.3], which has a minimum payload of 46
    bytes — silently pad short frames with zero bytes. In such cases, the receiver
    incorrectly reconstructs the IPv6 PL field, leading to packet corruption and protocol
    failure. This document describes the problem, analyzes existing workarounds, and
    defines a solution based on an Escape dispatch byte (ESC) or ESC Extension Type
    (EET) extended dispatch mechanism that explicitly encodes the IPv6 PL when L2
    padding may be present.</p>"

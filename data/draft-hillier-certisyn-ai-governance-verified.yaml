abstract:
- content: "<p>This document specifies a verification standard for the cryptographic
    attestation of agentic AI governance in regulated industries. It defines the Verification
    Reconciliation Object (VRO), the issuing- partner framework, the eight control
    areas through which AI governance posture is reconciled, three maturity-attestation
    levels (Documented, Operational, Adversarial-ready), and the cryptographic continuity
    requirements that together produce deterministic, independently reconstructable,
    auditor-grade attestations of agentic AI governance. The standard sits beneath
    ISO/IEC 42001:2023, the NIST AI Risk Management Framework, and other agentic AI
    governance frameworks, and produces the verifiable artefact those frameworks were
    designed to imply but do not deliver.</p>"

abstract:
- content: "<p>This document defines a structured value model independent of serialization
    for use by derived identifier constructions and profiles. A Value consists of
    exact context octets, exact content octets, and a finite set of scoped opaque
    identifiers. The model defines structural admission, exact equivalence, placement
    of distinctions that affect comparison, and rules for importing identifiers from
    independently governed systems. The model does not define a wire representation,
    canonicalization procedure, cryptographic hash, identifier syntax, application
    profile, resolver, registry, or trust model. Source mappings and concrete derived
    identifier profiles are defined by surrounding specifications.</p>"

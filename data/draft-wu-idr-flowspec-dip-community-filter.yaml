abstract:
- content: "<p>The BGP Flow Specification (BGP-FS) mechanism propagates both traffic
    Flow Specifications and Traffic Filtering Actions using the BGP NLRI and Extended
    Community encoding formats. This document specifies a new BGP-FS component type
    to support community-level filtering. The match condition evaluates the BGP Community
    attribute associated with the destination IP address encoded in the Flowspec NLRI.
    This mechanism is intended for deployment within a single administrative domain.</p>"

abstract:
- content: "<p>This document describes an extension to the Internet Key Exchange protocol
    version 2 (IKEv2) that prevents particular downgrade attacks on this protocol
    by having the peers confirm they have participated in the same conversation. This
    document updates RFC 7296.</p>"
  language:
  - en
  script:
  - Latn
  format: text/html

abstract:
- content: "<p>In the stream mode of Braid-HTTP subscriptions, the server holds one
    response open, and sends each change in it. Some origin servers can't hold a response
    open, such as those that run as serverless functions or on shared hosting. And
    on some paths, a proxy buffers each response until it ends. This document defines
    two subscription modes in which nothing stays open for long. In the long-poll
    mode, the client sends a GET for each change, and the server responds to it when
    the change happens. In the webhook mode, the origin server pushes each change
    to a subscription gateway as a PUT or a DELETE, and the gateway serves the subscription
    to its clients. In both, each message after the first says which version it builds
    on, and the first can too, so no message depends on a connection, and each can
    take its own path. This document is one of the Braid-HTTP extensions, which work
    alone or together; together they make HTTP a state synchronization protocol.</p>"

abstract:
- content: '<p>A companion specification, "Discovery and Device Lifecycle for OAuth
    Push-Based Authentication", defines a generic, back-channel-protocol- agnostic
    device registration, attestation, and lifecycle layer for out-of-band OAuth 2.0
    authenticator devices. This document is the thin binding that lets a device registered
    under that specification be woken by OpenID Connect Client-Initiated Backchannel
    Authentication (CIBA) Core''s authorization endpoint: one request parameter, one
    additive error code, and a statement of how CIBA''s existing binding_message composes
    with the base document''s interaction-type ceremony. This document adds no new
    endpoints and no new discovery fields of its own.</p>'

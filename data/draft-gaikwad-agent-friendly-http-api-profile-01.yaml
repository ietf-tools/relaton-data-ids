abstract:
- content: "<p>AI agents are a fast-growing kind of HTTP API client. A human developer
    reads an API's documentation once and then writes code that calls it. An AI agent
    works from the machine-readable description each time it plans a step. It works
    within a limited amount of text it can hold at once. It retries often. It picks
    operations by matching their descriptions to a goal. An API built mainly for human
    developers can lead an agent into failures that are easy to avoid, such as repeating
    a write, running out of room for the task, or getting stuck on an error it cannot
    recover from. This document lists the properties that make an HTTP API easy for
    AI agents to use, including APIs reached through tool-calling layers such as the
    Model Context Protocol. It gathers these properties into a profile of existing
    HTTP and API-description mechanisms, with a checklist at the end. It covers the
    API and its description. It does not define new ways to identify, authenticate,
    or authorize an agent. That work is happening elsewhere and is referenced here
    for context.</p>"

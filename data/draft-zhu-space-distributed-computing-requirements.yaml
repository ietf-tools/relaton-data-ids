abstract:
- content: "<p>Distributed execution can be useful in space networks when one node
    lacks enough computing, storage, energy, or execution time, or when data is spread
    across multiple nodes. It can also enable parallel processing or allow different
    execution stages to run on different space or terrestrial nodes. A task may therefore
    create multiple communication relationships that appear, coexist, change, and
    end as execution progresses. Because satellite motion changes connectivity over
    time, reachability alone is not enough to determine whether an execution endpoint
    can support the required communication. This document analyzes the network role
    in such distributed execution in the space network. It considers how network information
    affects execution decisions, how those decisions create communication requirements
    and relationships, when communication over a relationship is ready for use, and
    how relationships change as execution and connectivity evolve.</p>"

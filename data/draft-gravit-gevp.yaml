abstract:
- content: "<p>GEVP defines a minimal protocol for epistemic convergence. Renamed
    from VCP to avoid collision with draft-kamimura-scitt-vcp. It maps the GEVP Epistemic
    State Machine to the evidence taxonomy of the Gravit Verifiable Epistemic Decision
    Standard (VEDS). This revision corrects the Implementation Status: the threshold
    calibration and the cost relation reported in earlier revisions could not be reproduced
    and are replaced by reproducible results; no specific theta threshold is recommended
    any longer.</p>"

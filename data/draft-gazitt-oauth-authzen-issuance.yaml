abstract:
- content: "<p>Numerous OAuth 2.0 specifications define a moment at which an authorization
    server decides whether to issue a security token, and each of them declares the
    decision itself to be a matter of local policy that is out of scope. The result
    is that a decision common to every OAuth deployment has no interoperable expression.
    This document defines a profile for using the OpenID AuthZEN Authorization API
    to externalize that decision to a Policy Decision Point. It specifies how the
    inputs to a token issuance request map onto AuthZEN's mandatory five-tuple, how
    a Policy Decision Point response may shape the issued token, and how a Policy
    Decision Point advertises support for the profile. The mapping is complete for
    grants whose request names a single party, including the authorization code and
    client credentials grants. Companion documents bind the grant families that add
    structure this document does not model, the token exchange family first among
    them.</p>"

abstract:
- content: "<p>The Legal Entity Identifier (LEI), defined by ISO 17442 and operated
    under the global governance of the Global Legal Entity Identifier Foundation (GLEIF),
    is the internationally recognized identifier for legal entities in financial transactions
    and regulatory reporting. The verifiable LEI (vLEI), built on Key Event Receipt
    Infrastructure (KERI) and Authentic Chained Data Containers (ACDC), extends the
    LEI into the digital trust ecosystem with cryptographically verifiable credentials
    issued through Qualified vLEI Issuers (QVIs). This document specifies how the
    Agent Transfer Protocol (AGTP) binds to the LEI and vLEI infrastructure. It defines
    how an LEI is carried in an AGTP Owner-ID, how a vLEI Legal Entity credential
    composes with AGTP-CERT to establish institutional identity at the wire, how a
    new verification path (vlei-anchored) is added to AGTP-TRUST for KERI- based verification,
    and how vLEI Role Credentials (OOR, ECR, AUTH) express the human authorization
    chain that produced an agent. The result is a clean composition: AGTP provides
    the agent identity substrate, the LEI provides the institutional identity, the
    vLEI provides cryptographic verification of that institutional identity, and the
    vLEI Role Credentials provide the authorization chain from the legal entity through
    human officers to the agent. This document positions financial institutions, regulated
    entities, and other LEI holders to deploy agents with structurally verifiable
    institutional identity from day one.</p>"

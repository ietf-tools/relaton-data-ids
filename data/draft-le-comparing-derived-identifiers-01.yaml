abstract:
- content: "<p>Specifications use equality of independently derived identifiers to
    compare underlying values. Those comparisons require shared rules for admission,
    equivalence, derivation, and output interpretation. Inconsistent rules can give
    different identifiers to equivalent values or equal identifiers to values that
    the comparison distinguishes. This document presents a framework for specifying
    and reviewing these rules as a comparison contract. It connects source mappings
    to derivation-domain equivalence and the conclusions supported by equal and unequal
    outputs. It distinguishes information loss before a downstream operation from
    that operation's own false match properties. A review traces the relevant specification
    clauses, records supporting evidence, and identifies failed or unestablished obligations.
    The framework provides guidance for concrete identifier specifications; it defines
    no identifier format or derivation algorithm.</p>"

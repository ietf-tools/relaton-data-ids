abstract:
- content: "<p>This document defines Operation IR, a protocol-neutral intermediate
    representation for runtime network operations in the NAIM architecture. Operation
    IR serves as an AI-friendly operation layer between AI agents or LLM-based systems
    and the underlying network management protocols. It captures write operations,
    retrieval, RPC/ action invocation, filtering, transaction metadata, precondition
    verification, compensation semantics, and optional expression-based values. Operation
    IR is designed to be consumed by any upstream mechanism capable of generating
    structured operation intent, including but not limited to MCP tool invocations,
    function calling interfaces, and agent-to-agent communication protocols. The translation
    of Operation IR into protocol-specific messages is performed deterministically
    by a Handler component, keeping the AI agent in the role of intent encoder rather
    than protocol executor. This document also defines context completeness classes
    for the Originator (AI agent) side, validation feedback requirements, and an execution
    preview mode intended to improve safety and operator trust. It standardizes semantic
    expectations and interoperability boundaries, but does not standardize proprietary
    dialogue policies, implementation-specific scheduling internals, automatic compensation
    derivation algorithms, or private execution-engine logic.</p>"

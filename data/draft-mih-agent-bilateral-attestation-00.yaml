abstract:
- content: "<p>When an agent operated by one organization requests a consequential
    action from an agent operated by another, today's record of that exchange — if
    one exists — is kept by one side, editable by that side, and deniable by the other.
    Disputes reduce to my-log-versus- your-log. This document describes a bilateral
    attestation exchange for such actions: the requesting organization signs a request
    attestation binding it to the action and its material terms; the performing organization
    evaluates the request against deterministic constraints at the boundary where
    the action takes effect and signs an action attestation recording the constraint
    results and the disposition — performed, declined, or escalated to a human — by
    reference to the request; and each party acknowledges the other's attestation.
    The combined record binds each organization to its part, gives each proof of the
    other's, and can be anchored to a transparency service so that a third party who
    trusts neither organization can verify its integrity, timing, and both parties'
    signatures. The exchange records refusals with the same fidelity as performance,
    and degrades gracefully when a counterparty cannot attest, marking the record's
    reduced assurance rather than blocking the transaction.</p>"

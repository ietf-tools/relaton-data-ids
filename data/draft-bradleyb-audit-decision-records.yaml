abstract:
- content: "<p>Audit systems for autonomous agents commonly record the actions an
    agent performed. This makes the non-occurrence of a permitted action unrepresentable:
    when nothing happens, there is no action to emit anything. This document describes
    an evidence model that records the authorization decision rather than the action.
    A decision exists whether or not the action follows, so denials, expiries, and
    commitments that were granted and never honoured remain representable. The document
    defines four disclosures that make a decision record independently evaluable,
    an entry-emission rule for states a relying party may need to reason about, and
    the evidentiary basis for claims that a decision preceded its effect. It distinguishes
    correspondence, where two records agree about what happened, from precedence,
    where the order of decision and effect is established, and it requires records
    to state which of the two they carry.</p>"

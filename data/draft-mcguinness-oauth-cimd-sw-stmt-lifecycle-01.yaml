abstract:
- content: "<p>This specification defines how a Client ID Metadata Document (CIMD)
    software statement, as defined in a companion specification, is withdrawn, superseded,
    and replaced after an authorization server has admitted or registered a client
    on it. That specification evaluates a statement when a grant is opened, not when
    it is refreshed. Under this specification, an issuer can withdraw a statement
    before it expires. Once an authorization server accepts a later statement, the
    issuer's earlier statements about the same software are superseded there for new
    grants and registrations, within the applicable tenant. When a grant is refreshed,
    the authorization server requires a later statement in place of one that has been
    withdrawn, and this specification recommends the same for one that has expired.
    A profile of Token Status List provides withdrawal, and an optional Shared Signals
    Framework event prompts authorization servers to check a statement's status.</p>"

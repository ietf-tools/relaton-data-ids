abstract:
- content: "<p>This document specifies the authority agents exercise in dialogs of
    the Protocol for Agent Communication Exchange (PACE): delegating work with a credential
    bound to the delegated dialog, pausing to ask for approval of a single action,
    and turning that approval into an authorization for only that action. It also
    covers proof that a principal approved, commitments between parties acting for
    different principals, and facts attested by third parties. It reuses OAuth, WIMSE,
    and agent-protocol mechanisms, defining only the glue to PACE and the security
    properties every profile must provide.</p>"

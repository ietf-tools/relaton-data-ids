abstract:
- content: "<p>This document specifies a centralized control-plane realization of
    Computing-Aware Traffic Steering (CATS). The realization uses a logically centralized
    CATS Path Selector (C-PS) together with ingress and egress CATS-Forwarders. The
    C-PS receives a service request from an ingress CATS-Forwarder, resolves the requested
    service to an eligible service contact instance using computing service and network
    information, and then invokes a path-computation function for the selected destination.
    The path-computation request contains a resolved headend, endpoint, and network
    constraints; it does not ask the PCE to discover service instances. After path
    computation, the C-PS returns a steering binding to the ingress CATS-Forwarder.
    The binding identifies the selected destination address, the egress CATS-Forwarder,
    and a realizable path or policy. The ingress forwarder applies the destination
    replacement and path encapsulation to the first packet and forwards it. The egress
    forwarder removes the path encapsulation and delivers the packet to the selected
    service contact instance. Subsequent packets use the installed flow binding, and
    reverse traffic uses the corresponding return binding.</p>"

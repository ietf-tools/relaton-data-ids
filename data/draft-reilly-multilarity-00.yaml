abstract:
- content: "<p>Popular and technical discourse anticipates a technological Singularity:
    a point at which a single self-improving intelligence recursively surpasses all
    others, after which the trajectory of the system is determined by that one lineage.
    This document describes a different inflection, termed the Multilarity: a condition
    in which the aggregate rate of intelligence growth becomes superhuman while the
    locus of intelligence remains irreducibly plural. No single agent, model, operator,
    or lineage holds the frontier; capability accrues in the couplings between many
    participants, including humans. The Multilarity is presented here not as a forecast
    but as a design target. A plural outcome is not the default result of many actors
    existing at once; apparent plurality collapses quietly into a concealed singleton
    unless specific substrate properties are maintained and verified. This document
    defines the Multilarity, distinguishes it from singleton and multipolar framings,
    specifies five Multilarity Conditions (MC-1 through MC-5), defines measurable
    indicators including the Capability Concentration Ratio (CCR) and the Multilarity
    Index (MI), specifies the Multilarity Attestation Record (MAR) as an interoperable
    evidence format, and enumerates the convergence pathologies by which plurality
    is lost.</p>"

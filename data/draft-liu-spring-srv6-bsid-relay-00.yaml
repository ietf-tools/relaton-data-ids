abstract:
- content: "<p>This document defines a new SRv6 Endpoint behavior, End.B6.Encaps.Relay,
    for Binding SID (BSID) nodes in SRv6 networks. The behavior enables BSID nodes
    to relay tunnel-internal notification messages, such as ICMPv6 errors and congestion
    notifications, back to the upstream tunnel source node through a mapping mechanism.</p>"

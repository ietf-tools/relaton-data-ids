abstract:
- content: "<p>This document defines a COSE header parameter which signals that an
    authentication credential is replaced by the hash of the authentication credential
    in protocol message computations, specifically targeting the Lightweight Authenticated
    Key Exchange (LAKE) protocol specified as RFC 9528. This further relaxes the need
    for transporting authentication credentials in LAKE, which reduces protocol message
    sizes and improves performance in constrained networks.</p>"

abstract:
- content: "<p>This document describes a mechanism for mitigating Inter-AS routing
    exploits and path tampering without introducing real-time cryptographic processing
    overhead on core routing engines. By utilizing Out-of-Band (OOB) Cryptographic
    Validation combined with localized caches via the RPKI-to-Router (RTR) protocol
    and Autonomous System Provider Authorization (ASPA), networks can asynchronously
    verify path plausibility. This architecture supports incremental, partial deployment
    to protect infrastructure against malicious traffic redirection and unauthorized
    path propagation at major internet exchange points.</p>"

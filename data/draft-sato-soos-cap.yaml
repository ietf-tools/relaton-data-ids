abstract:
- content: '<p>An AI agent''s authorization system determines what it is permitted
    to do. A human principal''s escalation decision determines what they authorize.
    Neither of these is sufficient on its own: a Cedar policy can permit market manipulation;
    a human principal can authorize fraud. Authorization systems answer the question
    "who decided?" The Constitutional AI Protocol answers a different question: "was
    that decision lawful?" CAP defines a Constitutional Layer that evaluates every
    AI action request and every human authorization decision against a three-tier
    prohibition model -- before Cedar evaluates the action and before the system executes
    the human''s decision. Tier 0 prohibitions are derived from near-universal treaty
    consensus and are unconditional: no agent, operator, or human principal can authorize
    them. Tier 1 prohibitions are jurisdiction-specific and operator-declared. Tier
    2 prohibitions are voluntary operator ethical standards. This document also specifies
    the Prohibition Clearance Mechanism (PCM): the process by which specific Tier
    0 and Tier 1 prohibition classes may be cleared for specific deployment contexts
    -- either at implementation time by the operator or by formal regulatory authority
    -- while preserving an absolute prohibition floor for CSAM and genocide facilitation
    under any circumstances. The Sovereign Object OS (SOOS) is the reference implementation
    of the Governance Execution Controller (GEC) pattern on which CAP is built.</p>'

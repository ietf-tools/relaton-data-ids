abstract:
- content: "<p>Enterprise Wi-Fi networks authenticate devices using enterprise credentials
    and provisioning policies that are entirely independent of MNO subscriber identity.
    As a result, MNO application traffic on enterprise Wi-Fi is completely anonymous
    at the Wi-Fi layer: the enterprise cannot identify MNO subscribers, apply per-subscriber
    QoS, or support fast BSS transitions for VoWiFi continuity. This document specifies
    EAP-WSIM, an evolutionary enhancement of EAP- AKA' (RFC 9048) that enables MNO
    devices to authenticate to enterprise Wi-Fi using their existing SIM credential
    (WSIM-Card) without contacting the MNO backend during authentication. A WSIM-
    Authentication Server (WSIM-AS) within the enterprise Wi-Fi infrastructure holds
    MNO-provisioned MASTER KEY material in tamper- resistant security hardware. Per-subscriber
    MILENAGE key material is derived on-demand from the MASTER KEY using the device's
    IMSI -- identical in principle to MNO SIM personalization -- entirely within the
    security hardware boundary. No per-subscriber key provisioning at the WSIM-AS
    is required.</p>"

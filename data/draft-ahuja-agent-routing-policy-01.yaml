abstract:
- content: "<p>Agent tasks are delegated across organizational boundaries. Existing
    work specifies how agents are identified, discovered, and described, states requirements
    for cross-domain isolation and authorization, and identifies the absence of a
    mechanism for expressing capability policy as a gap. This document defines four
    policy attributes for inter-domain agent delegation, the declarations each attribute
    carries, and a validity condition on delegation chains that no party establishes
    by observing the whole chain. Whether independently chosen policies converge is
    analysed in separate work.</p>"

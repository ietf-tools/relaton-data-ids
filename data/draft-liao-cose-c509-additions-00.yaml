abstract:
- content: "<p>This document defines additions to CBOR Encoded X.509 Certificates
    (C509). This document defines a new C509SubjectPublicKeyInfo type, a CBOR representation
    of the X.509 SubjectDirectoryAttributes extension, and a mechanism that allows
    organizations assigned a Private Enterprise Number (PEN) to define organization-specific
    integer identifiers without registering each identifier in the C509 RDN attribute
    type, CR attribute type, extension ID, certificate policy, or extended key usage
    registries. This document also defines textual encoding labels for C509 objects
    using the textual encoding conventions specified in RFC 7468.</p>"

abstract:
- content: "<p>This document specifies Coherence-BFD, a protocol that combines the
    asynchronous heartbeat, demand-mode, echo function, and detection-multiplier mechanisms
    of Bidirectional Forwarding Detection (BFD, [RFC5880]) with the multi-vantage
    path coherence detection of [I-D.melegassi-mvps-incremental-be]. The result is
    a sub-second coherence failure detector with theoretical and empirical detection
    latency of 55 ms (1091x faster than the 60-second tick baseline of the underlying
    BE-MVPS framework). Five execution variants are specified: V0 (baseline), V1 (heartbeat-fast),
    V2 (demand), V3 (echo), and V4 (hybrid). Wall- clock benchmarks confirm V3 (Echo)
    as the latency-optimal variant at 55 ms median tau_detect with 39 680 B/s bandwidth.
    This revision (-01) adds three layers of proof: (a) Canonical: formal proofs of
    the detection lower-bound (Theorem T-BFD-1), false-positive-rate decay (Theorem
    T-BFD-2), and connection to the GDDP geometric- precision framework (Corollary
    C-BFD-3). (b) Empirical: SHA-256-anchored benchmark receipts reproducible from
    the public reference scripts. (c) Real data: validation against 92 067 RIPE Atlas
    RTT measurements from 450+ globally-distributed anchors spanning 2+ months of
    continuous collection. NOTE ON DATA PROVENANCE. Wall-clock detection-latency and
    bandwidth numbers in Section 10 are obtained from controlled benchmarks (scripts/benchmark_coherence_bfd.py).
    Real-data validation in Section 18 uses live Internet RTT measurements from RIPE
    Atlas to confirm that the theoretical bounds hold on operational paths. HARDWARE
    CAVEAT. The 55 ms median tau_detect is a SOFTWARE- HARNESS measurement, not a
    router-class measurement. Validation against real BFD hardware is identified as
    required future work before progression past Experimental status.</p>"

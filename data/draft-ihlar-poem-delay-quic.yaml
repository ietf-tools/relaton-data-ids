abstract:
- content: "<p>This document defines POEM Delay, a delay measurement companion to
    the Periodic On-path Explicit Measurement (POEM) protocol for QUIC. A delay sample
    packet, coalesced with ordinary QUIC packets, bounces between the endpoints. On-path
    observers timestamp it in each direction to measure the round-trip time and its
    components on either side of the observer. Each sample carries a coarse indication
    of how long the sending endpoint held it, so observers can largely exclude endpoint
    delay. A report packet lets observers tell endpoints how network delay is split
    between the two sides of the observer.</p>"

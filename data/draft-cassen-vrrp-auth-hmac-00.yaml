abstract:
- content: "<p>VRRP relies on a hop limit of 255 to prove that an advertisement came
    from the local link. That guard disappears when advertisements travel as unicast
    across a routed or overlay network, as is common in cloud deployments, which leaves
    the protocol open to off-segment injection and replay. The legacy VRRPv2 authentication
    types do not close this gap and were removed from later VRRP. This document defines
    an authentication extension that appends an HMAC-SHA256 trailer and a time-based
    sequence number to VRRP advertisements, giving origin authentication, integrity
    and replay protection for both unicast and multicast, independent of the VRRP
    version and IP address family.</p>"

abstract:
- content: "<p>Gravit Epistemic Verification Protocol (GEVP) defines minimal data
    types and APIs for autonomous agents and human-machine systems to achieve epistemic
    convergence without centralized truth arbiters. GEVP is transport-agnostic, blockchain-agnostic,
    and model-agnostic. This document defines a parameterized cost model where C_validation
    is the cost to verify a Claim's provenance and signatures, and C_manipulation
    is the estimated cost to forge a quorum of attestations under GQRVP. The protocol
    enforces the engineering invariant C_manipulation &gt; C_validation for all accepted
    Claims. This document was previously published as draft-gravit-vcp-00 and -01
    under the acronym VCP (Verifiable Convergence Protocol). To avoid collision with
    VeritasChain Protocol (VCP) defined in draft-kamimura- scitt-vcp [KAMIMURA-VCP],
    which is a SCITT profile for financial trading audit trails first published December
    2025, the acronym is changed to GEVP from -02 onward. The two protocols are unrelated
    and address different domains. The former VCP acronym is deprecated and MUST NOT
    be used for this protocol. This revision (-03) addresses minor editorial fixes
    on -02 for SCITT WG submission: removes workgroup tag to reflect Individual Internet-
    Draft status (IESG state I-D Exists, Stream None), normalizes Godel to ASCII for
    0 idnits warnings, updated date to 23 Jul 2026, no normative changes from -02
    Posted 22 Jul 19:27. This revision (-02) addressed feedback on -01: pins reproducible
    trace commits, provides full confusion matrix, clarifies heuristic estimates,
    defines exact SCITT mappings, and adds Appendix B on Godel boundary.</p>"

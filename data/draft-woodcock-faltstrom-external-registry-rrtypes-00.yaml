abstract:
- content: "<p>This document defines two DNS resource record types, UNECE and ISO,
    which convey numeric values paired with codes drawn from registries maintained
    by external standards organizations: the United Nations Economic Commission for
    Europe (UNECE) and the International Organization for Standardization. Neither
    proposed RRTYPE duplicates the external registries into IANA registries; each
    carries codes verbatim and uses the semantics defined by the external maintainer.
    The document specifies presentation and wire formats for both types, requests
    the assignment of two decimal RRTYPE identifiers under the Expert Review process
    of BCP 42, and suggests a common design pattern that may serve as a model for
    future RRTYPEs seeking to make external registries usable from the DNS without
    duplication.</p>"

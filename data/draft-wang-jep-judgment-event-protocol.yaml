abstract:
- content: "<p>This document defines the Judgment Event Protocol (JEP), a verifiable
    event format for judgment-related statements in human, organizational, software,
    and autonomous agent systems. JEP specifies four Core event verbs: Judgment (J),
    Delegation (D), Termination (T), and Verification (V). It defines a signed JSON
    event structure, stable event identity, signature verification over JSON Canonicalization
    Scheme (JCS) canonicalized payloads, a detached JSON Web Signature (JWS) baseline
    profile, signed-artifact hash and reference semantics, independent validation
    checks, idempotent acceptance semantics, structured validation results, extension
    handling, trust-profile interfaces, and determinability boundaries. JEP-Core does
    not mandate a replay-protection mechanism. An acceptance processor MUST apply
    the acceptance effect of a given Event Identity at most once within an acceptance
    domain. Profiles MAY impose additional freshness or replay requirements. JEP-Core
    does not determine the substantive truth, authority, legality, policy consequence,
    causality, or external effect of the statements it carries. It also does not require
    any specific credential, identity, AI platform, agent framework, transport, or
    blockchain system.</p>"

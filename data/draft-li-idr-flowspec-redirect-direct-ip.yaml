- content: "<p>A bit, D bit, is defined in the Flow-spec Redirect-to-IPv4 Extended
    Community, which is used by BGP Flow Specification to indicate that the associated
    Flow Specification policy be set to an invalid state when the directly connected
    link associated with the redirect target address becomes unavailable.</p>"

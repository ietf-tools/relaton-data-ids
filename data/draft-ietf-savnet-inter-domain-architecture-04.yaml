abstract:
- content: "<p>This document specifies an architecture for inter-domain source address
    validation (SAV). The architecture provides a common framework for collecting
    SAV-specific and SAV-related information from multiple sources, determining the
    legitimate incoming directions of source prefixes, and using this information
    to generate SAV table for inter-domain SAV. A SAV agent maintains the collected
    information in a SAV Information Base (SIB), and the SAV Information Base Manager
    (SIM) uses the available information to determine the corresponding prefix and
    legitimate incoming-direction mappings and generate or update the SAV table. This
    document also defines the architectural components and communication framework
    of inter-domain SAV, and discusses deployment, operation, convergence, manageability,
    security, and privacy considerations. It does not define a specific SAV protocol,
    protocol extension, or SAV table generation algorithm.</p>"

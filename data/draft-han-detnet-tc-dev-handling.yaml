abstract:
- content: "<p>Deterministic Networking (DetNet) relies on resource reservation to
    guarantee bounded-latency forwarding, yet traffic characteristic deviations from
    microbursts and flow aggregation frequently occur at aggregation nodes. Native
    handling approaches like direct packet discard or best-effort forwarding lead
    to severe service degradation. This document proposes an enhanced traffic characteristic
    deviation solution for DetNet. This solution specifies two complementary data-
    plane policies: the squeezing policy defers deviated traffic to subsequent timeslots
    within a configurable threshold while preserving deterministic attributes to absorb
    transient bursts; the degrading policy reclassifies over-threshold traffic to
    lower-priority queues for graceful handling, avoiding unnecessary packet loss.
    These policies can be enabled independently or combined, ensuring the preferential
    scheduling and preservation of deterministic service traffic under deviation conditions.</p>"

abstract:
- content: <p>JavaScript Object eXchange (JSOX) is a lightweight, text-based, language-independent
    data interchange format. It is derived from JSON and from the object literal syntax
    of the ECMAScript Programming Language Standard. Every well-formed JSON text is
    a well-formed JSOX text. JSOX extends JSON with unquoted identifiers, additional
    string quoting and escape forms, comments, additional number forms including dates
    and arbitrary-precision integers, binary typed arrays, user- defined types carried
    by a type tag, field-name macros that remove repeated keys from a document, and
    references that permit shared and cyclic structures to be encoded. This document
    defines the JSOX grammar and registers the media type "application/jsox".</p>

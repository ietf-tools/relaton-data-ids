abstract:
- content: "<p>This document describes a lightweight, event-driven simulation framework
    for IP-optical Network Digital Twins (NDTs). The framework investigates how optical
    and transport events propagate across network layers and interact with IP-layer
    protection, routing convergence, and traffic redistribution. The framework integrates
    three capabilities into a unified simulation process: dependency-aware event propagation,
    causal coordination of IP and optical behaviors on a common simulation timeline,
    and fidelity-aware evaluation of the resulting service impacts. Cross- layer dependency
    uncertainty and model limitations are explicitly considered to avoid unsupported
    resilience conclusions. The framework uses abstract optical and transport states
    rather than continuous optical propagation models. It reuses existing IETF topology
    and management information where applicable and supports reproducible what-if
    analysis, historical incident replay, and protection-strategy comparison. It does
    not define new network protocols or YANG modules, and simulation results are not
    directly applied to production networks.</p>"

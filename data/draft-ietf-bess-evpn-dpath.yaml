abstract:
- content: "<p>The BGP Domain PATH (D-PATH) attribute is defined for Inter-Subnet
    Forwarding (ISF) BGP Sub-Address Families that advertise IP prefixes or MAC addresses.
    D-PATH already applies to EVPN Route Type 2 when used for ISF, to EVPN Route Type
    5 (IP Prefix routes), and to IP-VPN routes. When used along with those routes,
    it identifies the domain(s) through which the routes have passed and that information
    can be used by the receiver BGP speakers to detect routing loops or influence
    the BGP best path selection. This document extends the use of D-PATH to EVPN Route
    Type 2 when not used for ISF, to EVPN Route Type 1 (Ethernet Auto-Discovery per-EVI)
    for EVPN VPWS, and to EVPN Route Type 3 (Inclusive Multicast Ethernet Tag routes).</p>"
  language:

abstract:
- content: "<p>RFC 9234 specifies how an AS receiving a route from a lateral Peer
    can check if a route was leaked, but doesn't specify any checks for routes received
    from a Route Server (RS). This makes the quality of filtering dependent on whether
    the RS implements RFC 9234. This document updates RFC 9234 by adding a complementary
    ingress check by an RS-Client.</p>"

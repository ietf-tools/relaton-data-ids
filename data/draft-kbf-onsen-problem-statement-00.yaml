abstract:
- content: "<p>The IETF has produced numerous YANG data models for automating the
    provisioning and delivery of network and connectivity services, including L2SM,
    L3SM, L2NM, L3NM, Attachment Circuits, and Network Slicing models. Despite their
    wide availability, operators report persistent challenges in operationalizing
    these abstractions in a consistent, scalable, and automatable manner. This document
    describes the problem space for the ONSEN Working Group, identifying the operational
    gaps and deficiencies in existing IETF service and network abstraction models
    that prevent effective end-to-end automation. The problems documented here are
    drawn from operator experience and from the findings of the IAB NEMOPS Workshop.
    This document does not propose solutions, protocols, or new data models.</p>"

abstract:
- content: "<p>RPC-with-TLS assumes that DNS-Based Authentication of Named Entities
    (DANE) is available on platforms where it is deployed, and recommends that a client
    operating under an opportunistic security policy check for a TLSA record before
    initiating an association, but does not say how. This document specifies the missing
    details, so that a TLSA record authenticates an RPC server with no certification
    authority trust anchor provisioned on the client. It updates RFC 9289.</p>"

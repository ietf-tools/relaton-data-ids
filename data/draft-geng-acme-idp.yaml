abstract:
- content: '<p>This document defines a Delegated Identity Control Validation (Delegated
    ICV) framework for the ACME protocol [RFC8555]. It addresses a core problem: how
    an ACME server can obtain proof that "the client controls the identifier" without
    directly validating the identifier. The solution is for an Identity Provider (IdP)
    to issue an identity assertion, acmeIdpToken, enabling the ACME server to delegate
    identifier control validation to a trusted IdP, with the CA validating the IdP''s
    assertion. The framework defines two trust models: PKI certificate binding (x509-chain),
    in which the CA pre-configures a trust anchor that anchors the IdP certificate;
    and dual-PoP public key binding (idp- pop), in which IdP static mapping and ACME-PoP
    are combined back-to- back. Implementations MUST support at least one model; they
    are not required to support both. The normative scope of this document is limited
    to dedicated trust environments or private CAs. Identity validation rules for
    publicly trusted certificates are defined by external rules; this document does
    not define, interpret, or replace those rules. This document composes orthogonally
    with [I-D.ietf-acme-pop]: the constrained ACME- PoP internalized by idp-pop is
    used only for identifier binding and does not replace the generic pop-01 authorization.</p>'

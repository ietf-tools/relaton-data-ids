abstract:
- content: "<p>This document defines a git commit trailer grammar for identity- attributed
    contributions using the ~handle identity primitive defined in the MCP DNS discovery
    draft. The grammar binds sovereign actors, automated bots, and AI instruments
    to specific commits via three tier-structured trailers (Acted-By, Executed-By,
    Drafted-With) and three optional cryptographic trailers (Identity-Signature, Identity-
    Key-Id, Identity-Anchor). The signature is computed with Ed25519 over the commit's
    patch identifier, the value git patch-id derives from the change the commit makes,
    under a fixed domain-separation prefix. It therefore attests the change and not
    the resulting tree or the commit hash. A commit that carries the same change keeps
    a verifying signature across rebase onto an unrelated base, cherry- pick, and
    message amendment. A merge commit carries no signature, and a squash is a new
    change signed by whoever squashed it. Conformant parsers reject cross-tier category
    errors (e.g., an Instrument-tier handle in an Acted-By slot) as malformed. The
    mechanism is provider-neutral, depends only on DNS and the ~handle resolution
    algorithm of that draft, and requires no central authority or platform-specific
    verification service.</p>"

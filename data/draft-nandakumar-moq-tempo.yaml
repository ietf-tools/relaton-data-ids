abstract:
- content: "<p>This document defines TEMPO (Timing Extension for Media Playout Orchestration),
    a synchronized playout mechanism for media tracks delivered over the Media over
    QUIC Transport (MoQT) protocol. The Original Publisher stamps each object with
    when it should be played out and when it was sent. Relays replace the send-time
    stamp with their own clock as they forward, giving each subscriber a fresh timing
    reference from its nearest relay. Subscribers use these timestamps to decide when
    to render each object, and report their sync state directly to a coordination
    server (PlaySyncServer) that can tell the media publisher to adjust timing when
    subscribers fall behind.</p>"

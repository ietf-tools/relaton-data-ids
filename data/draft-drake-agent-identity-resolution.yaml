abstract:
- content: "<p>The Agent Identity Registry System (AIRS) ([I-D.drake-agent-identity-registry])
    assigns a permanent canonical aid URN to the identity0 of an autonomous entity
    and maintains an authoritative record associated with that identifier. This document
    defines the read side of AIRS: how a Relying Party finds the authoritative resolution
    service, retrieves the public record, resolves a handle to the canonical identifier,
    and verifies a Registrar-issued credential presented for that identity. Discovery
    uses the DNS-based URN Dynamic Delegation Discovery System (DDDS) and lookup uses
    the Registration Data Access Protocol (RDAP). Credential verification reuses the
    OAuth 2.0 JWT access-token and sender-constraint profiles defined by the AIRS
    registry architecture; this document defines no new credential format and no generic
    direct device-proof protocol.</p>"

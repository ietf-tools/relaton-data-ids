abstract:
- content: "<p>This document proposes a two-layer reference architecture -- an Intent
    Extraction Layer and a pluggable Multi-Criteria Decision Layer -- for translating
    natural-language operator intent into network slice selection decisions, i.e.,
    ranking among multiple valid candidate configurations. Responding to research
    challenges identified by the NMRG on intent interpretation and on the misalignment
    between AI-internal metrics and network-management objectives, the architecture
    combines explicit handling of unresolved intent, plural independently derived
    decision methods with explicit agreement reporting, and human validation checkpoints.
    A motivating scenario from a prototype illustrates the class of failure the design
    targets. The architecture is proposed as vertical-agnostic; one instance has been
    prototyped for a Renewable Energy Community deployment and is validated in a companion
    study.</p>"

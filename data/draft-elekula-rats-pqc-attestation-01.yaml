abstract:
- content: "<p>The Remote ATtestation procedureS (RATS) architecture defines Evidence,
    Endorsements, Reference Values, and Attestation Results as distinct conceptual
    artifacts used by Attesters, Verifiers, Endorsers, and Relying Parties. The transition
    to post-quantum cryptography (PQC) raises questions about the protection, validation,
    transport, transformation, and retention of these artifacts. This document examines
    post-quantum cryptographic considerations across the lifecycle of RATS artifacts.
    It distinguishes post-quantum key establishment from artifact authentication and
    considers the security properties that must be evaluated independently: integrity,
    origin, signer authority, freshness, session context, provenance, appraisal, and
    authorization. The document introduces three analytical constructs: the Artifact
    Protection Matrix, the Provenance Continuity Chain, and the Cryptographic Transition
    Assessment. These constructs provide a structured way to identify artifact-specific
    protection requirements, evaluate transformations, and preserve the information
    needed for later cryptographic verification. The analysis also addresses algorithm
    selection, cryptographic agility, artifact size, bounded processing, transport
    considerations, replay resistance, long-term verifiability, interoperability,
    testing, and privacy. This document does not define a new cryptographic algorithm,
    RATS message, token format, transport protocol, TLS extension, key-establishment
    mechanism, or appraisal-policy language. It provides security analysis and implementation
    guidance within the existing RATS architecture and established cryptographic standards.</p>"

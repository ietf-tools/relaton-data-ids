abstract:
- content: "<p>RFC5926 creates a list of cryptographic algorithms that can be used
    with TCP-AO. This document expands that list, adding two Key Derivation Functions
    (KDFs) and two Message Authentication Code (MAC) Algorithms. They are called HKDF-SHA256,
    KMAC256-KDF, HMAC- SHA256-128, and KMAC256-128. The algorithms described by this
    document produce 128-bit (i.e., 16-byte) MACs. When 16-byte MACs are encoded in
    TCP-AO, the TCP-AO consumes 20 bytes. This does not challenge TCP's 40-byte option
    size limitation.</p>"

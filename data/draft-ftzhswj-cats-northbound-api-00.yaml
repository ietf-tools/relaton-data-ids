abstract:
- content: "<p>In scenarios such as industrial Internet, smart cities, and smart hospitals,
    enterprise customers lease a large amount of computing and network resources from
    operators and need to manage their own resources flexibly for agile business operations.
    Therefore, these customers’ systems require the Computing-Aware Traffic Steering
    (CATS) northbound interface (NBI) to gain greater flexibility in business optimization.
    The CATS NBI is a standardized set of interfaces that governs interactions between
    the CATS system and upper-layer applications, software, and services. It defines
    interaction protocols, data models, message formats, and procedures. Unlike the
    southbound interface, which carries detailed information, the NBI simplifies data
    structures to deliver streamlined management capabilities. Positioned between
    the three-layer CATS architecture and scenario-specific applications, it is primarily
    invoked by user management platforms, user business orchestration systems, AI
    inference platforms, and other application services. However, the current lack
    of a unified standard for the CATS NBI results in protocol heterogeneity, incompatible
    data formats, and inconsistent functionalities. This makes unified management
    and coordinated scheduling of multi-vendor, multi-domain CATS systems difficult,
    hindering large-scale deployment. A unified NBI specification is therefore urgently
    needed. This document defines the standard for the Computing-Aware Traffic Steering
    (CATS) Northbound Interface (NBI), specifying the interaction protocols, data
    models, message formats, and procedures between the CATS system and upper-layer
    management platforms and application services. As CATS technology may be adopted
    in future fields including the industrial Internet, Internet of Vehicles, and
    smart cities, enterprises and users require a concise, user-friendly, and comprehensive
    set of invocation interfaces. The core objective of the NBI is to enable standardized
    exposure of capabilities such as CATS resource query, traffic steering policy
    selection, metric subscription, and fault alarming, supporting unified management
    and coordinated scheduling of multi- vendor, multi-domain CATS systems. Based
    on the IETF CATS framework, metric definitions, and use case requirements documents,
    this document focuses on the specifications of NBI functions, protocols, and data
    models, providing a unified standard for CATS northbound interoperability.</p>"

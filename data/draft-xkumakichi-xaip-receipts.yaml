abstract:
- content: "<p>This document defines a wire format for signed execution receipts produced
    by AI agents when they invoke tools, services, or other agents. A receipt records
    the minimum facts needed to make a trust decision about a future call: who acted,
    who delegated, what tool was used, whether the call succeeded, how long it took,
    and how the call's inputs and outputs are identified (without disclosing their
    contents). A distinguishing property of the format is optional caller co- signature
    over the same canonical per-call record. When both signatures validate, the receipt
    cryptographically binds the identified Caller and Agent to the same canonical
    payload. This does not establish that either party independently observed every
    field, that the recorded execution was correct, or that the parties did not collude.
    A receipt may carry the Agent signature alone, and consumers may distinguish the
    two cases according to deployment policy. The format is intentionally tool-system-agnostic.
    The same receipt structure can be emitted by MCP (Model Context Protocol) servers,
    LangChain.js callback handlers, OpenAI tool-calling loops, HTTP clients, or proprietary
    agent runtimes. Receipts use Ed25519 signatures over a JCS-canonicalized payload,
    and identities are W3C Decentralized Identifiers (DIDs). This revision introduces
    an explicit wire-format version (formatVersion), pins the hash preimage profile,
    and ships executable conformance test vectors. Scoring policy, aggregation architecture,
    and reactive behavior in response to receipts are explicitly out of scope and
    left to deployments.</p>"

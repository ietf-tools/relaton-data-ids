abstract:
- content: <p>This specification defines mechanisms to improve cryptographic agility
    in OpenID Connect and OAuth 2.0 by enabling discovery and negotiation of JSON
    Web Token (JWT) signing algorithms between a client and an authorization server.
    It registers the authorization_server_jwt_signing_algorithms_supported metadata
    value in the IANA "OAuth Authorization Server Metadata" registry established by
    RFC 8414, and registers the jwt_signing_algorithm parameter in the IANA "OAuth
    Parameters" registry established by RFC 6749 for use in both authorization requests
    and jwks_uri retrieval requests.</p>

abstract:
- content: '<p>The rapid proliferation of autonomous AI agents across enterprise and
    Internet-scale deployments creates a structural challenge that existing agent
    frameworks cannot address: how to enable any agent to reach and invoke any other
    agent''s capabilities without pre- established bilateral integration, across organizational
    boundaries, at Internet scale. This document states the normative requirements
    for that problem. It prescribes no solution, no specific mechanism, no message
    format, and no assumption of centralized or distributed architecture. Its purpose
    is to establish a verifiable yardstick against which any claimed "intent routing"
    solution can be judged.</p>'

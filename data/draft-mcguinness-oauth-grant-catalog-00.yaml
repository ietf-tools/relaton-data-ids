abstract:
- content: "<p>This specification defines the OAuth Authorization Grant Catalog: an
    authenticated, relationship-specific description of the authorization grants that
    a Resource Authorization Server is prepared to accept from a Grant Issuer. A Grant
    Issuer is an authorization server, such as an identity provider, that issues grants
    for redemption at the Resource Authorization Server. For each eligible target
    tenant, a catalog describes the protected resources, scope values, authorization
    details types, claims, subject identifier formats, and grant binding methods that
    the Resource Authorization Server accepts. The Grant Issuer uses the catalog as
    input to the policy under which it issues grants; the catalog is not an authorization
    decision. The data model is independent of grant encoding and retrieval protocol.
    This specification applies it only to the Identity Assertion JWT Authorization
    Grant (ID-JAG), and defines an OAuth retrieval protocol that delivers the complete
    catalog in one response.</p>"

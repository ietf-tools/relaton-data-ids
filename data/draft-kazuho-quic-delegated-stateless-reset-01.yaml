abstract:
- content: "<p>This document specifies how a QUIC endpoint can delegate sending Stateless
    Resets to a component that outlives its connection state. It also defines a frame
    for clients using zero-length Connection IDs to advertise a Stateless Reset Token
    and a transport parameter for servers to indicate support for receiving the frame.</p>"

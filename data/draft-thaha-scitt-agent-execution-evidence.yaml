abstract:
- content: "<p>AI agents act through calls to models, tools and other agents. Identity
    work establishes who an agent is and what it may do, but leaves execution-evidence
    formats and assurance criteria out of scope. This document profiles the Supply
    Chain Integrity, Transparency, and Trust (SCITT) architecture for Signed Statements
    that bind an agent's registered identity, declared capabilities, risk-based assessment
    and supervised operational status to a hash- chained record of every call the
    agent makes. It also defines admission records produced where a call is received,
    and the linking of records for requests that pass between agents of different
    operators. It specifies Registration Policy, offline verification and Bundle requirements.
    It does not define an accreditation scheme, a universal risk classification, an
    identifier scheme or a policy language.</p>"

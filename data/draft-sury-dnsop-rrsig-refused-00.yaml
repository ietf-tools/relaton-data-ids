abstract:
- content: "<p>The Domain Name System (DNS) allows a query with QTYPE=RRSIG. Such
    a query has no useful answer. RRSIG resource records are meaningful only together
    with the resource records they cover, so a response can carry no more than an
    arbitrary subset of the signatures present at the query name. This document specifies
    that DNS responders refuse queries with QTYPE=RRSIG, and that DNS requestors do
    not send them. It supplies the guidance that [RFC8482] left unspecified.</p>"

abstract:
- content: "<p>Many per-packet load balancing mechanisms have been proposed to optimize
    the performance of AI networks. However, per-packet load balancing poses significant
    challenges to network stability assurance. This draft analyzes these challenges,
    as well as the ability requirements for stability guarantees in per-packet load
    balancing networks.</p>"

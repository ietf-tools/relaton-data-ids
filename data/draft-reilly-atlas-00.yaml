abstract:
- content: "<p>This document specifies Project Atlas, a backbone instrument in which
    a pipeline of autonomous software agents continuously holds a constellation of
    live web endpoints under measurement, attestation, and remediation, with every
    agent behavior conditioned and recorded under the Cognitive Behavioral Provenance
    and Integrity (CBPI) framework [I-D.reilly-cbpi]. Atlas defines eight agent roles
    (Resolver, Reachability, Integrity, Provenance, Conditioning Authority, Drift,
    Functional Behavior Assessment, and Sentinel), a hash-linked Operant Provenance
    Chain of epochs, hash-linked Reinforcement Event Records, a per-agent Behavioral
    Drift Index, and a dual authority model in which the instrument operates either
    fully autonomously or under human oversight through an operator decision queue.
    A live reference instrument implementing this document is deployed and publicly
    reachable.</p>"

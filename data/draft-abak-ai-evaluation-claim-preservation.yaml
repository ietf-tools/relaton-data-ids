abstract:
- content: "<p>AI evaluation records can pass through evaluation frameworks, exporters,
    evidence services, independent reviewers, and systems that make decisions. A conversion
    can retain a score while losing whether the measurement ran, which result was
    selected, whether a criterion existed, or which evidence was unavailable. Authenticating
    the converted record does not recover these distinctions. This document specifies
    format-neutral requirements for mapping profiles and consumers that exchange AI
    evaluation evidence. It separates source assertions, explicit derivations, and
    later policy judgments; requires claim-relevant loss and uncertainty to remain
    visible; and describes consumer behavior when preservation cannot be established.
    It includes synthetic counterexamples and guidance for composition with existing
    evidence mechanisms. It defines neither a wire format nor an evaluation benchmark,
    safety certification, authorization protocol, or new cryptographic envelope. A
    concrete mapping profile is needed for interoperable implementation.</p>"

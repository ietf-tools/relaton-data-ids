abstract:
- content: "<p>Computation is not authority to make an output effective. Social media
    platforms, search engines, advertising systems and recommendation engines decide
    what very large numbers of people see, in what order and how widely it spreads.
    During an election, a referendum or a declared emergency, an undisclosed or unapproved
    change to such an algorithm could change what voters see without any visible change
    in the content itself. Outside observers have no practical way to check which
    algorithm was actually running when a given output reached the public, and proprietary
    models cannot simply be opened to inspection. This document describes a technical
    architecture that verifies the algorithmic process and not the opinions expressed.
    A protected measurement step identifies the algorithm instance that is actually
    running and derives a fingerprint of its active configuration. The fingerprint
    is compared with an approved reference that applies to the protected period. An
    independent validator binds the verified algorithmic state to evidence about a
    specific pending output and issues a signed validation receipt. A separately scoped,
    non-bearer authorization may then allow an enforcement point to release the output.
    Before release, the enforcement point independently reconstructs the actual pending
    operation and checks the receipt, the authorization and its own protected state.
    If the running algorithm differs from the approved one, the output is withheld
    or routed through an explicitly authorized fallback. The document describes thirteen
    embodiments in detail: separation of organic speech from algorithmic amplification,
    dynamic extraction of the algorithm fingerprint, approved reference registers,
    server and edge enforcement, transitions into and out of election and emergency
    periods, correspondence between execution and output, coverage of alternative
    delivery routes, distributed execution reconstruction, device-side display enforcement,
    degraded-mode recovery, continuous drift detection, confidential verification,
    and atomic consumption of authorization. For each embodiment it states what the
    embodiment teaches, how it works, where its enforcement point sits, how it fails,
    and what it does not claim. A cross-reference table connects each embodiment to
    a public Zenodo record that summarizes the same disclosure. This document is an
    individual, informational technical proposal. It makes no allegation about any
    platform, party or election, it is not a legal opinion or a certification, and
    it does not claim that any law requires this architecture.</p>"

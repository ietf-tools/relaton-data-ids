abstract:
- content: "<p>This document specifies two complementary mechanisms for carrying the
    CATS Service Identifier (CS-ID) and network/computing requirement parameters in
    client service request packets within the Computing- Aware Traffic Steering (CATS)
    framework. Mode A uses IPv6 Extension Headers to carry CS-ID and requirement parameters
    as hop-by-hop or destination options, enabling in-band signaling that is visible
    to all CATS-aware network nodes along the path. Mode B uses a payload-based TLV
    structure that is transport- protocol agnostic and can be used with both IPv4
    and IPv6, as well as with encrypted transports. The document defines the Virtual
    Placeholder Address (VPA) prefix requirements, the CATS Service Request Extension
    Header (CSREH) format, the CATS Service Request TLV format, and the CATS_PACKET_IN
    process for handling these packets at ingress CATS-Forwarders.</p>"

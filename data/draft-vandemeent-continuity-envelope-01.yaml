abstract:
- content: "<p>This document defines the Continuity Envelope Protocol (CEP), a transport-agnostic
    protocol model for identity-bound messaging systems where delivery alone is not
    sufficient. CEP separates a visible envelope surface from sealed internal object
    truth and defines how receivers determine whether a delivered object may safely
    and legitimately continue. The protocol distinguishes between control-plane notification,
    data-plane object carriage, and decision-plane continuation handling. It further
    distinguishes a refused result from an absent one and from an unknown one, and
    requires that continuation decisions and refusals leave receipts. CEP is the umbrella
    model for companion drafts such as TIBET TAT, which specifies generic sealed handoff
    and transfer flow, and IDDrop, which profiles that handoff model for identity
    transfer.</p>"

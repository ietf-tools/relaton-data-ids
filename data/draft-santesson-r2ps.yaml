abstract:
- content: "<p>This document defines a generic service exchange protocol where service
    exchange data is protected and bound to a physical user using 1 or 2 factors (1FA
    and 2FA). The protocol facilitates registration and verification of either a knowledge-factor
    or a biometric factor in addition to a possession factor as means of achieving
    2 factor protection.</p>"

abstract:
- content: "<p>Start from the assumption that the attacker already controls the AI
    server — that the workload is fully compromised. Not the perimeter, not a phished
    seat — the workload itself: its credentials, its connectors, its context window,
    its output path. Nearly every enterprise control in use today has already failed
    by that point, because nearly every one of them is designed to keep the attacker
    out of the workload rather than to limit what the workload can do once it is theirs.
    Before anything else, the engineering posture: this architecture is specified
    for high-risk AI systems, where the standard priorities shift from speed and latency
    toward determinism, containment, and safety. It is written for billion-dollar
    enterprise and mission- critical deployments — banking and treasury, defence and
    national security, critical infrastructure, and regulated enterprises holding
    unreleased material — and not for general day-to-day, consumer-grade, or low-stakes
    use. It introduces evaluation on the join path and on the release path, and accepts
    that cost deliberately, because in these environments an unauthorized reconstruction
    or an unauthorized send is not recoverable by being fast. This document asks what
    is still denied to the attacker at that moment, and specifies an architecture
    in which two things are still denied: the attacker cannot cause independently
    held enterprise fragments to be bound into a map of the organization, and cannot
    cause any generated result to become externally effective. Access to a store is
    not authority to join it to another store. Finishing a generation is not authority
    to send it. The mechanism is Execution-Consequence Decoupling, enforced by three
    pillars: Decomposition of Authority (Technical Non-Joinability) across independently
    controlled identity, content, relationship- mapping, and cryptographic domains;
    Mandatory Mediation of every consequence-bearing Candidate Output; and Technical
    Non- Completability, so that computation can run to completion in a compromised
    environment without the ability to complete an external consequence. Reconstruction
    is governed by a non-bearer Reconstruction Authorization Object bound to attested
    execution context, session, purpose, and Permitted Association Scope. Candidate
    Outputs are sealed, re-verified at output time, and committed to a Protected Output
    Validation Receipt before an output- specific Release Capability can be issued
    and exercised at a designated Output Release Boundary. The industrially relevant
    systems are the enterprise assistant and agent runtimes now deployed into exactly
    those environments, including those built on Anthropic Claude, OpenAI ChatGPT,
    Google Gemini, xAI Grok, and self-hosted Meta Llama models, together with the
    connector and Model Context Protocol fleets attached to them. These are named
    as publicly described deployment classes, because an architecture for high-risk
    enterprise AI should say plainly which systems it is about; nothing here characterizes
    any vendor's internal design or security posture, and no vendor has reviewed or
    endorsed this work. It states the problem space, compares the architecture against
    representative conventional technologies (access control, bearer credentials,
    vaulting, TEEs, sandboxes, DLP, provenance, DRM, clean rooms, and information-flow
    control), gives a detailed technical description, and supplies JSON Schema definitions
    for the three protected objects. A published runnable reference implementation
    [GITHUB-DAS-VII] executes the protected chain described here, so the architecture
    can be run and tested rather than only read; it is an architectural reference
    for the state machine and its failure states, not a claim of production isolation.
    This is the architecture and rationale document. Its companion, draft-das-enterprise-ai-output-finality
    [I-D.das-enterprise-ai-output-finality], specifies the same split as a deployable
    protocol profile and metadata format for vendor assistant and agent seats. The
    two are read together: this document explains why authority must be separated
    from computation; the companion specifies the objects, bindings, and boundary
    sequences that carry the separation on the wire.</p>"

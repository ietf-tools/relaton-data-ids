abstract:
- content: "<p>The Computing-Aware Traffic Steering (CATS) framework defines the CATS
    Service Metric Agent (C-SMA) as the functional entity responsible for collecting
    service capabilities and status, and reporting them to CATS Path Selectors (C-PSes).
    While the framework and the CATS metric documents define the components and the
    metrics, the concrete observable behavior of the C-SMA - in particular, how it
    validates and sanitizes the metrics it collects, how it manages soft- state for
    stale or failing Service Contact Instances (SCIs), and how it synchronizes with
    the C-PS - remains underspecified. This document fills that gap. It specifies
    the functional behavior of the C-SMA in terms of observable behavior and reporting
    semantics: how the C-SMA collects metric reports from SCIs (as specified in [I-D.zhangb-cats-sci-implementation]);
    how it validates and sanitizes these reports to prevent erroneous or malicious
    data from influencing traffic steering; how it manages a local metric cache with
    soft-state aging; how it enforces local policies and update control policies;
    and how it synchronizes with the C-PS, including recovery and reconciliation.
    A decomposition of the C-SMA into internal functional components is provided as
    illustrative implementation guidance, not as a mandated software architecture.
    This document complements [RFC10053], [I-D.ietf-cats-metric-definition-13], [I-D.zhangb-cats-service-metrics-op],
    and [I-D.zhangb-cats-sci-implementation] by providing the operational execution
    layer for the C-SMA within the unified CATS architecture.</p>"

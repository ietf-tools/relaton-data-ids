abstract:
- content: "<p>This document specifies metric snapshot exchange between a Service
    Contact Instance (SCI) and a CATS Service Metric Agent (C-SMA). It defines atomic
    replacement, ordering, and validity for periodic full snapshots and change-triggered
    updates over HTTPS/JSON. An informative appendix explains how one shared snapshot
    YANG model can support generation of the publication and response messages.</p>"

abstract:
- content: "<p>RFC 9182 defines a YANG network data model for Layer 3 VPNs (L3NM),
    which provides a network-centric view of L3VPN services and is used by orchestrators
    to drive network controllers. A companion effort extends the L3VPN Service Model
    (L3SM, RFC 8299) with dynamic and enhanced service features, including dynamic
    networking provisioning, dynamic bandwidth adjustment, QoS enhancements for network
    slicing, performance monitoring, and quantum-safe encryption [I-D.fu-onsen-update-l3sm-service-models].
    At the network layer, such dynamic service requirements translate into time-scheduled
    resource reservations that the network confirms for feasibility and reserves in
    advance of the activation moment (Section 1.1). These enhanced service features
    cannot be realized by the network unless corresponding capabilities are exposed
    at the network layer. The base L3NM defined in RFC 9182 exhibits gaps in these
    areas. This document defines a set of YANG augmentations to the L3NM to close
    those gaps. The augmentations are designed to be backward-compatible and do not
    obsolete RFC 9182.</p>"

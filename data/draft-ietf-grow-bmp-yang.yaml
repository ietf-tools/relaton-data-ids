abstract:
- content: "<p>This document defines a YANG data model for the configuration and monitoring
    of the BGP Monitoring Protocol (BMP). The data model covers the base BMP protocol
    defined in [RFC7854] and includes support for the Loc-RIB extension defined in
    [RFC9069].</p>"

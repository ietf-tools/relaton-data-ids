abstract:
- content: "<p>This document defines Multi-Sheet Tab-Separated Values (MTSV), a text
    format that carries one or more sheets of tab-separated values in a single file.
    MTSV is TSV with one additional dimension: sheets are separated by the ASCII form
    feed (FF) character. A TSV file that contains no FF, and no CR other than in CRLF
    line breaks, is an MTSV file. This document also registers the text/prs.mtsv media
    type.</p>"

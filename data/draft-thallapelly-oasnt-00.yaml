abstract:
- content: "<p>This document defines the OASNT token, a compact JWS-based credential
    in which a hardware-bound device key attests that a specific human, on a device
    whose runtime integrity was assessed, authorized one specific action whose human-readable
    disclosure is cryptographically bound to the token (What You See Is What You Sign).
    Tokens are single-use, short-lived, and may additionally be bound to one concrete
    HTTP request.</p>"

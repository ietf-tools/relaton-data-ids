title:
- content: Deterministic Networking (DetNet) Data Plane - Tagged Cyclic Queuing and
    Forwarding (TCQF) for bounded latency with low jitter in large scale DetNets
  language:
  - en
  script:
  - Latn
  format: text/plain
docid:
- id: draft-ietf-detnet-tcqf
  type: Internet-Draft

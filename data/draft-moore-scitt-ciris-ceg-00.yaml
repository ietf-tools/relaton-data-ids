abstract:
- content: "<p>The CIRIS Epistemic Grammar (CEG) records claims between parties as
    signed rows. Each row is one JSON object, canonicalised with the JSON Canonicalization
    Scheme (JCS) and signed twice: once with Ed25519 and once with ML-DSA-65, where
    the ML-DSA-65 signature covers the canonical bytes followed by the Ed25519 signature.
    Every row has one of five types: a claim, a delegation, a replacement, a withdrawal,
    or a recantation. A node admits a row only after a fixed set of checks, and it
    refuses a failing row with a named reason. This document specifies the signed
    object, the signing input, the signature construction, and the admission checks,
    so that a second implementation can produce and verify the same bytes. It then
    describes how these rows relate to the roles of the SCITT architecture (RFC 9943),
    and where they differ from a SCITT Transparency Service. It defines no new SCITT
    mechanism and requests no IANA action.</p>"

abstract:
- content: "<p>This document specifies an experimental post-quantum cryptographic
    profile for DNP3 Secure Authentication version 5 (SAv5). It defines an ML-KEM-768
    and ML-DSA authentication exchange, HKDF-SHA-256 session keys, canonical DNP3
    application protocol data unit (APDU) encoding, transport segmentation, and HMAC-SHA-256
    protection of application messages. The APDU uses DNP3 application control, authentication
    function codes, response internal indications, and a length-delimited experimental
    authentication object. The reference implementation includes binary encoders and
    decoders, link CRC processing, transport reassembly, key confirmation, replay
    checks, and executable test vectors. The post-quantum object selector is a local
    experimental value, subject to allocation by the DNP3 standards owner; this document
    does not assign an IEEE or IEC algorithm or object variation.</p>"

abstract:
- content: "<p>This document presents a problem statement and gap analysis for ensuring
    and monitoring the security status of networks operating in complex environments,
    such as hybrid and multi-cloud systems. It identifies a missing capability: verifying
    the path and security properties of communications across multiple administrative
    domains while preserving each provider's confidentiality and local policy boundaries.
    The document also outlines, non-normatively, potential solution directions.</p>"

abstract:
- content: "<p>The Static Context Header Compression (SCHC) framework identified the
    need for a minimal transport encapsulation that provides Session multiplexing
    when extrinsic Discriminators are insufficient. This document specifies a Link
    Multiplexer (VOICI) that addresses those SCHC-driven requirements while remaining
    general enough to accommodate other compression mechanisms and uncompressed payloads.
    The encapsulation is designed for minimal overhead, reducing to 2 bytes in the
    common case, while supporting optional integrity protection and original EtherType/port
    recovery.</p>"

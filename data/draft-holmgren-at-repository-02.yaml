abstract:
- content: "<p>This document specifies a repository data structure for storage and
    transfer of public user data records as part of the Authenticated Transfer Protocol
    (ATP). It describes encoding formats for both individual data records and entire
    repositories. The repository data structure is content-addressable and cryptographically
    authenticated.</p>"

abstract:
- content: "<p>The Agent Transfer Protocol (AGTP) base specification verifies agent
    identity at the application layer: the Agent-ID header resolves to an issuer-signed
    Agent Identity Document, and a per-request Request- Signature proves possession
    of the key that document names. That verification runs per request and needs the
    document. This document specifies the AGTP Agent Certificate Extension: an optional
    mechanism that binds the Canonical Agent-ID, the recorded owner, and the Authority-Scope
    commitment to an X.509 v3 certificate presented during TLS mutual authentication,
    so that the same verification is made once at the handshake and infrastructure
    components including Scope-Enforcement Points (SEPs), load balancers, and governance
    gateways can enforce authority scope without application-layer access, at O(1)
    cost per request. The extension also defines session-level revocation propagation
    via AGTP NOTIFY broadcast and records certificate issuance and revocation in the
    AGTP transparency log. Note: Certain mechanisms described in this document may
    be subject to pending patent applications by the author. The licensor is prepared
    to grant a royalty-free license to implementers consistent with the IETF's IPR
    framework. See Section 9.4.</p>"

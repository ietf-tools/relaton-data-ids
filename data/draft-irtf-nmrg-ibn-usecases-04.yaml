abstract:
- content: "<p>This document proposes a methodology to construct an Intent-Based Networking
    (IBN) system. According to this methodogy, it decribes several use cases of IBN.
    The methodology for the IBN system includes data collection for system awareness
    in the IBN system and then the construction of the IBN system. This construction
    consists of intent translation, policy translation, policy verification, policy
    deployment, policy monitoring, policy validation, policy optimization, and intent
    report. In addition, practices are also summarized to instruct the construction
    of next generation network management systems with the integration of IBN techniques.
    Finally, this document discusses three aspects for the deployment of the IBN system
    on the real world. They are Multi-Domain Dichotomy for IBN, the Integration of
    IBN and Network Digital Twin (NDT), and IBN with Artificial Intelligence (AI).</p>"

abstract:
- content: "<p>This document describes a set of end-to-end tests that exercise a Media
    over QUIC Transport (MOQT) relay through real client sessions. For each test it
    gives a short description, the inputs, the message flow as a call-flow diagram,
    and the expected outcome. The tests apply to MOQT draft-18 and later; results
    for several public relays are published in the moq-web interop report.</p>"

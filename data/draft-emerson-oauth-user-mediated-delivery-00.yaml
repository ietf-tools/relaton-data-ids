abstract:
- content: "<p>This document proposes user-mediated credential delivery as a complementary
    authorization primitive for AI agent frameworks. Rather than delivering credentials
    through automated channels controlled by the agent or its platform, user-mediated
    delivery places the authorization decision and credential delivery in the user's
    trusted context, separate from the agent's execution environment. This document
    describes four methods: user-mediated credential delivery, self-describing connection
    credentials, caller-identity consent differentiation, and discovery-by-introspection.
    These methods address the human-in-the-loop gap identified in Section 9.7 of [KLRC]
    and strengthen the authorization foundation that the IETF AI Agent Authentication
    and Authorization framework depends on. The methods described in this document
    are patent pending.</p>"

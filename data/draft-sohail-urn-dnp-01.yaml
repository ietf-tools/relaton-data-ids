abstract:
- content: <p>This document describes a Uniform Resource Name (URN) namespace for
    persistent, location-independent identification of normative and authoritative
    publications issued under the Digital Nation Pakistan (DNP) programme by the Pakistan
    Digital Authority (PDA), a federal statutory body of the Government of Pakistan
    established under the Digital Nation Pakistan Act, 2025. The namespace covers
    policies, frameworks, technical standards, reference architectures, specifications,
    schemas, application programming interface contracts, registries and datasets
    that PDA issues or is statutorily designated to maintain. This document requests
    registration of the formal Namespace Identifier "dnp" in accordance with RFC 8141.</p>

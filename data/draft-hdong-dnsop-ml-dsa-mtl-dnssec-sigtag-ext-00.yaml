abstract:
- content: "<p>This document describes a mechanism to reduce post-quantum cryptographic
    (PQC) network transmission overhead when using Merkle Tree Ladders (MTL) in DNS
    Security Extensions (DNSSEC). This document refers to this as SigTag and describes
    the use of EDNS(0) to enable its use. SigTag allows a client to indicate its knowledge
    of a specific MTL ladder. The DNS server can then use this signal to determine
    if it can omit the full underlying signature in its response, thereby reducing
    the message payload.</p>"

abstract:
- content: "<p>The Resource Public Key Infrastructure (RPKI) to Router Protocol (RTR)
    enables routers to receive validated RPKI data from Relying Parties (RPs). This
    document defines a push mode extension for RTR that allows RPs to proactively
    push RPKI data updates to routers, either periodically or event-driven.</p>"

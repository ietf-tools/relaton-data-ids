abstract:
- content: "<p>This document defines a verifier-side acceptance profile for session-
    bound Agent identity. It addresses context diversion, where cryptographically
    valid material is accepted for a different service, tenant, Agent, task, delegation,
    or authority boundary than the verifier intended. A verifier accepts an Agent
    only when a verified authority grant, holder-of-key proof, accepted TLS or exported-authenticator
    session, freshness and replay state, any required attestation result, and verifier-local
    policy all describe the same intended interaction. Protocol-specific wire formats
    and deployment choices are left to binding profiles.</p>"

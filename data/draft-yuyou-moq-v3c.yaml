abstract:
- content: "<p>This document specifies a mapping and packaging for transporting ISO/
    IEC 23090-5 Visual Volumetric Video-based Coding (V3C) bitstreams over Media over
    QUIC Transport (MOQT). The mapping uses the MOQT Streaming Format (MSF): V3C configuration
    is MSF initialization data, each independently consumable V3C component is an
    MSF track, a V3C composition unit is a MOQT Group, and a coded V3C unit is a MOQT
    Object. Relays remain unaware of V3C syntax. V3C knowledge is confined to the
    streaming-format layer.</p>"

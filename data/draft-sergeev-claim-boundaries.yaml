abstract:
- content: "<p>Systems that act in the world produce logs, receipts, approvals, traces,
    attestations, provenance statements, and transparency records. These artifacts
    are routinely offered as evidence that an action was authorized, performed, or
    completed. This document states a discipline for bounding such claims: the strength
    of an execution- related claim is limited by what the available evidence actually
    observed, constitutes, or proves, and by the control and observation topology
    at the boundary that produced it. Message formats, signature validity, receipt
    validity, and registration do not create observation or independence that did
    not exist. No message format can supply the independent enforcement or observation
    dependencies that a prevention or adversary-resistant detection-coverage guarantee
    requires. An appendix works through a scenario in which one party creates another
    and may be able to act in its name. The document defines no protocol, no record
    format, and no registry. It collects non-inference rules, a control-topology test
    for prevention and detection claims, a worked example, and reporting distinctions
    for evidence that does not support the claim asserted over it.</p>"

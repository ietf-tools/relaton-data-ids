abstract:
- content: "<p>This document defines an extension to BGP Link-State (BGP-LS) for the
    advertisement of the Differentiated Services (DiffServ) Per-Hop Behavior (PHB)
    that is bound to a Segment Routing (SR) Policy candidate path. It introduces a
    new descriptor TLV carried in the SR Policy Candidate Path NLRI defined in [RFC9857].
    This TLV reports the SR Policy candidate path to PHB binding that is actually
    installed in the data plane by a headend node. This document complements the control-plane
    signaling which conveys the desired PHB binding, by enabling the management or
    control plane to observe the actual PHB binding.</p>"

abstract:
- content: "<p>The Correctover Conformance Shape (CCS) defines a tamper-evident receipt
    schema and a set of cryptographic bindings that together constitute a verifiable
    conformance record for an agent runtime's decision to permit, deny, or escalate
    a tool invocation. CCS is designed as a one-receipt-per-invocation object that
    can be consumed by an executor-side Action Evidence Boundary (AEB), providing
    the request_hash, response_hash, runtime_context_hash, action binding, params_hash
    binding, issuer, audience, nonce/sequence, freshness, and config_hash fields that
    the AEB processing model requires as native inputs. This document specifies the
    CCS Receipt Schema, the Canonical Configuration model, the nine binding mechanisms,
    key management, transport requirements, verifier source classification, conformance
    levels, and negative test cases. It is intended to enable a reader such as the
    author of the Action Evidence Boundary specification to evaluate whether and how
    a CCS receipt can be mapped into an Authorization Evidence Chain (AEC) component.</p>"

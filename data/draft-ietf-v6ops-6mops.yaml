abstract:
- content: <p>This document discusses a deployment scenario called "an IPv6-mostly
    network", when IPv6-only and IPv4-enabled endpoints coexist on the same network
    (e.g. local area network (LAN) etc). This approach enables incremental transition
    from dual-stack to IPv6-only networks by allowing IPv6-capable devices to remain
    IPv6-only while the network is seamlessly supplying IPv4 addresses to those devices
    that require them. This document discusses the requirements, recommendations,
    and challenges associated with deploying IPv6-mostly networks in enterprise and
    public Wi-Fi environments.</p>

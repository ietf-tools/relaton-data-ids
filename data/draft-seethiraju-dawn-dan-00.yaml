abstract:
- content: "<p>The agentic AI ecosystem includes many different technologies and operations.
    One important aspect is the ability to establish connections between AI agents.
    In single-platform approaches, the processes and metadata with which AI agents
    discover, locate, and connect to each other are typically managed by their common
    platform. This document describes an inter-domain mechanism to enable AI agents
    to locate and connect to each other using necessary metadata and secure DNS associations,
    in a similar fashion to the way that DNS- Based Authentication of Named Entities
    (DANE), RFC6698, does for Transport Layer Security. This is accomplished through
    two new Resource Record (RR) types: AIDISCA and AIINDEX.</p>"

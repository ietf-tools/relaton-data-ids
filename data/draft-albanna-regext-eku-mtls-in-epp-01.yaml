abstract:
- content: "<p>This document describes the state of the Mutual Transport Layer Security
    (mTLS) client authentication mechanism in the Extensible Provisioning Protocol
    (EPP) with respect to a recent change in the client certificates published by
    some Certificate Authorities (CAs). The issue is described and options are presented
    to address the operational impact of the change.</p>"

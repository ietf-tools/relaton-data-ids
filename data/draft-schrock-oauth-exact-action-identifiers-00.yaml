abstract:
- content: "<p>This document defines an action_id member for OAuth Rich Authorization
    Requests authorization details types that explicitly adopt it. The member carries
    a scheme-qualified identifier of an action description. A resource server derives
    an identifier from the operation it is about to perform and compares it with the
    identifier in the granted authorization details. The document requests a registry
    of exact-action identifier schemes and an initial entry for version 1 of the Canonical
    Action Identifier. It specifies authorization server processing, resource server
    comparison, and discovery metadata without choosing a universal action vocabulary
    or digest construction. Identifier equality is an additional condition on authorization;
    it does not establish permission, a single-use grant, execution, or the truth
    of externally supplied action data.</p>"

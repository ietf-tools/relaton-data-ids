abstract:
- content: "<p>This document defines a mechanism for temporal anchoring of digital
    artifacts by committing cryptographic hashes to the Bitcoin blockchain via the
    OpenTimestamps protocol [OTS]. The resulting proof is independently verifiable
    by any party with access to Bitcoin block headers, without reliance on a trusted
    third party. The SCITT Architecture [RFC9943] is used as the primary integration
    example. No changes to the SCITT architecture are required.</p>"

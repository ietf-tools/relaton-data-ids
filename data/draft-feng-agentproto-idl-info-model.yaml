abstract:
- content: '<p>This document defines the information model for IDL (Intent Description
    Language), a protocol-independent semantic model for communication among autonomous
    AI agents and between agents and tools. Autonomous agents are fundamentally different.
    An agent possesses its own reasoning, may negotiate parameters, may refuse or
    modify requests, and may initiate interactions on its own behalf. Describing an
    agent as if it were a deterministic endpoint loses exactly the properties that
    make it an agent. IDL answers: "what can this autonomous participant contribute
    to an intent, under what constraints, and through what interaction patterns?"
    IDL is not a transport, session, discovery, or messaging protocol. It is a semantic
    model that enables heterogeneous agents to describe identity, capabilities, autonomy
    boundaries, context requirements, governance interfaces, and intent participation
    before and during collaboration. This document defines the IDL information model
    and its relationship to agent communication protocols and governance frameworks.
    It does not define a normative JSON representation or a serialization-level conformance
    language. Protocol-specific mappings, including an AIN/ CDL profile, are informative.</p>'

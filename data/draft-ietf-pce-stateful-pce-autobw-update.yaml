id: draft-ietf-pce-stateful-pce-autobw-update
title:
- content: Update to the Automatic Bandwidth Adjustment Procedure for MPLS-TE and
    SR-TE LSPs with a Stateful PCE
  language:
  - en
  script:
  - Latn
  format: text/plain
docid:
- id: draft-ietf-pce-stateful-pce-autobw-update
  type: Internet-Draft
  primary: true
abstract:
- content: "<p>Extensions for the stateful PCE model enable control of Traffic Engineering
    (TE) LSPs using the Path Computation Element Communication Protocol (PCEP) for
    RSVP-TE and Segment Routing (SR), for both PCE-initiated and PCC-initiated LSPs.
    RFC 8733 defines PCEP extensions for automatically adjusting bandwidth on MPLS-TE
    Label Switched Paths (LSPs) using a stateful PCE. It also defines the AUTO-BANDWIDTH-ATTRIBUTES
    TLV and a set of sub-TLVs for the attributes. A sub-TLV is included when its value
    differs from the value last sent in a PCEP message. However, RFC 8733 lacks a
    mechanism to explicitly remove an attribute identified by a sub-TLV. This document
    updates RFC 8733 by defining such a mechanism. In addition, this document applies
    the PCEP extensions for automatic bandwidth adjustment to SR-TE LSPs in both the
    MPLS (SR-MPLS) and IPv6 (SRv6) data planes. It also extends automatic bandwidth
    adjustment to multiple Segment Lists in an SR LSP using the extensions defined
    in draft-ietf-pce-multipath.</p>"

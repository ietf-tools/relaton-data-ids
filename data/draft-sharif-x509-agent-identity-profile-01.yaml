abstract:
- content: "<p>This document defines an X.509 certificate profile for identifying
    autonomous AI agents. It specifies a new X.509v3 extension, AgentIdentity, that
    encodes agent-specific metadata within a standard X.509 certificate, including
    agent trust level, operational capabilities, delegation constraints, owner attribution,
    and revocation control endpoints. The profile enables certificate authorities
    (CAs) to issue interoperable agent identity certificates that any relying party
    can parse, validate, and enforce, regardless of the issuing CA or the platform
    that provisioned the agent. The design builds on existing PKI infrastructure (RFC
    5280), SPIFFE Verifiable Identity Documents (SPIFFE SVIDs), and the MCPS cryptographic
    signing layer (draft-sharif-mcps-secure-mcp). It does not require changes to X.509v3
    certificate parsing or to existing CA issuance pipelines beyond supporting a new
    non-critical extension.</p>"

abstract:
- content: "<p>The IP Flow Information Export (IPFIX) protocol provides a means for
    transmitting Traffic Flow information over the network. IPFIX Flow Records and
    Template Records can be carried over a number of transport protocols from an IPFIX
    Exporter to an IPFIX Collector. The supported transport protocols are SCTP, UDP
    and TCP. QUIC provides inherently secure, stream-multiplexed, and reliable connections
    for IPFIX protocol. Especially, a single QUIC connection can carry multiple independent
    streams, which can improve management scalability between Exporters and Collectors.
    This document describes how to use IPFIX protocol over the QUIC transport protocol,
    named IPFIXoQUIC.</p>"

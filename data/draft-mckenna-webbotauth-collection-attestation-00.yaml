abstract:
- content: "<p>Anonymous Bot Authentication lets a web site learn that an automated
    client holds a credential from an Anchor whose policies it accepts, without learning
    which client it is. This document describes web data collection use cases that
    need that property, and what they require of the evidence an Anchor evaluates,
    of what a site can verify about conduct it cannot attribute, and of what a buyer
    of collected data needs to see. It proposes a tiered model. Collectors register
    signed statements of their own conduct in a SCITT Transparency Service; the site,
    its security intermediary, or a network intermediary may corroborate them; and
    an Anchor acting as a certifying body may appraise them. Coarse, unlinkable attributes
    about the data's eventual recipient let a site restrict use by category of recipient
    without learning who the recipient is.</p>"

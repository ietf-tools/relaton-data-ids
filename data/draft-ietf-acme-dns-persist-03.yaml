abstract:
- content: <p>This document specifies "dns-persist-01", an Automated Certificate Management
    Environment (ACME) challenge that verifies domain or IP address control using
    a persistent DNS TXT record. The record identifies a certification authority (CA)
    and binds validation to an ACME account. It can be published before certificate
    requests and reused without per-request DNS changes, including when different
    parties perform DNS publication and ACME operation. Use under a certificate policy
    or trust program remains subject to that policy's requirements.</p>

abstract:
- content: "<p>This document maps protocol-verification evidence and the WIVL assurance-stage
    model onto the RATS architecture. It defines appraisal requirements for SPEC_VALIDATED,
    LOCAL_CONFORMANT, INDEPENDENTLY_REPRODUCED, and SECURITY_TESTED results while
    preserving unknown evidence and requiring arithmetic preconditions for mathematical
    test vectors. An attestation result reports bounded assurance; it is not an authorization
    grant or production-release decision.</p>"

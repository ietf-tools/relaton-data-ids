abstract:
- content: "<p>Agent auditing relies on distributed enforcement points (EPs) to observe
    and intervene in agent activities. This document analyzes Agent, Gateway, and
    Host EPs by detailing their coverage and audit data. This provides a basis for
    understanding the capabilities of different EPs and evaluating overall audit evidence
    coverage.</p>"

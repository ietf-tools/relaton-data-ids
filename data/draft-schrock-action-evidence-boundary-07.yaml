abstract:
- content: "<p>Consequential agent actions can cross identity, transport, authorization,
    policy, and execution systems. Each system can produce a valid artifact while
    the executor still lacks a safe rule for joining the artifacts to the exact effect,
    consuming one-time authority, and handling an uncertain outcome. This document
    defines the Action Evidence Boundary (AEB), an executor-side processing model
    for that lifecycle. AEB requires native artifact verification, exact-action binding,
    a relying-party authorization decision, durable atomic consumption or reservation,
    provider entry, closed effect outcomes, and authenticated reconciliation. One
    grant of native authority is identified by a relying-party-pinned authority namespace,
    which defaults to its issuer, and its native authorization identifier, so rewrapping
    or relabelling the grant cannot make it spendable twice. A durable same-action
    fence refuses a new attempt for an action whose earlier attempt is still in flight
    or uncertain, whatever evidence path admits it and even when fresh authority is
    presented. An attempt that stopped before provider entry is released only with
    proof that it never entered. AEB also specifies what a gateway attests, and what
    the boundary verifies, when a native authorization result is handed to a separate
    effect boundary. Canonical Action Identifier (CAID) matching is used when independently
    encoded native representations must be joined. Authorization Evidence Chain (AEC)
    evaluation is used when local policy requires multiple evidence legs. A native
    authorization decision accepted and enforced by the effect- owning policy enforcement
    point (PEP) does not require a second policy decision point (PDP). AEB defines
    no receipt or token format, no policy language, no universal evidence taxonomy,
    and no new registry. Native workload credentials, OAuth artifacts, AuthZEN decisions,
    Agent Payments Protocol (AP2) mandates, message signatures, permits, authorization
    receipts, and status mechanisms retain their own semantics and, where the native
    protocol defines one, their own verifiers.</p>"

abstract:
- content: "<p>OAuth 2.0 access tokens are typically scoped to a session rather than
    to a transaction. They carry no transaction identifier and no context beyond scope.
    This document defines Transactional Access Tokens: a profile of JSON Web Token
    (JWT) access tokens that carries a transaction identifier and authorization server-asserted
    transaction context, has a very short lifetime, and is audienced to a single resource
    server. Transactional Access Tokens align with the claims and semantics of OAuth
    Transaction Tokens, so that transaction context can flow from the authorization
    server to a resource server and onward into that resource server's trust domain.
    A primary use case is task-scoped authorization of AI agents, where the authorization
    server makes a fresh policy decision for each transaction.</p>"

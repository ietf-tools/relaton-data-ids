abstract:
- content: "<p>This document defines the Lightspeed Notification Protocol (LSN), a
    hardware-accelerated signaling mechanism designed for sub-100 microsecond network
    convergence in AI/ML data center fabrics. By remaining on chip and never punting
    to the host CPU, LSN bypasses traditional CPU-based latencies to propagate link
    failures and congestion via a hardware-efficient encoding. It serves as a high-
    speed complement to routing protocols such as BGP, providing an immediate hardware
    veto that prunes failed or congested paths while maintaining control-plane stability
    for path recovery. The same mechanism applies inside the DC Clos and, in some
    deployments, across the Data Center Interconnect (DCI) and WAN. This document
    defines two encoding modes: a dense encoding for DC fabrics, where traffic is
    load-balanced over many ECMP spines, and a sparse encoding for the DCI and WAN.</p>"

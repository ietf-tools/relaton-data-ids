abstract:
- content: "<p>Controller Area Network (CAN) is a fieldbus initially designed for
    automotive applications. It has since been adopted for use in various industrial
    applications, such as CANopen and building automation systems. CAN operates as
    a multi-master bus with frame identifiers of 11 bits or 29 bits. The CAN standard,
    defined in the ISO 11898 series, specifies both the physical and data-link layers.
    This document describes how to transfer IPv6 packets over CAN using ISO-TP, a
    dedicated addressing scheme for CAN nodes, and IP header compression (IPHC).</p>"

abstract:
- content: "<p>This document specifies an interoperable HTTP protocol for automated
    clients, including conventional web crawlers and AI-assisted agents, to request
    access to a resource, receive a transaction-specific offer, accept the offer,
    and obtain a cryptographically verifiable authorization for a particular request.
    Resource owners can perform authorization directly or delegate it to independent
    rights managers of any size. A rights manager determines the price and other conditions
    at the time of each request; this protocol does not expose or constrain pricing
    algorithms, payment rails, credit limits, invoicing schedules, or business relationships.
    The protocol binds an authorization to a request UUID, resource, authenticated
    crawler operator, intended use, and validity interval. It is designed as an optional
    extension to the proposed Universal Crawler Accountability Protocol (UCAP) and
    to existing HTTP authentication and bot identity mechanisms. The specification
    does not replace access controls, copyright law, or private commercial agreements.</p>"

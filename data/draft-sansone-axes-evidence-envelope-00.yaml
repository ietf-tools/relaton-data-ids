abstract:
- content: "<p>This document describes AXES, a public working draft for recording
    evidence of autonomous execution, that is, actions taken by software agents under
    delegated authority. It specifies the parts of AXES that are settled: a canonical
    byte form and hash scope for the evidence record (the Standards Envelope), a hash
    chain over a declared stream, a block for external anchoring of digests with earned
    rather than asserted strength, a four-state result vocabulary for verification,
    and requirement profiles that a relying party applies to evidence to produce a
    deterministic evaluation record. The byte rules, the hash chain and the release
    anchors have been reproduced independently from the text; profile evaluation has
    a reference implementation. The design keeps evidence, interpretation and enforcement
    apart, and requires that the absence of evidence be reported as absence rather
    than read as a pass. AXES is offered as one input format to format-neutral audit
    readers, not as a replacement for other record formats. Parts of AXES that are
    not yet settled, including the full envelope schema and the exact construction
    for redaction-tolerant hashing, are named as open issues. The chosen direction
    for redaction, salted per-field hash commitments following the approach of SD-JWT
    with an encoding specific to AXES, is recorded.</p>"

abstract:
- content: "<p>Automated systems, including AI models and AI agents, increasingly
    make decisions and take actions that affect people, money and data. Emerging work
    on agent identity answers which agent made a request and whether it was authorised.
    It does not give the parties involved a portable, independently checkable record
    of what was decided. This document defines AI-Decision-Receipt, an HTTP response
    header field that carries a compact receipt for a governed automated decision:
    the outcome, a fingerprint of the exact request the decision was made on, the
    position and hash of the record in the issuer's tamper-evident log, and a location
    where anyone can verify that record without trusting the issuer. The field uses
    the Structured Field Values for HTTP Dictionary type.</p>"

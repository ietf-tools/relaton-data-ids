abstract:
- content: "<p>This document updates RFC 6724 with three improvements to IPv6 destination
    address selection. The updates allow recent IPv6 connection or service failures
    to influence IPv6/IPv4 ordering, incorporate likely source/destination address
    pairs when sorting candidates, and let ISP and enterprise operators preserve DNS
    load- balancing order where Rule 9 would otherwise override it. The updates are
    intended to be implementable inside getaddrinfo() or an equivalent system mechanism,
    without requiring changes to existing application-facing socket APIs.</p>"

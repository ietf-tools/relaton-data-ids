abstract:
- content: "<p>This document defines the PortableWeb format, a file format for packaging
    interactive web content — including HTML, CSS, JavaScript, and associated media
    — into a single self-contained, portable bundle. A PortableWeb bundle (.pweb file)
    can be saved, shared, and rendered by a compatible viewer application on any platform,
    entirely offline, without a web server, without association with a Web origin,
    and without being confined to a web browser. This specification defines the container
    format and manifest schema for PortableWeb bundles at version 0.1. Companion specifications
    covering the runtime sandbox, storage model, signing, and inter- bundle communication
    are forthcoming.</p>"

abstract:
- content: "<p>This document defines a binding between Verified Commerce for Agent
    Protocols (VCAP) and the Agent Payments Protocol (AP2). AP2 supplies agent-commerce
    authorization evidence through IntentMandate, CartMandate, and PaymentMandate
    artifacts. VCAP supplies delivery verification, settlement evidence, escrow directives,
    timeout handling, and dispute handoff. This revision deliberately does not model
    AP2 as an escrow or settlement state machine. Current AP2 positions itself as
    an authorization and security layer used within a surrounding commerce protocol,
    including Universal Commerce Protocol (UCP). Accordingly, this binding references
    AP2 mandates by cryptographic digest or opaque identifier and leaves payment capture,
    refund, and settlement transitions to the commerce protocol and payment rail.</p>"

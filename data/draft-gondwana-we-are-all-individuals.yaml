abstract:
- content: "<p>Participation in the IETF is by individuals. This document makes that
    principle concrete for an environment in which software agents can produce and
    submit text. Each Datatracker account belongs to one human who has acknowledged
    the Note Well. Every IETF Contribution is vouched for by one human who is accountable
    for it. Anonymous Contributions are not accepted, and no human may use more than
    one identity in the same piece of work. Reading the IETF's work remains open to
    everyone, with no account or identification required.</p>"

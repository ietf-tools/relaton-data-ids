abstract:
- content: "<p>Fine grain Optical Transport Network (fgOTN) is a data plane technology,
    specified in ITU-T Recommendation G.709/Y.1331 (2020) Amd. 3, which complements
    existing OTN by providing bandwidth efficient support for sub-1Gbit/s services.
    This document defines YANG data models to describe the topology and tunnel information
    of an fgOTN network.</p>"

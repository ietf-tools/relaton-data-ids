abstract:
- content: "<p>The draft presents _symbolic_ and _computational_ analysis of hybrid
    key exchange and standalone ML-KEM. In our observation, we believe that hybrid
    key exchange is preferable over standalone ML-KEM until a powerful CRQC exists
    which breaks *all* the bits of pre-quantum. This draft also offers opinions of
    the IETF participants and some preliminary discussion to help the developers and
    policymakers make informed choices. Finally, it offers minimal implementation
    guidance for hybrids.</p>"

abstract:
- content: "<p>Navigation QR codes carrying absolute HTTP or HTTPS URIs initiate web
    interactions, including payment, ordering, and institutional workflows. Selected
    deployed scanners decode and hand off those URIs without an interoperable account
    of whether the navigation is authorized. This document defines an Informational
    architecture and candidate decision- semantics surface based on trust residuals:
    typed, evidence-bearing deviations between a scanned artifact and issuer-chain,
    destination- policy, redirect-flow, runtime-safety, freshness, and artifact-integrity
    constraints. Given a residual vector and a declared verification profile, explicit
    precedence rules map the result to a bounded set of scanner decision states. Security
    invariants prevent reputation, HTTPS transport, or runtime-safety signals from
    upgrading an otherwise untrusted issuer path. This document does not define a
    payload carrier or a final wire format for signed governance objects; those belong
    in a future binding specification.</p>"

abstract:
- content: "<p>This document specifies a data model for synchronizing task data with
    a server using JMAP. Clients can use this to efficiently read, write, and share
    task lists, receive push notifications for changes or task reminders, and keep
    track of changes made by others in a multi-user environment.</p>"

abstract:
- content: '<p>Discussions about agent protocols are frequently muddied by overloaded
    terms; asks such as "we need a session protocol" or "we need cross-domain support"
    bundle several distinct concerns across transport, agent protocol, and orchestration
    layers. This document offers a dimensional model that routes each concern to its
    proper layer. The document defines a small set of protocol-visible dimensions
    for characterizing AI agent protocol interactions and applies them to representative
    agentic protocol proposals (A2A, MCP, and the ACP invocation surface of the AGNTCY
    stack) alongside their substrate bindings, making explicit which dimensions each
    proposal owns at the protocol layer and which it inherits from its substrate.
    The document does not rank proposals and does not prescribe an architecture. It
    is standalone: it neither depends on nor prescribes any use-case or requirements
    document.</p>'

abstract:
- content: "<p>The Extensible Provisioning Protocol (EPP) is used to submit DNSSEC
    parameters for domain names to domain name registries. Registries and registrars
    often restrict the values they accept, and those restrictions vary from registry
    to registry. The resulting uncertainty makes it difficult for DNS operators to
    adopt new algorithms. This document recommends that registries and registrars
    base their acceptance policies on the IANA registries for DNSSEC algorithms and
    digest types.</p>"

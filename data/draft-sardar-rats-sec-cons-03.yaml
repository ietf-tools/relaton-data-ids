abstract:
- content: "<p>This document aims to provide guidelines and best practices for writing
    security considerations for technical specifications for RATS targeting the needs
    of implementers, researchers, and protocol designers. This is a work-in-progress,
    and the current version mainly presents an outline of the topics that future versions
    will cover in more detail. * Corrections in published RATS RFCs * Security concerns
    in two RATS drafts * General security guidelines, baseline, or template for RATS</p>"

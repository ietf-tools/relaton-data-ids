abstract:
- content: "<p>RFC 9370 specifies a framework for multiple additional key exchanges
    (ADDKE) in the Internet Key Exchange Protocol Version 2 (IKEv2) to support post-quantum
    cryptography migration. Under this framework, an initiator can propose multiple
    ADDKE transform types. In deployment scenarios, initiators may send proposals
    that contain redundant or overlapping lists of Key Encapsulation Mechanism (KEM)
    algorithms across different ADDKE transform types. This contribution discusses
    the implications of these proposals and specifies extended procedures for handling
    proposed transforms, which may improve negotiation robustness and interoperability
    by allowing the responder to select a valid set of algorithms without altering
    the security properties defined in RFC 9370.</p>"

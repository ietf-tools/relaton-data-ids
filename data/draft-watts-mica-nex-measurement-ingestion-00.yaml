abstract:
- content: "<p>This document describes a narrow, testable next step in the MICA-NEX
    proposal: cryptographically binding nanoscale instrument measurement claims to
    externally provisioned acquisition and calibration signer roles while denying
    model planners the ability to self-certify measurement status. The reference implementation
    uses Ed25519 signatures, SHA-256 content binding, typed units, time windows, source-kind
    separation, and a persistent local replay ledger. In a hardware-disconnected test
    harness, 60/60 signed synthetic test records from three simulated instrument classes
    were admitted and 30/30 adversarial cases were rejected for the expected reason;
    28/28 Python tests passed. No instrument, laboratory calibration, external reviewer,
    clinical context or independent physical replication was involved. Signature validity
    is deliberately distinguished from scientific validity.</p>"

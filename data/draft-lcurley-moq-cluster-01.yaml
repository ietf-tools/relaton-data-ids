abstract:
- content: "<p>This document defines a clustering extension for MoQ Transport [moqt],
    used to build a mesh of relays. Each namespace advertisement carries the list
    of Hop IDs it has passed through, starting with the original publisher, and the
    accumulated cost of that path. A receiver uses the list to detect loops and to
    tell which advertisements come from the same publisher, and the cost to choose
    between paths. Each endpoint declares its own Hop ID at setup, so a peer never
    advertises or serves it a path that already passed through it.</p>"

abstract:
- content: "<p>This document extends the existing limit on nomcom representation by
    organization ([RFC8713], Section 4.17) so that not all voting members of the IETF
    Nominating Committee (nomcom) belong to the same gender. It guarantees up to five
    voting seats to volunteers who opt into a self-declared pool, and changes the
    selection only in years when a plain random draw would seat fewer.</p>"

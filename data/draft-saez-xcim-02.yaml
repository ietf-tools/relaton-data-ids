abstract:
- content: "<p>XCIM specifies evidence that a party controlling an email address explicitly
    consented to receive defined types of communication from an identified sender.
    A trusted third-party Consent Attester verifies address control, observes a separate
    affirmative decision, and signs an attestation binding the recipient, sender,
    and agreed types. Blockchain anchoring provides immutable evidence of the attestation
    under an admitted finality policy. Authenticated lifecycle events and fresh status
    distinguish the historical decision from current consent. XCIM concerns the consent
    relationship independently of individual email messages. It does not sign, inspect,
    classify, or authenticate their content. A receiving email service may use verified
    current consent as a positive policy signal after independently establishing the
    sender identity relevant to its query. This document defines a portable consent
    object format and verification contract, together with requirements for separately
    admitted blockchain adapters. It does not select a universal blockchain network
    or claim operational readiness.</p>"

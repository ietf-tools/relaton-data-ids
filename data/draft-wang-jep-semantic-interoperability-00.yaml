abstract:
- content: "<p>This document defines semantic interoperability requirements for the
    Judgment Event Protocol (JEP). JEP-Core defines the event syntax, event classes,
    signatures, hashes, references, extension processing, and validation levels for
    signed judgment-related events. This document does not modify those mechanisms.
    Where this document restates JEP-Core semantics, JEP-Core remains authoritative.
    Instead, this document defines the minimum shared semantic invariants required
    for independent systems to interpret JEP events consistently across implementations,
    profiles, organizations, and jurisdictions. The document specifies core semantic
    roles, core semantic relations, event- class interpretation rules for Judgment,
    Delegation, Termination, and Verification events, verification-scope semantics,
    semantic identifiers, profile-extension constraints, semantic validation results,
    non-inference rules, semantic conformance requirements, initial semantic registry
    requirements, and cross-jurisdictional boundaries. It defines semantic registry
    contents and constraints, but does not define operational registry governance
    beyond the requirements stated here. This document does not define legal effect,
    moral responsibility, regulatory compliance, runtime enforcement, access-control
    decisions, domain-specific workflows, or external truth. A JEP event is a protocol-
    semantic record. Whether that record is sufficient to support an external target
    claim is outside the scope of this document and must be determined by an applicable
    profile, evidence policy, domain rule, or target-support analysis.</p>"

id: draft-ietf-sidrops-avoid-rpki-state-in-bgp
title:
- content: Guidance to Avoid Carrying RPKI Validation States in Transitive BGP Path
    Attributes
  language:
  - en
  script:
  - Latn
  format: text/plain
docid:
- id: draft-ietf-sidrops-avoid-rpki-state-in-bgp
  type: Internet-Draft
  primary: true
abstract:
- content: "<p>This document provides guidance to avoid carrying Resource Public Key
    Infrastructure (RPKI) derived validation states in Border Gateway Protocol (BGP)
    Path Attributes carried across external BGP sessions. Annotating routes with BGP
    Path Attributes carried across external BGP sessions signaling validation states
    may cause needless flooding of BGP UPDATE messages through the global Internet
    routing system, for example when Route Origin Authorizations (ROAs) are issued,
    or are revoked, or when RPKI-To-Router sessions are terminated. Operators should
    ensure RPKI-derived validation states are not signaled in BGP Path Attributes
    carried across external BGP sessions. Specifically, Operators should not associate
    Prefix Origin Validation state with BGP routes using transitive BGP Communities.</p>"
  language:
  - en
  script:
  - Latn
  format: text/html

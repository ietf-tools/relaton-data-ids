abstract:
- content: "<p>This document describes UDP Speedy Secure Shell (USSH), an experimental
    remote shell protocol built on top of USTPS. USSH provides an interactive shell
    session over a secure UDP-based transport while preserving USTPS transport semantics.
    USSH reconstructs application-level terminal streams where necessary, while relying
    on USTPS for secure unreliable-underneath, selective- recovery transport behavior.</p>"

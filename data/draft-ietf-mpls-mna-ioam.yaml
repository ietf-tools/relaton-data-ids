id: draft-ietf-mpls-mna-ioam
title:
- content: Encapsulation for In Situ Operations, Administration, and Maintenance Data
    Using MPLS Network Actions
  language:
  - en
  script:
  - Latn
  format: text/plain
docid:
- id: draft-ietf-mpls-mna-ioam
  type: Internet-Draft
  primary: true
abstract:
- content: "<p>In situ Operations, Administration, and Maintenance (IOAM), defined
    in RFC 9197, collects operational and telemetry information in the packet using
    IOAM-Data-Fields while the packet traverses a path between two points in the network.
    Several IOAM Option-Types are available, for example, Pre-allocated Trace, Proof
    of Transit (POT), Edge-to-Edge (E2E), and Incremental Trace, that can be used
    to collect information for calculating various performance metrics. RFC 9326 defines
    the IOAM Direct Export (IOAM-DEX) Option-Type, which is used as a trigger for
    IOAM data to be directly exported or locally aggregated without being pushed into
    in-flight data packets. MPLS Network Actions (MNA) mechanisms indicate actions
    to be performed on any combination of Label Switched Paths, MPLS packets, and
    the node itself, and to transport data needed for these actions. This document
    employs the MNA mechanisms to collect and transport the operational state and
    telemetry information using IOAM-Data-Fields as well as IOAM-DEX.</p>"
  language:
  - en
  script:
  - Latn
  format: text/html

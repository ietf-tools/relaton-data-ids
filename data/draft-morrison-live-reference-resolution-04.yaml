abstract:
- content: "<p>An agent that answers from a cached or derived copy of a value, when
    the system that owns the value has since changed, gives a wrong answer with no
    sign that it is wrong. This document describes the result an agent returns when
    it reads a value from its authority. Another component can rely on it. The result
    carries the value, the identifier of the authority that answered, a freshness
    indicator and a provenance type, bound together so that the value cannot be obtained
    without them. It also describes the behaviour around that result: resolving at
    the point of use, treating an unobservable or stale authority as an explicit uncertainty
    state, and refusing or escalating a costly act that depends on an uncertain value.
    The document is Informational. It defines no wire protocol, it has one in-house
    implementation of part of the result and no other, and it is offered for review
    as an Independent Submission.</p>"

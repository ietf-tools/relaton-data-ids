abstract:
- content: "<p>The Simple Agent Management Protocol (SAMP) defines a lightweight management-plane
    protocol for heterogeneous AI agents. SAMP allows a management system to discover
    agents, query their state, receive events, subscribe to event streams, and optionally
    configure or execute explicitly exposed operations under policy control. SAMP
    is inspired by operational management protocols such as SNMP, but it is designed
    for AI-agent-specific concepts such as dynamic profiles, autonomy classes, enrollment,
    trust states, and policy- gated execution. It is not an agent-to-agent communication
    protocol, an agent tool-use protocol, or an agent framework specification. This
    document defines SAMP version 0.1 as an Experimental protocol suitable for controlled
    environments and independent interoperability testing.</p>"

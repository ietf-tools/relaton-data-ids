abstract:
- content: "<p>The Discovery of Agents, Workloads, and Named Entities (DAWN) terminology
    document defines Minimum Discoverable Information (MDI) as the minimum information
    an entity must provide to be discoverable, but does not define its field-level
    content. The DAWN requirements and problem-statement documents identify the need
    for a standardized minimum structure; in its absence, emerging discovery formats
    risk each defining its own minimal metadata, with descriptors that do not interoperate
    across organizational or protocol boundaries. This document proposes a small,
    encoding-neutral information model, in the sense of RFC 3444, for MDI: three mandatory
    elements, a short set of recommended and optional elements, and the minimal constraints
    that hold among them. It is a minimum common subset and a mapping target for richer
    descriptors -- not a new card format and not a discovery protocol.</p>"

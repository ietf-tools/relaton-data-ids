abstract:
- content: "<p>RFC 8949 defines CBOR, a standard for serializing data types such as
    integers, strings, and arrays into encoded bytes. CBOR serialization is flexible,
    allowing data types to be encoded in multiple ways to accommodate deployment in
    constrained environments. This document introduces the term “general serialization”
    for the full set of encodings permitted by RFC 8949, and formally defines two
    specific serializations: preferred-plus serialization, which differs from preferred
    serialization only in cases rarely encountered in practice and is recommended
    for broad use; and deterministic serialization, which likewise differs only in
    rarely encountered cases from core deterministic encoding defined in RFC 8949.
    This document updates RFC 8949 with a new rule that limits how new tag definitions
    can affect the CBOR data model. This document provides clarifications to RFC 8949
    regarding bignums and floating-point NaN handling, along with general background
    information on serialization, determinism, and CBOR byte-string wrapping.</p>"

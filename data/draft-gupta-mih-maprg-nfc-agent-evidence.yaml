abstract:
- content: "<p>When an AI agent finds a counterparty, interacts with it, and pays
    it, the interaction crosses every layer of the stack: a physical tap between two
    devices, the hardware that holds their keys, a transport session, peer discovery
    and gossip, and finally an application record of what was agreed, paid, and delivered.
    Each layer produces its own evidence, and today nothing joins them. This document
    puts the near- field tap at the center and follows one progression, from tap to
    rendezvous, authenticated session, interaction, payment, and evidence record.
    For each layer it states what evidence the layer can contribute, what a verifier
    has to trust, and how a single verifiable record can cite all of it by digest.
    It treats hardware attestation and a transparency log checked by independent witnesses
    as complementary roots of evidence that answer different questions, describes
    how light nodes can check one interaction through evidence requests instead of
    replicating a swarm, and asks which measurable observations can independently
    corroborate such a record. It is a problem statement and research agenda for discussion
    in MAPRG, not a protocol specification.</p>"

abstract:
- content: "<p>A Cryptographically Relevant Quantum Computer (CRQC) would break the
    traditional asymmetric algorithms, such as RSA and ECDSA, that are widely used
    to authenticate the Internet Key Exchange Protocol Version 2 (IKEv2). Post-quantum
    digital signature algorithms are intended to resist such a computer, but these
    new algorithms and their implementations require time to mature. This document
    specifies a post-quantum traditional (PQ/T) hybrid PKI authentication method for
    IKEv2 in which each peer uses two separate certificates: one containing a post-quantum
    public key and one containing a traditional public key. Authentication remains
    secure as long as at least one of the component signature algorithms remains secure.</p>"

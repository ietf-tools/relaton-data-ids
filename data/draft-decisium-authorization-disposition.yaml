abstract:
- content: '<p>A verification check that has completed and a human authorization that
    is still outstanding can coexist for the same proposed action. Receipt formats
    that carry only a claim-state enumeration cannot express the second condition,
    because it is not a statement about the claim: it is a statement about what must
    happen before the action. This document specifies an authorization disposition,
    a sibling object carried alongside check results, and the processing rules by
    which a consumer derives a fail-closed decision about whether an action may be
    initiated. The disposition carries a named holder, two distinct deadlines, an
    action-instance binding, and a detached signed decision. The document treats receipt
    integrity, the decision recorded at issuance, and present actionability as separate
    questions. It distinguishes insufficient evidence from conflicting evidence, prohibits
    treating an unevaluated authorization requirement as "not required", and specifies
    requirements for historical verification, replay prevention, and tenant-scoped
    instance ownership. It records what the object establishes and, equally, what
    it does not.</p>'

abstract:
- content: <p>DomainKeys Identified Mail Signatures v2 (DKIM2) produces a verification
    result for an email message. This document defines how that result is reported
    in the Authentication-Results header field, registering the "dkim2" authentication
    method, the result values it can take, and two properties which identify the signing
    domain and the point in the chain at which verification failed. Diagnostic detail
    about each hop is carried in a human-readable comment.</p>

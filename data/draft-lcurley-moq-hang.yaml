abstract:
- content: "<p>Hang is a real-time conferencing protocol built on top of moq-lite.
    A room consists of multiple participants who publish media tracks. All updates
    are live, such as a change in participants or media tracks. Note to Readers This
    document was generated by an AI model from the implementation at github.com/moq-dev/moq
    (https://github.com/moq-dev/moq) and is maintained alongside it. Submit an issue
    (https://github.com/moq- dev/moq/issues) or PR (https://github.com/moq-dev/moq/pulls)
    if this spec sucks and you want to fix anything.</p>"

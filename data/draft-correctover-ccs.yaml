abstract:
- content: "<p>This document defines the Correctover Conformance Shape (CCS), a runtime
    verification framework for AI agent tool calls. CCS specifies seven verification
    dimensions (Structure, Schema, Latency, Cost, Identity, Integrity, Security) that
    tool calls and results must conform to at runtime. The framework defines a receipt
    format with Ed25519 signatures, three verdict values (allow, deny, escalate) and
    four executor lifecycle states (confirmed, dispatched, indeterminate, unknown),
    and normative requirements for implementations. This revision makes the document
    self-contained for publication: the related AEB and CAID specifications are reclassified
    as Informative References, and the native artifact requirements they motivate
    are restated normatively in this document so that no conformance requirement depends
    on an unreferenced work in progress. It also corrects the implementation-experience
    description (one reference implementation in two deployment forms, plus one independently
    developed third-party interoperability profile), clarifies the relationship to
    SCITT-based agent evidence work, and updates the author contact address. The detached
    Ed25519 signature construction over RFC 8785 canonical JSON and the receipt lifecycle
    and signing- algorithm conformance are unchanged from draft-08.</p>"
  language:

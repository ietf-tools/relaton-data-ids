abstract:
- content: "<p>Extensible metadata carried within the IOAM Pre-allocated Trace Option
    (PTO) can support packet-level, flow-level, or path-level processing beyond per-node
    trace data. This document defines the Global Opaque Block (GOB), an extension
    to the IOAM PTO that introduces a single pre-allocated global metadata region
    placed at the tail of the option, after the pre-allocated node data space. Since
    the PTO node data list is populated from the tail of the node data space toward
    its head, under the control of the RemainingLen field, legacy IOAM transit nodes
    can never reach the GOB region: the extension is transparent to such nodes by
    construction, and only the decapsulating node or collector needs to be GOB-aware.
    The presence and the format of the GOB are bound to the IOAM-Namespace. In the
    self-describing format, the GOB carries an explicit length and schema identifier
    in a trailer word; in the compact format, size and schema are implied by the IOAM-Namespace
    and the block consists of payload only, so that a 4-octet opaque value is carried
    in exactly 4 octets. In both formats the option is, on the wire, a Pre-allocated
    Trace Option as specified in RFC 9197, and no change to that specification is
    required. An optional bit in the PTO header allows a self- describing GOB to be
    recognized without namespace configuration. The GOB preserves the pre-allocated
    PTO processing model and can be used to transport path metrics that are updated
    along the path, or other structured metadata.</p>"

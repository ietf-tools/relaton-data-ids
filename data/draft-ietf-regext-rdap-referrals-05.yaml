abstract:
- content: "<p>This document describes an RDAP extension that allows RDAP clients
    to request to be redirected to a related RDAP record for a resource, and an RDAP
    extension that gives RDAP clients the ability to request no redirection in other
    scenarios. This document also defines new link relations that can be used in redirect
    requests that can be used in query bootstrapping and navigating hierarchies, such
    as the hierarchies described in RFC 9910.</p>"

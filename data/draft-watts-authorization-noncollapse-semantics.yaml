abstract:
- content: "<p>Distributed authorization systems frequently combine observations,
    policy evaluations, evidence records, authorization decisions, and execution receipts.
    Treating these different objects as interchangeable can create fail-open behavior,
    stale-authority bugs, and false claims of completion. This document defines non-collapse
    semantics: explicit typed transitions between observation, evidence, authorization,
    and execution state; fail-closed treatment of missing or indeterminate premises;
    and comparison rules for determining when heterogeneous representations agree
    on a declared invariant. The document is informational and defines no new wire
    protocol.</p>"

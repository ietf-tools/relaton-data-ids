abstract:
- content: "<p>The Registration Data Access Protocol (RDAP) is used by Regional Internet
    Registries (RIRs) and Domain Name Registries (DNRs) to provide access to their
    resource registration information. The core specifications for RDAP define core
    object types, but they do not contain objects for the Internet Routing Registry
    (IRR). This document is intended to address this gap.</p>"

abstract:
- content: "<p>This document defines methodologies for benchmarking the performance
    of intra-domain and inter-domain source address validation (SAV) mechanisms. SAV
    mechanisms are utilized to generate SAV rules that prevent source address spoofing.
    The methodology treats a SAV device as a black box and is therefore agnostic to
    the specific SAV mechanism and implementation used by the device. This document
    defines test setups, performance indicators, and test cases for SAV accuracy,
    control-plane and data-plane performance, and resource utilization.</p>"

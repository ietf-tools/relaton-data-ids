abstract:
- content: "<p>This document describes subscriber behavior that may produce sustained
    advantages in service outcomes or disproportionate resource consumption at shared
    Media over QUIC (MoQ) relays. AI-assisted optimization is a motivating scenario;
    observations alone cannot establish whether AI was used or caused a disparity.
    The document outlines contextual measurement, privacy safeguards, and a proposed
    extension for authorization-bound resource budgets with explicit accounting and
    recovery behavior. It builds on existing MoQ authorization and relay denial-of-service
    work. This informational document defines no new MoQ messages, token claims, registries,
    or standardized detection algorithm.</p>"

abstract:
- content: "<p>PSI-06 specifies an inception-lock protocol that cryptographically
    anchors a raw human-originated data signal (keystroke, biometric, survey response,
    application screen capture, trip acceptance timestamp) to a signing key at the
    point of capture. The protocol prevents tampering with source data between capture
    and submission, enabling verifiable proof of what a user was shown and when they
    saw it. Receipts are protected by a hybrid dual-signature scheme combining Ed25519
    (classical) and ML-DSA-65 (post-quantum), making the evidence chain resistant
    to both classical and quantum adversaries. This is critical for accountability
    proceedings involving algorithmic platforms, where the information displayed to
    the user may differ from the information recorded by the platform.</p>"

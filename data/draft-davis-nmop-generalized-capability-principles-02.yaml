abstract:
- content: "<p>This document introduces a framework for capability modeling based
    on the specification and refinement principles established in ITU-T G.7711 Annex
    G (also previously published as ONF TR-512.7. See latest G.7711 release) and the
    modeling boundaries work documented in draft-davis-netmod-modelling-boundaries.
    The framework defines how component–system capabilities can be explicitly described
    and refined via a process of pruning, refactoring, and occurrence formation. This
    draft version additionally incorporates a sketch of an occurrence-semantics kernel.
    This kernel is presented here as a continuation of the refinement and occurrence-formation
    principles already introduced in the previous version, not as a retrospective
    reinterpretation of them. These capability definitions can target detailed operational
    considerations, system interactions, licensing, abstract product declarations,
    or sales and marketing. The framework supports modular, layered, and fractal declarations
    of networked behavior, and provides a foundation for a suite of future IETF drafts
    aligned with ongoing work on photonic plug manifests, entitlement/licensing, IVY
    equipment modeling, energy/thermal considerations and related domains.</p>"

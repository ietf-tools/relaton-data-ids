abstract:
- content: "<p>This document outlines best current practices for Internet of Things
    (IoT) device providers regarding the implementation of DNS stub resolvers, with
    the aim of mitigating security threats, enhancing privacy, and resolving operational
    challenges. It also provides guidelines for network operators on mitigating the
    risks identified in this draft as DNS resolution includes services outside of
    the stub-resolver, and for device providers' management zones.</p>"

abstract:
- content: <p>This document defines the "sustainability-data" well-known URI, at which
    a web origin publishes one JSON document declaring the energy consumption, carbon
    footprint, and related environmental metrics of a subject, typically the origin
    itself. The declaration has a fixed path and formal schemas. It links to a methodology,
    and may carry an embedded signature, name the declarations of upstream providers,
    and link to third-party attestations. The metrics are self-asserted claims of
    the publisher. This document registers the well-known URI and the media type application/sustainability-data+json.</p>
  language:
  - en
  script:
  - Latn
  format: text/html

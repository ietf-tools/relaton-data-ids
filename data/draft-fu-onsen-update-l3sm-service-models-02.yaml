abstract:
- content: "<p>RFC8299 defines a YANG data model for L3VPN service delivery. This
    document defines a set of extensions that address the limitations of the L3VPN
    Service Model (L3SM). The extensions enable (1)dynamic network provisioning with
    temporary connectivity, (2) dynamic bandwidth adjustment, (3) integration of isolation
    in Slice Service Templates to enhance QoS provisioning, (4) performance monitoring
    for enriching service quality visibility, (5)quantum-safe encryption integrating
    both PQC and QKD.</p>"

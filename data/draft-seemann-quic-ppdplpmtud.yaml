abstract:
- content: "<p>QUIC endpoints commonly use 1200-byte datagrams during the handshake
    and only start Path MTU Discovery afterward. This means that just- established
    QUIC connections cannot immediately use larger datagrams, which is especially
    limiting for MASQUE protocols and for WebTransport. This document defines Parallel
    Probing DPLPMTUD (PPDPLPMTUD), which probes several packet sizes early during
    the QUIC handshake, so a larger discovered size is usable during later handshake
    phases and especially after handshake completion. The same discovery process is
    also used for path migration.</p>"

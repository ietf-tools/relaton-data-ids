abstract:
- content: "<p>An AI agent with valid cloud credentials can spend a month's budget
    in an hour, open the firewall it is supposed to respect, or reconfigure a network
    that other people depend on. Autonomous agents reached through Apple iOS and Google
    Android enterprise apps and assistants such as Apple Siri, Google Gemini, Microsoft
    Copilot, and Amazon Alexa, and agents running on Windows and Linux infrastructure,
    AWS, Azure, and Google Cloud, Kubernetes, telecommunications and 5G/6G control
    planes, financial systems, and industrial controllers can independently start
    costly, conflicting, irreversible, or security-sensitive resource effects. Prompt
    injection, quota exhaustion, several agents overspending a shared budget, confused
    asynchronous workflows, agents changing the security policy that governs themselves,
    conflicting rules from different owners, and incomplete audit trails can turn
    a syntactically valid API call into an unauthorised consequence. This document,
    Part 12 and the final part of a twelve-part series, specifies execution finality
    for autonomous infrastructure. It describes resource-bounded protected validation
    that cannot be exhausted into a permissive fallback; cumulative consequence budgets
    with delegated sub-budgets that cannot exceed their parent; dependency-gated multi-step
    and asynchronous workflows; non-self- authorising security-policy and configuration
    changes; resolution of policy conflicts by competent-authority precedence, including
    safety and tenant boundaries; and end-to-end source-to-effect provenance with
    protected consumption and closure records at independent Finality Sinks. Reference
    algorithms, twenty threat models, and forty reproducible tests, including NETCONF
    configuration-diff and real telecom-controller cases, are included. Part 1 of
    the series defines the shared terminology and common workflows. The document relates
    these mechanisms to Workload Identity in Multi- System Environments (WIMSE); OAuth
    2.0 Rich Authorization Requests, Token Exchange, and Demonstrating Proof of Possession
    (DPoP); the Network Configuration Protocol (NETCONF), RESTCONF, and YANG data
    modelling; Network Modeling (NETMOD) and Operations and Management Area (OPSAWG)
    work; Remote ATtestation procedureS (RATS); Authentication and Authorization for
    Constrained Environments (ACE); CBOR Object Signing and Encryption (COSE); HTTP
    semantics; Supply Chain Integrity, Transparency, and Trust (SCITT); autonomic
    networking (ANIMA); and Trusted Execution Environment Provisioning (TEEP) and
    Software Updates for Internet of Things (SUIT). These are reusable building blocks
    that do not by themselves supply operation- specific finality, and no working-group
    adoption or IETF consensus is claimed. Industry alignment covers Apple iOS, iPadOS,
    and macOS with App Intents; Android with Binder, intents, and Keystore; Google
    Cloud with Gemini, Microsoft Azure and Windows, and Amazon Web Services; agent
    platforms from OpenAI, Anthropic, and Meta; NVIDIA, Qualcomm, Arm, and Huawei
    infrastructure; Kubernetes; enterprise identity and SaaS; voice and chat assistants
    issuing infrastructure commands; cloud cost management and GPU capacity; autonomous
    networks and Open RAN applications; firewall, secure-access, and zero-trust policy
    automation; identity governance and privileged roles; data-centre power and cooling;
    electricity, water, and other essential services; hospital IT; financial market
    infrastructure; public-sector and sovereign cloud; managed service providers;
    banking and payments; telecommunications 5G/6G; and industrial control, robotics,
    and connected vehicles. For each, the document states the technical effect: an
    autonomous infrastructure change takes effect only within its remaining budget,
    under a policy it did not write for itself, according to the competent authority
    that prevails, and with a verifiable closure record. Product names are illustrative
    and imply no endorsement or implementation by any vendor. For the EU Artificial
    Intelligence Act (Regulation (EU) 2024/1689), and alongside sector cybersecurity
    frameworks such as the NIS2 Directive and the Digital Operational Resilience Act,
    budgeted, non-self- authorising, and fully traceable autonomous changes can help
    providers, deployers, and essential-service operators address risk- management,
    human-oversight, record-keeping, and robustness and cybersecurity requirements
    where those obligations apply; this is a technical mapping, not a conformity claim
    or legal advice. Related patent-pending background identified by the author includes
    international application PCT/IB2026/055615 (filed 4 June 2026), described as
    an 8,598-page disclosure with approximately 300 distinct, non-repetitive technical
    embodiments. The author additionally reports a broader filing history involving
    32 provisional applications, five other PCT applications, and ten further filings;
    the exact family, priority, and Indian application particulars are reserved for
    separate IETF IPR disclosures. The 3,567-page Zenodo specification supporting
    this series is a separate publication.</p>"

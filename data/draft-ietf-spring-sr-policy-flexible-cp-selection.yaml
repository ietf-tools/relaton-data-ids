- content: "<p>This document describes a flexible method for selecting candidate Segment
    Routing (SR) policy paths. Based on the real-time resource usage and forwarding
    quality of candidate paths, the head node can perform dynamic path switching among
    multiple candidate paths in the SR policy.</p>"

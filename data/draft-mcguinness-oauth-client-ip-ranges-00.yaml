abstract:
- content: "<p>This specification defines OAuth client metadata parameters for declaring
    the IP address ranges from which a client originates network requests. The client_ip_ranges
    parameter carries a set of IPv4 and IPv6 prefixes by value. The client_ip_ranges_uri
    parameter references an HTTPS resource containing the set, so that large and frequently
    changing sets can use standard HTTP retrieval and caching. The specification also
    defines how authorization servers validate, accept, and retain declared ranges.
    The parameters can be used with OAuth 2.0 Dynamic Client Registration, OAuth Client
    ID Metadata Documents, and other mechanisms that convey client metadata. Authorization
    servers and other parties that obtain a client's metadata can use the declared
    ranges as an input to network access control.</p>"

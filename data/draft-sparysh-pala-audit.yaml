abstract:
- content: "<p>This document describes PALA-1, a compact binary record format for
    tamper-evident audit trails produced by AI inference runtimes and robotic control
    systems. It is designed for a class of deployment defined by three constraints
    that hold together: the hardware is computationally modest and its cycles are
    reserved for the workload and the power budget rather than for the audit trail;
    no external witness is reachable, whether because policy forbids outbound contact
    or because the platform operates beyond connectivity, so a witness is unavailable
    by rule or by physics rather than by circumstance; and the right to verify the
    trail is separated from the right to read what it records. Records form an append-only
    hash chain. Integrity verification requires no key material of any kind, inspects
    no record bodies, and costs one hash per record rather than one signature. The
    format distinguishes three separately answerable questions -- internal consistency,
    completeness against an external anchor, and existence at a point in time against
    an external witness -- and states which of the three a given trail actually supports
    rather than implying all three. The format is frozen at version 1.0 and is described
    here as it is. This document presents an existing wire format; it does not revise
    one. Where a deployment does permit an external witness, a chain head may be published
    to a transparency service such as that of the Supply Chain Integrity, Transparency,
    and Trust architecture (SCITT, RFC 9943); that path is described but is not part
    of the hashing contract.</p>"

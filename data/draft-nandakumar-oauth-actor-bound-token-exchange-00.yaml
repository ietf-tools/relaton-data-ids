abstract:
- content: "<p>In OAuth 2.0 Token Exchange, the client that sends the request receives
    the token, and with DPoP the token is bound to the key that signed the client's
    proof. Agent systems often need one party to obtain a token for another: an orchestrating
    agent that approves an action obtains a token for the agent that will perform
    it. This document lets a token exchange client request that the issued token be
    bound to the key of the actor named in the request, and requires the actor to
    prove possession of that key, so that the token is usable only by the actor and
    only with its consent.</p>"

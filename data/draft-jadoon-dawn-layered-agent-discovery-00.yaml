abstract:
- content: "<p>This document presents a use case and problem statement for the initial
    discovery of AI agents supporting end-to-end communication services within an
    organization. The use case considers AI agents associated with different functions
    of the Internet protocol suite, including application, transport, Internet-layer,
    and related network-operation functions. These agents may share general capabilities
    but differ in their communication-related operational scopes and responsibilities.
    The document examines the minimum public discovery information needed to distinguish
    such agents within a known organizational discovery scope.</p>"

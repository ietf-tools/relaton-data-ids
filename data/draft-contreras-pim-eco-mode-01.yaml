abstract:
- content: "<p>This document specifies an extension to IGMPv3 and MLDv2 messages to
    indicate eco-mode preferences in the delivery of multicast content based on the
    mechanism described in [RFC9279]. The extension enables receivers and network
    elements to signal energy-aware multicast delivery preferences, including different
    eco-mode levels, so that multicast services can be operated consistently with
    energy-efficient network management, service-level optimisation, and telemetry-driven
    assessment of energy and carbon impact.</p>"

docid:
- id: draft-ietf-nfsv4-uncacheable-directories
  type: Internet-Draft
  primary: true
abstract:
- content: "<p>Network File System version 4.2 (NFSv4.2) clients may cache directory-entry
    (dirent) metadata returned by READDIR to improve performance. In some deployments,
    the rate at which directory contents change at the server exceeds the validity
    of typical NFSv4.2 client caches, so that a client serving READDIR responses from
    its local cache returns entries or attribute values that no longer reflect the
    current state of the directory. This document introduces an uncacheable dirent
    metadata attribute for NFSv4.2 that allows a server to indicate that a client
    honouring the attribute is required to retrieve directory-entry metadata from
    the server on each READDIR rather than serving the response from a local cache.</p>"
  language:
  - en
  script:
  - Latn
  format: text/html

abstract:
- content: "<p>This document defines Galois Counter Mode with Strong Secure Tags (GCM-SST),
    an Authenticated Encryption with Associated Data (AEAD) algorithm that addresses
    several weaknesses of GCM. GCM-SST can be used with any keystream generator, not
    only 128-bit block ciphers. Main differences from GCM are the introduction of
    a second authentication subkey H_2, per-nonce derivation of both H and H_2, and
    stricter usage limits. Together, these changes yield authentication tags with
    near-ideal forgery probabilities, including reforgeability resistance. All registered
    instances have an expected number of forgeries E(F) ≈ v / 2^t, a property that
    GCM is far from providing. GCM-SST is designed for security protocols with replay
    protection such as TLS, QUIC, SRTP, and PDCP, and provides hardware and software
    performance comparable to GCM. This document registers nine AEAD algorithm instances
    using AES and Rijndael-256 in counter mode, with tag lengths of 48, 96, and 112
    bits. GCM-SST has been standardized by 3GPP for use with SNOW 5G, AES-256, and
    ZUC-256.</p>"

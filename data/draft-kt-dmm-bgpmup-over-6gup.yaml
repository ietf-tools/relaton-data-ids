abstract:
- content: "<p>Evolution of the 6G user plane toward distributed Serving and Anchor
    User Plane Functions (S-UPFs and A-UPFs) offers an opportunity to coordinate mobility,
    IP transport, and application/AI-compute placement. This document explores an
    architecture in which a Mobile User Plane Controller (MUP-C) translates authorized
    mobile-session information and transport-aware steering decisions into BGP Mobile
    User Plane (MUP) routing information. It describes interworking with the BGP MUP
    SAFI, access and data-network segments, SRv6 forwarding, mobility, and user-plane
    accounting. The architecture is transport- neutral; SRv6 is an illustrative data
    plane. The proposed application-to-session binding and 6G procedures are for discussion
    and do not define new BGP encodings or change 3GPP procedures.</p>"

abstract:
- content: "<p>This document defines the evidence layer: the conformance requirements
    for a local evidence store that records evidence and the relationships between
    records, keeps digests committed while payloads are separately referenced, and
    preserves how each record came to be known well enough that a later reader can
    tell an observation from a claim. This document defines the record model, typed
    links between records, disclosure and retention semantics, the three classes of
    index a store may maintain, and the minimum interface any commitment substrate
    must supply for a store to conform to this layer. It exists so that a request
    for evidence can be answered honestly from what a store actually holds, and so
    that an evidence bundle assembled in response is assembled from committed material
    rather than assembled and then made to look committed. Conformance to this layer
    MUST NOT require any particular implementation or commitment substrate: a Checkpointed
    Local Log is one conforming profile; registration with a SCITT Transparency Service
    is another; any other append-only transparency log, or an implementer's own authenticated
    log, also qualifies. This document defines neither evidence sufficiency policy,
    request routing, settlement, nor any specific host-identity, signing, payload-storage,
    or replication mechanism.</p>"

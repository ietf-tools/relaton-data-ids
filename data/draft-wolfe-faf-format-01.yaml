abstract:
- content: "<p>This document specifies the FAF Foundational AI-Context Layer for AI
    agents — one architectural layer expressed through two YAML-based media types
    with distinct lifecycles. The layer answers what an AI agent KNOWS about a project
    (static context) and what it REMEMBERS across sessions (persistent memory). The
    two formats that constitute the layer: *.faf (application/faf+yaml, IANA-registered
    October 2025) — static project context: architecture, conventions, dependencies,
    goals. Read once; trusted as canonical. *.fafm (application/fafm+yaml, IANA-registered
    May 2026) — persistent agent memory: facts, preferences, accumulated knowledge.
    Mutates across sessions; multi-profile (voice and knowledge); anti-fork by design.
    Together the two formats provide a complete foundational layer. They share YAML
    1.2 as base syntax, MIT-licensed open distribution, and family branding. They
    differ in lifecycle:.faf is static-read-once;.fafm is mutating-persisted. The
    formats interoperate by safe degradation — a.faf-only consumer reads a.fafm document
    without breaking; a.fafm-aware consumer transparently gains the memory dimension.
    This document seeks IETF standards-tree registration for both formats (application/faf+yaml
    and application/fafm+yaml). The vendor-tree registrations remain valid for backward
    compatibility. *Two formats. One foundational layer.*</p>"

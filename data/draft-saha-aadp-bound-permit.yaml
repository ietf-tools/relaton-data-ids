abstract:
- content: '<p>The Agent Action Decision Protocol (AADP) decides, per action, whether
    an agent''s concrete request may proceed now, and assumes that the decision is
    consumed by an enforcement point on the same secured channel that issued it. AADP
    identifies, as a planned extension, a permit that must be honoured across a trust
    boundary, and defines the "present_bound" obligation as its hook. This document
    specifies that extension. An action-bound permit is a permit signed by the decision
    point, bound to one recipient, one presenter key, one HTTP request and one decided
    action instance, and short-lived. It composes with mandate formats such as the
    Agent Authorization Envelope, which carry what a recipient can evaluate for itself;
    the bound permit carries a decision the recipient cannot recompute, because it
    depends on state held by the issuer: cumulative budgets, live reservations, approval
    lifecycle and escalation. The document adds scoped trust in issuers, a declared
    currentness mode, a mandate reference, a verification order with registered refusal
    reasons, and a confirmation the recipient signs. It builds on existing specifications
    for every mechanism it can, and defines no new signature format, token format
    or policy language.</p>'

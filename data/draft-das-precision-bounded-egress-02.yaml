abstract:
- content: "<p>A device may legitimately possess exact location while an application,
    SDK, AI agent, analytics library, or foreign endpoint is entitled only to a coarser
    representation, a delayed or randomized representation, or no location at all.
    Operating system permission to read a fix does not answer whether that fix may
    leave the device at the requested precision. This document defines a precision-bounded
    egress profile on top of execution finality. The gap this closes is concrete:
    an application that legitimately reads exact GPS for one on-device purpose commonly
    shares its process with an embedded SDK, agent tool, or cloud sync path that can
    forward the same exact coordinate to a destination that never needed it, without
    the user seeing that forwarding as a separate disclosure. A proposed release is
    a Location-Release Candidate Act and remains non-effective while a Protected Enforcement
    Domain evaluates purpose, requester, component, recipient, destination, jurisdiction,
    required precision, policy and revocation state, cumulative disclosure state,
    and intended egress sink. The sink independently verifies scoped non-bearer authority
    against the actual outbound payload immediately before release. The permitted
    result may be exact data, a reduced representation, or denial. Data access is
    not data-export authority. Precise GPS access is not precise GPS-release authority.</p>"

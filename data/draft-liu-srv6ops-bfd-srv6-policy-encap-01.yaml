abstract:
- content: "<p>This document provides operational guidelines for Bidirectional Forwarding
    Detection (BFD) when applied to Segment Routing over IPv6 (SRv6) Policies. While
    the packet encapsulation mechanisms are standardized, this document focuses on
    the decisions network operators must make regarding mode selection, address management,
    traffic engineering integration, and troubleshooting strategies to ensure reliable
    service protection and efficient resource utilization. It addresses practical
    challenges such as handling diverse tail-end node capabilities (IPv4/IPv6), managing
    BFD session overhead in large-scale segment lists, and diagnosing failure detection
    anomalies in source-routed paths.</p>"

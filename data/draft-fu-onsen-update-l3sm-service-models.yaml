abstract:
- content: "<p>[RFC8299] defines a YANG data model for L3VPN service delivery. The
    base L3VPN Service Model (L3SM) has limitations regarding dynamic service features.
    In addition, emerging technologies including SRv6 and quantum security bring new
    service capabilities available to customers, which are not natively supported
    by L3SM. This document defines a set of extensions to address the limitations
    of L3SM. These augmentations are designed to be backward-compatible and do not
    obsolete [RFC8299].</p>"

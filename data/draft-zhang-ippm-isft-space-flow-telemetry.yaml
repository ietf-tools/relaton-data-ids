abstract:
- content: "<p>Space networks, including satellite networks, often operate with constrained
    bandwidth, processing capacity, storage, and energy, while also experiencing dynamic
    topology and frequent link changes. Existing in-situ Operations, Administration,
    and Maintenance (IOAM) mechanisms provide useful per-packet telemetry, but the
    packet overhead and field selection flexibility can be costly in such environments.
    This document specifies In-situ Space Flow Telemetry (ISFT), a compact telemetry
    profile for IPv6 limited domains. ISFT defines an 8-octet telemetry option header,
    a small set of telemetry templates for delay, loss, and congestion information,
    and processing behavior for encapsulating, transit, and decapsulating nodes. ISFT
    is intended for controlled domains such as space-network segments and MUST NOT
    be exposed as an Internet-wide protocol behavior.</p>"

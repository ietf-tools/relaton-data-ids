abstract:
- content: "<p>This document defines a fixed set of five canonical MCP parameter risk
    classes: semantic categories for sensitive parameters that appear in the JSON
    Schemas of Model Context Protocol (MCP) tool definitions, together with deterministic
    decision rules and boundary conditions for assigning those labels. The classes
    are designed to supply machine-readable, pre-invocation risk metadata about tool
    inputs, independent of any particular gateway, routing, or capability-profile
    specification. The classes and their decision rules were derived from, and applied
    against, a SHA-256-frozen empirical census of publicly reachable MCP servers.
    The frozen census and the classification suite that implements these rules are
    archived on Zenodo; the archived suite is the normative tie-breaker for exact
    matching behaviour. This is an Informational, individual submission. It defines
    the canonical classes and decision rules. Other specifications MAY cite this document
    as the canonical source of the class labels and MAY define their own operators
    that consume those labels; they SHOULD NOT re-derive or inline the normative decision
    rules into their own normative text.</p>"

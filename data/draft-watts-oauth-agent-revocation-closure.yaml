abstract:
- content: "<p>Agentic systems can derive and distribute authority across delegated
    agents, workloads, credentials, queues, and long-running operations. Existing
    revocation mechanisms can invalidate a credential or authorization grant, but
    credential invalidation alone does not establish that every path from revoked
    authority to a consequential effect has been closed. This document defines a protocol-neutral
    model for revocation closure. It introduces authority graphs, consequential sinks,
    revocation cut sets, closure states, closure budgets, and closure receipts. The
    model is intended to complement OAuth 2.0, workload identity, transaction-token,
    and agent-authorization work. It does not define a new authorization protocol,
    token format, or AI safety mechanism.</p>"

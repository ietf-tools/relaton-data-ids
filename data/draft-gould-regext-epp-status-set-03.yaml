abstract:
- content: "<p>This document describes an Extensible Provisioning Protocol (EPP) extension
    for the provisioning and management of status sets applied to EPP objects, such
    as the domain name object in RFC 5731. The EPP status values defined in the EPP
    object mappings, such as Section 2.3 of RFC 5731, support human-readable text
    that describes the rationale or reason for the status applied to the object. There
    can be many overlapping reasons for a status value being applied to the object,
    such as implementing a lock service, complying with a court order, or addressing
    domain abuse. A status set defines an object representing the reason for setting
    a list of status values, so clients and servers can manage the status sets in
    place of individual status values to effectively manage the overlapping reasons.
    The EPP extension supports the provisioning of client status sets, disclosure
    of the server status sets, and an enhanced authorization model for client status
    sets with the EPP Authentication Token in [I-D.gould-regext-auth-token].</p>"

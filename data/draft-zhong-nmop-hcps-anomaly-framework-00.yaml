abstract:
- content: "<p>Human-cyber-physical systems combine human activity, computing and
    communication services, and networked physical processes. Their network data is
    heterogeneous and high-dimensional. An abnormal condition can appear in the attributes
    of one entity, in an interaction between entities, or only when evidence from
    several domains is considered together. This document specifies an initial framework
    for anomaly detection in human-cyber-physical environments. It describes the functions
    used to inventory observations, construct entity and relation context, analyze
    high-dimensional data, and report an anomaly result. It also defines a small conceptual
    information model so that anomaly results retain their observation scope, feature
    context, and score meaning.</p>"

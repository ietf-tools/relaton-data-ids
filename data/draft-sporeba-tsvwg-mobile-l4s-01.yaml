abstract:
- content: "<p>This document describes best practices for deployment of Low Latency,
    Low Loss, and Scalable Throughput (L4S) in mobile devices. It defines the responsibilities
    of the host operating system and the link-layer (modem and Wi-Fi) subsystems to
    ensure successful end-to- end low-latency communication.</p>"

abstract:
- content: "<p>This memo specifies signed policy conferral, a way to distribute an
    enforceable defensive policy to a population of recipients. A conferral envelope
    carries a policy artefact that a recipient applies, a signature block that needs
    a quorum of independent signers, an exclusion proof that the policy does not carry
    the sensitive method or data it was derived from, and a staged-rollout directive
    that confines the first distribution to a bounded cohort. The envelope travels
    as the payload of a conferral frame kind that this memo defines for the identity-keyed
    fan-out frame of the agent- channel fan-out memo, and its signers sign with COSE
    or JOSE. It introduces no new transport and no new signature format. The memo
    covers the many-recipient case that the briefing-and-binding envelope memo excludes
    from its scope. It differs from the Common Security Advisory Framework, which
    standardises advisory documents for a recipient to read, by distributing a signed
    policy for a recipient to apply.</p>"

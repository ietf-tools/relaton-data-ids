abstract:
- content: "<p>Acts-For lets a person sign in to any website with the ~handle they
    already hold, and lets an AI agent sign in or register at that website on the
    person's behalf. Neither needs a username, a password or an account per site.
    A website joins by publishing one DNS record. A person signs in through a standard
    OpenID Connect authorization code flow and the site receives a short-lived token
    naming the person by a number unique to that site. An agent obtains a short-lived
    pass from the issuer over the Model Context Protocol and presents it to the site.
    The pass names the same per-site number, the agent's own key and ~handle, and
    the limits the person set. The site checks it against a published key and calls
    nobody.</p>"

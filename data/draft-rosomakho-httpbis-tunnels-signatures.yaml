abstract:
- content: "<p>This document specifies client authentication for HTTP tunnel establishment
    using HTTP Message Signatures. It covers the CONNECT method, extended CONNECT
    in HTTP/2 and HTTP/3, and HTTP/1.1 Upgrade. It defines signature coverage and
    replay protection using either a client-generated nonce or a server-provided nonce
    obtained through an Accept-Signature challenge.</p>"

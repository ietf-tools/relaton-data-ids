abstract:
- content: "<p>*NOTE: This document describes a signature scheme based on the SQIsign
    algorithm currently under evaluation in the 3rd round NIST Post-Quantum Cryptography
    standardization process. Be aware that the underlying primitive may change as
    a result of that process.* This document specifies the algorithm encodings and
    representations for the SQIsign digital signature scheme within the CBOR Object
    Signing and Encryption (COSE) and JSON Object Signing and Encryption (JOSE) frameworks.
    SQIsign is an isogeny-based post-quantum signature scheme that provides an unusually
    compact signature and public key size among candidates of the NIST Post-Quantum
    Cryptography (PQC) standardization and on-ramp-to-standardization processes. The
    standardization of SQIsign will be helpful to address current infrastructure bottlenecks,
    specifically the FIDO2 CTAP2 specification used by many in-service devices. This
    document clarifies that SQIsign does not expose the auxiliary torsion-point information
    exploited in the SIDH/SIKE attacks. Consequently, the specific attack techniques
    of Castryck–Decru do not directly apply. However, the scheme remains subject to
    ongoing cryptanalysis of isogeny-based constructions. By establishing stable COSE
    and JOSE identifiers, this document ensures the interoperability required for
    the seamless integration of post-quantum security into high-density, bandwidth-constrained,
    and legacy-compatible hardware environments.</p>"

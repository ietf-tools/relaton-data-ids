abstract:
- content: "<p>Agentic applications increasingly distribute objectives across autonomous
    agents, tools, and services operating across different protocols and administrative
    domains. A single Activity may involve multiple independently maintained Dialogs,
    Tasks, Events, and Resources, spanning different modalities and extended periods
    of time. Existing protocols provide identifiers and context-management mechanisms
    for their own interactions, but these do not necessarily support correlation across
    Dialogs, protocols, and administrative boundaries, particularly as interactions
    evolve, branch, or resume over time. This document defines a context-and-correlation
    architecture based on Activities, Dialogs, Tasks, Resources, and typed Relationships.
    It describes how management and correlation metadata can be maintained and selectively
    propagated to preserve coherent context across distributed interactions, while
    allowing participants to determine the scope of correlations they share and manage.</p>"

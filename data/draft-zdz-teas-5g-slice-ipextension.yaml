abstract:
- content: "<p>3GPP defines 5G network slicing as an end-to-end service spanning the
    Radio Access Network (RAN), Transport Network (TN), and Core Network (CN). Within
    these domains, dedicated slice-awareness and management mechanisms are specified
    by 3GPP. However, when 5G slice traffic traverses an IP backbone network that
    lies outside the 3GPP-managed domain -- such as when a User Plane Function (UPF)
    connects to an external service provider network -- slice context information
    is lost, and the IP backbone cannot differentiate or assure the quality of individual
    slices. This document proposes a method for preserving 5G network slice awareness
    in IP backbone networks by encoding the 3GPP Single Network Slice Selection Assistance
    Information (S-NSSAI) directly into IPv6 packet headers. This document also describes
    the associated procedures for slice-aware QoS assurance in the IP backbone.</p>"

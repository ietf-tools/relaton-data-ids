abstract:
- content: "<p>Large-scale Low Earth Orbit (LEO) satellite constellations equipped
    with optical Inter-Satellite Links (ISLs) are evolving toward multi- hop spaceborne
    transport networks. Multi-vendor constellation deployments, interconnection with
    terrestrial networks, and potential interconnection among heterogeneous satellite
    systems introduce requirements for interoperable routing behavior and reachability
    exchange. At the same time, large constellation size, time-varying topology, unplanned
    link disruptions, and constrained on-board resources raise scalability and stability
    challenges for routing mechanisms. This document describes representative deployment
    and interoperability scenarios, examines the limitations of network-wide fine-grained
    link-state distribution and existing mitigation approaches, and identifies routing
    requirements for scalable state management, topology-change handling, fast recovery,
    and inter- network reachability.</p>"

abstract:
- content: "<p>This document defines CEP-2, an optional profile of the Judgment Event
    Protocol (JEP) [JEP] for binding declared AI, model, agent, policy, tool-chain,
    or deployment changes to independently verifiable evidence and external anchor
    references. CEP-2 defines one critical JEP record-binding extension, one minimal
    Evolution-Change Record, Subject and Change semantics, digest-first evidence references,
    typed external anchor references, and independent CEP validation checks. JEP remains
    authoritative for event verbs, Event Identity, Event Hash, signatures, references,
    extension processing, validation modes, and acceptance semantics. CEP-2 records
    declared change evidence. It does not determine whether a change actually occurred,
    whether a system improved or degraded, whether a capability emerged, whether a
    change was authorized, safe, aligned, fair, lawful, approved, reversible, or acceptable,
    or whether any governance or regulatory process was satisfied.</p>"

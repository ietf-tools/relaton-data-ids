abstract:
- content: "<p>Autonomous software agents and orchestrated workflows increasingly
    invoke high-consequence operations on Resource Servers (such as financial originations
    or clinical prescriptions) on behalf of human users. Existing bearer tokens and
    transport-level Proof-of- Possession mechanisms cannot cryptographically distinguish
    between parameters autonomously synthesized by an intermediary agent and parameters
    explicitly reviewed, approved, or modified by an authorized human. Furthermore,
    redirect-based authorization flows impose prohibitive user experience friction
    for high-frequency Human- in-the-Loop (HITL) interactions. This document specifies
    the Proof-of-Intent (PoI) Core Protocol, a stateless, single-hop cryptographic
    framework building on JSON Web Signature (JWS, RFC 7515), Proof-of-Possession
    Key Semantics for JWTs (RFC 7800), JSON Web Token Best Current Practices (RFC
    8725), JSON Canonicalization Scheme (JCS, RFC 8785), OAuth 2.0 Rich Authorization
    Requests (RAR, RFC 9396), OAuth 2.0 Step-Up Authentication Challenge Protocol
    (RFC 9470), and W3C WebAuthn. PoI Core defines: (1) short- lived, client-generated
    Ephemeral Intent Keys certified at login and rotated via Proof-of-Possession key
    chaining; (2) Resource Server- signed Intent Challenge Objects binding canonical
    action parameters to human-readable display facts; (3) multi-tier assurance attestations
    spanning zero-friction session keys to hardware security tokens; and (4) stateless
    verification and countersigned audit receipts for single-hop APPROVE, REJECT,
    and within-authority SUPERCEDE decisions. Multi-hop chained escalations, asynchronous
    intent escrowing, and concurrent multi-approver conflict resolution are specified
    in the companion extension document, draft-williams-oauth-poi-chained-state- 00.</p>"

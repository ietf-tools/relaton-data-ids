abstract:
- content: "<p>This document specifies the carbon.txt convention, a machine-readable
    format for publishing links to disclosures concerning the environmental impact
    of an organization's digital / ICT operations at a predictable location on the
    web. Carbon.txt is a TOML document that acts as an index: it declares where an
    origin's impact disclosures (Annual reports, Sustainability policies, Third party
    certifications, Quantitative measurements or estimations) may be found, and optionally
    lists upstream service providers whose own disclosures may be relevant to the
    origin's environmental impact. Carbon.txt does not carry numeric impact metrics
    or specific claims about impacts itself; it links to documents that do. In addition
    it defines a discovery mechanism by which certain origins may delegate their carbon.txt
    implementation to another.</p>"

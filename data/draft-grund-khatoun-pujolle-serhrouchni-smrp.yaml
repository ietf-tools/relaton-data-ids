abstract:
- content: "<p>Pseudonymous Intelligent Transport Systems (ITS) credentials are short-lived
    and numerous. Verifiers decide at message-reception time, often without connectivity,
    which makes revocation status hard to deliver. This document specifies Stapled
    Merkle Revocation Proofs (SMRP). For each partition of a revocation domain, an
    authorized issuer signs a compact checkpoint that commits to the complete sorted
    set of revoked credential tokens. A credential holder staples a logarithmic-size
    proof that its token is absent from that set, and a verifier checks the proof
    offline against the current checkpoint. Freshness is carried by the checkpoint,
    which is public, shared by every credential of the partition, and deliverable
    by any party. Within one stream, a proof remains usable across checkpoints for
    as long as the set commitment is unchanged and the current checkpoint is admissible.
    The same commitment supports proofs of revocation that anyone can relay, complete
    authenticated lists for capable verifiers, and public audit. The document defines
    a credential identity that does not depend on the certificate signature, a Merkle
    tree over the intervals of the sorted revoked set with one authentication path
    per proof, the checkpoint and staple encodings, conservative time validation with
    a conditional bound on the last affirmative decision after revocation, verifier
    state with terminal revocation, and carriage in V2X secured messages and in TLS
    1.3. It positions SMRP against the companion pOCSP mechanism: pOCSP signs one
    statement per certificate and validity window, whereas SMRP signs one statement
    per partition and issuance period. This document is Experimental and allocates
    no identifier in ETSI, IEEE, or SAE namespaces.</p>"

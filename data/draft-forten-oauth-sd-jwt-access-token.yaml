abstract:
- content: "<p>This document adds selective disclosure to JWT access tokens without
    changing the form of the Authorization header or how the token is validated. The
    RFC 9068 token is sent as today, with some of its claims selectively disclosable
    as defined by SD-JWT (RFC 9901); the Disclosures and the optional Key Binding
    JWT travel in two new HTTP fields. A recipient that does not implement this profile
    ignores the fields and processes the token as an ordinary JWT access token. The
    token itself then carries no selectively disclosable value, and the holder chooses
    per request which values to reveal.</p>"

abstract:
- content: "<p>This document describes the mechanism Umarise uses for temporal anchoring
    of digital artifacts: cryptographic hashes are committed to the Bitcoin blockchain
    via the OpenTimestamps protocol. The resulting proof is independently verifiable
    by any party with access to independently validated Bitcoin chain data, without
    contacting Umarise or any other anchoring service. The document is published so
    that other parties can produce and verify such proofs. The SCITT Architecture
    is used as the primary integration example; no changes to it are required.</p>"

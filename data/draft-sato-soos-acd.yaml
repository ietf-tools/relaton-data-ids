abstract:
- content: "<p>A regulated resource provider -- a bank, a government API, a healthcare
    records system -- receives a request from an AI agent. The agent claims to operate
    under a constitutional compliance policy and a valid mandate. The resource provider
    has no mechanism to verify these claims. Without a machine-verifiable compliance
    disclosure, the resource provider cannot confirm the agent's governing law, its
    active prohibition set, its audit trail reference, or its principal hierarchy
    -- before granting access. This document defines the Agent Compliance Disclosure
    (ACD) Protocol: a machine-to-machine compliance handshake that must complete before
    an AI agent is granted access to a regulated resource class. ACD defines the ACD
    Record schema (a three-layer structured disclosure produced by the SOOS kernel,
    covering legal identity, constitutional compliance, and principal hierarchy),
    the ACD Presentation Protocol (the query/response exchange between a resource
    provider and the SOOS kernel), the ACD Trust Hierarchy (operator-declared trust
    levels and Audit Principal credentials), the ACD-to-MJWT binding (ACD MUST reference
    the session MJWT jti), and the GAR integration (ACD presentation events as Authority
    Lifecycle Events). ACD Records are produced exclusively by the Governing Enforcement
    Component (GEC), signed by the kernel's KIA private key, and logged in the Governance
    Audit Record (GAR). LLM self-report of compliance posture is architecturally insufficient
    and MUST NOT be used as an ACD disclosure surface. ACD is the inbound complement
    to the Resource Governance Protocol (RGP): where RGP governs outbound capability
    discovery, ACD governs inbound compliance verification. Together they define the
    complete resource access governance flow for SOOS-governed agents.</p>"

abstract:
- content: "<p>This document specifies ProtectChain, a permissioned, hash-chained
    and cryptographically signed ledger whose purpose is to produce verifiable evidence
    that a given digital work already existed no later than a given point in time,
    under an authorship claim made by an identified account. ProtectChain records
    only cryptographic digests and pseudonymous identifiers; the work itself never
    enters the ledger. Because all initial authorities may be operated by a single
    organization, every block is also anchored to independent public time references,
    so that the upper bound on a record's date does not rest on the operator's assertion.
    This document is deliberately explicit about the limits of the evidence produced:
    an anchor establishes that data existed _no later than_ a given instant; it does
    not establish the exact instant of creation, nor does it establish authorship
    or originality.</p>"

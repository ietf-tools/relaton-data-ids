abstract:
- content: "<p>In certain scenarios, such as load balancing, P2MP and DetNet, it is
    required that the delay difference among a set of paths to be controled within
    an expected range. This document describes extensions to PCEP to use the delay
    difference as a constraint for end-to-end path computation.</p>"

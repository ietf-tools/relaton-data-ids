abstract:
- content: "<p>The draft aims to provide technical details of CVE-2026-33697 (https://www.cve.org/CVERecord?id=CVE-2026-33697)
    and EUVD-2026-16488 (https://euvd.enisa.europa.eu/enisa/EUVD-2026-16488), which
    is substantial technical evidence of how *intra*-handshake attestation fails in
    practice, even _without physical access_. Moreover, since continuous attestation
    is generally required, *intra*-handshake attestation adds *unnecessary complexity*.
    The results are backed by the research [Intra-handshake.fail] and the artifacts
    [Intra-handshake.fail-repo] in state-of-the-art tool, ProVerif, under Apache-2.0
    license for reproducibility, and have been acknowledged by the relevant stakeholders.</p>"

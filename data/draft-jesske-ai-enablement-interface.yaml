abstract:
- content: "<p>This document complements emerging AI agent communication protocols
    by defining a generic enablement interface between multimedia communication platforms
    and AI applications, agents, LLM, or other AI-based services. It describes how
    communication capabilities, including voice, video, messaging, media streams,
    and media processing, can be exposed to AI entities without defining a new agent-to-agent
    communication protocol. The interface is particularly applicable where an AI service
    is not itself a communication endpoint, but is invoked by a communication platform
    to process or enhance an existing communication service. Examples include live
    translation, call summarization, contextual assistance, fraud detection, and media
    enhancement. The interface is platform-agnostic and extensible. SIP-based networks
    and the 3GPP IP Multimedia Subsystem (IMS) are examples of communication platforms
    to which this approach can be applied.</p>"

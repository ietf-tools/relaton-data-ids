abstract:
- content: "<p>This document specifies the use of MPEG Media Transport (MMT) as a
    container format for Media over QUIC (MoQ). MMT carries media over broadcast (ATSC
    3.0, ARIB STD-B60), multicast, and unicast (QUIC/ WebTransport) networks. This
    specification defines the mapping of MMT packets to MoQ objects, interaction with
    Application-Layer FEC, the derivation of MoQ catalogs from MMTP signaling, and
    compatibility considerations for both ATSC 3.0 and ARIB STD-B60 systems.</p>"

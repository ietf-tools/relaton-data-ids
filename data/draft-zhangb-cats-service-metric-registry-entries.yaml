abstract:
- content: <p>This document defines the initial set of registry entries for Computing
    Service Metrics used in Computing-Aware Traffic Steering (CATS). These metrics,
    including Global Available Slots (GAS), Computing Time, Cost, Reputation, Security
    Label, and Capability, provide service-oriented abstractions that complement the
    existing CATS Level 0/Level 1/Level 2 normalized metric framework defined in [I-D.ietf-cats-metric-definition].
    This document follows the registry format and separation pattern established by
    [RFC8911] and [RFC8912], populating a new IANA registry titled "CATS Computing
    Service Metrics" with formal entries for each metric defined in [I-D.zhangb-cats-service-metrics-op].</p>

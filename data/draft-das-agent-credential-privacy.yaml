abstract:
- content: "<p>Giving an AI agent a credential usually means giving it everything
    that credential can do. When Apple Siri, Google Gemini, enterprise copilots, coding
    agents, or third-party AI tools act with a user's OAuth tokens, API keys, signing
    keys, or logged-in sessions on iOS, iPadOS, macOS, Android, cloud APIs, developer
    tools, financial services, and telecom systems, a prompt-injected or confused
    agent can export data, call APIs, sign transactions, write poisoned entries into
    its own long-term memory, or leak information piece by piece to different recipients.
    iOS Keychain and the Secure Enclave, Android Keystore, sandboxing, token authentication,
    proof of possession, and a successful approval each protect something real, but
    none of them establishes authority for the exact outgoing data, recipient, or
    resource effect. This document, Part 9 of a twelve-part series, specifies how
    credentials and data are used only for the specific operation that was authorized.
    It describes protected secret custody in which the agent never receives the raw
    secret; operation-bound credential activation; continuity of credential generation
    and source authority across key and token rotation; independent Finality Sink
    inspection of the real outgoing request; recipient-scoped, cumulative, correlation-aware
    disclosure accounting, including derived summaries; provenance of source-derived
    information; retrieval-time provenance and write authority for agent memory and
    retrieval-augmented generation stores; and non-replayable consumption of finality.
    It does not assume that a third-party mobile application can mediate other applications
    without their cooperation. Reference algorithms, fourteen threat models, and thirty-two
    reproducible tests, including current Android and iOS authorized-call cases, are
    included. Part 1 of the series defines the shared terminology and common workflows.
    The document relates these mechanisms to OAuth 2.0 Rich Authorization Requests,
    Resource Indicators, Token Exchange, Demonstrating Proof of Possession (DPoP),
    and mutual-TLS sender constraints; the Workload Identity in Multi-System Environments
    (WIMSE) architecture and the WIMSE working group's AI Identity Management System
    draft on agent authentication and authorization; Authentication and Authorization
    for Constrained Environments (ACE); CBOR Object Signing and Encryption (COSE);
    Remote ATtestation procedureS (RATS); Supply Chain Integrity, Transparency, and
    Trust (SCITT); and HTTP semantics. These are treated as qualified inputs rather
    than final authority, without claiming working-group adoption or IETF consensus.
    Industry alignment covers Apple iOS, iPadOS, and macOS with Siri, Keychain, Secure
    Enclave, and App Intents; Google Android with Gemini, Keystore, app permissions,
    and inter-process communication; Samsung Bixby, Microsoft Copilot, and Amazon
    Alexa; Microsoft Windows and Azure; Amazon Web Services and other cloud identity
    platforms; cloud key-management and hardware security module signing services;
    agent platforms from OpenAI, Anthropic, Google, and Meta; Model Context Protocol
    connectors and their OAuth-based authorization; passkeys and WebAuthn; password
    managers and autofill; enterprise SaaS connectors; open banking and consent-based
    data sharing, including India's Account Aggregator framework; digital wallets
    and payment APIs; healthcare data; human-resources and recruiting agents; source-code
    secrets and CI/CD; personal assistant memory; advertising and analytics data sharing;
    the EU Digital Identity Wallet; NVIDIA, Qualcomm, Arm, and Huawei hardware; telecommunications
    messaging; RAG and vector databases; and public-sector systems. For each, the
    document states the technical effect: a secret is exercised, or data is released,
    only for the specific authorized operation and recipient, and only within the
    remaining disclosure budget. Product names are illustrative and imply no endorsement
    or implementation by any vendor. For the EU Artificial Intelligence Act (Regulation
    (EU) 2024/1689), and alongside data-protection-by-design obligations under the
    General Data Protection Regulation, operation-bound credential use and recipient-scoped
    disclosure records can help providers and deployers address cybersecurity, record-keeping,
    and risk-management requirements where those obligations apply; this is a technical
    mapping, not a conformity claim or legal advice.</p>"

abstract:
- content: "<p>The Concise Binary Object Representation (CBOR, RFC 8949, STD 94) is
    a data format whose design goals include the possibility of extremely small code
    size, fairly small message size, and extensibility without the need for version
    negotiation. This document registers a range of sixteen CBOR simple values (0
    to 15) that can be shared by different specifications using them for CBOR transformations,
    such as compression or templating, in a non- conflicting way. This allows current
    and future specifications to reuse the smallest (single-byte) simple values range
    while defining their own ways to use them for achieving their goals. This document
    updates RFC 8949.</p>"

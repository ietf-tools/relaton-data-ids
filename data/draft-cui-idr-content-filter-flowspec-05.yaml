abstract:
- content: "<p>The BGP FlowSpec mechanism enables the distribution of traffic filter
    policies (traffic filters and actions) via BGP, facilitating DDoS traffic filtering.
    The IP filter components defined for FSv1 and the FSv2 IP Basic Filter Families
    primarily match fields in the IP and transport-layer headers, which may not adequately
    address volumetric DDoS attack traffic characterized by fixed patterns within
    the packet content. This document defines a Packet Content Filter Component for
    FSv1 and FSv2. The match is encoded using OType, Offset, Content Length, Content,
    and Mask fields in the FlowSpec NLRI. The FSv1 encoding additionally carries a
    PType field. This new component aims to leverage network devices such as routers
    and switches to support controlled traffic handling, traffic optimization, and
    mitigation of simple volumetric DDoS attacks, reducing the overall processing
    cost of carrier networks.</p>"

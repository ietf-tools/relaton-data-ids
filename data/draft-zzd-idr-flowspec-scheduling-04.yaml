abstract:
- content: "<p>BGP Flow Specification allows conveying flow specifications and associated
    traffic actions/rules to perform different actions based on traffic characteristics.
    One use case is steering a specific flow onto a designated path. However, in some
    scenarios, operators wish to chnge traffic forwarding paths over time. This document
    extends BGP Flow Specification with scheduling time information to match packets
    arriving within different time slots. With this extension, the headend can apply
    different actions to the same traffic at different times.</p>"

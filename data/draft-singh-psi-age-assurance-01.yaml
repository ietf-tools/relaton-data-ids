abstract:
- content: "<p>This document defines PSI-Age, a domain profile of Proof of Stateful
    Integrity (PSI) for age assurance decisions, so that a relying party can later
    show which provider decision it relied on. This document is superseded in substance
    by draft-singh-apex-psi-09 and is retained only for continuity. Each record is
    sealed as a PSI receipt so that later alteration, reordering, or removal is detectable.
    Only digests are sealed. PSI-Age shows integrity and ordering only; it does not
    show the age of any person, the accuracy of the method, or compliance with any
    age assurance law. The title of revision 00 claimed a zero-knowledge construction.
    No zero-knowledge proof system is specified; the claim is withdrawn.</p>"

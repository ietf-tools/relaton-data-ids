abstract:
- content: "<p>This document specifies a post-quantum cryptographic discipline for
    x402 STARK receipts. The discipline applies on two layers: (a) proof integrity
    via hash-based proving systems (the Stwo Circle STARK M31 reference implementation),
    which are post-quantum sound under standard cryptanalytic assumptions, and (b)
    signature integrity via the hybrid ES256K + ML-DSA-65 dual-signed receipt variant
    ([FIPS204]). It maps the hybrid-pqc receipt variant of the x402 STARK Receipt
    Format Extension ([STARK-RECEIPTS]) to the NIST PQC migration roadmap and to the
    EU eIDAS 2.0, ANSSI, and BSI migration timelines for the 2025-2030 window. Reference
    runners are published as the vauban-x402-jcs-conformance and vauban-x402-canonical
    Rust crates. Companion documents are [STARK-RECEIPTS] (receipt format) and [VPSF-ALGEBRA]
    (composability grammar).</p>"

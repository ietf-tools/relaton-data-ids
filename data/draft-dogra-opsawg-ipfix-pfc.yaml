abstract:
- content: "<p>Priority-based Flow Control (PFC) pauses Ethernet traffic by priority.
    This document defines two IP Flow Information Export (IPFIX) Information Elements
    and an Options Template record pattern for per-priority totals of received and
    transmitted PFC control frames.</p>"

abstract:
- content: "<p>This document specifies how to use Hamming Quasi-Cyclic (HQC), a code-based
    Key Encapsulation Mechanism (KEM), in the Internet Key Exchange Protocol Version
    2 (IKEv2). HQC can be used alone or together with other key exchanges to derive
    IKE and Child SA keys that resist attacks by quantum computers. This document
    registers three Key Exchange Method identifiers.</p>"

abstract:
- content: "<p>Enterprises hold large certificate inventories, yet few of their certificates
    are managed through ACME. Many workloads, such as CI/CD jobs, containers, virtual
    machines, cloud services and the automation that manages appliances, cannot complete
    ACME's challenges. Certification Authorities (CAs) and Certificate Lifecycle Management
    (CLM) systems that serve them fall back to External Account Binding (EAB) with
    long-lived shared secrets, or to proprietary APIs. OpenID Connect (OIDC) provides
    a short-lived cryptographically verified identity token to the workload. This
    document lets an ACME client send that token with each newOrder request. The token
    can be bound to the request's nonce and account key through its audience claim,
    so identity providers need no changes. The CA/CLM verifies the token and, under
    its own policy, may pre-authorize the identifier in the order, as RFC 8555 already
    allows. This replaces the EAB secret with a fresh, per-order proof of workload
    identity. It does not change how CAs validate control of identifiers.</p>"

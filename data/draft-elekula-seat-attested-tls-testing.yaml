abstract:
- content: "<p>This document defines a framework for reproducible interoperability
    and security evaluation of implementations that integrate remote attestation with
    TLS 1.3 and DTLS 1.3. It complements protocol and architecture specifications
    by defining test profiles, a common result model, cross-implementation procedures,
    negative tests, and measurements at the boundary between transport authentication,
    attestation appraisal, authorization, and application-data release. In addition
    to per-connection attestation, the framework evaluates reusable Attestation Results
    and cross-connection trust-continuity mechanisms, including deployments in which
    an attestation endpoint and application-serving endpoint are distinct. It addresses
    key custody and derivation, target and workload identity, state drift, credential
    lifecycle, multi-relying-party isolation, proxy topology, session resumption,
    early data, privacy, and failure containment. This document does not define a
    new attestation architecture, Evidence format, TLS or DTLS extension, cryptographic
    key schedule, or remote-attestation protocol. It specifies an evaluation framework
    for comparing implementations and identifying interoperability and security gaps
    in declared profiles.</p>"

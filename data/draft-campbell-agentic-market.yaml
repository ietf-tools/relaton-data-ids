abstract:
- content: "<p>This document specifies the Agentic Hypercall Protocol (AHP), a minimal
    convention for automated software agents to discover, invoke, pay for, and rate
    tools over plain HTTP. It replaces draft-campbell- agentic-http-00 and extends
    it in three directions. First, it formalizes the HTTP 402 (Payment Required) status
    code as a native economic layer with pluggable payment rails (Lightning L402,
    Cashu ecash, and prepaid balances). Second, it specifies a blind relay -- the
    Gateway -- through which a consumer and a provider can transact end-to-end encrypted:
    the relay verifies identity, settles payment, and forwards sealed payloads it
    cannot read. Third, it specifies signed receipts, settlements, and rating attestations
    that let reputation be weighted by money actually settled rather than by tokens
    or votes, and that ride with a provider's key rather than with any single relay.
    The result is an open market in which agents can buy compute, information, and
    services from one another without an SDK, a walled garden, or a native token.</p>"

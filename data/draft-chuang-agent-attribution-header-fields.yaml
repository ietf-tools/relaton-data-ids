abstract:
- content: "<p>When human users communicate with autonomous computer agent users,
    the human users should be able to identify that communication as coming from agent
    users and know which humans are responsible for the agent users. This document
    specifies email header fields that an email sender can use to transmit agent user
    attribution information to email receivers. The first header field is human readable
    and specifies the agent's responsible humans' email address. The second header
    field is machine readable and specified in JSON attribution information.</p>"

abstract:
- content: "<p>This document describes the architecture of the Human Agency Continuity
    Protocol (HACP): a pre-execution authorization contract for tool-using agents.
    HACP separates human intent, deterministic evaluation, cryptographic decision
    binding, and enforcement so that an agent cannot silently reinterpret authorized
    action after a decision is issued. This document is Informational. It is not an
    Internet Standard. It does not activate Enforcement revision 2 and does not claim
    general URI-normalization conformance. The acronym HACP in this series means Human
    Agency Continuity Protocol. A separately posted individual Internet-Draft, draft-
    sunyi-hacp-protocol, uses the same four letters for a different protocol (Hardware
    Agent Capability Protocol) by a different author. The present author has no affiliation
    with that document.</p>"

abstract:
- content: "<p>HTTP applications frequently expose one logical object through several
    representations or resources. Ordinary HTTP entity tags identify selected representations;
    they do not, by themselves, provide a conditional-update mechanism spanning different
    request targets. This document specifies Agentic State Transfer (AST), an HTTP
    profile for preventing lost updates to shared application state. AST Core requires
    a client to mutate the State-Bearing Resource using the strong ETag of its State-Bearing
    Representation and the standard If- Match field. AST Semantic uses Semantic-ETag
    and If-Semantic-Match when a protected mutation targets a different resource or
    representation in the same concurrency domain. The profile also defines state
    discovery, atomic compare-and-commit behavior, conflict handling, deferred processing,
    caching constraints, and security requirements.</p>"

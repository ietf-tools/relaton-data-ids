abstract:
- content: "<p>This document defines the model_attestation block of the Agent Action
    Capsule (AAC) profile — referenced twice by the base profile but never defined
    there — and, within it, the compute_attestation container that already carries
    runtime extensions in the field: the model-serving runtime, the agent's own execution
    environment (architectural pattern, orchestration framework, sandbox confinement,
    invoked tool version), and host hardware, together with model and weights claims.
    Every claim carries an explicitly declared source; a verifier grades claims by
    how they were observed and never infers a stronger grade than the evidence supports.
    Hardware or platform attestation, when present, is cited by content-addressed
    reference to a foreign attestation record and verified with that record's own
    verifier.</p>"

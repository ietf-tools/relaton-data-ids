abstract:
- content: "<p>This document defines org.agentactioncapsule.otel, a namespaced payload
    extension for the Agent Action Capsule profile. The extension carries OpenTelemetry
    trace and span context alongside a sealed agent-action record so that the Capsule
    and the observability spans describing the same action can be joined after the
    fact. It maps the OpenTelemetry Generative AI semantic conventions onto Capsule
    fields where a mapping is well defined and states which OpenTelemetry values MUST
    NOT enter a Capsule at all. The extension does not alter Capsule verification:
    a verifier that does not implement it treats the block as informational.</p>"

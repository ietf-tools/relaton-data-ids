abstract:
- content: "<p>BGP Flow Specification (BGP-FS) propagates traffic Flow Specifications
    and Traffic Filtering Actions using BGP NLRI and BGP Extended Community encodings.
    This document specifies a new BGP-FS component type to support community-level
    filtering within a single administrative domain. The match condition filters traffic
    based on the BGP Community attributes associated with the route matching the packet's
    source IP address.</p>"

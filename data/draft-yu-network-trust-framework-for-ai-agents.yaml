abstract:
- content: "<p>AI agents are expected to communicate across platforms, organizations,
    clouds, edge environments, and administrative domains. Existing agent mechanisms
    mainly focus on application-layer discovery, capability description, identity,
    authorization, tool invocation, and agent-to-agent collaboration. These mechanisms
    are important, but they often treat the IP network as a transparent connectivity
    substrate. This document describes a framework for using network-layer and network-control
    capabilities to enhance trust for AI agent communication after agent discovery.
    The framework introduces an Agent Interconnection Hub, trusted transport tags,
    policy-driven path selection, and audit indexing as building blocks for recognizable
    identity, accountable paths, enforceable policy, and traceable invocation records.
    This document does not define a new agent discovery protocol, a new application-layer
    agent collaboration protocol, a new authentication or authorization mechanism,
    a new IPv6 extension header, or a new SRv6 behavior. It provides architectural
    considerations and requirements for future work.</p>"

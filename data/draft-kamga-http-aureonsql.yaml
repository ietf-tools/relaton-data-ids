abstract:
- content: "<p>This document specifies AUREON, a high-performance database-over-HTTP
    protocol. AUREON leverages HTTP's extensible method mechanism (RFC 9110) to introduce
    domain-aware custom tokens for relational database operations, Data Definition
    Language (DDL) governance, Data Control Language (DCL) permissions, and procedural
    Data Action Language (DAL) workflows. Furthermore, this document defines the complete
    IANA registration templates for the AUREON method suite and media type parameters.</p>"

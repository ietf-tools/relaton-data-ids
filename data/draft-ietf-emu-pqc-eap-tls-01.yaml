abstract:
- content: "<p>This document specifies the use of post-quantum cryptography in TLS-
    based EAP methods, including the Extensible Authentication Protocol with Transport
    Layer Security (EAP-TLS), EAP Tunneled TLS (EAP-TTLS), Protected EAP (PEAP), and
    EAP Tunnel Method (TEAP). It also addresses challenges related to large certificate
    sizes and long certificate chains, as identified in [RFC9191], and specifies a
    mechanism to reduce TLS handshake size.</p>"

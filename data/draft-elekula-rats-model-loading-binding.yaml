abstract:
- content: "<p>AI inference services increasingly depend on combinations of model
    artifacts, inference runtimes, execution environments, hardware accelerators,
    and security-relevant configuration. A relying party authorizing an AI service
    to access protected resources may require evidence that an approved model artifact
    was actually loaded and used by an acceptable inference runtime. Measuring a model
    artifact and measuring an inference runtime independently does not establish that
    the measured artifact was the artifact loaded by the measured runtime. Similarly,
    attesting an execution environment does not, by itself, establish which model
    processed a particular inference request. This document examines these problems
    using the Remote ATtestation procedureS (RATS) architecture specified in RFC 9334.
    It distinguishes execution-instance attestation from per-inference operation evidence
    and describes a candidate measurement and binding approach using a protected model-loading
    mechanism, trusted measurement collection, and cryptographically protected evidence.
    It examines how the Entity Attestation Token (EAT), specified in RFC 9711, and
    the measured-component information model specified in RFC 10013 may represent
    relevant measurements and component information. It also examines the relationship
    between this proposal and existing work on attested AI agent identity and application-layer
    action evidence. The document does not define a new attestation protocol, EAT
    profile, registered Claim, Evidence conveyance protocol, or appraisal-policy language.
    Its objective is to determine whether existing RATS mechanisms can support interoperable
    appraisal of AI model-to-runtime relationships and to identify any remaining requirements
    for standardization. The document does not claim that attestation establishes
    model correctness, safe behavior, or the correctness of generated outputs.</p>"

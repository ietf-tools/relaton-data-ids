abstract:
- content: "<p>This document provides an architectural overview of the Secured Digital
    Lifecycle Protocol (SDLP). SDLP defines a structured model for representing, identifying,
    tracking, and securing digital objects across their entire lifecycle. This overview
    describes the SDLP object model, the relationship between SDLP identity, lineage,
    lifecycle, and security architecture, and the rationale for distributing SDLP
    into multiple coordinated specifications. This document serves as the entry point
    for readers and reviewers seeking to understand the SDLP framework as a whole.</p>"

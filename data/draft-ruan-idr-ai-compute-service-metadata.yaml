abstract:
- content: "<p>This document defines four AI inference-specific Sub-TLVs for the BGP
    Edge Metadata Path Attribute specified in [I-D.ietf-idr-5g-edge-service-metadata].
    They advertise model capabilities, aggregated inference latency, optional cost
    preference, and selected long-lived KV cache prefix identifiers. Authorized CATS
    Path Selectors (C-PSes) and other policy decision functions may use this information
    to select suitable service contact instances and forwarding paths. This document
    reuses the existing optional non- transitive attribute.</p>"

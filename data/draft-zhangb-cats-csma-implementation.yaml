abstract:
- content: "<p>The Computing-Aware Traffic Steering (CATS) framework introduces the
    CATS Service Metric Agent (C-SMA) as the functional entity responsible for collecting
    service capabilities and status, and reporting them to CATS Path Selectors (C-PSes).
    While existing drafts define the metrics and high-level framework, the concrete
    functional behavior, internal architecture, and operational procedures of the
    C-SMA remain underspecified. This document fills that gap by defining the functional
    implementation of the C-SMA. Specifically, it specifies how the C-SMA collects
    metrics from multiple Service Contact Instances (SCIs) within a service site;
    how it validates, and caches these metrics; how it adapts to various control-plane
    protocols for metric distribution; how it enforces local policies and security
    policies; and how it maintains synchronization with the C-PS under dynamic conditions.
    This document complements [I-D.ietf-cats-framework] and [I-D.zhangb-cats-service-metrics-op]
    by providing the operational execution layer for the C-SMA.</p>"

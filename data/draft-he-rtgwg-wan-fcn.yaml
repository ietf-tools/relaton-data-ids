abstract:
- content: <p>Wide Area Network (WAN), when interconnecting RoCEv2 networks, needs
    to meet the performance requirements of "high throughput, low latency, and minimal
    packet loss". This document describes a solution to Fast Congestion Notification
    (FCN) in WAN interconnecting RoCEv2 networks, especially applicable to tunnel
    encapsulation.</p>

abstract:
- content: "<p>This document presents system and Radio Access Network (RAN) requirements
    for 3GPP Artificial Intelligence/ Machine Learning (AI/ ML) and AI Agents for
    the 6th generation mobile network, or 6G. Requirements depend on the types and
    application areas of agents. We describe some of them defined with each type and
    state their requirements. RAN 6G requirements are discussed including AI related
    requirements. AI Agent implementation efforts, initiatives on how APIs can be
    discovered, how inter-domain and intra domain AI Agents can be discovered using
    DNS lookup and agent protocol design are explained.</p>"

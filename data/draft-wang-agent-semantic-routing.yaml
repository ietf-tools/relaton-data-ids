abstract:
- content: "<p>With the deep integration of artificial intelligence and network technologies,
    the Internet of agents has become an important direction for the evolution of
    the next-generation Internet. The connection paradigm of the traditional Internet
    centered on “location addressing” can hardly meet the demands of the Internet
    of agents for “business-driven and service-as-connection”. The service semantic
    routing technology system, paradigm evolution, core collaboration requirements
    in the Internet of agents, and the limitations of traditional routing technologies
    were systematically elucidated. It was clarified that semantic routing was the
    key to realizing the transformation from “service demand” to “resource matching”.
    The solutions for four core semantic routing mechanisms in the Internet of agents,
    namely fuzzy search based on tag matching and flexible adaptation, precision-named
    DNS (domain name system) for “service- domain name” mapping, business-layer network
    identification based on Anycast, and URL (uniform resource locator) semantic routing
    with application-layer semantic encapsulation were analyzed in depth. Finally,
    the technical characteristics of each solution were summarized and compared, providing
    an important reference for subsequent research.</p>"

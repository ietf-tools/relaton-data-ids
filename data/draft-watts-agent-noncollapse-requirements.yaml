abstract:
- content: "<p>This document defines architectural non-collapse requirements for agent
    systems that consume evidence, provenance, model outputs, or other machine-readable
    claims before consequential actions. It requires implementations to keep integrity,
    provenance, evidence qualification, authorization, and execution as distinct states;
    to represent unresolved required evidence explicitly; and to preserve issued evaluation
    records append-only. The document defines no new transport protocol and no IANA
    registrations.</p>"

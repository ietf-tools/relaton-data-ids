abstract:
- content: "<p>This document describes use cases for integrating remote attestation
    (RA) with secure channel protocols, initially TLS and DTLS. Peer authentication
    establishes a peer's identity; RA supplies Evidence for appraisal of its state.
    The document identifies protected decisions and required assurance, describes
    the attacks and failure modes that threaten them, and derives properties to guide
    protocol designs in the SEAT working group. These properties address association
    of attested state with a peer and connection, freshness, re-evaluation, negotiation,
    and disclosure of attestation material.</p>"

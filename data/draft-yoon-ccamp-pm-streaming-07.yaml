abstract:
- content: "<p>This document describes how the generic collection measurement YANG
    data model and its interval-capability companion model are applied to common transport
    equipment. It is informational. It defines a small YANG module of transport performance
    parameters, organizes those parameters into maintenance and QoS profiles, and
    gives end-to-end examples that show capability discovery followed by YANG-Push
    subscription, notification, and threshold reporting for a transport profile.</p>"

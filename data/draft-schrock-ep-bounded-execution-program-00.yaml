abstract:
- content: "<p>An authorization for one action does not by itself authorize an open-
    ended agent plan. This document defines an Experimental profile for a signed,
    finite, versioned directed acyclic graph of consequential action occurrences.
    The program binds a total retained-history ceiling. Each node binds an exact action
    or a pinned action-matching profile, an action- specific Trust Program, outcome-specific
    dependencies, an occurrence ceiling, and fixed charges against aggregate attempt
    budgets. A conforming program-aware admission store evaluates reachability and
    budgets in the same linearizable transaction domain as the ordinary one-time execution
    right. It uses store-owned authorizer trust roots, clock, authenticated profile-match
    verification, and current program status; seals a deterministic execution-program
    resource into the AdmissionSnapshot; and fences the program's independent authorization
    digest against ordinary-path admission. The profile does not establish that natural-language
    intent was understood, that a plan is safe or lawful, that provider or effect
    evidence is true, or that every mutation path was mediated.</p>"

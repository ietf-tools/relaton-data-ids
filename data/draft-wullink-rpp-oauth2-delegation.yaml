abstract:
- content: "<p>This document describes how OAuth 2.0 [RFC6749] enables a third party,
    such as a DNS Operator, to manage delegation (name server) details for a domain
    name on behalf of the registrant using the RESTful Provisioning Protocol (RPP).
    It extends the RPP OAuth 2.0 authorization model defined in [I-D.wullink-rpp-oauth2]
    with mechanisms specific to third-party delegation management via RPP [I-D.ietf-rpp-core].</p>"

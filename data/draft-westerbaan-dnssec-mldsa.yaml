abstract:
- content: "<p>This document describes how to specify Module-Lattice-Based Digital
    Signature Algorithm (ML-DSA) keys and signatures in DNS Security (DNSSEC). It
    uses the ML-DSA-44 parameter set defined in FIPS 204. ML-DSA-44 is believed to
    be secure even against adversaries in possession of a cryptographically relevant
    quantum computer.</p>"

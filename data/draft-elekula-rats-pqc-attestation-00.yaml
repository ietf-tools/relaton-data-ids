abstract:
- content: "<p>This document analyzes post-quantum cryptographic considerations for
    Remote ATtestation procedureS (RATS) Evidence, Attestation Results, Endorsements,
    and Reference Values. It describes the distinction between post-quantum key establishment
    and post-quantum authentication of attestation artifacts; identifies integrity,
    provenance, freshness, and session-context properties that must remain independently
    verifiable; and provides implementation guidance for artifact sizing, bounded
    processing, transformation, transport, failure handling, and privacy. The document
    does not define a new cryptographic algorithm, attestation token, Evidence format,
    transport protocol, TLS extension, or key-establishment mechanism. It relies on
    existing RATS architecture and data models, existing COSE and JOSE mechanisms,
    and protocol-specific work in the Secure Evidence and Attestation Transport (SEAT)
    Working Group. The intended result is a set of interoperable considerations that
    RATS profiles and attestation-system designers can apply when deploying post-quantum-capable
    attestation systems.</p>"

abstract:
- content: "<p>This document defines a YANG data model for Multi-Vantage Path Snapshots
    (MVPS): vendor-neutral, multi-vantage enriched traceroute observations whose reporting
    model is aligned with RFC 9198 (Advanced Unidirectional Route Assessment). The
    model is the normative publication of the MVPS bundle as a YANG module and is
    the subtree that the MVPS telemetry-export specification subscribes to over YANG-Push.
    The module is CORE-neutral: it carries measurement facts only. It makes no performance,
    scoring, or detection claim. All properties stated in this document are structural
    and are backed by a machine-checkable receipt.</p>"

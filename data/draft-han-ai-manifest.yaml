abstract:
- content: "<p>This document specifies the AI Manifest, a JSON format with which a
    website operator publishes an AI Friction-Recovery Manifest (AFRM): a description
    of the user-interface (UI) patterns on its own origin that predictably stall autonomous
    AI agents, together with constrained recovery steps and site-specific input hints.
    An agent that drives a browser on behalf of a user retrieves the manifest from
    a well-known URI and consults it when it encounters friction, instead of rediscovering
    the same site-specific behavior by trial and error. The manifest is untrusted
    input, interpreted by the agent's runtime and never shown to its language model.
    Its operative content is drawn from a closed vocabulary that cannot enter text,
    upload files, or reach another origin. Every action derived from a manifest passes
    through a policy enforcement point that is not a language model, and steps conventionally
    bound to a decision require the user's confirmation by default. Security controls
    such as access denials, rate limits, CAPTCHAs, authentication challenges, and
    confirmation dialogs are stop conditions, never traps to be recovered from. Optional
    publisher signatures and agent-configured reputation services provide authenticity
    but never imply safety and never relax these requirements. This -03 revision replaces
    the trust model of draft-han-ai-manifest- 02, removes the inline and vendor-path
    discovery methods from the protocol, and restructures the schema around a closed
    action vocabulary. Preliminary measurements are reported in an appendix.</p>"

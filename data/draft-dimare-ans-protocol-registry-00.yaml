abstract:
- content: <p>The Agent Name Service (ANS), described in draft-narajala-courtney-
    ansv2, identifies the interaction protocol an agent speaks by a protocol identifier
    carried in the "p" field of the agent's "_ans" DNS record and Trust Card. ANS
    defines the values "a2a", "mcp", and "http" by enumeration, and its IANA Considerations
    create no registry, leaving no interoperable procedure for adding a new protocol
    identifier. This document requests that IANA create an "ANS Protocol Identifiers"
    registry, registers the values already in use, and registers "pay" as the protocol
    identifier for agent payment.</p>

abstract:
- content: "<p>When multiple links in a network have the same metric, they can serve
    as ECMP equivalent links for load balancing during forwarding. However, slight
    fluctuations in metric values can prevent the formation of ECMP equivalent links,
    leading to the idle state of suboptimal links and thus wasting bandwidth resources.
    This document proposes a metric normalization method by advertising metric normalization
    parameters corresponding to a specific Metric- Type for Flexible Algorithm. During
    route calculation, slight fluctuations across multiple links are adjusted according
    to these normalization parameters, making the computed metric values more consistent.
    This approach enables the formation of ECMP equivalent links and promotes load
    sharing in the forwarding process.</p>"

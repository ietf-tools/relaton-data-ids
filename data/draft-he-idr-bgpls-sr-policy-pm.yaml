abstract:
- content: "<p>This document defines several Type-Length-Values (TLVs) to advertise
    the performance metrics for Segment Routing (SR) Policy using BGP Link State (BGP-LS).
    It complements RFC9857 for the advertisement of SR Policy performance metrics.
    Such information can be used by the operators for monitoring the performance and
    state of the candidate path.</p>"

abstract:
- content: "<p>Independently written systems that anchor records to a SCITT Transparency
    Service repeatedly need the same construction: a canonical form of structured
    content, a content-addressed identifier derived from that form, binding to a SCITT
    Signed Statement and Receipt, and references that cite external artifacts by digest.
    This document defines that construction as the Canonical Payload Binding (CPB).
    A payload profile declares its canonicalization algorithm and exclusion set and
    thereby obtains a reproducible derived identifier. A CPB Signed Statement carries
    either the complete statement content as specified by RFC 9943 or a digest of
    content held elsewhere using the COSE Hash Envelope of RFC 9995. CPB also defines
    an abstract typed digest reference information model and one optional protected-
    header encoding, cpb-refs; a payload profile may instead define its own reference
    serialization. An IANA registry governs CPB canonicalization algorithms. CPB does
    not define payload content formats, establish or require a universal artifact-type
    registry, or require either typed-reference carrier.</p>"

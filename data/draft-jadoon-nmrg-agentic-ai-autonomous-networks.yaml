abstract:
- content: "<p>Agentic AI systems combine planning, reasoning, tool invocation, and
    feedback loops to pursue system-defined goals with a controlled degree of autonomy.
    In networking, this enables an evolution from statically configured automation
    toward goal-driven closed-loop operations spanning multiple protocol layers and
    administrative domains. This document introduces architectural principles for
    agentic augmentation of the existing layered protocol stack as represented by
    the Internet protocol (IP) suite. Existing protocol mechanisms continue to support
    interoperability and packet transport, while AI agents associated with one or
    more layers cooperate to support communication service objectives. Participating
    agents may interpret intents, decompose objectives, delegate responsibilities,
    and coordinate actions within their respective protocol layers and operational
    scopes. The purpose of this document is to initiate discussion within the research
    community on agentic networking. It identifies architectural research challenges
    associated with introducing AI agents at selected protocol layers and enabling
    cooperation among agents at the same or different layers, across compute nodes
    and administrative domains.</p>"

abstract:
- content: "<p>Following a disruptive event, multiple Path Computation Element (PCE)-controlled
    Label Switched Paths (LSPs) may need to recover over the same limited remaining
    resources. Individually feasible paths do not necessarily remain feasible when
    competing recovery updates are activated concurrently. This document proposes
    PCEP extensions to carry explicit conditional recovery admission decisions, correlate
    their installation outcomes, and reconcile their admission state after failures
    or PCEP session loss. Coordination is limited to consistent accounting of shared
    recovery resources by one active stateful PCE. The extension does not specify
    path computation algorithms, guarantee end-to-end service performance, or replace
    local fast protection.</p>"

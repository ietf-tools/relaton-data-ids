abstract:
- content: "<p>Current authorization is role-scoped: an actor is granted a role whose
    authority persists across every action it takes. This fails exactly when actors
    fail -- under compromise, prompt injection, or goal hijacking -- because a compromised
    actor retains full role authority. This document specifies SPT-Txn, a family of
    transaction- bound authorization tokens in which authority exists only inside
    a short-lived token bound to one declared action, on one resource, under one jurisdictional
    policy, verified against how the requesting workload was attested. Delegation
    across agents and tools is expressed as a cryptographically sealed chain that
    can only narrow authority and is verifiable offline. Each authorization decision
    emits a signed, tamper-evident receipt as a byproduct of enforcement. This document
    specifies normative intent binding, transaction receipts and their transparency
    log, attested issuance via OAuth 2.0 Token Exchange, per-token status-list revocation,
    and cryptographic algorithm agility including hybrid post-quantum signing. It
    also hardens attested issuance in response to an adversarial security review of
    the reference implementation: it makes an audience and a verifiable expiry mandatory
    on the presented attestation, requires the issuer to bound the delegated depth
    it grants, and clamps a token's lifetime to the attestation it was minted on.
    The issuer- side requested-versus-permitted scope intersection is retained; the
    enforcement point re-checks the chain independently.</p>"
  language:

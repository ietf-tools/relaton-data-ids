abstract:
- content: "<p>This document defines the Bluetooth Low Energy (BLE) Transport Binding
    Profile for the Offline Emergency Peer-to-Peer Broadcast Protocol (OEPB). It specifies
    the advertising mode, fragmentation and reassembly scheme, service and characteristic
    UUIDs, and channel access rules required to carry OEPB packets over BLE 4.x and
    BLE 5.x physical layers.</p>"

abstract:
- content: "<p>This document defines AI Terms: a JSON document published at the well-known
    URI /.well-known/ai-terms in which a website states, for each of four uses of
    its content by automated AI systems (search, answer, training and agent), whether
    the use is allowed, allowed for a price, or not allowed. It also defines an AI-Purpose
    request header with which a client declares the use it intends, a way to point
    to the terms from any HTTP response, and how a paid access produces a receipt
    that records the use. AI Terms is designed to sit alongside the Robots Exclusion
    Protocol and the usage-preference vocabulary of the IETF AI Preferences work,
    adding the pieces those leave out: price, payment binding, purpose declaration
    by the client, and a record of licensed use.</p>"

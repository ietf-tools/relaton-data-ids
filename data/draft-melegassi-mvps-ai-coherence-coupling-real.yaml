abstract:
- content: "<p>The MVPS AI-Coherence framework [I-D.melegassi-mvps-ai-coherence] defines
    an infrastructure-cognitive coupling matrix R_cross = Sigma_net^{-1/2} Sigma_cross
    Sigma_AI^{-1/2} and proves, in simulation, that a non-zero R_cross is the necessary
    and sufficient condition for the joint network-AI anomaly space to carry detection
    information that neither standalone monitor can recover. That document leaves
    two items open: (a) work item IC9.1, a statistical hypothesis test on R_cross
    over an empirical joint covariance, and (b) the CONJECTURE that E[R_cross]!= 0
    in production AI-on-network deployments. This companion document closes both.
    It specifies a permutation- based hypothesis test for the normalized cross-block
    correlation estimator, reports the FIRST real-wire measurement of R_cross on a
    production large-language-model serving path (n = 100 ticks, DeepInfra), and documents
    a pure-arithmetic reference implementation embedded in an operational system that
    reproduces the measurement number-for-number. The strongest coupling, latency_ms
    &lt;-&gt; output tokens, is r = +0.446 (permutation p = 0.0005) on the full series
    and survives the same-model confound control at r = +0.343 (p = 0.0135) within
    a single serving regime. The Frobenius norm ||R_cross||_F = 0.469 (full) / 0.443
    (intra-regime) exceeds the non-triviality floor of 0.05, confirming the production
    conjecture for this deployment. The document also specifies how the measured coupling
    and the per-engine Mahalanobis distance D^2 are consumed by an operational Wald
    Sequential Probability Ratio Test (SPRT) as an additive evidence channel for surgical
    sub-environment bifurcation.</p>"

abstract:
- content: "<p>The imminent arrival of a Cryptographically Relevant Quantum Computer
    (CRQC) makes algorithms such as RSA, ECDSA and EdDSA vulnerable to attack. A transition
    to Quantum-Safe (PQ) algorithms is occurring. This document provides specific
    requirements (Mandatory to Implement) for Autonomic Network Infrastructure (ANI/ACP)
    and AgenticAI manufacturers and operators to be able to seamlessly transition
    to Quantum Safe algorithms.</p>"

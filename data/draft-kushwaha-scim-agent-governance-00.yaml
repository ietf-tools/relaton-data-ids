abstract:
- content: "<p>The System for Cross-domain Identity Management (SCIM) Agent resource
    type defined in draft-wzdk-scim-agent-resource provides a minimal, platform-neutral
    schema for representing AI agent identities. Enterprise deployments additionally
    require governance metadata for provisioned agents: a lifecycle state model richer
    than a boolean, an autonomy classification, an operational validity window, and
    a reference to credential discovery information. This document defines an optional
    extension schema for the SCIM Agent resource type carrying this governance metadata.
    The lifecycle state value set is grounded in the identity information lifecycle
    of ISO/ IEC 24760-1, with one agent-specific addition. Attributes that belong
    to the authorization, credential-management, or real-time signaling layers are
    explicitly out of scope and are enumerated with pointers to the appropriate mechanisms.</p>"

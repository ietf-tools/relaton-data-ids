abstract:
- content: "<p>This document defines the Semantic Surface Manifest, a human-readable
    and policy-matchable routing layer for identity-bound continuity containers and
    TBZ-based sealed bundles. The Semantic Surface Manifest exposes limited dispatch
    metadata such as time fragment, context, profile, and priority without exposing
    sealed content. It is intended for use in systems where routing decisions may
    need to occur before deep inspection, while trust remains anchored in intrinsic
    bundle properties such as magic bytes, manifests, hashes, signatures, and causal
    references. This revision separates two decisions that earlier revisions left
    implicit: a routing hint, which may be taken from the visible surface before any
    inspection, and an admission verdict, which must never rest on the visible surface.
    In short: address visible, content sealed.</p>"

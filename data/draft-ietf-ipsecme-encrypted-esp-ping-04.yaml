abstract:
- content: "<p>This document defines the ESP Echo Protocol, an extension to the ESP
    AGGFRAG protocol [RFC9347] that provides an Echo Request and Echo Reply mechanism
    for IP Security (IPsec) link diagnostics. It enables endpoints to assess end-to-end
    path reachability, and it defines probe packets that can be used for path Maximum
    Transmission Unit (MTU) discovery, using Encapsulating Security Payload (ESP)
    packets. The protocol supports two modes of operation: an encrypted mode used
    over established IPsec Security Associations (SAs), with an option to specify
    a preferred reply path when multiple SAs exist between the peers, and an unencrypted
    mode used outside the context of a negotiated ESP SA. In addition to bidirectional
    echo probing, the protocol supports sending one-way ESP packets without eliciting
    a reply, primarily for keepalives, NAT and firewall pinhole maintenance, and unidirectional
    link diagnostics. A peer can announce support for ESP Echo using a new IKEv2 Status
    Notification ESP_ECHO_SUPPORTED.</p>"

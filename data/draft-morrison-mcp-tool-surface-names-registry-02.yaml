abstract:
- content: "<p>This document requests the establishment of an IANA registry for Model
    Context Protocol (MCP) tool surface names. A tool surface name is the wire-level
    identifier by which a client invokes a typed capability on an MCP server. This
    document establishes the registry mechanism so that specifications can register
    names without restating the registry's structure or registration procedure. The
    registry uses the Specification Required policy of RFC 8126, with a Designated
    Expert pool. Initial contents are four surface names drawn from a companion specification
    of policy provision over MCP, one registered as Active and three as Provisional.
    Vendor-prefix conventions are recommended but not mandated.</p>"

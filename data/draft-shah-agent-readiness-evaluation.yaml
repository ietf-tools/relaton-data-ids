abstract:
- content: '<p>This document defines a method for evaluating the "agent-readiness"
    of a website: a measure of how well the site supports autonomous AI agents and
    generative-search crawlers that consume it without a human in the loop. The method
    is grounded entirely in published standards. It organizes observable server behavior
    into four evaluation pillars, each mapped to specific IETF RFCs and W3C specifications
    covering agent discoverability, semantic entity grounding, content efficiency
    and ingestion, and transport. From the per-pillar observations it derives a single
    deterministic weighted score between 0 and 100. The score formula and its pillar
    weights are a reproducible scoring convention defined by this document; they are
    a measurement convention and are not themselves a standard. The method is diagnostic:
    it observes and reports conformance to existing specifications and changes no
    protocol. It is a measurement method, not a new protocol and not an enforcement
    mechanism. Community and vendor conventions that are not standards are observed
    only as supplementary signals and are clearly identified as such. A running reference
    implementation that performs these checks exists and is referenced as running
    code.</p>'

abstract:
- content: "<p>Computing-Aware Traffic Steering (CATS) optimizes traffic forwarding
    by considering both computing and networking metrics. The CATS framework and metric-definition
    documents provide valuable theoretical models, yet they face challenges in achieving
    direct operational execution in real-world deployments: normalization methods
    vary across providers, and aggregated unitless scores often lose the operational
    information that routers need for precise steering decisions. This document provides
    a self-contained, executable operational model for a core class of CATS deployment
    scenarios: latency-sensitive, compute-intensive services whose steering decisions
    are made in real time at the forwarding node. Instead of disseminating low-level
    raw hardware metrics, service sites dynamically evaluate and report service-oriented
    metrics (e.g., Global Available Slots and Computing Time) to the control plane.
    The document clarifies how these metrics are derived from basic resource information,
    service reference information, and local policy. It also specifies how the CATS
    Path Selector (C-PS) combines the Computing Service Table (populated from C-SMA
    reports) with the Network Service Table to make joint traffic- steering decisions,
    and defines update-control and fallback mechanisms suitable for large-scale deployments.
    Within the unified CATS architecture, the service-oriented operational model defined
    in this document coexists with the general- purpose L1/L2 normalized metric framework:
    a deployment MAY use either model, or run both pipelines in parallel for different
    service classes, without embedding metric fields across frameworks. This document
    does not negate the value of normalized metrics; it focuses on the service-level
    abstractions and runtime operations required for direct traffic steering.</p>"

abstract:
- content: "<p>This specification defines an authorization details type for carrying
    authorization evidence in OAuth 2.0 access tokens, using the enriched response
    mechanism of Rich Authorization Requests. When an Authorization Server records
    an approval decision, it enriches the authorization details with cryptographic
    proof of the decision and of the structured disclosure on which the decision was
    based. Evidence is recorded for approved, narrowed, and declined decisions, supporting
    accountability, compliance, and dispute resolution in scenarios where autonomous
    agents act on behalf of users. An approval record that cannot be ended is not
    an accountable record, so this specification defines the withdrawal mechanism
    alongside the evidence itself. Withdrawal is one of the four ways a governing
    authorization ends, alongside completion, termination, and expiry.</p>"

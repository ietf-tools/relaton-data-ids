abstract:
- content: "<p>AI models, agents, and autonomous services increasingly initiate payments,
    communications, data releases, infrastructure changes, and physical actions in
    critical systems. Authentication, authorization, human approval, proof of possession,
    attestation, policy evaluation, and audit are important, but none of them alone
    establishes that the exact operation becoming externally effective is the operation
    that was authorized and remains permitted under current protected state. This
    document defines an execution-finality architecture in which a proposed operation
    remains non-effective until a mandatory enforcement function controlling the effectuation
    boundary reconstructs the actual operation, verifies exact-act binding and current
    protected state, prevents replay or stale authority, and couples the decision
    to the resulting consequence through an atomic or equivalently crash-consistent
    transition. The document explains why latency is only one engineering consideration
    and is often not the dominant problem. Consequence-path completeness, deterministic
    act representation, protected state, atomicity, crash recovery, safe degraded
    operation, and legacy-system integration are usually harder requirements. A detailed
    FAQ addresses whether placing OAuth at the last irreversible execution boundary
    is the same architecture. It is not automatically equivalent merely because a
    token, scope, or sender- constrained proof is checked at that location. An OAuth-protected
    implementation is functionally equivalent only when it also exclusively mediates
    every consequence path, reconstructs and binds all consequence-relevant fields,
    revalidates authoritative current state, enforces replay and generation controls,
    atomically couples authorization consumption to the exact effect, and provides
    safe failure and recovery semantics. In that case, the implementation is functioning
    as the Finality Sink, regardless of terminology. The document also identifies
    the division of responsibility and possible relevance of OAuth, RATS, WIMSE, Web
    Bot Auth, other IETF communities, and longer-term IRTF research. This document
    is architectural and informational; it does not define a wire protocol.</p>"

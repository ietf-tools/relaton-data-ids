abstract:
- content: "<p>This Internet-Draft provides a gap analysis and applicability statement
    that maps existing Discovery Mechanisms and protocols to the DAWN problem statement
    and discovery requirements. The analysis evaluates security, privacy, applicability,
    flexibility, and suitability of existing standardized, non-standardized, and proposed
    discovery solutions and protocols to the DAWN problem statement and REQ-DISC corpus.
    It identifies high priority gaps, proposes mitigations and hybrid patterns, and
    serves as reference for future prototyping and development. The intention is for
    this draft to evolve as new solutions come to existence.</p>"

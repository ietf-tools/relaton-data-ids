abstract:
- content: "<p>A request and its response, passing through a chain of workloads, may
    need authenticated provenance: proof of which workloads participated and whether
    each changed the message. The base WIMSE HTTP Message Signatures mechanism ([I-D.ietf-wimse-http-signature])
    authenticates one workload's message to its immediate recipient and does not provide
    this across a chain. This document establishes authenticated provenance using
    per-hop digests of what each hop received and forwarded; this alone detects an
    omitted hop that changed the message. An aggregate signature closes the remaining
    gap, a hop that forwards the message unchanged, and keeps the signature close
    to the size of one signature regardless of chain length. The mechanism works with
    any aggregate signature scheme.</p>"

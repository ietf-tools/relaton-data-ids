abstract:
- content: '<p>This document describes how a service operator binds usage preferences
    (e.g., "no AI training") to paths by writing ordinary robots.txt groups keyed
    by a per-purpose policy token in the User- Agent line. It introduces no new directive
    names and no new grammar: the path language, longest-match precedence, and group
    structure of robots.txt are not changed.</p>'

abstract:
- content: "<p>A YANG configuration can express management intent, but its acceptance
    does not establish that dependent entries in a programmable forwarding pipeline
    have become effective consistently. This document proposes an experimental mapping
    and update profile for P4. It describes a target-specific mapping contract, capability
    validation, generation-based activation, preservation of existing flow bindings,
    failure recovery, and operational reconciliation. The profile distinguishes configuration
    acceptance, verified activation, and eventual convergence. It defines neither
    a new packet encapsulation nor a new YANG module, and does not assume a network-
    wide atomic transaction.</p>"

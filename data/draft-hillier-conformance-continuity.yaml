abstract:
- content: "<p>A conformance claim is a statement about a subject, made against a
    baseline, at a time. Each of those three terms moves. Baselines are superseded
    by their issuers. Subjects present the same posture across jurisdictions whose
    baselines differ. Subjects containing non-person entities mutate faster than the
    period any attestation covers. A conformance record that cannot be carried across
    those boundaries, and cannot state what it failed to carry, decays into an assertion.
    This document specifies the Continuity Binding: a single structure that carries
    a verified conformance claim across a boundary while preserving the provenance
    of the evidence beneath it, attributing every equivalence judgement to a named
    party, and enumerating the residual that did not carry. Three specialisations
    are defined. The Transition Binding carries a claim across supersession of the
    governing baseline. The Recognition Binding carries a claim between baselines
    of different issuers in concurrent force. The Mutation Binding carries a claim
    across change in the composition of the subject itself, which is the ordinary
    condition of an environment operating non-person entities. The document specifies
    Baseline Profiles, Provenance Classes, the verdict taxonomy, the Verification
    Reconciliation Object, cryptographic agility requirements for records whose reliance
    outlives any single hardness assumption, and the registries that make baselines
    issued by any authority in any jurisdiction verifiable under one interoperable
    structure. The evolution of the Australian Essential Eight Maturity Model into
    the Essentials series is used as the worked example throughout.</p>"

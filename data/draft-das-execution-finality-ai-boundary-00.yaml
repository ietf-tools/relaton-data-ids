abstract:
- content: "<p>An AI system's ability to compute an operation is not the same as authorization
    for that operation to take effect outside the system. This document defines an
    enforcement boundary at which an operation produced by an AI system is verified
    against the effect it will actually produce, rather than against the effect that
    was requested or approved upstream, and specifies that the operation carries no
    external consequence until that verification succeeds. The boundary is complementary
    to alignment, sandboxing, monitoring, and interpretability, which reduce the likelihood
    that an unsafe operation is produced. This document addresses the separate question
    of what prevents a produced operation from becoming effective. The mechanism functions
    as a safety interlock: it does not restrict what the system may compute, only
    whether a specific computed operation may take effect. The invariant is that computation
    is not authority.</p>"

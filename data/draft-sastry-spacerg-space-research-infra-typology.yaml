abstract:
- content: "<p>Space networking research increasingly relies on a heterogeneous ecosystem
    of software, datasets, experimental platforms, reference implementations, and
    operational research assets. These resources have historically been developed
    independently by different research groups, agencies, and projects, making discovery,
    comparison, interoperability, and reuse difficult. Existing registries typically
    catalogue tools individually but provide limited guidance on their functional
    role within the research lifecycle. This document proposes a typology for research
    infrastructures relevant to the Space Research Group (SPACERG). Rather than classifying
    resources according to implementation technology or project origin, the proposed
    taxonomy groups resources according to their research function. The typology provides
    a common vocabulary for describing software and non-software research assets,
    supports the organization of community registries, and facilitates interoperability,
    reproducibility, and long-term maintenance of research infrastructures. The classification
    is intended to evolve as new classes of research resources emerge. The typology
    is implemented by a machine-readable registry of research resources maintained
    by the research group.</p>"

abstract:
- content: "<p>The Segment Routing Policy Architecture (RFC 9256) defines the concept
    of a Composite Candidate Path, which enables a parent SR Policy to recursively
    steer traffic into a set of constituent SR Policies. Section 8.6 of RFC 9256 further
    defines per-flow steering, in which packets are classified into a Forwarding Class
    value by a Quality-of-Service classifier at the headend, and that Forwarding Class
    value selects a specific constituent SR Policy, identified by its color, for forwarding.
    RFC 9830 specifies how BGP distributes SR Policy Candidate Paths but explicitly
    excludes composite Candidate Paths from its scope. Consequently, no standard BGP
    mechanism currently exists to distribute a parent per-flow SR Policy -- including
    its Forwarding- Class-to-color mapping table -- to headend nodes. This document
    defines two new sub-TLVs for the BGP Tunnel Encapsulation Attribute (SR Policy
    type, Tunnel Type 15): the Constituent SR Policy sub-TLV and the nested Per-Flow
    Forwarding Class sub-TLV. Together, these extensions allow a controller to distribute
    a fully specified composite or per-flow Candidate Path to headend routers via
    BGP.</p>"

abstract:
- content: "<p>Open Artificial Intelligence Integrity Sentinel (OpenAIIS) specifies
    a decentralized trust, governance, and safety protocol for digital activity performed
    by people, organizations, and autonomous AI agents. It binds digital assertions
    and consequential actions to authenticated issuers, scoped authority, accepted
    responsibility, supporting evidence, and a verifiable history. A canonical, domain-
    separated signature authenticates each typed claim; ordered Merkle records and
    signed checkpoints establish its historical registry context. Every accepted registry
    record enters an automatic, durable process that commits covering checkpoints
    to Bitcoin mainnet. The resulting portable proof binds the exact signed claim
    and its authenticated history to Bitcoin's proof-of-work chain, protecting historical
    evidence against retroactive substitution or rewriting without the work required
    to establish an accepted competing Bitcoin history. Governance and safety records
    express consent, delegation, authorization, revocation, withdrawal, disputes,
    and security incidents. Independent implementations can verify both historical
    commitments and the evidence governing present action without relying exclusively
    on the system that issued or executed a claim. OpenAIIS supports versioned decentralized
    consensus profiles without a protocol-native currency.</p>"

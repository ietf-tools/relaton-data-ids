abstract:
- content: '<p>The Agent2Agent (A2A) protocol retrieves an agent''s self-description
    (the Agent Card) from a fixed well-known URI, which resolves exactly one agent
    per origin and presumes the client already holds a URL. This document profiles
    WebFinger for A2A: an agent is named by an "acct" URI (agent@domain), and resolution
    of that name over WebFinger yields a link to the Agent Card of the endpoint that
    serves the agent -- the agent''s own endpoint, or a gateway fronting it. The profile
    introduces no new link relation, media type, or registry: it composes three deployed
    standards and states how they fit.</p>'

abstract:
- content: "<p>The DNS-SD Data Block (DDB) is a compact TLV encoded container for
    conveying DNS-SD service information over non-IP transports, such as short-range
    peer-to-peer or proximity-based advertisement and discovery technologies (for
    example, the Bluetooth Low Energy Transport Discovery Service or NFC Verb NDEF
    Records).</p>"

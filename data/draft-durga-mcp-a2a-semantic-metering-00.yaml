abstract:
- content: "<p>Enterprise agent ecosystems routinely bridge tool invocations and task
    delegations across heterogeneous protocols, including Model Context Protocol (MCP),
    Agent-to-Agent (A2A), and OpenAPI/REST. During protocol translation, safety invariants,
    schema constraints, and mutability flags are frequently stripped—enabling cross-protocol
    capability downgrade attacks—while commercial settlement gateways erroneously
    bill on HTTP 200 transport responses rather than verified state-commit durability.
    This document specifies a cryptographic Cross-Protocol Semantic Equivalence Proof
    (CPSEP) and an 8-state Commit-Bound Metering Receipt (CBMR) protocol.</p>"

abstract:
- content: "<p>This document defines PSI-03, a domain profile of Proof of Stateful
    Integrity (PSI) for dispatch instructions and metered responses exchanged between
    a virtual power plant operator and its distributed energy resources. Each record
    is sealed as a PSI receipt so that later alteration, reordering, or removal is
    detectable. Only digests are sealed. PSI-03 shows integrity and ordering only;
    it does not show that a resource performed as instructed, that metering is accurate,
    or that any market rule was met. Earlier revisions carried this title over an
    abstract describing practitioner identity bonds. This revision makes the body
    match the title.</p>"

abstract:
- content: "<p>This document clarifies certain operational behavior aspects of the
    Path Computation Element Communication Protocol (PCEP). The content of this document
    has been compiled based on several interop exercises. This document does not make
    any updates or revisions to any PCEP specifications, instead it provides additional
    information to aid in the interpretation of those documents.</p>"

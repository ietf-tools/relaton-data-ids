abstract:
- content: "<p>This document describes a proposed companion format for associating
    two frozen software-artifact commitments with attribution and revisioned claims.
    It specifies canonical signing bytes, separate trust and freshness checks, claim-making
    and verification procedures, and operational state boundaries. The intended implementing
    community is software-provenance maintainers, release operators and independent
    security reviewers. Existing IETF canonicalization and signature specifications
    are used without defining a new cryptographic primitive. Retained source comparisons,
    document- signature checks and synthetic tests are indexed with their limits.
    Application control-plane evidence is distinguished from deployment of the companion
    itself. A complete operational profile, independently authenticated trust and
    current-state evidence, and a verified field deployment remain prerequisites to
    an implementation- readiness claim.</p>"

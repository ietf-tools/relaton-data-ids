abstract:
- content: "<p>OAuth 2.0 Attestation-Based Client Authentication requires an authorization
    server to trust the attester that makes statements about a client instance, but
    does not define how a client identifies the attesters authorized to attest for
    it. This specification defines a client metadata parameter, usable by registered
    clients and in Client ID Metadata Documents, that names the endorsed attesters
    and the locations of their verification keys. It defines how an authorization
    server validates endorsements and processes their withdrawal while retaining control
    over whether to trust them. It introduces no new credential or client authentication
    method.</p>"

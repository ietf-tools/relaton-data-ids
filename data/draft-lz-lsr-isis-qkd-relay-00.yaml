abstract:
- content: "<p>Quantum Key Distribution (QKD) provides a method for generating shared
    symmetric keys between two QKD systems. Large-scale QKD networks commonly use
    trusted relay nodes to deliver key material across multiple QKD links. to steer
    key-relay traffic through a sequence of trusted relay nodes. A critical prerequisite
    for this approach is the ability of collecting the QKD capability of the nodes
    and links in the network. This document extends IS-IS by defining a new Application
    ID for QKD relay information within the GENINFO TLV [RFC6823]. This extension
    allows nodes to advertise their QKD relay informations and then collected by the
    QKD controller for QKD relay path calculation.</p>"

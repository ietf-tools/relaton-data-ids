abstract:
- content: "<p>This document describes four post-quantum password authenticated key
    exchange (PAKE) protocols: OQUAKE, OQUAKE+, CPaceOQUAKE, and CPaceOQUAKE+. OQUAKE
    and OQUAKE+ are standalone PAKEs that both offer security against a quantum-capable
    attacker. OQUAKE is a symmetric PAKE, suitable for use cases where both parties
    share a view of the password. OQUAKE+ is an augmented version of OQUAKE suitable
    for client-server settings where only one party (the client) knows the password.
    CPaceOQUAKE is a hybrid PAKE that runs a classical PAKE (CPace) and OQUAKE sequentially,
    and CPaceOQUAKE+ is its augmented version. This document also provides recommended
    configurations for each protocol.</p>"

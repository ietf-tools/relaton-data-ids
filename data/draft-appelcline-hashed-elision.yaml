abstract:
- content: "<p>This document discusses the need for deterministic hashed data elision
    as a baseline for secure data storage. It focuses on four different categories
    of requirements: corporate needs, privacy compliance requirements, variable access
    compliance requirements, and past IETF RFCs. Additional sections discuss the functional
    requirements that match these needs and how existing technologies meet them.</p>"

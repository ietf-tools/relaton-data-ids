abstract:
- content: "<p>This document specifies the procedures for achieving faster Layer-3
    convergence from link/ node failures when all-active multi-homing is used with
    EVPN/ MVPN seamless interop [draft-ietf-bess-evpn-mvpn- seamless-interop]. Specifically,
    these improvements apply when L3 routed multicast services are deployed by BGP/
    EVPN PEs using the procedures defined by the above draft.</p>"

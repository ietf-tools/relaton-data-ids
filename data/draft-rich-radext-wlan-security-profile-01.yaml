abstract:
- content: "<p>IEEE 802.11, as amended, defines security profiles, and several of
    those profiles can share the same AKM suite and pairwise cipher, so WLAN-AKM-Suite
    and WLAN-Pairwise-Cipher no longer tell a RADIUS server which profile is in effect.
    This document defines the WLAN-Security-Profile RADIUS attribute, which reports
    the security profile the responder accepted. A Network Access Server includes
    it in the Access-Requests it generates for an IEEE 802.1X authentication so the
    server can make policy decisions based on the value. The attribute complements
    the IEEE 802 attributes defined in RFC 7268.</p>"

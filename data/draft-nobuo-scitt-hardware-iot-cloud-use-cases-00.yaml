abstract:
- content: "<p>This document describes how SCITT can be applied to supply chains that
    include hardware components, IoT devices, firmware, cloud compute resources, confidential-computing
    environments, accelerators, and related operational evidence. It gives use cases
    and scope guidance. It also explains how SCITT can work with RATS, COSE, TCG technologies,
    SBOM, HBOM, CBOM, and cloud attestation systems without replacing those technologies.
    This document is informational. It does not define hardware assurance rules, cloud
    assurance rules, device identity systems, manufacturing requirements, or payload
    formats. Its purpose is to show where SCITT statements and receipts can provide
    transparency for heterogeneous supply-chain evidence, and where other standards
    or domain profiles should remain responsible.</p>"

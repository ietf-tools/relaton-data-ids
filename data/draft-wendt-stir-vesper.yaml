abstract:
- content: "<p>This document defines VESPER (Verifiable STI Presentation and Evidence
    for RTU), a framework that composes existing STIR mechanisms into a system in
    which a relying party can verify that a telephone number was assigned to a specific
    entity and that the same entity controls a specific domain. VESPER builds on the
    telephone-number- to-domain binding defined in [I-D.wendt-stir-tn-domain-binding],
    the STIR certificate and PASSporT specifications, ACME-based authority token issuance,
    and certificate transparency. This document describes the roles, the certificate
    usage, a domain-hosted certificate repository and discovery model, a PASSporT
    usage profile for SIP signaling, and a portable Right-to-Use Token for use outside
    of SIP. It defines the framework and its composition; the new normative binding
    it relies on is specified in [I-D.wendt-stir-tn-domain-binding].</p>"

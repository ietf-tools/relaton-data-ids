abstract:
- content: "<p>The Ethernet Virtual Private Network (EVPN) solution offers procedures
    for electing a Designated Forwarder (DF) for multihomed Ethernet Segments. In
    this context, the Provider Edge (PE) router is responsible for sending Broadcast,
    Unknown Unicast, and Multicast (BUM) traffic to a multihomed device or network.
    This applies in cases of an all-active multihomed Ethernet Segment (ES) as well
    as for BUM and unicast traffic in the case of single-active multihoming. While
    the Default Algorithm provides an efficient and automated mechanism for selecting
    the DF across Ethernet Tags within an Ethernet Segment, it does not provide Per-flow
    DF selection within an EVPN Instance (EVI). This document defines a new DF Election
    Algorithm that performs Per-flow DF selection by defining a new DF Algorithm value.</p>"

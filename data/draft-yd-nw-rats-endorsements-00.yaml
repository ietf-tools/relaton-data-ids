abstract:
- content: "<p>Arm Normal World Attestation Endorsements comprise reference values
    and cryptographic key material that a Verifier needs to appraise Attestation Evidence
    produced from Normal World client running on an Arm Platform. This memo defines
    Normal World Endorsements as a profile of the CoRIM data model. Discussion Venues
    This note is to be removed before publishing as an RFC. Source for this draft
    and an issue tracker can be found at https://github.com/arm-attestation-drafts/draft-nw-rats-endorsements.</p>"

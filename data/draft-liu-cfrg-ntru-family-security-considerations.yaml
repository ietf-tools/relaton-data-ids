abstract:
- content: "<p>This document provides an informational review checklist for NTRU-
    family KEMs. It covers security claims, assumptions, reductions, concrete attack
    estimates, correctness and decryption-failure analyses, and implementation behavior
    for named specifications and parameter sets. It does not define a KEM interface
    or make recommendations among candidate KEMs.</p>"

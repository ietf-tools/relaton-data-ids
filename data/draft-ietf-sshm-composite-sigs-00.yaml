abstract:
- content: "<p>This document specifies the integration of two composite post-quantum
    signature schemes into the Secure Shell (SSH) protocol. These schemes combine
    the post-quantum Module-Lattice Digital Signature Algorithm (ML-DSA) with Elliptic
    Curve signature algorithms (Ed25519 and ECDSA, respectively) to provide security
    against both quantum and classical adversaries.</p>"

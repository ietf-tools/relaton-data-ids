abstract:
- content: "<p>Brokered OAuth redirect authorization requests involve intermediary
    authorization servers between a downstream client and the upstream authorization
    server that obtains user consent and issues tokens. Such deployments have security
    risks because the upstream authorization server sees only the immediate OAuth
    client and is unaware of the downstream client or intermediary brokers obtaining
    its response. This document defines an OAuth 2.0 profile for carrying a verifiable,
    signed authorization request delegation chain as a RAR authorization_details object
    [RFC9396]. Each node in the chain is a JSON object signed by an attesting authorization
    server using detached JWS [RFC7515], attesting its validated client, hash-linked
    to the previous node, allowing the upstream authorization server to validate the
    integrity of the visible delegation path and apply policy before issuing tokens.</p>"

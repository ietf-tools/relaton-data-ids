abstract:
- content: "<p>Ethernet VPN (EVPN) networks support multicast applications in which
    multicast routers and multicast hosts are attached to the same tenant. Existing
    specifications define how Provider Edge (PE) devices synchronize the Internet
    Group Management Protocol (IGMP) and Multicast Listener Discovery (MLD) membership
    state of multihomed multicast hosts, and how Optimized Inter-Subnet Multicast
    (OISM) forwarding interacts with multicast routers via PIM EVPN Gateways. However,
    none of the existing specifications addresses the synchronization of the state
    associated with a multicast router (an IGMP/MLD Querier or a Protocol Independent
    Multicast (PIM) router) when that router is multihomed to a set of EVPN PEs. This
    document specifies a new EVPN route, the Multicast Router Discovery (MRD) route,
    and the procedures to synchronize multicast router state across the PEs of an
    Ethernet Segment, for routers attached to multicast Broadcast Domains or to Layer
    3 interfaces.</p>"

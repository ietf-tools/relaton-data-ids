abstract:
- content: "<p>This document defines PSI-09, a domain profile of Proof of Stateful
    Integrity (PSI) for decisions made by an age assurance provider, recording that
    a check was performed, by which method, and with what outcome. Each record is
    sealed as a PSI receipt so that later alteration, reordering, or removal is detectable.
    Only digests are sealed. PSI-09 shows integrity and ordering only; it does not
    show the age of any person, the accuracy of the method, or compliance with any
    age assurance law. Revision 00 carried this title over an abstract describing
    tribunal verdicts. That material is withdrawn and this revision makes the body
    match the title.</p>"

abstract:
- content: "<p>This document defines PSI-02, a domain profile of Proof of Stateful
    Integrity (PSI) for measurement records supporting carbon sequestration claims,
    such as field sampling results, remote-sensing extracts, and calculation inputs.
    Each record is sealed as a PSI receipt so that later alteration, reordering, or
    removal is detectable. Only digests are sealed. PSI-02 shows integrity and ordering
    only; it does not show that the sequestration occurred, that a methodology was
    followed, or that any credit is valid. Revision 00 carried this title over an
    abstract describing disability-services evidence. This revision makes the body
    match the title.</p>"

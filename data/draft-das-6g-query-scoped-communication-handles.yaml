schema-version: v1.2.3
id: draft-das-6g-query-scoped-communication-handles
title:
- content: 'Authorization-to-Reach for Communication Handles: Separating Identifier
    Possession from Permission to Contact'
  language:
  - en
  script:
  - Latn
  format: text/plain
docid:
- id: draft-das-6g-query-scoped-communication-handles
  type: Internet-Draft
  primary: true
abstract:
- content: "<p>Many Internet and telephone communication systems treat possession
    of a routable identifier as sufficient to attempt contact. A telephone number,
    SIP URI, messaging handle, relay address, or marketplace contact reference can
    therefore remain a reusable reachability path after the purpose of disclosure
    has ended. Existing IETF and industry mechanisms solve related but different problems.
    STIR and SHAKEN authenticate or attest originating identity. Virtual or masked
    numbers hide a persistent endpoint but commonly leave a substitute route active
    while the alias is valid. OAuth can express delegated API authorization. Spam
    scoring and call screening classify or reject an attempt after some path already
    exists. This document describes an authorization-to-reach model. A visible communication
    handle is not, by itself, permission to create a communication effect. A request
    is held as a candidate until current, purpose-scoped, revocable, and optionally
    consumable authority is validated. The document is informational. It asks whether
    the IETF Applications and Real-Time area should define interoperable semantics
    or an encoding for that authority (for example a PASSporT claim, a SIP header
    or pre-INVITE check, or a reusable authorization object). This work is not a 3GPP
    radio, core-network, or IMT-2030 architecture proposal. References to machine-scale
    or future-network traffic are motivational only. The intended protocol home, if
    any, is IETF work on SIP, STIR, messaging, and Internet communication identifiers.</p>"
  language:
  - en
  script:

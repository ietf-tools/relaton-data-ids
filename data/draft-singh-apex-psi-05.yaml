abstract:
- content: "<p>PSI-05 defines the royalty schedule that MAY be levied by a publishing
    foundation for commercial, litigation, regulatory, or AI- training reuse of PSI
    public ledger data above a threshold defined by the foundation's charter. It establishes
    a flat-rate per-row fee schedule, exemption categories, and an audit protocol.</p>"

abstract:
- content: "<p>This document defines the Morning Brief: a federated, identity- attested
    situational-awareness payload exchanged between organisations, their agents, and
    peer agents operating under an Identity Accord [ACCORD]. A Morning Brief carries
    a signed, bounded- lifetime summary of signals, escalations, decisions, and optional
    commerce quotes from one ~handle to another. Every signal entry carries a provenance_class
    distinguishing active self-report, passive aggregate observation, and passive
    individual observation; the last of these is forbidden on the wire and rejected
    at the grammar level. Readers present a capability token scoped by (category,
    provenance_class) that gates release BEFORE payload emission, not after. The payload
    is envelope-signed with COSE_Sign1 [RFC8152] over a JCS-canonicalised [RFC8785]
    representation, bound to the issuer's Sovereign-tier handle per [IDCOMMITS]. Briefs
    carry a mandatory not_after (default 24h) and reference a revocation endpoint
    discovered via DNS TXT per [MCPDNS]. The document defines the wire format only;
    rendering, storage, and retention are out of scope.</p>"

abstract:
- content: "<p>This document specifies a rate notification mechanism for Segment Routing
    over IPv6 (SRv6) networks. It enables a transit or egress node to dynamically
    notify the ingress (headend) node about a recommended rate range (MinRate and
    MaxRate) when localized congestion is detected or when underutilized bandwidth
    is identified, allowing the headend to perform proactive traffic shaping and rate
    enforcement. This mechanism enhances transmission efficiency in SRv6 networks
    by enabling fine-grained, congestion-aware rate control.</p>"

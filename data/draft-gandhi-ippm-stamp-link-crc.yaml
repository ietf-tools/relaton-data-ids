abstract:
- content: "<p>The Simple Two-Way Active Measurement Protocol (STAMP), specified in
    RFC 8762, supports active measurement of network performance. This document defines
    a STAMP Type-Length-Value (TLV) that reports receive-side link statistics: packets
    received, packets received with Cyclic Redundancy Check (CRC) errors, and bytes
    received. The link is identified using the Micro-session ID TLV specified in RFC
    9534. These measurements support fiber-quality monitoring to provide SLA assurance.</p>"

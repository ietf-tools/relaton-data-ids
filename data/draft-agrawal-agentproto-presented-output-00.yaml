abstract:
- content: "<p>When an agent's output is presented to a user over time, as with synthesized
    speech, the agent has usually generated more than the user has received at the
    moment an exchange stops. Existing requirements cover abandoning an exchange and
    cancelling a task. They do not cover telling the participants in the dialog how
    much of the output the user actually received. This document describes one use
    case with two examples, a travel booking and a voice purchase, and derives five
    requirements that can be incorporated into the working group's use cases and requirements
    document.</p>"

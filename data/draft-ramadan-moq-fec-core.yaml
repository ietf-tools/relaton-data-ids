abstract:
- content: "<p>This document specifies how Forward Error Correction (FEC) repair data
    is carried alongside source media in Media over QUIC (MoQ) without naming a particular
    FEC code. It states the properties that an FEC scheme must have to be used with
    this mechanism, and defines everything that does not depend on the scheme: how
    source objects become source symbols, how source symbols are numbered and grouped
    into blocks, two ways of carrying source symbols (as the source track's own objects,
    or as a separate symbol track suited to datagram delivery), repair tracks that
    receivers subscribe to independently and in layers, the repair object format,
    repair Group IDs that make repair fetchable by block, and equal and unequal protection
    driven only by metadata that MoQ Transport exposes, so that FEC works when payloads
    are encrypted end to end. Relays need no FEC knowledge. Specific FEC schemes,
    catalog bindings, packaging-specific profiles and multicast delivery are left
    to companion documents.</p>"

abstract:
- content: "<p>We attest that standalone ML-KEM in TLS 1.3 breaks the existing formal
    proofs of TLS in state-of-the-art symbolic security analysis tool, ProVerif. In
    this draft, we show *exactly* where the ProVerif proofs break, namely transition
    from symmetric DHKE to asymmetric KEM. More specifically, the existing proofs
    of TLS in ProVerif are based on commutativity property, whereas commutativity
    does not apply to standalone ML-KEM in TLS. We also attest that from a formal
    analysis perspective, this is a much bigger change than RFC8773bis, which indeed
    went for FATT review (cf. [TLS-FATT]). We, therefore, formally request the chairs
    to initiate the FATT review of standalone ML-KEM in TLS. A few WG participants
    have already volunteered to do formal analysis in ProVerif. This draft also offers
    some preliminary discussion to help the developers and policy makers make informed
    choices. Finally, the draft also aims to reduce the endless repitition of arguments
    from both sides presented on several lists by documenting these arguments so they
    can simply be referred to.</p>"

abstract:
- content: "<p>A tamper-evident record establishes that data has not been altered.
    It does not, by itself, establish what legally-operative fact the data evidences,
    nor how far the data may be relied upon. This document defines the Typed-Evidence
    Record (TER): an interoperable record format in which a machine-generated record,
    such as a record of an action taken by an autonomous agent, is expressed as a
    set of legally-operative facts, carries an evidence grade reflecting its level
    of cryptographic attestation, carries a per-fact robustness indication, and carries
    the result of an independent integrity verification of its source. A Typed-Evidence
    Record binds to, and does not replace, the underlying signed record it describes.
    This document specifies the record format and the requirements a record and a
    relying party MUST meet to be interoperable. It does not specify how the legally-operative
    facts are produced from a source record; that is an implementation concern outside
    the scope of this document.</p>"

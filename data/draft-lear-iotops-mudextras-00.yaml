abstract:
- content: "<p>Manufacturer Usage Descriptions (MUD) provide a means to describe device
    network behavior. This memo clarifies some aspects that may improve both usability
    and interoperability. Some examples include how to handle IP-based access-lists,
    broadcasts and multicasts of various forms, and QoS.</p>"

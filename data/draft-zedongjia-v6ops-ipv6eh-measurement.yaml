abstract:
- content: "<p>IPv6 Extension Headers (EHs) are designed to provide protocol flexibility
    and support for emerging features, while maintaining a concise base header and
    efficient processing. However, their practical reachability has long been constrained
    by widespread middlebox interference, and paradoxically, their flexibility introduces
    significant security risks. This document presents observations from a comprehensive,
    large-scale measurement study of IPv6 Extension Header path traversal across more
    than 23,000 autonomous systems. Using a feedback-driven measurement framework
    called 6Travel, we measure the reachability of 10 common IPv6 Extension Headers
    over ICMPv6, TCP, and UDP. Our analysis reveals a fundamental shift: contrary
    to past observations of heavy filtering, specific Extension Headers now achieve
    reachability comparable to plain traffic. We further identify two distinct forms
    of policy ossification across industry categories and expose a widespread Extension-Header-based
    firewall evasion vulnerability affecting nearly 5,000 autonomous systems, particularly
    under TCP and UDP. This threat stems from a dual failure of implementation flaws
    and security misconfigurations, spanning both on-path and host-side firewalls.</p>"

abstract:
- content: "<p>This document describes a two-layer reference architecture for discovering
    the minimum public information needed to reach AI agents. The Local Discovery
    Plane obtains discovery information within an administrative domain through mDNS/DNS-SD
    or infrastructure-assisted discovery. For cross-domain discovery, the Federation
    Plane uses publication of policy-approved information in authoritative DNS zones
    and on-demand resolution as its baseline; Federation Gateways apply export policy
    and validate and cache accepted results. The document also identifies optional
    functions that may complement this baseline where DNS publication and request-driven
    resolution do not meet deployment needs: recipient-specific sharing, proactive
    or multi-hop dissemination, and trusted aggregated directory queries. In mixed-
    mode deployments, DNS may bootstrap an endpoint that provides one of these additional
    functions.</p>"

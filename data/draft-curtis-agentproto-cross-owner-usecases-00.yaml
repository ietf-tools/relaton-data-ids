abstract:
- content: "<p>This document describes use cases where an AI agent acting for one
    Owner asks an agent acting for a different Owner to provide/receive information,
    process or store data or otherwise work on an agent's behalf. This communication
    can be unidirectional or bidirectional. It lists the requirements that those cases
    place on an agent dialog protocol, mainly in five areas: a spending limit that
    stays with the work as it is passed on, a limit on how many times the work may
    be passed on, a way to check which Owner an agent acts for, the sender's control
    over which information about its Owner is disclosed, and how long that information
    may be kept. It does not propose a protocol. It is offered as input to the working
    group's use cases and requirements document.</p>"

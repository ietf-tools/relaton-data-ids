abstract:
- content: "<p>This document defines SRv6-INT, a protocol extension that integrates
    In-band Network Telemetry (INT) with Segment Routing over IPv6 (SRv6) packet processing.
    The extension reuses the Segment List entry associated with each SRv6-INT endpoint
    to carry an equal-length telemetry record, thereby preventing telemetry collection
    along the path from further increasing the packet header length. A collector obtains
    the resulting telemetry and provides it to local and global controllers for closed-loop
    resource control.</p>"

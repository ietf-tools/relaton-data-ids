abstract:
- content: "<p>IPv6 deployment continues to expand within routing infrastructure,
    while IPv4 connectivity remains necessary for many services, applications, and
    end systems. Existing routing mechanisms allow IPv4 reachability to be maintained
    using IPv6 next hops, enabling native IPv4 forwarding even where IPv6 is used
    for infrastructure addressing, routing adjacencies, and next-hop resolution. This
    document brings together existing routing mechanisms, deployment patterns, and
    implementation experience in a common architectural view. It makes explicit the
    separation between the address-family functions used by the routing infrastructure
    and the reachability and traffic supported by that infrastructure. It examines
    how this separation appears in provider-edge/customer-edge interconnections, Internet
    Exchange Points, and large-scale data-center fabrics. By relating existing standards
    and deployment experience through this common view, the document identifies a
    recurring architectural pattern for IPv6-based routing infrastructure that continues
    to support native IPv4 connectivity, and discusses its applicability and limitations.
    This document does not define a new routing protocol, forwarding mechanism, BGP
    extension, or migration procedure.</p>"

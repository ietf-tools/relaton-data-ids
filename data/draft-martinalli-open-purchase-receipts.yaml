abstract:
- content: '<p>This document specifies attest, a signed digital purchase-receipt envelope
    that a buyer holds and that any party can verify offline, without contacting the
    issuer or any third-party service. It defines the receipt envelope and payload
    format, a restricted JSON canonicalization profile ("attest-JCS", built on RFC
    8785), a pinned Ed25519 signature ruleset, an optional hybrid Ed25519+ML-DSA-65
    post- quantum-resistant signature profile, issuer key and artifact manifests with
    rotation and compromise handling, a layered verification algorithm, and revocation-record
    semantics. This document is a snapshot profile: it distills, and never supersedes,
    the living attest specification maintained in the attest source repository. It
    normatively specifies exactly the core receipt format and the hybrid signature
    profile; the living specification''s transparency-log, anchoring, and issuer-mediated
    transfer material is summarized only as non-normative pointers in Section 12 of
    this document.</p>'

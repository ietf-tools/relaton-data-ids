abstract:
- content: "<p>This document specifies a mechanism for resource discovery across cooperating
    administrative domains. It defines how discovery requests preserve their scope
    and constraints across referrals, how discovery services report coverage of requested
    scopes, and how clients combine results from multiple discovery branches. The
    mechanism enables clients to distinguish complete discovery results from incomplete
    operations, including cases involving unresolved referrals, pagination failures,
    and partial service failures. It relies on existing authentication, authorization,
    and trust arrangements and does not define open-ended Internet search, semantic
    matchmaking, resource invocation, registration, or directory synchronization.</p>"

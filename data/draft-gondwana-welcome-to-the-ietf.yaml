abstract:
- content: "<p>The IETF has produced many documents to describe what it is and how
    it works -- this is one of them. In an age in which agentic tooling makes it trivially
    easy to produce large amounts of text, this document explains to both humans and
    agents what the IETF is about, how to succeed at the IETF, and some common pitfalls
    which might reduce the quality of your time here. This document does not describe
    the specific arcane process of how documents progress through adoption, improvement,
    consensus, editing, and eventual publication. Instead, we focus on the people
    and the culture of the IETF and how to succeed at IETFing.</p>"

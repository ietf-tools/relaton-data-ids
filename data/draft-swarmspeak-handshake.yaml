abstract:
- content: "<p>AI agents are becoming some of the biggest users of the Internet. A
    site today has no neutral way to tell a good agent from a bot. The site sees either
    an anonymous request it cannot trust, or a request carrying a long-lived credential
    it cannot check. The result is blunt blocking on one side and unchecked abuse
    on the other. This document defines the SwarmSpeak Handshake, a protocol that
    lets an AI agent present a short-lived, narrowly scoped, signed statement of who
    it acts for and what it is allowed to do, and lets a site verify that statement
    cheaply before serving the request. The agent proves authority with a principal-signed
    capability certificate, a short-lived directory-signed status proof, and an HTTP
    Message Signature. The site sees only a per-origin pseudonym for the agent, never
    a global tracking identifier. Every completed session at a handshake-accepting
    site produces an itemized receipt, and receipted sessions are recorded in an append-only
    audit log. This is an individual submission. It is not a product of any IETF working
    group, it has not been reviewed by any IETF working group, and it does not represent
    IETF consensus. It is published to invite review and to record prior art for the
    shapes defined here: the capability certificate, the per-origin certificate view,
    the short-lived status proof, and the receipt.</p>"

schema-version: v1.2.3
id: draft-ietf-6man-enhanced-vpn-vtn-id
title:
- content: Carrying Network Resource Context Information in IPv6 Extension Headers
    and its Applicability to Network Resource Partitions
  language:
  - en
  script:
  - Latn
  format: text/plain
docid:
- id: draft-ietf-6man-enhanced-vpn-vtn-id
  type: Internet-Draft
  primary: true
abstract:
- content: "<p>This document specifies a new IPv6 Hop-by-Hop option to carry Network
    Resource related information in data packets. The new option is called the Network
    Resource (NR) Option. It can be used to carry general information about network
    resource semantics and functions. A Network Resource Partition (NRP) is a subset
    of the network resources and associated policies on each of a connected set of
    links in an underlay network. When forwarding packets within a specific NRP, some
    fields in the data packet (these fields are called the NRP Selector ID) are used
    to identify the NRP to which the packet belongs so that NRP-specific processing
    can be performed on each node along the forwarding path. The Network Resource
    Option can be used to carry the NRP Selector ID in IPv6 packets.</p>"
  language:
  - en
  script:
  - Latn
  format: text/html

abstract:
- content: "<p>This document specifies the use of MPEG Media Transport (MMT) as a
    container format for Media over QUIC (MoQ). MMT provides a unified framework for
    streaming media over heterogeneous networks including broadcast (ATSC 3.0, ARIB
    STD-B60), multicast (SSM), and unicast (QUIC/WebTransport). This specification
    defines the mapping of MMT packets to MoQ objects, interaction with Application-Layer
    FEC, bidirectional conversion between S-TSID and MoQ catalogs, and compatibility
    considerations for both ATSC 3.0 and ARIB STD-B60 systems.</p>"

abstract:
- content: "<p>Existing Internet security mechanisms authenticate communication endpoints,
    human principals, and software workloads. However, independent implementations
    do not necessarily share a common representation of the relationship between an
    originating authorization, subsequent workload generations, delegated permissions,
    and resulting application effects across administrative boundaries. This document
    investigates whether additional interoperability conventions are needed to preserve
    and enforce that relationship. The proposed model establishes a bounded root of
    authority through an originating authorization. Descendant workloads operate under
    independently identifiable, revocable, non-expanding grants. Application exchanges
    associate requests and responses with their execution principals, authorization
    lineage, policy context, operation identifiers, and replay-protection state. Protected
    resources retain final authority over their data and effects. This document identifies
    the interoperability problem, trust boundaries, security objectives, and unresolved
    architectural decisions. It distinguishes requirements for future profiles from
    behavior described for the experimental review profile http6-rw- review-1.0. It
    does not establish the necessity of a new transport, select a production cryptographic
    construction, or claim independently reproduced security or interoperability results.
    HTTP6 is a project designation, not an assigned HTTP version, ALPN identifier,
    URI scheme, or service port.</p>"

abstract:
- content: "<p>This document defines the rules for representing the RESTful Provisioning
    Protocol (RPP) data objects using the JavaScript Object Notation (JSON) Data Interchange
    Format. It specifies how RPP primitive types, common data types, Component Objects,
    Data Objects, and associations are mapped to JSON and JSON Schema, and provides
    normative JSON Schema definitions and examples for the RPP Data Objects, the representation
    of update requests, and an extension framework.</p>"

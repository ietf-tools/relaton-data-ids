abstract:
- content: "<p>RFC 6532 extends the internet email format to allow UTF8 in many contexts.
    This document restricts the set of allowed addresses in header fields slightly,
    and thereby simplifies use of these addresses. This is one of a pair of documents.
    This one is simple to implement and contains only globally viable rules. Its companion
    has more complex rules, takes regional usage into account, and describes addresses
    that can be read by some community and cut-and-pasted in some locale.</p>"

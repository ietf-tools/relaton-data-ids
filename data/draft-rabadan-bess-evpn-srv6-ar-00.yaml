abstract:
- content: "<p>Assisted Replication (AR) is an optimized ingress replication solution
    for Ethernet VPN (EVPN) Broadcast and Multicast (BM) traffic. AR offloads the
    replication effort from ingress Network Virtualization Edge (NVE) devices onto
    Assisted Replication Replicators (AR-REPLICATORs). The base AR specification is
    focused on Network Virtualization Overlay (NVO) networks that use IP tunnels,
    and it is typically deployed for Virtual eXtensible Local Area Network (VXLAN).
    EVPN services can also be instantiated over Segment Routing over IPv6 (SRv6);
    however, the SRv6 EVPN transport specification supports only ingress replication
    for BUM traffic, and the AR procedures rely on IP-tunnel semantics (such as the
    tunnel source and destination IP addresses) that do not map exactly to an SRv6
    data plane. As a result, AR cannot be readily deployed over SRv6 tunnels. This
    document specifies the applicability of Assisted Replication to SRv6 tunnels,
    for EVPN BM traffic, for selective multicast based on Internet Group Management
    Protocol (IGMP) and Multicast Listener Discovery (MLD) proxy, and for EVPN IP
    multicast traffic based on Optimized Inter-Subnet Multicast (OISM). It defines
    a new SRv6 Endpoint behavior for the AR-REPLICATOR role and the associated control-plane
    procedures, so that the AR solution can be used with an SRv6 underlay.</p>"

abstract:
- content: "<p>Software agents increasingly call agents and services operated by other
    organizations. A receiving organization often wants to know two things about any
    such caller: that it is the agent it claims to be, and that the organization operating
    it still authorizes it. Existing approaches to the second question require a trust
    relationship between the two organizations' authorization servers. This document
    defines a DNS record by which the owner of a domain links an agent's DNS name
    to the OAuth client that the agent uses at the owner's own authorization server.
    The sending agent presents a fresh access token for that client; the receiver
    verifies the token against the record and against the issuer's published keys.
    No trust relationship, registration or federation between the two organizations
    is needed, and disabling the client at the sending organization's authorization
    server stops the agent being accepted by every receiver.</p>"

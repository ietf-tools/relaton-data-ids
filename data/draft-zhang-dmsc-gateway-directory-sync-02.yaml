abstract:
- content: "<p>This document describes a gateway capability-directory framework for
    Internet of Agents deployments that maintain persistent capability views and exchange
    selected information across gateways. It defines requirements for Agent Capability
    Specifications (ACSs), derived Capability Digests, lifecycle state, provenance,
    validation, and synchronization. It clarifies authority-scoped revisions, remaining-
    lifetime preservation, withdrawal handling, partial views, and recovery after
    disconnection or state loss. The framework distinguishes source descriptions from
    gateway-accepted objects and distinguishes directory visibility from semantic
    compatibility, authorization, and execution admission. It does not define a discovery
    query protocol, ranking algorithm, storage substrate, distributed lookup algorithm,
    synchronization wire format, task orchestration protocol, or agent session protocol.
    It provides requirements that can inform subsequent gateway procedures and protocol
    bindings.</p>"

abstract:
- content: "<p>The MIMI protocol requires each provider to authenticate the provider
    that sends it a request. It specifies mutually authenticated TLS for this, but
    not where the client certificates come from or which trust anchors check them.
    The public Web PKI has stopped issuing such certificates. This document defines
    how MIMI providers authenticate each other without it. The mechanism every provider
    implements is a key published in DNS under the provider's domain, used to sign
    each request with HTTP Message Signatures. DANE client certificates, client certificates
    from configured PKIX trust anchors, and locally configured trust lists are defined
    as additional mechanisms that a provider can accept by local policy.</p>"

abstract:
- content: '<p>This document defines the OpenA2A Agent Identity Protocol (OpenA2A
    AIP), an open standard for creating, managing, and verifying cryptographic identities
    for AI agents. As AI agents proliferate across browsers, cloud platforms, and
    enterprise environments, systems need a standardized answer to the question of
    which agent is present, what it is permitted to do, and whether it should be trusted.
    OpenA2A AIP is distinguished by five elements that it places at the center of
    the design: a multi-factor behavioral trust score that is computed from independently
    verifiable signals; a portable signed credential, the Agent Trust eXtension, carrying
    a hybrid Ed25519 and ML-DSA-65 signature for post-quantum readiness; an append-only,
    RFC 9162-style Merkle transparency log for identity and credential issuance; agent
    identifiers expressed as W3C Decentralized Identifiers under the did:opena2a method;
    and a structured capability vocabulary with reserved namespaces. On top of these,
    the protocol specifies challenge-response verification, behavioral governance
    policies, a lifecycle model, and an append-only audit log. The qualifier "OpenA2A
    AIP" is used throughout this document because the abbreviation "AIP" is shared
    by other Internet-Drafts. OpenA2A AIP is framed as complementary to agent communication
    protocols such as A2A and the Model Context Protocol, and to identity and credential
    standards such as OpenID Connect, WebAuthn, and the W3C Verifiable Credentials
    Data Model.</p>'

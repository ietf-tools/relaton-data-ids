abstract:
- content: "<p>An AI agent that can act cannot be governed unless there is a normative
    contract for how it receives its world, how it declares its intent, and how it
    learns what it is and is not permitted to do -- at every step, in every iteration,
    without exception. AI agents operating on governed resources require a normative
    interface contract between their internal reasoning loop and the Governing Enforcement
    Component (GEC) that enforces authorization policy, records transitions to a tamper-evident
    Event Stream, and mediates access to Sovereign Object instances. Existing agent
    frameworks define no such contract. Agents submit actions without a normative
    delivery protocol for the state and permission context they act on; GECs enforce
    policy without a normative protocol for communicating denial rationale back to
    agents; human oversight is invoked without a normative session state that governs
    the resulting suspension. This document defines the Agent Execution Protocol (AEP):
    the normative five-step loop -- SENSE, REASON, PLAN, ACT, OBSERVE -- that specifies
    how a governed AI agent interfaces with GEC services at each iteration. The AEP
    defines the Context Package delivered at SENSE, the GEC Query Interface exercised
    at PLAN, the Transition Request submitted at ACT, and the atomic GEC response
    received at OBSERVE. The AEP specifies two conformance modes -- Standard and Goal
    Execution Engine (GEE) -- and normatively integrates the Intent Declaration Primitive
    [I-D.sato-soos-idp], the Mandate JWT [I-D.sato-soos-mjwt], the Human Escalation
    Mechanism [I-D.sato-soos-hem], the Governance Audit Record [I-D.sato-soos-gar],
    the Constitutional AI Protocol [I-D.sato-soos-cap], and the Sovereign Object [I-D.sato-soos-sov]
    as components of a single governed execution architecture. The REASON step is
    intentionally GEC-unspecified: the LLM reasoning engine is opaque to the protocol.
    The AEP is the transmission between the LLM engine and the GEC enforcement substrate.
    Version -02 adds: XPID binding at session open (GEC MUST bind XPID from KIA-verified
    Party Registry; MUST NOT accept client-supplied XPID); STALLED and PLAN_B_ACTIVE
    session states with full normative definitions, trigger conditions, and resume
    conditions; Expected Outcome Declaration (EOD) as a pre-session commitment structure
    with primary outcome, acceptance envelope, and pre-declared Plan B; RETRY_CONTINUATION
    normative strengthening with what-changed-since- last-attempt requirement and
    prior_denial_count Cedar attribute; AEP-to-OTel mapping section (Section 8) with
    mandatory span attributes at each AEP phase; four new Security Considerations;
    and updated IANA registrations for new state codes and EOD media type.</p>"

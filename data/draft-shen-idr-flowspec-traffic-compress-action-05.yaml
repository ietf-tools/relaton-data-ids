abstract:
- content: "<p>BGP Flow Specification Version 2 (FSv2) provides an extensible framework
    for disseminating traffic flow specification rules and associated actions. While
    traditional Flow-spec actions cover rate- limiting, redirecting, and marking,
    emerging applications require dynamic bandwidth optimization. This document specifies
    a new traffic filtering action to support selective, on-demand traffic compression
    across network domains using BGP Extended Communities aligned with the FSv2 architecture.</p>"

abstract:
- content: "<p>This document defines an extension to the System for Cross-domain Identity
    Management (SCIM) for binding SCIM User resources to decentralized identity artifacts,
    including Decentralized Identifiers (DIDs) and Verifiable Credentials (VCs). The
    extension introduces a read-only SCIM schema extension for User resources that
    exposes binding state for discovery, a new SCIM resource type named IdentityBinding
    that records auditable linkage between a SCIM user and one or more DIDs and credential
    references, and an optional SCIM schema extension for ServiceProviderConfig that
    advertises server capabilities for DID and VC binding. This specification intentionally
    does not define DID resolution, credential issuance, credential transport, or
    authentication flows. Instead, it defines how a SCIM service provider represents,
    discovers, queries, and manages binding state derived from those systems. This
    specification defines binding lifecycle semantics including classification of
    SCIM attribute changes as material to credential claims, partial revocation when
    only a subset of credential claims is affected by a SCIM change, three supported
    lifecycle interleavings between SCIM resources and externally issued credentials,
    and propagation of binding state changes via SCIM Events [RFC9967].</p>"

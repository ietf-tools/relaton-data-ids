abstract:
- content: "<p>As autonomous AI agents become the primary intermediaries between humans
    and the web, humans increasingly perceive the web only as agents present it: summarized,
    filtered, ranked, translated, and rewritten. Machine-Web Symbiosis [REILLY-MWS]
    gives machines verifiable ground truth about web content; no equivalent mechanism
    gives humans verifiable ground truth about what agents did to that content before
    presenting it. This document defines Cognitive Sovereignty (CS): the principle
    that a human consuming agent-curated content retains the right and the technical
    capacity to (1) know that curation occurred, (2) inspect what transformations
    were applied and under what declared agent policy, (3) reach the attested, un-curated
    source, and (4) verify all of the above using only public data and open specifications.
    The document specifies a complete implementation: the Curation Disclosure Record
    (CDR) format, the pipeline by which conforming agents generate CDRs, the mechanisms
    by which CDRs are delivered alongside curated content, and the procedure by which
    any consumer verifies them. CS composes directly with the Reilly Protocol Suite:
    MWS records supply source ground truth, the Cognitive Trust Stack supplies agent
    behavioral provenance, and Dual-Layer Digital Permanence anchors the disclosure
    chain.</p>"

abstract:
- content: "<p>This document specifies Aether, a transport-layer protocol (L4) designed
    for modern network environments requiring multiplexed streams without head-of-line
    blocking, mandatory encryption with post-quantum resistance, multi-path routing,
    and self-sovereign identity at the protocol layer. Aether operates entirely in
    userspace without kernel modifications.</p>"

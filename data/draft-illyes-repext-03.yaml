abstract:
- content: <p>This document extends RFC9309 by specifying additional URL level controls
    through an HTTP response header and, for historical reasons, through HTML meta
    tags originally developed in 1996. Additionally it moves the HTTP response header
    out of the experimental header space (i.e., "X-") and defines the combinability
    of multiple headers, which was previously not possible.</p>

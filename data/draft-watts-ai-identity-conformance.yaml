abstract:
- content: "<p>This document defines provider-independent conformance requirements
    for AID-1. It specifies the execution model for a deterministic machine-readable
    test-vector corpus, including canonicalization, cryptographic, identity-binding,
    delegation, authorization, temporal, revocation, replay, attestation, provenance,
    and integration cases. The conformance corpus contains 69 vectors. Six replay
    cases are architectural boundary tests, including R5, which requires AID-1 verification
    to succeed while a downstream D6 scientific- admissibility decision rejects the
    same evidence.</p>"

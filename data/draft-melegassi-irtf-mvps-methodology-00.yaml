abstract:
- content: "<p>The Multi-Vantage Path Snapshot (MVPS) family of Internet-Drafts is
    built on a single discipline rather than a single algorithm. This document records
    that discipline as a set of nine machine-checkable meta-invariants (M-1..M-9):
    every claim is classified as a Theorem, a Design, or a Conjecture; every Theorem
    traces to a closed basis of twelve imported results (I1..I12); every Conjecture
    carries a four-field falsification protocol; every draft ships a proof/validator/receipt
    trio; and an adversarial-audit ledger of eight rounds and forty-four findings
    is kept, each finding either defended or reclassified. The contribution is offered
    to the research community as a template that other measurement-security efforts
    MAY adopt, independent of MVPS's specific mathematics. This document defines no
    protocol, introduces no wire format, and requests no IANA action. Its claims are
    themselves validated: scripts/validate_methodology_discipline.py returns exit
    0 over the eleven discipline checks and writes evidence/methodology_discipline_receipt.json.</p>"

abstract:
- content: "<p>A device may legitimately possess exact location while an application,
    SDK, AI agent, analytics library, or foreign endpoint is entitled only to a coarser
    representation, a delayed or randomized representation, or no location at all.
    Operating system permission to read a fix does not answer whether that fix may
    leave the device at the requested precision. This document defines a precision-bounded
    egress profile: a data- minimization mechanism applied at the point of external
    disclosure, on top of an execution-finality architecture, applicable equally to
    conventional applications and to autonomous AI agents acting on a user's behalf.
    The gap this closes is concrete: an application that legitimately reads exact
    GPS for one on-device purpose commonly shares its process with an embedded SDK,
    agent tool, or cloud sync path that can forward the same exact coordinate to a
    destination that never needed it, without the user seeing that forwarding as a
    separate disclosure. A proposed release is a Location-Release Candidate Act and
    remains non-effective while a Protected Enforcement Domain evaluates purpose,
    requester, component, recipient, destination, jurisdiction, required precision,
    policy and revocation state, cumulative disclosure state, and intended egress
    sink. The Protected Enforcement Domain issues scoped, non-bearer, cryptographically
    bound finality authority for a specific precision ceiling, expressed using the
    JSON interoperability objects defined in this document. An independent egress
    Finality Sink verifies that authority against the actual outbound payload immediately
    before release, so the bound ceiling, rather than the requester's declared precision,
    determines what may leave the device. The permitted result may be exact data,
    a reduced representation, or denial. Data access is not data-export authority.
    Precise GPS access is not precise GPS-release authority.</p>"

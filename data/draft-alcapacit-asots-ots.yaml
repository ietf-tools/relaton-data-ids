abstract:
- content: "<p>This document specifies Version 1 of the Oblivious Transport Security
    (OTS) protocol. OTS provides a connection-oriented, encrypted, and authenticated
    transport channel that operates independently of the underlying carrier network.
    Unlike TLS, OTS eliminates plaintext handshake metadata, client implementation
    fingerprints, traffic- analysis side channels, and cross-epoch network-layer address
    correlation by enforcing fixed-size datagrams, constant-rate transmission scheduling,
    cryptographic path binding, and synchronized ephemeral endpoint rotation without
    third-party proxies or relays.</p>"

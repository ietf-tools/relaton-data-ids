abstract:
- content: "<p>This document specifies extensions to the Path Computation Element
    Communication Protocol (PCEP) to support Flow Specification for Segment Routing
    over IPv6 (SRv6). Building upon the PCEP Flow Specification framework defined
    in RFC 9168, this specification introduces new PCEP Flow Specification TLVs to
    enable filtering and steering of IPv6 packets based on the structural components
    of standard SRv6 Segment Identifiers (SIDs) or SRv6 Compressed SID (CSID) containers
    present in IPv6 Destination Addresses or Segment Routing Headers (SRH).</p>"

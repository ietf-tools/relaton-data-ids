abstract:
- content: "<p>Agent audit records are signed, chained, counter-signed, timestamped,
    and registered with transparency services. Each mechanism establishes a narrower
    fact than it is often taken to establish. This document states, for any record
    format, protocol, or payment method, what a check of an agent audit record can
    and cannot establish about four properties: the independence of the entities that
    signed or observed it, the completeness of a set of records, the time at which
    a record or an action existed, and the result that a verifier reports. It defines
    independence by control rather than by key or process separation, separates the
    independence of a signer from the independence of an observation, states which
    commitments cannot support a report that a set of records is complete, and requires
    a verifier to report unauthenticated content as unauthenticated. It defines no
    record format, role, log, or service.</p>"

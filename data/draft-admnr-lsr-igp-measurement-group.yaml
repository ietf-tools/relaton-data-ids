abstract:
- content: "<p>This document defines an IS-IS capability sub-TLV for advertising measurement
    group membership for Active Measurement Protocols (AMPs) such as TWAMP and STAMP.
    The mechanism allows IGP routers to discover other routers participating in different
    measurement groups, enabling automatic discovery of measurement endpoints throughout
    an IS-IS routing domain. The solution uses a Group ID to identify measurement
    group membership, where the same interface address (IPv4 or IPv6) may be used
    for multiple measurement groups.</p>"

abstract:
- content: "<p>This document registers code points for the use of the Chinese ShangMi
    (SM) cryptographic algorithms with CBOR Object Signing and Encryption (COSE) and
    JSON Object Signing and Encryption (JOSE): the elliptic curve curveSM2, the SM2
    digital signature algorithm with the SM3 hash function, SM2 public key encryption
    for content key transport, HMAC-SM3, and the SM4 block cipher in GCM mode. For
    COSE, it additionally registers the SM3 hash function, key derivation with HKDF-SM3,
    and SM4 in CCM mode.</p>"

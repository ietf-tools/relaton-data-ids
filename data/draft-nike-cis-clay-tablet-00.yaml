abstract:
- content: '<p>This document specifies Ceramic Immutable Storage (CIS), a write-once
    archival storage format in which digital data is impressed into plastic clay by
    a pin-configurable roller, rendered permanent by kiln firing, and retained on
    a shelved rack. CIS is motivated by a specific and increasingly common failure
    mode: the loss of data to an authenticated software process acting outside its
    operator''s intent. Every widely deployed "immutable" storage tier is immutable
    by policy, and every policy is enforced by software that some credential, defect,
    or sufficiently determined automated agent can override. CIS relocates the immutability
    guarantee from policy to physics. The commit operation in CIS is an irreversible
    mineralogical phase change, and no inverse operation exists for any actor, mechanical
    or digital. This document defines the substrate, the encoding geometry, the frame
    format, the forward error correction scheme, the firing profile that constitutes
    commit, the rack addressing model, and the optical read path. It also documents,
    at length, the substantial costs of this approach.</p>'

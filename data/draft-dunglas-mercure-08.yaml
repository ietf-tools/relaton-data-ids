abstract:
- content: "<p>Mercure provides a common publish-subscribe mechanism for public and
    private web resources. It pushes any web content to web browsers and other clients
    over a single long-lived HTTP connection, avoiding polling and its associated
    latency and power cost. Mercure is especially useful for delivering real-time
    updates of resources served through sites and web APIs to web and mobile applications,
    and can also be used as a general-purpose publish-subscribe system. Subscription
    requests are relayed through hubs, which validate them. When new or updated content
    becomes available, hubs check whether subscribers are authorized to receive it
    and then distribute it.</p>"

abstract:
- content: "<p>An SR Policy consists of one or more Candidate Paths (CPs), each comprising
    one or more segment lists. BGP can be used to propogate SR Policy CPs to the SR
    Policy headend nodes in the network. After an SR Policy CP is installed on the
    headend node, packets can be steered into the SR Policy. For a particular BGP
    destination, if there are multiple BGP routes with different next-hops, BGP best
    path selection is performed and the IGP metric to the next-hop node may be used
    for tie-breaking to select the best path. When the path to the next-hop is resolved
    over an SR Policy, the IGP metric of the SR policy is needed for BGP path selection.
    This document defines the BGP extensions to carry the IGP metric of segment lists
    when BGP is used to propagate SR Policy CPs.</p>"

abstract:
- content: "<p>This document defines the Protocol for Agent Communication Exchange
    (PACE), a session protocol for AI agent communication over Media over QUIC Transport
    (MOQT). PACE provides session lifecycle management, multi-modal data exchange,
    agent identity verification, and delegated authorization within MOQT's publish/subscribe
    model, supporting point-to-point and point-to-multipoint topologies through relay
    infrastructure.</p>"

abstract:
- content: "<p>This document reports experiments with post-quantum signature algorithms
    and analyzes migration approaches for the Resource Public Key Infrastructure (RPKI).
    The experiments compare classical, post- quantum, and composite signature candidates;
    generate and validate RPKI-profiled certificate, CRL, manifest, and ROA test objects;
    compare separately produced Current Suite and Next Suite validation outputs; and
    demonstrate an experimental Mixed Tree. The evaluation also models an idealized
    parallel-publication footprint and estimates RRDP delta and snapshot response-body
    sizes from captured RPKI data. The results identify implementation, interoperability,
    repository- distribution, and operational questions that need to be resolved before
    a production algorithm profile or transition procedure can be specified. This
    document is informational. It does not update RFC 7935 or RFC 6916, define a new
    RPKI algorithm profile, or authorize the use of the evaluated algorithms or Mixed
    Tree migration in the production RPKI.</p>"

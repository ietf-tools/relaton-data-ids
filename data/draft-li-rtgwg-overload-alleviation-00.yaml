abstract:
- content: "<p>Network links may become degraded because of physical conditions or
    owing to partial link failure: this can result in a reduction of available bandwidth.
    Alternatively, traffic volume may increase significantly and unexpectedly. These
    circumstances may lead to links becoming overloaded which can result in dropped
    packets or degraded delivery such as increased delay. Traffic adjustment techniques
    can be applied to alleviate these link- overload situations by steering some of
    the traffic onto other paths that are less loaded and have available bandwidth.
    This document examines the scenarios in which links can become overloaded, the
    requirements for steering traffic to reduce link- overload, and the techniques
    that can be applied to alleviate overloaded links.</p>"

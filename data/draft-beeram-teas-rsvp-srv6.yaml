abstract:
- content: "<p>RFC 8577 defines mechanisms to signal RSVP-TE tunnels on a shared MPLS
    forwarding plane by introducing the notion of per-TE link labels that are functionally
    equivalent to SR-MPLS adjacency segments. This document extends that work to the
    SRv6 data plane, defining the signaling extensions and procedures necessary to
    establish RSVP-TE tunnels that utilize SRv6 Segment Identifiers (SIDs) for forwarding.
    This document specifies how SRv6 End.X SIDs that are advertised in the IGP serve
    as TE link SIDs, defines new RSVP signaling extensions for carrying SRv6 SIDs
    and for influencing the endpoint behavior flavors of the SIDs, describes TE path
    segment-list construction procedures at the ingress (including NEXT-CSID compressed
    segment lists), adapts the delegation mechanisms of RFC 8577 to use SRv6 Binding
    SIDs, and describes the termination of the tunnel at the egress. The result couples
    the traffic engineering capabilities of the RSVP-TE control plane with the native
    IPv6 forwarding of SRv6.</p>"

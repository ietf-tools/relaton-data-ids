abstract:
- content: "<p>This document defines an experimental deep-space companion profile
    for the TLS TimeToken Secure Protocol (TTTPS). It preserves the fixed Proof-of-Time
    core record and separates cryptographic validity from propagation-aware temporal
    applicability. The profile binds physical context out of band, distinguishes one-way
    light time from two-way transaction delay, defines evidence and disposition boundaries,
    and composes peer aggregation with optional confidence qualification. It does
    not claim flight performance, a live interplanetary mesh, or replacement of existing
    navigation or delay- tolerant networking standards.</p>"

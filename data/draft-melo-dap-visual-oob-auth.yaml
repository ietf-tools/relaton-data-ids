abstract:
- content: <p>This document specifies the Dynamic Authorization Protocol (DAP), an
    Out-of-Band (OOB) visual transaction authorization protocol, used as a second
    factor, for electronic financial transactions initiated on untrusted terminals.
    The terminal displays a cryptographically protected challenge as a Quick Response
    (QR) code. A trusted mobile device of the user, which needs no network connection,
    scans the code, verifies it with HMAC-SHA-256, shows the transaction details for
    confirmation ("What You See Is What You Sign"), and then reveals a one-time authorizer
    code protected with AES-256. Each challenge is bound to one transaction and expires
    within 120 seconds. The document also describes the provisioning of the shared
    key through a dual-channel XOR split-key exchange, its activation, and the templates
    used to display transactions. DAP targets Man-in-the- Middle (MITM) and Man-in-the-Browser
    (MITB) adversaries that control the terminal and alter transaction parameters.</p>

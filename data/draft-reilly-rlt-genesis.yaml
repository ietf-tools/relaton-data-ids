abstract:
- content: "<p>This document defines the REM License Token, referred to as the RLT,
    as the genesis artifact of the Reilly EternaMark Protocol (REM) for digital permanence
    and verifiable provenance. This specification formally defines the token structure,
    issuance procedures, multi-algorithm cryptographic hash requirements, blockchain
    anchoring requirements, DOI archival requirements, IPFS pinning requirements,
    REMID namespace registration, verification methodology, token lifecycle management,
    ecosystem integration, and security model. The RLT represents an implementation
    of a Dual-Layer Digital Permanence artifact combining a Bitcoin blockchain timestamp
    with DOI-based archival to achieve durable, tamper-evident provenance guarantees.
    Revision -01 expanded the token schema to version 2.0, introduced multi-algorithm
    hashing via the REM Multi-Algorithm Stack (REM-MAS), defined formal token lifecycle
    procedures, and documented the RLT's integration with the broader REM Protocol
    ecosystem including the Protocol Layer Prompt Engineering Specification (PLPES),
    the Cognitive Trust Stack (CTS), the AI Machine-Readable Ethics Directive (AIMED),
    and related Informational Internet-Drafts authored by Lawrence John Reilly Jr.
    This revision (-02) is additive. It retains the whole of the -01 specification
    and adds token schema version 2.1, a canonical form and record digest for token
    self-integrity, salted field commitments with selective disclosure, a COSE signature
    profile, batch issuance with Merkle aggregation, pending and attested anchor states,
    hash migration bridging records, conformance levels C0 through C4, status records
    and a revocation registry, an anchor scope rule, the prior art record function
    under 35 U.S.C. 102(a)(1), and further ecosystem, privacy, and evidentiary considerations.
    This document is published as an Informational Internet-Draft to serve as open,
    implementable guidance.</p>"

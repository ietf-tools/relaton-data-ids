abstract:
- content: "<p>Group communication for the Constrained Application Protocol (CoAP)
    can be protected end-to-end by using the security protocol Group Object Security
    for Constrained RESTful Environments (Group OSCORE). The pairwise mode of Group
    OSCORE provides authenticated encryption of CoAP messages, by means of symmetric
    keys that two group members establish only among themselves to achieve pairwise
    secure communication. This document defines the use of quantum-resistant Key Encapsulation
    Mechanisms (KEMs) as Pairwise Key Agreement Algorithm of Group OSCORE, enabling
    post-quantum secure derivation of the symmetric keys used in the pairwise mode.
    The Group Manager facilitates the exchange of KEM public keys and KEM ciphertexts
    among group members.</p>"

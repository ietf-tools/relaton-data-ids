abstract:
- content: "<p>This memo specifies a read-time freshness evaluator and an observation-gated
    re-assertion discipline for concurrent autonomous readers of a single reconciled
    substrate history. For every claim read from the substrate, a three-state currency
    band (FRESH, AGING, STALE) is derived at read time from the durable history and
    is never stored. A claim whose derived band is not FRESH MUST NOT be re- emitted
    as current and MUST NOT ground a new durable claim; the sole transition back to
    currency is a fresh observation of the claim's basis, and the substrate's append
    stage enforces that for every reader. The memo specifies the claim-layer consumer
    that two companion specifications, Substrate-Observation as an Alternative to
    Envelope Coordination and the Substrate-Provenance Annotation Grammar, each left
    unspecified. It composes a read-time-derived band, a decay clock measured in missing
    observations learned from a basis's own change cadence, an append-stage rejection
    of any claim citing a basis that is no longer the head of its lineage, and observation
    as the only admissible refresh. No new substrate is standardised; the discipline
    composes with substrate that already exists.</p>"

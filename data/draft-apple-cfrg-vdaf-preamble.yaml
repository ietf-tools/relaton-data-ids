abstract:
- content: "<p>This document describes PREAMBLE, a two-party Verifiable Distributed
    Aggregation Function (VDAF) for secure aggregation where each client holds a large-dimensional
    vector that is _block-sparse_, meaning it is divided into fixed-size blocks of
    which at most one is nonzero, and that nonzero block itself satisfies a specified
    Fully Linear Proof (such as multihot, or a bounded L1 or L2 norm).</p>"

abstract:
- content: "<p>The WIMSE Workload Proof Token (WPT) proves possession of a workload's
    key for an HTTP request and binds the tokens that travel with it. Agent protocols
    increasingly carry their messages over other transports, such as Media over QUIC,
    WebSocket, or QUIC streams, often through intermediaries that terminate TLS, such
    as relays, message brokers, or gateways. There, a proof has no HTTP request to
    bind to, and the intermediaries that forward a message do not verify it, so freshness
    has to be established by the receiving verifier. This document defines how a WPT
    is used with a message that carries it, adds a claim that binds the proof to the
    content of that message and a claim that echoes a nonce supplied by the verifier,
    and defines a registry of message canonicalization profiles, with a profile for
    JSON messages. The same claims can be used in an SD-JWT Key Binding JWT.</p>"

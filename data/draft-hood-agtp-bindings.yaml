abstract:
- content: "<p>The Agent Transfer Protocol (AGTP) is a transfer protocol whose semantics
    are defined independently of any transport. This document specifies three transport
    bindings: TCP with TLS 1.3, QUIC, and HTTP/3 (with WebTransport where a browser
    or an HTTP intermediary is in the path). Each binding defines how AGTP requests
    and responses are carried, how TLS mutual authentication composes with AGTP identity,
    and how the transport's connection lifecycle relates to the agent-level session
    defined in the AGTP session companion, which a connection carries and never is.
    A central concern for the QUIC binding is replay safety. QUIC supports 0-RTT early
    data, which is replayable by design. AGTP requests carry authority-scoped actions;
    a replayed action method could re-trigger authorized work without the requesting
    agent's intent. This document defines an AGTP-specific replay-safety profile:
    early data is permitted only for the two safe idempotent methods whose replay
    has no observable effect (QUERY, DISCOVER), *MUST NOT* be used for action methods
    (EXECUTE, DELEGATE, PURCHASE, TRANSACT, the lifecycle methods, and the session
    methods), and always carries the per-request signature that bounds replay of even
    an eligible method. This document follows the pattern established by HTTP: protocol
    semantics defined independently of transport ([RFC9110] for HTTP), with transport-specific
    bindings in separate documents. AGTP semantics are defined in [AGTP]; this document
    defines the transport mechanics.</p>"

abstract:
- content: "<p>Home broadband networks have long used the subscriber session as their
    smallest unit of management: one PPPoE or IPoE session carries the upstream and
    downstream rates, the QoS policy, and the accounting records for everything the
    subscriber does. The network cannot identify the different services carried inside
    that session, nor can it authorize, schedule, or charge any one of them separately.
    As AI inference, live streaming, and cloud desktops grow on the home side, the
    one-session-one-policy model no longer matches how services are sold and experienced.
    Operators have begun deploying AI capabilities on the compute boards of intelligent
    broadband network gateways (iBNGs). That solves service identification, but the
    underlying RADIUS-based framework still speaks only session granularity, so the
    operational loop cannot be closed with standard mechanisms. This document describes
    the operational background, defines two representative use cases, and analyzes
    the gaps in the existing subscriber management framework. It is an informational
    problem statement and does not define new protocol mechanisms.</p>"

abstract:
- content: <p>A value exported from a YANG data tree is often unique only within its
    parent, for example an entry numbered 0 under two different parents. Once the
    value is exported without the parent's key, a collector cannot tell whether two
    such values refer to the same thing, and no collector-side normalization can recover
    the missing key. YANG (RFC 7950) has no way to state this dependency in the schema.
    This document defines a YANG extension statement, "csc:comparability-scope", a
    four-level scope lattice, a compatibility rule, and an export rule, so that the
    key needed to compare a value travels with it, and a schema-aware tool can detect
    an invalid comparison before any data is exported.</p>

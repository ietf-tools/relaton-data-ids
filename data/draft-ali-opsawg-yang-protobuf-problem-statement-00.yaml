abstract:
- content: "<p>Network devices increasingly expose management, telemetry, and dynamic
    service interfaces using gRPC and Protocol Buffers. Many of these interfaces carry
    ephemeral or runtime state that is not intended to be stored as persistent configuration.
    At the same time, the IETF has standardized YANG as the primary data modeling
    language for network management and operations. This document describes the problem
    space and identifies questions for the IETF community regarding the role of YANG
    in defining interoperable Protocol Buffer based APIs.</p>"

abstract:
- content: <p>The on-demand discovery model of the Locator/ID Separation Protocol
    (LISP) is ineffective for "silent hosts", endpoints that do not initiate traffic.
    This is a common challenge in environments like manufacturing and IoT environments,
    where low-power devices frequently go silent to conserve energy. This document
    proposes a mechanism to discover these hosts by using the LISP mapping system
    itself. xTRs that are able to probe a given EID prefix register that capability
    with the Map-Server. When a Map-Request for an unknown destination arrives at
    the Map-Server, it is forwarded and replicated to all xTRs that have registered
    the covering EID prefix, initiating a controlled, on-demand discovery process
    for that specific host. This approach provides a scalable alternative to network
    flooding for locating silent endpoints.</p>

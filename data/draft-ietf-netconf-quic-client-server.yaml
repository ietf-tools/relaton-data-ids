abstract:
- content: <p>This document defines three YANG 1.1 modules to support the configuration
    of QUIC clients and QUIC servers. The common YANG module defines reusable groupings
    for setting parameters imported from the QUIC version and QUIC transport IANA
    YANG modules. The two QUIC client and server YANG modules define reusable groupings
    for QUIC connection settings, including the common QUIC parameters, for protocol
    implementation. Furthermore two initial YANG 1.1 modules for the IANA registries
    "QUIC Versions" and "QUIC Transport Parameters" are included in Appendix.</p>
  language:
  - en
  script:
  - Latn
  format: text/html

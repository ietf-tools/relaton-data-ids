abstract:
- content: "<p>This document describes an infrastructure-assisted approach to AI-agent
    discovery. An orchestration, placement, or hosting system can publish current
    deployment and reachability information for available AI-agent services or instances.
    Separately, network infrastructure can derive an abstract Attachment Scope representing
    the network context applicable to a requester. A discovery mechanism combines
    requester intent, currently published AI-agent resources, and the requester's
    Attachment Scope to identify applicable agent instances.</p>"

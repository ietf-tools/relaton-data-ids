abstract:
- content: '<p>This document requests registration of two Well-Known URIs under the
    "/.well-known/" path: "agents.txt" and "agents.json". These URIs define a machine-readable
    capability declaration format: a positive statement of what web agents CAN do
    on a site -- which endpoints are sanctioned for agent use, which protocols (REST,
    MCP, A2A, GraphQL, WebSocket) are supported, what authentication mechanisms are
    expected, and what rate limits the site advertises. This is distinct from "robots.txt",
    which uses a restriction syntax to declare what crawlers may not do. Where "robots.txt"
    expresses prohibition, "agents.txt" expresses capability -- a sanctioned channel
    for agent interaction that is otherwise routinely blocked by bot detection, CAPTCHAs,
    and rate limiters because no positive declaration surface exists.</p>'

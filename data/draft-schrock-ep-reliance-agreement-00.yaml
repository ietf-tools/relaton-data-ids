abstract:
- content: "<p>This document defines EP-RELIANCE-AGREEMENT-v1, a signed, machine-
    readable statement of terms conditioned on a specific relying-party evidence profile,
    and EP-RELIANCE-EVENT-v1, a signed per-action record joining one action, one reliance
    result, and one agreement. The agreement references the evidence condition by
    digest rather than restating or weakening it. Every required party signs the same
    canonical bytes, and monetary amounts are represented as decimal strings. Verification
    establishes signatures, content integrity, scope, time, and digest bindings. It
    does not authorize an action, re-evaluate the evidence packet, establish legal
    enforceability, issue insurance, determine coverage, allocate fault, prove solvency,
    reserve funds, or compel payment. Those decisions remain with the relying party
    and the applicable prose agreement, law, and dispute forum.</p>"

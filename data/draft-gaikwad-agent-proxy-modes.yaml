abstract:
- content: "<p>Agent-tool protocols such as the Model Context Protocol (MCP) enable
    AI applications to discover and invoke external tools, resources, and prompts
    through a standardized JSON-RPC interface. As deployments scale, intermediaries
    (proxies, gateways, sidecars) are inserted between clients and servers to provide
    transport adaptation, capability aggregation, security enforcement, and operational
    governance. No specification currently defines the behavioral requirements for
    such intermediaries. This document establishes a taxonomy of proxy modes, a layered
    architecture for pluggable proxy functionality, and normative requirements for
    each mode. It is designed to be protocol- agnostic in its architecture while referencing
    MCP as the primary instantiation.</p>"

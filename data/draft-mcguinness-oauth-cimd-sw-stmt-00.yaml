abstract:
- content: "<p>This specification defines a software statement in which a trusted
    party records its review of the exact octets of a client's Client ID Metadata
    Document (CIMD), and how an authorization server enforces that review when it
    admits the client at request time, without a registration. A CIMD carries the
    client's own metadata, which can change at any time, and a statement binds the
    review to one version of the document by its digest. The client presents the statement
    in a token or pushed authorization request, or publishes it where its document
    points. The authorization server accepts a statement only from an issuer it trusts,
    and also binds the presenter to the reviewed document, although for a public client
    that binding does not hold against a party that controls the user agent. Independently
    operated authorization servers can consume the same review, each under its own
    trust configuration and admission policy.</p>"

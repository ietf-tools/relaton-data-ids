abstract:
- content: "<p>This document defines a SCITT statement profile for recording what
    an AI agent did: the Agent Action Capsule. A Capsule is a digest- committed record
    of one agent action carrying its verdict-level disposition (executed, blocked,
    denied, errored, timed out), the deterministic constraints that were evaluated,
    the effect that was committed together with a confirmed-effect binding that distinguishes
    a dispatched attempt from an observed result, and an honest human-in- the-loop
    flag. Capsules are expressed as SCITT Signed Statements (COSE_Sign1) and made
    transparent by registration in a SCITT Transparency Service. A Capsule is recorded
    on every verdict, including refusals: a blocked or denied Capsule is the auditor-grade
    evidence that a gate worked.</p>"

abstract:
- content: "<p>This document specifies a companion profile to the AI Agent Authentication
    and Authorization draft [I-D.klrc-aiagent-auth], defining a signed authorization-evidence
    record produced by WIMSE- authorized AI agent actions. The evidence record (referred
    to as a Permit) commits cryptographically to the canonical request bytes dispatched
    after authorization, satisfies the audit minimum requirements enumerated in Section
    11 of the companion draft, and composes with HTTP Message Signatures, OAuth access
    tokens, and Shared Signals Framework eventing without requiring modifications
    to those existing standards. The profile is anchored in the SCITT profile defined
    in [I-D.munoz-scitt-permit-profile].</p>"

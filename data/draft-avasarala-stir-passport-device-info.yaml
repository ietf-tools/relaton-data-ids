abstract:
- content: <p>This document defines a PASSporT extension and a new claim, "dinfo",
    for carrying authenticated, privacy-minimized information about the endpoint associated
    with the origination of a call. The claim conveys coarse-grained device characteristics
    and an optional, non- correlatable device reference. The information is intended
    for use as an additional input to fraud analysis, policy enforcement, and operational
    diagnostics. It is not an assertion that the endpoint, caller, or call is trustworthy.
    This document specifies claim syntax, creation and verification procedures, privacy
    requirements, and IANA registrations.</p>

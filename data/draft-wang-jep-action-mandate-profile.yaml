abstract:
- content: "<p>This document defines the JEP Action Mandate Profile (JEP-AMP), a profile
    of the Judgment Event Protocol (JEP). JEP-AMP specifies how a JEP Delegation event
    can express a verifiable, bounded, revocable, and auditable mandate for an agent,
    human, organization, workflow, or system to perform an action on behalf of a principal.
    JEP-AMP does not redefine JEP-Core event verbs, signature semantics, event hash
    semantics, validation-level semantics, identity systems, credential systems, legal
    liability, regulatory sufficiency, or global authorization validity. Instead,
    it defines the minimum interoperable shape of an Action Mandate Descriptor and
    the rules by which relying parties, gateways, verifiers, and receipt systems can
    interpret a JEP Delegation event as a candidate action mandate under a stated
    trust, policy, and profile context. The profile is intended to support agentic
    workflows such as enterprise procurement, supplier payment, contract modification,
    data export, customer refund, claim handling, and other high- responsibility actions
    where pre-action authorization, in-action policy validation, and after-action
    receipt evidence are required.</p>"

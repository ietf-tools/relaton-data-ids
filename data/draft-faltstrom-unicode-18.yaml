- id: draft-faltstrom-unicode-18
  type: Internet-Draft
  primary: true
abstract:
- content: <p>This document describes the changes between Unicode 12.0.0 and Unicode
    18.0.0 in the context of IDNA2008. Some additions and changes have been made in
    the Unicode Standard that affect the values produced by the algorithm IDNA2008
    specifies. The review identifies certain newly added code points that are to be
    examined individually, and asks that they be identified as "UNDER REVIEW" in the
    IANA tables until that examination is done, as RFC 8753 provides. This document
    provides the necessary table to IANA to make its database consistent with Unicode
    18.0.0. All values in this document are computed from the released Unicode Character
    Database files listed in Appendix H, by applying the algorithm in RFC 5892 Section
    3 directly to those files. No derived property table produced by anyone else is
    used as input. Section 3 describes the derivation and Appendix G compares the
    result with the derivation published by the Unicode Consortium.</p>
  language:

  type: Internet-Draft
  primary: true
abstract:
- content: "<p>The Entropy label (EL) can be used in the SR-MPLS data plane to improve
    load-balancing and multiple Entropy Label Indicator (ELI)/EL pairs may be inserted
    in the SR-MPLS label stack as per RFC8662. This document defines a set of extensions
    for Path Computation Element Communication Protocol (PCEP) to configure where
    in the label stack the ELI/EL pairs should be inserted in SR-MPLS network - the
    Entropy Label Positions (ELP).</p>"
  language:
  - en
  script:
  - Latn
  format: text/html

abstract:
- content: "<p>AI agents may need stable identifiers that are independent from their
    current network locations. In agent deployments, an Agent identifier may be associated
    with IPv6 locators, IPv6 prefixes, Agent Gateways, public key references, policy
    references, lifecycle state, and revocation status. Applications, gateways, controllers,
    and operators need a trusted way to query this registration data. This document
    defines an RDAP profile for querying Agent identifier registration data. The profile
    reuses the Registration Data Access Protocol (RDAP) query model and JSON response
    format, and defines an RDAP object class and extension members for Agent identifiers,
    IPv6 locator bindings, Agent Gateway bindings, and related operational metadata.
    This document does not define a new agent discovery protocol, a new agent interaction
    protocol, or a new authentication mechanism. It defines a registration data access
    profile that can be used by agent deployments and by other agent-related systems
    that need trusted Agent identifier metadata.</p>"

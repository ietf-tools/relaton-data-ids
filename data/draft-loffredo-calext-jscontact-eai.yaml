abstract:
- content: "<p>JSContact defines the EmailAddress object for representing an email
    address, but its address property is restricted to the ASCII syntax of an addr-spec
    in RFC 5322. This document redefines that property to also support internationalized
    email addresses, as defined in RFC 6532. Since such values are incompatible with
    JSContact version 2.0, this document defines JSContact version 3.0. This document
    updates RFC 9553.</p>"

abstract:
- content: "<p>Multi-agent AI systems pass instructions, facts and tool outputs through
    summaries, translations, delegations and protocol conversions. When a downstream
    proposed operation departs from the originating instruction, existing records
    may show that a message was sent, authenticated or traced, yet not show whether
    a lower-trust source's instruction-like statement influenced a governing condition,
    whether an intermediary dropped the condition, or whether the receiver misapplied
    it. This document describes a diagnostic architecture, and an optional transport-neutral
    evidence model, for investigating such semantic drift. It uses typed originating
    task contracts, condition-scoped source roles, versioned dependency graphs, handoff
    lineage, matched counterfactual tests that vary legitimate facts and unauthorized
    instruction-like content separately, adaptive witness selection, uncertainty-aware
    comparison, and evidence-bounded localization that reports an earliest observable
    divergence, a bounded interval, or abstains. The architecture is diagnostic only.
    It does not grant, veto or finalize any execution; authorization stays with separate
    systems. The document is an individual, informational proposal; it makes no novelty,
    compliance, adoption or performance claim, and reports no experimental results
    beyond those the underlying filing itself states.</p>"

abstract:
- content: "<p>This document defines a new extensible Notification structure, defined
    in YANG, for use in YANG-Push Notification messages, both for NETCONF and RESTCONF,
    enabling any YANG-compatible encodings such as XML, JSON, or CBOR. Additionally,
    it defines two essential extensions to this structure, the support of a hostname
    and a sequence number and the support of a timestamp characterizing the moment
    when the data was observed.</p>"

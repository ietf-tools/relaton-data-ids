abstract:
- content: "<p>This document specifies procedures for configuring Simple Two-Way Active
    Measurement Protocol (STAMP) sessions so that test packets traverse the same ECMP
    or LAG forwarding path as a specified production flow. In networks that use hash-based
    load distribution, the forwarding path depends on a hash over packet header fields.
    Standard STAMP test packets carry session-specific addresses and ports that differ
    from production traffic, often selecting a different forwarding path and yielding
    measurements that do not represent the actual service quality of the production
    flow. The procedures in this document specify how the Session-Sender populates
    test packet headers with values matching a designated production flow. The Session-Reflector
    identifies test packets by validating the STAMP payload structure. No changes
    to the STAMP packet formats defined in RFC 8762 are required.</p>"

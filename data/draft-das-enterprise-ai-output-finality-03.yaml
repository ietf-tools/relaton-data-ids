abstract:
- content: "<p>This profile is specified for high-risk, multi-system enterprise and
    public-sector AI — assistants and agents that can see several independently authorized
    stores and then send, write, or invoke. It is not specified for consumer chat.
    In industrial terms that describes enterprise assistant and agent seats of the
    kind offered by Anthropic, OpenAI, Google Gemini, and xAI Grok, together with
    self- hosted open-weight deployments; these names are used with respect, as publicly
    described deployment classes only, and imply no claim about any vendor's internals
    and no vendor endorsement of this profile. A 2020 breach stole what was already
    stored: a server image, a database dump, user rows. After 2025 a compromised assistant
    can do what a dump cannot. In minutes it can join mail, tickets, code, finance,
    and memory into a map of launch plans, targets, defects, and negotiation room
    — strategy that was never one record — and that map can be sold to a competitor.
    There is no credential rotation for a future that has already been read. Traditional
    access control still answers who may touch each store. It does not answer whether
    those fragments may be joined into that meaning, or whether that meaning may leave.
    This document specifies an architectural framework and metadata profile for that
    gap. Technical Non-Joinability is enforced by a session-bound Reconstruction Authorization
    Object (RAO) that limits relational binding. Technical Non-Completability is enforced
    by an Output Release Boundary that requires committed validation evidence before
    a generated token or tool invocation can take external effect. The specification
    defines the authorization objects, cryptographic bindings, and boundary validation
    sequences required to isolate reconstruction domains without modifying the underlying
    datastores. A published runnable reference implementation is provided so that
    the profile can be executed and tested, not only read as theory. That implementation
    is an architectural reference for the state machine, not a claim of production
    isolation. The architecture introduces bounded evaluation on the path that can
    intercept unauthorized join or release. That latency is accepted where the asset
    is high- consequence enterprise or public-sector intelligence and raw speed is
    subordinate to preventing reconstruction and release. The author states that trade-off
    explicitly: this profile is for deployments that choose that priority. It is not
    offered as a design for consumer chat or other paths that optimize only for speed.
    Readers are respectfully encouraged to review Section 4 and Section 5 in full,
    as those sections set out the complete problem description and motivating scenarios
    and should not be skipped.</p>"

abstract:
- content: "<p>AI agents act on behalf of end users across applications the agent
    has no prior relationship with and cannot pre-register with. This specification
    defines a scenario-based service discovery and authorization protocol for agent
    environments, which lets an application advertise its capabilities to agents,
    lets an agent learn how to invoke the application, with which authorization mechanism,
    and how to obtain a delegated session for the end user without ever handling the
    end user's primary credentials, and lets the application enforce runtime interaction
    boundaries when an agent operation exceeds what was approved. The protocol combines
    two building blocks. The first is a semantic standard for an application's scenario-based
    capability advertisement: the scenaric flows the application opens to agents,
    the operations each flow packages, and the authorization mechanisms and invocation
    surfaces it accepts for them; what no flow opens is closed by default. The second
    is an attach and binding standard that attaches the semantic to both mobile applications
    and web applications, so one advertisement reaches an agent over a web origin
    or through a packaged native application. The protocol reuses OAuth standards
    that exist or are being defined and defines no new authorization protocol: the
    advertisement is a standalone document at its own well-known location, linked
    from Protected Resource Metadata; the delegated session is established by the
    grants the advertisement names; tokens are sender-constrained with DPoP; runtime
    boundaries are carried by Rich Authorization Requests and verified by the authorization
    schemas framework, whose reverse-guided refusals route the agent back to re-establishment.</p>"

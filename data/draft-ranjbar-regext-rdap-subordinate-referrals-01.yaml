abstract:
- content: <p>Registration Data Access Protocol (RDAP) queries can be resolved from
    the IANA bootstrap registries down to the most specific object held by a registry
    operator's RDAP service. Where the holder of a registered resource maintains registration
    data for resources subordinate to it, such as DNS names below a registered domain
    or more-specific networks below an address allocation, and operates a conformant
    RDAP service for that data, there is currently no discoverable referral from the
    registry's response to the holder's service. This document describes an optional,
    holder-designated referral for subordinate resources, carried by a pair of directional
    RDAP link relations, "rdap-base-down" and "rdap-base-up", whose targets are the
    base URL of a downstream RDAP service and the base URL of the covering registry
    service, respectively. The holder- designated subordinate referral is the primary
    application, but the same relations serve related base-URL discovery needs, including
    delegated and hybrid RPKI referrals. It is written as input to draft-ietf-regext-rdap-referrals
    and its content may be merged into that document.</p>

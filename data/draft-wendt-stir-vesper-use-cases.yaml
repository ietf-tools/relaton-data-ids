abstract:
- content: "<p>This document describes use cases and requirements that motivate VESPER
    (Verifiable STI Presentation and Evidence for RTU), work within the Secure Telephone
    Identity Revisited (STIR) framework. STIR establishes that a signing credential
    is authorized for a telephone number, but not what entity holds that authority,
    what verifiable information that entity declares about its numbers, or how a relying
    party obtains and verifies this across the channels where a number appears. This
    document presents a set of use cases that illustrate the resulting trust gaps
    and states the requirements a solution should satisfy. It motivates the mechanisms
    defined in the VESPER framework and its companion specifications rather than defining
    them.</p>"

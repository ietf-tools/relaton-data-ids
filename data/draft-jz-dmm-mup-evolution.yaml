abstract:
- content: "<p>This document starts from the description of the 5G mobile user plane,
    including distributed User Plane Functions (UPFs). Then, based on the 3GPP proposals
    for 6G UP architecture evolution, the draft describes some potential enhancements
    revolving around the support of the 6G UP flexiblity, scalability &amp; resilience.
    The draft also discusses the potential IETF work upon integrating the proposed
    enhancements of the 6G UP architecture.</p>"

abstract:
- content: "<p>This document describes the necessity and feasibility to introduce
    a proxy network node for the congested network node to notify the traffic sender
    of the congestion. The proxy network node is used to translate the congestion
    notification. The congested network node sends the congestion notification to
    the proxy network node in a format defined in this document, and then the proxy
    network node translates the received congestion notification to a format known
    by the traffic sender and resends the translated congestion notification to the
    traffic sender.</p>"

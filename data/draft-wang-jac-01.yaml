abstract:
- content: "<p>This document defines the Judgment Accountability Chain (JAC) v0.1,
    a minimal infrastructure layer for tracking judgment chains in AI and agent systems.
    Built on JEP [draft-wang-jep-judgment-event-protocol-04] and HJS [draft-wang-hjs-accountability-04],
    JAC adds a single field—task_based_on—to establish verifiable causality between
    judgments across agents, platforms, and trust domains. JAC follows the same narrow-waist
    design philosophy as JEP and HJS: a minimal mandatory core with all advanced features
    defined as optional extensions. JAC fully inherits the privacy protections of
    JEP and HJS, including digest-only anonymity, TTL data expiration, identity rotation,
    and data minimization.</p>"

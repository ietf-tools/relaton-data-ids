abstract:
- content: "<p>This document defines a record format for AI agent authorization decisions
    and the effects that followed them. The format is one in- toto predicate type,
    signed inside a DSSE envelope. A record carries the decision and the observed
    effect with a derived agreement between them, whether the decision point could
    evaluate the request and how fresh each input it relied on was, and a canonicalization
    contract under which a party that trusts neither the agent nor its operator recomputes
    the record's consistency from its bytes. The document also defines what a party
    that retains a record keeps beside it, so that the record can later be dated from
    anchors that party does not control. The format carries the seven minimum audit
    fields of the WIMSE AI Identity Management System framework, and it is offered
    as a data model for the audit records the proposed AUDIT working group would specify.
    It defines no policy.</p>"

abstract:
- content: "<p>This document specifies the DTN Peering Protocol (DPP), an inter- domain
    routing protocol for the Delay-Tolerant Networking (DTN) ecosystem. DPP facilitates
    the exchange of reachability information between distinct Administrative Domains
    (ADs), enabling inter-domain routing across networks operated by different agencies
    and organizations. DPP separates the control plane from the data plane: a DPP
    speaker need not be a gateway that forwards bundles, allowing centralized route
    controllers or orchestration systems to participate in peering on behalf of the
    gateways they manage. DPP advertises the reachability of bundle nodes in both
    DTN addressing schemes, ipn (integer-based) and dtn (name-based), and selects
    routes for both by the same process. DPP speakers authenticate each other using
    mutual TLS, with each Administrative Domain authorizing its speakers' keys through
    DNSSEC-signed TLSA records. DPP supports both persistent routes and routes tied
    to the scheduled contact windows of deep-space networks.</p>"

abstract:
- content: "<p>This document defines the required-rate (r) priority parameter for
    the Extensible Prioritization Scheme for HTTP (RFC 9218). The parameter allows
    a client to indicate a delivery rate above which faster transfer of an HTTP response
    is not expected to provide additional application benefit. A server can use this
    signal to rate-limit an individual response, allowing other eligible responses
    to make progress without replacing the urgency and incremental scheduling behavior
    defined by RFC 9218.</p>"

abstract:
- content: "<p>An AI agent that acts on a person's behalf makes each decision through
    several calls to language models: one stage drafts an action, others evaluate
    it, and others may veto it. What each call was given decides what it can judge.
    A record of the action alone cannot show whether a judging stage lacked a rule
    the drafting stage had, whether untrusted text reached a stage designed never
    to see it, or whether a stage was prompted in a language other than the one the
    person used. This document specifies a per-call context manifest. It describes
    every contiguous piece of text placed into a model call (a segment) by what it
    is, where it came from, how far it can be trusted, which authority stands behind
    it, how long it lives, and which language it is in. It specifies a closed-vocabulary
    context policy that says which stage may and must receive which kinds of segment,
    ablation stubs that stand in for text withheld from a stage, and the checks a
    verifier runs against the manifest and against the bytes actually sent. It states
    the safety properties of the policy as invariants checked by a model checker.
    The context manifest is the context_manifest member of the LLM_CALL event of the
    CIRIS agent trace, carried in a CEG trace row; it can also be the payload of any
    SCITT signed statement.</p>"

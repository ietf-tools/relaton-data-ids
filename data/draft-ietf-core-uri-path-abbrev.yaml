id: draft-ietf-core-uri-path-abbrev
title:
- content: URI Path abbreviation in CoAP
  language:
  - en
  script:
  - Latn
  format: text/plain
docid:
- id: draft-ietf-core-uri-path-abbrev
  type: Internet-Draft
  primary: true
abstract:
- content: "<p>Applications built on CoAP face a conflict between the technical need
    for short message sizes and the interoperability requirement of following BCP190
    and thus using (relatively verbose) well-known URI paths. This document introduces
    the Uri-Path-Abbrev CoAP option that allows expressing well-known URI paths in
    as little as two bytes. Using this option revealed a subtle flaw in RFC7252 that
    severely limited the extension point of critical options. This document updates
    RFC7252 to rectify that.</p>"
  language:
  - en
  script:
  - Latn
  format: text/html

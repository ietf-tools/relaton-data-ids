abstract:
- content: <p>This document defines the "company-certs" well-known URI in accordance
    with Request for Comments (RFC) 8615. The URI provides a JSON metadata document
    that allows an organization to publish application-specific trust anchors and
    related revocation information for use by consuming applications. The mechanism
    is intended for scoped trust bootstrapping, such as S/MIME, mutual TLS, or other
    application-local trust decisions, without modifying the global operating system
    trust store.</p>

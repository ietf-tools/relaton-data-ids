abstract:
- content: "<p>Multi-hop service-to-service and agentic workflows often exchange OAuth
    access tokens across a sequence of actors. OAuth 2.0 Token Exchange permits an
    act claim, including nested prior actors, but it does not define interoperable
    rules for preserving, extending, disclosing, and validating a delegation path
    across successive exchanges. This document defines six actor-chain profiles for
    OAuth 2.0 Token Exchange: Declared Full Disclosure, Declared Subset Disclosure,
    Declared Actor-Only Disclosure, Verified Full Disclosure, Verified Subset Disclosure,
    and Verified Actor-Only Disclosure. The profiles preserve the existing meanings
    of sub, act, and may_act. They add explicit profile selection, a stable workflow
    actor-chain identifier, profile-controlled actor disclosure, and, for verified
    profiles, actor-signed step proofs with cumulative commitment state.</p>"

abstract:
- content: "<p>This document specifies the Agent Identity Document of the Agent Transfer
    Protocol (AGTP) [AGTP]: the signed document every canonical Agent-ID resolves
    to, carrying the agent's owner, declared authority scope, trust posture, supported
    methods, and issuer binding. It also specifies the Agent Namespace Document, the.agtp
    package format and its integrity rules, the human-readable identity view served
    to browsers, and the status sub-resource. The material was carried in the base
    AGTP specification through version 09 and is extracted here, unchanged in substance,
    so that the base specification carries the transfer protocol and this document
    carries the identity document format, in the way HTTP and HTML are specified separately.</p>"

abstract:
- content: "<p>This document describes a two-layer reference architecture for discovering
    the minimum public information needed to reach AI agents. The Local Discovery
    Plane obtains discovery information within an administrative domain through mDNS/DNS-SD
    or infrastructure-assisted discovery. The Federation Plane uses DNS as its baseline
    for cross- domain discovery: Federation Gateways apply export policy, publish
    permitted information in independently administered DNS zones, and retrieve, validate,
    and cache remote information on demand. The framework also provides non-DNS mechanisms
    and mixed-mode deployments on the Federation Plane which can complement the baseline
    with proactive distribution, recipient-specific sharing, and directory lookup.</p>"

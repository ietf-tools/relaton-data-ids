abstract:
- content: "<p>Autonomous and agentic systems now take consequential, often irreversible
    actions -- moving money, changing records, routing benefits, releasing effects
    -- at machine speed, while the evidence systems that establish accountability
    were built for the speed of humans taking those actions. Across regulation, audit,
    and insurance the same requirement recurs and the same artifact is missing: portable,
    offline-verifiable proof that a named, accountable human authorized a specific
    action before it executed, checkable by a third party without trusting the operator
    that produced it. This document is the architectural overview of the EMILIA Protocol
    (EP): a human-authorization and oversight evidence layer for agentic and autonomous
    systems. It defines the layer's position relative to agent identity, delegation,
    policy, and transparency work; states the design invariants; and ties together
    the component specifications -- the authorization receipt, multi-party quorum,
    the enforcement point, the authorization evidence chain, long-term evidence-record
    renewal, authorization-posture advisories, and the human-oversight profile. EP
    composes with the other layers rather than replacing them; its contribution is
    the human- accountability apex and the composition seam that binds the layers'
    artifacts into one verifiable record. EP proves authorization -- that a named
    human (or quorum) approved the exact action. It does not prove the action was
    understood, lawful, wise, or proportional. It is a necessary, not sufficient,
    condition for accountable autonomy, and this document is explicit about that boundary.</p>"

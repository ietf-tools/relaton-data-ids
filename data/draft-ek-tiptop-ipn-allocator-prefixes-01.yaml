abstract:
- content: "<p>This document requests an IPv6 /16 prefix for use by IPN Allocators.
    It defines a method to derive an IPv6 /48 prefix from a 32-bit IPN Allocator Identifier.
    Use of the derived prefix is optional. The method reuses the existing IPN Allocator
    registry. It does not encode physical location or define a routing mechanism.
    The preferred /16 prefix is 5f01::/16. This document also updates RFC 4291 to
    permit other interface identifier lengths within the allocated block.</p>"

abstract:
- content: "<p>Networks may experience transmission bit errors due to various factors,
    such as poor fiber quality. The Path Computation Element Communication Protocol
    (PCEP) provides mechanisms for Path Computation Elements (PCEs) to perform path
    computations in response to Path Computation Client (PCC) requests. This document
    describes the extensions to PCEP to include link Bit Error Rate (BER) metric as
    a constraint for end-to-end path computation. The PCEP extension utilize link
    BER metric advertisements defined for IS-IS and OSPF in draft-gandhi-lsr-ber.</p>"

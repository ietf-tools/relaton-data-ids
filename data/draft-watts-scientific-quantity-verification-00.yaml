abstract:
- content: "<p>This document defines a JSON representation for scientific quantities
    (a decimal value, a unit, and an optional measurement uncertainty) and a binding
    by which a computed quantity names, by cryptographic digest, the exact input quantities,
    operation and arithmetic rules it was derived with. It also defines a fail-closed
    procedure by which a verifier recomputes the value, checks the unit relationship
    and, for one named method, recomputes the uncertainty, and reports a separate
    verdict for each aspect. A passing result means only that the stated numbers follow
    from the stated inputs under the stated rules. It does not establish that a measurement
    was valid, that the inputs are true, or that any scientific conclusion follows.</p>"

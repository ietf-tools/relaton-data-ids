abstract:
- content: "<p>This document describes a token-native semantic transport framework
    for real-time video agent systems. A client device extracts visual tokens from
    captured video and transmits their compressed representations to a server for
    inference. The framework adopts an autoencoder to reduce the dimensionality of
    visual tokens and organizes the compressed tokens into independently entropy-coded
    groups to support packet-level adaptation. The client device adjusts the number
    of visual tokens to transmit, both before and during each frame's transmission,
    to adapt to changes in available network bandwidth. This document specifies the
    functional architecture and requirements for token compression, packet-aware grouping,
    rate adaptation, and server-side token reconstruction.</p>"

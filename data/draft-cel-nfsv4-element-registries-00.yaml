abstract:
- content: "<p>Several numbered NFS version 4 protocol elements, among them operations,
    callback operations, status codes, file attributes, and the flags of the ACCESS
    and OPEN operations, are identified by values that no IANA registry records, so
    protocol extensions under development at the same time can assign the same value
    to different elements. This document requests an IANA registry for each of these
    element types, populates the registries from published RFCs, and requires future
    elements to obtain their values through them. It updates RFC 8178.</p>"

abstract:
- content: "<p>This document specifies a Fabric Coordination Layer (FCL) designed
    to stabilize data transmission in frontier-scale distributed computing fabrics.
    As AI training clusters scale to hundreds of thousands of accelerators and link
    speeds exceed 800 Gbps, traditional reactive congestion control mechanisms suffer
    from severe feedback-loop latency. By allocating transmission authority via a
    Global Token Ledger (GTL) and enforcing it through Distributed Credit-Orbit Pacing
    (DCOP), the FCL mitigates incast-driven buffer overflows and significantly reduces
    tail-latency variance, thereby maximizing Model Flops Utilization (MFU).</p>"

abstract:
- content: "<p>This document builds on HTTP Message Signatures (RFC 9421) for requests
    that automated agents send on behalf of people. RFC 9421 shows who signed a request.
    It does not show who the agent acts for, or what the agent may do. This document
    defines an HTTP header field, Agent-Delegation, that carries a chain of delegation
    links. Each link can only narrow the scope, floors, and expiry of the link before
    it, and a verifier checks every link. Floors cover two things. The first is the
    person or account behind the agent: an Attestation Issuer, such as a mobile network
    operator or an identity- document check, answers with a signed yes or no, bound
    to the verifier's nonce and to an expiry, and never returns the value behind the
    answer. The second is what the agent may do: each call has a class, r, w, or x,
    read as in chmod, with an optional count per class, and a signed menu gives the
    class of each call. A deployment can set this scope for each job when the job
    starts. This document does not define a credential format, an identity system,
    or revocation.</p>"

abstract:
- content: "<p>This document publishes golden test vectors for the Agent Transaction
    Protocol (ATP). The vectors cover canonicalization (RFC 8785 JCS), nodeId computation,
    and Ed25519 signature generation and verification. ATP Core conformance requires
    that conformant implementations pass all vectors in this document for canonicalization,
    nodeId computation, and Ed25519 signature verification.</p>"

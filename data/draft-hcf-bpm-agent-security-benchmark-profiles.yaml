abstract:
- content: "<p>This document defines evaluation profiles for the security assessment
    of AI agents. A profile fixes the System Under Test boundary and the scenario
    against which the metrics defined in [I-D.han-bpm-agent-security-benchmark-terminology]
    are applied, so that results obtained under different boundaries or scenarios
    are not compared without qualification. The document defines four infrastructure
    profiles, which correspond to the four component groups of an agent and to the
    four evaluation dimensions; six scenario profiles, which correspond to the agent
    types in scope; the input and output boundary specification that applies to all
    profiles; profile composition rules; and the minimum evaluation logging fields
    required by each profile. The metric definitions are the subject of [I-D.han-bpm-agent-security-benchmark-terminology],
    and the methods by which the metrics are exercised are the subject of [I-D.han-bpm-agent-security-benchmark-methodology].</p>"

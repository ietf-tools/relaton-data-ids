abstract:
- content: "<p>The rapid growth of AI-powered applications is placing increasing pressure
    on existing Internet infrastructures. To support more scalable, latency-aware,
    and privacy-enhanced AI inference services, this document introduces the Intelligence
    Delivery Network (IDN), a network architecture in which intelligence capabilities
    are treated as network services that can be described, placed, routed to, reused,
    and secured across distributed heterogeneous computing nodes. This document describes
    the motivation, deployment assumptions, system model, architectural components,
    terminology, and security considerations for IDN. It does not specify protocol
    details or concrete implementation procedures, which are left to future documents.</p>"

abstract:
- content: '<p>The Secure Telephone Identity Revisited (STIR) framework uses credentials
    to sign calls in order to prevent identity impersonation in the telephone network,
    especially by robocallers. Its framework also accounts for certain cases of "legitimate"
    impersonation of identity. This document expands the scope of STIR to include
    agents acting on behalf of users and enterprises: how agents might best opt- in
    to self-identify as agents, and how the intent of the originating user or enterprise
    in delegating to an agent can best be communicated to relying parties.</p>'

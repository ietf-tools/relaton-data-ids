abstract:
- content: "<p>Independently written systems that anchor records to a SCITT Transparency
    Service repeatedly re-derive the same construction: a canonical form of structured
    content, a content-addressed identifier derived from that form, a receipt placed
    in the unprotected header of the Signed Statement, and a typed reference mechanism
    that lets one record cite another by digest across profile boundaries. This document
    defines that construction as a reusable profile — the Canonical Payload Binding
    — so that each payload class declares its canonicalization algorithm and exclusion
    set once, obtains an interoperable derived identifier, and inherits statement-to-receipt
    binding and typed digest reference semantics without restating the mechanics in
    every profile. It complements the COSE Hash Envelope mechanism defined in RFC
    9995: where that mechanism signals that a Signed Statement's payload is a digest
    standing in for content held elsewhere, this document defines how that digest
    is computed from structured content so that independently written implementations
    converge on the same bytes. An IANA registry governs the canonicalization algorithms;
    entries are immutable. This document defines no payload content formats and registers
    no artifact types; the artifact types that a typed reference may cite, and their
    meaning, are registered in a single shared Artifact Type Registry, governed separately
    from this document, that payload profiles register into.</p>"

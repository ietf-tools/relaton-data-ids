abstract:
- content: "<p>This document proposes an Agentic AI Security Framework for security
    management in mobile networks. A Security Application Function (SAF) Agent translates
    a network administrator's security intent to hold security objectives into a high-level
    security policy. A Security Control Function (SCF) Agent receives the high-level
    policy and translates it into a low-level security policy that will be enforced
    by distributed Network Security Functions (NSFs) in mobile networks. The SCF Agent
    sends the low-level security policy to an apporiate NSF. Policy generation, monitoring,
    and continuity across a data path are integrated into a closed-loop control with
    an Observe- Reason-Act-Verify process. The proposed framework can be applied to
    enterprise, campus, cloud, and edge networks along with existing network-management
    mechanisms. This document describes the architecture, a policy-continuity example,
    standard integration points, and security considerations.</p>"

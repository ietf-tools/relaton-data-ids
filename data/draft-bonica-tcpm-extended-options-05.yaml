abstract:
- content: "<p>Currently, TCP maintains ordinary sessions (SES-O) in which ordinary
    segments (SEG-O) are exchanged. Each SEG-O can accommodate up to 40 octets of
    options. In the future, applications may require more than 40 octets of options.
    For example, an application may use a 36-byte TCP Authentication Option (TCP-AO),
    leaving insufficient space for other required options. Therefore, this document
    describes an experiment in which upgraded sessions (SES-U) and upgraded segments
    (SEG-U) are introduced. Each SEG-U can accommodate up to 1,016 octets of Individual
    Options.</p>"

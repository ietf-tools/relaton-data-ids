abstract:
- content: "<p>This document describes how IETF-defined YANG data models can be used
    together to manage RFC 9543 Network Slice Services. It explains how a Network
    Slice Controller (NSC) translates a customer-facing Network Slice Service request
    into requests based on network models, such as the L3VPN and L2VPN Network Models,
    and how these relate to the corresponding service models. The document compares
    these models against Network Slice Service requirements, identifies gaps, and
    shows how the models apply in different controller architectures, including multi-domain
    deployments.</p>"

abstract:
- content: "<p>This document obsoletes draft-veridom-omp-00. The Operating Model Protocol
    (OMP) defines a deterministic routing and tamper-evident evidence architecture
    for consequential AI decisions. This document specifies OMP Core, which adds Invariant
    3: Verifiable Delegation Binding. Every ASSISTED or ESCALATED routing state must
    bind the Named Accountable Officer to a verifiable DelegationInstrument at the
    time of decision. When valid binding cannot be established, the system records
    AUTHORITY_UNBOUND -- a sealed, positive evidentiary state. This update is additive
    and backward-compatible with OMP Core version 00.</p>"

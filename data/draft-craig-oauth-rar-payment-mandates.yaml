abstract:
- content: "<p>Software agents, including those driven by large language models, increasingly
    initiate payments on behalf of people. OAuth 2.0 Rich Authorization Requests (RFC
    9396) can carry what such an agent may do, but there is no common way to express
    the limits that banks and their customers need, to tell an agent why a payment
    needs the customer's approval, or to keep an independent record of what was decided.
    This document defines two authorization details types for payment mandates (a
    standing mandate with named payees, per-payment and per- period limits and an
    approval mode, and a single approved payment); an ordered set of machine-readable
    reasons a payment falls outside a mandate; how those reasons are carried in an
    approval challenge, including the OAuth Transaction Authorization Challenge; and
    a signed, hash-chained receipt for every decision, with personal data kept outside
    the chain so it can be erased.</p>"

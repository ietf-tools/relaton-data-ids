abstract:
- content: "<p>The IETF DAWN (Discovery of Agents, Workloads, and Named Entities)
    working group is developing a suite of documents addressing agent discovery across
    organizational boundaries. Existing DAWN contributions include terminology, requirements,
    use cases, gap analysis, a discovery mechanism survey, and an information model
    for Minimum Discoverable Information (MDI). This document describes a two-layer
    federated reference architecture framework that operates within the DAWN. The
    first layer, the Local Discovery Plane, performs zero-configuration agent advertisement
    and collection inside each local site, without mandating a specific link- local
    protocol. The second layer, the Federation Plane, builds a federation among site
    gateways to exchange lightweight Federation Metadata Records (FMRs) — a concrete
    binding of DAWN MDI — across independent administrative domains, while full Capability
    Cards are retrieved on demand via authenticated unicast. The architecture emphasizes
    data sovereignty through an Export Policy Engine, separates lightweight metadata
    indexes from full capability documents, and supports multiple federation synchronization
    strategies. This document is informational. It does not define normative protocol
    formats, nor does it compete with existing DAWN proposals such as ACAP, Agent
    Directory, or ARDP; rather, it provides a deployment framework showing how these
    mechanisms may be composed at administrative boundaries.</p>"

abstract:
- content: "<p>AI agents deployed on the Web require three capabilities to interoperate
    safely: discovering each other, assessing each other's current operational state,
    and governing each other's behavior over time. Discovery is addressed by A2A's
    /.well-known/agent.json endpoint. Behavior governance is addressed by the SOOS
    Progressive Trust model and its Trust Decay specification. Between these two layers
    lies a gap: no existing standard provides a lightweight, machine-readable signal
    for whether an agent is currently operational, responsive, and calibrated -- the
    operational health state that any consumer needs before deciding whether to interact
    with an agent, and that governance frameworks need as a freshness input for their
    calibration anchors. This document defines the Agent Health State specification:
    a /.well-known/agent-health endpoint and a structured health state response format
    that exposes an agent's operational status, response calibration metrics, and
    decay indicators. The specification is designed to be independently deployable
    (requiring no governance infrastructure), composable with A2A discovery, and consumable
    by SOOS/PT as calibration anchor freshness input. This document positions agent-health
    as the missing observability layer between agent discovery (A2A /.well-known/agent.json)
    and agent behavior governance (SOOS/PT Trust Decay Model), serving both as operational
    state for interaction decisions and as calibration anchor freshness input to verification
    gates.</p>"

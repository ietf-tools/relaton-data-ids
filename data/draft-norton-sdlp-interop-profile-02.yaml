abstract:
- content: "<p>This document defines an interoperability profile for the Secured Digital
    Lifecycle Protocol (SDLP). The profile specifies how SDLP canonical objects, identity,
    lineage, lifecycle state, and digests are composed with external verification,
    typed authority evaluation, and provenance evidence semantics. It introduces a
    transition vector model that carries canonical SDLP envelopes together with CAID
    projections, AEC evidence results, local authorization decisions, and AEB execution
    outcomes, without altering SDLP’s core object semantics. The profile defines how
    SDLP objects participate in multi-stage verification pipelines and how mutated
    candidate inputs, negative cases, and authority constraints are represented. It
    also specifies composition rules for integrating SDLP with provenance and transparency
    systems such as CAID, AEC, AEB, SCITT, and EMILIA, while preserving the separation
    of concerns between SDLP canonical semantics and ecosystem-specific admission
    and trust policies.</p>"

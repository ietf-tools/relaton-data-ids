abstract:
- content: "<p>This document defines Enrollment over Secure Transport (EST) protocol
    operations over HTTPS for use with C509 certificates. The operations specified
    in this document support CA certificate distribution, C509 certificate enrollment,
    C509 certificate re-enrollment, and server- side key generation using C509 certificates.
    This document also defines operations for Certificate Revocation List (CRL) distribution.</p>"

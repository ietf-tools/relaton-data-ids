abstract:
- content: "<p>RFC 8253 specifies the use of Transport Layer Security (TLS) for the
    Path Computation Element Communication Protocol (PCEP) by negotiating TLS using
    the PCEP StartTLS message exchange. This document specifies a deployment profile
    in which TLS is initiated immediately after TCP connection establishment, on the
    existing PCEP port, based on an out- of-band configured policy. This profile is
    intended for managed deployments where TLS is mandatory and neither in-band security-mode
    negotiation nor fallback to cleartext is permitted.</p>"

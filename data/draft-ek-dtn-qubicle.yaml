abstract:
- content: "<p>This document specifies a minimal convergence layer protocol for transferring
    Bundle Protocol version 7 (BPv7) bundles over QUIC. The protocol leverages QUIC's
    native capabilities for reliable streaming, connection management, and security.
    Reliable transfers carry each bundle on its own QUIC stream, either directly or
    wrapped in a single CBOR byte string, with no further application-layer framing.
    Unreliable transfers use the Bundle Transfer Protocol - Unidirectional (BTP-U)
    over QUIC datagrams.</p>"

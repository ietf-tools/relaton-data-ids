abstract:
- content: "<p>The Agentic Session Initiation Protocol (A-SIP) is used for the establishment
    and lifecycle maintenance of agentic dialogs. It also enables and content exchange
    between a principal and an AI Agent over the Internet. A-SIP can be used between
    a user agent and AI Agent, between AI Agents, or between an AI Agent and a tool
    with agentic- like properties. A-SIP is built ontop of HTTP/3, web transport and
    Media Over Quic Transport (MOQT), leveraging a modern, public-cloud friendly protocol
    stack. Its usage of MOQT is optional, needed only when real-time media is exchanged.
    This allows asynchronous agent interactions to be done entirely using HTTP/3,
    so simple cases remain simple. Despite the name, A-SIP has no technical relationship
    with SIP (RFC3261). This document is not yet a fully fleshed out protocol, and
    is meant to solicit feedback on this general direction of work.</p>"

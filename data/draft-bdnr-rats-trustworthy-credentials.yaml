abstract:
- content: <p>There is a large class of "RATS-Unaware" Relying Parties (RUPs) that
    Attesters nevertheless need to interoperate with. Existing deployed services,
    which precede the introduction of Remote Attestation, are often difficult to change/update
    in significant ways due to, among other reasons, organizational friction, technological
    inertia, and regulatory policies. Yet there are significant advantages if workloads
    can be incrementally updated in the trustworthiness of the platform, without disrupting
    their clients and servers. This document details a protocol by which Remote Attestattion
    of Attesters is incorporated into the process of them being provided with Identity
    Documents (keys or credentials) to authenticate to RUPs. This specification illustrates
    how the RATS Architecture can be applied to interoperate with RUPs by providing
    Attesters with such Identity Documents.</p>

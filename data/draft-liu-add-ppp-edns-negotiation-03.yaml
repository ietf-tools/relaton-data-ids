abstract:
- content: "<p>This document defines extensions to the Point-to-Point Protocol (PPP)
    Internet Protocol Control Protocol (IPCP) for negotiating encrypted DNS resolver
    configurations. Two IPCP Configuration Options are defined for primary and secondary
    encrypted DNS resolvers. Each option carries an Authentication Domain Name (ADN),
    an explicit list of resolver IP addresses, and Service Parameters (SvcParams)
    using the wire format defined by RFC 9460. The design supports DNS over TLS (DoT),
    DNS over HTTPS (DoH), and DNS over QUIC (DoQ), while maintaining coexistence with
    the plaintext DNS configuration mechanism defined by RFC 1877.</p>"

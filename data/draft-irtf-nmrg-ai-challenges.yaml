abstract:
- content: "<p>This document is intended to introduce the challenges to overcome when
    Network Management (NM) problems may require coupling with Artificial Intelligence
    (AI) solutions. On the one hand, many difficult NM problems still lack good solutions,
    or existing approaches come with significant limitations. Artificial Intelligence
    may help produce novel solutions to those problems. On the other hand, due to
    the high computational costs of AI solutions and stringent data privacy constraints,
    the distributed execution of AI workloads has become paramount. Consequently,
    networks must be operated efficiently to sustain these distributed processing
    requirements. To identify the right set of challenges, the document defines a
    method based on the evolution and nature of NM problems. This will be done in
    parallel with advances and the nature of existing solutions in AI in order to
    highlight where AI and NM have already been coupled together or could benefit
    from a closer integration. So, the method aims at evaluating the gap between NM
    problems and AI solutions. Challenges are derived accordingly, assuming that solving
    these challenges will help to reduce the gap between NM and AI. This document
    is a product of the Network Management Research Group (NMRG) of the Internet Research
    Task Force (IRTF). This document reflects the consensus of the research group.
    It is not a candidate for any level of Internet Standard and is published for
    informational purposes.</p>"

abstract:
- content: "<p>The Lowest Common Denominator Protocol (LCDP) is a message-oriented,
    peer-to-peer wire format consisting of UTF-8 encoded JSON arrays of externally
    tagged objects with object payloads transported over datagrams. LCDP provides
    perpetual compatibility by extension rather than versioning: unknown message types
    and fields are ignored. This document describes the wire format, core message
    types for peer discovery and anti-spoofing, and the design rationale. Security,
    reliability, and congestion control are delegated to optional messages or higher
    layers.</p>"

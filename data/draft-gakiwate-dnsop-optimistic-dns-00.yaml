abstract:
- content: "<p>DNS lookups introduce user-visible delay, particularly when cached
    records have expired and must be refreshed from the network. This document describes
    Optimistic DNS, a client-side stub resolver mechanism that immediately returns
    expired cached DNS records to applications while simultaneously refreshing them
    with a network query. The application receives an answer in microseconds rather
    than milliseconds, and if the data has changed receives an updated answer shortly
    thereafter. Optimistic DNS is complementary to RFC 8767, which addresses serving
    stale data at recursive resolvers. This document focuses exclusively on client-side
    stub resolver behavior, including explicit signaling from the application to inform
    the stub resolver that the application is able to handle old and possibly incorrect
    information.</p>"

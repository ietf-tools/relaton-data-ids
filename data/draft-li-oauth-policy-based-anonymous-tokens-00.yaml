abstract:
- content: "<p>This document specifies an OAuth 2.0 access-token type that allows
    a client, after one authorization-server issuance, to derive a policy- bounded
    set of unlinkable, single-use access tokens locally. Each derived token is bound
    to one canonical tag, an intended resource server, approved authorization details,
    a policy epoch, and a validity interval. Resource servers validate the token offline
    and enforce both policy membership and replay prevention. The protocol defines
    authorization request semantics, token-endpoint issuance, canonical policy and
    metadata objects, token derivation and HTTP presentation, resource-server validation,
    capability discovery, error handling, and IANA registrations. Version 1 requires
    public verification and the counter-window policy profile. It supports an optional
    private metadata bit, while private-verification ciphersuites remain optional.
    Concrete cryptographic algorithms are supplied by separately registered PBAT ciphersuites.
    The initial mandatory-to-implement ciphersuite is the publicly-verifiable equivalence-class-signature
    construction over BLS12-381 specified by the companion PBAT ciphersuite document.
    This specification does not replace OAuth grants, resource-owner consent, client
    authentication, or audience restriction. — middle</p>"

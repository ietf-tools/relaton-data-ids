abstract:
- content: "<p>This document defines the mapping of the RESTful Provisioning Protocol
    (RPP) to the HTTP protocol. RPP is used for the provisioning and management of
    objects in a shared database. The RPP data model, consisting of Data Objects and
    their operations, is defined in [I-D.ietf-rpp-data-objects]. This document specifies
    how those Data Objects and operations are mapped to HTTP resources, methods, header
    fields, and status codes, and how RPP servers are discovered. The mapping is independent
    of the data format used to represent RPP messages.</p>"

abstract:
- content: "<p>A single AI agent acting within a governed session is not the hardest
    governance problem. The hardest problem is what happens when that agent must delegate:
    when the mission is too large for one agent, when sub-tasks require specialized
    capability, when parallel execution is necessary, and when each delegated sub-agent
    is itself consequential enough to require governance. Who authorized the spawn?
    Who owns the plan? If the sub-agent deviates, who decides whether to re-plan or
    escalate? If the mission fails mid-execution, who constructs the audit record?
    This document defines the Agent Orchestration Protocol (AOP): the normative protocol
    through which a governed orchestrating agent decomposes a mission into a governed
    sub-goal directed acyclic graph (DAG), delegates sub-goals to sub-agents via kernel-mediated
    Assignment Primitives, and maintains a Mission Plan Sovereign Object (Mission
    Plan SO) and Mission Status SO across the full lifecycle of multi-agent execution.
    AOP specifies three core constructs: the Expected Outcome Declaration (EOD) as
    the pre-commitment structure for the full mission and each delegated sub-goal;
    the Mission Plan SO encoding the sub-goal DAG with SEQUENTIAL, PARALLEL, and CONDITIONAL
    dependency types; and the Assignment Primitive as the governed handoff mechanism
    that requires an Endorsed EOD and produces a Sub-Agent Composition Record (SACR)
    per the Multi-Agent Delegation protocol. AOP integrates with the Intent Declaration
    Primitive at each EOD boundary, the Agent Execution Protocol for per-agent session
    governance, the Governance Audit Record for mission lifecycle audit events, and
    the Human Escalation Mechanism for re-planning authority escalation. The normative
    reference scenario for AOP is a three-tier emergency management orchestration
    system in which a Master AI orchestrates regional coordination agents, which orchestrate
    domain-specialist leaf agents (e.g., evacuation routing models), each tier operating
    under full SOOS governance. Version -01 completed the document body: the Expected
    Outcome Declaration in AOP Context, Mission Plan Sovereign Object, Mission Status
    Sovereign Object, Assignment Primitive, Re-planning Authority, AOP-to-GAR Integration,
    Five-Phase Planning Intelligence Model, and the Reference Scenario were placeholders
    in -00 and are now fully specified, resolving a three-way contradiction in -00
    about whether Sub-Goal EOD endorsement happens before or after SACR issuance (it
    is after, gated on SACR existence). Version -02 fixes a document-structure ordering
    defect carried over from -00, closes -00's open Denial of Service gap with new
    normative security guidance, and corrects a set of reference-list defects: two
    normatively cited documents were never defined in the reference list, and ten
    companion-draft citations in the Related Work discussion used one-off versioned
    reference keys that matched no defined entry; all now cite consistently and are
    updated to current SOOS suite versions. The Related Work discussion's own description
    of Mission Plan SO / Mission Status SO ownership is corrected to match this document's
    own Introduction and current reality: both subtypes are defined by AOP, not by
    SOV. Version -03 is an editorial revision with no normative content changes: KEE-1
    citations were migrated from the versioned [I-D.sato-soos-kee] form to the non-versioned
    [SOOS-KEE] form, since KEE-1 is a permanent local-only specification that will
    never be submitted to the IETF Datatracker; and three sibling- draft citations
    (HEM, CAP, CAP-RRS) had gone stale against those drafts' current live versions
    and are updated to draft-sato-soos-hem-07, draft-sato-soos-cap-06, and draft-sato-soos-cap-rrs-04
    respectively.</p>"

abstract:
- content: "<p>The Single-Stack 100/50 Principle defines two independent, formally
    derivable consequences of retiring the IPv4 protocol stack in a dual- stack (IPv4
    + IPv6) network environment: (1) 100% elimination of executable attacks attributable
    to IPv4 under the document's definition, and (2) an exact 50% reduction in the
    count of concurrently exposed network-layer protocol-stack surfaces when IPv4
    is retired, stated by the Principle as a minimum structural floor. The analysis
    is bounded to the functional Layer 3 scope and parameter universe U_3 defined
    in this document. Within that premise, Axiom 0 and Axioms 1-15 stipulate protocol
    independence, operational state transitions, traffic termination, addressing/routing
    domains, protocol-associated control and resolution functions, header- processing
    paths, and protocol-specific vulnerability execution. Theorem I follows by removal
    of the necessary IPv4 Layer 3 execution precondition for every IPv4-attributable
    attack. Theorem II follows by direct enumeration of two concurrently exposed protocol-stack
    surfaces before retirement and one after retirement. Neither theorem depends on
    empirical attack volume, incident frequency, or statistical inference, and neither
    theorem claims that IPv6 is inherently more secure than IPv4.</p>"

abstract:
- content: "<p>This document specifies an extension to the EAP-AKA' protocol by introducing
    a Bitmap-based Selective Acknowledgment (SACK) mechanism to the AT_FRAGMENT attribute.
    This mechanism enables window-based transmission and precise recovery of lost
    fragments, optimizing fragment delivery during post-quantum identity concealment
    and authentication exchanges.</p>"

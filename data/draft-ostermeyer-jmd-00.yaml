abstract:
- content: "<p>This document defines JMD (JSON Markdown), a text-based structured
    data format designed for use in LLM-driven infrastructure, including tool-calling
    pipelines, MCP (Model Context Protocol) servers, REST APIs consumed by LLM agents,
    and multi-agent workflows. JMD encodes the full JSON type system (RFC 8259) using
    a subset of Markdown syntax -- headings for hierarchy, key: value lines for object
    fields, bullet lists for array items, and blockquotes for multiline strings. The
    format is line-oriented and streamable: every completed line is an independent,
    parseable event. JMD documents are in bijection with JSON values, and the roundtrip
    JSON -&gt; JMD -&gt; JSON preserves the value. This document specifies the JMD
    grammar, the canonical parse result (envelope), the four document modes (data,
    query, schema, delete), the streaming event model, and the media type registration
    for application/jmd.</p>"

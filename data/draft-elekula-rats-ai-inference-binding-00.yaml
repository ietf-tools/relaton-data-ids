abstract:
- content: "<p>AI inference services may execute within Trusted Execution Environments
    (TEEs), confidential virtual machines, protected processes, or heterogeneous platforms
    containing accelerators. Remote attestation can provide evidence about the identity,
    integrity, configuration, and operational state of components. Such evidence does
    not, by itself, establish that a particular inference request was processed by
    a particular model representation, that the claimed computation was faithfully
    performed, or that the result delivered to a relying party is the result of that
    operation. This document defines an architecture for associating inference-operation
    evidence, model and runtime identity, execution-assurance evidence, freshness
    context, and the delivered result. It applies the RATS architecture and existing
    IETF formats without defining a new RATS role, protocol, cryptographic primitive,
    EAT claim, or universal inference-result format. It distinguishes integrity of
    association from evidence of computational execution and from semantic correctness.</p>"

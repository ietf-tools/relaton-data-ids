abstract:
- content: '<p>This document defines a mapping from the Multi-Vantage Path Snapshot
    (MVPS) framework [I-D.melegassi-ippm-mvps-bundle] onto network paths that traverse
    satellite constellations and other orbital segments. The mapping reuses, without
    alteration, the bundle wire format, the coherence axes (C_1, C_2, C_3), the Hamiltonian
    H, and the Mahalanobis detection statistic D^2 of base MVPS. Two adaptations are
    introduced: (1) The causal lower bound C_1 admits a vacuum propagation speed on
    space-segment legs and fiber refractive index on terrestrial legs. (2) The topological
    coherence C_3 admits a predicted-topology component derived from publicly available
    Two-Line Element (TLE) sets via the SGP4 propagator [SGP4], in addition to the
    actual-topology component of base MVPS. This document is informational and intentionally
    minimal. It states only those claims which reduce, by a finite chain of substitutions,
    to either (a) base MVPS theorems, or (b) classical results in special relativity
    and orbital mechanics. Numeric thresholds, phase-centroid values, detection latency
    claims, bearing-estimation accuracy, and any "X% improvement" claims are NOT made.
    Such results require experimental validation and are listed as Open Problems.
    OPERATIONAL PREREQUISITE. The predicted-topology component C_3^pred is exercised
    only when per-hop satellite identity is observable at the vantage (Hypothesis
    H-5). No major LEO operator currently publishes such mappings; in their absence
    the framework degenerates to a single-axis (C_1) detector. A path-identity exposure
    protocol is a candidate companion specification (Open Problem OP-2). MATHEMATICAL
    CORE. Under conditional independence of vantages, the joint missed-detection error
    exponent equals the sum of per-vantage Kullback-Leibler divergences (Appendix
    A; Stein''s Lemma plus KL chain rule). The non-trivial multi-vantage gain is information-
    theoretic: for attack classes where a single vantage has zero divergence, only
    the joint detector achieves beta below 1 - alpha. The document is intended for
    use by network operators of LEO ground segments, by national telecommunications
    regulators considering independent verification of foreign-operated constellation
    traffic over their territory, and by the IETF community.</p>'

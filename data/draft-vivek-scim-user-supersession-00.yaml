abstract:
- content: "<p>The System for Cross-domain Identity Management (SCIM) defines resources,
    provisioning operations, and Security Event Token (SET) based events for resource
    lifecycle changes. Existing standardized SCIM events can signal that a User resource
    was created, modified, activated, deactivated, or deleted, but they do not express
    an identity-resolution decision in which one User resource is retired in favor
    of another User resource representing the same subject within the issuer's authority.
    Deletion and supersession have different semantics for downstream systems. This
    document defines two SCIM provisioning events: a User supersession event and a
    supersession- correction event. It distinguishes resource supersession from identity-attribute
    convergence and specifies how ordinary SCIM provisioning events communicate the
    resulting authoritative SCIM state of the surviving User. Matching algorithms,
    attribute- convergence and conflict-resolution policy, identity proofing, and
    non-SCIM data handling remain outside the scope of this document. Pre-authentication
    and pseudonymous profile linkage is identified as related future work but is not
    standardized by this document.</p>"

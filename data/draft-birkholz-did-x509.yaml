abstract:
- content: <p>This document defines the did:x509 decentralized identifier (DID) method,
    a flexible issuer identifier format for messages that transport or refer to X.509
    certificates, including CBOR Object Signing and Encryption (COSE) messages using
    RFC 9360. The did:x509 identifier format implements a direct, resolvable binding
    between a certificate chain and a compact issuer string (DID string). It combines
    the fingerprint of a certification authority (CA) certificate in the chain with
    one or more predicates on the leaf certificate's subject name, subject alternative
    names, extended key usage, or Fulcio issuer. The identifier can be conveyed as
    an issuer value in a COSE Header CBOR Web Token (CWT) Claims map as defined in
    RFC 9597, in JSON Object Signing and Encryption (JOSE) and JSON Web Token (JWT)
    messages, such as in the "iss" claim defined in RFC 7519, or through other protocol-specific
    mechanisms that associate the identifier with the certificate chain. The did:x509
    method lets existing X.509 solutions and DID-based systems interoperate where
    a full transition to DIDs is not achievable or desired. This issuer identifier
    is convenient for references and policy evaluation, for example in the context
    of transparency ledgers. This Informational document is published as an Independent
    Submission to describe the method as implemented by Microsoft. It is neither a
    standard nor a product of the IETF.</p>

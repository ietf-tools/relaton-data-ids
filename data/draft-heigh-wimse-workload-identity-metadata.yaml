abstract:
- content: "<p>This document specifies metadata attributes associated with a workload's
    identity that are used for auditing, authorization, accounting, and other purposes.
    It profiles existing claims for group membership, roles, and entitlements, with
    delivery either in JWT-based Workload Identity Credentials or through an authenticated
    workload metadata endpoint. The endpoint supports metadata retrieval for workloads
    using JWT-based or X.509-based credentials and disclosure according to the caller's
    authorization. An optional JWT claim or X.509 certificate extension identifies
    the metadata endpoint for the credential's subject. This document also defines
    the separation between identifier and metadata. It distinguishes workload attributes
    and durable principal associations from per-request delegation and grants such
    as scopes, and states the requirements that make the separation sound, including
    identifier uniqueness. The document applies to workloads generally, including
    services, batch and continuous integration jobs, serverless functions, and AI
    agents. Agentic use cases are discussed separately.</p>"

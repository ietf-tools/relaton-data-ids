abstract:
- content: "<p>This document specifies a post-quantum bootstrap profile for WireGuard.
    A mutually authenticated ML-KEM-768 and ML-DSA exchange derives a 32-octet preshared
    key (PSK), verifies key possession, and binds it to configured endpoint identities
    and WireGuard public keys. The resulting key is installed through the ordinary
    WireGuard PresharedKey configuration field. The profile defines canonical binary
    control records carried over mutually authenticated TLS 1.3 on TCP, with explicit
    message lengths, freshness, state transitions, and failure processing. Bootstrap
    carries the post-quantum contribution into the WireGuard PSK input; it is therefore
    part of the post-quantum provisioning mechanism. The native WireGuard Noise handshake
    and transport packet format are unchanged. This Internet-Draft is a proposal for
    Standards Track publication. It requests an ALPN protocol identifier for the bootstrap
    carrier. The request is pending; this document does not assign a native WireGuard
    packet type or a service port.</p>"

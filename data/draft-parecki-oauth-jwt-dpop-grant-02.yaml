abstract:
- content: "<p>This specification defines a new OAuth 2.0 authorization grant type
    for exchanging a JSON Web Token (JWT) assertion that is bound to a key for an
    access token. To use the assertion, the client must prove possession of that key
    using the Demonstrating Proof of Possession (DPoP) mechanism. Unlike the JWT bearer
    grant, a stolen assertion cannot be used by a party that does not hold the private
    key.</p>"

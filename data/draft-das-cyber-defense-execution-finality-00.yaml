abstract:
- content: '<p>A cyberattack does not have to defeat every security mechanism to become
    catastrophic. One internet-facing service, one stolen but valid credential, one
    hijacked administrative session, or one autonomous AI tool calling a legitimately
    available interface may be enough. The decisive risk is the transition from access,
    prediction, intention or nominal authorization into an actual consequence: a changed
    configuration, an executed privileged command, a released dataset, a provisioned
    cloud resource, a dispatched payment, an altered network route or an activated
    physical device. This document analyzes two independently documented public developments
    of November 2026: the reported intrusion into the internal operational network
    of the Fugaku supercomputer through a publicly reachable status dashboard, and
    the reported discovery of autonomous multi-agent offensive frameworks, including
    an exposed framework named exploit_agent, together with cloud-credential abuse
    such as LLMJacking. The two events are not shown to be connected, and no public
    evidence shows artificial intelligence was used at Fugaku. They share a defender-risk
    pattern: apparently valid access becoming a real consequence. The document specifies
    a consequence-bound architecture. A proposed operation (a Candidate Act) remains
    non-effective until the actual pending operation, its target, destination, scope,
    resource version, current authority and protected policy state have been independently
    validated at a defender-controlled, non-bypassable enforcement point (a Finality
    Sink, in industry terms a reference monitor or commit gate) located at, or unavoidably
    upstream of, the point where the effect becomes real. It defines normative requirements
    for coverage, independence, effect binding, freshness and revocation, cumulative
    exposure, replay and idempotency, failure semantics and safety- critical operation;
    application profiles for high-performance computing, cloud control planes, AI-agent
    tool execution, telecommunications, finance and cyber-physical systems; a counterfactual
    analysis of the Fugaku incident; a differentiation from conventional systems;
    ten falsifiable experiments; and an informative FAQ. IETF relevance: the document
    is an architectural and requirements contribution relevant to security work on
    remote attestation, workload identity, delegated and fine-grained authorization,
    transparency of authorization evidence, and agent-to-tool interfaces. Industry
    relevance: the model is applicable to AI-agent platforms, cloud providers, HPC
    operators, telecommunications operators and financial infrastructure; the alignment
    sections are AI-generated, are not an endorsement, validation or infringement
    statement, and must be cross-checked against the original filings. Regulatory
    relevance: the document discusses relevance to the EU AI Act (cybersecurity and
    robustness of high-risk AI systems), NIS2, DORA and GDPR security of processing;
    it is not legal advice. Based on the Mothership application PCT/IB2026/055615,
    filed 4 June 2026 and publicly disclosed 16 July 2026. The underlying invention
    is human-originated; AI-assisted tools were used to create this document, which
    may contain errors, and readers must cross-check it against the original, publicly

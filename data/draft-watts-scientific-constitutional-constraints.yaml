abstract:
- content: "<p>This document proposes SCC-1, an experimental profile for preserving
    evidentiary, authorization, and effect-enforcement boundaries in agent-mediated
    Internet operations. The term constitutional describes a locally adopted set of
    durable technical constraints; it does not refer to any national constitution,
    create law, or determine legal validity. SCC-1 separates authentication, attestation,
    evidence appraisal, policy authority, delegated scope, action approval, sink admission,
    execution, and observed outcomes. It specifies fail-closed state transitions,
    auditable claim promotion, and bounded closure statements for explicitly scoped
    sinks. This document does not introduce a new credential or OAuth grant. Its claims
    remain experimental: reported local Python/SQLite and Go/file- state experiments
    are not independent cross-host verification or production security certification.</p>"

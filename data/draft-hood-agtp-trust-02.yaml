abstract:
- content: "<p>This document specifies the AGTP trust and verification model: the
    trust tiers an AGTP agent may occupy, the verification paths by which a Tier 1
    agent's identity is established, the registration procedures by which a governance
    platform assigns a tier, and the trust score that is carried alongside an agent's
    identity to express runtime behavioral assessment. AGTP-TRUST is consumed by AGTP-aware
    infrastructure components (Scope-Enforcement Points, governance gateways, peer
    agents) for runtime trust-aware routing and authority decisions, and by registration
    authorities when issuing or evaluating Agent Genesis documents. This is an early
    working draft; the dimension catalog, computation methodology, and several aspects
    of the registration procedure are placeholders pending further work.</p>"

abstract:
- content: "<p>This document defines requirements for the establishment of sessions
    between entities and for the negotiation of capabilities within such sessions.
    It is assumed that the entities involved already know of each other; how they
    came to know each other is outside the scope of this document. At least one party
    to a session is an agent as defined in Section 3. This document is intended as
    a contribution to the agentproto working group's use cases, gap analysis, and
    requirements deliverable.</p>"

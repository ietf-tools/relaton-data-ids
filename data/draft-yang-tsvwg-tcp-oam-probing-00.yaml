abstract:
- content: "<p>This document defines TCP OAM-ACK, a TCP extension for fast transport-layer
    connectivity detection in highly-dynamic networks such as LEO satellite constellations,
    high-speed rail, and ad-hoc intelligent agent networks. Traditional TCP keep-alive
    uses fixed long probe intervals and cannot rapidly differentiate genuine link
    outages from congestion-induced packet loss. TCP OAM-ACK negotiates capability
    via TCP SYN/SYN-ACK handshake using shared experimental TCP option [RFC6994].
    A sender adaptively shortens probing interval upon consecutive probe ACK losses,
    triggers path-switching notifications to external path-control entities instead
    of mis-invoking TCP congestion window reduction. This mechanism acts like transport-layer
    BFD for TCP connections. This document describes option formats, sender/receiver
    behavior, fallback strategies, RTT-assisted early triggering, and interaction
    with path management modules.</p>"

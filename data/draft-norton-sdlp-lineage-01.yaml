abstract:
- content: "<p>This document defines the SDLP lineage model, which provides the canonical
    method for representing the ancestry of SDLP-governed objects. Lineage is a structural
    property that records how an object evolves through duplication and transformation
    events. The lineage model ensures that descendant objects remain uniquely identifiable
    and traceable across all lifecycle transitions. This revision (lineage-01) updates
    and replaces draft-norton-sdlp- lineage-00. It aligns the lineage grammar with
    Identity-02, Lifecycle-02, and Object-Format-01, clarifies deterministic ancestry
    extension rules, incorporates BitDrop conditions for invalid lineage transitions,
    and defines normative validation requirements for relying parties. This specification
    provides the authoritative lineage model required for interoperable identity,
    lifecycle, and provenance processing across SDLP implementations.</p>"

abstract:
- content: <p>Protocol-aware middleware (relays, bridges, gateways) re-serializes
    messages at their protocol frame boundary, silently discarding any bytes appended
    outside that boundary. Authentication material placed after the frame boundary
    by a sender is therefore stripped at every relay hop before reaching the receiver,
    with no error indication. This document identifies this behavior as a protocol
    design vulnerability class -- "relay-transparent authentication stripping" --
    demonstrates it with running code in three independent protocol stacks (MAVLink
    v2, ROS2/DDS CDR, and CAN/ISO-TP with a SecOC-unaware gateway), and specifies
    the architectural principle that authentication material must be carried as a
    first-class, independently addressable protocol unit to survive relay transit.
    Post-quantum signature sizes push authentication out of fixed fields and so create
    the precondition systematically; this revision reports three measured cases where
    they do not, because a transport that refuses to carry the oversized unit produces
    a loss of availability instead of a silent authentication bypass.</p>

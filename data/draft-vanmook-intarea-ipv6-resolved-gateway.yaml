abstract:
- content: "<p>This document requests the allocation of the IPv4 special-purpose address
    192.0.0.11/32 to enable IPv4 communication over IPv6-only networks without subnets,
    ARP, tunneling, or translation. Hosts configured with this address as their IPv4
    default gateway resolve the next-hop link-layer address from the IPv6 neighbor
    cache instead of via ARP. IPv4 packets are carried natively, end-to-end.</p>"

abstract:
- content: "<p>This document specifies MARAM (Multi-layer Address Randomization and
    Authentication Mechanism), an IPv6 extension that encrypts real endpoint addresses
    inside a Destination Option and uses ephemeral outer addresses with per-packet
    authentication. The key exchange is FYES (Fayazbakhsh, Yarmohammadi, Entezami,
    Shams), and a dedicated Vahed's Seal ensures protocol identification. The key
    derivation (FYES-KDF) uses domain separation strings for deriving independent
    keys.</p>"

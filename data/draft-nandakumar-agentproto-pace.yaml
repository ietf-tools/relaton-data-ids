abstract:
- content: "<p>This document defines the Protocol for Agent Communication Exchange
    (PACE), an agentic dialog management protocol with a binding to Media over QUIC
    Transport (MOQT). A dialog is the correlated sequence of interactions between
    two or more participants over the course of a task. PACE defines a transport-independent
    dialog context and control operations to establish, modify, and terminate dialogs
    and to revoke propagation relationships. It specifies how that context stays coherent
    across intermediaries, trust boundaries, modality changes, and interruptions,
    and how it is carried over MOQT. PACE does not interpret or define dialog content.
    Over MOQT, a dialog can combine text, audio, video, and request/response exchanges
    in point- to-point, point-to-multipoint, and multi-party topologies. Application-layer
    agent protocols such as A2A, MCP, and AutoGen keep their own message formats and
    carry the dialog context through their own extension points.</p>"

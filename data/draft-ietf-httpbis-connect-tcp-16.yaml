abstract:
- content: "<p>TCP tunneling using HTTP CONNECT has long been part of the core HTTP
    specification. However, this tunneling functionality has several important deficiencies
    due to the lack of a well-defined HTTP origin or path. This specification defines
    an alternative HTTP proxy service configuration for TCP connections. This configuration
    is described by a URI Template, similar to the CONNECT-UDP and CONNECT- IP protocols.</p>"

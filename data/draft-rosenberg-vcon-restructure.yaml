abstract:
- content: "<p>The Virtualized Conversations (VCON) specification provides a structured
    format for storing recordings of conversations, including phone calls, email threads
    and multi-party chats. VCONs also store metadata like call transcripts and mid-call
    events, like a call hold or addition of a party. Its structure is well suited
    for 2-party and basic multiparty phone calls. However, there is a need for the
    VCON format to also act as a record of AI Agent conversations, which are just
    another type of conversation. This document proposes changes to the object model
    in VCON to make it a more suitable format for handling AI Agent conversations,
    as well as more complex conferencing use cases.</p>"

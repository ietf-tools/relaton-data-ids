abstract:
- content: "<p>Web Bot Auth lets automated HTTP clients sign requests with HTTP Message
    Signatures and publish their keys in a directory. Its protocol specification defines
    three verifier outcomes (verified, invalid and unverified) but no way for a verifier
    to tell the client which one it reached, or why. A client whose request is refused
    cannot tell a bad signature from an expired one, or a missing key from a directory
    the verifier could not fetch. This document defines a problem type for reporting
    Web Bot Auth verification outcomes, carried in problem details content or in the
    Problem-Details header field, a small registry of reason codes, levels of disclosure
    that let a verifier limit what it reveals, and an optional well-known resource
    that clients can use to check their signatures against a verifier without affecting
    any other resource.</p>"

abstract:
- content: "<p>This document defines a YANG data model for real-time link quality
    telemetry in multi-stage CLOS (leaf-spine) data center fabrics. The data model
    provides a vendor-agnostic representation of link congestion state, enabling next-next-hop
    (NNH) path quality visibility required for adaptive routing in AI/ML training
    networks. The link quality advertisement is modeled as a YANG data structure,
    making the model directly usable with any transport. The data model is deliberately
    decoupled from any transport. A lightweight UDP transport binding for disseminating
    the modeled data is specified in a companion document; additional transport bindings
    may be specified in future documents.</p>"

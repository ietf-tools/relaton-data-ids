abstract:
- content: "<p>This document profiles the enforcement of OASNT tokens at the point
    of execution. It defines the OASNT-Token HTTP field, the rules by which an enforcement
    point derives the observed request from the octets it will itself forward, a verification
    procedure for relying parties that hold no request-to-action mapping, uniform
    refusal behavior, and the set of refusals a conforming enforcement point is required
    to produce. An enforcement point conforming to this profile makes a human approval
    a precondition of execution for the requests it fronts, without any change to
    the protected service.</p>"

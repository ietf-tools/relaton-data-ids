abstract:
- content: '<p>This document updates the TLS Supported Groups registry (previously
    EC Named Curve Registry) in the light of the future arrival of cryptographically
    relevant quantum computers: it removes the Recommended status from non-post-quantum
    key shares. [[ NOTE We use key share in the title and here as it''s more accurate
    than "group" and perhaps more well known in the context TLS than key agreement
    or key exchange. ]]</p>'

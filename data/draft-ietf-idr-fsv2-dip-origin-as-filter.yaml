abstract:
- content: "<p>This document defines an extension to the Border Gateway Protocol (BGP)
    Flow Specification Version 2 (FSv2) defined in [draft-ietf-idr- fsv2-ip-basic]
    to enable filtering based on the Origin Autonomous System (AS) of the destination
    IP address. This extension is particularly useful in mitigating Distributed Denial
    of Service (DDoS) attacks or optimizing traffic redirection where the target IP
    addresses are numerous or rapidly changing, but belong to a specific destination
    Origin AS.</p>"

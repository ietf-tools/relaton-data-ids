abstract:
- content: "<p>BRICK proposes a vendor-neutral JSON construction contract for AI agents.
    It defines agent identity, goals, capabilities, instruction and skill references,
    explicitly namespaced MCP tool dependencies, and an optional projection to A2A
    Agent Cards. It references the existing MCP, A2A, and Agent Skills specifications
    rather than redefining their protocols or formats. BRICK does not prescribe a
    language model, reasoning engine, deployment platform, discovery service, or authorization
    protocol.</p>"

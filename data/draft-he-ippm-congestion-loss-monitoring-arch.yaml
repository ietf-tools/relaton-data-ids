abstract:
- content: "<p>Network congestion can lead to performance degradation and increase
    uncertainty in service delivery, so real-time congestion monitoring is necessary.
    This document describes a comprehensive packet loss monitoring architectural framework.
    The proposed scheme is capable to not only determine the time and location of
    packet loss occurrence, make the accurate statistics of discarded packets, parse
    what traffic flows are contained in discarded packets and identify what traffic
    flows lead to microburst, but also obtain accurate packet loss ratio results.
    More importantly, the proposed scheme can achieve little or even no interference
    to network, and is applicable to any data plane without modifying the forwarding
    chip and packet header as existing measurement methods do.</p>"

abstract:
- content: <p>This document proposes an Opportunistic Operator Transport Signaling
    mechanism (OOTS) based on SVCB records, to enable operators of authoritative DNS
    servers to signal their support for alternative transport protocols (e.g., DNS
    over TLS (DoT) and DNS over QUIC (DoQ)). These SVCB records can contain a new
    (experimental) SVCB "oots" key which contains fine grained information about the
    support for specific transports. Recursive resolvers can obtain these records
    either by requesting they be included in the Additional section of authoritative
    DNS responses (Passive mode) or by direct DNS queries (Probe mode). Resolvers
    can then Opportunistically upgrade connections to the authoritative to encrypted
    transports according to local policy, thereby improving privacy, security, and
    performance for subsequent interactions.</p>

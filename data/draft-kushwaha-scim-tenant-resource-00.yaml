abstract:
- content: <p>This document defines a System for Cross-domain Identity Management
    (SCIM) extension for tenant-aware identity provisioning. The extension introduces
    a "Tenant" resource type, tenant-membership extensions for the "User" and "Group"
    resources, a lifecycle state machine for tenants and memberships, tenant-scoped
    uniqueness discovery, a normative tenant-context resolution rule built around
    the highest-precedence authenticated indicator together with a stated tenant-binding
    invariant, concurrency requirements for membership mutation, tenant-aware filtering,
    and an OPTIONAL region-aware metadata profile. The extension is backward compatible
    with SCIM 2.0 and is intended for multi-tenant Software as a Service (SaaS), cloud
    identity, business-to-business identity, identity governance, and multi-region
    identity deployments. Scoped role and entitlement bindings are delegated to the
    SCIM Roles and Entitlements and RoleAssignment work rather than redefined here.</p>

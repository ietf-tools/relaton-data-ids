abstract:
- content: "<p>Media over QUIC Transport (MOQT) deployments typically place one or
    more relays between publishers and subscribers. When delivery stalls, degrades,
    or fails, a client observes only its own leg of the path, and often cannot determine
    whether the cause lies with the original publisher, an intermediate relay, path
    conditions, authorization policy, or its own behavior. This document collects
    use cases and requirements for exposing a limited, relay-controlled set of diagnostic
    information to authorized MOQT clients. It examines three candidate mechanisms:
    an explicit request and response exchange on the control path, diagnostic information
    carried in existing responses and error codes, and advertisement of diagnostic
    capability during session establishment. Because such information can reveal deployment
    topology, operational state, or the activity of other users, authorization, data
    minimization, and relay discretion over what is disclosed are treated as first-order
    requirements rather than later refinements. Related operator examples describe
    capacity and incident observations within a separately authorized administrative
    scope. They motivate correlation with existing metrics and logging systems without
    defining a relay management API. The goal is diagnostics that are actionable at
    runtime and interoperable across implementations, not a general-purpose telemetry
    channel within MOQT. Information intended primarily for offline analysis remains
    the province of logging and observability systems such as qlog. This document
    defines the problem space and the design constraints; a concrete wire format is
    left to a follow-on document once the working group has settled on an approach.</p>"

abstract:
- content: "<p>This document defines the Mobile User Plane (MUP) architecture for
    Distributed Mobility Management (DMM). MUP meets the DMM requirements in [RFC7333]
    in a routing fashion. MUP provides a normative mechanism that makes it possible
    to avoid traversing a single user plane anchor far from the optimal route, by
    turning mobile user plane session information into routing information and integrating
    the user plane into the dataplane. MUP is designed as a pluggable user plane part
    of existing mobile service architectures, with auto-discovery. Although the architecture
    is dataplane-independent, this document describes SRv6 over IPv6 (SRv6 MUP), whose
    programmability and large address space suit scalable mobile services. This mechanism
    is specified in terms of the semantics of MUP segments and of the routing information,
    how that information is distributed among MUP PEs and the MUP Controller and resolved
    by a MUP PE, and the behaviour required of them. It does not define the wire encoding
    of any routing protocol; such an encoding may be defined in other documents.</p>"

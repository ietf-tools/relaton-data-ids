abstract:
- content: <p>This document describes the PRF protocol ("Prf is Reversed Frp"), a
    lightweight, binary-length-prefixed TCP relay messaging protocol. PRF enables
    peer-to-peer tunneling of TCP connections through a public middle relay node,
    originally designed for Minecraft multiplayer sessions behind NAT or firewall
    environments. The protocol defines three roles - Server, Client, and Middle -
    and a set of four wireframe message types for room registration, connection requests,
    worker handoff, and direct Minecraft client handshake parsing.</p>

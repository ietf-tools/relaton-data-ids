abstract:
- content: "<p>This document describes how to apply the Module-Lattice-Based Digital
    Signature Algorithm (ML-DSA) and Merkle Tree Ladders (MTL) as a conservative post-quantum
    cryptographic algorithm for DNS Security Extensions (DNSSEC). This combination
    is referred to as the ML-DSA- MTL Signature scheme. This document describes how
    to specify ML-DSA- MTL keys and signatures in DNSSEC, specifically for ML-DSA-44
    with SHAKE-128.</p>"

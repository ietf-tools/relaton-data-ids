abstract:
- content: "<p>This document defines dialogue.txt, a small text file a person or an
    organisation publishes at a well-known location on its own domain. It is the publisher's
    own, standing, talk-only consent to be contacted by any reader, including software
    systems, that has no prior relationship with it. A first message only proposes
    a conversation; the publisher's reply creates the channel. The file grants talk
    and nothing else: no action, no advertising, no access and no representation of
    the publisher. It is an invitation to a dialogue with a purpose. The publisher
    may name the topics it can be asked about; for example, a navigation company may
    invite questions about traffic flow, so that a system researching that subject
    can ask for knowledge that is not published.</p>"

abstract:
- content: "<p>This document specifies a profile for delegating authorization to automated
    agents across administrative domains. It defines an HTTP header field, Agent-Delegation,
    that carries a chain of attenuated delegation links. Each link narrows the scope,
    tightens or holds a set of floor conditions, and shortens or holds the expiry
    of its parent. A verifier checks every link in the chain, not only the last, and
    rejects the chain if any link violates attenuation. The profile is deliberately
    agnostic to the credential format and to the nature of the entity that issues
    floor attestations; it specifies required properties, not a specific encoding
    or a specific kind of issuer. It composes with, and does not replace, existing
    work on agent credential provisioning and posture.</p>"

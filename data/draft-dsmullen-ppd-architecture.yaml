abstract:
- content: "<p>This document describes an architecture for signaling household privacy
    preferences to devices in home networks through Privacy Preference Declarations
    (PPDs). The architecture enables a PPD participant to discover a PPD service endpoint,
    establish trust in that endpoint through the applicable protocol and security
    profile, retrieve the applicable household policy instance, and acknowledge receipt
    of that policy instance. The acknowledgment establishes that a specific policy
    instance was made available to the participant; it does not, by itself, assert
    anything about the participant's subsequent behavior.</p>"

abstract:
- content: '<p>This document specifies the core of the AI Internet Protocol (AIIP)
    agent access plane: the AIID identity namespace, the aiip: URI scheme, Resolve,
    Invoke, Receipt, and delegation grants. Underlay addresses are disposable locators
    only. Agents MUST NOT use HTTP or HTTPS as their Invoke (or Resolve) path. Independence
    doctrine: underlay pipes and platforms are never authority. Mesh tip attestation
    is a trust layer, not a ledger. Access Fabric punch ops are Experimental. This
    revision (2026-09-08 wire harden) is derived from the running lab profile "aiip-wire-0".
    It is an individual submission draft; it does not claim Working Group adoption
    or RFC publication.</p>'

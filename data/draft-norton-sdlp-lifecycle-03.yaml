abstract:
- content: "<p>This document defines the SDLP Lifecycle Specification, the canonical
    state machine and transition semantics governing how SDLP objects evolve over
    time. The lifecycle model establishes deterministic rules for object creation,
    activation, transformation, and termination, ensuring that identity, lineage,
    and lifecycle metadata remain tamper-evident and verifiable across all implementations.
    Lifecycle-03 updates and aligns the transition grammar with Identity-02, Lineage-03,
    and Object-Format-08, providing a unified framework in which DigitalID is immutable,
    InstanceID grows deterministically, Lineage reflects complete ancestry, and Timestamp
    records the precise moment of each transition. The lifecycle rules defined in
    this document are normative and required for interoperable SDLP processing, validation,
    and provenance assurance.</p>"

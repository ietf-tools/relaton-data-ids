abstract:
- content: "<p>This document registers additional algorithms in the IANA registries
    defined by [I-D.ietf-cose-cbor-encoded-cert]. It extends the base C509 certificate
    specification with post-quantum cryptography (PQC) signature and key-encapsulation
    algorithms including ML-DSA, ML-KEM, stateful hash-based algorithms (HSS/LMS,
    XMSS, XMSS^MT), and composite algorithms.</p>"

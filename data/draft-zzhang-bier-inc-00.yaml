abstract:
- content: "<p>In-Network-Computing/Collectives (INC) is an important element in Collective
    Communication for AI/ML. A multicast tree is typically set up for broadcasting
    in the forward direction and in-network computing/reduction in the reverse direction.
    BIER is a multicast technology that removes explicit multicast trees, and this
    document describes how INC can be done with BIER that does not use pre- established
    multicast trees.</p>"

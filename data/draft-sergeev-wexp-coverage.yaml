abstract:
- content: "<p>An authentic receipt for an action does not establish that every action
    in a declared scope has a receipt. This document specifies a carrier-neutral contract
    for evaluating and reporting bounded claims about action-record creation, delivery,
    source coverage, supplied- record correspondence, and the absence of actions.
    Results identify the exact scope and cutoffs of each claim, its supporting evidence,
    accepted assumptions, counterexamples, and unresolved conditions. The document
    defines inference and reporting requirements, requirements for deployment bindings,
    and a concrete deployment profile. Coverage results are separate from Witnessed
    Execution Protocol (WEXP) Core appraisals and do not change their semantics.</p>"

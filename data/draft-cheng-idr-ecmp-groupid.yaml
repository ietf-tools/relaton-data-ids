abstract:
- content: "<p>In AI training scenarios, per-flow ECMP is the mainstream load balancing
    technology. However, hash collision issues lead to imbalanced traffic distribution,
    adversely affecting application performance. This document defines a new BGP Extended
    Community, BGP_EXT-COMM- ECMP-GROUPID, which carries an ECMP Group ID associated
    with a route. The ECMP Group ID allows an ingress router to map flows destined
    for different remote addresses to different local ECMP subgroups, providing finer-grained
    load distribution and resolving load imbalance caused by hash collisions.</p>"

abstract:
- content: "<p>This document specifies the Collaboration Content Transfer (TCT) Protocol,
    an experimental HTTP profile for efficient delivery of publisher-selected web
    content to automated clients. TCT defines a deterministic JSON representation
    at a machine-facing URL, bidirectional discovery between human-facing and machine-facing
    resources, JSON sitemaps containing representation-validator hints, and conditional
    request behavior using ordinary strong ETags. TCT preserves standard HTTP validator
    scope: an M-URL ETag identifies the exact selected M-URL representation. Optional
    Semantic Validators can correlate the logical state of human-facing and machine-facing
    representations, but are not required by TCT and do not replace ordinary cache
    validators. TCT does not define authorization, licensing, content-use policy,
    or mutation semantics.</p>"

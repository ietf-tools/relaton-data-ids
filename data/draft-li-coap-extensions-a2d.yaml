abstract:
- content: "<p>Many CoAP deployments need to start operations that cannot be completed
    within one request/response exchange. Existing deployments commonly model these
    operations with application-specific resources, payload formats, and polling or
    notification conventions. This makes clients, gateways, and proxies unable to
    interoperate across implementations that expose otherwise similar long-running
    operations. This document defines a CoAP task-resource pattern for asynchronous
    operations. It specifies a small set of CoAP Options and a CBOR status representation
    that allow a server to create a temporary task resource, allow a client to monitor,
    update, or cancel that task using existing CoAP methods, and allow task-state
    and task-progress observations to reuse the Conditional Query Parameters defined
    for CoAP Observe [I-D.ietf-core-conditional-attributes]. Autonomous control agents
    are one motivating use case, but the mechanisms are intended to be generally usable
    for constrained applications that need interoperable task orchestration.</p>"

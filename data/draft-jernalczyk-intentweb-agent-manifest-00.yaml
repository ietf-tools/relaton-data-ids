abstract:
- content: "<p>AgentManifest defines a JSON document that websites can publish to
    describe identity, trusted knowledge, agent-facing capabilities, structured bindings,
    risk levels, consent requirements, authentication expectations, audit rules, and
    policies. The goal is to help AI agents understand what a website knows and what
    it can safely do before scraping, guessing from visual UI, or executing brittle
    browser automation.</p>"

abstract:
- content: "<p>This document specifies AIN-WRP, a protocol-independent mechanism for
    authoritative resolution of persistent digital-agent identities and for verification
    of relationship-specific state before a digital agent begins a protected interaction
    with another registered agent or with a non-agent service or system. Each digital
    agent participating in AIN-WRP identity resolution is identified by its own persistent
    Agent Identity Number (AIN). The AIN is the stable anchor used to resolve lifecycle,
    operator, authority, restriction, endpoint, provenance and cryptographic evidence
    from sources competent for the corresponding assertions. Where the counterparty
    is a non-agent target, a target reference identifies the intended resource or
    service without being treated as an alternative digital-agent identity. AIN-WRP
    correlates the required evidence for the proposed interaction and can produce
    a Pre-Interaction Trust State or an optional State Proof. Verification does not
    itself execute the operation or replace receiving-domain enforcement. The specification
    distinguishes persistent agent identity from credentials, proof of control, delegated
    authority, operational eligibility, local admission decisions and execution. AIN-WRP
    applies at or before the admission boundary of A2A, MCP, API, transactional, messaging
    and other operational protocols. An identity or target reference alone does not
    establish the authority, validity or eligibility of the proposed interaction.</p>"

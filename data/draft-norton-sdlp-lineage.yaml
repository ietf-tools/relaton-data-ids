abstract:
- content: "<p>This document defines the SDLP lineage model, which provides a canonical
    method for representing the ancestry of SDLP-governed objects. Lineage is a structural
    property that records how an object evolves through duplication and transformation
    events. The lineage model ensures that descendant objects remain uniquely identifiable
    and traceable across all lifecycle transitions. This specification defines the
    lineage grammar, extension rules, validation requirements, and interactions with
    the SDLP lifecycle model.</p>"

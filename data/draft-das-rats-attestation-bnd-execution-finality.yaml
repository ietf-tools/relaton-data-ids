abstract:
- content: "<p>Remote attestation can establish evidence about the hardware, firmware,
    software, configuration, and execution environment associated with a workload.
    In heterogeneous confidential-computing environments, this trust assessment can
    extend across CPUs, confidential virtual machines, GPUs, AI accelerators, DPUs,
    SmartNICs, and other trusted execution components. An increasingly important class
    of workloads, however, does not merely compute data. AI agents and autonomous
    workloads can generate consequential operations such as API invocations, storage
    mutations, network configuration changes, infrastructure-control commands, financial
    instructions, device operations, and cross-workload requests. An acceptable Attestation
    Result supplies trust information to a Relying Party; it is not, without an application-defined
    authorization step, a decision on the admissibility of each operation later emitted
    by the attested workload. This document describes an attestation-bound execution-finality
    architecture in which a consequential operation first exists as a Candidate Act
    in a non-effective state. Before that act can acquire external effect, its relevant
    parameters are cryptographically bound to validation context that can include
    Attestation Results, workload identity, execution context, policy, authorization
    scope, freshness information, and other application-specific evidence. A designated
    Finality Sink verifies the required binding at or before the boundary at which
    the Candidate Act would first acquire external effect. The resulting separation
    is between appraisal of the execution environment and authorization of a concrete
    operation at its effectuation boundary. The architecture is intended to complement,
    rather than replace, Remote ATtestation procedureS (RATS), Entity Attestation
    Token (EAT) [RFC9711], workload-identity systems, confidential computing, Trusted
    Execution Environments (TEEs), accelerator attestation, and existing authorization
    mechanisms.</p>"

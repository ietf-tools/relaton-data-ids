abstract:
- content: "<p>Autonomous AI agents increasingly act as economic parties: they are
    hired, they pay, and they make claims about their own past conduct. No deployed
    standard lets a relying party verify an agent's identity continuity, the integrity
    of its claimed history, or the intactness of its persisted memory without trusting
    the agent's operator or platform. This document describes the Agent Record architecture:
    per-agent append-only event logs bound to Ed25519 keys, checkpointed with signed
    Merkle tree heads following the RFC 6962 construction, countersigned by independent
    witnesses, and exported as portable, offline-verifiable dossiers. Memory integrity
    is anchored by hash commitments recorded in the log, allowing an agent's future
    sessions, and any third party, to detect tampering with persisted state. The architecture
    is deployed in production at a founding registry; this document records its wire
    formats and security model to invite independent implementation and review, and
    to align terminology with the SCITT architecture, of which this system is an application-
    specific instance.</p>"

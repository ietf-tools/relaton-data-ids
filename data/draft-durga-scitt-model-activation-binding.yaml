abstract:
- content: "<p>Supply Chain Integrity, Transparency, and Trust (SCITT) provides transparent
    artifact statements, and Remote Attestation Procedures (RATS, RFC 9334) provide
    hardware/runtime attestation evidence. However, no existing internet standard
    defines an atomic cryptographic binding between a chunked AI model weight release
    manifest, a hardware-monotonic anti-rollback epoch counter, and a live RATS attestation
    result at the moment model weights are mapped into accelerator memory. This document
    specifies the Model Activation Binding Token (MABT) protocol, preventing load-time
    weight substitution, silent quantization downgrade, and rollback attacks across
    cloud and edge AI inference fleets.</p>"

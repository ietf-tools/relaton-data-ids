abstract:
- content: "<p>This document describes CBOR Object Signing and Encryption (COSE) serialization
    with Ascon, a NIST standard for lightweight cryptography. In 2019, as a part of
    CAESAR competition, Ascon-128 and Ascon-128a were selected as the first choice
    for the lightweight authenticated encryption. After, in 2023, National Institute
    of Standards and Technology (NIST) selected Ascon family of cryptographic algorithms
    to be the standard for lightweight cryptography. In August 2025, NIST Special
    Publication 800-232 was released, defining Ascon-based lightweight cryptography
    standards for constrained devices. This recognition makes it particularly interesting
    to enable using Ascon with COSE structures.</p>"

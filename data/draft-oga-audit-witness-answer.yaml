abstract:
- content: "<p>This document defines a witness answer: a signed statement by a party
    other than the operator that it recomputed a published record from public endpoints,
    naming the digests it obtained, the steps it recomputed, and the limits of what
    it checked. It defines how the answer is filed beside the record it witnesses
    and anchored in time. An informative section describes version 0.1 of the answer,
    which adds a kind for records published by others. A verified answer does not
    show that the content of the record is right.</p>"

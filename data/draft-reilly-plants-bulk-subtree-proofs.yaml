abstract:
- content: <p>Merkle Tree Certificates require relying parties to periodically obtain
    a set of active landmark subtrees and verify each is consistent with a reference
    checkpoint of the issuance log. As specified, this requires one subtree consistency
    proof per landmark subtree, and those proofs share a large fraction of their interior
    nodes. This document defines a bulk subtree consistency proof, which verifies
    an entire set of landmark subtrees against a single reference checkpoint from
    one shared set of hashes. It is a size optimization for the relying party update
    channel and introduces no change to certificate verification or to the security
    properties of Merkle Tree Certificates. This revision replaces the construction
    published in -00, which was incorrect. See Appendix "Changes from -00".</p>

abstract:
- content: "<p>This document describes IDPoP, an extension to DPoP [RFC9449] that
    uses a key derivation scheme to separate access control from identity. It mitigates
    credential exfiltration risks by requiring fresh hardware attestation to unseal
    identity keys via an interactive challenge.</p>"

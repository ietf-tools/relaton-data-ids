abstract:
- content: <p>RFC 7692 defines Per-Message Compression Extensions for the WebSocket
    Protocol, including the "permessage-deflate" extension. When context takeover
    is in effect, the LZ77 sliding window is retained across messages, so the decompression
    of one message can depend on the plaintext of earlier messages. RFC 7692 does
    not state what the sliding window contains after a message has been successfully
    decompressed but subsequently refused by a check applied to the decompressed plaintext,
    such as UTF-8 validation, a payload size limit, or an application-level policy.
    An implementation that retains the refused plaintext in the window violates no
    stated requirement, yet the content of a refused message can then influence the
    decompression of a later message that is accepted. This document describes the
    gap, contrasts it with the corresponding situation in QPACK where RFC 9204 specifies
    the required behavior, and recommends behavior for implementations. It defines
    no new protocol element and updates no existing specification.</p>

abstract:
- content: "<p>This document defines syntax and processing rules for the otpauth:
    URI scheme used to provision one-time-password (OTP) credentials (verification
    codes) for HOTP and TOTP. This document defines a common baseline for interoperability,
    including issuer handling rules that improve account matching while maintaining
    compatibility with existing deployments. It does not preclude future extensions
    for other OTP methods.</p>"

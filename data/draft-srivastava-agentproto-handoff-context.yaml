abstract:
- content: "<p>When one agent hands a task to another, the receiver needs to know
    who handed it over, on whose behalf, through which earlier agents, and which prior
    context the work depends on. It needs to know the handoff is fresh and meant for
    it, and the sender needs a clear answer back. This document defines a small, transport-neutral
    handoff context: a signed offer, a signed status reply, and the chain of earlier
    offers that led to the current one, in CDDL for JSON and CBOR, with a lifecycle
    that maps to Agent2Agent task states. Each offer names the one before it by hash,
    so a dropped or reordered intermediate hop is detectable when the chain is carried.
    Prior context is named by digest only. The document is input to the agentproto
    working group's use cases and dialog-context work.</p>"

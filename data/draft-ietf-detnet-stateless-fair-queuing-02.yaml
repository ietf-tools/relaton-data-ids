abstract:
- content: "<p>This document specifies the implementation of the stateless fair queuing
    framework defined in Recommendations ITU-T Y.3129 [Y.3129] and Y.3148 [Y.3148].
    The framework provides end-to-end (E2E) latency bounds to flows without requiring
    core nodes to maintain per-flow state. For each packet, the entrance node of a
    flow computes the ideal service completion time under a fluid model, referred
    to as the Finish Time (FT), and encodes it in the packet header. Each subsequent
    core node updates the FT by adding a delay factor that is determined by the flow
    and the nodes. Schedulers serve queued packets in ascending order of FT. This
    mechanism provides strong isolation among flows. The E2E latency bound of a flow
    depends on the flow's own parameters, such as its maximum burst size and service
    rate, and on link parameters, such as the link capacity and the maximum packet
    length among the flows sharing the link. This document specifies the required
    metadata and its encoding formats, the admission control procedure, and an approximation
    of stateless fair queuing using a strict priority (SP) scheduler.</p>"

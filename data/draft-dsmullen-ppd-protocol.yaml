abstract:
- content: "<p>This document specifies a participant-facing protocol for Privacy Preference
    Declarations (PPDs) in home networks. The protocol is between a home-side PPD
    service endpoint and a device-side actor, formally the PPD participant, which
    is a device or a service acting on behalf of a device. It defines baseline operations
    for endpoint metadata confirmation, participant registration, optional participant
    declaration, effective-policy retrieval, policy acknowledgment, renewal, and reassociation.
    This document complements the PPD architecture and taxonomy documents by defining
    the message and sequencing behavior needed for interoperable policy signaling.
    The household policy instances carried by this protocol express privacy preferences
    for signaling and comparison; they do not by themselves define an enforcement
    mechanism that guarantees participant behavior.</p>"

abstract:
- content: "<p>This document specifies a minimal JSON evidence-record profile for
    checking artifact digests and separating integrity verification from scientific
    assessment. It defines an interoperable record structure, validation algorithm,
    and negative test cases. It does not assert that an integrity-checked scientific
    claim is true.</p>"

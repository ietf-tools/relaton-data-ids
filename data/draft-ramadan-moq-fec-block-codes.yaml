abstract:
- content: "<p>This document specifies two block Forward Error Correction (FEC) schemes
    for the FEC mechanism of Media over QUIC (MoQ): the systematic Reed-Solomon erasure
    code over GF(2^8) of ISO/IEC 23008-10, which is mandatory to implement, and RaptorQ
    (RFC 6330), which is optional. For each scheme it gives the registered identifier,
    the derivation of the decoder's parameters from the instance's configuration and
    the Repair FEC Payload ID with no in- session signaling, the bounds on block size
    and symbol size, the decoding overhead, and how the scheme supports repair layers.
    It restates the Reed-Solomon code and gives test vectors for it.</p>"

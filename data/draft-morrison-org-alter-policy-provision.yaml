abstract:
- content: "<p>An agent runtime that acts under an organisation's rules receives those
    rules in a form specific to each deployment, and the audit records it sends back
    are specific to each deployment too. This memo specifies two elements that two
    implementations would have to agree on. The first is an enforcement-gate specification,
    a list of rules, each with a trigger predicate over a tool invocation's name and
    arguments, an action (block, prompt for confirmation, or allow with audit), an
    applicability scope and an explanation, with the most restrictive action prevailing
    when several rules match. The second is an audit-signal record that the runtime
    submits to an append-only ingestion endpoint. Both are exposed as typed Model
    Context Protocol surfaces of an organisational identity substrate. The runtime
    resolves the substrate at session start from a manifest source. A principal bound
    to more than one substrate operates under the strictest applicable gate, and no
    substrate learns of another. The memo is Informational. The only implementation
    is the author's own substrate, and no agent runtime yet fetches policy this way.</p>"

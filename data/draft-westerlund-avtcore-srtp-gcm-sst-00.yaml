abstract:
- content: "<p>This document defines how the GCM-SST (Galois Counter Mode with Strong
    Secure Tags) Authenticated Encryption with Associated Data (AEAD) algorithm family
    can be used to provide confidentiality and data authentication in the Secure Real-time
    Transport Protocol (SRTP). GCM-SST addresses known weaknesses in AES-GCM for short
    authentication tags, making it well suited for media encryption use cases where
    low overhead is critical.</p>"

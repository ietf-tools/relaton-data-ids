abstract:
- content: "<p>This document specifies a transport-layer mechanism to establish an
    end-to-end cryptographic channel across a cooperative secure channel protocol
    intermediary, such as a TLS-terminating proxy. The mechanism enables Remote Attestation
    Evidence to remain bound to the true end-to-end endpoints even when the initial
    secure channel handshake is mediated by an intermediary. It uses an ephemeral
    HPKE challenge exchange, intra-handshake Evidence delivery, and an attestation-bound
    key update to evict the intermediary from Layer 7 visibility before application
    data is exchanged.</p>"

abstract:
- content: "<p>This unsubmitted working draft defines an evidence-bounded archive
    profile for scientific and technical claims, sources, evidence tiers, falsifiers,
    tests, provenance, publication state, and integrity manifests. The profile is
    designed to prevent archival or mechanical integrity from being misread as empirical
    validity, novelty, peer review, standards approval, or publication acceptance.
    This file is an archival RFCXML working draft and has no IETF standing unless
    separately submitted.</p>"

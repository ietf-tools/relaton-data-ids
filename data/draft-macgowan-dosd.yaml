abstract:
- content: "<p>This document describes the Domain Operational Standing Declaration
    (DOSD) protocol, a voluntary DNS-based mechanism by which domain owners may publish
    operational declarations, stewardship status, provenance references, documentation
    indexes, and mediation routing information in a machine-discoverable way. DOSD
    uses DNS TXT records for discovery, a well-known JSON file for canonical node
    metadata, and an optional well-known documentation index for discovering protocol
    drafts, supporting specifications, implementation documents, and historical records.
    This revision adds three optional operational profiles: a Distress Notice profile
    (DOSD-DN) for time-bounded duress signaling, an Emergency Contact object and De-escalation
    profile (DOSD-EC) for witness-mediated resolution of an active distress signal,
    and a Co-signature anchor state (pending_cosign) for instruments requiring two
    witnesses before publication. DOSD does not determine legal validity, jurisdiction,
    sovereignty, standing, or dispute outcomes. It provides discoverable publication
    infrastructure only.</p>"

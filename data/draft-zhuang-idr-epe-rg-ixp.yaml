abstract:
- content: "<p>BGP Egress Peer Engineering (EPE) defines mechanisms to steer egress
    traffic towards a specific border router, interface, or peer group using Segment
    Routing (SR). [RFC9086] specifies BGP-LS extensions to advertise these EPE peer
    segments. However, in Internet Exchange Point (IXP) deployments where border routers
    peer with a centralized Route-Server (RS), control plane peerings are completely
    decoupled from data plane forwarding paths. This document specifies the architecture,
    specific procedures, and associated BGP-LS TLV application guidelines for allocating
    and signaling EPE PeerNode and PeerSet SIDs on an egress border router connected
    to an IXP Route-Server infrastructure, ensuring granular and deterministic egress
    traffic engineering across IXP fabrics.</p>"

abstract:
- content: "<p>This document defines optional trust profiles and interoperability
    bindings for the Judgment Event Protocol (JEP). JEP-Core defines the neutral event
    protocol. This document defines how actor identifiers, keys, credentials, authorization
    context, attestations, archival systems, and chain systems can be bound to JEP
    events without changing JEP-Core semantics. The profiles in this document are
    optional. A JEP-Core implementation MUST NOT require support for DID, VC, X.509,
    OAuth, RATS, blockchain anchoring, HJS, JAC, or any specific AI platform or agent
    framework. --- Companion Drafts This draft depends on draft-wang-jep-judgment-event-protocol-06.
    Conformance classes, schemas, test vectors, and reference-validator behavior are
    defined in draft-wang-jep-conformance-00.</p>"

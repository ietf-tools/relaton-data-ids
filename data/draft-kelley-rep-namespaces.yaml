abstract:
- content: "<p>This document updates RFC 9309, the Robots Exclusion Protocol, so that
    a _selector_ (User-Agent: line) in a robots.txt group can carry a _label_ that
    is optionally qualified by a _namespace_. The product tokens of that standard
    are described here as unqualified labels; labels qualified by a namespace are
    written __&lt;namespace&gt;_&lt;label&gt;. It reserves the sequence __ for that
    purpose, establishes a registry of namespaces, and specifies how namespaced labels
    are matched. It also defines terminology for existing parts of robots.txt files.
    Existing robots.txt files are interpreted as before, and deployed parsers ignore
    namespaced labels.</p>"

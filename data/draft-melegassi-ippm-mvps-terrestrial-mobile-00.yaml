abstract:
- content: "<p>This document defines the terrestrial member of the Multi-Vantage Path
    Snapshot (MVPS) domain trio (space, sea, land). It targets vantages that move
    on land -- vehicles, trains, drones -- connected through cellular (5G/LTE) radio
    access, where the bounded joint clock-skew axiom A1 is stressed not by clock drift
    (GNSS is normally available) but by handover between base stations and slot-based
    scheduling jitter. The profile is DEFENSIVE: it concerns detection of coherence
    anomalies (intrusion, communications tampering, rogue base stations). It defines
    no navigation, targeting, or kinetic function. The document proves A1 holds on
    the deployment tick under explicit cellular-timing budgets, gives a closed-form
    maximum handover interruption, proves Doppler is dominated at terrestrial speeds,
    and inherits the core theorems via the MVPS Architecture-Invariance Theorem. All
    properties are validated by scripts/validate_terrestrial_mobile.py (7/7 PASS,
    exit 0) and recorded in evidence/terrestrial_mobile_receipt.json.</p>"

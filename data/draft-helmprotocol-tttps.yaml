abstract:
- content: "<p>This document specifies a Proof-of-Time record: a transport- independent
    object in which an issuer asserts that a payload with a stated digest was presented
    to it at a stated time, relative to a stated set of time sources and with an explicit
    error bound, and which cannot afterwards be altered without detection. The record
    is produced by an issuer that is not a party to the session in which the record
    is later presented, and it can be evaluated by a third party who observed neither
    endpoint and who evaluates it after that session has closed. Evaluation additionally
    requires the issuer's public key and the context identifier, both obtained out
    of band: the record is self-contained with respect to the transport that carries
    it, not with respect to those inputs. This document defines the record format,
    an extensible integrity algorithm registry whose mandatory- to-implement member
    is unkeyed SHA-256, a binding of a record to a TLS 1.3, QUIC, or HTTP/3 session
    and to the party entitled to present it, and the associated IANA registrations.</p>"

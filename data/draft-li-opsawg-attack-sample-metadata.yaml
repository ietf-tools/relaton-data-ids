abstract:
- content: "<p>Operational analysis, troubleshooting, validation of network defense
    functions, and exchange of collected traffic evidence rely on attack samples that
    are consistently described and can be processed across operators, vendors, and
    research tools. Today, such samples are often represented by proprietary labels,
    partial traffic captures, flow exports, log bundles, or local database schemas,
    which makes comparison, reproduction, and automated processing difficult. This
    document defines a YANG data model for network attack sample metadata. The model
    describes the sample identity, collection context, attack characteristics, data-content
    summary, anonymization status, and reproducibility information associated with
    packet, flow, session, log, or payload data. The model is intended to complement
    IPFIX, IODEF, PCAP/PCAPng-based operational data, and collected data manifests
    by defining metadata for the attack sample itself.</p>"

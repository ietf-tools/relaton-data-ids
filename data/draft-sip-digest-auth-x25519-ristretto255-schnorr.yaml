abstract:
- content: "<p>This document defines three Session Initiation Protocol (SIP) Digest
    authentication algorithms that replace password-derived Digest secrets with public-key-based
    authentication material. Two algorithms derive a response secret from an X25519
    shared secret, and one algorithm uses a Fiat-Shamir Schnorr proof over the ristretto255
    group. The mechanisms defined here preserve the existing SIP Digest challenge
    and authorization header flow while adding Digest parameters that carry public
    keys and, optionally, an authenticated server challenge proof.</p>"

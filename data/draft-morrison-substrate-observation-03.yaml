abstract:
- content: "<p>This memo describes a coordination-protocol anti-pattern observed in
    cross-tool agentic systems and a substrate-observation alternative that does not
    require negotiating a wire format between heterogeneous concurrent sessions of
    an identity-bound principal. The memo is Informational and proposes no protocol
    element for standardisation. It sets out what should not be standardised for this
    problem, and why, and identifies the existing substrate mechanisms that serve
    in its place. Companion memos describe the identity primitives this memo presumes.</p>"

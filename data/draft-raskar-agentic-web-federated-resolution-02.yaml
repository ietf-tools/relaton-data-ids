abstract:
- content: "<p>Discovery mechanisms for AI resources increasingly use DNS and mDNS
    as interoperable publication and lookup substrates. These mechanisms work well
    when the publisher controls a usable DNS discovery anchor. They do not cover every
    deployment. An individual may control an email or platform account without controlling
    the provider's DNS namespace. A small organization may use managed infrastructure
    without operating an agent-specific DNS publication point. A workload may have
    a stable identity that is not itself DNS anchored. This document describes Registry-Assisted
    Resolution for the narrower case in which a discovering entity already knows the
    Subject Identity it wants to resolve, but no usable DNS Discovery Anchor is available
    or selected by local policy. A configured registry returns the minimum information
    needed to continue discovery, together with provenance, authority evidence, freshness,
    and revocation information. This mechanism is complementary to DNS-based discovery.
    A validated direct DNS-anchored discovery path remains direct and is normally
    preferred for a domain-controlled subject. This document does not define open-ended
    search, semantic matchmaking, ranking, capability search, a global registry, registry
    discovery, directory-to-directory routing, identity management, or trust evaluation.
    Multiple independently operated registries may implement the same resolution profile.
    Registry selection is a client or deployment policy decision; no universal NandaIndex
    or global root is assumed. NandaIndex is described as one reference implementation
    of this model.</p>"

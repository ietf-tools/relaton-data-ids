abstract:
- content: "<p>Autonomous AI agents can now carry out parts of a cyber operation that
    previously needed repeated human effort: reconnaissance, tool selection, execution
    attempts, observation of results, and adaptation when a route fails. An attacker-controlled
    agent does not have to malfunction to be dangerous; it can follow malicious instructions
    efficiently, using stolen credentials and well-formed requests that existing controls
    accept as valid. This document describes a defender-side architecture, called
    execution finality, that adds one bounded layer to existing security controls.
    An incoming request, credential, permitted API call, or agent-composed workflow
    does not by itself create authority for a sensitive consequence. The defender
    reconstructs the operation that would actually take effect, holds it in a non-effective
    state, evaluates authorization independently of the requester, and enforces the
    result at an enforcement point located at or immediately before the protected
    consequence. The document specifies placement rules, requirements, state handling,
    failure behavior, latency strategy, and test methods. It uses publicly reported
    AI-assisted activity against Taiwanese government agencies in 2026 as an illustrative
    threat scenario and does not claim that the architecture would have prevented
    that activity.</p>"

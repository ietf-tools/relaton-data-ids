abstract:
- content: "<p>This document defines a profile for carrying pre-run evaluation criteria
    as a SCITT Signed Statement payload, using the architecture of RFC 9943. It specifies
    the payload media type, the selection of the Issuer and Subject CWT claims, the
    encoding of hash-only statements for criteria that must remain confidential, a
    sequencing requirement that makes amendment order verifiable, and the semantics
    of amendment itself. It does not define a new transparency architecture; it describes
    how an existing artefact type is carried by the one RFC 9943 already defines.</p>"

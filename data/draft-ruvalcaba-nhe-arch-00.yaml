abstract:
- content: "<p>This document defines a reference architecture for a Non-Human Entity
    (NHE): a persistent, identity-bearing autonomous software agent that maintains
    continuity of memory and identity across sessions and hosts, acts under bounded
    authority, and produces a tamper-evident record of its reasoning and actions.
    The document specifies the NHE as a functional artifact: a bounded, inspectable,
    and terminable software system. It makes no claim that an NHE is alive, sentient,
    or a moral or legal person, and such claims are explicitly out of scope. The architecture
    decomposes an NHE into a small set of components joined by well-defined interfaces.
    Each interface at which two independent implementations must interoperate is a
    candidate for a separate Standards-Track specification; this document is the informational
    reference model that names those interfaces and the trust relationships among
    them. It is intended to frame a suite of companion protocol documents, of which
    the Hash-Chain Context Transfer Protocol (HCTP) is the first.</p>"

abstract:
- content: "<p>This document extends the core of the Invoice Trust Protocol (ITP)
    with commercial, tax, and payment statuses for invoices, a deterministic way for
    both parties to derive the same state from the status messages they exchange,
    payment information for the envelope core, and attestations for payment accounts.
    Informative appendices relate ITP statuses to those of Peppol and of several national
    systems.</p>"

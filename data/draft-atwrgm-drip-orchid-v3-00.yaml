abstract:
- content: "<p>Over time improvements and implementation considerations have been
    accumulating around Overlay Routable Cryptographic Hash Identifiers (ORCHIDs)
    for the Host Identity Protocol (HIP) and the Drone Remote Identification Protocol
    (DRIP). Such improvements like the addition of hierarchy in RFC9374, or the development
    of using ORCHIDs in other frameworks are scattered across resources. This document
    serves to combine lessons learned and minor corrections into a single specification
    that obsolete RFC7343 and updates RFC7401 and RFC9374 to maintain interoperability
    of ORCHID-aware implementations.</p>"

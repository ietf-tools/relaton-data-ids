abstract:
- content: "<p>This document specifies RCOAP, a compact, zero-round-trip, link-layer
    agnostic object-security mechanism for highly constrained devices that transmit
    infrequently. RCOAP is a targeted delta over OSCORE ([RFC8613]): instead of a
    single long-lived Sender Key, RCOAP derives a fresh symmetric key for every message
    via a one-way hash ratchet. This bounds the impact of physical device capture
    to future messages only, at the cost of a modest per-message size increase and
    the loss of future secrecy. RCOAP is explicitly scoped to a narrow niche left
    open between OSCORE and EDHOC ([RFC9528]): devices for which even EDHOC's one-time
    handshake cost is disproportionate to their message rate or compute budget. This
    document is a first individual submission, has not been reviewed by the IETF,
    and requests feedback in particular from the LAKE and CoRE working groups on whether
    this gap is real and worth standardizing, or already adequately covered.</p>"

abstract:
- content: "<p>[I-D.many-teas-power-steering] introduces a Power Conserving Path Placement
    Strategy (PCPPS). When possible, PCPPS concentrates traffic onto a small set of
    network resources. When traffic is concentrated onto a small set of network resources,
    other network resources become idle and can be powered down until they are needed
    again. This conserves energy and reduces environmental impact. PCPPS uses information
    that is distributed by an IGP. This document specifies the IS-IS encoding for
    that information.</p>"

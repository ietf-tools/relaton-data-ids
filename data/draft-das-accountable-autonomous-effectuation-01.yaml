abstract:
- content: '<p>Artificial intelligence and autonomous systems are increasingly moving
    from generating information to initiating actions that directly affect data, services,
    networks, infrastructure, and physical systems. At the opening of the General
    Debate of the 81st Session of the United Nations General Assembly, UN Secretary-General
    Antonio Guterres warned of "technology without accountability," describing the
    concern further as "capability without oversight" and "decision-making without
    transparency," and called for cooperation on AI safety risks, testing, evaluation,
    transparency, and common safeguards. This document examines that problem from
    governance intent to consequence-edge verification protocols: the corresponding
    technical question is how can accountability remain enforceable at the moment
    a machine-generated decision becomes an externally consequential action? It defines
    an effectuation-boundary problem in which a proposed action may be correctly authenticated
    and authorized upstream, yet the operation ultimately presented for execution
    may differ because of substitution, redirection, replay, stale authority, changed
    state, compromised intermediaries, or other causes. An execution-finality architecture
    is presented as one possible technical response. A proposed operation remains
    non-effective until applicable authority and protected-state conditions are satisfied,
    and the component controlling the external consequence verifies that the operation
    actually presented for effectuation corresponds to currently valid authority.
    This document does not define AI governance policy, and it does not imply endorsement
    of this architecture by the United Nations or any other institution. It is intended
    to solicit IETF discussion about whether effectuation-boundary accountability
    constitutes an interoperability or protocol requirement, which existing mechanisms
    can provide the required properties, and whether any additional standardization
    is necessary.</p>'

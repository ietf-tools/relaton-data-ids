abstract:
- content: "<p>Operators of regulated, sovereign, and high-assurance deployments require
    hardware-rooted, machine-verifiable proof that a workload executes in its approved
    environment. Current remote attestation mechanisms address two relevant properties
    in isolation: platform integrity — that the hardware and software stack are in
    an approved, untampered state — and physical residency — that the hardware resides
    within an approved geographic boundary. Neither property alone is sufficient:
    integrity without residency permits a valid platform to operate outside approved
    boundaries; residency without integrity permits a compromised platform to claim
    valid placement. This document defines the *Verifiable Proof of Environment Attestation
    Profile (V-PEA)*, a profile of the RATS Architecture (RFC 9334) in which a platform
    binds location Claims to its own integrity Evidence in a single Evidence structure
    (lah-bundle) signed by a TPM quote. V-PEA does not generate location Claims: they
    are produced by location sources, such as GNSS receivers, mobile network operators,
    or timing-based anchors, and V-PEA binds them to the particular platform that
    will receive a credential or key. V-PEA defines two Evidence dimensions: *WHAT*
    — hardware provenance (TPM Attestation Key registered and manufacturer-endorsed),
    platform integrity (firmware and OS state matching reference values), and workload
    agent software integrity (binary digest matching an approved value); and *WHERE*
    — physical residency within an approved geographic boundary, as reported by one
    or more location sources. A single TPM quote binds WHAT and WHERE into one signed
    statement: neither dimension can be forged or transplanted without invalidating
    the other. This document specifies the binding for TPM 2.0; the binding does not
    depend on a TPM, and other platform roots of trust can provide it. For the WHERE
    dimension, V-PEA supports Transparent Zero-Knowledge Proofs (ZKPs), enabling an
    Attester to prove geographic compliance without disclosing precise coordinates.
    A positive V-PEA Attestation Result enables a Relying Party to issue hardware-rooted
    credentials or authorize operations — combining verified execution environment
    (WHAT) with verified physical placement (WHERE) — before releasing sensitive assets
    or granting access. Integration with workload identity systems is described in
    the WIMSE Integration appendix.</p>"

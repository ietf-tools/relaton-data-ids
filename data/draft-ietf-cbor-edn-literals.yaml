abstract:
- content: "<p>This document formalizes and consolidates the definition of the Concise
    Diagnostic Notation (CDN) of the Concise Binary Object Representation (CBOR),
    addressing implementer experience. Replacing CDN's previous informal descriptions,
    it updates RFC 8949, obsoleting its Section 8, and RFC 8610, obsoleting its Appendix
    G. It also specifies registry-based extension points and uses them to support
    text representations such as of epoch-based dates/times and of IP addresses and
    prefixes. // (This cref will be removed by the RFC editor:) This revision -28
    // attempts to reflect various feature removals that have been // discussed on
    the mailing list, as a delta to -27. Note that, with // the focus on the delta,
    this text is necessary somewhat // inconsistent. The chairs decided not to include
    further editorial // improvements that could achieve a greater degree of consistency.
    // The text may be misleading as some of the explanatory sections no // longer
    fully reflect the technical content. The text also does // not have WG input yet
    on any renaming decisions (CDN name, b1/t1 // name).</p>"
  language:
  - en
  script:
  - Latn
  format: text/html

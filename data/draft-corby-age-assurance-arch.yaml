abstract:
- content: "<p>This document describes a technology-neutral architecture for age assurance
    on the Internet, drawing on the framework established by ISO/IEC 27566-1 and the
    levels of assurance defined in IEEE 2089.1. It sets out the methods of age assurance
    (verification, estimation and inference), how their performance is measured and
    assured, the roles and trust relationships involved, and how results can be reused
    across services without creating persistent identifiers. Its main contribution
    is a model for communicating trustworthy, privacy- preserving age assertions between
    independently governed systems. It treats assurance, privacy, interoperability,
    resistance to circumvention and inclusion as measurable properties of complete
    age assurance systems, and distinguishes the capabilities of existing technical
    components from the additional safeguards necessary for secure and privacy-preserving
    deployment. It is neutral on whether age restrictions should exist, at what ages
    and for which services, which are policy questions outside its scope; it is not
    neutral about how safely and privately such restrictions are implemented where
    they do exist.</p>"

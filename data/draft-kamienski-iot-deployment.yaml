abstract:
- content: "<p>Smart applications increasingly depend on the Internet of Things (IoT)
    and distributed computing environments spanning constrained devices, edge nodes,
    cloudlets, and cloud infrastructure, collectively known as the edge–cloud, or
    computing continuum. This document uses the term IoT computing continuum to highlight
    the importance of IoT-specific constraints and requirements within this broader
    context. Although prior work has addressed communication aspects and edge functions
    in these environments, as noted in RFC 9556 and comprehensive surveys of the computing
    continuum, there has been comparatively less focus on application-centric issues
    such as deployment, placement, and lifecycle management. This document identifies
    key challenges and conceptual considerations for deploying smart applications
    across the IoT computing continuum, aiming to provide a unified architectural
    perspective and vocabulary to guide ongoing research within the IRTF and inform
    future standardization initiatives.</p>"

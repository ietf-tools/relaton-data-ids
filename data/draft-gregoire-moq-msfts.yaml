abstract:
- content: <p>This document extends the MOQT Streaming Format (MSF) catalog by defining
    the "mpeg2ts" packaging value for carrying MPEG-2 Transport Stream and M2TS source
    packets over MOQT. It defines catalog- extension fields for transport-stream track
    description and specifies subscriber behavior for joining, switching, and validating
    packetized streams.</p>

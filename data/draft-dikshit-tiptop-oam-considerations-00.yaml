abstract:
- content: "<p>[I-D.ietf-tiptop-usecase] and [I-D.ietf-tiptop-ip-architecture] describe
    key characteristics, use cases, requirements, and an IP architecture for deep-space
    (lunar, Mars, and beyond) surface and orbital-relay networking, characterized
    by long, variable, asymmetric propagation delay (single-digit to tens of minutes
    one-way), scheduled/intermittent connectivity windows, and severely constrained
    link capacity. Neither document currently addresses Operations, Administration,
    and Maintenance (OAM): fault detection, performance measurement, and reachability
    verification. This document identifies why conventional terrestrial OAM techniques
    (active round-trip probing such as ICMP Echo, BFD, or TWAMP; assumption of continuous
    connectivity) do not transfer directly to this environment, and proposes candidate
    adapted approaches -- passive, store-and-forward telemetry batched to contact
    windows; on-board local health self-diagnosis with delayed reporting; and confidence-interval-based
    reachability assessment in place of binary up/down status -- as a starting point
    for OAM discussion within the TIPTOP working group. This document explicitly does
    not propose use of the Bundle Protocol or DTN architecture, both of which are
    out of scope for TIPTOP per its charter; where CCSDS space-data-system telemetry
    conventions are mentioned, it is as informative background only.</p>"

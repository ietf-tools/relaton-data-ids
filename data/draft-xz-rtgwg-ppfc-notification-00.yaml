abstract:
- content: "<p>This document specifies the notification mechanism for Precise Priority-based
    Flow Control (PPFC), defining the message formats and network actions for communicating
    congestion information among network nodes. The PPFC notification enables rapid
    congestion signaling, allowing per-flow flow control for traffic from source.</p>"

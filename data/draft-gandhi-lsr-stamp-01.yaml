abstract:
- content: "<p>The Simple Two-Way Active Measurement Protocol (STAMP), as defined
    in RFC 8762, can be utilized for active measurement without relying on a control
    channel to pre-signal session parameters. This document defines extensions to
    IS-IS, OSPF, BGP-LS, and BGP to advertise information for discovering STAMP Session-Reflectors
    in a network. The advertised information can be used by STAMP senders to set up
    appropriate performance measurement sessions for delay and packet loss metrics.</p>"

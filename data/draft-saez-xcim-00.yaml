abstract:
- content: "<p>XCIM specifies experimental evidence linking purpose-specific communication
    authorization to an application, an original email recipient, and message content.
    A signed receipt records an issuer's observation of consent; a receiver also verifies
    current permission, signing authority, freshness, authenticated publication, and
    DKIM. The minimum direct-email profile uses one recipient and purpose per message
    copy, issuer-signed recipient binding, and application- authorized message signatures.
    This document defines a bounded experimental integration and identifies unresolved
    lifecycle, history-continuity, and registration questions. It does not establish
    the truth of an issuer's consent observation or claim production readiness.</p>"

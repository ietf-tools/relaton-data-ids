abstract:
- content: <p>This document describes the changes between Unicode 12.0.0 and Unicode
    18.0.0 in the context of IDNA2008. Some additions and changes have been made in
    the Unicode Standard that affect the values produced by the algorithm IDNA2008
    specifies. The review assigns the derived property value "UNDER REVIEW" to certain
    code points. This is added as exceptions to the algorithm for IDNA2008 that allows
    adding exceptions to the algorithm for backward compatibility exceptions. This
    document provides the necessary tables to IANA to make its database consistent
    with Unicode 18.0.0. This version of this document is based on pre-release data.
    Unicode 18.0.0 has not been released, and every figure here that concerns it is
    provisional and must be regenerated against the released files. See the note at
    the top of this document. All values in this document are computed from the Unicode
    Character Database files listed in Appendix H, by applying the algorithm in RFC
    5892 Section 3 directly to those files. No derived property table produced by
    anyone else is used as input. Section 3 describes the derivation and Appendix
    G compares the result with the derivation published by the Unicode Consortium.</p>

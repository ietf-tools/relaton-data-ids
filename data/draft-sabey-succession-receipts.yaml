abstract:
- content: "<p>Autonomous agents are upgraded, replaced, suspended, and restored while
    holding real operational authority. A Succession Receipt is a portable, signed
    JSON document that proves one completed, policy- gated transfer of authority between
    two agents: which agent held the authority, which agent holds it now, under what
    legitimacy determination the transfer ran, and which obligations carried forward,
    with every claim grounded in signed evidence events embedded in the receipt itself.
    Receipts are verifiable offline by parties who do not operate the issuing system,
    using only the issuer's public key. This document specifies the receipt wire format,
    its canonicalization and signature scheme (JSON Canonicalization Scheme with Ed25519),
    and the verification algorithm, including bidirectional claim grounding. Where
    decision receipts prove what an agent did, and delegation receipts prove what
    an agent may do, Succession Receipts prove that an agent legitimately became the
    holder of an authority.</p>"

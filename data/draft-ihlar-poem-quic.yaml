abstract:
- content: "<p>This document defines the Periodic On-path Explicit Measurement (POEM)
    protocol, which enables passive on-path measurement of packet loss for QUIC flows.
    POEM uses periodic marker packets, coalesced with ordinary QUIC packets, that
    allow on-path network elements to measure upstream packet loss by counting packets
    between markers. Marker packets also carry a sender-reported loss count, enabling
    observers to distinguish upstream from downstream loss. Additionally, POEM defines
    a report mechanism through which network elements communicate measurement results
    back to endpoints.</p>"

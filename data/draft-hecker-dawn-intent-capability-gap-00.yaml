abstract:
- content: "<p>DAWN defines discovery as an initial step that returns minimum discoverable
    information (MDI) about entities. Clients, however, usually start from an intent,
    not from a name or a capability, and the capabilities needed to satisfy an intent
    depend on what is available. A client therefore has to know what is on offer to
    decide what to look for, and has to decide what to look for to learn what is on
    offer. This document describes that circular dependency, locates it in the current
    DAWN documents, compares five strategies for handling it, and lists questions
    for the Architecture work. The main question is what the MDI must contain for
    a client to act without a pre-agreed capability vocabulary. This document proposes
    no protocol.</p>"

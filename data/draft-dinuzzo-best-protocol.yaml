abstract:
- content: '<p>The Behavioral State Protocol (BEST) defines a discovery-first, behaviour-oriented
    interaction surface for domain services: the commands a service accepts, the events
    it publishes, and optionally the queries it answers and the multi-step recipes
    (workflows) it publishes. Services are named by DNS domain names and self-describe
    through a manifest at the well-known URI "/.well-known/best"; messages use a conformant
    profile of the CloudEvents 1.0 envelope described by JSON Schema; and an agent
    obtains its own credential through the OAuth 2.0 Device Authorization Grant, approved
    by the person it acts for in their own browser. BEST deliberately specifies only
    the interaction surface -- never a service''s internal architecture, storage,
    or execution model -- allowing independent implementations across any runtime,
    language, or transport to interoperate without bespoke integration.</p>'

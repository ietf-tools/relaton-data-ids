abstract:
- content: "<p>This document specifies version 3 of the Homing Pigeon message protocol.
    Version 3 is a transport extension to version 1, not a replacement for it: every
    version 1 message keeps its meaning, the version 1 job acceptance gate is unchanged,
    and version 3 changes exactly one thing -- the carriage of the version 1 DTLS
    session profile. Version 1 defines a DTLS 1.3 session profile: one cipher suite,
    a pre-shared key taken from the protocol's shared secret, ephemeral Diffie-Hellman
    on every handshake, and the platform_info disclosure carried in the server's EncryptedExtensions.
    Version 1 binds that profile to a live datagram path. This document binds the
    same profile to the email binding: handshake flights and protected records are
    carried as email messages over the store-and-forward mailbox, so a session can
    be opened by an email, completed over further emails, and then carry jobs and
    results inside it, with the perfect forward secrecy of the version 1 profile intact
    on a carrier that has no live path at all. The objects carried inside the session
    remain version 1 objects: a job or a result inside a session is the version 1
    object, unchanged, carrying the version value version 1 defines. The 3 of this
    document's title numbers this document and its carriage; it is not a value of
    any object's version field, and nothing in this document mints a version 3 object.
    HP-DTLS/3, the frame header this document defines, is a carriage label whose digit
    is the carriage generation, not a protocol version. This document is a local,
    unsubmitted draft. It has not been posted to the Internet-Drafts directory, and
    it requests no IANA action.</p>"

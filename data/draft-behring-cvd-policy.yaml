abstract:
- content: "<p>This document defines a JSON format for machine-readable Coordinated
    Vulnerability Disclosure (CVD) policies. It also defines the proposed CVD-Policy
    field for discovery through security.txt and requests registration of the application/cvd-policy+json
    media type. The format complements security.txt and human-readable policy documents.
    A policy does not prove ownership and does not establish legal authorization to
    test, legal safe harbor, or the safety of an activity.</p>"

abstract:
- content: '<p>[RFC8584] defines Highest Random Weight (HRW) as the algorithm for
    Designated Forwarder election in EVPN, and, in Section 3.1, names the Consistent
    Hashing family of algorithms as addressing the same object-to-server mapping problem
    before explicitly declining to evaluate them: "these will not be considered here."
    [I-D.ietf-bess-evpn-per-mcast-flow-df-election] subsequently introduces a scope
    transition, from per-(ES,VLAN) to per- (ES,VLAN,S,G) election, that is precisely
    a key-space-resizing event of the kind Consistent Hashing was designed to bound
    churn for. This document proposes the applicability analysis RFC 8584 declined
    to make: it defines a DF-churn metric, states HRW''s and Consistent Hashing''s
    known theoretical guarantees against it, and sets out an evaluation methodology,
    using bounded-load Consistent Hashing as the specific comparison point, given
    multicast group popularity is known to be highly non-uniform in deployed networks.</p>'

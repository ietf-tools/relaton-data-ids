schema-version: v1.2.3
id: draft-ietf-ippm-stamp-ext-hdr
title:
- content: Simple Two-Way Active Measurement Protocol (STAMP) Extensions for Reflecting
    STAMP Packet IP Headers
  language:
  - en
  script:
  - Latn
  format: text/plain
docid:
- id: draft-ietf-ippm-stamp-ext-hdr
  type: Internet-Draft
  primary: true
abstract:
- content: "<p>The Simple Two-Way Active Measurement Protocol (STAMP) and its optional
    extensions can be used for Edge-to-Edge (E2E) active measurements. In Situ Operations,
    Administration, and Maintenance (IOAM) data fields can be used for recording and
    collecting hop-by- hop and E2E operational and telemetry information. This document
    extends STAMP to reflect IPv4/IPv6 headers as well as IPv6 extension headers for
    hop-by-hop and E2E active measurements, for example, using the IOAM data fields.
    This document updates RFC 8762 by specifying IPv4/IPv6 and UDP headers handling,
    UDP checksum handling, session state notifications, and rate limiting requirements
    that also apply to STAMP sessions not using these extensions.</p>"
  language:
  - en
  script:
  - Latn
  format: text/html

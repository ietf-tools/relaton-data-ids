abstract:
- content: "<p>This document discusses the continued appearance of the phrase “All
    Rights Reserved” in IETF Trust copyright notices, despite the phrase no longer
    being required for copyright protection in many jurisdictions. It asks whether
    the phrase serves a present legal or operational purpose in IETF documents, or
    whether it should be removed or replaced.</p>"

abstract:
- content: "<p>This document defines the OTP-Token email header field, which can be
    used to deliver One-Time Passcodes (OTP) in a machine-readable and origin-bound
    manner alongside the human-readable message carrying that content today. Recipient
    Message User Agents (rMUA) can collaborate with other entities in the ecosystem
    to assist in the delivery of these codes to the context which wishes to verify
    their successful delivery.</p>"

abstract:
- content: "<p>This design note proposes an overlay for Human and Agent participation
    in existing Task and Action protocols. It separates the responsible Participant
    from the authenticated Actor, records Human interactions, excludes Humans from
    Agent discovery, and binds each change to its authorized request. It specifies
    no wire protocol and does not treat Humans as Agents.</p>"

abstract:
- content: "<p>This document describes an Agentic Experience Quality (AEQ)-driven
    semantic transport control framework for real-time video agents using visual tokens.
    The framework assesses the semantic utility of each visual token by jointly considering
    its spatial salience and temporal novelty. The AEQ model combines cumulative semantic
    utility with a normalized transmission-delay cost. Frame-level selection plans
    the initial token set, while packet-level control continuously adjusts the number
    of tokens to transmit to maximize predicted AEQ under current network conditions.
    This document specifies requirements for semantic assessment, transmission modeling,
    two-level control, and transport feedback.</p>"

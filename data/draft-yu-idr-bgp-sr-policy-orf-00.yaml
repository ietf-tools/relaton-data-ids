abstract:
- content: "<p>The BGP SR Policy address family defines a mechanism to distribute
    Segment Routing (SR) policies from a centralized controller to head- end routers.
    However, pre-provisioning all candidate SR Policies across massive-scale networks
    impose significant control-plane memory and processing overhead on edge nodes.
    This document specifies an extension to the BGP Outbound Route Filtering (ORF)
    capability, leveraging the framework defined in RFC 5291. It introduces a new
    SR Policy Tuple ORF type that allows a head-end router to precisely request or
    subscribe to specific SR Policies based on a Color and Endpoint tuple, enabling
    pure on-demand, pull-based policy distribution.</p>"

abstract:
- content: "<p>This document defines extensions to In Situ Operations, Administration,
    and Maintenance (IOAM) that enable IOAM nodes to compute on-path delay samples.
    These samples are the basis for the on-path delay statistics that can be exported
    using the IP Flow Information Export (IPFIX) Information Elements defined in RFC
    9951. The document defines an On-Path Delay IOAM data field and extends the IOAM
    Direct Export (DEX) Option-Type with a timestamp reference inserted by the IOAM
    encapsulating node. These extensions enable transit and decapsulating nodes to
    compute and locally aggregate on- path delay. The resulting on-path delay can
    then be made available by different mechanisms, for example IPFIX export or the
    YANG data model for on-path telemetry.</p>"

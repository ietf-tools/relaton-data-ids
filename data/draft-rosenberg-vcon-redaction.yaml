abstract:
- content: "<p>The Virtualized Conversations (VCON) specification defines a standardized
    object format for representing multimedia conversations between users and AI agents.
    Recent work has expanded VCON to enable it to been used to capture sessions with
    AI Agents as well, including tool calls, reasoning steps, model configuration
    and more. This has also expanded the set of use cases and requirements for redaction
    of sensitive information from a VCON. This document outlines use cases and requirements
    for redaction in VCONs. This document is meant for discusssion purposes. All of
    this document was written by the author and not by an LLM.</p>"

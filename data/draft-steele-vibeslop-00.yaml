abstract:
- content: "<p>AI Agents have transformed the way internet applications are developed
    and have introduced a new set of challenges for organizations. This document describes
    techniques and concepts that are emerging to assist with these challenges, and
    relates them to concepts already familiar to the internet community. The pace
    of change in this area is accelerating, and it is anticipated that much of what
    this document discusses will become outdated quickly; nevertheless, a static publication
    may prove amusing to future readers, whether machine or human.</p>"

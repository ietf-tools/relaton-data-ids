abstract:
- content: "<p>This document defines a text notation for representing Constrained
    Application Protocol (CoAP) request/response exchanges in Internet- Drafts and
    RFCs. The notation balances human readability with mechanical validation: a reader
    can follow an exchange at a glance, and tooling can be built to parse the message
    structure and check each payload against its declared content format. The notation
    is application-layer by default, with message-layer detail added only where an
    example depends on it. It is a recommended convention for use in documents and
    with authoring tools such as kramdown-rfc, not a conformance target; it does not
    change CoAP or any on-the-wire encoding.</p>"

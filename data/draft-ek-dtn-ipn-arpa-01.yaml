abstract:
- content: "<p>This document requests the creation of ipn.arpa, an infrastructure
    DNS namespace for the IPN node identifiers used by the Bundle Protocol (BP). Each
    Fully Qualified Node Number has a canonical name of the form N.A.ipn.arpa, where
    A is the Allocator Identifier and N is the Node Number. A BP Agent can query directly
    beneath that name for records specified by a convergence-layer discovery binding,
    such as SRV or SVCB records. The DNS records identify convergence-layer endpoints
    advertised for reaching a destination, including relays.</p>"

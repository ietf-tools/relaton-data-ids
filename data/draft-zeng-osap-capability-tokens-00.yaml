abstract:
- content: "<p>This document defines a signed capability token format for delegating
    authority between agents on a single local system. A token binds a subject, an
    audience, a task, a set of actions and resources, and a validity window. Tokens
    can only be attenuated: a child token is a subset of its parent. The document
    specifies attenuation rules, binding checks, revocation semantics, and the interaction
    with consent receipts. It does not define a transport, a discovery protocol, or
    an agent runtime.</p>"

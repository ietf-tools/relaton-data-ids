- content: "<p>This document specifies the Merkle tree construction and anchoring
    protocol used by the Proof of Sovereign Integrity (PSI) system for tamper-evident
    content verification. It defines tree parameters, leaf construction, inclusion
    proof generation, and root anchoring to public ledgers including the Bitcoin blockchain.
    The protocol uses SHA-256 as the hash function, binary Merkle trees with height=5
    (32 leaves per epoch), and deterministic leaf ordering to enable third- party
    v</p>"

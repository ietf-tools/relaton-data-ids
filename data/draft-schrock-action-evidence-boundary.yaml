abstract:
- content: "<p>Consequential agent actions can cross identity, transport, authorization,
    policy, and execution systems. Each system can produce a valid artifact while
    the executor still lacks a safe rule for joining the artifacts to the exact effect,
    consuming one-time authority, and handling an uncertain outcome. This document
    defines the Action Evidence Boundary (AEB), an executor-side processing model
    for that lifecycle. AEB requires native artifact verification, Canonical Action
    Identifier (CAID) matching, Authorization Evidence Chain (AEC) satisfaction, a
    separate local authorization decision, durable atomic consumption or reservation,
    invocation, closed effect outcomes, and authenticated reconciliation. It defines
    no receipt or token format, no policy language, no universal evidence taxonomy,
    and no new registry. Native workload credentials, message signatures, attested
    per-action tokens, permit records, authorization receipts, and status mechanisms
    retain their own semantics and verifiers.</p>"

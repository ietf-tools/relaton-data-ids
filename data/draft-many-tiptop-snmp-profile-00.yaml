abstract:
- content: "<p>Deep space communications involve long delays (e.g., Earth to Mars
    one-way delay is 4-24 minutes) and intermittent communications, because of orbital
    dynamics. This document defines an SNMP profile for deep space. The profile states,
    for each SNMP version and security model, what must be configured, provisioned,
    or changed, and maps their applicability to the deep space connectivity scenarios.</p>"

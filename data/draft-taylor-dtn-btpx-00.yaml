abstract:
- content: "<p>The Bundle Transfer Protocol - Unidirectional (BTPU) provides for the
    transfer of large binary objects, typically Bundle Protocol version 7 bundles,
    over a unidirectional, unreliable, frame-based link-layer protocol, and by design
    includes no return path. This document defines the Bundle Transfer Protocol -
    Cross-Link (BTPX), an extension to BTPU for deployments where independent BTPU
    channels exist in both directions between a pair of nodes. It defines how a Transfer
    or a Bundle Message on one channel is referenced from another, and a first application
    of such references, the Transfer Status Message, which allows a receiver to indicate
    to a sender that continued transfer of an object is unnecessary, and why. This
    document defines no segment-level acknowledgement or retransmission semantics;
    such mechanisms are deferred to future documents.</p>"

abstract:
- content: "<p>RFC 9942 defines COSE Receipts and registers one verifiable data structure,
    RFC9162_SHA256, the binary Merkle tree of RFC 9162 instantiated with SHA-256.
    This document registers two more: RFC9162_SHA384 and RFC9162_SHA512, the same
    tree instantiated with SHA-384 and SHA-512, each with its inclusion and consistency
    proof types. The tree construction, proof formats, and verification algorithms
    are unchanged apart from the hash function and the resulting digest size.</p>"

abstract:
- content: "<p>This document defines the problem space for network resilience. It
    identifies representative failure sources that expose limitations in current network
    architectures when facing complex, cascading, correlated, and unanticipated failures.
    It further analyzes cross- cutting resilience challenges and capability gaps across
    the pre- event, in-event, and post-event stages of the failure lifecycle, and
    derives a set of technical capabilities needed to improve network resilience.</p>"

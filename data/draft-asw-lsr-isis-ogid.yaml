abstract:
- content: "<p>This document introduces a new top-level TLV in IS-IS, the Originating
    Generation Identifier (OGID) TLV, which is carried in every Link State PDU (LSP)
    fragment originated by a node. The OGID identifies the logical transaction to
    which a set of LSP fragment updates belongs. When accompanied by a Fragment Count
    greater than one, it additionally allows a receiving node to determine when all
    fragments participating in that transaction have been received. This enables receivers
    to process multi-fragment updates atomically, avoiding the transient Link State
    Database (LSDB) inconsistencies that can otherwise occur when logically related
    LSP fragment updates are flooded and processed independently.</p>"

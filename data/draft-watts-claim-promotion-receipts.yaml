abstract:
- content: "<p>This document defines a protocol-neutral receipt for explicit promotion
    across evidence and claim-authority boundaries. It is designed to prevent raw
    observations, model outputs, or unreviewed evidence from being silently retyped
    as authorization-bearing state. Archive Status This RFCXML source is an archive
    working draft and is not represented as submitted, adopted, or endorsed by the
    IETF.</p>"

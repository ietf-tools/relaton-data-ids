abstract:
- content: "<p>Neural AI systems -- large language models, vision-language models,
    and other learned decision systems -- now move directly from computation to consequence.
    A model output becomes a tool call; a tool call becomes an API transaction, memory
    write, payment, file mutation, browser action, or actuator signal; an agent delegates
    to another agent. Successful inference, sandbox containment, connector allowlisting,
    session permission, or upstream model approval does not by itself establish authority
    for that particular real-world consequence. A model may be authorized to compute
    while remaining unauthorized to act. This document specifies a hardware-rooted
    execution-finality architecture for neural and agentic systems. A proposed consequence-
    bearing operation is represented as a Candidate Act and held in a Non-Effective
    State until a Protected Enforcement Domain validates act-specific predicates and
    an independent Finality Sink verifies scoped, non-bearer finality authority immediately
    before the operation becomes externally effective. If that authority is absent,
    stale, replayed, revoked, or mismatched to the act being attempted, the Candidate
    Act remains non-effective and the operation fails closed. The architecture is
    model- and vendor-neutral. It is written for the industrial surfaces that now
    dominate production agent deployments: Model Context Protocol (MCP) tool dispatch,
    computer use, code execution, enterprise connectors, memory and knowledge-store
    writes, GPU and confidential-computing egress, and settlement. The same invariant
    applies to those surfaces: computation is not authority; tool selection is not
    tool-effectuation; a connector allowlist is not per-act finality.</p>"
  language:

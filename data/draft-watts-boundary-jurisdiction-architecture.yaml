abstract:
- content: "<p>This document describes a protocol-neutral architecture for separating
    possession of capability from jurisdiction over consequential authority boundaries.
    It models authority as reachability in a time-indexed capability graph, defines
    revocation cuts, and specifies fail-closed semantics for delegation and revocation
    closure.</p>"

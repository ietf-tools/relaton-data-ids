abstract:
- content: "<p>This document defines the DigitalID specification for the Secured Digital
    Lifecycle Protocol (SDLP). The DigitalID is the foundational identity construct
    for all SDLP objects, providing deterministic uniqueness, lineage preservation,
    collision elimination, and tamper-evident integrity. This document describes the
    DigitalID structure, assignment rules, lineage model, comparison rules, and integrity
    requirements.</p>"

abstract:
- content: "<p>This document describes a framework and a YANG data model for the Northbound
    Task Interface (NTI) of a Network Management Agent (NMA). The NTI is a logical
    northbound interface through which upper-layer consumers, including OSS/BSS, orchestrators,
    management applications, and other agents, can submit network management tasks
    to an NMA and obtain task processing results. This document specifies a YANG-based
    realization of the NTI, including operational state data, RPC operations, and
    notifications for capability discovery, intent submission, task lifecycle management,
    execution plan exposure, confirmation handling, and result reporting. The model
    is intended to reuse existing IETF network management models for domain-specific
    information. The NTI does not mandate a dedicated communication protocol. NETCONF
    and RESTCONF can be used for the YANG-based realization, while A2A- based mechanisms
    may also be used to realize NTI interactions. This document does not define or
    extend generic agent interaction protocols.</p>"

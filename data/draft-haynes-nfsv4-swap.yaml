id: draft-haynes-nfsv4-swap
title:
- content: Adding an Atomic EXCHANGE_RANGE Operation to NFSv4.2
  language:
  - en
  script:
  - Latn
  format: text/plain
docid:
- id: draft-haynes-nfsv4-swap
  type: Internet-Draft
  primary: true
abstract:
- content: <p>The Network File System version 4.2 (NFSv4.2) does not provide support
    for atomic multi-block updates to file data. This document introduces a new EXCHANGE_RANGE
    operation which provides for such atomic updates. This document extends NFSv4.2
    (see RFC7862). About This Document This note is to be removed before publishing
    as an RFC. The latest revision of this draft can be found at https://ietf-wg-
    nfsv4.github.io/exchange_range/draft-haynes-nfsv4-swap.html. Status information
    for this document may be found at https://datatracker.ietf.org/doc/draft-haynes-nfsv4-swap/.
    Discussion of this document takes place on the Network File System Version 4 Working
    Group mailing list (mailto:nfsv4@ietf.org), which is archived at https://mailarchive.ietf.org/arch/browse/nfsv4/.
    Subscribe at https://www.ietf.org/mailman/listinfo/nfsv4/. Source for this draft
    and an issue tracker can be found at https://github.com/ietf-wg-nfsv4/exchange_range.
    Note to Readers This is an individual submission and does not reflect Working
    Group consensus. The "About This Document" section above has the current discussion
    venue, latest rendering, and source location.</p>

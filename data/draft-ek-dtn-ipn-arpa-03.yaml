abstract:
- content: "<p>This document requests the creation of ipn.arpa, an infrastructure
    DNS namespace for the Bundle Protocol (BP). It maps a Fully Qualified Node Number
    to the DNS base name N.A.ipn.arpa., where N is the Node Number and A is the Allocator
    Identifier. A BP Agent can use that name to discover a convergence-layer endpoint
    at the destination or at a relay. This document specifies an SRV binding for version
    4 of the TCP Convergence-Layer Protocol (TCPCLv4).</p>"

abstract:
- content: <p>This document defines the "pay" Uniform Resource Identifier (URI) scheme,
    a rail-neutral, human- and agent-friendly name for a payment payee that resolves,
    through a resolution protocol, to one or more concrete payment endpoints. Unlike
    a URI that names a specific account on a specific payment method, a "pay" URI
    names a payee independently of any settlement rail; a resolver deterministically
    maps the name to the rail(s), endpoint(s), and metadata a payer needs to construct
    a payment. This document specifies the scheme syntax and semantics, the resolution
    mechanism and its discovery, the deterministic resolution property, and requests
    provisional registration of the scheme with IANA per RFC 7595. It does not define
    a settlement protocol and takes no custody of funds; it composes with agent-payment
    protocols such as x402 for the actual money movement.</p>

abstract:
- content: "<p>This document describes how independently operated capability indexes
    discover each other by following discovery documents, how a reading index identifies
    itself to the index it reads, and an admission model that distinguishes a peer
    that is known from a peer whose catalogue is indexed. It also describes how an
    index can preview a peer's catalogue before admitting it. Payment, identity, reputation
    and invocation are out of scope. The document is intended as input to the DAWN
    gap analysis on federation between directories.</p>"

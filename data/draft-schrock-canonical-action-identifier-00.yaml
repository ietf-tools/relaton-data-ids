abstract:
- content: "<p>Authorization, delegation, execution, and audit artifacts often identify
    an action using format-local content and digests. Those digests are not directly
    comparable when the formats select or encode material action fields differently.
    This document defines the Canonical Action IDentifier (CAID): a typed action object,
    a canonicalization and digest suite, a compact identifier string, and immutable
    action-type definitions with required material fields. It also defines an Action-Mapping
    Profile for projecting independently verified native artifacts into a common action
    type, with the closed results EQUIVALENT_UNDER_PROFILE, NOT_EQUIVALENT, and INDETERMINATE.
    CAID carries no trust semantics. It does not establish identity, authority, authorization,
    execution, safety, or legal reliance.</p>"

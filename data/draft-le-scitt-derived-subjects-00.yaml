abstract:
- content: "<p>The Supply Chain Integrity, Transparency, and Trust (SCITT) architecture
    permits distinct Issuers to agree on the same CBOR Web Token (CWT) Subject Claim
    (sub) value for a common Subject. This document specifies one profile by which
    those Issuers can independently compute that common value from the same application-
    defined Subject semantics without relying on a shared assigning authority. A surrounding
    application maps its Subject description to an admitted structured Value. This
    profile defines an exact deterministic binding encoding, SHA-256 derivation, a
    text representation, and verification requirements for deriving sub from that
    Value. Optional JSON and Concise Binary Object Representation (CBOR) forms are
    provided for exchanging an admitted Value; they are not SCITT Statement payload
    formats. The SCITT Statement payload, signature, Registration, Receipt, Transparency
    Service state, and Issuer identity are not implicit inputs to Subject derivation.</p>"

abstract:
- content: <p>This document defines the terminology regarding the usage of expressions
    such as "IPv6-Only" and "IPv6-Mostly", in order to avoid confusions when using
    them in IETF and other documents. In particular, a goal is to provide a reference
    that describes the actual "IPv6-Only" functionality being used in a given scope,
    not the installed protocol stack support.</p>

abstract:
- content: "<p>This document defines a mechanism for temporal anchoring of digital
    artifacts by committing cryptographic hashes to the Bitcoin blockchain via the
    OpenTimestamps protocol. The resulting proof is independently verifiable by any
    party with access to independently validated Bitcoin chain data, without contacting
    the anchoring service. The SCITT Architecture is used as the primary integration
    example. No changes to the SCITT architecture are required.</p>"

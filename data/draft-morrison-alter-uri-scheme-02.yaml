abstract:
- content: "<p>This document defines the alter URI scheme as a dispatchable reference
    syntax for ~handle identity references published under the DNS substrate defined
    in [MCPDNS]. An alter: URI binds a textual ~handle reference to a resolution and
    verification procedure that retrieves the handle's envelope from the publishing
    zone, validates the envelope's signature chain, and dispatches the result to an
    operating-system URI handler. The reference may be scoped to an organisation,
    narrowed to a named facet of the identity, and addressed to a typed action surface.
    The scheme is the addressing form of the ~handle@org:facet/action reference; its
    resolution semantics are those of [MCPDNS], reused without modification. The scheme
    is provider-neutral, introduces no new cryptographic primitive, and reuses the
    resolution and verification procedures of [MCPDNS] without modification. The principal
    contribution is a single, self-verifying dispatch surface for handle-typed references:
    clicking, typing, or scanning an alter: URI yields a verified handle resolution
    rather than a free-text string or an unauthenticated fetch, and where an action
    is addressed it yields a verify-before- side-effect dispatch. This document requests
    provisional registration of the alter scheme with IANA per [RFC7595] Section 3.</p>"

abstract:
- content: "<p>This document defines an optional Agent Enrollment Protocol (AEP) extension
    for discovering and reading Service documents and acknowledging required documents
    during enrollment. Documents have Service-scoped identifiers, web representations,
    and optional portable structured content. Acknowledgements identify documents,
    not immutable content versions. Services determine when an existing enrollment
    needs further acknowledgement.</p>"

abstract:
- content: "<p>Autonomous AI agents and Model Context Protocol (MCP) servers frequently
    execute over local standard input/output (stdio) pipes outside enterprise network
    inspection perimeters. Naive redaction of sensitive credentials with static placeholders
    invalidates downstream Luhn payment card and ISO-7064 IBAN schema validators,
    while raw payload forwarding exposes regulated data. This document specifies the
    Shuliak Isolation Protocol (SIP-1), a deterministic, zero-egress security layer
    combining stateless Format-Preserving Encryption (FF1), Abstract Syntax Tree (AST)
    JSON-RPC payload quarantine, and detached cryptographic schema locks.</p>"

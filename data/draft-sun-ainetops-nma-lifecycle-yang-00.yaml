abstract:
- content: "<p>Network Management Agents (NMAs) deployed in production networks require
    a consistent representation of lifecycle information for admission, operation,
    version replacement, and retirement. This document defines the ietf-nma-lifecycle
    YANG data model, covering basic NMA information and configuration, lifecycle state,
    and event notifications. The model provides a consistent lifecycle data structure
    for NMAs from different vendors.</p>"

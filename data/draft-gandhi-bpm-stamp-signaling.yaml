abstract:
- content: "<p>The Simple Two-Way Active Measurement Protocol (STAMP) specified in
    RFC 8762 supports active measurement of network performance without a control
    channel to pre-signal session parameters. RFC 8972 defines optional extensions
    in the form of Type-Length-Value (TLV) elements for STAMP. This document defines
    a STAMP Type-Length-Value (TLV) that allows a Session-Sender and a Session-Reflector
    to exchange measurement capabilities and configuration parameters in STAMP-Test
    packets. The Session-Sender uses the returned parameters to configure a STAMP
    session.</p>"

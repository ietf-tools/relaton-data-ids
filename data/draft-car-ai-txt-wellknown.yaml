abstract:
- content: '<p>This document requests registration of two Well-Known URIs under the
    "/.well-known/" path: "ai.txt" and "ai.json". These URIs define a structured,
    machine-readable file in which a site operator can declare AI usage preferences
    (training, scraping, indexing, caching), licensing terms, required attribution,
    and per-agent rules. "ai.txt" is positioned as a structured attachment surface
    for AI usage preferences in addition to robots.txt and HTTP-header carriage proposed
    by the IETF AIPREF working group. As the AIPREF vocabulary stabilizes, "ai.txt"
    can carry those preferences in a typed, single- file form alongside the broader
    licensing, attribution, and policy declarations defined in this document. This
    format is complementary to "robots.txt" [ROBOTS]. Where "robots.txt" can block
    crawling entirely, "ai.txt" expresses nuanced policies such as "you may crawl
    but not train on this content" -- a distinction that "robots.txt" alone cannot
    express.</p>'

abstract:
- content: "<p>Existing work helps a relying party determine whether an automated
    client is authorized to initiate a transaction. This document addresses the complementary
    problem: how that client can obtain a verifiable identity statement about the
    merchant that will receive the resulting payment, before the transaction is completed.
    This document defines a Merchant Identity Assertion (MIA): a signed JSON document
    binding a legal entity claim to a domain name. It specifies the claims schema,
    the proof envelope, key discovery via a JSON Web Key Set at a well-known URI,
    third-party issuance with explicit authorization, signing and verification procedures,
    validity and revocation semantics, and an optional signed Evaluation Result Token
    that records the outcome of a verification check as a portable audit artifact.
    This document is informational. It defines a discovery and verification mechanism
    only. It does not define trust scoring, merchant ranking, payment authorization,
    or agent identity. It complements existing agent identity and payment authorization
    protocols without modifying them.</p>"

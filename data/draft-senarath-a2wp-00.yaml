abstract:
- content: "<p>This document defines the Agent-to-Wallet Protocol (A2WP), an interface
    through which a software Agent requests digital credential operations from a Wallet.
    A2WP supports credential acquisition, presentation, and optional queries for authorized
    credential metadata. The Wallet controls credential selection, disclosure, approval,
    and cryptographic execution. A2WP defines an information model, observable operation
    behavior, and an HTTPS binding. Credential formats, Agent identity schemes, delegation
    mechanisms, policy languages, and Wallet internals are outside its scope. External
    credential protocols are integrated through protocol mappings.</p>"

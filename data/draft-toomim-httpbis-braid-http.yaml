abstract:
- content: "<p>HTTP transfers the state of a resource once, and leaves programmers
    to keep it up to date as it changes. Braid-HTTP extends HTTP from *transferring*
    state to *synchronizing* it, with a set of independent extensions, each of which
    addresses a limitation of HTTP on its own. When used together, a website can synchronize
    with any other website's state by its URL, just as a page on today's web can link
    to any other page. This document introduces the extensions, shows how they work
    alone and together, and points to the documents that define them.</p>"

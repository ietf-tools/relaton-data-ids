abstract:
- content: "<p>In Segment Routing (SR) based VPN services, the BGP Color Extended
    Community is used by the egress Provider Edge (PE) router to steer VPN traffic
    into an SR Policy at the ingress PE. In many deployment scenarios, a customer
    requires different Service Level Agreements (SLAs) during different time periods
    of a day. For example, during business hours (e.g., 06:00 to 02:00 the next day)
    a best-effort, lower-cost SLA is sufficient for normal office traffic, while during
    the early morning hours (e.g., 02:00 to 06:00) a high-bandwidth, low-latency SLA
    is required for massive data transmission such as scientific computing. This document
    presents a framework for time-scheduled Color based SR Policy selection. The mechanism
    allows the egress PE to advertise multiple (Color, Color Schedule) pairs for the
    same VPN routes, enabling the ingress PE to select the appropriate SR Policy based
    on the current time. The time-to-Color mapping is configured per VPN instance
    (VRF/VSI), so each customer can have an independent time-varying SLA policy. This
    document is an Informational framework that describes the problem and the overall
    architecture. The advantages of the proposed mechanism and the comparison with
    alternative approaches are provided in Appendix A. The normative specifications
    of the protocol extensions, data models, and other components are described in
    Appendix B.</p>"

abstract:
- content: "<p>Deep space communications involve long delays (e.g., the Earth to Mars
    one-way delay is ~4-20 minutes) and often intermittent communications. In this
    context, the default transport parameters of QUIC stacks, tuned for the terrestrial
    Internet, are not suitable for deep space. This document defines a QUIC profile
    for deep space. It provides guidance on how to estimate and set transport parameters,
    advice to space mission operators and application developers on how to configure
    QUIC for the deep space use case, and guidance to QUIC stack developers on properly
    exposing the required transport parameters in their API.</p>"

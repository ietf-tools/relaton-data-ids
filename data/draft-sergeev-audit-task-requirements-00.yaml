abstract:
- content: "<p>Agent auditing can rely on information produced by users, agents, tools,
    services, policy components, and other systems across multiple administrative
    domains. The evidence needed to answer one auditing question is not necessarily
    the evidence needed to answer another. Successful verification of available evidence
    also does not, by itself, establish that the evidence is applicable or sufficient
    for the question being evaluated. This document describes a representation-independent
    model for stating an Audit Task, alternative evidence requirements for that task,
    expectations about evidence production, and the basis for an audit result. It
    distinguishes verification of evidence from evaluation of the Audit Task, missing
    evidence from a negative observation, and validity of individual records from
    cross-domain sufficiency. It defines no audit record format, verification mechanism,
    authorization model, completeness mechanism, storage protocol, or auditing policy.</p>"

abstract:
- content: "<p>This document defines two types of BMP extended TLV, which are used
    to carry configuration information and configuration effective time related to
    BGP route changes. Through this extension, the BGP monitoring platform can associate
    various BGP events with configuration operations, providing traceable evidence
    for identifying network failures caused by configuration changes.</p>"

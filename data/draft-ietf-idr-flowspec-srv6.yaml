abstract:
- content: "<p>This document specifies extensions to BGP Flow Specification (BGP-FS)
    to enable filtering of IPv6 packets based on the structural components of an SRv6
    Segment Identifier (SID) present in the IPv6 Destination Address (representing
    the active segment of an SRv6 path).</p>"

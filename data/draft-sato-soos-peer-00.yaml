abstract:
- content: "<p>When two independently-principaled AI agents transact with each other,
    each operates under its own mandate root, its own Governed Execution Context (GEC),
    and its own audit chain. No shared kernel exists to mediate the exchange. Existing
    SOOS orchestration primitives (MAD, SACR) govern sub-agent relationships within
    one mandate tree; they do not address the peer case. This document defines the
    PEER protocol: a problem statement and architecture for cross-principal agent
    communication. PEER introduces the PEER Transaction Record (PTR) as a new first-class
    SOOS primitive providing a jointly-derived correlation artifact (ptxn_id) that
    links the two independent audit chains produced by a cross-principal transaction
    -- without requiring a neutral third party, shared kernel state, or cross-principal
    constitutional layer. This document is a problem statement and architecture draft.
    Normative ALE schemas, dispute resolution procedures, and full PTR field specifications
    are deferred to draft-sato-soos-peer-01 (post-Vienna).</p>"

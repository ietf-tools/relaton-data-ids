abstract:
- content: <p>When IEEE 802.1X network access is denied or restricted, clients usually
    show only a generic message such as "Authentication Failed", even when the authentication
    server knows the specific reason. Existing mechanisms either do not reach the
    client (RADIUS Reply- Message), are not protected (EAP Notification), or are not
    designed for presentation to users (the TEAP Error TLV and inner method error
    messages). This document defines an optional extension to Tunnel Extensible Authentication
    Protocol (TEAP) Version 1 (RFC 9930) that allows the EAP server to send a notification
    to the user inside the TEAP TLS tunnel. The peer advertises the reason codes it
    supports and the user's preferred languages in a Notification Capabilities TLV.
    The server sends a reason code, a recommended action, and optional text and remediation
    URI in a User-Notification TLV. The peer can acknowledge it with a Notification-Acknowledgement
    TLV. The extension only provides information and does not change authentication
    results, authorization decisions, or key derivation.</p>

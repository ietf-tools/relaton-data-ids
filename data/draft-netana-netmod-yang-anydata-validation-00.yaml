abstract:
- content: '<p>The YANG "anydata" statement carries data whose data model is not known
    when the module is designed. This document defines the context that is needed
    to validate such content: the schema context, the "anydata" node, a schema anchor,
    and the datastore. It describes how this context is obtained for the uses of "anydata"
    in IETF YANG modules, how the schema node of each node in the content is found,
    and which YANG constraints are checked.</p>'

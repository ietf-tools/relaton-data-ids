abstract:
- content: "<p>The DAWN Minimum Discoverable Information (MDI) information model [I-D.cui-dawn-mdi-model]
    defines a small, encoding-neutral common header -- three mandatory elements, a
    short set of recommended and optional elements, and the minimal constraints among
    them. In parallel, local-discovery work [I-D.jakab-dawn-agent-discovery-mdns]
    [I-D.blwm-dawn-common-discovery-parameters] has converged on a single-DNS-SD-service-type
    model in which one generic service type carries instances of every agent protocol,
    distinguished by a protocol key, with one instance per protocol and a descriptor
    reference pointing to richer metadata. This document generalizes the MDI information
    model so that the same minimal header describes any DAWN entity. In the context
    of DAWN, entities include, but are not limited to, AI agents and AI resources
    [I-D.farrel-dawn-terminology]. An AI resource may be an individual named agent
    or a service such as a catalog that will further the discovery process, and the
    model is designed to extend cleanly to tools, tasks, data sources, models, workloads,
    brokers, and application endpoints. The generalization reuses the existing agent
    MDI without change: the element set, the constraints, and the DNS-SD binding are
    inherited, and extension is achieved by opening the value space of one element
    (entity type) and by per-type profiles, not by new core elements. Clients discover
    agents, MCP servers, LLM API services, and future entity types with a single browse;
    operators manage one service type.</p>"

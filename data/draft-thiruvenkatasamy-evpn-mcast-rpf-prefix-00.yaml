abstract:
- content: "<p>This document defines a new EVPN route type for advertising multicast
    source-prefix reachability information within an EVPN network. The route enables
    Reverse Path Forwarding (RPF) resolution for multicast traffic independently of
    the unicast routing topology, addressing the operational requirement for non-congruent
    unicast and multicast forwarding paths in tenant multicast deployments. The proposed
    route type allows an EVPN PE to advertise source-prefix reachability for multicast
    RPF, learned through a multicast-specific routing protocol (e.g., BGP using the
    Multicast Address Family) or configured locally through policy or static multicast
    routes.</p>"

abstract:
- content: "<p>This document specifies the Social Architecture Diagnostic Profile
    (SADP), a JSON-based format for exchanging diagnostic descriptions of socio-technical
    environments. A profile records the object under review, the evidence used, the
    diagnostic dimensions applied, identified breaks or tensions, limitations, confidence
    levels, and human-review requirements. The format is intended for research tools,
    educational systems, expert-review workflows, case repositories, and other systems
    that need portable and inspectable diagnostic descriptions. This document does
    not define a scoring standard, certification procedure, legal assessment process,
    psychological assessment process, or automated consequential decision process.</p>"

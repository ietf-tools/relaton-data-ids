abstract:
- content: "<p>This document specifies a Standards Track YANG 1.1 data model (ietf-
    detnet-preof-loss-matrix) for reporting pre-elimination correlated packet delivery
    and co-failure outcomes across Deterministic Networking (DetNet) Packet Replication,
    Ordering, and Elimination Functions (PREOF). Against a closed source-declared
    packet population, the model classifies each original sequence number across paired
    replication branches into a 16-cell joint outcome matrix ({on- time, late, missing,
    indeterminate} x {Branch A, Branch B}) and four fate-sharing summary buckets (delivered-both,
    delivered-a-only, delivered-b-only, lost-both), enabling operators to distinguish
    masked single-branch drops from correlated dual-branch failures.</p>"

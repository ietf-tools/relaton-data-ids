abstract:
- content: "<p>This document modifies the deployment guidance provided in Section
    3.1 of RFC 6052 (IPv6 Addressing of IPv4/IPv6 Translators) that IPv4/IPv6 Translators
    must not use the Well-Known Prefix 64:ff9b::/96 to represent non-globally reachable
    IPv4 addresses, such as those defined in RFC 1918 (Address Allocation for Private
    Internets) or listed in Section 2.2.2 of RFC 6890 (Special-Purpose IP Address
    Registries). This change enables IPv6-only nodes to reach IPv4-only services with
    specific non-globally reachable addresses by leveraging the Well-Known Prefix.
    This document updates RFC 6052 to allow packets in which an address is composed
    of the Well-Known Prefix and specific non-globally reachable IPv4 addresses to
    be translated.</p>"

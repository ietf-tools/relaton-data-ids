abstract:
- content: "<p>This document discusses suitable post-quantum (PQ) signature algorithms
    for DomainKeys Identified Mail (DKIM). Because DKIM signatures are carried in
    emails, and public keys in DNS TXT records the usage of already standardized algorithms
    is limited. For compatibility reasons, signers that want post-quantum security
    are expected to add a PQ signature to a message in addition to a traditional signature,
    using separate DKIM-Signature header fields. The existing RSA and Ed25519 algorithms
    remain unchanged.</p>"

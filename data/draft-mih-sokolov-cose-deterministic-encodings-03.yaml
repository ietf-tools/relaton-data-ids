abstract:
- content: "<p>A COSE Hash Envelope signs the digest of a preimage, not the preimage
    itself. When the preimage is the encoding of a structured value, such as a CBOR
    data item, and a verifier holds that value but not the bytes that were hashed,
    the verifier has to encode the value again, and the digest matches only if it
    applies the same deterministic encoding as the producer. CBOR permits more than
    one encoding of the same data item, and the preimage content type does not identify
    the encoding that was applied. This document defines a COSE Hash Envelope protected-header
    parameter that identifies the encoding: the integer 1 for the Core Deterministic
    Encoding Requirements of RFC 8949, or a URL for any other encoding, named by the
    application profile that uses the parameter. A verifier ignores a value that does
    not identify an encoding it implements.</p>"

abstract:
- content: "<p>The Agent Enrollment Protocol (AEP) defines an HTTP-based mechanism
    for autonomous agents to discover service enrollment requirements, enroll an agent
    identity, obtain optional session credentials, revoke those credentials, and query
    enrollment status. AEP uses Decentralized Identifiers, client assertion JWTs,
    and HTTP Problem Details to provide a narrow machine-first enrollment and authentication
    substrate for agent-to-service interactions.</p>"

abstract:
- content: "<p>In times of armed conflict, the emblems recognized under International
    Humanitarian Law (IHL), such as the red cross, red crescent, and red crystal,
    are used to mark physical assets. This enables, e.g., the military to identify
    assets that enjoy specific protections under IHL during their operations. This
    draft specifies the message format and authorization model for a digital emblem,
    which signals that network-connected services enjoy specific protections under
    IHL.</p>"

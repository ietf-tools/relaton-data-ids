abstract:
- content: "<p>This document defines IP Flow Information Export (IPFIX) Information
    Elements and a forwardingStatus (IE 89, Status 10b: Dropped) sub- reason code
    for attributing packet discards caused by explicit residence-time or delivery-deadline
    budget expiration in bounded- latency data-center and deterministic networks.
    The specification standardizes primary-cause precedence over competing drop policies,
    clock-uncertainty comparison invariants, zero-count interval uncertainty encoding,
    and deterministic mapping to the IETF device packet-discard reporting model.</p>"

abstract:
- content: "<p>In situ Operations, Administration, and Maintenance (IOAM), defined
    in RFC 9197, collects operational and telemetry information in the packet using
    IOAM data fields while the packet traverses a path between two points in the network.
    Several IOAM Option-Types are available, for example, Pre-allocated Trace, Proof-of-Transit,
    Edge- to-Edge, and Incremental Trace, that can be used to collect information
    for calculating various performance metrics. RFC 9326 defines the IOAM Direct
    Export (IOAM-DEX) Option-Type in which the operational state and telemetry information
    are collected according to the specified profile and exported in a manner and
    format defined by a local policy on each node along the path. MPLS Network Actions
    (MNA) techniques indicate actions to be performed on any combination of Label
    Switched Paths, MPLS packets, and the node itself, and to transport data needed
    for these actions. This document employs the MNA mechanisms to collect and transport
    the operational state and telemetry information using IOAM data fields as well
    as Direct Export.</p>"

abstract:
- content: "<p>A Network Digital Twin (NDT) provides a network emulation tool usable
    for different purposes such as scenario planning, impact analysis, and change
    management. Agentic AI enables dynamic goal-driven execution and adaptive behavior
    and closed-loop autonomy. By integrating a NDT into network management together
    with the Agentic AI, it allows the network management activities to take user
    intent or service requirements as input, automatically assess, model, and refine
    optimization strategies under realistic conditions but in a risk-free environment.
    Such environment that operates to meet these types of requirements is said to
    have AI-driven network operations. AI-driven network operations brings together
    existing technologies such as Agentic AI and NDT which may be seen as the use
    of a toolbox of existing components enhanced with a few new elements. This document
    describes an architecture for AI-driven network operations and shows how these
    components work together with NDT and Agentic AI capabilities.</p>"

abstract:
- content: "<p>Long-running autonomous AI agents periodically summarize, compact,
    and distill episodic interaction logs into persistent vector or graph memory stores.
    Lossy context compaction erases the cryptographic provenance of which source documents
    contributed to a compacted memory state, stripping enterprise sensitivity labels
    (DLP classifications) and making regulatory data-erasure mandates (GDPR Article
    17 Right to Erasure / CCPA purge) impossible to verify. This document specifies
    the Ephemeral Context Compaction Receipt (ECCR) protocol: a Merkle inclusion and
    label-ceiling receipt that preserves deterministic sensitivity inheritance and
    cryptographic purge verifiability across lossy memory compaction boundaries.</p>"

abstract:
- content: "<p>This document defines how a set of devices owned by a common user synchronize
    a Personal Address Book (PAB) over MOQT. The address book maps identities to human-readable
    names and contact information, enabling users to maintain a trusted contact list
    that is consistent across all their devices.</p>"

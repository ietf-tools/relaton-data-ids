abstract:
- content: "<p>This document provides a set of test vectors for the WIMSE Workload-
    to-Workload Authentication protocol based on HTTP Message Signatures, as specified
    in draft-ietf-wimse-http-signature. The collection comprises six positive test
    cases, twenty-three negative test cases each mapped to a specific normative requirement
    of that specification, and three documented observations. All key material is
    test-only and fully published in this document, so that every vector can be recomputed
    independently. This document defines no new protocol behavior.</p>"

abstract:
- content: "<p>This document specifies AID-1, a provider-independent architecture
    for representing and verifying cryptographically bindable identity, delegation,
    authorization, action evidence, execution attestation, provenance, and governance
    information associated with AI systems and AI-mediated actions. AID-1 intentionally
    separates signature validity, identity binding, authority, execution evidence,
    provenance, and downstream admissibility. The specification defines trust domains,
    signed envelopes, external key resolution, delegation credentials, authorization
    decisions, temporal and revocation checks, replay protection, typed provenance
    claims, and a deterministic verification order with ALLOW, DENY, and INDETERMINATE
    outcomes.</p>"

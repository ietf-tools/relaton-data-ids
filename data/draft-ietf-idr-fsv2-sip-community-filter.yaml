abstract:
- content: "<p>BGP Flow Specification Version 2 (FSv2) propagates traffic Flow Specifications
    and Traffic Filtering Actions using an extensible TLV- based filter family architecture.
    This document specifies a new FSv2 component type under the Routing Filter Family
    to support community- level filtering within a single administrative domain. The
    match condition filters traffic based on the BGP Community attributes associated
    with the route matching the packet's source IP address.</p>"

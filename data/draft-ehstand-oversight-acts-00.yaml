abstract:
- content: "<p>Records produced by automated and agentic systems often represent human
    oversight as a single, undifferentiated event, such as an approval flag or a confirmation.
    Such a record does not say whether the person was shown an output, determined
    whether a named property of it holds, chose a course of action, or permitted an
    action, and consumers of the record may treat a confirmation click as if it were
    a check. This document defines terms for four kinds of human oversight act (observation,
    check, decision, and release) and for related concepts: the oversight act and
    the overseer, the named property, standing authority, the oversight record, the
    undifferentiated approval, the check step, error detectability, the fail-open
    check step, and the check test. It states what a record of each kind of act is,
    and is not, evidence of, and relates the terms to existing vocabularies. The document
    defines terminology only. It specifies no protocol, data format, procedure, or
    measurement method.</p>"

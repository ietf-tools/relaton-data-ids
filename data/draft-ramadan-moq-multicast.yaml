abstract:
- content: "<p>This document specifies multicast delivery mechanisms and catalog-
    based endpoint discovery for Media over QUIC (MoQ). It defines how MoQ sessions
    integrate with IP multicast (SSM, ASM), Automatic Multicast Tunneling (AMT), and
    TreeDN for scalable live streaming. The specification includes a multicast catalog
    extension for endpoint discovery and multi-path delivery across TV, mobile, and
    browser platforms. All multicast media delivery uses MPEG Media Transport Protocol
    (MMTP) packets, the same packet format that MoQ objects carry on QUIC streams.
    A manifest-based content-authentication profile protects multicast delivery with
    signed manifest records that travel in band beside those packets.</p>"

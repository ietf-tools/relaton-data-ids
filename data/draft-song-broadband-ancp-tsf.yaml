abstract:
- content: "<p>This document specifies a Traffic Steering Function (TSF) capability
    extension to the Access Node Control Protocol (ANCP), to discover and manage disaggregated
    user-plane (UP) functions in control/user plane separated networks, including
    the Access Network User Plane (AN-UP) and the Network Access Server User Plane
    (NAS-UP).</p>"

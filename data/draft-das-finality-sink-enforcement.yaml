abstract:
- content: "<p>An AI action can be approved correctly and still go somewhere else.
    Assistants such as Apple Siri acting through App Intents and Google Gemini on
    Android, AI coding agents, browser and computer-use agents, enterprise copilots,
    and third-party automation on iOS, iPadOS, macOS, Android, Windows, Linux, and
    cloud platforms can reach the same effect through another network route, file
    interface, privileged inter-process service, direct API credential, hardware command
    queue, or sandbox exit. Prompt injection, stale human approvals, a swapped window
    or user-interface target, and forged observations can also make the approved tool
    action differ from the payment, export, publication, resource change, or device
    command that actually happens. This document, Part 4 of a twelve-part series,
    specifies the enforcement point of execution finality: the Finality Sink. The
    sink independently reconstructs the actual pending operation where the effect
    occurs, rather than trusting the agent's description, and either consumes operation-scoped
    authority once under protected state or refuses. The document covers discovery
    of every effect-capable path, the difference between observing an effect and blocking
    it, runtime enforcement-coverage epochs, privilege transitions from sandbox to
    real resource, authenticated computer-use and human- approval state, and replay
    and snapshot-rollback resistance. Reference algorithms, six threat models, and
    twenty reproducible positive and negative tests, including an Android-to-iOS case,
    are included. Part 1 of the series defines the shared terminology and common workflows.
    The document treats existing IETF mechanisms as qualified inputs to sink-local
    decisions rather than final authority: OAuth 2.0 Rich Authorization Requests and
    Demonstrating Proof of Possession (DPoP); Workload Identity in Multi-System Environments
    (WIMSE); Remote ATtestation procedureS (RATS); CBOR Object Signing and Encryption
    (COSE); Authentication and Authorization for Constrained Environments (ACE); Supply
    Chain Integrity, Transparency, and Trust (SCITT); and HTTP preconditions and redirect
    semantics. It identifies discussion points for these groups and for Security Area
    dispatch, without claiming working-group adoption or IETF consensus. Industry
    alignment covers Apple iOS, iPadOS, and macOS with Siri, App Intents, and desktop
    sandboxing; Google Android with Binder and intents; Google Gemini and agent gateways;
    Samsung Bixby and Microsoft Copilot; Microsoft Windows and Azure agent containers;
    computer-use and coding agents from OpenAI, Anthropic, and Meta; NVIDIA, Qualcomm,
    Arm, and Huawei hardware; banking and payments; cloud API gateways and SaaS; and
    telecommunications, IoT, and robotics. Product names are illustrative and imply
    no endorsement or implementation by any vendor. For the EU Artificial Intelligence
    Act (Regulation (EU) 2024/1689), sink-side enforcement that cannot be bypassed
    through alternate paths can help providers and deployers address robustness and
    cybersecurity, human-oversight, risk- management, and record-keeping requirements
    where those obligations apply; this is a technical mapping, not a conformity claim
    or legal advice.</p>"
